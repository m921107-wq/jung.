async function loadStorage(){
  try{
    const r1 = await window.storage.get('jk4');
    const r2 = await window.storage.get('jk4cv');
    const r3 = await window.storage.get('jk4chck');
    const r4 = await window.storage.get('jk4freq');
    const r5 = await window.storage.get('jk4we');
    const r6 = await window.storage.get('jk4wc');
    if(r1){ Object.assign(ST,   JSON.parse(r1.value||'{}')); }
    if(r2){ Object.assign(CVD,  JSON.parse(r2.value||'{}')); }
    if(r3){ Object.assign(CHCK, JSON.parse(r3.value||'{}')); }
    if(r4){ Object.assign(FREQ, JSON.parse(r4.value||'{}')); }
    if(r5){ Object.assign(WRONG_EVER,  JSON.parse(r5.value||'{}')); }
    if(r6){ Object.assign(WRONG_COUNT, JSON.parse(r6.value||'{}')); }
  } catch(e){
    try{
      const s1=localStorage.getItem('jk4');
      const s2=localStorage.getItem('jk4cv');
      const s3=localStorage.getItem('jk4chck');
      const s4=localStorage.getItem('jk4freq');
      const s5=localStorage.getItem('jk4we');
      const s6=localStorage.getItem('jk4wc');
      if(s1) Object.assign(ST,   JSON.parse(s1));
      if(s2) Object.assign(CVD,  JSON.parse(s2));
      if(s3) Object.assign(CHCK, JSON.parse(s3));
      if(s4) Object.assign(FREQ, JSON.parse(s4));
      if(s5) Object.assign(WRONG_EVER,  JSON.parse(s5));
      if(s6) Object.assign(WRONG_COUNT, JSON.parse(s6));
    } catch(_){}
  }
  // 마이그레이션: 기존 데이터 중 오답인데 WRONG_EVER가 없는 경우 채워넣기
  let migrated=false;
  Object.keys(ST).forEach(id=>{
    const st=ST[id];
    if(st?.sub && st.sel && !WRONG_EVER[id]){
      // 정답 여부는 문제 데이터를 조회해야 하므로 findQById 사용
      const q=findQById(id);
      if(q && st.sel!==q.answer){
        WRONG_EVER[id]=true;
        WRONG_COUNT[id]=WRONG_COUNT[id]||1;
        migrated=true;
      }
    }
  });
  if(migrated) saveWrongEver();
  _storageReady = true;
  renderQs();
}

function findQById(id){
  for(const s of ['재무회계','세무회계','원가관리회계']){
    const sd=DATA[s]||{};
    for(const ch of Object.keys(sd)){
      const found=(sd[ch]||[]).find(q=>qid(q)===id);
      if(found) return found;
    }
  }
  return null;
}

function subjOfQid(id){
  for(const s of ['재무회계','세무회계','원가관리회계']){
    const sd=DATA[s]||{};
    for(const ch of Object.keys(sd)){
      if((sd[ch]||[]).some(q=>qid(q)===id)) return s;
    }
  }
  return null;
}

function getQs(){
  if(curS_freq){
    let all=[];
    ['재무회계','세무회계','원가관리회계'].forEach(s=>{
      Object.values(DATA[s]||{}).forEach(qs=>all.push(...qs));
    });
    let res=all.filter(q=>FREQ[qid(q)]).filter(q=>curY==='all'||q.year===curY);
    if(curWrongCh) res=res.filter(q=>{
      const sd=DATA[curWrongCh.subj]||{};
      return (sd[curWrongCh.ch]||[]).some(qq=>qid(qq)===qid(q));
    });
    return res;
  }
  if(curS_wrong){
    let all=[];
    ['재무회계','세무회계','원가관리회계'].forEach(s=>{
      Object.values(DATA[s]||{}).forEach(qs=>all.push(...qs));
    });
    let res=all.filter(q=>WRONG_EVER[qid(q)])
               .filter(q=>curY==='all'||q.year===curY);
    if(curWrongCh) res=res.filter(q=>{
      const sd=DATA[curWrongCh.subj]||{};
      return (sd[curWrongCh.ch]||[]).some(qq=>qid(qq)===qid(q));
    });
    return res;
  }
  if(srchQ){
    let all=[]; Object.values(DATA[curS]||{}).forEach(qs=>all.push(...qs));
    return all.filter(q=>q.text.includes(srchQ));
  }
  if(!curS||!curC) return null;
  return (DATA[curS]?.[curC]||[]).filter(q=>curY==='all'||q.year===curY);
}

function renderQs(){
  const wrap=document.getElementById('qscroll');
  const tag=curS?STAG[curS]:'fin', clr=curS?SCLR[curS]:'#1a73e8';
  const all=getQs();
  if(all===null){
    wrap.innerHTML='<div class="empty"><div class="empty-icon">👈</div>챕터를 선택하세요</div>';
    document.getElementById('prog').classList.remove('on');
    document.getElementById('ch-ttl').textContent='챕터를 선택하세요';
    return;
  }
  const _wrongLabel = curWrongCh
    ? `${curWrongCh.subj} › ${curWrongCh.ch.replace(/^\d+_/,'')}`
    : curS_freq ? '🔴 자주 틀리는 문제 (전체)' : '❌ 오답 (전체)';
  const nm=(curS_freq||curS_wrong)?_wrongLabel:srchQ?`🔍 "${srchQ}"`:curC?curC.replace(/^\d+_/,''):'';

  document.getElementById('ch-ttl').textContent=nm;

  let show=all;
  if(curF==='done')  show=all.filter(q=>ST[qid(q)]?.sub);
  if(curF==='todo')  show=all.filter(q=>!ST[qid(q)]?.sub);
  if(curF==='wrong') show=all.filter(q=>WRONG_EVER[qid(q)]);

  updProg(all,clr);

  const emptyMsg={done:'아직 완료한 문제가 없어요',todo:'모든 문제를 완료했어요!',wrong:'오답이 없어요 🎉',freq:'자주 틀리는 문제가 없어요 🎉',all:'문제가 없어요'};
  const emptyIcon={done:'📝',todo:'🎉',wrong:'✅',freq:'🏆',all:'📭'};
  if(!show.length){
    wrap.innerHTML=`<div class="empty"><div class="empty-icon">${emptyIcon[curF]||'📭'}</div>${emptyMsg[curF]||''}</div>`;
    return;
  }

  // 오답/자주틀림 탭에서는 챕터별 그룹 헤더 삽입
  if((curS_wrong || curS_freq) && !curWrongCh){
    // 문제→챕터 역맵 구축
    const qChMap={};
    ['재무회계','세무회계','원가관리회계'].forEach(s=>{
      const sd=DATA[s]||{};
      Object.keys(sd).forEach(ch=>{
        sd[ch].forEach(q=>{ qChMap[qid(q)]={subj:s,ch,nm:ch.replace(/^\d+_/,'')}; });
      });
    });
    const SCLR_MAP={'재무회계':'#1a73e8','세무회계':'#1e8e3e','원가관리회계':'#e37400'};
    let html='';
    let lastKey='';
    show.forEach(q=>{
      const id=qid(q);
      const info=qChMap[id]||{subj:'',nm:''};
      const groupKey=info.subj+'__'+info.ch;
      if(groupKey!==lastKey){
        const col=SCLR_MAP[info.subj]||'#888';
        html+=`<div class="ch-group-header" style="color:${col}">
          ${info.subj} <span class="ch-group-sub">› ${info.nm}</span>
        </div>`;
        lastKey=groupKey;
      }
      html+=cardHTML(q,STAG[info.subj]||tag,SCLR_MAP[info.subj]||clr,true);
    });
    wrap.innerHTML = html + akHTML(all,tag,clr);
  } else {
    // 챕터 선택 상태이거나 일반 뷰
    const _tag2 = (curS_wrong||curS_freq)&&curWrongCh ? (STAG[curWrongCh.subj]||tag) : tag;
    const _clr2 = (curS_wrong||curS_freq)&&curWrongCh ? ({'재무회계':'#1a73e8','세무회계':'#1e8e3e','원가관리회계':'#e37400'}[curWrongCh.subj]||clr) : clr;
    const _practice2 = !!(curS_wrong||curS_freq);
    wrap.innerHTML = show.map(q=>cardHTML(q,_tag2,_clr2,_practice2)).join('') + akHTML(all,_tag2,_clr2);
  }

  // 카드 초기화 (선택지 텍스트 채우기 + 상태 복원)
  if((curS_wrong || curS_freq) && !curWrongCh){
    const qChMapInit={};
    ['재무회계','세무회계','원가관리회계'].forEach(s=>{
      const sd=DATA[s]||{};
      Object.keys(sd).forEach(ch=>{ sd[ch].forEach(q=>{ qChMapInit[qid(q)]=STAG[s]||tag; }); });
    });
    show.forEach(q=>initCard(q, qChMapInit[qid(q)]||tag, true));
  } else if((curS_wrong||curS_freq) && curWrongCh){
    show.forEach(q=>initCard(q, STAG[curWrongCh.subj]||tag, true));
  } else {
    show.forEach(q=>initCard(q,tag));
  }
}

function initCard(q,tag,blankMode){
  const id=qid(q), st=blankMode?{}:(ST[id]||{});
  // 선택지 파싱
  const choices=parseChoices(q.text);
  const chWrap=document.getElementById('CH'+id);
  if(chWrap){
    chWrap.innerHTML=choices.map((txt,i)=>`
      <button class="choice${st.sel===i+1?' sel':''}" id="cho${id}_${i+1}"
        onclick="selChoice('${id}',${i+1},${q.answer})">
        <span class="cnum">${CIRC[i]}</span>
        <span>${escH(txt)}</span>
      </button>`).join('');
  }
  // 채점 버튼 상태
  const sbtn=document.getElementById('S'+id);
  if(sbtn) sbtn.disabled=!st.sel;
  // 채점 결과 복원 (blankMode면 복원 안 함 - 오답 재풀이는 항상 깨끗하게 시작)
  if(st.sub) applyGrade(id, st.sel, q.answer, false);
  // 캔버스 초기화
  initCv(id);
}

function parseChoices(text){
  // ①②③④ 기준으로 파싱
  const pos=[];
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='①'||c==='②'||c==='③'||c==='④') pos.push(i);
  }
  if(pos.length<2) return ['선택지 1','선택지 2','선택지 3','선택지 4'];
  const result=[];
  for(let i=0;i<Math.min(4,pos.length);i++){
    const s=pos[i]+1;
    const e=i+1<pos.length?pos[i+1]:text.length;
    result.push(text.slice(s,e).replace(/\n/g,' ').trim());
  }
  while(result.length<4) result.push('');
  return result.slice(0,4);
}

function selChoice(id, n, answer){
  const st=ST[id]||{};
  const card=document.getElementById('C'+id);
  const practice = card?.dataset.practice === '1';
  if(st.sub && !practice) return;
  st.sel=(st.sel===n)?null:n;
  ST[id]=st; saveST();
  // 선택지 UI 업데이트
  [1,2,3,4].forEach(i=>{
    const el=document.getElementById(`cho${id}_${i}`);
    if(!el) return;
    el.className='choice'+(i===st.sel?' sel':'');
  });
  const sbtn=document.getElementById('S'+id);
  if(sbtn) sbtn.disabled=!st.sel;
}

function submit(id, answer){
  const st=ST[id]||{}; if(!st.sel) return;
  const wrong = (st.sel !== answer);
  const wasWrongBefore = !!WRONG_EVER[id]; // 이전에 한 번이라도 틀린 적 있는지
  st.sub=true;
  // 풀이 날짜 저장
  const now=new Date();
  st.date=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  ST[id]=st; saveST();
  applyGrade(id, st.sel, answer, true);
  updProgNow();

  if(wrong){
    // 오답 영구 기록 + 카운트 증가
    WRONG_EVER[id]=true;
    WRONG_COUNT[id]=(WRONG_COUNT[id]||0)+1;
    saveWrongEver();
    // 2번째 이상 틀리면 자동으로 자주 틀리는 문제 등록
    if(WRONG_COUNT[id] >= 2 && !FREQ[id]){
      FREQ[id] = true;
      saveFreq();
      const card = document.getElementById('C'+id);
      if(card && !card.querySelector('.freq-badge')){
        const badge = document.createElement('div');
        badge.className = 'freq-badge';
        badge.textContent = '🔴 자주 틀리는 문제';
        card.appendChild(badge);
      }
    }
    // 오답 탭 목차 갱신 (열려 있으면)
    if(curS_wrong || curS_freq) renderWrongToc();
  } else if(wasWrongBefore){
    // 재도전 성공 → 카드에 성공 뱃지 표시
    const card = document.getElementById('C'+id);
    if(card){
      let ok = card.querySelector('.retry-ok-badge');
      if(!ok){
        ok = document.createElement('div');
        ok.className = 'retry-ok-badge';
        card.appendChild(ok);
      }
      ok.innerHTML = `✅ 재도전 성공 <button class="retry-clear-btn" onclick="clearWrongEver('${id}',event)">목록에서 제거</button>`;
    }
  }
}

function clearWrongEver(id, ev){
  if(ev) ev.stopPropagation();
  delete WRONG_EVER[id];
  delete WRONG_COUNT[id];
  delete FREQ[id];
  saveWrongEver(); saveFreq();
  renderWrongToc();
  renderQs();
}

function applyGrade(id, sel, answer, animate){
  const ok=(sel===answer);
  const card=document.getElementById('C'+id);
  if(!card) return;
  card.className='qcard '+(ok?'ok':'ng');
  // 선택지 색칠
  [1,2,3,4].forEach(i=>{
    const el=document.getElementById(`cho${id}_${i}`);
    if(!el) return;
    el.disabled=true;
    if(i===answer) el.className='choice c-ok';
    else if(i===sel&&!ok) el.className='choice c-ng';
    else el.className='choice';
  });
  // 채점 마크
  const gm=document.getElementById('GM'+id);
  if(gm){
    gm.className='gmark '+(ok?'ok':'ng');
    gm.textContent=ok?'○':'✕';
  }
  const sbtn=document.getElementById('S'+id);
  if(sbtn) sbtn.disabled=true;
}

function revAns(id, answer){
  const box=document.getElementById('A'+id);
  if(box) box.classList.toggle('on');
}

function resetCard(id){
  delete ST[id]; saveST();
  delete CVD[id]; saveCVD();
  const all=getQs(); if(!all) return;
  const q=all.find(q=>qid(q)===id); if(!q) return;
  let tag=STAG[curS], clr=SCLR[curS];
  if(curS_wrong || curS_freq){
    const subj = subjOfQid(id);
    if(subj){ tag = STAG[subj]; clr = SCLR[subj]; }
  }
  const card=document.getElementById('C'+id);
  if(card){
    const practice = curS_wrong || curS_freq;
    card.outerHTML=cardHTML(q,tag,clr,practice);
    initCard(q,tag,practice);
    updProgNow();
  }
}

// ── 진행률 ──
function updProg(all, clr){
  const pg=document.getElementById('prog');
  if(!all||!all.length){pg.classList.remove('on');return;}
  pg.classList.add('on');
  const done=all.filter(q=>ST[qid(q)]?.sub).length;
  const corr=all.filter(q=>{const s=ST[qid(q)];return s?.sub&&s?.sel===q.answer;}).length;
  const pct=done?Math.round(done/all.length*100):0;
  document.getElementById('prog-b').style.cssText=`width:${pct}%;background:${clr}`;
  document.getElementById('prog-t').textContent=`${done}/${all.length}문항 완료`;
  document.getElementById('score-t').style.color=clr;
  document.getElementById('score-t').textContent=done?`정답 ${corr}/${done} (${Math.round(corr/done*100)}%)`:'';
}
function updProgNow(){
  const all=getQs(); if(!all) return;
  updProg(all, SCLR[curS]||'#1a73e8');
}

// ── 정답 섹션 ──
function akHTML(qs,tag,clr){
  const rows=qs.map(q=>{
    const s=ST[qid(q)]||{};
    const mk=s.sub?(s.sel===q.answer?'<span style="color:var(--grn);font-size:16px;">○</span>':'<span style="color:var(--red);font-size:16px;font-weight:900;">✕</span>'):'';
    return `<tr><td>${q.year}년 ${q.month}월</td><td>${q.qnum}번</td>
      <td class="akn" style="color:${clr}">${q.answer}번</td><td>${mk}</td></tr>`;
  }).join('');
  return `<div id="ak"><div class="ak-h" style="background:${clr}">📋 정답 모음 (${qs.length}문항)</div>
    <table class="akt"><tr><th>출처</th><th>문제</th><th>정답</th><th>내결과</th></tr>${rows}</table></div>`;
}

// ── 캔버스 ──
function initCv(id){
  const cv=document.getElementById('V'+id);
  if(!cv) return;
  requestAnimationFrame(()=>{
    const body=document.getElementById('B'+id);
    if(!body) return;
    const r=body.getBoundingClientRect();
    cv.width=Math.max(r.width,200); cv.height=Math.max(r.height,100);
    const saved=CVD[id];
    if(saved){const img=new Image();img.onload=()=>cv.getContext('2d').drawImage(img,0,0);img.src=saved;}
    if(penOn) cv.classList.add('on');
  });
}

function togglePen(){
  penOn=!penOn;
  document.getElementById('pen-btn').classList.toggle('on',penOn);
  document.getElementById('pen-tb').classList.toggle('on',penOn);
  document.querySelectorAll('.draw-cv').forEach(cv=>cv.classList.toggle('on',penOn));
}
function setPenClr(c,btn){
  penClr=c; eraserOn=false;
  document.querySelectorAll('.pc-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('er-btn').classList.remove('on');
}
function setPenSz(s,btn){
  penSz=s;
  document.querySelectorAll('.ps-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function toggleEraser(){
  eraserOn=!eraserOn;
  document.getElementById('er-btn').classList.toggle('on',eraserOn);
}
function clearCvs(){
  document.querySelectorAll('.draw-cv').forEach(cv=>{
    const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
    const id=cv.id.slice(1); delete CVD[id];
  });
  saveCVD();
}

// 포인터 이벤트
document.addEventListener('pointerdown',e=>{
  const cv=e.target.closest('.draw-cv');
  if(!cv||!cv.classList.contains('on')) return;
  e.preventDefault(); drawing=true;
  const r=cv.getBoundingClientRect(); lx=e.clientX-r.left; ly=e.clientY-r.top;
},{passive:false});

document.addEventListener('pointermove',e=>{
  if(!drawing) return;
  const cv=e.target.closest('.draw-cv');
  if(!cv||!cv.classList.contains('on')) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const ctx=cv.getContext('2d');
  ctx.beginPath();
  if(eraserOn){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=penSz*6;}
  else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=penClr;ctx.lineWidth=penSz;}
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
  lx=x;ly=y;
  clearTimeout(cv._t);
  cv._t=setTimeout(()=>{
    const id=cv.id.slice(1); CVD[id]=cv.toDataURL(); saveCVD();
  },500);
},{passive:false});

document.addEventListener('pointerup',()=>drawing=false);

// ── 유틸 ──
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── 초기화 ──
selSubj('재무회계');
// persistent storage에서 저장된 풀이 데이터 로드
loadStorage();
</script>
