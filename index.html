감가상각누계액을 차감한 금액으\n로 장부금액을 산정하며, 손상차손을 인식하지 않는다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 14, "text": "[14]제조업을 영위하는 ㈜삼일은 임대수익을 얻기 위한 목적으로 20X1년 1월 1일 건물을 100,000,000원에\n취득하였다. 투자부동산에 대해 원가모형을 적용할 경우 동 건물과 관련한 회계처리가 ㈜삼일의 20X2년\n당기순이익에 미치는 영향은 얼마인가(단, ㈜삼일은 내용연수 5년, 잔존가치 0원, 정액법을 적용하여\n감가상각한다)?\n<건물의 공정가치>\n20X1년 말 : 95,000,000원\n20X2년 말 : 90,000,000원\n① 5,000,000원 감소\n② 12,500,000원 감소\n③ 20,000,000원 감소\n④ 23,750,000원 감소", "answer": 3}, {"year": "2024", "month": "1", "qnum": 17, "text": "[17]다음 중 금융자산에 해당하지 않는 것은?\n① 다른 기업의 지분상품\n② 거래상대방에게 현금 등 금융자산을 인도하기로 한 계약상 의무\n③ 잠재적으로 유리한 조건으로 거래상대방과 금융자산이나 금융부채를 교환하기로 한 계약상 권리\n④ 기업이 자신의 지분상품으로 결제되거나 결제될 수 있는 계약으로서 수취할 자기지분상품의 수량이\n변동가능한 비파생상품", "answer": 2}, {"year": "2024", "month": "1", "qnum": 40, "text": "[40]아래에 제시된 ㈜삼일의 20X1년 재무제표 관련 자료만을 이용하여 현금흐름표에 보고될 영업에서 창출\n된 현금을 계산하면 얼마인가?\n당기순이익 50,000원 감가상각비 2,500원\n법인세비용 10,000원 미지급법인세의 증가 50,000원\n유형자산처분손실 1,800원 매출채권의 감소 15,000원\n재고자산의 증가 10,000원 매입채무의 감소 22,000원\n① 37,300원\n② 39,300원\n③ 42,500원\n④ 47,300원\n\n< 세무회계 >", "answer": 4}, {"year": "2024", "month": "3", "qnum": 9, "text": "[9]㈜삼일은 20×1년 7월 1일 취득원가 1,000,000원의 기계장치를 취득하면서, 자산취득에 따른 보조금\n으로 20×1년 7월 1일 정부로부터 보조금 200,000원을 수령하였다. ㈜삼일은 동 기계장치의 내용연수\n와 잔존가치를 각각 4년과 200,000원으로 추정하였으며, 정액법(월할상각)을 적용하여 감가상각한다.\n㈜삼일이 자산관련보조금을 관련 자산의 장부금액에서 차감하는 방법으로 회계처리할 경우, 20×1년말\n재무상태표에 표시될 기계장치의 순장부금액은 얼마인가?\n① 725,000원\n② 815,000원\n③ 846,000원\n④ 910,000원", "answer": 1}, {"year": "2024", "month": "3", "qnum": 10, "text": "[10]다음 중 유형자산의 후속측정에 관한 설명으로 옳지 않은 것은?\n① 원가모형과 재평가모형 중 하나를 회계정책으로 선택하여 유형자산의 유형별로 동일하게 적용하여야\n한다.\n② 재평가로 인하여 자산이 증가된 경우 원칙적으로 그 증가액은 기타포괄이익으로 인식하고 재평가잉\n여금의 과목으로 자본(기타포괄손익누계액)에 가산한다.\n③ 재평가로 인하여 자산이 감소된 경우 원칙적으로 그 감소액은 당기손실로 인식한다.\n④ 원칙적으로 당해 자산이 폐기되거나 제거될 때에는 해당 자산과 관련해서 자본(기타포괄손익누계액)\n에 계상된 재평가잉여금을 일괄적으로 당기손익으로 반영한다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 11, "text": "[11]다음 중 유형자산의 손상에 관한 설명으로 옳지 않은 것은?\n① 기업은 매 보고기간 말마다 자산손상을 시사하는 징후가 있는지를 검토하고 그러한 징후가 있다면\n당해 자산의 회수가능액을 추정하여 회수가능액이 장부금액에 미달하는 경우 손상차손을 인식한다.\n② 자산손상을 시사하는 징후가 있는지를 검토할 때는 외부정보와 내부정보를 모두 고려해야 한다.\n③ 자산의 회수가능액은 당해 자산의 순공정가치와 사용가치 중 작은 금액이다.\n④ 원가모형 적용시 손상차손환입으로 증가된 유형자산의 장부금액은 과거에 손상차손을 인식하기 전\n장부금액의 감가상각 후 잔액을 초과할 수 없다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 39, "text": "[39]다음은 ㈜삼일의 영업활동으로 인한 현금흐름을 계산하기 위한 자료이다. ㈜삼일의 당기순이익이\n5,000,000원이라고 할 때 영업활동으로 인한 현금흐름을 계산하면 얼마인가?\n유형자산처분이익 200,000원 매출채권의 증가 900,000원\n감가상각비 300,000원 재고자산의 감소 1,000,000원\n매입채무의 감소 500,000원\n① 4,700,000원\n② 4,900,000원\n③ 5,100,000원\n④ 5,300,000원", "answer": 1}, {"year": "2024", "month": "5", "qnum": 9, "text": "[9]다음 중 유형자산의 후속측정으로 원가모형을 적용하는 기업의 회계처리에 관한 설명으로 옳은 것은?\n① 토지와 건물을 일괄하여 취득하였다면 단일 자산으로 회계처리 하여야 한다.\n② 보유하고 있는 건물이 위치한 토지의 시장가치 증가는 건물의 감가상각대상금액에 영향을 미친다.\n③ 감가상각의 목적은 특정자산의 감가상각대상금액을 자산의 이용에 따라 효익이 발생하는 기간에 체계\n적이고 합리적인 방법으로 배분하는 것이다.\n④ 기업은 해당 자산에 내재되어 있는 미래경제적효익의 예상소비형태를 가장 잘 반영할 수 있는 상각방\n법을 선택하여 일관성 있게 적용하여야 하며 후속기간에 이를 변경할 수 없다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 10, "text": "[10]㈜삼일은 20X1년 초에 토지를 10,000원에 구입하였으며, 이 토지에 대해 재평가모형을 적용하여 매년\n말에 재평가하였다. 토지는 20X1년 말에 9,000원, 20X2년 말에 12,000원으로 각각 재평가되었다.\n20X2년 말에 시행한 토지의 재평가가 ㈜삼일의 20X2년 당기순이익에 미치는 영향은 얼마인가?\n① 영향 없음\n② 1,000 원 증가\n③ 2,000 원 증가\n④ 3,000 원 증가", "answer": 2}, {"year": "2024", "month": "5", "qnum": 11, "text": "[11]㈜삼일은 20X1년 1월 1일 임직원 연수동의 건설에 착공하였다. 회사가 20X1 년 중 동 연수동 신축과\n관련하여 지출한 금액과 차입금 현황은 다음과 같으며 완공까지는 약 3년이 소요될 예정이다. ㈜삼일이\n20X1 년에 자본화 할 차입원가는 얼마인가(단, 평균지출액과 이자는 월할계산한다)?\n지 출 일 지 출 액 비 고\n20X1년 1월 1일 10,000,000 원 공사착공\n20X1년 7월 1일 8,000,000 원\n20X1년 9월 1일 9,000,000 원\n차 입 처 차 입 일 차 입 금 연 이 자 율 용 도\nK 은행 20X1. 01. 01 8,000,000원 6 % 특정목적차입금\nS 은행 20X1. 09. 01 20,000,000원 9 % 일반목적차입금\n① 1,080,000원\n② 1,290,000원\n③ 1,600,000원\n④ 2,080,000원", "answer": 1}, {"year": "2024", "month": "5", "qnum": 13, "text": "[13]㈜삼일이 20X1년 초에 취득한 특허권 관련 자료는 다음과 같다. 특허권은 잔존가치 없이 정액법으로 상\n각한다. 20X2년 말 ㈜삼일의 특허권 장부금액과 관련 손상차손 금액을 계산하면 얼마인가?\n20X2년 말\n취득원가 내용연수\n순공정가치 사용가치\n500,000원 5년 260,000원 280,000원\n장부금액 손상차손\n① 300,000원 20,000원\n② 300,000원 0원\n③ 280,000원 20,000원\n④ 280,000원 0원", "answer": 3}, {"year": "2024", "month": "5", "qnum": 14, "text": "[14]㈜서울과 ㈜부산은 20X1년 초에 임대수익 및 시세차익 등을 목적으로 각각 건물 1동씩을 40억원에 매\n입하였다. 두 건물의 취득 당시 내용연수는 20년, 잔존가치는 없으며 20X1년 말 건물의 공정가치는 36\n억원으로 동일하다. ㈜서울과 ㈜부산의 유형자산 및 투자부동산의 평가방법은 다음과 같다.\n구 분 ㈜서울 ㈜부산\n유형자산 평가방법 원가모형 원가모형\n투자부동산 평가방법 원가모형 공정가치모형\n감가상각방법 정액법 정액법\n다음 중 상기 건물의 취득과 보유가 20X1 년 ㈜서울과 ㈜부산의 법인세비용차감전순이익에 미치는 영향\n에 관한 설명으로 옳은 것은(단, 손상사유는 발생하지 않은 것으로 가정한다)?\n① ㈜서울이 ㈜부산보다 법인세비용차감전순이익이 2억원 더 많이 계상된다.\n② ㈜서울이 ㈜부산보다 법인세비용차감전순이익이 2억원 더 적게 계상된다.\n③ ㈜서울이 ㈜부산보다 법인세비용차감전순이익이 4억원 더 많이 계상된다.\n④ ㈜서울과 ㈜부산의 법인세비용차감전순이익에 미치는 영향은 동일하다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 31, "text": "[31]㈜삼일은 20X1 년 1 월 1 일 기계장치(내용연수: 5 년, 잔존가치: 0 원, 정액법 상각)를 1,000,000 원\n에 취득하였다. ㈜삼일은 20X3 년 1 월 1 일 감가상각방법을 연수합계법으로 변경하였다. 이 변경이 정\n액법을 적용할 경우에 비하여 20X3 년 재무제표에 미치는 영향으로 옳지 않은 것은?\n① 투자활동현금흐름은 변동이 없다.\n② 부채비율은 증가한다.\n③ 당기순이익은 감소한다.\n④ 유형자산의 장부금액은 증가한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 9, "text": "[9]다음 중 유형자산의 취득원가에 포함되는 요소만 바르게 짝지은 것은?\nㄱ. 설치장소 준비를 위한 지출 ㄴ. 최초의 운송 및 취급관련 원가\nㄷ. 보유중인 건물에 대하여 부과되는 재산세 ㄹ. 취득시 부담한 관세 및 환급불가능한 세금\n① ㄱ, ㄴ\n② ㄱ, ㄴ, ㄷ\n③ ㄱ, ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ, ㄹ", "answer": 3}, {"year": "2024", "month": "6", "qnum": 10, "text": "[10]통신업을 영위하고 있는 ㈜삼일은 20X1년 7월 1일 5억원에 취득하여 사용해 오던 건물 A(내용연수 5\n년, 연수합계법 상각, 잔존가치 0원)를 20X4년 1월 1일 2억원에 처분하였다. 다음 중 ㈜삼일이 건물\nA 의 처분과 관련하여 20X4년 포괄손익계산서에 인식할 계정과 금액으로 가장 옳은 것은(단, ㈜삼일은\n건물을 원가모형으로 후속측정하며, 감가상각비는 월할 계산한다)?\n① 유형자산처분이익 25,000,000원\n② 유형자산처분이익 50,000,000원\n③ 유형자산처분손실 25,000,000원\n④ 유형자산처분손실 50,000,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 11, "text": "[11]다음 중 유형자산의 손상에 관한 설명으로 옳지 않은 것은?\n① 기업은 매 보고기간 말마다 자산손상을 시사하는 징후가 있는지를 검토하여야 한다.\n② 자산의 회수가능액은 사용가치와 순공정가치 중 큰 금액이다.\n③ 유형자산에 대해 재평가모형을 적용하는 경우에는 손상차손을 인식하지 아니한다.\n④ 자산손상을 시사하는 징후가 있는지를 검토할 때는 내부정보와 외부정보를 모두 고려한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 14, "text": "[14]㈜삼일은 20X1년 3월 1일에 임대수익을 얻을 목적으로 건물을 1,000,000원에 취득하여 공정가치 모형\n을 적용하여 회계처리하기로 하였다. ㈜삼일은 동 건물을 20X2년 10월 1일에 본사사옥으로 사용 목적\n을 변경하고, 즉시 사용하기 시작하였다. 동 건물의 20X1년 12월 31일과 20X2년 10월 1일의 공정가\n치는 각각 900,000원과 1,000,000원 이었으며, 유형자산으로 대체된 상기 건물에 대해서 ㈜삼일은 원\n가모형을 적용하기로 하였다. 20X2년 10월 1일 현재 동 건물의 잔존내용연수는 10년이고, 잔존가치는\n없는 것으로 추정하였다. 상기 건물에 대한 회계처리가 ㈜삼일의 20X2년 당기순이익에 미치는 영향은\n(단, 감가상각비의 계산이 필요한 경우 정액법을 적용하여 월할 계산하기로 한다)?\n① 당기순이익 90,000원 감소\n② 당기순이익 75,000원 감소\n③ 당기순이익 75,000원 증가\n④ 당기순이익 90,000원 증가", "answer": 3}, {"year": "2024", "month": "6", "qnum": 31, "text": "[31]㈜삼일은 20X1년 1월 1일에 취득한 기계장치 1,000,000원을 생산량비례법으로 상각하여 오던 중 20X3\n년 1월 1일에 정액법으로 감가상각방법을 변경하기로 하였다. 감가상각방법 변경 후 잔존내용연수가 4\n년이라고 한다면 ㈜삼일이 회계변경으로 인하여 20X3년 인식할 감가상각비는 얼마인가(잔존가치는 없다\n고 가정한다)?\n회계연도 20X1년 20X2년\n기계장치 감가상각비\n200,000원 160,000원\n(생산량비례법)\n① 80,000원\n② 128,000원\n③ 160,000원\n④ 200,000원", "answer": 3}, {"year": "2024", "month": "6", "qnum": 40, "text": "[40]다음은 ㈜삼일의 20X2년 말 비교재무상태표상에서 추출한 건물과 관련된 자료이다. 주어진 자료만을 이\n용하여 투자활동현금흐름을 계산하면 얼마인가?\n가. ㈜삼일의 20X2년 초 및 20X2년 말의 건물 장부금액은 각각 30,000원과 28,000원이다.\n나. ㈜삼일은 20X2년 중 보유중인 건물을 7,000원에 처분하면서, 유형자산처분이익 1,000원을 인식\n하였다.\n다. ㈜삼일이 20X2년 건물의 감가상각비로 인식한 금액은 5,000원이다.\n라. ㈜삼일의 20X2년 건물과 관련된 모든 거래는 현금으로 이루어졌다.\n① 1,000원 유입\n② 1,000원 유출\n③ 2,000원 유입\n④ 2,000원 유출\n\n< 세무회계 >", "answer": 4}, {"year": "2024", "month": "7", "qnum": 9, "text": "[9]㈜삼일은 사용 중이던 차량운반구를 ㈜부산이 사용하던 기계장치와 교환하였다. 이 교환과 관련하여\n㈜삼일은 공정가치의 차액 1,000,000원을 현금으로 지급하였다. 이 경우 ㈜삼일이 동 교환거래에서 인식\n해야 할 기계장치의 취득원가는 얼마인가(단, 동 교환거래는 상업적 실질이 있다고 가정하며, 차량운반\n구의 공정가치가 기계장치의 공정가치보다 명백하다)?\n차량운반구 기계장치\n취득원가 4,000,000원 5,000,000원\n감가상각누계액 3,500,000원 2,500,000원\n공정가치 2,000,000원 3,000,000원\n① 2,000,000원\n② 2,500,000원\n③ 3,000,000원\n④ 3,500,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 10, "text": "[10]다음 중 유형자산의 재평가모형 회계처리에 관한 설명으로 옳지 않은 것은?\n① 자산의 장부금액이 재평가로 인하여 증가된 경우 원칙적으로 그 증가액은 기타포괄이익으로 인식한\n다.\n② 자산의 장부금액이 재평가로 인하여 감소한 경우 원칙적으로 그 감소액은 당기손실로 인식한다.\n③ 재평가의 빈도는 재평가되는 유형자산의 공정가치 변동에 따라 달라진다.\n④ 당해 자산이 폐기되거나 제거될 때에는 해당 자산과 관련하여 자본(기타포괄손익누계액)에 계상된\n재평가잉여금은 당기손익으로 재분류조정한다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 11, "text": "[11]다음 중 유형자산의 감가상각에 관한 설명으로 옳지 않은 것은?\n① 재평가모형을 선택할 경우 취득일 이후 재평가일의 공정가치로 해당 자산금액을 수정하고, 당해 공\n정가치에서 재평가일 이후 감가상각누계액과 손상차손누계액을 차감한 금액을 장부금액으로 한다.\n② 유형자산의 잔존가치와 내용연수는 적어도 매 회계연도말에 재검토한다. 재검토결과 추정치가 종전\n추정치와 다르다면 그 차이는 회계추정의 변경으로 회계처리한다.\n③ 감가상각방법은 자산의 미래경제적효익이 소비될 것으로 예상되는 형태를 반영한다.\n④ 감가상각방법은 적어도 매 회계연도 말에 재검토하며, 재검토 결과 자산에 내재된 미래경제적효익의\n예상되는 소비형태에 유의적인 변동이 있다면 이를 반영하기 위하여 감가상각방법을 변경하고, 회계\n정책의 변경으로 회계처리한다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 9, "text": "[9]다음 중 유형자산의 재평가모형에 관한 설명으로 옳지 않은 것은?\n① 보고기간 말에 자산의 장부금액이 공정가치와 중요하게 차이나지 않도록 매년 말 또는 주기적으로 재\n평가를 수행하여야 한다.\n② 자산을 사용함에 따라 재평가된 금액에 근거한 감가상각액과 최초 취득원가에 근거한 감가상각액의\n차이에 해당하는 재평가잉여금의 일부를 이익잉여금으로 대체할 수 있다.\n③ 자산의 장부금액이 재평가로 증가된 경우에 동일한 자산에 대하여 이전에 당기손익으로 인식한 재평\n가감소액이 있다면 그 금액을 한도로 재평가증가액 만큼 당기손익으로 인식하고, 나머지 금액을 재평\n가잉여금의 과목으로 기타포괄손익으로 인식한다.\n④ 재평가모형을 적용하는 경우 감가상각은 수행하지만, 손상의 징후가 존재할 경우에도 손상차손은 인\n식하지 않는다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 10, "text": "[10]다음 중 유형자산에 관한 설명으로 옳지 않은 것은?\n① 유형자산 취득에 필수적으로 수반되는 유가증권의 매입 시 동 증권의 현재가치와 취득가액의 차액은\n유형자산의 취득을 위하여 불가피하게 지출한 금액이므로 당해 유형자산의 원가로 계상하여야 한다.\n② 자산취득 관련 정부보조금은 관련 자산의 장부금액에서 차감하는 방법과 이연수익(부채)으로 표시하\n는 방법 중 한 가지 방법을 선택하여 처리할 수 있다.\n③ 토지만 사용할 목적으로 토지와 건물을 일괄구입하는 경우 일괄구입대가를 개별자산의 공정가치비율\n로 안분하여 토지의 원가는 유형자산으로 인식하고, 건물의 원가는 비용으로 인식한다.\n④ 복구원가란 해당 유형자산의 경제적 사용이 종료된 후에 원상회복을 위하여 그 자산을 제거, 해체하\n거나 또는 부지를 복원하는데 소요될 것으로 추정되는 비용이 부채의 인식요건을 충족하는 경우 그\n지출의 현재가치를 말하며 동 복구원가는 유형자산의 원가에 포함시켜야 한다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 11, "text": "[11]다음은 ㈜삼일의 건물과 관련된 자료이다. ㈜삼일은 20X1년 말 건물과 관련하여 손상차손을 인식하였\n다. 20X1년 결산시점에 ㈜삼일이 건물과 관련하여 인식해야 할 유형자산손상차손은 얼마인가?\nㄱ. 20X1년 초 건물의 취득원가 60,000,000원\nㄴ. 20X1년 말 건물의 순공정가치 42,000,000원\nㄷ. 20X1년 말 건물의 사용가치 40,000,000원\nㄹ. 20X1년 초 건물의 내용연수 6년\nㅁ. 건물의 잔존가치 0원\nㅂ. ㈜삼일은 건물에 대하여 정액법으로 감가상각비를 인식함\n① 7,000,000원\n② 8,000,000원\n③ 9,000,000원\n④ 10,000,000원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 14, "text": "[14]제조업을 영위하는 ㈜삼일은 임대수익을 얻기 위한 목적으로 20X1년 1월 1일 건물을 100,000,000원에\n취득하였다. 투자부동산에 대해 공정가치모형을 적용할 경우 동 건물과 관련한 회계처리가 ㈜삼일의\n20X2년 당기순이익에 미치는 영향은 얼마인가(단, ㈜삼일은 내용연수 5년, 잔존가치 0원, 정액법을 적\n용하여 감가상각한다)?\n<건물의 공정가치>\n20X1년 말 : 102,500,000원\n20X2년 말 : 90,000,000원\n① 5,000,000원 감소\n② 12,500,000원 감소\n③ 20,000,000원 감소\n④ 23,750,000원 감소", "answer": 2}, {"year": "2024", "month": "9", "qnum": 31, "text": "[31]㈜삼일은 20X1년 1월 1일에 취득한 내용연수 5년의 기계장치 100,000원을 정액법으로 감가상각하여\n오던 중 20X3년 1월 1일에 정률법으로 감가상각방법을 변경하기로 하였다. ㈜삼일이 취득한 기계장치\n의 내용연수 종료시점의 잔존가치는 없으며, 정률법의 상각률이 40 % 일 경우 ㈜삼일이 20X3년 인식할\n감가상각비는 얼마인가?\n① 12,000원\n② 14,400원\n③ 24,000원\n④ 40,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 9, "text": "[9]다음 중 유형자산의 취득원가에 포함되는 요소만 바르게 짝지은 것은?\nㄱ. 설치장소 준비를 위한 지출 ㄴ. 최초의 운송 및 취급관련 원가\nㄷ. 보유중인 건물에 대하여 부과되는 재산세 ㄹ. 새로운 시설을 개설하는데 소요되는 원가\n① ㄱ, ㄴ\n② ㄱ, ㄴ, ㄷ\n③ ㄱ, ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ, ㄹ", "answer": 1}, {"year": "2024", "month": "11", "qnum": 10, "text": "[10]다음 중 유형자산에 관한 설명으로 옳지 않은 것은?\n① 유형자산은 기업이 재화나 용역의 생산 등에 사용할 목적으로 보유하는 자산이다.\n② 유형자산은 통상적으로 한 회계기간을 초과하여 사용될 것이 예상된다.\n③ 예비부품이나 대기성 장비는 유형자산의 정의를 충족하더라도 재고자산으로 분류하여야 한다.\n④ 모든 유형자산에 대하여 감가상각이 필요한 것은 아니다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 11, "text": "[11]㈜삼일은 20X1 년 1 월 1 일 임직원 연수동의 건설에 착공하였다. 회사가 20X1 년 중 동 연수동 신축과\n관련하여 지출한 금액과 회사의 차입금 현황은 다음과 같다. 완공까지 약 3년이 소요될 예정일 경우,\n㈜삼일이 20X1 년에 자본화 할 차입원가는 얼마인가?\n지 출 일 지 출 액 비 고\n20X1. 01. 01 10,000,000 원 공사착공\n20X1. 07. 01 12,000,000 원\n20X1. 09. 01 9,000,000 원\n차 입 처 차 입 일 차 입 금 연 이 자 율 용 도\nK 은행 20X1. 01. 01 8,000,000 10 % 특정목적차입금\nS 은행 20X1. 04. 01 20,000,000 8 % 일반목적차입금\n① 800,000 원\n② 1,600,000 원\n③ 1,680,000 원\n④ 2,000,000 원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 14, "text": "[14]다음 중 투자부동산의 계정대체에 관한 설명으로 옳지 않은 것은?\n① 원가모형 적용 임대수익 목적의 건물을 자가사용으로 전환하면 투자부동산을 유형자산으로 대체한\n다.\n② 자가사용건물을 제3자에게 운용리스로 제공하는 경우에는 투자부동산으로 분류한다.\n③ 공정가치모형 적용 임대수익 목적의 건물을 자가사용으로 전환하면 유형자산으로 분류하고 대체시점\n에서 발생한 재평가차액을 기타포괄손익으로 인식한다.\n④ 유형자산을 공정가치로 평가하는 투자부동산으로 대체하는 경우 용도 변경시점의 장부금액과 공정가\n치의 차액을 유형자산 재평가와 동일하게 회계처리한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 31, "text": "[31]㈜삼일은 20X1년 7월 1일 500,000원 (내용연수 5년, 잔존가치 50,000원)에 건물을 취득하고, 20X1\n년 말 정액법으로 감가상각 하였다. 그런데 ㈜삼일은 건물에 내재된 미래경제적효익의 예상되는 소비형\n태의 유의적인 변동을 반영하기 위하여, 20X2년 초부터 감가상각방법을 연수합계법으로 변경하고 잔존\n내용연수는 3 년, 잔존가치는 없는 것으로 재추정하였다. 20X2년 말 건물의 장부금액을 계산하면 얼마\n인가(감가상각은 월할 상각하며, 건물에 대한 손상차손누계액은 없다)?\n① 210,000원\n② 225,000원\n③ 227,500원\n④ 230,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 9, "text": "[9]다음 중 유형자산의 취득원가에 포함되는 요소로만 올바르게 짝지어진 것은?\nㄱ. 설치장소 준비를 위한 지출 ㄴ. 최초의 운송 및 취급관련 원가\nㄷ. 보유중인 건물에 대하여 부과되는 재산세 ㄹ. 취득세\nㅁ. 매입할인\n① ㄱ, ㄴ, ㄹ\n② ㄱ, ㄷ, ㄹ\n③ ㄱ, ㄴ, ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ", "answer": 1}, {"year": "2024", "month": "12", "qnum": 10, "text": "[10]다음은 ㈜삼일이 사용 중인 기계장치와 관련된 내용이다. ㈜삼일이 기계장치와 관련하여 20X2년에 인식\n할 감가상각비는 얼마인가(단, 기계장치는 정액법으로 상각하고, 잔존가치는 0원이라고 가정한다)?\nㄱ. 20X1년 말 현재 기계장치 장부금액(손상차손 인식전) : 60,000,000원\nㄴ. 20X1년 말 현재 기계장치의 순공정가치 : 25,000,000원\nㄷ. 20X1년 말 현재 기계장치의 사용가치 : 30,000,000원\nㄹ. 20X1년 말 현재 기계장치의 잔존내용연수 : 10년\nㅁ. ㈜삼일은 20X1년 말 상기 기계장치에 대해서 손상차손을 인식함\n① 2,500,000원\n② 3,000,000원\n③ 3,500,000원\n④ 3,888,889원", "answer": 2}, {"year": "2024", "month": "12", "qnum": 11, "text": "[11]다음 중 유형자산의 손상을 시사하는 징후로서 옳지 않은 것은?\n① 자산의 사용가치를 계산하는데 영향을 미치는 시장이자율이 하락함\n② 기업경영환경에 중요한 영향을 미치는 법률이 불리한 방향으로 개정됨\n③ 기업의 순자산 장부금액이 당해 시가총액을 상회함\n④ 해당 유형자산을 이용한 경제적 성과가 기대에 비해 저조할 것으로 예측됨", "answer": 1}, {"year": "2024", "month": "12", "qnum": 14, "text": "[14]다음 중 투자부동산의 후속적 측정에 관한 설명으로 옳지 않은 것은?\n① 원가모형으로 측정해 오던 투자부동산이 매각예정으로 분류된다면 별도의 기준서에 따라 처리하여야\n한다.\n② 최초 인식 이후 투자부동산의 평가방법을 원가모형으로 선택한 경우에는 원칙적으로 모든 투자부동\n산에 대하여 원가모형을 적용한다.\n③ 공정가치모형에서 공정가치를 산정할 때에는 매각, 또는 다른 형태의 처분으로 발생할 수 있는 거래\n원가를 차감하여야 한다.\n④ 공정가치모형을 선택한 경우에는 해당 투자부동산이 감가상각대상자산인 경우에도 감가상각은 수행\n하지 않는다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 37, "text": "[37]㈜삼일은 20X1년 1월 1일 ㈜용산리스로부터 기계장치를 3년간 리스하기로 하고, 매년 말 고정리스료\n로 1,000,000원씩 지급하기로 하였다. 리스계약을 체결하는 과정에서 ㈜삼일은 50,000원의 리스개설직\n접원가를 지출하였고, ㈜용산리스는 100,000원의 리스개설직접원가를 지출하였다. 동 기계장치는 원가\n모형을 적용하고 내용연수는 5년이며 정액법으로 감가상각한다. 리스기간 종료시 동 기계장치는 ㈜용산\n리스에 반환하는 조건이다. 리스개시일 현재 ㈜용산리스의 내재이자율은 알 수 없으며, ㈜삼일의 증분\n차입이자율은 연 10 % 이다. ㈜삼일이 리스개시일에 인식할 사용권자산을 계산하면 얼마인가?\n단일금액 1원의 현재가치 정상연금 1원의 현재가치\n기간\n(할인율 10 %) (할인율 10 %)\n3년 0.7513 2.4869\n① 2,486,900원\n② 2,536,900원\n③ 2,586,900원\n④ 2,636,900원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 9, "text": "[9]다음 중 유형자산에 관한 설명으로 옳지 않은 것은?\n① 자산취득 관련 정부보조금은 관련 자산의 장부금액에서 차감하는 방법과 이연수익(부채)으로 표시하\n는 방법 중 한 가지 방법을 선택하여 처리할 수 있다.\n② 교환거래에 상업적 실질이 결여된 경우에는 교환에 의하여 취득한 자산의 원가는 제공한 자산의 공정\n가치로 한다.\n③ 토지와 건물을 모두 사용할 목적으로 토지와 건물을 일괄구입하는 경우 일괄구입대가를 개별자산의\n공정가치비율로 안분하여 토지와 건물의 원가를 산정한다.\n④ 복구원가란 해당 유형자산의 경제적 사용이 종료된 후에 원상회복을 위하여 그 자산을 제거, 해체하\n거나 또는 부지를 복원하는데 소요될 것으로 추정되는 비용이 부채의 인식요건을 충족하는 경우 그\n지출의 현재가치를 말하며 동 복구원가는 유형자산의 원가에 포함시켜야 한다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 10, "text": "[10]다음은 ㈜삼일이 20X1년 7월 1일에 취득하여 20X1년 말 현재 사용 중인 기계장치들에 대한 내용이다.\n20X1년 말 사용 중인 기계장치들에 대하여 자산손상을 시사하는 징후가 발생하였다. ㈜삼일이 20X1년\n말에 유형자산손상차손으로 인식해야 할 금액은 얼마인가?\n구 분 기계장치 A 기계장치 B\n20X1년 말 장부금액 225,000,000원 80,000,000원\n20X1년 말 처분시 예상 순공정가치 150,000,000원 40,000,000원\n계속 사용할 경우의 사용가치 240,000,000원 60,000,000원\n① 0원\n② 5,000,000원\n③ 20,000,000원\n④ 35,000,000원", "answer": 3}, {"year": "2025", "month": "1", "qnum": 11, "text": "[11]㈜삼일은 20X1년 초 기계장치 1대를 50,000원에 취득하였다. 동 기계장치의 내용연수는 5년이고, 잔\n존가치는 없으며 감가상각방법은 정액법을 채택하기로 하였다. ㈜삼일은 이 기계장치에 대해 재평가모\n형을 적용하고 있으며, 20X2년 말의 공정가치는 40,000원이었다. ㈜삼일이 20X2년 말에 시행한 기계장\n치의 재평가가 ㈜삼일의 20X2년 기타포괄이익에 미치는 영향은 얼마인가(단, ㈜삼일은 20X1년 말에 기\n계장치에 대한 재평가를 실시하지 않았으며, 재평가시 자산의 총장부금액에서 감가상각누계액을 제거한\n다)?\n① 0원\n② 10,000원 증가\n③ 20,000원 증가\n④ 30,000원 증가", "answer": 2}, {"year": "2025", "month": "1", "qnum": 30, "text": "[30]다음 중 회계정책의 변경에 해당하는 것은?\n① 유형자산의 내용연수의 변경\n② 유형자산의 측정기준 변경\n③ 유형자산의 감가상각방법의 변경\n④ 유형자산 잔존가치의 변경", "answer": 2}, {"year": "2025", "month": "1", "qnum": 40, "text": "[40]다음은 ㈜삼일의 영업활동으로 인한 현금흐름을 계산하기 위한 자료이다. ㈜삼일의 당기순이익이\n5,000,000원이라고 할 때 영업활동으로 인한 현금흐름을 계산하면 얼마인가?\n유형자산처분이익 20 자산에서 발생하는 현금흐름\n② 로열티, 수수료, 중개료 및 기타수익에 따른 현금유입\n③ 법인세의 납부 또는 환급\n④ 유형자산의 취득에 따른 현금유출", "answer": 4}, {"year": "2025", "month": "5", "qnum": 9, "text": "[9]다음 중 유형자산의 취득원가에 관한 설명으로 옳지 않은 것은?\n① 토지는 취득세, 등록세 등 취득부대원가를 가산한 금액을 취득원가로 한다.\n② 토지만 사용할 목적으로 토지와 건물을 일괄구입하는 경우 일괄구입대가 모두 토지의 취득원가로 처\n리한다.\n③ 토지만 사용할 목적으로 토지와 건물을 일괄구입하는 경우 기존 건물을 철거할 때 발생하는 건물철거\n비용은 당기손실로 처리한다.\n④ 토지만 사용할 목적으로 토지와 건물을 일괄구입하는 경우 기존 건물 철거로 발생한 폐자재들을 처리\n하는 비용이 발생하는 경우 토지의 원가에 가산한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 11, "text": "[11]다음 중 유형자산의 재평가모형에 관한 설명으로 옳지 않은 것은?\n① 보고기간 말에 자산의 장부금액이 공정가치와 중요하게 차이나지 않도록 주기적으로 재평가를 수행\n하여야 한다.\n② 자산을 사용함에 따라 재평가된 금액에 근거한 감가상각액과 최초 취득원가에 근거한 감가상각액의\n차이에 해당하는 재평가잉여금의 일부를 이익잉여금으로 대체할 수 있다.\n③ 자산의 장부금액이 재평가로 증가된 경우에 동일한 자산에 대하여 이전에 당기손익으로 인식한 재평\n가감소액이 있다면 그 금액을 한도로 재평가증가액 만큼 기타포괄손익으로 인식하고, 나머지 금액을\n재평가잉여금의 과목으로 당기손익으로 인식한다.\n④ 재평가모형을 적용하는 경우에도 당해 유형자산에 손상의 징후가 존재할 경우 손상검사를 실시하고,\n필요한 경우 손상차손을 인식한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 12, "text": "[12]다음 중 무형자산의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 무형자산 원가의 인식은 그 자산을 경영자가 의도하는 방식으로 운용될 수 있는 상태에 이르면 중지\n한다.\n② 무형자산에 대한 대금지급기간이 일반적인 신용기간보다 긴 경우 무형자산의 원가는 현금가격상당액\n으로 한다.\n③ 사업결합 전에 피취득자가 무형자산을 인식하지 아니한 경우, 사업결합의 취득자는 그러한 무형자산\n을 인식할 수 없다.\n④ 무형자산을 비화폐성 자산과 교환하여 취득하는 경우로서, 동 교환거래에 상업적 실질이 결여되어\n있다면, 취득한 무형자산의 원가는 제공한 자산의 장부금액으로 한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 14, "text": "[14]다음 중 투자부동산의 후속 측정에 관한 설명으로 옳지 않은 것은?\n① 투자부동산으로 분류된 건물에 대하여 공정가치모형을 적용할 경우 동 건물은 상각하지 않는다.\n② 투자부동산은 공정가치모형과 원가모형 중 하나를 선택하여 적용할 수 있다.\n③ 투자부동산의 공정가치모형 적용시 공정가치 변동으로 발생하는 손익은 기타포괄손익에 반영한다.\n④ 투자부동산의 용도가 변경되어 자가사용을 개시할 경우 투자부동산을 유형자산으로 계정대체한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 35, "text": "[35]㈜삼일은 20X1년 4월 1일에 유형자산으로 분류되는 토지를 $ 10,000에 취득하였다. ㈜삼일은 유형자\n산에 대해 재평가모형을 적용하고 있으며, 매년 말에 공정가치로 재평가한다. 20X1년 말 토지의 공정가\n치가 $ 11,000일 경우, ㈜삼일이 20X1년 말에 인식할 재평가잉여금(기타포괄손익)은 얼마인가(단, ㈜\n삼일의 기능통화는 원화이며, 관련 환율은 다음과 같다)?\n일자 20X1년 4월 1일 20X1년 12월 31일\n환율(￦ / $) 1,000 1,200\n① 1,000,000원  "2025", "month": "11", "qnum": 9, "text": "[9]다음 중 유형자산의 취득원가에 포함되는 요소로만 올바르게 짝지어진 것은?\nㄱ. 설치장소 준비를 위한 지출 ㄴ. 최초의 운송 및 취급관련 원가\nㄷ. 건물 취득시 부담한 취득세 ㄹ. 보유중인 건물에 대하여 부과되는 재산세\nㅁ. 매입할인\n① ㄱ, ㄴ, ㄷ\n② ㄱ, ㄴ, ㄹ\n③ ㄱ, ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ", "answer": 1}, {"year": "2025", "month": "11", "qnum": 10, "text": "[10]㈜삼일은 20X1년 초에 토지를 10,000원에 구입하였으며, 이 토지에 대해 재평가모형을 적용하여 매년\n말에 재평가하였다. 토지의 공정가치는 20X1년 말에 9,000원, 20X2년 말에 13,000원이다. 20X2년 말\n에 시행한 토지의 재평가가 ㈜삼일의 20X2년 기타포괄이익에 미치는 영향은 얼마인가?\n① 영향 없음\n② 1,000원 증가\n③ 2,000원 증가\n④ 3,000원 증가", "answer": 4}, {"year": "2025", "month": "11", "qnum": 11, "text": "[11]다음 중 유형자산의 손상에 관한 설명으로 옳지 않은 것은?\n① 기업은 매 보고기간 말마다 자산손상을 시사하는 징후가 있는지를 검토하고 그러한 징후가 있다면 당\n해 자산의 회수가능액을 추정하여 회수가능액이 장부금액에 미달하는 경우 손상차손을 인식한다.\n② 자산손상을 시사하는 징후가 있는지를 검토할 때는 외부정보와 내부정보를 모두 고려해야 한다.\n③ 자산의 회수가능액은 당해 자산의 순공정가치와 사용가치 중 큰 금액이다.\n④ 유형자산에 재평가모형을 적용하는 경우 손상차손을 인식하지 않는다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 14, "text": "[14]다음 중 투자부동산의 계정대체에 관한 설명으로 옳지 않은 것은?\n① 원가모형 적용 임대수익 획득목적의 건물을 자가사용으로 전환하면 투자부동산을 유형자산으로 대체\n한다.\n② 자가사용건물을 제3자에게 운용리스로 제공하는 경우에는 투자부동산으로 대체한다.\n③ 공정가치모형 적용 임대수익 획득목적의 건물을 자가사용으로 전환하면 유형자산으로 대체하고 대체\n시점에서 발생한 장부금액과 공정가치의 차액을 당기손익으로 인식한다.\n④ 원가모형 적용 유형자산을 공정가치로 평가하는 투자부동산으로 대체하는 경우 용도 변경시점의 장\n부금액과 공정가치의 차액을 투자부동산의 평가손익으로 보아 당기손익으로 인식한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 15, "text": "[15]다음 중 금융상품에 관한 설명으로 옳은 것은?\n① 금융상품은 거래당사자에게 금융자산을 발생시키고 동시에 거래상대방에게 금융부채나 지분상품을\n발생시키는 모든 계약을 말한다.\n② 매입채무와 미지급법인세는 금융부채에 해당한다.\n③ 현금및현금성자산, 매출채권, 기업자신의 지분상품은 항상 금융자산에 해당한다.\n④ 잠재적으로 유리한 조건으로 거래상대방과 유형자산을 교환하기로 한 계약상 권리는 금융자산이다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 31, "text": "[31]㈜삼일은 20X1년 7월 1일 500,000원(내용연수 5년, 잔존가치 50,000원)에 건물을 취득하고, 20X1 년\n말 정액법으로 감가상각 하였다. 그런데 ㈜삼일은 건물에 내재된 미래경제적효익의 예상되는 소비형태\n의 유의적인 변동을 반영하기 위하여, 20X2년 초부터 감가상각방법을 연수합계법으로 변경하고 잔존내\n용연수는 4년, 잔존가치는 없는 것으로 재추정하였다. 20X2년 말 건물의 장부금액을 계산하면 얼마인\n가(단, 감가상각은 월할 상각하며, 건물에 대한 손상차손누계액은 없다)?\n① 246,000원\n② 273,000원\n③ 300,000원\n④ 341,250원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 9, "text": "[9]전자기기 제조업을 영위하는 ㈜삼일은 당기 중 신제품 A의 출시를 위해 필요한 유형자산 B를 취득하였\n다. 이와 관련된 지출항목이 다음과 같다고 할 때, 유형자산 B의 취득원가로 계상될 금액은 얼마인가?\n지 출 항 목 금 액\n유형자산 B의 매입가격 100,000,000원\n수요형성과정에서 발생한 초기가동손실 5,000,000원\n설치 및 조립 3,000,000원\n신제품 A를 시장에 소개하기 위한 광고 5,000,000원\n정상적인 가동 여부를 확인하는데 소요된 원가 2,000,000원\n유형자산 B의 취득과 관련하여 전문가에게 지급하는 수수료 4,000,000원\n① 105,000,000원\n② 109,000,000원\n③ 110,000,000원\n④ 114,000,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 10, "text": "[10]㈜삼일은 거래처에게 사용하던 유형자산(구자산)을 제공하고 이와 교환하여 유사한 기능을 가진 새로운\n유형자산(신자산)을 취득하였다. 동 교환거래에는 상업적 실질이 있고, 교환대상이 되는 각 자산의 공\n정가치는 합리적으로 측정될 수 있다. ㈜삼일이 교환으로 취득하는 유형자산(신자산)의 취득원가로 옳\n은 것은?\n① 제공한 유형자산(구자산)의 장부금액\n② 제공한 유형자산(구자산)의 공정가치\n③ 취득한 유형자산(신자산)의 장부금액\n④ 취득한 유형자산(신자산)의 공정가치", "answer": 2}, {"year": "2025", "month": "12", "qnum": 11, "text": "[11]통신업을 영위하고 있는 ㈜삼일은 20X1년 7월 1일 5억원에 취득하여 사용해 오던 건물 A(내용연수 5\n년, 연수합계법으로 감가상각, 잔존가치 0원)를 20X4년 4월 1일 2억원에 처분하였다. 다음 중 ㈜삼일\n이 건물 A의 처분과 관련하여 20X4년 포괄손익계산서에 인식할 계정과 금액으로 옳은 것은(단, ㈜삼일\n은 건물을 원가모형으로 후속측정하며, 감가상각비는 월할 계산한다)?\n① 유형자산처분손실 25,000,000원\n② 유형자산처분이익 25,000,000원\n③ 유형자산처분이익 50,000,000원\n④ 유형자산처분이익 75,000,000원", "answer": 4}, {"year": "2025", "month": "12", "qnum": 13, "text": "[13]㈜삼일이 20X1년 초에 취득한 특허권 관련 자료는 다음과 같다. 특허권은 정액법으로 상각하며, 잔존가\n치는 0원이다. 20X2년 말 ㈜삼일의 특허권 장부금액과 관련된 손상차손 금액을 계산하면 얼마인가?\n20X2년 말\n취득원가 내용연수\n순공정가치 사용가치\n500,000원 5년 260,000원 320,000원\n장부금액 손상차손\n① 300,000원 20,000원\n② 300,000원 0원\n③ 280,000원 20,000원\n④ 280,000원 0원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 14, "text": "[14]다음 중 투자부동산의 후속측정에 관한 설명으로 옳지 않은 것은?\n① 원가모형으로 측정해 오던 투자부동산이 매각예정으로 분류된다면‘매각예정비유동자산과 중단영\n업’기준서에 따라 처리하여야 한다.\n② 최초 인식 이후 투자부동산의 평가방법을 원가모형으로 선택한 경우에는 원칙적으로 모든 투자부동\n산에 대하여 원가모형을 적용한다.\n③ 공정가치모형에서 공정가치를 산정할 때에는 매각, 또는 다른 형태의 처분으로 발생할 수 있는 거래\n원가를 조정하지 않는다.\n④ 공정가치모형을 선택한 경우에도 해당 투자부동산이 감가상각대상자산인 경우에는 감가상각을 수행\n한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 26, "text": "[26]고객충성제도를 운영하는 ㈜삼일은 20X1년 1월 제품을 100,000원에 판매하고 10,000포인트를 부여하\n였다. 1포인트 당 0.5원을 할인받을 수 있고, 향후 8,000포인트가 교환될 것으로 예상하였다. 제품의\n개별판매가격은 100,000원이고, 교환될 가능성에 기초하여 포인트당 개별판매가격을 0.4원으로 추정하\n였다. 20X1년 중에 2,000포인트가 교환되었고, 총 교환 예상 포인트는 8,000포인트(20X1년에 교환된\n포인트 포함)이다. 제품매출 및 고객충성제도와 관련하여, ㈜삼일이 20X1년에 수익으로 인식할 금액은\n얼마인가(단, 단수차이로 인해 오차가 있으면, 가장 근사치를 선택한다)?\n① 95,000원\n② 96,154원\n③ 97,115원\n④ 100,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 39, "text": "[39]㈜삼일의 20X1년 당기순이익은 100,000원이다. 다음에 제시된 자료를 이용하여 ㈜삼일의 20X1년 영업\n활동현금흐름을 구하면 얼마인가(단, 이자지급 및 법인세납부는 영업활동으로 분류한다)?\n〈20X1년 ㈜삼일의 재무자료〉\n유형자산처분손실 3,000원 사채상환이익 2,000원\n감가상각비 2,000원 법인세납부액 8,000원\n사채의 감소 7,000원 미지급이자의 증가 2,000원\n재고자산(순액)의 증가 3,000원 매출채권(순액)의 증가 2,000원\n매입채무의 증가 3,000원 미지급법인세의 감소 3,000원\n① 90,000원\n② 92,000원\n③ 98,000원\n④ 100,000원", "answer": 4}], "04_무형자산": [{"year": "2024", "month": "1", "qnum": 12, "text": "[12]다음 항목 중 무형자산에 해당되는 금액의 합계는 얼마인가?\n새로운 지식을 얻고자 하는 활동 지출액 140,000원\n내부적으로 창출된 브랜드의 가치평가금액 200,000원\n내부적으로 창출된 영업권의 가치평가금액 160,000원\n개발단계 지출로 자산인식 조건을 충족하는 금액 320,000원\n개발단계 지출로 자산인식 조건을 충족하지 못하는 금액 180,000원\n① 200,000원\n② 320,000원\n③ 480,000원\n④ 680,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 13, "text": "[13]다음 중 무형자산의 상각에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 유한한 무형자산은 자산을 사용할 수 있는 때부터 상각한다.\n② 내용연수가 비한정인 무형자산은 상각하지 않고, 매년 일정시기 및 무형자산의 손상을 시사하는 징\n후가 있을 때마다 손상검사를 수행한다.\n③ 내용연수가 유한한 무형자산은 경제적효익이 소비되는 형태를 신뢰성 있게 결정할 수 없는 경우에는\n정액법을 사용하여 상각한다.\n④ 내용연수가 비한정인 무형자산이 내용연수가 비한정이라는 평가를 더 이상 정당화할 수 없다면 내용\n연수가 유한한 무형자산으로 변경해야 하며, 이 경우에는 회계정책의 변경으로 회계처리한다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 13, "text": "[13]다음 중 내부적으로 창출한 무형자산에 관한 설명으로 옳은 것은?\n① 내부 프로젝트의 개발단계에서는 미래경제적효익을 창출할 무형자산이 존재한다는 것을 제시할 수\n없기 때문에 개발단계에서 발생한 지출은 모두 발생한 기간의 비용으로 인식한다.\n② 내부적으로 창출한 영업권도 원가를 신뢰성 있게 측정할 수 있다면 무형자산으로 인식할 수 있다.\n③ 내부적으로 창출된 브랜드, 고객목록 및 이와 유사한 항목에 대한 지출은 무형자산으로 인식하지 않\n는다.\n④ 무형자산을 창출하기 위한 내부 프로젝트를 연구단계와 개발단계로 구분할 수 없는 경우에는 그 프\n로젝트에서 발생한 지출은 모두 개발단계에서 발생한 것으로 본다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 12, "text": "[12]다음 중 무형자산의 상각에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 유한한 무형자산은 내용연수동안 상각하지만 내용연수가 비한정인 무형자산은 상각하지\n않는다.\n② 무형자산의 잔존가치는 처분으로 회수가능한 금액을 근거로 하여 추정하며, 적어도 매 회계기간말에\n검토한다.\n③ 무형자산의 상각을 회계처리하는 방법은 직접법과 간접법이 있으며, 상각방법을 변경하는 경우에는\n회계추정의 변경으로 본다.\n④ 내용연수가 비한정인 무형자산이란 내용연수가 무한하여 미래 경제적 효익이 무한할 것으로 기대되\n는 무형자산을 의미한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 12, "text": "[12]㈜삼일은 신제품 개발 프로젝트와 관련하여 당기 중 90억원을 지출하였다. 동 지출 중 20억원은 새로\n운 지식을 얻고자 하는 활동으로 소요되었고 70억원은 사용 전의 시제품을 설계, 제작 및 시험하는 활\n동으로 소요되었다. 다음 중 이에 관한 회계처리로 옳은 것은?\n① 20억원은 무형자산으로 인식하고, 70억원 중 무형자산인식기준을 충족하지 못하는 것은 발생시점에\n비용으로 인식하고, 무형자산 인식기준을 충족하는 것은 무형자산으로 인식한다.\n② 신제품개발 프로젝트와 관련하여 발생한 90억원은 전액 개발단계에 속하는 활동이므로 무형자산으\n로 인식한다.\n③ 신제품개발 프로젝트와 관련하여 발생한 90억원은 전액 연구단계에 속하는 활동이므로 현금지출시\n점에 비용으로 인식한다.\n④ 개발단계에서 지출한 금액은 무형자산을 완성해 그것을 판매하려는 기업의 의도가 없는 경우 무형자\n산으로 인식할 수 없다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 13, "text": "[13]다음 중 무형자산의 상각에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 비한정인 무형자산은 상각하지 않으며, 매년 일정시기와 손상을 시사하는 징후가 있을\n때에 손상검사를 수행하여야 한다.\n② 내용연수가 유한한 무형자산은 자산을 사용할 수 있는 날과 실제 사용한 날 중 늦은 날부터 상각한\n다.\n③ 내용연수가 유한한 무형자산의 경제적 효익이 소비되는 형태를 신뢰성 있게 결정할 수 없는 경우에\n는 정액법을 적용한다.\n④ 내용연수가 유한한 무형자산의 상각기간은 적어도 매 회계연도 말에 검토한다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 12, "text": "[12]20X1년 중 ㈜삼일은 연구 및 개발활동과 관련하여 총 500억원을 지출하였다. 새로 개발한 무형자산이\n20X1년 11월 1일부터 사용가능할 것으로 예측된 경우 연구 및 개발활동과 관련하여 20X1년 말 재무상\n태표에 표시될 무형자산의 장부금액은 얼마인가(단, 무형자산의 내용연수는 5년, 잔존가치 0원, 정액\n법으로 상각한다)?\n구분 금액 비고\n연구단계\n300억원\n(20X1.1.1~20X1.3.31)\n개발단계 자산인식요건 충족 90억원\n200억원\n(20X1.4.1~20X1.10.31) 자산인식요건 미충족110억원\n합계 500억원\n① 72억원\n② 87억원\n③ 90억원\n④ 106억원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 13, "text": "[13]다음 중 내부적으로 창출한 무형자산에 관한 설명으로 옳지 않은 것은?\n① 내부적으로 창출한 고객목록, 브랜드 등은 무형자산으로 인식하지 않는다.\n② 재료, 장치, 제품, 공정, 시스템이나 용역에 대한 여러 가지 대체안을 탐색하는 활동에서 발생한 지\n출은 연구단계 지출에 해당한다.\n③ 내부 프로젝트의 연구단계에서는 미래경제적효익을 창출할 무형자산이 존재한다는 것을 제시할 수\n없기 때문에, 내부 프로젝트의 연구단계에서 발생한 지출은 발생시점에 비용으로 인식한다.\n④ 무형자산을 창출하기 위한 내부 프로젝트를 연구단계와 개발단계로 구분할 수 없는 경우에는 그 프\n로젝트에서 발생한 지출은 모두 개발단계에서 발생한 것으로 본다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 12, "text": "[12]다음 중 무형자산에 관한 설명으로 옳지 않은 것은?\n① 무형자산은 식별이 불가능하지만 통제 가능하고 미래경제적효익을 가져다 주는 비화폐성자산을 말한\n다.\n② 내부적으로 창출한 영업권은 무형자산으로 인식하지 않는다.\n③ 내용연수가 비한정인 무형자산은 상각하지 않고, 매년 일정시기 및 무형자산의 손상을 시사하는 징\n후가 있을 때마다 손상검사를 수행한다.\n④ 내용연수가 유한한 무형자산은 경제적효익이 소비되는 형태를 신뢰성 있게 결정할 수 없는 경우에는\n정액법을 사용하여 상각한다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 13, "text": "[13]다음은 ㈜삼일의 20X1년 연구 및 개발활동 지출 내역이다. ㈜삼일이 20X1년 개발단계에 속하는 활동으\n로 분류해야 하는 금액은 얼마인가?\nㄱ. 새로운 지식을 얻고자 하는 활동 100,000원\nㄴ. 생산이나 사용 전의 시제품과 모형을 제작하는 활동 150,000원\nㄷ. 연구결과 또는 기타 지식을 탐색, 평가, 최종 선택 및 응용하는 활동 300,000원\nㄹ. 새로운 기술과 관련된 공구, 금형, 주형 등을 설계하는 활동 200,000원\nㅁ. 상업적 생산 목적으로 실현가능한 경제적 규모가 아닌 시험공장을 건설하는 활동 300,000원\n① 300,000원\n② 450,000원\n③ 550,000원\n④ 650,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 12, "text": "[12]제약회사인 ㈜삼일은 20X1년 초에 설립되었으며, 암 치료용 신약 연구·개발 프로젝트를 진행 중에 있\n다. 다음은 20X1년 동안 암 치료용 신약 연구·개발 프로젝트A에 소요된 지출들이다.\n단계 지출시점 지출액\n연구단계 20X1년 1월 1일 100,000원\n20X1년 5월 1일 150,000원\n개발단계\n20X1년 9월 1일 200,000원\n20X1년 말에 종료되는 회계연도에 개발비(무형자산)로 인식할 금액과 당기비용으로 인식할 금액은 얼\n마인가(단, 프로젝트A의 개발단계 지출액은 모두 무형자산인식요건을 충족하였으며, 개발비는 20X2년\n부터 사용가능 하다고 가정한다)?\n개발비(무형자산) 당기비용\n① 200,000원 0원\n② 200,000원 100,000원\n③ 350,000원 100,000원\n④ 350,000원 200,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 13, "text": "[13]다음 중 무형자산의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 유한한 무형자산은 매 보고기간 말에 손상검사를 수행하여야 한다.\n② 내용연수가 유한한 무형자산은 자산을 사용할 수 있는 날부터 상각한다.\n③ 내용연수가 유한한 무형자산의 경제적 효익이 소비되는 형태를 신뢰성있게 결정할 수 없는 경우에는\n정액법을 적용하여 상각한다.\n④ 내용연수가 유한한 무형자산의 상각기간은 적어도 매 회계연도 말에 검토한다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 12, "text": "[12]다음 중 무형자산의 상각에 관한 설명으로 옳은 것은?\n① 내용연수가 유한한 무형자산의 내용연수는 경제적 내용연수와 법적 내용연수 중 긴 것으로 결정된\n다.\n② 내용연수가 유한한 무형자산의 경제적 효익이 소비되는 형태를 신뢰성있게 결정할 수 없는 경우에는\n정액법으로 상각한다.\n③ 내용연수가 유한한 무형자산의 잔존가치는 해당 자산의 장부금액과 같을 수는 있으나 큰 금액으로\n증가할 수는 없다.\n④ 내용연수가 비한정인 무형자산은 상각 및 손상검사를 수행하지 않는다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 13, "text": "[13]다음은 ㈜삼일의 프로젝트 개발활동과 관련된 지출내용이다. ㈜삼일의 프로젝트 개발활동과 관련하여\n무형자산(개발비)으로 회계처리가 가능한 금액은 얼마인가?\n프로젝트 금 액 내 용\n가 350,000원 프로젝트 연구단계에서의 지출\n나 900,000원 프로젝트 개발단계에서의 지출로 자산 인식조건을 만족시킴\n다 1,000,000원 프로젝트 개발단계에서의 지출로 자산 인식조건을 만족시키지 못함\n① 900,000원\n② 1,250,000원\n③ 1,900,000원\n④ 2,250,000원", "answer": 1}, {"year": "2025", "month": "1", "qnum": 12, "text": "[12]다음 중 무형자산의 상각에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 유한한 무형자산은 내용연수 동안 상각을 하고, 내용연수가 비한정인 무형자산은 상각을\n하지 않는다.\n② 내용연수가 유한한 무형자산의 상각방법은 자산의 경제적 효익이 소비되는 형태를 반영해야 하며,\n소비되는 형태를 신뢰성 있게 결정할 수 없는 경우에는 정액법을 사용한다.\n③ 내용연수가 유한한 무형자산의 잔존가치는 해당자산의 장부금액보다 큰 금액으로 증가할 수 없다.\n④ 내용연수가 비한정인 무형자산이 내용연수 검토결과 더 이상 비한정이라는 평가를 정당화할 수 없다\n면 내용연수가 유한한 무형자산으로 변경해야 한다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 13, "text": "[13]다음은 ㈜삼일이 20X1년 중 신제품 A 의 연구 및 개발활동과 관련하여 발생시킨 원가의 내역이다. 이와\n관련하여 20X1년 말 재무상태표에 표시될 무형자산의 장부금액을 계산하면 얼마인가(단, 신제품 A 와\n관련하여 계상된 무형자산은 20X1 년 7 월 1 일부터 사용이 가능하며 내용연수 5 년, 잔존가치 0원, 정\n액법으로 상각한다)?\n일 자 세 부 내 역 금 액\n20X1년 1월 1일 연구단계에서 발생한 지출 200,000 원\n20X1년 3월 1일 개발단계에서 발생한 지출로 자산인식 조건을 만족시키지 못함 1,500,000 원\n20X1년 4월 1일 개발단계에서 발생한 지출로 자산인식 조건을 만족시킴 1,300,000 원\n① 1,040,000원\n② 1,170,000원\n③ 1,300,000원\n④ 1,430,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 12, "text": "[12]다음 중 내부적으로 창출한 무형자산의 인식에 관한 설명으로 옳지 않은 것은?\n① 내부적으로 창출한 영업권은 무형자산으로 인식할 수 없다.\n② 내부 프로젝트에서 발생한 원가 중 연구단계에서 발생한 원가는 무형자산으로 인식할 수 없다.\n③ 개발단계에서 발생한 지출은 무형자산 인식조건을 모두 충족하는 경우에만 무형자산으로 인식한다.\n④ 연구단계와 개발단계를 구분할 수 없는 경우에는 그 프로젝트에서 발생한 지출은 모두 개발단계에서\n발생한 것으로 본다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 13, "text": "[13]다음은 20X1년 ㈜삼일의 엔진 개발과 관련하여 20X1년 1월 1일부터 20X1년 9월 30일까지 발생한 지\n출에 대한 자료이다. 동 엔진이 20X1년 10월 1일부터 사용가능할 것으로 예측된 경우 20X1년에 ㈜삼\n일이 엔진 개발과 관련하여 인식해야 할 총비용은 얼마인가(단, 엔진 개발비에 대하여 내용연수 5년,\n잔존가치 0원, 정액법 상각함)?\n연구단계 개발단계\nŸ 엔진 연구 결과의 평가를 3,000,000원 Ÿ 자산인식조건을 만족하는 5,000,000원\n위한 지출 개발 단계 지출\nŸ 여러 가지 대체안 탐색 17,000,000원 Ÿ 자산인식조건을 만족하지 7,000,000원\n활동을 위한 지출 않는 개발 단계 지출\n① 22,250,000원\n② 25,250,000원\n③ 27,250,000원\n④ 30,000,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 13, "text": "[13]다음 중 무형자산의 상각에 관한 설명으로 옳은 것은?\n① 내용연수가 유한한 무형자산의 내용연수는 경제적 내용연수와 법적 내용연수 중 긴 것으로 결정된\n다.\n② 내용연수가 유한한 무형자산의 경제적 효익이 소비되는 형태를 신뢰성있게 결정할 수 없는 경우에는\n상각하지 않는다.\n③ 내용연수가 유한한 무형자산의 잔존가치는 해당 자산의 장부금액과 같을 수는 있으나 큰 금액으로\n증가할 수는 없다.\n④ 내용연수가 비한정인 무형자산은 상각하지 않는다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 12, "text": "[12]다음 항목 중 무형자산에 해당되는 금액의 합계는 얼마인가?\n사업결합으로 취득한 특허권 평가금액 140,000원\n내부적으로 창출된 브랜드의 가치평가금액 200,000원\n내부적으로 창출된 영업권의 가치평가금액 160,000원\n개발단계 지출로 자산인식 조건을 충족하는 금액 320,000원\n개발단계 지출로 자산인식 조건을 충족하지 못하는 금액 180,000원\n① 200,000원\n② 320,000원\n③ 460,000원\n④ 680,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 13, "text": "[13]다음 중 무형자산의 후속 측정에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 비한정인 무형자산은 매년 손상검사를 한다.\n② 손상검토시 회수가능액은 순공정가치와 사용가치 중 큰 금액을 기준으로 판단한다.\n③ 재평가모형을 적용하는 무형자산에 대해서는 손상차손을 인식하지 않는다.\n④ 내용연수가 유한한 무형자산의 잔존가치, 상각기간 및 상각방법의 적정성에 대하여 매 보고기간 말\n에 재검토하여야 한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 12, "text": "[12]다음 중 내부적으로 창출한 무형자산에 관한 설명으로 옳지 않은 것은?\n① 내부 프로젝트의 연구단계에서는 미래경제적효익을 창출할 무형자산이 존재한다는 것을 제시할 수\n없기 때문에 연구단계에서 발생한 지출은 발생한 기간의 비용으로 인식한다.\n② 개발단계에서 발생한 지출은 무형자산인식요건을 모두 충족하는 경우에만 무형자산으로 인식하고,\n그 외의 경우에는 발생한 기간의 비용으로 인식한다.\n③ 무형자산을 창출하기 위한 내부 프로젝트를 연구단계와 개발단계로 구분할 수 없는 경우에는 그 프\n로젝트에서 발생한 지출은 모두 연구단계에서 발생한 것으로 본다.\n④ 개발단계에서 내부적으로 창출한 브랜드에 대한 지출은 미래경제적효익이 유입될 가능성이 높은 경\n우 무형자산으로 인식한다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 12, "text": "[12]다음 중 무형자산의 상각에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 비한정인 무형자산은 상각하지 않으며, 매년 일정시기와 손상을 시사하는 징후가 있을\n때에 손상검사를 수행하여야 한다.\n② 내용연수가 유한한 무형자산의 잔존가치는 항상 영(0)으로 본다.\n③ 내용연수가 유한한 무형자산은 경제적 효익이 소비되는 형태를 신뢰성 있게 결정할 수 없는 경우에\n정액법을 사용하여 상각한다.\n④ 내용연수가 유한한 무형자산의 상각기간은 적어도 매 회계연도 말에 검토한다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 12, "text": "[12]다음은 ㈜삼일의 20X1년 연구 및 개발활동 관련 지출 내역이다. ㈜삼일이 20X1년 연구단계에 속하는\n활동으로 분류해야 하는 금액은 얼마인가?\n새로운 지식을 얻고자 하는 활동 250,000원\n생산이나 사용 전의 시제품과 모형을 제작하는 활동 150,000원\n연구결과 또는 기타 지식을 탐색, 평가, 최종 선택 및 응용하는 활동 300,000원\n새로운 기술과 관련된 공구, 금형, 주형 등을 설계하는 활동 200,000원\n상업적 생산 목적으로 공장을 건설하는 활동 300,000원\n① 300,000원\n② 450,000원\n③ 550,000원\n④ 650,000원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 13, "text": "[13]다음 중 무형자산에 관한 설명으로 옳지 않은 것은?\n① 내용연수가 비한정인 무형자산은 최소한 1년에 1회 이상의 손상검사가 이루어져야 한다.\n② 개별취득한 무형자산으로서, 재평가모형을 적용하는 무형자산은 공정가치로 최초 인식한다.\n③ 무형자산의 제거로 발생하는 손익은 당기손익으로 인식한다.\n④ 특정 무형자산을 재평가할 때, 동일한 유형내의 무형자산 유형 전체를 재평가한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 12, "text": "[12]다음 중 무형자산의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 경영자가 의도하는 방식으로 운용될 수 있으나 아직 사용하지 않고 있는 기간에 발생한 원가는 무형\n자산의 취득원가에 포함할 수 없다.\n② 무형자산을 사용하거나 재배치하는데 발생하는 원가는 무형자산의 장부금액에 포함하지 아니한다.\n③ 무형자산의 잔존가치는 내용연수 종료 시점에 제3자가 자산을 특정가격에 구입하기로 한 약정이 있\n는 경우에도 영(0)으로 본다.\n④ 무형자산에 대한 대금지급기간이 일반적인 신용기간보다 긴 경우 무형자산의 원가는 현금가격상당액\n으로 한다.", "answer": 3}], "06_금융자산": [{"year": "2024", "month": "1", "qnum": 15, "text": "[15]다음 중 기타포괄손익-공정가치 측정 금융자산에 관한 설명으로 옳지 않은 것은?\n① 기타포괄손익-공정가치 측정 금융자산은 원칙적으로 공정가치로 평가하여 평가손익을 기타포괄손익\n으로 반영한다.\n② 기타포괄손익-공정가치 측정 금융자산으로 분류되는 지분상품을 처분할 경우 당기나 과거기간에 기\n타포괄손익으로 인식된 평가손익을 당기손익으로 재분류한다.\n③ 기타포괄손익-공정가치 측정 금융자산 취득시 지출된 거래원가는 취득원가에 가산하여 측정한다.\n④ 기타포괄손익-공정가치 측정 금융자산으로 분류되는 지분상품에 대한 손상차손은 인식하지 아니한\n다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 16, "text": "[16]다음 중 금융자산의 재분류에 관한 설명으로 옳지 않은 것은?\n① 당기손익-공정가치 측정 금융자산을 상각후원가 측정 금융자산으로 재분류하는 경우 재분류일의 공\n정가치가 새로운 총장부금액이 된다.\n② 기타포괄손익-공정가치 측정 금융자산을 상각후원가 측정 금융자산으로 재분류하는 경우 재분류일의\n공정가치로 측정하고, 재분류 전에 기타포괄손익으로 인식했던 평가손익은 당기손익으로 재분류조정\n한다.\n③ 상각후원가 측정 금융자산을 당기손익-공정가치 측정 금융자산으로 재분류하는 경우 재분류일의 공\n정가치로 측정하고, 재분류 전 상각후원가와 공정가치의 차이에 따른 손익은 당기손익으로 인식한\n다.\n④ 상각후원가 측정 금융자산을 기타포괄손익-공정가치 측정 금융자산으로 재분류하는 경우 재분류일의\n공정가치로 측정하고, 재분류 전 상각후원가와 공정가치의 차이에 따른 손익은 기타포괄손익으로 인\n식한다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 4, "text": "[4]다음 기타포괄손익 항목 중 후속적으로 당기손익으로 재분류되지 않는 항목은？\n① 기타포괄손익-공정가치로 측정하는 채무상품으로 분류되는 금융자산에서 발생한 평가손익\n② 해외사업장의 재무제표 환산으로 인한 손익\n③ 현금흐름위험회피의 위험회피수단평가손익 중 효과적인 부분\n④ 확정급여제도의 재측정요소", "answer": 4}, {"year": "2024", "month": "3", "qnum": 15, "text": "[15]㈜삼일은 ㈜용산의 주식을 취득하고, 이를 당기손익-공정가치 측정 금융자산으로 분류하였다. ㈜용산의\n주식과 관련된 자료가 아래와 같고, 다른 거래가 없다고 가정할 경우, 다음 설명 중 옳은 것은(단，㈜\n용산 주식의 취득과 처분은 공정가치로 한다)?\n구 분 20X1년 기중 20X1년 기말 20X2년 기말 20X3년 기중\n회계처리 취득 후속평가 후속평가 처분\n공정가치 100,000원 110,000원 90,000원 120,000원\n거래원가 1,000원 - - -\n① 20×1년 당기손익-공정가치 측정 금융자산의 취득원가는 101,000원 이다.\n② 당기손익-공정가치 측정 금융자산에 대한 회계처리가 20×1년 당기순이익에 미치는 영향은 10,000\n원 증가이다.\n③ 당기손익-공정가치 측정 금융자산에 대한 회계처리가 20×2년 기타포괄이익에 미치는 영향은\n20,000원 감소이다.\n④ 당기손익-공정가치 측정 금융자산에 대한 회계처리가 20×3년 당기순이익에 미치는 영향은 30,000\n원 증가이다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 16, "text": "[16]다음 중 금융자산의 분류에 관한 설명으로 옳지 않은 것은?\n① 계약상 현금흐름이 원리금으로 구성되어 있고, 사업모형이 계약상 현금흐름의 수취와 금융자산 매도\n의 목적을 모두 가지고 있는 경우 기타포괄손익-공정가치 측정 금융자산으로 분류한다.\n② 원리금 수취만의 목적으로 보유하는 채무상품에 대해 회계불일치를 제거하기 위해 최초 인식 시점에\n당기손익-공정가치 측정 금융자산으로 지정할 수 있다.\n③ 계약상 현금흐름이 원리금으로 구성되어 있지 않다면 일반적으로 금융자산을 기타포괄손익-공정가치\n측정 금융자산으로 분류한다.\n④ 단기매매 목적 외의 지분상품에 대한 공정가치 변동을 기타포괄손익으로 인식하기로 최초 인식시점\n에 선택한 경우 기타포괄손익-공정가치 측정 금융자산으로 분류한다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 17, "text": "[17]다음 중 금융부채와 지분상품의 구분에 관한 설명으로 옳지 않은 것은?\n① 자기지분상품으로 결제되거나 결제될 수 있는 계약으로서 변동가능한 수량의 자기지분상품을 인도할\n계약상 의무가 없는 비파생상품은 지분상품으로 구분한다.\n② 거래상대방에게 현금 등 금융자산을 인도하기로 하는 계약상 의무는 금융부채로 구분한다.\n③ 상환우선주 발행자가 보유자에게 미래의 시점에 확정되었거나 결정 가능한 금액을 의무적으로 상환\n해야 하는 경우에는 금융부채로 구분한다.\n④ 상환우선주의 보유자가 발행자에게 특정일이나 그 이후에 확정되었거나 결정 가능한 금액의 상환을\n청구할 수 있는 권리를 보유하고 있는 경우에는 지분상품으로 구분한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 15, "text": "[15]다음 중 상각후원가측정금융자산에 관한 설명으로 옳지 않은 것은?\n① 원칙적으로 지분상품은 상각후원가측정금융자산으로 분류될 수 없다.\n② 상각후원가측정금융자산은 유효이자율법을 적용하여 상각후원가로 평가한다.\n③ 원칙적으로 모든 채무상품은 상각후원가측정금융자산으로 분류한다.\n④ 상각후원가측정금융자산 취득시 지출된 거래원가는 취득원가에 우선 가산한 후 유효이자율법에 의해\n이자수익에 가감된다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 29, "text": "[29]다음 중 재무상태표상 자산·부채의 장부금액과 세무회계상 자산·부채의 가액인 세무기준액의 일시적\n차이를 발생시키는 항목으로 옳지 않은 것은?\n① 당기손익-공정가치측정 금융자산 평가이익\n② 기부금 한도초과액\n③ 정기적금 미수이자\n④ 감가상각비 한도초과액", "answer": 2}, {"year": "2024", "month": "6", "qnum": 15, "text": "[15]다음 중 금융자산의 분류에 관한 설명으로 옳지 않은 것은?\n① 일반적으로 지분증권은 당기손익-공정가치 측정 금융자산으로 분류한다.\n② 회계불일치를 제거하기 위한 목적으로 보유하는 지분상품은 최초 인식시 기타포괄손익-공정가치 측\n정 금융자산으로 지정할 수 있다.\n③ 원리금 수취 목적으로 보유하는 채무상품은 일반적으로 상각후원가측정금융자산으로 분류한다.\n④ 단기매매목적으로 보유하는 지분상품은 기타포괄손익-공정가치 측정 금융자산으로 분류할 수 없다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 16, "text": "[16]㈜삼일은 20X1년 1월 1일에 다음과 같은 조건의 회사채를 취득하였다. 이 사채를 기타포괄손익-공정가\n치 측정 금융자산으로 분류할 경우 20X2년 12월 31일에 인식해야 할 이자수익은 얼마인가(단, 소수점\n이하는 절사한다)?\nㄱ. 발행일 : 20X1년 1월 1일\nㄴ. 액면가액 : 1,000,000원\nㄷ. 만기일 : 20X3년 12월 31일\nㄹ. 표시이자율 : 연 8 % (매년 말 지급조건)\nㅁ. 취득원가 : 950,266원(유효이자율 연 10 % )\n① 80,000원\n② 95,267원\n③ 96,529원\n④ 100,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 17, "text": "[17]다음 중 상각후원가측정금융자산에 관한 설명으로 옳지 않은 것은?\n① 상각후원가측정금융자산은 계약상 현금흐름이 원리금으로만 구성되어 있고, 사업모형이 계약상 현금\n흐름을 수취하는 것인 금융자산을 의미한다.\n② 상각후원가측정금융자산 취득시 지출된 거래원가는 취득원가에 가산한다.\n③ 상각후원가측정금융자산은 유효이자율법을 적용하여 상각후원가로 측정한다.\n④ 상각후원가측정금융자산의 손상차손은 당기비용으로 처리하고, 기타포괄손익에서 조정한다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 15, "text": "[15]다음 중 한국채택국제회계기준에 의한 금융상품의 발행자가 금융상품을 금융부채(financial liability)\n와 지분상품(equity instrument)으로 분류할 때에 관한 설명으로 옳지 않은 것은?\n① 잠재적으로 불리한 조건으로 거래상대방과 금융자산이나 금융부채를 교환하기로 한 계약상 의무는\n금융부채로 분류한다.\n② 인도할 자기지분상품의 수량이 변동가능한 비파생상품은 지분상품으로 분류한다.\n③ 발행자가 보유자에게 미래의 시점에 확정된 금액을 의무적으로 상환해야 하는 의무가 있는 우선주는\n금융부채로 분류한다.\n④ 기업의 자산에서 모든 부채를 차감한 후의 잔여지분을 나타내는 모든 계약은 지분상품으로 분류한\n다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 16, "text": "[16]㈜삼일은 20X1년 4월 1일 ㈜용산의 보통주식을 2,000,000원에 취득하고, 취득에 따른 거래비용 50,000\n원을 지급하였다. 20X1년 말 ㈜용산의 보통주식 공정가치는 1,500,000원 이었으며, ㈜삼일은 20X2년 3\n월 10일 ㈜용산의 보통주식을 1,200,000원에 처분하였다. ㈜용산의 보통주식을 당기손익-공정가치 측정\n금융자산 혹은 기타포괄손익-공정가치 측정 금융자산으로 분류한 경우, ㈜삼일의 회계처리에 관한 설명\n으로 옳지 않은 것은(단, 처분과 관련한 거래비용은 발생하지 않았다)?\n① 당기손익-공정가치 측정 금융자산으로 분류할 경우 취득원가는 2,000,000원이다.\n② 당기손익-공정가치 측정 금융자산으로 분류할 경우 20X1년말 공정가치 평가에 대한 회계처리로 인\n하여 ㈜삼일의 20X1년 당기순이익은 500,000원 감소한다.\n③ 기타포괄손익-공정가치 측정 금융자산으로 분류할 경우 20X1년말 공정가치 평가에 대한 회계처리로\n인하여 ㈜삼일의 20X1년 기타포괄이익은 550,000원 감소한다.\n④ 기타포괄손익-공정가치 측정 금융자산으로 분류할 경우 20X2년 처분에 대한 회계처리로 인하여\n㈜삼일의 20X2년 당기순이익은 850,000원 감소한다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 17, "text": "[17]다음 중 금융자산의 분류에 관한 설명으로 옳지 않은 것은?\n① 원리금 수취만의 목적으로 보유하는 채무상품에 대해 회계불일치를 제거하기 위해 최초 인식 시점에\n당기손익-공정가치 측정 금융자산으로 지정할 수 있다.\n② 계약상 현금흐름이 원리금만으로 구성되어 있지 않다면 일반적으로 금융자산을 당기손익-공정가치\n측정 금융자산으로 분류한다.\n③ 계약상 현금흐름이 원리금으로만 구성되어 있고, 사업모형이 계약상 현금흐름의 수취와 금융자산 매\n도의 목적을 모두 가지고 있는 경우 당기손익-공정가치 측정 금융자산으로 분류한다.\n④ 단기매매 목적 외의 지분상품에 대한 공정가치 변동을 기타포괄손익으로 인식하기로 최초 인식시점\n에 선택한 경우 기타포괄손익-공정가치 측정 금융자산으로 분류한다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 22, "text": "[22]다음 중 자본에서 차감되는 항목으로 옳은 것은?\n① 재평가잉여금\n② 주식발행초과금\n③ 자기주식\n④ 기타포괄손익-공정가치 측정 금융자산 평가이익", "answer": 3}, {"year": "2024", "month": "9", "qnum": 39, "text": "[39]㈜삼일은 기중에 다음과 같은 자금의사결정을 하였다. 아래의 의사결정으로 인한 현금흐름 중 재무활동\n관련 순현금흐름은 얼마인가(단, ㈜삼일은 배당금의 수취 및 지급을 영업활동 현금흐름으로 선택하였\n다)?\n매출채권의 회수 950,000원\n차입금의 상환 1,000,000원\n유형자산의 처분 500,000원\n기타포괄손익-공정가치 측정 금융자산의 취득 1,000,000원\n유상증자 2,000,000원\n급여의 지급 500,000원\n배당금의 지급 800,000원\n① 200,000원 현금유출\n② 500,000원 현금유출\n③ 200,000원 현금유입\n④ 1,000,000원 현금유입", "answer": 4}, {"year": "2024", "month": "11", "qnum": 15, "text": "[15]다음 중 금융상품에 관한 설명으로 옳지 않은 것은?\n① 금융자산은 현금 뿐만 아니라 다른 기업의 지분상품, 거래상대방에게서 현금 등 금융자산을 수취할\n계약상의 권리 등을 포함하는 포괄적인 개념이다.\n② 한국채택국제회계기준은 보유자에게 금융자산을 발생시키고 동시에 상대방에게 금융부채나 지분상품\n을 발생시키는 모든 계약을 금융상품으로 정의하였다.\n③ 매입채무와 미지급금은 금융부채에 해당한다.\n④ 확정수량의 자기지분상품을 인도할 계약상의 의무는 금융부채에 해당한다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 16, "text": "[16]㈜삼일은 ㈜용산의 주식을 취득하고, 이를 기타포괄손익-공정가치 측정 금융자산으로 분류하였다. ㈜용\n산의 주식과 관련된 자료가 아래와 같고, 다른 거래가 없다고 가정할 경우, 다음 설명 중 옳은 것은\n(단，㈜용산 주식의 취득과 처분은 공정가치로 한다)?\n구 분 20X1년 기중 20X1년 기말 20X2년 기말 20X3년 기중\n회계처리 취득 후속평가 후속평가 처분\n공정가치 100,000원 110,000원 90,000원 120,000원\n거래원가 1,000원 - - -\n① 20X1년 기타포괄손익-공정가치 측정 금융자산의 취득원가는 100,000원 이다.\n② 기타포괄손익-공정가치 측정 금융자산에 대한 회계처리가 20X1년 당기순이익에 미치는 영향은\n10,000원 증가이다.\n③ 기타포괄손익-공정가치 측정 금융자산에 대한 회계처리가 20X2년 기타포괄이익에 미치는 영향은\n20,000원 감소이다.\n④ 기타포괄손익-공정가치 측정 금융자산에 대한 회계처리가 20X3년 당기순이익에 미치는 영향은\n30,000원 증가이다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 15, "text": "[15]다음 중 상각후원가 측정 금융자산에 관한 설명으로 옳지 않은 것은?\n① 원칙적으로 지분상품은 상각후원가 측정 금융자산으로 분류될 수 없다.\n② 상각후원가 측정 금융자산은 유효이자율법을 적용하여 상각후원가로 평가한다.\n③ 상각후원가 측정 금융자산으로 분류되기 위해서는 계약상 현금흐름을 수취할 목적으로 보유하는 금\n융자산이어야 한다.\n④ 상각후원가 측정 금융자산 취득시 지출된 거래원가는 취득원가에서 우선 차감한 후 유효이자율법에\n의해 이자수익에 가감된다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 16, "text": "[16]다음 중 금융자산의 신용이 손상된 증거로 볼 수 없는 것은?\n① 이자지급이나 원금상환의 불이행이나 지연과 같은 계약 위반\n② 차입자의 재무적 어려움에 관련된 경제적 또는 법률적 이유로 인한 당초 차입조건의 불가피한 완화\n③ 금융자산 보유자의 파산이나 기타 재무구조조정의 가능성이 높은 상태가 된 경우\n④ 금융자산 발행자의 중요한 재무적 어려움", "answer": 3}, {"year": "2024", "month": "12", "qnum": 17, "text": "[17]다음 중 당기손익-공정가치 측정 금융부채로 분류하기에 옳지 않은 것은?\n① 주로 단기간 내에 재매입할 목적으로 발행하는 금융부채\n② 최초 인식시점에 당기손익인식 항목으로 지정한 금융부채\n③ 공매자(차입한 금융자산을 매도하고 아직 보유하고 있지 않은 자)가 차입한 금융자산을 인도할 의무\n④ 위험회피수단으로 지정되고 위험회피에 효과적인 파생상품", "answer": 4}, {"year": "2025", "month": "1", "qnum": 15, "text": "[15]다음 중 금융자산에 해당하지 않는 것은?\n① 현금\n② 다른 기업의 지분상품\n③ 거래상대방에게 현금 등 금융자산을 인도하기로 한 계약상 의무\n④ 거래상대방에게서 현금 등 금융자산을 수취할 계약상 권리", "answer": 3}, {"year": "2025", "month": "1", "qnum": 16, "text": "[16]㈜삼일은 ㈜용산의 주식을 취득하고, 이를 기타포괄손익-공정가치 측정 금융자산으로 분류 하였다. ㈜\n용산의 주식과 관련된 자료가 아래와 같고, 다른 거래가 없다고 가정할 경우, 20X3년 ㈜용산의 주식처\n분시점에 당기손익으로 인식할 처분이익은 얼마인가(단，㈜용산 주식의 취득과 처분은 공정가치로 한\n다)?\n구 분 20X1년 기중 20X1년 기말 20X2년 기말 20X3년 기중\n회계처리 취득 후속평가 후속평가 처분\n공정가치 100,000원 110,000원 90,000원 120,000원\n거래원가 1,000원 - - -\n① 0원\n② 19,000원\n③ 20,000원\n④ 30,000원", "answer": 1}, {"year": "2025", "month": "3", "qnum": 15, "text": "[15]다음 중 금융자산의 분류에 관한 설명으로 옳지 않은 것은?\n① 일반적으로 지분증권은 당기손익-공정가치 측정 금융자산으로 분류한다.\n② 단기매매목적으로 보유하는 지분상품은 기타포괄손익-공정가치 측정 금융자산으로 분류할 수 없다.\n③ 계약상 현금흐름이 원리금으로만 구성되고 사업모형이 계약상 현금흐름 수취인 채무증권은 상각후원\n가 측정 금융자산으로 분류한다.\n④ 계약상 현금흐름이 원리금으로만 구성되고 사업모형이 계약상 현금흐름의 수취와 금융자산의 매도인\n채무증권은 당기손익-공정가치 측정 금융자산으로 분류한다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 16, "text": "[16]㈜삼일은 20X1년 1월 1일에 다음과 같은 조건의 회사채를 취득하였다. 이 사채를 기타포괄손익-공정가\n치 측정 금융자산으로 분류할 경우 20X2년 12월 31일에 인식해야 할 이자수익은 얼마인가(단, 계산과\n정에서 단수차이가 발생할 경우 가장 근사치를 선택한다)?\nㄱ. 발행일 : 20X1년 1월 1일\nㄴ. 액면금액 : 1,000,000원\nㄷ. 만기일 : 20X3년 12월 31일\nㄹ. 표시이자율 : 연 8 % (매년 말 지급조건)\nㅁ. 취득원가 : 950,266원(유효이자율 연 10 %)\nㅂ. 20X1년 12월 31일 공정가치 : 800,000원\nㅅ. 20X2년 12월 31일 공정가치 : 960,000원\n① 80,000원\n② 95,267원\n③ 96,529원\n④ 100,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 35, "text": "[35]기능통화가 원화인 ㈜삼일은 20X1년 1월 10일에 타회사의 지분상품을 $ 5,000에 취득하였다. ㈜삼일\n은 지분상품을 기타포괄손익-공정가치측정금융자산으로 분류하였다. 20X1년 말 지분상품의 공정가치는\n$ 5,500이며, 관련 환율은 다음과 같다.\n일자 20X1. 1. 10 20X1. 12. 31\n환율(￦ / $) 1,200 1,100\n위 지분상품과 관련된 회계처리가 ㈜삼일의 20X1년 당기순이익에 미치는 영향은 얼마인가?\n① 0원\n② 20,000원 증가\n③ 30,000원 증가\n④ 50,000원 증가", "answer": 1}, {"year": "2025", "month": "5", "qnum": 15, "text": "[15]다음 중 금융상품에 관한 설명으로 옳지 않은 것은?\n① 금융상품은 거래당사자에게 금융자산을 발생시키고 동시에 거래상대방에게 금융부채나 지분상품을\n발생시키는 모든 계약을 말한다.\n② 미지급법인세는 금융부채에 해당하지 않는다.\n③ 기업자신의 지분상품을 수취하기로 한 계약은 금융자산이 될 수 없다.\n④ 잠재적으로 유리한 조건으로 거래상대방과 금융자산이나 금융부채를 교환하기로 한 계약상 권리는\n금융자산이다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 16, "text": "[16]㈜삼일은 20X1년 1월 1일에 다음과 같은 조건의 상각후원가 측정 금융자산을 취득 당시의 공정가치로\n취득하였다. 이 경우 ㈜삼일의 재무상태표상 상각후원가 측정 금융자산의 20X1년 말 장부금액을 계산하\n면 얼마인가(단, 단수차이로 인해 오차가 발생하면 가장 근사치를 선택한다)?\nㄱ. 액면금액 : 300,000원\nㄴ. 발행일 : 20X1년 1월 1일\nㄷ. 만기일 : 20X2년 12월 31일(2년)\nㄹ. 액면이자율 : 5 %, 매년 말 지급조건\nㅁ. 시장이자율 : 20X1년 1월 1일 현재 8 %, 20X1년 12월 31일 현재 9 %\nㅂ. 현가계수\n현가계수\n이자율\n1년 2년 계\n5 % 0.95238 0.90703 1.85941\n8 % 0.92593 0.85734 1.78327\n9 % 0.91743 0.84168 1.75911\n① 283,950원\n② 288,991원\n③ 291,667원\n④ 300,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 15, "text": "[15]다음 중 금융자산의 분류에 관한 설명으로 옳지 않은 것은?\n① 원리금 수취만의 목적으로 보유하는 채무상품에 대해 회계불일치를 제거하기 위해 최초 인식 시점에\n당기손익-공정가치 측정 금융자산으로 지정할 수 있다.\n② 계약상 현금흐름이 원리금만으로 구성되어 있지 않다면 일반적으로 금융자산을 상각후원가 측정 금\n융자산으로 분류한다.\n③ 계약상 현금흐름이 원리금으로만 구성되어 있고, 사업모형이 계약상 현금흐름의 수취와 금융자산 매\n도의 목적을 모두 가지고 있는 경우 기타포괄손익-공정가치 측정 금융자산으로 분류한다.\n④ 단기매매 목적 외의 지분상품에 대한 공정가치 변동을 기타포괄손익으로 인식하기로 최초 인식시점\n에 선택한 경우 기타포괄손익-공정가치 측정 금융자산으로 분류한다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 15, "text": "[15]다음 중 금융자산의 분류에 관한 설명으로 옳지 않은 것은?\n① 금융자산은 금융자산의 계약상 현금흐름 특성과 금융자산의 관리를 위한 사업모형에 근거하여 분류\n한다.\n② 금융자산의 현금흐름이 원리금만으로 구성되어 있지 않다면 일반적으로 기타포괄손익-공정가치 측정\n금융자산으로 분류한다.\n③ 계약상 현금흐름이 원리금으로만 구성되어 있고 사업모형이 계약상 현금흐름 수취목적인 경우에는\n상각후원가 측정 금융자산으로 분류한다.\n④ 계약상 현금흐름이 원리금으로만 구성되어 있고 사업모형이 계약상 현금흐름의 매도목적인 경우에는\n당기손익-공정가치 측정 금융자산으로 분류한다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 16, "text": "[16]㈜삼일의 단기매매목적으로 취득한 금융자산의 취득, 처분내역은 다음과 같다. 20X1년 ㈜삼일의 포괄손\n익계산서에 보고될 당기손익-공정가치 측정 금융자산의 평가손익은 얼마인가?\n20X1년 1월 7일 : 주당 액면금액이 500원인 ㈜용산의 주식 10주를 주당 2,000원에 취득하였으\n며, 취득과 직접 관련되는 거래원가는 주당 500원이다.\n20X1년 9월 10일 : ㈜용산 주식 중 4주를 주당 2,000원에 처분하였다.\n20X1년 12월 31일 : ㈜용산 주식의 공정가치는 주당 3,000원이었다.\n① 평가이익 0원\n② 평가이익 3,000원\n③ 평가이익 6,000원\n④ 평가이익 9,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 17, "text": "[17]다음 중 금융부채와 지분상품에 관한 설명으로 옳지 않은 것은?\n① 거래상대방에게 현금 등 금융자산을 인도하기로 하는 계약상 의무는 금융부채로 분류한다.\n② 자기지분상품으로 결제되거나 결제될 수 있는 계약으로서, 변동가능한 수량의 자기지분상품을 인도\n할 계약상 의무가 있는 비파생상품은 금융부채로 분류한다.\n③ 상환우선주의 발행자가 보유자에게 미래의 시점에 확정되었거나 결정 가능한 금액을 의무적으로 상\n환해야 하는 상환우선주는 금융부채로 분류한다.\n④ 상환우선주의 보유자가 발행자에게 특정일이나 그 이후에 확정되었거나 결정 가능한 금액의 상환을\n청구할 수 있는 권리를 보유하고 있는 상환우선주는 지분상품으로 분류한다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 15, "text": "[15]다음 중 기타포괄손익-공정가치 측정 금융자산에 관한 설명으로 옳지 않은 것은?\n① 기타포괄손익-공정가치 측정 금융자산은 공정가치로 평가하여 평가손익을 기타포괄손익으로 반영한\n다.\n② 기타포괄손익-공정가치 측정 금융자산으로 분류되는 채무상품을 처분할 경우 당기나 과거기간에 기\n타포괄손익으로 인식된 평가손익을 당기손익으로 재분류한다.\n③ 기타포괄손익-공정가치 측정 금융자산 취득시 지출된 거래원가는 취득원가에 가산하여 측정한다.\n④ 기타포괄손익-공정가치 측정 금융자산으로 분류되는 채무상품에 대한 손상차손은 인식하지 아니한\n다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 16, "text": "[16]㈜삼일은 20X1년 4월 1일 ㈜용산의 주식 100주를 21,000원에 취득하여 당기손익-공정가치 측정 금융\n자산으로 분류하였다. 또한 ㈜삼일은 20X1년 7월 1일 ㈜한양의 주식 200주를 42,000원에 취득하여 기\n타포괄손익-공정가치 측정 금융자산으로 분류하였다. 20X1년 말 ㈜용산의 주식 100주의 공정가치는\n24,000원이며, ㈜한양의 주식 200주의 공정가치는 53,000원이다. ㈜삼일은 20X2년 8월 1일에 ㈜용산\n의 주식 100주를 전부 27,000원에 처분하였으며, ㈜한양의 주식 200주를 전부 57,000원에 처  "answer": 2}, {"year": "2024", "month": "6", "qnum": 17, "text": "[17]다음 중 전환사채에 관한 설명으로 옳지 않은 것은?\n① 전환사채는 부채요소와 자본요소를 모두 가지고 있는 복합금융상품에 해당한다.\n② 전환사채의 전환권조정은 사채할인발행차금과 유사하게 상환기간동안 유효이자율법을 적용하여 상각\n하고 상각된 금액은 이자비용으로 인식한다.\n③ 신주인수권부사채는 유가증권의 소유자가 사전에 약정된 가격으로 보통주의 발행을 청구할 수 있는\n권리가 부여된 사채를 의미한다.\n④ 상환할증금지급조건부 전환사채의 장부금액은 전환사채의 액면금액에서 전환권조정을 차감한 금액과\n같다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 18, "text": "[18]다음 중 금융부채에 관한 설명으로 옳지 않은 것은?\n① 금융부채는 원칙적으로 최초 인식시 공정가치로 인식한다.\n② 당기손익-공정가치 측정 금융부채와 관련되는 거래원가는 당기손익으로 처리한다.\n③ 사채의 상환손익이 발생하는 이유는 상환일의 시장이자율이 발행일의 액면이자율과 다르기 때문이\n다.\n④ 연속상환사채의 발행금액은 원칙적으로 사채로부터 발생하는 미래현금흐름을 사채 발행시점의 시장\n이자율로 할인한 현재가치가 된다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 19, "text": "[19]㈜삼일은 20X1년 1월 1일에 만기 3년, 액면금액 50,000,000원, 표시이자율 연 6 % 인 사채를 발행하\n였다. 이자는 매년 말에 지급되고 사채 발행시점의 유효이자율은 연 8 % 라고 할 때, 20X2년도에 감소\n되는 사채할인발행차금은 얼마인가(단, 단수차이가 발생하는 경우 가장 근사치를 답으로 선택한다)?\n8 % 1년 2년 3년 합계\n현가계수 0.92593 0.85734 0.79383 2.57710\n① 793,824원\n② 857,330원\n③ 925,930원\n④ 1,651,170원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 39, "text": "[39]현금의 유입과 유출이 없는 중요한 거래는 현금흐름표에는 표시되지 않지만 재무제표를 이해하는데 목\n적적합한 정보인 경우 주석으로 표시한다. 다음 중 현금의 유입과 유출이 없는 거래로 옳지 않은 것은?\n① 현물출자로 인한 유형자산의 취득\n② 사채의 발행\n③ 전환사채의 전환\n④ 무상증자", "answer": 2}, {"year": "2024", "month": "7", "qnum": 18, "text": "[18]㈜삼일은 20X1년 1월 1일 액면금액 1,000,000원, 표시이자율 연 10 %, 만기 2년인 사채를 966,199원\n에 할인발행하였다. 사채의 발행당시 유효이자율이 연 12 % 일 때 ㈜삼일이 사채발행으로 인하여 만기\n2년 동안 인식해야 할 총 이자비용은 얼마인가?\n① 187,543원\n② 200,000원\n③ 233,801원\n④ 256,240원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 19, "text": "[19]다음 중 사채의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 사채발행비는 사채의 발행금액에서 차감한다.\n② 사채발행비가 없는 상황에서, 사채를 조기상환하는 경우 상환일의 시장이자율이 발행일의 시장이자\n율보다 높으면 사채상환이익이 발생한다.\n③ 사채할인발행차금은 유효이자율법을 적용하여 상각하고 상각액을 사채이자에서 차감한다.\n④ 사채할증발행차금은 당해 사채의 액면금액에 부가하는 형식으로 기재한다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 18, "text": "[18]㈜삼일은 20X1년 1월 1일 사채(액면 1,000,000원, 표시이자율 연 10 %, 이자지급일 매년 12월 31일\n후급, 만기 3년)를 951,963원에 발  "month": "3", "qnum": 19, "text": "[19]㈜삼일은 20X1년 1월 1일 사채(액면 1,000,000원, 표시이자율 연 10 %, 이자지급일 매년 12월 31일\n후급, 만기 3년)를 951,963원에 발행하였다. ㈜삼일이 동 사채를 20X3년 1월 1일 990,000원에 상환\n할 경우 이로 인한 사채상환손익을 계산하면 얼마인가(단, 계산과정에서 단수차이가 발생할 경우 가장\n근사치를 선택하고, 20X1년 1월 1일의 시장이자율은 연 12 % 이며, 사채할인발행차금은 유효이자율법\n으로 상각한다)?\n① 사채상환이익 7,858원\n② 사채상환손실 7,858원\n③ 사채상환이익 152,822원\n④ 사채상환손실 152,822원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 17, "text": "[17]다음 중 금융부채 등의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 사채의 발행회사가 자기가 발행한 사채(자기사채)를 재취득한 경우에는 사채의 조기상환으로 보아\n재취득금액과 사채 장부금액의 차액을 사채상환손익으로 회계처리한다.\n② 상환우선주의 보유자가 상환을 청구할 수 있는 권리를 보유하는 경우, 해당 상환우선주의 발행자는\n동 상환우선주를 금융부채로 분류한다.\n③ 금융부채는 계약상 의무가 이행, 취소 또는 만료되어 소멸한 경우 재무상태표에서 제거한다.\n④ 기존 채무자와 채권자가 실질적으로 다른 조건으로 채무상품을 교환하여 금융부채의 조건이 실질적\n으로 변경된 경우에는 기존의 금융부채를 제거하지 않고, 조건변경에 따른 손익을 당기손익으로 인\n식한다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 18, "text": "[18]㈜삼일은 20X1년 1월 1일에 만기 3년, 액면금액 500,000원, 표시이자율 연 6 % 인 사채를 발행하였\n다. 이자는 매년 말에 지급되고 사채 발행시점의 유효이자율은 연 8 % 라고 할 때, ㈜삼일이 동 사채의\n발행기간에 걸쳐 인식하게 될 총이자비용은 얼마인가?\n현가계수\n이자율\n1 년 2 년 3 년 합 계\n8 % 0.92593 0.85734 0.79383 2.57710\n① 104,871원\n② 115,772원\n③ 124,230원\n④ 150,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 19, "text": "[19]다음 중 전환사채에 관한 설명으로 옳지 않은 것은?\n① 전환사채의 발행금액에는 원칙적으로 전환권대가가 포함된다.\n② 전환권대가는 전환사채의 총발행금액에서 전환권이 없는 일반사채의 발행금액을 차감한 금액으로 한\n다.\n③ 상환할증금 지급조건의 경우 액면이자율이 보장수익률보다 낮다.\n④ 전환사채의 회계처리시 발생하는 전환권조정은 자본의 일부로 표시한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 18, "text": "[18]㈜삼일은 20X1년 1월 1일 액면금액 1,000,000원, 액면이자율 연 8 % (매년 말 이자지급), 만기 3년인\n회사채를 974,683원에 발행하였다. 동 사채의 20X1년 이자비용은 87,722원 이었으며, 사채할인발행차\n금에 대하여 유효이자율법으로 상각하고 있다. ㈜삼일의 20X2년말 재무상태표에 표시할 사채의 장부금\n액은 얼마인가(단, 단수차이가 발생하는 경우 가장 근사치를 선택한다)?\n① 974,683원\n② 982,404원\n③ 990,821원\n④ 1,000,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 19, "text": "[19]다음 중 복합금융상품에 관한 설명으로 옳지 않은 것은?\n① 전환사채는 부채요소와 자본요소를 모두 가지고 있는 복합금융상품에 해당한다.\n② 전환사채의 전환권조정은 사채할인발행차금과 유사하게 상환기간동안 유효이자율법을 적용하여 상각\n하고 상각된 금액은 이자비용으로 118\n이며, 3년의 연금현재가치계수는 2.4018이다)\n① 0원\n② 74,580원\n③ 132,480원\n④ 288,120원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 17, "text": "[17]다음 중 금융부채에 관한 설명으로 옳지 않은 것은?\n① 금융부채는 원칙적으로 최초 인식시 공정가치로 인식한다.\n② 당기손익-공정가치 측정 금융부채와 관련되는 거래원가는 최초 인식하는 공정가치에 차감하여 측정\n한다.\n③ 사채발행비가 없는 경우, 사채의 상환손익이 발생하는 이유는 상환일의 시장이자율이 발행일의 시장\n이자율과 다르기 때문이다.\n④ 사채발행비가 없는 경우, 연속상환사채의 발행금액은 사채로부터 발생하는 미래현금흐름을 사채 발\n행시점의 시장이자율로 할인한 현재가치가 된다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 19, "text": "[19]다음 중 신주인수권부사채에 관한 설명으로 옳지 않은 것은?\n① 신주인수권부사채는 유가증권의 소유자가 사전에 약정된 가격으로 보통주의 발행을 청구할 수 있는\n권리가 부여된 사채를 말한다.\n② 신주인수권부사채에 부여된 신주인수권이 행사되는 경우, 해당 신주인수권부사채는 소멸한다.\n③ 신주인수권부사채에 부여된 신주인수권은 사채와 분리되어 거래될 수 있는데, 이를 분리형신주인수\n권부사채라고 한다.\n④ 신주인수권부사채의 발행자는 신주인수권의 가치를 사채와 별도로 분리하여 인식한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 19, "text": "[19]㈜삼일은 20X2년 12월 31일 현재의 장부금액이 289,091원(액면금액 300,000원, 액면이자율 연 6 %,\n이자지급일 매년 12월 31일 후급, 만기 20X3년 12월 31일)인 사채를 20X3년 6월 30일 발생이자를\n포함하여 총 300,000원에 상환하였다. ㈜삼일이 사채상환과 관련하여 인식할 손익을 계산하면 얼마인가\n(단, 발행 당시 사채의 유효이자율은 연 10 % 이고, 기간계산은 월할로 계산한다. 계산금액은 소수점\n첫째자리에서 반올림하고, 가장 근사치를 답으로 선택한다)?\n① 사채상환손실 3,546원\n② 사채상환손실 5,454원\n③ 사채상환이익 3,546원\n④ 사채상환이익 5,454원", "answer": 3}], "09_자본": [{"year": "2024", "month": "1", "qnum": 22, "text": "[22]㈜삼일은 20X1년 초 설립된 회사로 설립시에 보통주와 우선주를 모두 발행하였다. 설립일 이후 자본금\n의 변동은 없었으며, 20X1년 12월 31일 현재 보통주자본금과 우선주자본금은 다음과 같다.\n구분 주당액면금액 발행주식수 자본금\n보통주 1,000원 1,000주 1,000,000원\n우선주(*) 1,000원 500주 500,000원\n* 우선주의 배당률은 5 % 이며, 비누적적·완전참가적 우선주이다.\n㈜삼일은 20X1년 12월 31일로 종료되는 회계연도의 정기주주총회에서 배당금 총액을 270,000원으로\n선언할 예정인 경우 보통주 주주에게 배분될 배당금은 얼마인가?\n① 90,000원\n② 120,000원\n③ 160,000원\n④ 180,000원", "answer": 4}, {"year": "2024", "month": "1", "qnum": 31, "text": "[31]다음 중 기본주당이익의 계산에 관한 설명으로 옳지 않은 것은?\n① 당해 회계기간과 관련한 누적적 우선주에 대한 세후배당금은 배당결의 여부에 관계없이 당기순손익\n에서 차감한다.\n② 기본주당이익은 보통주에 귀속되는 특정 회계기간의 당기순손익을 그 기간의 유통된 보통주식수를\n가중평균한 주식수로 나누어 계산한다.\n③ 당기 중에 공정가치로 유상증자를 실시한 경우, 당해 사건이 있기 전의 유통보통주식수를 비교표시\n되는 최초기간의 개시일에 그 사건이 일어난 것처럼 비례적으로 조정한다.\n④ 자기주 um": 32, "text": "[32]다음은 ㈜삼일의 제11기(20X1년 1월 1일 ~ 20X1년 12월 31일) 당기순이익과 자본금 변동상황에 대\n한 자료이다. 이를 이용하여 ㈜삼일의 20X1년도 기본주당순이익을 계산하면 얼마인가(단, 가중평균유통\n보통주식수는 월할로 계산한다)?\nㄱ. 당기순이익 : 27,000,000원\nㄴ. 자본금변동사항(액면금액 500원)\n보통주자본금\n기 초 5,000주 2,500,000원\n4월1일 공정가치로 유상증자 2,000주 1,000,000원\nㄷ. 20X1년 7월 1일에 자기주식(보통주) 1,000주를 1,000,000원에 취득\n① 3,000원\n② 3,500원\n③ 4,000원\n④ 4,500원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 21, "text": "[21]다음은 ㈜삼일의 자본변동표이다. 다음 중 자본변동표 표시방법으로 옳지 않은 것은?\n자본변동표\n㈜삼일 제12기 20X1년1월1일부터 20X1년 12월 31일까지 (단위 : 백만원)\n이익\n구분 자본금 자본잉여금 자본조정 합계\n잉여금\n기초 XXX XXX XXX XXX XXX\n① 유상증자 100 - - - 100\n② 자기주식취득 30 - - 30\n③ 당기순이익 - - - 10 10\n④ 현금배당금 지급 - - - (20) (20)\n기말 XXX XXX XXX XXX XXX", "answer": 2}, {"year": "2024", "month": "11", "qnum": 22, "text": "[22]㈜삼일은 20X1년 초 설립된 회사로 설립시에 보통주와 우선주를 모두 발행하였다. 설립일 이후 자본금\n의 변동은 없었으며, 20X2년 12월 31일 현재 보통주자본금과 우선주자본금은 다음과 같다. ㈜삼일은\n설립된 이후 어떠한 배당도 하지 않았으나 20X2년 12월 31일로 종료되는 회계연도의 정기주주총회에서\n배당금 총액을 190,000원으로 선언할 예정일 경우, 우선주 주주에게 배분될 배당금을 계산하면 얼마인\n가?\n구분 주당액면금액 발행주식수 자본금\n보통주 1,000원 1,000주 1,000,000원\n우선주(*) 1,000원 500주 500,000원\n* 누적적·완전 참가적 우선주, 배당률 5 %\n① 25,000원\n② 50,000원\n③ 75,000원\n④ 80,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 32, "text": "[32]다음 중 기본주당이익의 계산에 관한 설명으로 옳지 않은 것은?\n① 당해 회계기간과 관련한 누적적 우선주에 대한 세후배당금은 배당결의 여부에 관계없이 당기순이익\n에서 차감한다.\n② 기본주당이익은 보통주에 귀속되는 특정 회계기간의 당기순손익을 그 기간의 유통된 보통주식수를\n가중평균한 주식수로 나누어 계산한다.\n③ 자기주식은 취득시점 이후부터 매각시점까지의 기간동안 유통보통주식수에 포함하지 아니한다.\n④ 기중에 유상증자 등으로 발행된 신주에 무상증자가 실시된 경우에는 기초에 실시된 것으로 간주하여\n가중평균유통보통주식수를 조정한다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 34, "text": "[34]20X1년 초 ㈜삼일은 ㈜한양의 보통주 40 % 를 900,000원에 취득하여 유의적인 영향력을 행사하게 되었\n다. 주식취득일 현재 ㈜한양의 순자산장부금액은 2,000,000원으로 공정가치와 동일하였다. ㈜한양의\n20X1년 당기순이익이 300,000원이고, 총포괄이익이 500,000원이라고 할 때 이를 반영하는 회계처리가\n㈜삼일의 20X1년도 기타포괄이익에 미치는 영향은 얼마인가?\n① 40,000원 증가\n② 40,000원 감소\n③ 80,000원 증가\n④ 80,000원 감소", "answer": 3}, {"year": "2024", "month": "12", "qnum": 21, "text": "[21]다음 중 이익잉여금의 처분거래가 아닌 것은?\n① 자기주식  "qnum": 21, "text": "[21]다음 중 자본거래가 각 자본항목에 미치는 영향에 관한 설명으로 옳지 않은 것은?\n주식배당 무상증자 현금배당\n① 이익잉여금 감소 감소가능 감소\n② 주식수 증가 증가 불변\n③ 자본금 증가 증가 불변\n④ 총자본 불변 불변 증가", "answer": 4}, {"year": "2025", "month": "9", "qnum": 22, "text": "[22]다음은 20X1년 1월 1일에 설립된 ㈜삼일의 자기주식과 관련된 거래 내용이다. 자기주식과 관련한 회계\n처리가 ㈜삼일의 20X1년 자본총계에 미치는 영향은 얼마인가(단, ㈜삼일은 주당 액면금액 5,000원의\n보통주식 2,000주를 15,000,000원에 발행하여 설립되었다)?\n∙20X1년 3월 2일 : 자기주식 20주를 주당 7,000원에 구입\n∙20X1년 3월 31일 : 자기주식 10주를 소각\n∙20X1년 4월 10일 : 자기주식 6주를 주당 7,500원에 매각\n∙20X1년 4월 20일 : 자기주식 4주를 주당 5,200원에 매각\n① 50,000원 감소\n② 74,200원 감소\n③ 100,000원 감소\n④ 124,200원 감소", "answer": 2}, {"year": "2025", "month": "9", "qnum": 32, "text": "[32]다음 중 기본주당이익의 계산에 관한 설명으로 옳지 않은 것은(단, 유상증자는 공정가치로 실시 되었다\n고 가정한다)?\n① 기본주당이익은 보통주에 귀속되는 특정 회계기간의 당기순손익을 그 기간에 유통된 보통주식수를\n가중평균한 주식수로 나누어 계산한다.\n② 보통주에 귀속되는 당기순이익은 포괄손익계산서상의 당기순이익에서 세후 보통주배당금을 차감하여\n산정한다.\n③ 당기 중에 유상증자로 보통주가 발행된 경우에는 가중평균유통보통주식수를 당해 주식의 납입일을\n기준으로 기간경과에 따라 가중평균하여 조정한다.\n④ 당기 중에 유상증자로 발행된 신주에 대하여 무상증자가 실시된 경우에는 무상증자가 당해 유상신주\n의 납입일에 실시된 것으로 간주하여 가중평균유통보통주식수를 조정한다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 34, "text": "[34]20X1년 1월 1일 ㈜삼일은 ㈜용산의 보통주 30 % 를 800,000원에 취득하여 유의적인 영향력을 행사하\n게 되었으며, 취득 당시 ㈜용산의 순자산 장부금액과 공정가치는 2,000,000원으로 동일하였다. 20X1년\n㈜용산의 자본은 아래와 같으며, 당기순손익과 기타포괄손익 이외에 자본의 변동은 없다고 가정한다.\n20X1년 말 ㈜삼일의 관계기업투자주식의 장부금액을 계산하면 얼마인가?\n20X1년 1월 1일 20X1년 12월 31일\n자본금 600,000원 600,000원\n이익잉여금 1,100,000원 1,300,000원\n기타포괄손익누계액 300,000원 400,000원\n합계 2,000,000원 2,300,000원\n① 820,000원\n② 860,000원\n③ 890,000원\n④ 930,000원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 21, "text": "[21]다음 중 현금배당과 주식배당에 관한 설명으로 옳은 것은?\n① 현금배당을 실시하면 이익잉여금이 감소하지만, 주식배당의 경우에는 이익잉여금의 변동이 없다.\n② 현금배당 및 주식배당 모두 자본총계가 감소하게 된다.\n③ 현금배당을 실시하면 자본금에 변동이 없지만 주식배당의 경우에는 자본금이 증가한다.\n④ 현금배당을 실시하면 부채비율이 증가하지만, 주식배당의 경우에는 부채비율이 감소한다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 22, "text": "[22]결산일이 12월 31일인 ㈜삼일의 유상증자 관련 자료가 다음과 같을 때 유상증자가 ㈜삼일의 총자본에\n미치는 영향은 얼마인가?\n⦁ 20X1년 5월 1일에 현금을 납입받고 보통주 2,000주를 유상증자하였다.\n⦁ 주당 액면금액과 발행금액은 각각 5,000원과 8,000원이다.\n⦁ 유상증자와 직접 관련된 원가 100,000원이 발생하였다.\n⦁ 유상증자 직전 장부에는 500,000원의 주식할인발행차금이 계상되어 있었다.\n① 9,900,000원 증가\n② 10,000,000원 증가\n③ 15,400,000원 증가\n④ 15,900,000원 증가", "answer": 4}, {"year": "2025", "month": "11", "qnum": 32, "text": "[32]㈜삼일의 20X1년 당기순이익은 12,000,000원이며, 우선주배당금은 2,000,000원이다. ㈜삼일의 20X1년\n1월 1일 유통보통주식수는 18,000주이며, 5월 1일에는 자기주식 3,000주를 취득하였다. ㈜삼일의\n20X1년 기본주당순이익은 얼마인가(단, 가중평균 유통보통주식수는 월할로 계산하고, 단수차이로 인해\n오차가 있다면 가장 근사치를 선택한다)?\n① 476원\n② 556원\n③ 625원\n④ 667원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 21, "text": "[21]다음 중 자본변동표에 관한 설명으로 옳지 않은 것은?\n① 자본의 각 구성요소별로 당기순손익, 기타포괄손익의 각 항목, 소유주로서의 자격을 행사하는 소유\n주와의 거래 등에 따른 변동액을 구분하여 표시한다.\n② 자기주식의 소각으로 인한 감자차익은 자본변동표상 이익잉여금의 감소로 표시한다.\n③ 재무상태표에 표시되어 있는 자본의 각 구성요소별로 기초시점과 기말시점의 장부금액, 조정내역을\n제공한다.\n④ 지배기업의 소유주와 비지배지분에게 각각 귀속되는 금액으로 구분하여 표시한 해당 기간의 총포괄\n손익을 표시한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 22, "text": "[22]㈜삼일은 20X1년 초 설립된 회사로 설립시에 보통주와 우선주를 모두 발행하였다. 설립일 이후 자본금\n의 변동은 없었으며, 20X2년 12월 31일 현재 보통주자본금과 우선주자본금은 다음과 같다. ㈜삼일은\n설립된 이후 어떠한 배당도 하지 않았으나 20X2년 12월 31일로 종료되는 회계연도의 정기주주총회에서\n배당금 총액을 160,000원으로 선언할 예정일 경우, 우선주 주주에게 배분될 배당금을 계산하면 얼마인\n가?\n구분 주당액면금액 발행주식수 자본금\n보통주 1,000원 1,000주 1,000,000원\n우선주(*) 1,000원 500주 500,000원\n* 누적적·완전 참가적 우선주, 배당률 5 %\n① 25,000원\n② 50,000원\n③ 70,000원\n④ 80,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 32, "text": "[32]다음 중 기본주당이익의 계산에 관한 설명으로 옳지 않은 것은?\n① 당해 회계기간과 관련한 누적적 우선주에 대한 세후배당금은 배당결의 여부에 관계없이 당기순손익\n에서 차감한다.\n② 기본주당이익은 보통주에 귀속되는 특정 회계기간의 당기순손익을 그 기간의 유통된 보통주식수를\n가중평균한 주식수로 나누어 계산한다.\n③ 보고기간 중 공정가치 미만으로 유상증자가 실시된 경우 무상증자가 먼저 실시된 후 공정가치 기준\n의 유상증자가 실시된 것으로 간주하여 가중평균유통보통주식수를 계산한다.\n④ 자기주식은 취득시점 이후부터 매각시점까지의 기간동안 가중평균유통보통주식수에 포함하지 아니한\n다.", "answer": 3}], "10_수익인식(계약부채·계약자산)": [{"year": "2024", "month": "1", "qnum": 23, "text": "[23]다음 중 수익인식 기준에 관한 설명으로 옳지 않은 것은?\n① 고객충성제도를 시행하는 경우 보상점수에 배분하는 대가는 상대적 개별판매가격에 따라 배분된 금\n액이다.\n② 매출에 용역유형의 보증을 제공하는 경우 총 판매금액을 수익으로 인식하고 보증에 대해서는 충당부\n채를 인식한다.\n③ 라이선스 계약이 접근권에 해당하면 일정기간 동안 권리를 부여하는 수행의무가 부여된 것이므로 그\n기간에 걸쳐 수익을 인식한다.\n④ 반품권이 있는 판매는 반품이 예상되는 제품에 대해서는 수익을 인식하지 않고, 환불부채로 인식한\n다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 24, "text": "[24]㈜삼일은 고객의 구매액 2원당 1포인트의 고객충성포인트를 고객에게 부여하는 고객충성제도를 운영하\n고 있다. 각 포인트는 고객이 미래에 기업의 제품을 구매할 때 1원을 할인받을 수 있다. ㈜삼일은\n20X1년에 제품을 400,000원에 판매하고, 200,000포인트를 고객에게 부여하였다. 제품의 개별 판매가격\n은 400,000원이다. ㈜삼일은 부여한 포인트 중 50 % 가 교환될 것으로 예상하였고, 부여한 200,000포\n인트의 개별판매가격을 100,000원으로 추정하였다. 이러한 예상은 20X1년 말까지 변함이 없다고 가정\n한다. 20X1년에 실제 교환된 포인트가 20,000포인트일 때, 20X1년 말 재무상태표에 표시될 계약부채는\n얼마인가?\n① 32,000원\n② 48,000원\n③ 64,000원\n④ 80,000원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 25, "text": "[25]㈜삼일건설은 ㈜용산과 20X1년 7월 1일 총 계약금액 50,000,000원의 공장신축공사계약을 체결하였다.\n㈜삼일건설이 진행기준으로 수익을 인식한다면 ㈜삼일건설의 20X2년 말 재무상태표상 계약자산(미청구\n공사) 또는 계약부채(초과청구공사)는 얼마인가(단, 진행률은 누적발생원가에 기초하여 산정한다)?\n20X1년 20X2년 20X3년\n누적발생계약원가 5,000,000원 30,000,000원 40,000,000원\n추정총계약원가 40,000,000원 40,000,000원 40,000,000원\n공사대금청구액(연도별) 5,000,000원 25,000,000원 20,000,000원\n① 계약자산(미청구공사) 7,500,000원\n② 계약자산(미청구공사) 8,000,000원\n③ 계약부채(초과청구공사) 7,500,000원\n④ 계약부채(초과청구공사) 8,000,000원", "answer": 1}, {"year": "2024", "month": "3", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 기업이 수행하여 만든 자산이 기업 자체에는 대체 용도가 없고, 지금까지 수행을 완료한 부분에 대\n해 집행가능한 지급청구권이 기업에 있다면 한 시점에 이행하는 수행의무로 보아 한 시점에 수익을\n인식한다.\n② 고객에게 약속한 재화나 용역을 이전하여 수행의무를 이행할 때, 즉 고객이 자산을 통제할 때 수익\n을 인식한다.\n③ 거래가격이란 고객에게 약속한 재화나 용역을 이전하고 그 대가로 기업이 받을 권리를 갖게 될 것으\n로 예상하는 금액이며, 부가가치세처럼 제3자를 대신해 회수한 금액은 제외한다.\n④ 재화나 용역을 이전하는 시점과 고객이 대가를 지급하는 시점이 1년 이내로 예상되는 경우 금융요\n소가 유의적이지 않다고 보아 계약에 있는 금융요소를 조정하지 않을 수 있다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 25, "text": "[25]㈜삼일은 20X1년에 계약금액 400억원의 사무실용 빌딩 건설공사를 수주하였다. 공사 관련 정보가 다음\n과 같을 경우, 20X2년 계약이익은 얼마인가(단, 진행률은 누적발생원가에 기초하여 산정한다)?\n20X1년 20X2년 20X3년\n추정총계약원가 250억원 300억원 300억원\n당기발생계약원가 100억원 110억원 90억원\n① 10억원 이익\n② 20억원 이익\n③ 30억원 이익\n④ 40억원 이익", "answer": 1}, {"year": "2024", "month": "3", "qnum": 26, "text": "[26]㈜삼일은 20X1년  상업적 목적으로 일괄 협상하였다. 당기 중 A에 대한 공급이 완료되었고, B와 C에\n대한 공급은 차기 이후에 이루어질 예정이며, 해당 거래에 유의적인 금융요소는 없다고 가정한다. 각\n상품별 개별 판매가격 및 구매단가가 다음과 같을 때, ㈜삼일이 20X1년에 인식할 수익을 계산하면 얼마\n인가?\n구분 상품 A 상품 B 상품 C 합계\n개별판매가격 1,000,000원 2,500,000원 1,500,000원 5,000,000원\n구매원가 750,000원 1,700,000원 1,250,000원 3,700,000원\n① 750,000원\n② 800,000원\n③ 1,000,000원\n④ 1,250,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 24, "text": "[24]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 고객에게 이전할 재화나 용역에 대하여 받을 권리를 갖게 될 대가의 회수가능성이 높지 않더라도 계\n약의 상업적 실질이 존재하고 이전할 재화나 용역의 지급조건을 식별할 수 있으면 고객과의 계약으\n로 회계처리한다.\n② 기업이 수행하여 만든 자산이 기업 자체에 대체적인 용도가 없고, 지금까지 수행을 완료한 부분에\n대해 집행가능한 지급청구권이 기업에 있는 경우, 기업은 기간에 걸쳐 수익을 인식한다.\n③ 진행률은 보고기간 말 마다 다시 측정하되 회계추정의 변경으로 회계처리한다.\n④ 기간에 걸쳐 수익을 인식하는 경우 투입법 혹은 산출법에 따라 진행률을 측정하며, 비슷한 수행의무\n에 대해서는 일관되게 적용한다.", "answer": 1}, {"year": "2024", "month": "6", "qnum": 25, "text": "[25]㈜서울은 ㈜용산으로부터 건설공사를 수주하였다. ㈜용산과 체결한 건설공사가 총 건설계약기간에 대하\n여 손실이 발생할 것으로 예상되는 경우 ㈜서울이 수행할 회계처리로 옳은 것은?\n① 건설계약에서 예상되는 손실액은 진행률에 따라 비용으로 인식한다.\n② 건설계약에서 예상되는 손실액은 공사완료시점에 비용으로 인식한다.\n③ 건설계약에서 예상되는 손실액은 당기에 즉시 비용으로 인식한다.\n④ 건설계약에서 예상되는 손실액은 전기에 인식했던 수익에서 직접 차감한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 26, "text": "[26]㈜서울은 20X1년 1월 1일 ㈜용산에 상품을 할부로 판매하였다. 상품의 원가는 7,000,000원이며, 할부\n대금은 20X1년 1월 1일부터 매년 초에 3,000,000원씩 3년간 회수하기로 하였다. 또한 시장이자율은\n10 % , 연금현가계수(10 %, 2년)는 1.73554이고, 연금현가계수(10 %, 3년)는 2.48685이다. 동 할부매\n출과 관련하여 ㈜서울이 20X1년에 인식할 매출총이익과 이자수익은 각각 얼마인가(단, 소수점 이하는\n반올림한다)?\n매출총이익 이자수익\n① 460,550원 746,055원\n② 746,055원 1,200,000원\n③ 1,206,620원 520,662원\n④ 2,000,000원 1,200,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 계약에서 약속한 재화나 용역이 별도로 구별되기 위해서는 고객이 재화나 용역 그 자체에서 효익을\n얻거나 고객이 쉽게 구할 수 있는 다른 자원과 함께하여 그 재화나 용역에서 효익을 얻을 수 있어야\n하며, 고객에게 재화나 용역을 이전하기로 하는 약속을 계약 내의 다른 약속과 별도로 식별해 낼 수\n있어야 한다.\n② 거래가격이란 고객에게 약속한 재화나 용역을 이전하고 그 대가로 기업이 받을 권리를 갖게 될 것으\n로 예상하는 금액이며, 부가가치세처럼 제3자를 대신해 회수한 금액은 제외한다.\n③ 고객과의 계약에 따라 합의한 지급시기 때문에 유의적인 금융효익이 고객에게 제공되는 경우 화폐의\n시간가치를 반영하여 거래가격을 조정한다.\n④ 판매자가 고객에게 지급하거나 지급이 예상되는 금액은 고객이 판매자에게 별도 재화나 용역을 공급\n하고 지급하는 대가일 경우 수익에서 차감한다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 24, "text": "[24]㈜삼일은 고객에게 제품 A와 B를 이전하고 그 대가로 100,000원을 받는 계약을 체결하였다. 제품A와\n제품B의 인도는 각각이 수행의무이며, 인도시점에 고객에게 통제가 이전된다. 계약상 특약으로 제품A\n를 먼저 인도하고 제품A의 인도대가는 제품B의 인도를 지급조건으로 한다. 20X1년 10월 1일에 제품\nA를 외상으로 인도하였으며, 20X2년 2월 1일에 제품B를 인도하였다. 20X1년말 ㈜삼일의 재무상태표\n에 표시될 계약자산은 얼마인가(단, 상대적 개별 판매가격에 기초하여 제품A에 대한 대가로 40,000원,\n제품B에 대한 대가로 60,000원을 배분하였다)?\n① 0원\n② 40,000원\n③ 60,000원\n④ 100,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 25, "text": "[25]㈜삼일은 20X1년 2월 5일에 ㈜부산과 공장 건설계약을 체결하였다. 총공사계약금액은 120,000,000원\n이며 ㈜삼일은 누적발생계약원가에 기초하여 진행률을 산정하여 진행기준에 따라 수익을 인식한다. 건\n설계약과 관련한 20X1년 말 자료는 다음과 같다. ㈜삼일의 20X1년 말 재무상태표에 표시될 계약자산\n또는 계약부채의 금액은 얼마인가?\n누적발생원가 추정총계약원가 공사대금청구액\n40,000,000원 100,000,000원 54,000,000원\n① 계약자산 6,000,000원\n② 계약자산 8,000,000원\n③ 계약부채 6,000,000원\n④ 계약부채 8,000,000원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 기업이 고객에게 재화나 용역을 이전하기 전에 고객이 대가를 지급하거나 기업이 대가를 받을 무조\n건적인 권리를 갖고 있는 경우에 기업은 지급받은 때나 지급받기로 한 때에 그 계약을 환불부채로\n표시한다.\n② 고객이 대가를 지급하기 전이나 지급기일 전에 기업이 고객에게 재화나 용역의 이전을 수행하는 경\n우에, 그 계약에 대해 수취채권으로 표시한 금액이 있다면 이를 제외하고 계약자산으로 표시한다.\n③ 계약체결 증분원가란 고객과 계약을 체결하기 위해 발생한 원가로, 계약을 체결하지 않았다면 발생\n하지 않는 원가이다.\n④ 계약이행원가는 고객과의 계약을 이행할 때 드는 원가이다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 24, "text": "[24]다음 중 수익인식 기준에 관한 설명으로 옳지 않은 것은?\n① 라이선스 계약이 사용권에 해당하면 일정기간 동안 권리를 부여하는 수행의무가 부여된 것이므로 그\n기간에 걸쳐 수익을 인식한다.\n② 고객충성제도를 시행하는 경우 보상점수에 배분하는 대가는 상대적 개별판매가격에 따라 배분된 금\n액이다.\n③ 기업이 수행하여 만들어지거나 가치가 높아지는 대로 고객이 통제하는 자산을 기업이 만들거나 그\n자산 가치를 높이는 경우에는 기간에 걸쳐 수익을 인식한다.\n④ 고객이 보증을 별도로 구매할 수 있는 선택권이 있는 경우에는 용역유형의 보증으로 본다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 25, "text": "[25]㈜삼일은 ㈜부산과 총공사계약금액 13,000,000원에 공장건설계약을 체결하였다. 총공사기간은 계약일로\n부터 3년이고 건설계약과 관련된 연도별 자료는 다음과 같다. 진행률은 누적발생계약원가에 기초하여\n계산한다고 할 때, 20X2년에 인식할 계약손익은 얼마인가?\n20X1년 20X2년 20X3년\n당기발생원가 3,000,000원 5,400,000원 3,600,000원\n추가예정원가 7,000,000원 3,600,000원 -\n대금청구액 4,000,000원 4,500,000원 1,500,000원\n대금회수액 3,500,000원 4,000,000원 2,500,000원\n① 200,000원 계약손실\n② 200,000원 계약이익\n③ 500,000원 계약손실\n④ 700,000원 계약이익", "answer": 1}, {"year": "2024", "month": "11", "qnum": 23, "text": "[23]기업은 고객에게 약속한 재화나 용역을 이전하여 수행의무를 이행할 때 수익을 인식하여야 하는데, 만\n약 수행의무가 한 시점에 이행되는 경우라면 고객이 약속된 자산을 통제하고 기업이 의무를 이행하는\n시점에서 수익을 인식한다. 여기서 고객이 자산을 통제하는 시점의 예로 옳지 않은 것은?\n① 판매기업에게 자산에 대해 현재 지급청구권이 있다.\n② 판매기업이 자산의 물리적 점유를 이전하였다.\n③ 고객이 자산을 인수하였다.\n④ 자산의 소유에 따른 유의적인 위험과 보상이 판매기업에게 있다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 24, "text": "[24]다음 중 거래유형별 수익인식에 관한 설명으로 옳지 않은 것은?\n① 배당금수익은 배당금을 받을 권리와 금액이 확정되는 시점에 인식한다.\n② 위탁판매는 수탁자가 고객에게 판매한 시점에 수익을 인식한다.\n③ 장기할부판매로 수취할 대가의 총액은 재화가 인도되는 시점에 일괄하여 수익으로 인식한다.\n④ 시용판매의 경우 고객이 매입의사를 표시한 시점에 수익을 인식한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 25, "text": "[25]㈜삼일은 고객의 구매액 2원당 1포인트의 고객충성포인트를 고객에게 부여하는 고객충성제도를 운영하\n고 있다. 각 포인트는 고객이 미래에 기업의 제품을 구매할 때 1원을 할인받을 수 있다. ㈜삼일은\n20X1년에 제품을 400,000원에 판매하고, 200,000포인트를 고객에게 부여하였다. 제품의 개별 판매가격\n은 400,000원이다. ㈜삼일은 부여한 포인트 중 50 % 가 교환될 것으로 예상하였고, 부여한 200,000포\n인트의 개별판매가격을 100,000원으로 추정하였다. 이러한 예상은 20X1년 말까지 변함이 없다고 가정\n한다. 20X1년에 실제 교환된 포인트가 30,000포인트일 때, 20X1년 말 재무상태표에 표시될 계약부채는\n얼마인가?\n① 32,000원\n② 56,000원\n③ 64,000원\n④ 80,000원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 26, "text": "[26]㈜서울은 20X1년 2월 5일에 ㈜부산과 공장건설계약을 맺었다. 총공사계약액은 130,000,000원이며 ㈜\n서울은 누적발생계약원가에 기초하여 진행률을 산정하여 진행기준에 따라 수익을 인식한다. ㈜서울의\n건설계약과 관련한 20X1년 자료는 다음과 같다. ㈜서울의 20X1년 말 재무상태표상 계약부채(초과청구\n공사) 또는 계약자산(미청구공사) 금액은 얼마인가?\n누적발생원가 추정총계약원가 공사대금청구액\n12,000,000원 100,000,000원 18,000,000원\n① 계약부채(초과청구공사) 2,400,000원\n② 계약부채(초과청구공사) 6,000,000원\n③ 계약자산(미청구공사) 2,400,000원\n④ 계약자산(미청구공사) 6,000,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 고객에게 이전할 재화나 용역에 대하여 받을 권리를 갖게 될 대가의 회수가능성이 높지 않더라도 계\n약에 상업적 실질이 존재하고 이전할 재화나 용역의 지급조건을 식별할 수 있으면 고객과의 계약으\n로 회계처리한다.\n② 수익을 인식하기 위해서는 [고객과의 계약 식별-수행의무 식별-거래가격 산정-거래가격을 계약 내\n수행의무에 배분-수행의무를 이행할 때 수익인식]의 단계를 거친다.\n③ 거래가격 산정시 제 3자를 대신해서 회수한 금액은 제외하며, 변동대가, 비현금대가 및 고객에게\n지급할 대가 등이 미치는 영향을 고려하여야 한다.\n④ 고객에게 약속한 재화나 용역을 이전하여 수행의무를 이행할 때, 즉 고객이 자산을 통제할 때 수익\n을 인식한다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 24, "text": "[24]㈜삼일은 20X1년 1월 1일 ㈜용산에 상품을 할부로 판매하였다. 상품의 원가는 8,000,000원 이며, 할\n부대금은 매년 말 4,000,000원 씩 3년간 회수하기로 하였다. 또한 시장이자율은 12 % 이며, 연금현가\n계수(12 %, 3년)는 2.40183이다. 동 할부매출과 관련하여 ㈜삼일이 20X1년에 인식할 이자수익과 매출\n액은 각각 얼마인가(단, 소수점 이하는 반올림한다)?\n이자수익 매출액\n① 960,000원 9,607,320원\n② 960,000원 12,000,000원\n③ 1,152,878원 9,607,320원\n④ 1,152,878원 12,000,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 25, "text": "[25]다음 중 고객충성제도의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 보상점수를 부여한 매출거래에는 재화 등의 제공과 보상점수의 제공이라는 별도의 수행의무가 존재\n한다고 본다.\n② 기업이 직접 보상을 제공하는 경우 보상점수에 배분된 거래가격은 계약부채로 인식한 후 보상을 제\n공한 때 수익으로 인식한다.\n③ 제3자가 보상을 제공하고 기업이 자기의 계산으로 대가를 회수하는 경우에는 보상점수에 배분되는\n총 대가로 수익을 측정하고 보상과 관련하여 의무를 이행한 때 수익을 인식한다.\n④ 제3자가 보상을 제공하고 기업이 제3자를 대신하여 대가를 회수하는 경우에는 보상점수에 배분된\n총 대가를 수익으로 측정하고 대가를 받을 권리를 가지게 될 때 수익을 인식한다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 26, "text": "[26]㈜삼일건설은 ㈜용산과 20X1년 7월 1일 총공사계약액 60,000,000원의 공장신축공사계약을 체결하였\n다. 회사가 누적발생계약원가에 기초하여 진행률을 측정하여 진행기준으로 수익을 인식한다면 ㈜삼일건\n설의 20X2년 계약손익은 얼마인가?\n20X1년 20X2년\n당기발생계약원가 12,000,000원 28,000,000원\n추정총계약원가 40,000,000원 40,000,000원\n공사대금청구액(연도별) 25,000,000원 35,000,000원\n① 이익 10,000,000원\n② 이익 14,000,000원\n③ 이익 15,000,000원\n④ 이익 20,000,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 가장 옳지 않은 것은?\n① 구별되는 재화나 용역은 수행의무에 해당한다.\n② 고객에게 약속한 재화나 용역을 이전하여 수행의무를 이행할 때, 즉 고객이 자산을 통제할 때 수익\n을 인식한다.\n③ 거래가격이란 고객에게 약속한 재화나 용역을 이전하고 그 대가로 기업이 받을 권리를 갖게 될 것으\n로 예상하는 금액이며, 부가가치세처럼 제3자를 대신해 회수한 금액을 포함한다.\n④ 재화나 용역을 이전하는 시점과 고객이 대가를 지급하는 시점이 1년 이내로 예상되는 경우 금융요\n소가 유의적이지 않다고 보아 계약에 있는 금융요소를 조정하지 않을 수 있다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 24, "text": "[24]㈜삼일뮤직은 20X1년 7월 1일 미국의 유명 레코드사에게 2년(20X1년 7월 1일 ~ 20X3년 6월 30일)\n동안 미국에서 2집 앨범을 텔레비전, 라디오, 광고를 포함한 모든 상업적 매체에서 사용할 권리를 부여\n하는 라이선스 계약을 거래가격 4억 원에 체결하였다. ㈜삼일뮤직이 20X1년에 인식할 수익은 얼마인가\n(단, ㈜삼일뮤직은 2집 앨범을 재녹음하는 활동을 수행하지 않으며, 금융요소는 고려하지 않는다)?\n① 0원\n② 1억원\n③ 2억원\n④ 4억원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 25, "text": "[25]㈜삼일은 20X1년 2월 5일에 ㈜부산과 공장 건설계약을 체결하였다. 총공사계약금액은 120,000,000원\n이며 ㈜삼일은 누적발생계약원가에 기초하여 진행률을 산정하여 기간에 걸쳐 수익을 인식한다. 건설계\n약과 관련한 20X1년 말 자료는 다음과 같다. ㈜삼일의 20X1년 말 재무상태표에 표시될 계약자산 또는\n계약부채의 금액은 얼마인가?\n누적발생계약원가 완성시까지 추가예정원가 공사대금청구액\n40,000,000원 60,000,000원 40,000,000원\n① 계약자산 6,000,000원\n② 계약자산 8,000,000원\n③ 계약부채 6,000,000원\n④ 계약부채 8,000,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 23, "text": "[23]다음 중 기업이 고객에게서 받은 대가 또는 지급받을 권리가 있는 대가에 상응하여 고객에게 재화나 용\n역을 이전하여야 하는 기업의 의무를 나타내는 것으로 옳은 것은?\n① 계약자산\n② 계약부채\n③ 환불부채\n④ 수취채권", "answer": 2}, {"year": "2025", "month": "3", "qnum": 24, "text": "[24]다음 중 유형별 수익인식방법에 관한 설명으로 옳지 않은 것은?\n① 용역유형 보증의 경우 보증을 별도의 수행의무로 보아 거래가격의 일부를 배분한다.\n② 시용판매에서는 고객의 매입의사표시가 제품 등에 대한 통제의 이전으로 보아 고객이 매입의사를 표\n시한 시점에 수익을 인식한다.\n③ 기업이 고객에게 라이선스를 제공하는 경우에 있어서 해당 라이선스 계약이 사용권에 해당한다면 일\n정기간 동안 권리를 부여하는 수행의무가 부여된 것이므로 그 기간에 걸쳐 수익을 인식한다.\n④ 기업이 고객에게 재화가 이전되기 전에 해당 재화에 대한 통제권을 가지지 않는 경우에는 대리인에\n해당하기 때문에 판매가액 총액을 수익으로 계상할 수 없으며, 받을 권리를 가지는 판매수수료만을\n수익으로 인식해야 한다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 25, "text": "[25]㈜삼일건설은 20X1년 1월 1일에 대전시로부터 교량건설을 총공사계약금액 50,000,000원에 수주하였\n다. 공사기간은 20X1년 1월 1일부터 20X3년 12월 31일까지이다. 추정총계약원가는 40,000,000원으로\n공사기간 동안 변동이 없으며, 회사는 누적발생계약원가에 기초하여 공사진행률을 측정하고 있다. 20X1\n년과 20X2년 계약수익이 다음과 같을 때 20X2년 말 누적발생계약원가를 계산하면 얼마인가?\nㄱ. 20X1년 계약수익 : 15,000,000원\nㄴ. 20X2년 계약수익 : 10,000,000원\n① 15,000,000원\n② 20,000,000원\n③ 25,000,000원\n④ 30,000,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 23, "text": "[23]다음 중 수익인식 기준에 관한 설명으로 옳지 않은 것은?\n① 라이선스 계약이 접근권에 해당하면 일정기간 동안 권리를 부여하는 수행의무가 부여된 것이므로 그\n기간에 걸쳐 수익을 인식한다.\n② 고객충성제도를 시행하는 경우 보상점수에 배분하는 대가는 상대적 개별판매가격에 따라 배분된 금\n액이다.\n③ 기업이 수행하여 만들어지거나 가치가 높아지는 대로 고객이 통제하는 자산을 기업이 만들거나 그\n자산 가치를 높이는 경우에는 기간에 걸쳐 수익을 인식한다.\n④ 고객이 보증을 별도로 구매할 수 있는 선택권이 있는 경우에는 확신유형의 보증으로 본다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 24, "text": "[24]㈜삼일은 20X2년 12월 31일 ㈜용산에 상품10,000개를 10,000,000원(원가 7,000,000원)에 외상으로\n판매하고 6개월 이내에 반품할 수 있는 권리를 부여하였다. 회사의 과거 경험에 따르면 판매일 현재 전\n체 매출 중 700개가 반품될 것으로 예상된다. ㈜삼일이 해당 상품의 판매일에 인식해야 할 매출총이익\n을 계산한 것으로 옳은 것은?\n① 2,300,000원\n② 2,790,000원\n③ 3,000,000원\n④ 3,490,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 25, "text": "[25]㈜삼일은 20X1년 2월 5일에 ㈜부산과 공장 건설계약을 체결하였다. 총공사계약금액은 120,000,000원\n이며 ㈜삼일은 누적발생계약원가에 기초하여 진행률을 산정하여 진행기준에 따라 수익을 인식한다. 건\n설계약과 관련한 20X1년 말 자료는 다음과 같다. ㈜삼일의 20X1년 말 재무상태표에 표시될 계약자산\n또는 계약부채의 금액은 얼마인가?\n누적발생원가 추정총계약원가 공사대금청구액\n45,000,000원 100,000,000원 62,000,000원\n① 계약자산 6,000,000원\n② 계약자산 8,000,000원\n③ 계약부채 6,000,000원\n④ 계약부채 8,000,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 26, "text": "[26]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 거래가격이란 고객에게 약속한 재화나 용역을 이전하고 그 대가로 기업이 받을 권리를 갖게 될 것으\n로 예상하는 금액이며, 부가가치세처럼 제3자를 대신해 회수한 금액은 제외한다.\n② 변동대가와 관련된 불확실성이 나중에 해소될 때, 이미 인식한 누적 수익 금액 중 유의적인 부분을\n되돌릴 가능성이 매우 높은 정도까지만 추정된 변동대가의 일부나 전부를 거래가격에 포함한다.\n③ 재화나 용역을 이전하는 시점과 고객이 대가를 지급하는 시점이 1년 이내로 예상된다면 유의적인\n금융요소의 영향을 반영하여 약속한 대가를 조정하지 않는 실무적 간편법을 쓸 수 있다.\n④ 고객이 현금 외의 형태로 대가를 약속한 계약의 경우에 거래가격을 산정하기 위하여 비현금 대가를\n공정가치로 측정한다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 23, "text": "[23]㈜삼일은 20X1년 1월 1일 ㈜용산에 원가 50,000,000원의 상품을 할부로 판매하였다. 할부대금은 매년\n말 20,000,000원씩 3년간 회수하기로 하였다. 상품판매시의 유효이자율이 연 5 % 인 경우 ㈜삼일이 동\n거래와 관련하여 20X1년에 인식할 매출총이익은 얼마인가(단, 3년, 5 % 연금현가계수는 2.7232이다)?\n① 2,723,200원\n② 4,464,000원\n③ 10,000,000원\n④ 14,464,000원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 24, "text": "[24]다음 중 계약자산과 계약부채 등에 관한 설명으로 옳지 않은 것은?\n① 계약 당사자 중 어느 한 편이 계약을 수행했을 때, 기업의 수행 정도와 고객의 지급과의 관계에 따\n라 그 계약을 계약자산이나 계약부채로 재무상태표에 표시한다.\n② 계약자산은 기업이 고객에게 이전한 재화나 용역에 대해 그 대가를 받을 권리이다.\n③ 계약부채는 기업이 고객에게서 받은 대가 또는 지급받을 권리가 있는 대가에 상응하여 고객에게 재\n화나 용역을 이전하여야 하는 기업의 의무이다.\n④ 고객이 대가를 지급하기 전이나 지급기일 전에 기업이 고객에게 재화나 용역의 이전을 수행하는 경\n우에, 그 계약에 대해 수취채권으로 표시한 금액이 있다면 이를 포함하여 계약자산으로 표시한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 25, "text": "[25]㈜삼일건설은 20X1년 1월 1일에 대전시로부터 교량건설계약을 총공사계약액 50,000,000원에 수주하였\n다. 공사기간은 20X1년 1월 1일부터 20X3년 12월 31일까지이다. 추정총계약원가는 40,000,000원으로\n공사기간 동안 변동이 없으며, 회사는 누적발생계약원가에 기초하여 공사진행률을 측정하고 있다. 20X1\n년과 20X2년 계약수익이 다음과 같을 때 20X2년 말 누적공사진행률을 계산한 것으로 옳은 것은?\nㄱ. 20X1년 계약수익 : 12,000,000원\nㄴ. 20X2년 계약수익 : 10,000,000원\n① 24 %\n② 30 %\n③ 44 %\n④ 56 %", "answer": 3}, {"year": "2025", "month": "6", "qnum": 26, "text": "[26]다음 중 거래유형별 수익인식에 관한 설명으로 옳지 않은 것은?\n① 시용판매의 경우 시송품의 인도시점에 수익을 인식한다.\n② 위탁판매는 수탁자가 고객에게 판매한 시점에 수익을 인식한다.\n③ 장기할부판매로 수취할 대가의 총액이 매출액으로 인식되는 것은 아니다.\n④ 배당금수익은 배당금을 받을 권리와 금액이 확정되는 시점에 인식한다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?\n① 고객이 재화나 용역 그 자체에서 또는 쉽게 구할 수 있는 다른 자원과 함께하여 그 재화나 용역에서\n효익을 얻을 수 있고 고객에게 재화나 용역을 이전하기로 하는 약속을 계약 내의 다른 약속과 별도\n로 식별해 낼 수 있다면 고객에게 약속한 재화나 용역은 별도로 구별되는 것이다.\n② 고객과의 계약에 따라 합의한 지급시기 때문에 유의적인 금융효익이 고객에게 제공되는 경우 화폐의\n시간가치를 반영하여 거래가격을 조정한다.\n③ 판매자가 고객에게 지급하거나 지급이 예상되는 금액은 고객이 판매자에게 별도 재화나 용역을 공급\n하고 지급하는 대가일 경우 수익에서 차감한다.\n④ 고객과의 계약금액을 각 수행의무별로 수익을 측정하기 위하여 계약 개시시점에 각 수행의무 대상인\n재화 혹은 용역의 개별판매가격을 산정하고 이 가격에 비례하여 거래가격을 배분한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 24, "text": "[24]다음 중 수익인식 기준에 관한 설명으로 옳지 않은 것은?\n① 고객충성제도를 시행하는 경우 보상점수에 배분하는 대가는 상대적 개별판매가격에 따라 배분된 금\n액이다.\n② 매출에 확신유형의 보증을 제공하는 경우 총 판매금액을 수익으로 인식하고 보증에 대해서는 충당부\n채를 인식한다.\n③ 라이선스 계약이 사용권에 해당하면 일정기간 동안 권리를 부여하는 수행의무가 부여된 것이므로 그\n기간에 걸쳐 수익을 인식한다.\n④ 반품권이 있는 판매는 반품이 예상되는 제품에 대해서는 수익을 인식하지 않고, 환불부채로 인식한\n다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 25, "text": "[25]㈜삼일건설은 ㈜용산과 20X1년 7월 1일 총 계약금액 90,000,000원의 공장신축공사계약을 체결하였다.\n㈜삼일건설이 누적발생계약원가에 기초하여 진행률을 측정하고 기간에 걸쳐 수익을 인식한다면 ㈜삼일\n건설의 20X2년 계약손익은 얼마인가?\n20X1년 20X2년 20X3년\n누적발생계약원가 20,000,000원 40,000,000원 80,000,000원\n추정총계약원가 80,000,000원 80,000,000원 80,000,000원\n공사대금청구액(연도별) 10,000,000원 30,000,000원 50,000,000원\n① 이익 1,250,000원\n② 이익 2,500,000원\n③ 이익 3,750,000원\n④ 이익 4,500,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 23, "text": "[23]다음 중 고객과의 계약에서 생기는 수익에 관한 설명으로 옳은 것은?\n① 수행의무란 고객과의 계약에서 구별되는 재화나 용역을 고객에게 이전하기로 한 각 약속을 말한다.\n② 기업이 고객에게 재화나 용역을 이전하기 전에 고객이 대가를 지급하거나 기업이 대가를 받을 무조\n건적인 권리를 갖고 있는 경우에 기업은 지급받은 때나 지급받기로 한 때에 그 계약을 환불부채로\n표시한다.\n③ 계약이행원가란 고객과 계약을 체결하기 위해 발생한 원가로, 계약을 체결하지 않았다면 발생하지\n않는 원가이다.\n④ 시간만 지나면 대가를 지급받기로 한 때가 되는 경우에 그 대가를 받을 권리는 무조건적이며, 계약\n자산은 기업이 대가를 받을 무조건적인 권리이다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 24, "text": "[24]㈜삼일은 20X1년 10월 1일 ㈜한강에게서 100,000원을 미리 받고 20X2년 3월 31일 제품을 인도하는\n판매 계약을 체결하였다. ㈜삼일의 증분차입이자율이 연 5 % 인 경우 ㈜삼일이 20X2년에 인식할 매출액\n은 얼마인가(단, ㈜삼일은 재화나 용역을 이전하는 시점과 고객이 대가를 지급하는 시점이 1년 이내로\n예상된다면 유의적인 금융요소의 영향을 반영하여 약속한 대가를 조정하지 않는 실무적 간편법을 사용\n하고 있다)?\n① 0원\n② 100,000원\n③ 102,500원\n④ 105,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 25, "text": "[25]㈜삼일은 ㈜부산과 총공사계약금액 13,000,000원에 공장건설계약을 체결하였다. 총공사기간은 계약일로\n부터 3년이고 건설계약과 관련된 연도별 자료는 다음과 같다. 진행률은 누적발생계약원가에 기초하여\n계산한다고 할 때, ㈜삼일의 20X2년 말 재무상태표에 표시될 계약자산 또는 계약부채의 금액은 얼마인\n가?\n20X1년 20X2년 20X3년\n당기발생원가 3,000,000원 5,400,000원 3,600,000원\n추가예정원가 7,000,000원 3,600,000원 -\n대금청구액 4,000,000원 4,500,000원 4,500,000원\n대금회수액 3,500,000원 4,000,000원 5,500,000원\n① 계약자산 600,000원\n② 계약자산 1,600,000원\n③ 계약부채 600,000원\n④ 계약부채 1,600,000원", "answer": 1}, {"year": "2025", "month": "11", "qnum": 23, "text": "[23]다음 중 거래유형별 수익인식에 관한 설명으로 옳은 것은?\n① 배당금수익은 배당금을 받을 권리와 금액이 확정되는 시점에 인식한다.\n② 위탁판매는 위탁자가 판매를 위탁한 시점에 수익을 인식한다.\n③ 장기할부판매로 수취할 대가의 총액은 재화가 인도되는 시점에 일괄하여 수익으로 인식한다.\n④ 시용판매의 경우 고객에게 재고자산이 이전된 시점에 수익을 인식한다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 24, "text": "[24]㈜삼일은 20X2년 3월 1일 ㈜용산에 상품10,000개를 10,000,000원(원가 7,000,000원)에 외상으로 판\n매하고 6개월 이내에 반품할 수 있는 권리를 부여하였다. 회사의 과거 경험에 따르면 판매일 현재 판매\n된 전체 상품 중 300개가 반품될 것으로 예상된다. 이러한 예상이 합리적인 경우 ㈜삼일이 해당 상품의\n인도일에 인식해야 할 매출총이익을 계산하면 얼마인가?\n① 2,500,000원\n② 2,910,000원\n③ 2,975,000원\n④ 3,000,000원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 25, "text": "[25]㈜삼일은 20X1년 1월 1일 ㈜용산에 원가 65,000,000원의 상품을 할부로 판매하였다. 할부대금은 20X1\n년 말부터 매년 말 30,000,000원씩 3년간 회수하기로 하였다. 상품판매시의 유효이자율이 연 5 % 인\n경우 ㈜삼일이 동 거래와 관련하여 20X1년에 인식할 매출총이익은 얼마인가(단, 3년, 5 % 연금현가계\n수는 2.7232이다)?\n① 13,524,000원\n② 14,982,000원\n③ 16,696,000원\n④ 17,897,800원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 26, "text": "[26]㈜삼일건설은 20X1년 1월 1일에 서울시로부터 교량건설을 총공사계약액 50,000,000원에 수주하였다.\n공사기간은 20X1년 1월 1일부터 20X3년 12월 31일까지이다. 추정총계약원가는 40,000,000원으로 공\n사기간 동안 변동이 없으며, 회사는 누적발생계약원가에 기초하여 공사진행률을 측정하고 있다. 20X1년\n과 20X2년 계약수익이 다음과 같을 때 20X2년 계약손익을 계산한 것으로 옳은 것은?\nㄱ. 20X1년 계약수익 : 20,000,000원\nㄴ. 20X2년 계약수익 : 15,000,000원\n① 2,000,000원\n② 3,000,000원\n③ 4,000,000원\n④ 5,000,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 23, "text": "[23]다음 중‘고객과의 계약에서 생기는 수익’에 관한 설명으로 옳지 않은 것은?\n① 기업이 고객에게 재화나 용역을 이전하기 전에 고객이 대가를 지급하거나 기업이 대가를 받을 무조\n건적인 권리를 갖고 있는 경우에 기업은 지급받은 때나 지급받기로 한 때에 그 계약을 계약부채로\n표시한다.\n② 고객이 대가를 지급하기 전이나 지급기일 전에 기업이 고객에게 재화나 용역의 이전을 수행하는 경\n우에, 그 계약에 대해 수취채권으로 표시한 금액이 있다면 이를 제외하고 계약자산으로 표시한다.\n③ 계약체결 증분원가란 고객과 계약을 체결하기 위해 발생한 원가로, 계약을 체결하지 않았다면 발생\n하지 않는 원가이다.\n④ 고객이 대가를 선급하였고 재화의 이전시점은 고객의 재량에 달린 경우 금융요소가 있는 것으로 보\n아 거래가격을 조정한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 24, "text": "[24]㈜삼일은 ㈜종로에 20X1년 10월 1일 제품 A를 개당 500원에 공급하기로 계약하였다. 계약에는 만약\n㈜종로가 계약기간인 2년 동안(20X1년10월 1일 ~ 20X3년 9월 30일) 제품 A를 1,000개 넘게 구매하\n는 경우 개당 가격을 480원으로 소급하여 낮추기로 하였다. ㈜삼일은 20X1년 12월 중 제품 A를 ㈜종\n로에게 200개 판매하였으나 20X1년 말 결산시 ㈜삼일은 계약기간인 2년 동안 1,000개 이하의 제품을\n㈜종로가 구매할 것으로 예상하였다. 그러나 ㈜삼일은 20X2년 중 ㈜종로에게 제품 A 600개를 추가판매\n하였고, 20X2년 말 결산시 계약기간 동안 ㈜종로에 대한 총 판매량이 1,000개를 초과할 것으로 예상하\n였다. ㈜삼일이 ㈜종로에 대한 제품 A의 판매와 관련하여 20X2년에 인식할 매출액은 얼마인가?\n① 284,000원\n② 288,000원\n③ 300,000원\n④ 384,000원", "answer": 1}, {"year": "2025", "month": "12", "qnum": 25, "text": "[25]㈜삼일은 20X1년 1월 1일 ㈜용산에 상품을 할부로 판매하였고, 할부대금은 20X1년 말부터 매년 말\n3,000,000원씩 3년간 회수하기로 하였다. 판매
