영희 : 사업자가 영세율을 적용받는 경우 부가가치세 조기환급 신청이 가능합니다.\n④ 정민지 : 세금계산서의 필요적 기재사항의 전부 또는 일부가 기재되지 아니하거나 사실과\n다를 경우 적법한 세금계산서로 보지 않으며, 가산세 등의 불이익이 있습니다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 72, "text": "[72]다음 중 부가가치세법상 사업자에 관한 설명으로 옳지 않은 것은?\n① 사업자는 면세사업자와 과세사업자로 구분된다.\n② 면세사업자도 부가가치세법에 따라 사업자등록을 하여야 한다.\n③ 영세율을 적용받는 사업자도 부가가치세법상의 사업자 등록의무가 있다.\n④ 과세사업과 면세사업을 겸영하는 자를 겸영사업자라 하며, 겸영사업자도 부가가치세 납세의무가 있\n다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.\n② 일반과세자가 간이과세자로 변경되는 경우 과세유형이 변경되는 해에 일반과세 규정이 적용되는 기\n간은 그 변경 이후 7월 1일부터 12월 31일까지이다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우 최초 과세기간은 그 신청한 날부터 그 신\n청일이 속하는 과세기간의 종료일까지로 한다.\n④ 계속 사업을 하고 있는 일반과세자의 과세기간은 제1기는 1월 1일부터 6월 30일까지, 제2기는\n7월 1일부터 12월 31일까지로 한다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 74, "text": "[74]다음 중 부가가치세의 납세지에 관한 설명으로 옳지 않은 것은?\n① 사업장은 사업자가 사업을 하기 위하여 거래의 전부 또는 일부를 하는 고정된 장소로 한다.\n② 사업자단위과세사업자는 각 사업장을 대신하여 그 사업자의 본점 또는 주사무소의 소재지를 부가가\n치세의 납세지로 한다.\n③ 재화를 보관하고 관리할 수 있는 시설만 갖춘 장소로서 하치장으로 신고된 장소는 사업장으로 보지\n아니한다.\n④ 직매장이란 사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화를 직접 판매하기 위하여 특별\n히 판매시설을 갖춘 장소를 말하며, 직매장은 사업장으로 보지 아니한다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 75, "text": "[75]다음 중 부가가치세 과세대상에 관한 설명으로 옳은 것을 모두 고르면?\nㄱ. 사용인에게 사업을 위해 착용하는 작업복을 제공하는 경우 재화의 공급으로 본다.\nㄴ. 고용관계에 의해 근로를 제공하는 것은 부가가치세 과세대상인 용역의 공급이 아니다.\nㄷ. 건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하는 경우 재화의 공급으로 본다.\nㄹ. 용역의 무상공급은 부가가치세법상 용역의 공급으로 보지 않지만 특수관계인에게 무상으로 제공\n하는 사업용 부동산임대용역은 용역의 공급으로 본다.\n① ㄱ, ㄴ\n② ㄱ, ㄹ\n③ ㄴ, ㄹ\n④ ㄷ, ㄹ", "answer": 3}, {"year": "2025", "month": "5", "qnum": 76, "text": "[76]다음은 김삼일 씨의 2025년 8월 가계부 지출내역이다. 지출금액에 포함된 부가가치세의 합계는 얼마인\n가(단, 공급자는 부가가치세법에 따라 적정하게 부가가치세를 거래징수 하였다고 가정한다)?\n일 자 적 요 금 액\n8월 14일 상가 월세 330,000원\n8월 21일 무도학원 학원비 220,000원\n8월 27일 피부노화방지시술비 110,000원\n① 10,000원\n② 20,000원\n③ 30,000원\n④ 60,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 77, "text": "[77]다음은 컴퓨터 판매와 유지보수용역을 제공하는 일반과세자 김삼일 씨의 2025년 1월부터 6월까지 거래\n내역이다. 2025년 제1기 부가가치세 과세표준은 얼마인가(단, 모든 금액은 부가가치세를 제외한 공급\n가액이며, 세금계산서는 세법에서 정하는 바에 따라 발급하였다)?\n(1) 1월 20일부터 20개월간 A와 컴퓨터 유지보수 계약을 맺고, 1월 20일부터\n24개월간 매달 20일에 300,000원씩 받기로 하였다.\n(2) 2월 25일에 B에게 컴퓨터를 1,000,000원에 판매하고 2월 25일부터 10개월간\n매달 25일에 100,000원씩 받기로 하였다.\n① 1,000,000원\n② 1,800,000원\n③ 2,300,000원\n④ 2,800,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 78, "text": "[78]과세사업을 영위하던 ㈜삼일은 2025년 2월 5일에 사업을 폐지하였다. 폐업 당시의 잔존재화가 다음과\n같은 경우 부가가치세 과세표준은 얼마인가?\n자산종류 취득일 취득원가 시 가\n제 품 2024년 8월 20일 30,000,000원 20,000,000원\n토 지 2020년 6월 20일 80,000,000원 100,000,000원\n건 물 2022년 1월 20일 400,000,000원 200,000,000원\n※제품과 건물은 매입세액을 공제받았다.\n① 280,000,000원\n② 300,000,000원\n③ 310,000,000원\n④ 410,000,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 79, "text": "[79]㈜삼일은 스타킹제조업을 영위하는 중소기업이다. 다음 자료는 2025년 제1기 예정신고기간(2025년 1\n월 1일 ~ 2025년 3월 31일)에 공급받은 재화 및 용역의 거래내역이다. ㈜삼일의 2025년 제1기 예정\n신고기간의 매입세액공제액으로 옳은 것은(단, 제시된 금액은 부가가치세가 포함되어 있지 않다)?\n(1) 국내거래처로부터 원재료를 구입하고 공급가액 50,000,000원의 세금계산서를 발급받았다.\n(2) 기업업무추진비를 지출하면서 공급가액 2,000,000원의 세금계산서를 발급받았다.\n(3) 광고선전목적으로 불특정다수에게 무상 증정하기 위하여 공급가액 5,000,000원의 재화를\n구입하고 세금계산서를 발급받았다.\n(4) 토지 조성을 위한 자본적지출 3,000,000원(공급가액)에 대한 세금계산서를 발급받았다.\n① 5,500,000원\n② 5,800,000원\n③ 6,000,000원\n④ 6,800,000원", "answer": 1}, {"year": "2025", "month": "5", "qnum": 80, "text": "[80]다음 중 부가가치세법상 가산세가 부과되는 경우로 옳지 않은 것은?\n① 예정신고시 매입처별 세금계산서 합계표를 제출하지 않고 확정신고시 제출한 경우\n② 세금계산서의 발급시기가 지난 후 해당 재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확정\n신고 기한까지 세금계산서를 발급하는 경우\n③ 사업자등록을 하지 않은 경우\n④ 재화를 공급받고 타인 명의로 세금계산서를 발급받은 경우\n\n< 원가관리회계 >", "answer": 1}, {"year": "2025", "month": "6", "qnum": 71, "text": "[71]다음 중 부가가치세법에 대하여 옳은 주장을 하는 사람은 누구인가?\n① 김영희 : 부가가치세가 과세되는 재화란 재산 가치가 있는 유체물을 말한다. 따라서 동력이나\n열과 같은 무체물은 부가가치세 과세대상이 아니다.\n② 박철수 : 우리나라의 부가가치세 제도는 전단계세액공제법을 채택하고 있다.\n③ 최소영 : 재화의 수입은 수입자가 사업자인 경우에만 부가가치세가 과세된다. 따라서 사업자가\n아닌 개인이 재화를 수입하는 경우에는 부가가치세가 과세되지 않는다.\n④ 정예은 : 간접세에 대한 국제적 중복과세의 문제를 해결하기 위하여 수출국에서만 간접세를\n과세할 수 있도록 원산지국과세원칙을 채택하고 있다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 영세율을 적용받는 사업자는 부가가치세법상의 사업자 등록의무가 없다.\n② 사업상 독립적으로 재화 또는 용역을 공급하는 경우 법인 뿐만 아니라 개인도 사업자에 해당한다.\n③ 주사업장총괄납부사업자는 주된 사업장에서 모든 사업장의 부가가치세를 총괄하여 납부할 수 있다.\n④ 면세사업자는 부가가치세법에 따른 사업자 등록의무가 없다.", "answer": 1}, {"year": "2025", "month": "6", "qnum": 73, "text": "[73]다음 중 부가가치세법상 과세기간에 관한 설명으로 옳지 않은 것은?\n① 간이과세자의 경우 과세기간을 1월 1일부터 12월 31일로 한다.\n② 일반과세자는 1월 1일부터 6월 30일까지는 제1기 과세기간, 7월 1일부터 12월 31일까지를 제2\n기 과세기간으로 한다.\n③ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.\n④ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우 사업개시일부터 신청일이 속하는 과세기간\n의 종료일까지를 최초 과세기간으로 한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 74, "text": "[74]다음 중 부가가치세 납세지인 사업장에 관한 설명으로 옳지 않은 것은?\n① 직매장은 별도의 사업장으로 본다.\n② 부동산임대업의 경우 부동산 등기부상의 소재지를 사업장으로 한다.\n③ 제조업의 경우 최종제품을 완성하는 장소를 사업장으로 하며, 이 경우 따로 제품의 포장만을 하거나\n용기에 충전만을 하는 장소를 포함한다.\n④ 무인자동판매기를 통하여 재화ㆍ용역을 공급하는 사업의 경우 그 사업에 관한 업무를 총괄하는 장소\n를 사업장으로 한다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 75, "text": "[75]다음의 간주공급 중 세금계산서를 발급해야 하는 것은?\n① 개인적공급\n② 사업상증여\n③ 면세전용\n④ 판매목적 타사업장 반출", "answer": 4}, {"year": "2025", "month": "6", "qnum": 76, "text": "[76]다음 중 부가가치세법상 공급시기에 관한 설명으로 옳지 않은 것은?\n① 장기할부판매의 경우 대가의 각 부분을 받기로 한 때를 공급시기로 한다.\n② 전력이나 그 밖의 공급단위를 구획할 수 없는 재화를 계속적으로 공급하는 경우 대가의 각 부분을\n받기로 한 때를 재화의 공급시기로 본다.\n③ 내국신용장에 의하여 공급하는 재화의 공급시기는 재화의 인도일로 한다.\n④ 무인판매기를 이용하여 재화를 공급하는 경우에는 무인판매기에서 재화를 공급하는 때를 공급시기로\n한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 77, "text": "[77]다음은 김삼일씨의 2025년 5월 가계부 지출내역이다. 지출금액에 포함된 부가가치세 합계를 계산하면\n얼마인가(단, 공급자는 부가가치세법에 따라 적법하게 부가가치세를 거래징수 하였다고 가정한다)?\n일 자 적 요 지 출 금 액\n1월 14일 딸기 구입 11,000원\n1월 21일 라면 구입 22,000원\n1월 27일 수돗물 구입 44,000원\n1월 30일 프로야구 입장권 구입 33,000원\n① 3,000원\n② 5,000원\n③ 7,000원\n④ 10,000원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 78, "text": "[78]다음은 일반과세자인 ㈜삼일의 2025년 제2기 예정신고기간(2025년 7월 1일 ~ 2025년 9월 30일)에\n대한 자료이다. ㈜삼일의 2025년 제2기 예정신고기간의 부가가치세 과세표준은 얼마인가(단, 다음 자\n료의 금액에는 부가가치세가 포함되지 않음)?\nㄱ. 7월 5일：제품을 6,000,000원에 인도하고 대금은 7월 31일부터 6개월 간 매달 말일에\n1,000,000원씩 받기로 하였다.\nㄴ. 7월 29일：기계유지보수 계약을 맺고 7월 29일부터 24개월 간 매달 29일에 2,000,000원씩\n받기로 하였다.\nㄷ. 8월 14일：특별재난지역에 제품(매입세액공제분으로, 제조원가 800,000원, 시가 1,000,000원)\n을 증여하였다.\nㄹ. 9월 30일：공급에 대한 대가의 지급이 지체되어 거래처로부터 연체이자 2,000,000원을 받았다.\n① 12,000,000원\n② 14,000,000원\n③ 15,000,000원\n④ 16,000,000원", "answer": 1}, {"year": "2025", "month": "6", "qnum": 79, "text": "[79]다음은 과세사업자인 ㈜삼일의 2025년 10월 1일부터 2025년 12월 31일까지의 매입내역이다. 2025년\n제 2기 확정신고시 공제받을 수 있는 매입세액을 계산하면 얼마인가(단, 모두 세금계산서를 수령하였\n다)?\n매입내역 매입가액 매입세액\n비 품 10,000,000원 1,000,000원\n기업업무추진비 20,000,000원 2,000,000원\n토지조성을 위한 자본적지출 30,000,000원 3,000,000원\n원재료 40,000,000원 4,000,000원\n직원 회식비 10,000,000원 1,000,000원\n① 5,000,000원\n② 6,000,000원\n③ 7,000,000원\n④ 9,000,000원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 80, "text": "[80]다음 중 부가가치세의 신고 및 납부, 환급에 관한 설명으로 옳지 않은 것은?\n① 일반환급의 경우 환급세액은 확정신고기한이 지난 후 20일 이내에 환급한다.\n② 조기환급을 신청한 경우 환급세액은 신고기한이 지난 후 15일 이내에 환급한다.\n③ 사업설비(감가상각자산)를 신설·취득·확장 또는 증축하는 때에는 조기환급대상이 된다.\n④ 2025년 4월 19일에 폐업한 사업자는 2025년 5월 25일까지 확정 신고를 하여야 한다.\n\n< 원가관리회계 >", "answer": 1}, {"year": "2025", "month": "7", "qnum": 59, "text": "[59]다음 중 법인세 과세표준과 세액의 계산과 관련하여 옳은 주장을 하고 있는 사람은 누구인가?\n김부장 : 내국법인의 2025년에 발생한 결손금은 향후 10년간 이월하여 공제받을 수 있습니다.\n이과장 : 연구 및 인력개발비 세액공제는 최저한세 적용대상이며, 최저한세 적용으로 공제받지\n못한 세액공제는 향후 5년간 이월공제가 가능합니다.\n박차장 : 내국법인이 사업연도 중 천재지변이나 그 밖의 재해로 법 소정 자산총액의 20 % 이상\n상실하여 납세가 곤란하다고 인정되는 경우 재해손실 세액공제를 받을 수 있다.\n최사원 : 내국법인이 사업자로부터 재화를 3만원(부가가치세 포함)에 공급받고 신용카드 매출전표\n등 법정지출증명서류를 수취하지 아니하고 영수증을 수취한 경우에는 가산세를 납부하여야\n합니다.\n① 김부장\n② 이과장\n③ 박차장\n④ 최사원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳지 않은 것은?\n① 부가가치세는 납세의무자와 담세자가 상이한 간접세에 해당한다.\n② 우리나라 부가가치세 제도는 전단계거래액공제법을 따르고 있다.\n③ 부가가치세는 납세자의 소득수준과 관계 없이 모두 동일한 세율이 적용된다.\n④ 재화의 수입은 수입자가 사업자인지 여부과 관계 없이 부가가치세가 과세된다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 영세율을 적용받는 사업자도 부가가치세법상 사업자 등록의무가 있다.\n② 사업상 독립적으로 재화 또는 용역을 공급하는 경우 법인 뿐만 아니라 개인도 사업자에 해당한다.\n③ 과세사업과 면세사업을 겸영하는 사업자는 부가가치세법상 납세의무가 있기 때문에 과세사업자로 분\n류한다.\n④ 사업상 독립적이든 종속적이든 관계 없이 재화 또는 용역을 공급하는 자는 부가가치세법상 사업자에\n해당한다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 계속 사업을 하고 있는 일반과세자의 과세기간은 제1기는 1월 1일부터 6월 30일까지, 제2기는\n7월 1일부터 12월 31일까지로 한다.\n② 간이과세자가 일반과세자로 변경되는 경우 과세유형이 변경되는 해에 간이과세 규정이 적용되는 기\n간은 그 변경 이후 7월 1일로부터 12월 31일까지이다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에는 그 신청한 날부터 신청일이 속하는 과\n세기간의 종료일까지를 최초 과세기간으로 한다.\n④ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 74, "text": "[74]다음 중 부가가치세 납세지인 사업장에 관한 설명으로 옳은 것은?\n① 직매장과 하치장은 별도의 사업장으로 본다.\n② 부동산매매업의 경우 부동산의 등기부상의 소재지를 사업장으로 한다.\n③ 제조업의 경우 최종제품 완성장소를 사업장으로 보나, 따로 제품의 포장만 하거나 용기에 충전만을\n하는 장소는 사업장으로 보지 아니한다.\n④ 부동산임대업은 그 사업에 관한 업무총괄장소를 사업장으로 한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 75, "text": "[75]다음 중 재화의 간주공급에 대한 설명으로 옳지 않은 것은?\n① 면세전용 : 사업자가 자기의 과세사업을 위하여 취득한 재화(매입세액 공제분)를 자기의\n면세사업을 위하여 직접 사용하는 것은 매입세액 공제만 받고 면세로 재화를\n공급하는 효과가 있으므로 간주공급으로 본다.\n② 개인적 공급 : 사업자가 생산한 햄세트(매입세액 공제분)를 종업원에게 추석 선물로 제공하는\n것은 부가가치세 부담 없이 재화를 개인적인 목적으로 사용하는 효과가 있으므\n로 금액에 관계없이 간주공급으로 본다.\n③ 사업상 증여 : 사업자가 자기가 생산한 TV(매입세액 공제분)를 자기의 고객에게 무상으로 증\n여하는 것은 부가가치세 부담 없이 재화를 공급하는 효과가 있으므로 간주공급\n으로 본다.\n④ 폐업시 잔존재화 : 사업자가 사업을 폐업할 때에 자기가 취득한 재화 중 남아 있는 재화(매입세액\n공제분)는 매입세액 공제만 받고 부가가치세 부담이 없어지는 효과가 있으므로\n간주공급으로 본다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 76, "text": "[76]다음은 핸드폰을 판매하는 ㈜삼일의 2025년 거래내역이다. 2025년 제1기 예정신고 및 확정신고시의\n과세표준을 계산하면 얼마인가?\nㄱ. 2월 5일 : 핸드폰 1대를 200,000원에 현금판매함\nㄴ. 3월 6일 : 핸드폰 3대를 400,000원에 할부판매하고 대금을 당월부터 매월 50,000원씩 회수함\nㄷ. 3월 15일 : 핸드폰 10대를 1,000,000원에 할부판매하고 대금을 당월부터 매월 50,000원씩\n회수함\n예정신고 확정신고\n① 600,000원 150,000원\n② 600,000원 1,000,000원\n③ 650,000원 150,000원\n④ 1,600,000원 0원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 77, "text": "[77]다음 중 부가가치세법상 영세율과 면세에 관한 설명으로 잘못 짝지어진 것은 무엇인가?\n구분 영세율 면세\n국제적인 부가가치세의 역진성\n① 목적\n이중과세방지 완화\n② 성격 완전면세제도 부분면세제도\n③ 세금계산서 발급의무 없음 없음\n매입처별세금계산서\n④ 있음 있음\n합계표제출의무", "answer": 3}, {"year": "2025", "month": "7", "qnum": 78, "text": "[78]다음 자료를 이용하여 과세사업을 영위하는 ㈜삼일의 2025년 제 2기 예정신고기간의 부가가치세 과세\n표준을 구하면 얼마인가?\nㄱ. 특수관계가 없는 자에 대한 외상매출액 200,000,000원\n(매출에누리 5,000,000원, 매출할인 10,000,000원이 포함되어 있음)\nㄴ. 특수관계인에 대한 재화매출액(시가 60,000,000원) 40,000,000원\nㄷ. 상가건물의 처분액 700,000,000원\nㄹ. 하치장 용도로 사용하던 토지의 처분액 30,000,000원\n① 925,000,000원\n② 940,000,000원\n③ 945,000,000원\n④ 970,000,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 79, "text": "[79]다음은 제조업을 영위하는 과세사업자인 ㈜삼일의 2025년 10월 1일부터 12월 31일까지의 매입내역이\n다. 2025년 제 2기 확정신고시 공제받을 수 있는 매입세액을 계산하면 얼마인가(단, 모두 세금계산서\n를 수령하였다)?\n매입내역 매입가액 매입세액\n기계장치 90,000,000원 9,000,000원\n기업업무추진비 40,000,000원 4,000,000원\n토지 조성을 위한 자본적 지출 30,000,000원 3,000,000원\n소모품 10,000,000원 1,000,000원\n① 9,000,000원\n② 10,000,000원\n③ 13,000,000원\n④ 17,000,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 80, "text": "[80]다음 중 간이과세제도에 관한 설명으로 옳은 것은?\n① 간이과세제도를 채택하고 있는 이유는 영세사업자의 납세편의와 세부담경감을 위하여 매출액에 일정\n률을 적용하여 간편하게 과세하기 위함이다.\n② 간이과세자는 세금계산서 발급이 불가능하다.\n③ 간이과세자란 업종에 관계없이 직전 연도의 공급대가(부가가치세를 포함한 가액)의 합계액이 8천만\n원에 미달하는 개인사업자를 말한다.\n④ 부동산임대업을 영위하는 사업자로서 해당 업종의 직전 연도의 공급가액의 합계액이 4,000만원 이\n상인 사업자는 간이과세자로 보지 않는다.\n\n< 원가관리회계 >", "answer": 1}, {"year": "2025", "month": "9", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳은 것은?\n① 부가가치세는 특정한 재화 또는 용역만 과세하는 개별소비세에 해당한다.\n② 국제적 이중과세의 문제를 해결하기 위하여 원산지국 과세원칙을 채택하고 있다.\n③ 매출액에서 매입액을 차감하여 부가가치를 계산한 후 부가가치에 세율을 곱하는 방식으로 세액을 계\n산하는 전단계거래액공제법을 채택하고 있다.\n④ 재화의 수입은 재화를 수입하는 자가 사업자가 아니라도 부가가치세 과세대상이다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 면세사업자는 매출세액을 거래 징수하지 않는 대신 매입세액 공제 역시 받을 수 없다.\n② 면세사업자라도 부가가치세법에 따른 사업자등록 의무는 있다.\n③ 과세사업과 면세사업을 함께 영위하는 자를 겸영사업자라 한다.\n④ 비영리사업자도 부가가치세법상 납세의무자가 될 수 있다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 73, "text": "[73]다음 중 부가가치세법상 과세기간에 관한 설명으로 옳지 않은 것은?\n① 간이과세자의 경우 과세기간을 1월 1일부터 12월 31일까지로 한다.\n② 부가가치세의 과세기간은 1년을 4과세기간으로 나누어 3개월마다 신고·납부하도록 하고 있다.\n③ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.\n④ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에는 그 신청한 날부터 신청일이 속하는 과\n세기간의 종료일까지를 최초 과세기간으로 한다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 74, "text": "[74]다음 중 법인사업자의 업종과 부가가치세법상 사업장을 연결한 것으로 옳지 않은 것은?\n① 부동산임대업 : 그 부동산의 등기부상 소재지\n② 부동산매매업 : 법인의 등기부상 소재지(지점소재지 포함)\n③ 운수업 : 법인의 등기부상 소재지(지점소재지 포함)\n④ 제조업 : 원재료를 투입하는 장소", "answer": 4}, {"year": "2025", "month": "9", "qnum": 75, "text": "[75]다음 중 부가가치세 과세대상과 관련된 설명으로 옳은 것을 모두 고르면?\nㄱ. 재화의 공급은 계약상 또는 법률상의 모든 원인에 의하여 재화를 인도·양도하는 것을 말한다.\nㄴ. 사업자가 자기의 사업과 관련하여 생산한 재화를 자기의 사업을 위하여 직접 사용하는 모든\n경우 부가가치세 과세대상이다.\nㄷ. 용역의 무상공급은 부가가치세법상 용역의 공급으로 보지 않지만 특수관계인에게 무상으로\n제공하는 사업용 부동산 임대용역은 용역의 공급으로 본다.\nㄹ. 건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하는 경우 재화의 공급으로 본다.\n① ㄱ, ㄴ\n② ㄱ, ㄷ\n③ ㄱ, ㄹ\n④ ㄷ, ㄹ", "answer": 2}, {"year": "2025", "month": "9", "qnum": 76, "text": "[76]다음 중 부가가치세법상 재화와 용역의 공급시기에 관한 설명으로 옳지 않은 것은?\n① 수출재화의 공급 : 수출재화의 선(기)적일\n② 완성도기준지급조건부 판매 : 재화가 인도되거나 이용가능하게 되는 때\n③ 판매목적 타사업장 반출 : 재화를 반출하는 때\n④ 조건부판매 : 조건이 성취되어 판매가 확정된 때", "answer": 2}, {"year": "2025", "month": "9", "qnum": 77, "text": "[77]다음 자료로 회사 입장에서 영세율 제도와 면세 제도에 따라 부가가치세 납부 또는 환급세액을 계산할\n경우 회사에 어떤 제도가 얼마나 유리한지 알맞게 짝지어진 것을 고르시오.\n구 분 영세율 적용 면세 적용\n매출액 30,000,000원(수출) 30,000,000원(면세 - 국내 매출)\n매입액 20,000,000원(과세) 20,000,000원(과세)\n부가가치(매출액 - 매입액) 10,000,000원 10,000,000원\n① 영세율 제도가 1,000,000원 유리함\n② 영세율 제도가 2,000,000원 유리함\n③ 면세 제도가 1,000,000원 유리함\n④ 면세 제도가 2,000,000원 유리함", "answer": 2}, {"year": "2025", "month": "9", "qnum": 78, "text": "[78]다음은 부가가치세 과세사업을 영위하는 ㈜삼일의 제1기 예정신고기간의 거래내역이다. 제1기 예정신\n고기간의 과세표준은 얼마인가(단, 아래의 금액은 부가가치세가 포함되어 있지 않다)?\n⋅특수관계인 매출액 30,000,000원(시가 40,000,000원)\n⋅특수관계인 이외의 매출 40,500,000원(매출환입 3,500,000원, 매출에누리 1,500,000원과\n매출할인 500,000원이 차감된 금액)\n① 70,500,000원\n② 76,000,000원\n③ 80,500,000원\n④ 86,000,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 79, "text": "[79]㈜용산은 의료제조업을 영위하는 중소기업이며 일반과세자이다. 다음 자료는 2025년 제1기 예정신고기\n간(2025년 1월 1일 ~ 2025년 3월 31일)에 공급받은 재화 및 용역의 거래내역이다. ㈜용산의 2025년\n제1기 예정신고기간의 매입세액공제액으로 옳은 것은(단, 제시된 금액은 부가가치세가 포함되어 있지\n않다)?\n⋅국내거래처로부터 원단을 구입하고 공급가액 50,000,000원의 세금계산서를 수취하였다.\n⋅업무무관자산의 도색비를 지출하면서 공급가액 2,000,000원의 세금계산서를 수취하였다.\n⋅공급가액 5,000,000원(세금계산서 수취)에 구입한 재화를 거래처에 접대 목적으로 무상 증정하였다.\n⋅생산직 직원들의 회식비로 공급가액 4,000,000원을 지출하고 세금계산서를 수취하였다.\n① 5,000,000원\n② 5,400,000원\n③ 5,500,000원\n④ 6,100,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 80, "text": "[80]다음은 ㈜삼일의 2025년 10월 1일부터 2025년 12월 31일까지의 거래 내역이다. 부가가치세 신고서\n<#1> ~ <#4> 에 기입할 금액은 얼마인가(단, 세금계산서는 부가가치세법에 따라 적절하게 교부하였다)?\n< 자료1 > 2025년 10월 1일 ~ 2025년 12월 31일 거래내역\nㄱ. 국내 도매상인 ㈜부산에 600,000,000원(VAT 미포함)의 제품을 판매하고 세금계산서를 발행함\nㄴ. 국내 소매상인 ㈜광주에 330,000,000원(VAT 포함)의 제품을 판매하고 신용카드매출전표를 발행함\n(매출전표에 공급받는 자와 부가가치세액을 별도로 기재함)\nㄷ. 수출업체인 ㈜대구에 Local L/C에 의해 400,000,000원의 제품을 판매함\nㄹ. 2025년 11월 3일 거래처인 ㈜인천의 파산으로 매출채권 88,000,000원(VAT포함, 2012년 6월\n매출분)의 대손이 확정됨\n< 자료2 > 부가가치세 신고서 양식\n구분 과세표준 세액\n세금계산서 <#1>\n매입자발행세금계산서\n과세\n신용카드·현금영수증 <#2>\n기타\n세금계산서 <#3>\n영세율\n기타\n대손세액 <#4>\n<#1> <#2> <#3> <#4>\n① 660,000,000원 - 400,000,000원 △88,000,000원\n② 600,000,000원 300,000,000원 400,000,000원 △ 8,000,000원\n③ 600,000,000원 330,000,000원 - △ 8,000,000원\n④ 900,000,000원 - 400,000,000원 △80,000,000원\n\n< 원가관리회계 >", "answer": 2}, {"year": "2025", "month": "11", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되는 금액은 얼마인가?\nㄱ. 부가가치세 매출세액 5,000,000원\nㄴ. 자산수증이익(세무상 이월결손금의 보전에 충당하는 금액 없음) 3,000,000원\nㄷ. 국세·지방세 과오납금의 환급금 이자 2,000,000원\nㄹ. 자기주식의 양도금액 4,000,000원\nㅁ. 법인세 환급액 1,000,000원\n① 4,000,000원\n② 6,000,000원\n③ 7,000,000원\n④ 9,000,000원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 71, "text": "[71]다음 중 우리나라의 부가가치세에 관한 설명으로 옳은 것은?\n① 부가가치세는 납세의무자와 담세자가 동일한 직접세에 해당한다.\n② 부가가치세는 전단계거래액공제법을 따르고 있다.\n③ 부가가치세는 납세자의 소득수준과 관련없이 모두 동일한 세율이 적용된다.\n④ 재화의 수입은 수입자가 사업자가 아닌 경우에만 부가가치세가 과세된다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 72, "text": "[72]다음 중 부가가치세법상 사업자에 관한 설명으로 옳은 것은?\n① 사업자는 면세사업자와 과세사업자로 구분된다.\n② 비영리법인은 공익적인 사업을 하므로 부가가치세 납세의무가 없다.\n③ 영세율을 적용받는 사업자는 부가가치세법상의 사업자 등록의무가 없다.\n④ 과세사업과 면세사업을 겸영하는 자를 겸영사업자라 하며, 겸영사업자는 면세사업에 대해서도 부가\n가치세 납세의무가 있다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 계속 사업을 하고 있는 간이과세자의 과세기간은 제1기는 1월 1일부터 6월 30일까지, 제2기는\n7월 1일부터 12월 31일까지로 한다.\n② 일반과세자가 간이과세자로 변경되는 경우 과세유형이 변경되는 해에 간이과세 규정이 적용되는 기\n간은 그 변경 이후 7월 1일부터 12월 31일까지이다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에는 그 신청한 날부터 신청일이 속하는 과\n세기간의 종료일까지를 최초 과세기간으로 한다.\n④ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 건설업의 경우 법인은 그 법인의 등기부상 소재지, 개인은 업무총괄장소를 사업장으로 한다.\n② 직매장은 사업장에 해당하나, 하치장은 사업장에 해당하지 아니한다.\n③ 부동산임대업의 경우 그 부동산의 등기부상의 소재지를 사업장으로 본다.\n④ 제조업의 경우 최종 제품을 완성하는 장소를 사업장으로 하되, 따로 제품의 포장만 하거나 용기에\n충전하는 장소가 있는 경우에는 그 장소를 사업장으로 한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 75, "text": "[75]다음 중 부가가치세법상 재화의 공급에 관한 설명으로 옳지 않은 것은?\n① 사업자가 주사업장 총괄납부의 적용을 받는 과세기간에 자기사업과 관련하여 생산 또는 취득한 재화\n를 타인에게 직접 판매할 목적으로 다른 사업장에 반출하는 경우에는 재화의 공급으로 보지 아니한\n다.\n② 사업자 단위과세 사업자가 판매목적으로 타사업장에 반출하는 경우에는 이를 재화의 공급으로 본다.\n③ 사업자가 자기의 과세사업과 관련하여 취득한 재화(매입세액을 공제받음)를 자기의 면세사업에 전용\n한 경우에는 재화의 공급으로 본다.\n④ 사업자가 자기의 사업과 관련하여 취득한 재화(매입세액공제를 받음)를 직장 연예 및 직장 문화 관\n련으로 사용한 경우에는 재화의 공급으로 보지 아니한다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 76, "text": "[76]다음 중 부가가치세법상 공급시기에 관한 설명으로 옳지 않은 것은?\n① 장기할부판매의 경우에는 대가의 각 부분을 받기로 한 때를 공급시기로 한다.\n② 전력이나 그 밖에 공급단위를 구획할 수 없는 재화를 계속적으로 공급하는 경우에는 대가의 각 부분\n을 받기로 한 때를 재화의 공급시기로 본다.\n③ 내국신용장에 의하여 공급하는 재화의 공급시기는 인도일로 한다.\n④ 무인판매기를 이용하여 재화를 공급하는 경우에는 재화를 인도하는 때를 공급시기로 한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 77, "text": "[77]다음 중 부가가치세법상 영세율이 적용되는 거래에 해당하는 것을 모두 고르면?\nㄱ. 재화의 수출\nㄴ. 용역의 국외공급\nㄷ. 국민주택 건설용역\nㄹ. 내국신용장에 의하여 공급하는 재화\n① ㄱ, ㄴ\n② ㄱ, ㄴ, ㄷ\n③ ㄱ, ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ, ㄹ", "answer": 3}, {"year": "2025", "month": "11", "qnum": 78, "text": "[78]다음은 제조업을 영위하는 일반과세자인 ㈜삼일의 2025년 제2기 예정신고기간(2025년 7월 1일 ~\n2025년 9월 30일)에 대한 자료이다. ㈜삼일의 2025년 제2기 예정신고기간의 부가가치세 과세표준은\n얼마인가(단, 다음 자료의 금액에는 부가가치세가 포함되어 있지 않다)?\n(1) 2025년 7월 1일：제품을 6,000,000원에 인도하고 대금은 10월 31일에 전액\n받기로 하였다.\n(2) 2025년 7월 25일：컴퓨터유지보수 계약을 맺고 7월 25일부터 24개월 간 매달\n25일에 2,000,000원씩 받기로 하였다.\n(3) 2025년 8월 14일：제품(매입세액공제분)을 거래처에 판매장려물품(제조원가\n2,000,000원, 시가 3,000,000원)으로 증여하였다.\n(4) 2025년 9월 30일：2025년 6월 30일에 판매한 제품이 하자가 발생하여 판매액\n2,000,000원(제조원가 1,000,000원)인 제품이 반품되었다.\n① 13,000,000원\n② 14,000,000원\n③ 15,000,000원\n④ 18,000,000원", "answer": 1}, {"year": "2025", "month": "11", "qnum": 79, "text": "[79]다음은 과세사업자인 ㈜삼일(전자제품 제조업)의 2025년 10월 1일부터 2025년 12월 31일까지의 매입\n내역이다. 2025년 제 2기 확정신고시 공제받을 수 있는 매입세액을 계산하면 얼마인가(단, 제시된 거\n래에 대하여 세금계산서를 발급받았다)?\n구분 매입가액 매입세액\n화물차 구입 40,000,000원 4,000,000원\n기업업무추진비 지출 20,000,000원 2,000,000원\n개별소비세 과세대상 자동차 구입\n10,000,000원 1,000,000원\n(5인승, 경차 아님)\n원재료 매입 30,000,000원 3,000,000원\n토지의 자본적지출 10,000,000원 1,000,000원\n① 4,000,000원\n② 7,000,000원\n③ 8,000,000원\n④ 9,000,000원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 80, "text": "[80]다음은 ㈜삼일의 제2기 부가가치세 확정신고를 위한 자료이다. (ㄱ)에 들어갈 금액으로 옳은 것은?\nㄱ. 국내판매분\n- 세금계산서 발행 매출액 33,000,000원(부가가치세 제외)\n- 신용카드매출전표 발행분 22,000,000원(부가가치세 포함)\nㄴ. 중계무역방식의 수출액 7,000,000원\nㄷ. 내국신용장에 의한 수출 20,000,000원\nㄹ. 직수출액 3,000,000원\n< 신고내용 >\n구분 금액 세율 세액\n세금계산서 발급분 10/100\n매입자발행세금계산서 10/100\n과세표준 과세\n신용카드·현금영수증발행분 10/100\n및\n기타(정규영수증 외 수취분) 10/100\n매출세액\n세금계산서 발급분 0/100\n영세율\n기 타 (ㄱ) 0/100\n① 10,000,000원\n② 20,000,000원\n③ 22,000,000원\n④ 33,000,000원\n\n< 원가관리회계 >", "answer": 1}, {"year": "2025", "month": "12", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳은 것은?\n① 공장에서 제조하는 재화는 출고단계에서 한 번 과세하고, 유통단계에서는 추가로 과세하지 않는 단\n단계거래세이다.\n② 국제적 이중과세의 문제를 해결하기 위하여 수출품에 대하여 부가가치세를 과세하지 않는 영세율제\n도를 두고 있다.\n③ 매출액에서 매입액을 차감하여 부가가치를 계산한 후 부가가치에 세율을 곱하는 방식으로 세액을 계\n산하는 전단계거래액공제법을 채택하고 있다.\n④ 부가가치세는 법령에 과세대상으로 구체적으로 열거된 재화 또는 용역을 과세대상으로 한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 과세·면세 겸영사업자는 부가가치세법에 따른 사업자 등록의무가 없다.\n② 사업상 독립적으로 재화 또는 용역을 공급하는 경우 법인 뿐만 아니라 개인도 사업자에 해당한다.\n③ 사업자단위과세사업자는 본점 또는 주사무소에서 모든 사업장의 부가가치세를 총괄하여 신고 및 납\n부할 수 있다.\n④ 영세율을 적용받는 사업자는 부가가치세법상의 사업자 등록의무가 있다.", "answer": 1}, {"year": "2025", "month": "12", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 사업개시일 이전에 사업자등록을 신청한 경우의 과세기간은 그 신청한 날부터 그 신청일이 속하는\n과세기간의 종료일까지로 한다.\n② 사업자가 폐업하는 경우의 과세기간은 폐업일이 속하는 과세기간의 개시일부터 폐업일이 속하는 달\n의 말일까지로 한다.\n③ 간이과세자의 과세기간은 1월 1일부터 12월 31일까지이다.\n④ 신규사업자의 최초과세기간은 사업개시일부터 그 날이 속하는 과세기간의 종료일까지로 하는 것이\n원칙이다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 74, "text": "[74]다음 중 부가가치세 납세지인 사업장에 관한 설명으로 옳은 것은?\n① 무인자동판매기를 통하여 재화·용역을 공급하는 사업의 경우 무인자동판매기가 설치된 장소를 사업\n장으로 한다.\n② 부동산매매업의 경우 부동산의 등기부상의 소재지를 사업장으로 한다.\n③ 제조업의 경우 최종제품을 완성하는 장소를 사업장으로 하며, 이 경우 따로 제품의 포장만을 하거나\n용기에 충전만을 하는 장소를 포함한다.\n④ 직매장은 사업장으로 보나, 하치장은 사업장으로 보지 아니한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 75, "text": "[75]다음 사실과 관계가 깊은 부가가치세법 규정은 무엇인가?\n사업자가 종업원에게 증정할 명절선물을 구입하면서 세금계산서를 발급받고 매입세액공제를 받은\n후 종업원에게 증정하고 부가가치세 신고를 하지 않았다. 관할 세무서로부터 종업원에게 증정한\n명절선물이 1인당 연간 10만원을 초과하므로 부가가치세를 과세하겠다는 통보를 받았다.\n① 자가공급\n② 사업상 증여\n③ 개인적 공급\n④ 폐업시 잔존재화", "answer": 3}, {"year": "2025", "month": "12", "qnum": 76, "text": "[76]다음 중 부가가치세법상 재화와 용역의 공급시기에 관한 설명으로 옳지 않은 것은?\n① 판매목적 타사업장 반출 : 재화를 반출하는 때\n② 장기할부조건부 판매 : 대가의 각 부분을 받기로 한 때\n③ 수출재화의 공급 : 수출재화의 수출신고일\n④ 조건부판매 : 조건이 성취되거나 기한이 경과하여 판매가 확정된 때", "answer": 3}, {"year": "2025", "month": "12", "qnum": 77, "text": "[77]다음은 김삼일씨의 2025년 5월 가계부 지출내역이다. 지출금액에 포함된 부가가치세 합계를 계산하면\n얼마인가(단, 공급자는 부가가치세법에 따라 적법하게 부가가치세를 거래징수 하였다고 가정한다)?\n일 자 적 요 지 출 금 액\n1월 14일 대추 구입 11,000원\n1월 21일 치즈 구입 22,000원\n1월 27일 도서(책) 구입 44,000원\n1월 30일 프로야구 입장권 구입 33,000원\n① 3,000원\n② 4,000원\n③ 5,000원\n④ 8,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 79, "text": "[79]중소기업이며 일반과세자인 ㈜한국의 제2기 예정신고기간(2025년 7월 1일 ~ 2025년 9월 30일) 중에\n공급받은 재화 및 용역의 거래내역으로 제시된 금액은 공급가액(부가가치세 별도)이다. ㈜한국의 2025\n년 제2기 예정신고기간의 매입세액공제액을 계산하면 얼마인가(단, 모든 거래에 세금계산서와 신용카\n드매출전표는 적법하게 수취되었다고 가정한다)?\n(1) 국내거래처로부터 전자부품을 구입하고 공급가액 20,000,000원의 세금계산서를 수취하였다.\n(2) 공급가액 3,000,000원(세금계산서 수취)에 구입한 재화를 거래처에 접대 목적으로 무상 증정\n하였다.\n(3) 생산직 직원들의 작업복으로 사용할 목적으로 의류를 구입하고 공급가액 4,000,000원의 세금\n계산서를 수취하였다.\n(4) 직장회식비 1,000,000원(공급가액)을 지출하고 신용카드매출전표를 수취하였다.\n① 2,200,000원\n② 2,500,000원\n③ 2,600,000원\n④ 2,800,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 80, "text": "[80]다음은 ㈜서울의 2025년 7월 1일 ~ 2025년 9월 30일까지의 거래내역이다. 부가가치세 신고서 <#1>에\n기입할 금액으로 옳은 것은(단, 세금계산서는 부가가치세법에 따라 적절하게 발급하였다)?\n< 자료1 > 2025년 7월 1일 ~ 2025년 9월 30일 거래내역\nㄱ. 미국에 제품을 40,000,000원에 직수출함\nㄴ. 국내 소매상인 ㈜광주에 10,000,000원(VAT 포함)의 제품을 판매함\nㄷ. 수출업체인 ㈜부산에 Local L/C에 의해 20,000,000원의 제품을 판매함\nㄹ. 최종소비자에게 10,000,000원의 제품을 판매함\nㅁ. 수출업체인 ㈜포항에 구매확인서에 의해 10,000,000원의 제품을 판매함\n< 자료2 > 부가가치세 신고서 양식 (단위: 원)\n구분 과세표준 세액\n세금계산서\n과 세\n기 타\n세금계산서 <#1>\n영세율\n기 타\n계\n① 10,000,000원\n② 20,000,000원\n③ 30,000,000원\n④ 40,000,000원\n\n< 원가관리회계 >", "answer": 3}], "01_국세기본법": [{"year": "2024", "month": "1", "qnum": 42, "text": "[42]다음 중 세법상 기간과 기한의 규정에 관한 설명으로 옳은 것은?\n① 기간을 일∙주∙월∙연으로 정한 때에는 기간 계산시 기간의 초일을 산입한다.\n② 기간의 계산은 민법에 규정이 있는 것을 제외하고는 국세기본법 또는 세법에 따른다.\n③ 2023년 12월 31일로 사업연도가 종료하는 법인은 2024년 3월 31일까지 법인세를 신고∙납부하여야\n하는데 공교롭게도 2024년 3월 31일이 일요일인 경우에는 금요일인 2024년 3월 29일까지 법인세\n를 신고·납부하여야 한다.\n④ 신고서 등을 국세정보통신망을 이용하여 제출하는 경우에는 해당 신고서 등이 국세청장에게 전송된\n때에 신고되거나 청구된 것으로 본다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 43, "text": "[43]다음 중 과세관청의 행위에 대하여 신의성실의 원칙이 적용되기 위한 요건으로 옳지 않은 것은?\n① 납세자의 신뢰의 대상이 되는 과세관청의 공적 견해표시가 있어야 한다.\n② 납세자가 과세관청의 견해표시를 신뢰하고, 그 신뢰에 납세자의 귀책사유가 있어야 한다.\n③ 과세관청이 당초의 견해표시에 반하는 적법한 행정처분을 하여야 한다.\n④ 과세관청의 그러한 배신적 처분으로 인하여 납세자가 불이익을 받아야 한다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 44, "text": "[44]다음 중 과세표준수정신고에 관한 설명으로 옳은 것은?\n① 과세표준신고서에 기재된 결손금액이 세법에 따라 신고하여야 할 결손금액에 미달하는 경우에도 수\n정신고를 할 수 있다.\n② 경정이 있을 것을 미리 알고 과세표준수정신고서를 제출한 경우는 가산세가 감면되지 않는다.\n③ 과세표준수정신고서를 법정신고기한이 지난 후 2년 이내에 제출한 자에 대하여는 기간경과 정도에\n따라 납부지연가산세의 일정비율을 경감한다.\n④ 기한 후 과세표준 신고를 한 자는 기한 후 신고서에 기재된 과세표준 및 세액이 세법에 따라 신고하\n여야 할 과세표준 및 세액에 미치지 못하는 경우에도 수정신고 할 수 없다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 42, "text": "[42]다음 중 국세기본법상 특수관계인에 관한 설명으로 옳지 않은 것은?\n① 본인을 기준으로 특수관계에 해당하는 경우 본인도 그 특수관계인의 특수관계인으로 본다.\n② 배우자에는 사실상의 혼인 관계에 있는 자를 포함한다.\n③ 친생자로서 다른 사람에게 친양자 입양된 자 및 그 배우자 ․ 직계비속은 특수관계인에 해당한다.\n④ 법인과 그 법인의 임원은 특수관계인에 해당하나 그 밖의 사용인은 그 법인과 특수관계에 해당하지\n아니한다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 43, "text": "[43]다음 중 국세부과의 원칙에 관한 설명으로 옳지 않은 것은?\n① 신의성실의 원칙이란 납세자가 그 의무를 이행할 때 또는 세무공무원이 직무를 수행할 때 신의에 따\n라 성실하게 하여야 한다는 원칙이다.\n② 근거과세의 원칙이란 장부 등 직접적인 자료에 입각하여 납세의무를 확정해야 한다는 원칙이다.\n③ 조세감면 사후관리란 세법이 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용범위\n를 정할 수 있는 원칙이다.\n④ 실질과세의 원칙은 조세법률주의를 구체화한 국세부과의 원칙이다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 44, "text": "[44]다음 중 국세기본법상 이의신청, 심사청구 및 심판청구에 관한 설명으로 옳은 것은?\n① 국세기본법에 따른 동일한 처분에 대하여 심사청구와 심판청구를 중복하여 제기할 수 있다.\n② 이의신청을 하려면 처분이 있음을 안 날로부터 60일 이내에 신청하여야 한다.\n③ 이의신청은 임의적 절차이므로 이의신청을 거치지 않고 심사청구 또는 심판청구를 할 수 있다.\n④ 납세자는 행정소송을 제기하고자 하는 경우에는 결정통지서를 받은 날(결정통지 전이라도 그 결정기\n간이 지난 날)로부터 60일 이내에 서류를 제출해야 한다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 42, "text": "[42]다음 중 국세기본법상 서류의 송달에 관한 설명으로 옳은 것은?\n① 교부 또는 우편에 따라 송달하는 서류는 송달받아야 할 자에게 도달한 때부터 효력이 발생한다.\n② 국세기본법 또는 세법에 규정하는 서류는 그 명의인의 주소에만 송달하여야 한다.\n③ 정보통신망의 장애로 납세고지서의 전자송달이 불가능한 경우에는 교부에 의해서만 송달할 수 있다.\n④ 납세고지서를 공시송달하는 경우 서류의 주요 내용을 공고한 날부터 10일이 지나면 서류 송달이 된\n것으로 본다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙에 관한 설명으로 옳지 않은 것은?\n① 신의·성실은 세무공무원이 직무를 수행할 때에 적용되는 원칙이므로 납세자가 그 의무를 이행할 때\n에는 적용되지 아니한다.\n② 세무서장이 종합소득 과세표준과 세액을 경정하는 경우 거주자가 추계 신고한 경우에도 소득금액을\n계산할 수 있는 장부 기타 증빙서류를 비치, 기장하고 있는 때에는 그 장부 기타 증빙서류에 근거하\n여 실지조사 결정하여야 한다.\n③ 정부는 국세를 감면한 경우에 그 감면의 취지를 성취하거나 국가정책을 수행하기 위하여 필요하다고\n인정하면 세법에서 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용 범위를 정할\n수 있다.\n④ 명의신탁부동산을 매각처분한 경우에는 양도의 주체 및 납세의무자는 원칙적으로 명의수탁자가 아니\n고 명의신탁자이다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 44, "text": "[44]다음 중 국세기본법상 가산세의 감면에 관한 설명으로 옳은 것은?\n① 국세를 감면하는 경우에 가산세는 그 감면하는 국세에 포함한다.\n② 과세표준과 세액을 경정할 것을 미리 알고 과세표준수정신고서를 제출한 경우에는 법정신고기한이\n지난 후 1개월 이내에 수정신고한 경우에만 가산세를 감면한다.\n③ 납세자가 의무를 이행하지 아니한 데에 정당한 사유가 있는 경우에는 가산세의 90 % 에 상당하는 금\n액을 감면한다.\n④ 과세표준신고서를 법정신고기한까지 제출하지 아니한 자가 법정신고기한이 지난 후 1개월 이내에 기\n한 후 신고를 한 경우에는 무신고가산세의 50 % 에 상당하는 금액을 감면한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 42, "text": "[42]다음 중 기간과 기한에 관한 설명으로 옳지 않은 것은?\n① 기간을 일,주,월 또는 연으로 정한 때에는 초일은 기간 계산시 산입하지 않는 것을 원칙으로 한다.\n② 기한이란 일정한 시점의 도래로 인하여 법률효과가 발생·소멸하거나 또는 일정한 시점까지 의무를\n이행하여야 하는 경우에 그 시점을 말한다.\n③ 기간의 계산은 국세기본법 또는 그 세법에 특별한 규정이 있는 것을 제외하고는 민법을 따른다.\n④ 국세기본법에서 규정하는 서류의 제출에 관한 기한이 토요일 및 일요일, 공휴일 및 대체공휴일, 근\n로자의 날인 경우에는 그 공휴일 등의 전 날을 기한으로 한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙과 관련된 내용으로 옳지 않은 것은?\n① 정부는 국세를 감면한 경우에 그 감면의 취지를 성취하거나 국가정책을 수행하기 위하여 필요하다고\n인정하면 세법에서 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용 범위를 정할\n수 있다.\n② 국세를 조사ㆍ결정할 때 장부의 기록 내용이 사실과 다르거나, 장부의 기록에 누락된 것이 있을 때\n에는 그 부분에 대해서만 정부가 조사한 사실에 따라 결정할 수 있다.\n③ 사실상 당해 사업자가 취득하여 사업에 공하였음이 확인되는 경우에도 공부상 등기ㆍ등록 등이 타인\n의 명의로 되어 있는 경우에는 이를 그 사실상 사업자의 사업용자산으로 보지 아니한다.\n④ 정부는 장부의 기록 내용과 다른 사실 또는 장부 기록에 누락된 것을 조사하여 결정하였을 때에는\n정부가 조사한 사실과 결정의 근거를 결정서에 적어야 한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 44, "text": "[44]다음 중 국세기본법상 수정신고와 경정청구에 관한 내용으로 옳지 않은 것은?\n① 과세표준신고서를 법정신고기한까지 제출한 자 및 기한후과세표준신고서를 제출한 자는 수정신고를\n할 수 있다.\n② 납세의무자가 당초신고시 과세표준과 세액을 과다신고하거나 결손금액 또는 환급세액을 과소신고한\n경우 경정 등 청구를 할 수 있다.\n③ 과세표준신고서를 법정신고기한까지 제출한 자 또는 국세의 과세표준 및 세액의 결정을 받은 자는\n후발적 사유가 발생하였을 때에는 그 사유가 발생한 것을 안 날부터 2개월 이내에 결정 또는 경정\n을 청구할 수 있다.\n④ 과세표준신고서를 법정신고기한까지 제출한 자가 법정신고기한이 지난 후 2년 이내에 수정신고한\n경우(과세표준과 세액을 경정할 것을 미리 알고 과세표준수정신고서를 제출한 경우는 제외한다)에는\n과소신고·초과환급신고가산세의 법 소정 비율에 상당하는 금액을 감면한다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 41, "text": "[41]다음 중 조세의 개념에 관한 설명으로 옳은 것은?\n① 공공단체가 공공사업에 필요한 경비에 충당하기 위하여 부과하는 공과금도 조세에 해당한다.\n② 조세는 위법행위에 대한 제재에 목적을 두고 있는 과태료와 그 성격이 매우 유사하다.\n③ 납세는 국민의 당연한 의무이므로 조세의 과세요건은 법률로 규정할 필요가 없다.\n④ 조세는 국가 또는 지방자치단체의 경비충당을 위한 재정수입을 조달할 목적으로 부과된다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 42, "text": "[42]다음의 국세기본법상 기간과 기한 및 서류의 송달에 관한 설명으로 옳지 않은 것은?\n① 전자신고의 경우 해당 신고서 등이 국세청장에게 전송된 때에 신고되거나 청구된 것으로 본다.\n② 공시송달의 경우 서류의 주요 내용을 공고한 날부터 14일이 지나면 서류송달이 된 것으로 본다.\n③ 교부·우편송달은 송달받아야 할 자에게 도달한 때부터 효력이 발생한다.\n④ 서류의 송달은 발신주의를, 우편신고의 경우에는 도달주의를 원칙으로 한다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 43, "text": "[43]국세부과의 원칙 중 법적 형식이나 외관에 관계없이 실질에 따라 세법을 해석하고 과세요건사실을 인정\n해야 한다는 것은 어떤 원칙에 입각한 것인가?\n① 소급과세금지의 원칙\n② 조세법률주의\n③ 실질과세의 원칙\n④ 신의성실의 원칙", "answer": 3}, {"year": "2024", "month": "7", "qnum": 44, "text": "[44]다음 중 국세기본법상 무신고가산세 또는 과소신고가산세 부과시 부정행위로 보는 것이 아닌 것은?\n① 이중장부의 작성\n② 재산의 은닉\n③ 신고기한까지 신고를 하지 아니하는 경우\n④ 거짓 증빙의 작성", "answer": 3}, {"year": "2024", "month": "9", "qnum": 41, "text": "[41]다음 중 조세의 분류기준에 따른 구분과 세목을 연결한 것으로 옳지 않은 것은?\n분류기준 구분 조세항목\n국세 법인세, 소득세, 부가가치세\n① 과세권자\n지방세 취득세, 등록면허세, 주민세\n사용용도의 보통세 법인세, 소득세, 부가가치세\n②\n특정여부 목적세 교육세\n조세부담의 직접세 법인세, 소득세\n③\n전가여부 간접세 개별소비세\n납세의무자의 인세 재산세, 부가가치세\n④\n인적사항 고려여부 물세 소득세", "answer": 4}, {"year": "2024", "month": "9", "qnum": 42, "text": "[42]다음 중 국세기본법상 특수관계인에 관한 설명으로 옳지 않은 것은?\n① 친생자로서 다른 사람에게 친양자 입양된 자는 특수관계인에 해당한다.\n② 특수관계자인 배우자는 사실혼 관계에 있는 자를 제외한다.\n③ 법인과 경제적 연관관계가 있는 임원은 특수관계인에 해당한다.\n④ 개인이 직접 또는 그와 친족관계에 있는 자를 통하여 법인의 경영에 대하여 지배적인 영향력을 행사\n하는 경우 그 법인은 특수관계인에 해당한다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 43, "text": "[43]다음 중 소급과세의 금지 원칙에 관한 설명으로 옳지 않은 것은?\n① 국세를 납부할 의무가 성립한 소득에 대하여 그 성립 후의 새로운 법에 따라 소급하여 과세할 수 없\n다.\n② 국세청의 해석이 일반적으로 납세자에게 받아들여진 후에는 새로운 해석에 의하여 소급하여 과세할\n수 없다.\n③ 조세법률관계에 있어 법적안정성 및 예측가능성을 보장하기 위한 국세부과의 원칙 중 하나이다.\n④ 과세기간 중에 법률의 개정이 있는 경우 사업연도 개시일부터 적용하는 것은 허용된다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 44, "text": "[44]다음 중 수정신고와 경정청구에 관한 설명으로 옳은 것은?\n① 수정신고는 관할세무서장이 당해 국세에 대한 과세표준과 세액의 결정 또는 경정 통지하기 전으로서\n국세부과 제척기간이 끝나기 전까지 할 수 있다.\n② 수정신고는 과세표준과 세액을 법정신고기한까지 신고하지 못한 경우 법정신고기한이 지난 후 신고\n하는 것을 말한다.\n③ 납세의무자가 당초 신고 시 과세표준 및 세액을 과다하게 신고하였다면 수정신고를 할 수 있다.\n④ 후발적사유와 같은 특별한 사유가 없다면 법정신고기한(신고기한이 연장된 경우에는 그 연장된 기\n한)이 지난 후 3년 이내에 경정청구를 하여야 한다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 49, "text": "[49]다음 중 법인세법상 손금으로 인정되는 금액은 얼마인가(단, 손금인정을 위한 기타 요건은 갖추었다고\n가정한다)?\nㆍ 업무와 관련하여 발생한 교통사고 벌과금 5,000,000원\nㆍ 세금과공과(가산세 500,000 포함) 3,000,000원\nㆍ ⌜국민건강보험법 에 따라\n⌟\n사용자로서 부담하는 국민건강보험료 1,500,000원\nㆍ 직장체육비 3,200,000원\n① 1,500,000원\n② 4,500,000원\n③ 7,200,000원\n④ 12,200,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 41, "text": "[41]다음 중 조세의 분류에 관한 설명으로 옳지 않은 것은?\n① 조세는 과세권자에 따라 국세와 지방세로 분류한다.\n② 농어촌특별세는 조세의 사용용도를 특정하여 징수하는 목적세에 해당한다.\n③ 소득세는 납세자의 인적사항이 고려되는 인세(人稅)에 해당한다.\n④ 개별소비세는 입법상 조세부담의 전가를 예상하지 아니한 조세이므로 직접세에 해당한다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 42, "text": "[42]다음 중 국세기본법상 특수관계인에 관한 설명으로 옳지 않은 것은?\n① 본인이 법인인 경우 해당 법인의 임원은 특수관계인에 해당한다.\n② 본인이 개인인 경우 해당 개인의 배우자(사실상의 혼인관계에 있는 자를 제외한다)는 특수관계인에\n해당한다.\n③ 본인이 개인인 경우 해당 개인의 4촌 이내의 혈족은 특수관계인에 해당한다.\n④ 본인이 개인인 경우 3촌 이내의 인척은 특수관계인에 해당한다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙 및 세법적용의 원칙에 관한 설명으로 옳지 않은 것은?\n① 실질과세의 원칙은 조세평등주의를 구체화한 국세부과의 원칙이다.\n② 소급과세금지의 원칙이란 세법의 해석이나 국세행정의 관행이 일반적으로 납세자에게 받아들여진 후\n에는 그 해석이나 관행에 의한 행위 또는 계산은 정당한 것으로 보며, 새로운 해석이나 관행에 의하\n여 소급하여 과세하지 아니하는 것을 말한다.\n③ 납세자가 그 의무를 이행할 때 신의에 따라 성실하게 할 것을 요구하는 신의성실의 원칙은 세무공무\n원이 직무를 수행할 때에는 적용되지 아니한다.\n④ 근거과세의 원칙에 의해 국세를 조사ㆍ결정할 때, 장부의 기록내용이 사실과 다르거나 장부의 기록\n에 누락된 것이 있을 때에는 그 부분에 대해서만 과세관청이 조사한 사실에 따라 결정할 수 있다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 42, "text": "[42]다음 중 국세기본법상 기간과 기한에 관련된 설명으로 옳지 않은 것은?\n① 국세기본법 또는 세법에서 규정하는 기간의 계산은 국세기본법 또는 그 세법에 특별한 규정이 있는\n것을 제외하고는 민법에 따른다.\n② 기한은 일정시점의 도래로 인하여 법률효과가 발생ㆍ소멸하거나 또는 일정한 시점까지의 의무를 이\n행하여야 하는 경우에 그 시점을 말한다.\n③ 주, 월 또는 연의 처음으로부터 기간을 기산하지 아니하는 때에는 최후의 주, 월 또는 연에서 그 기\n산일에 해당한 날의 다음 날로 기간이 만료한다.\n④ 월 또는 연으로 기간을 정한 경우에 최종의 월에 해당일이 없는 때에는 그 월의 말일로 기간이 만료\n한다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 43, "text": "[43]과세의 대상이 되는 소득, 수익, 재산, 행위 또는 거래의 귀속이 명의(名義)일 뿐이고 사실상 귀속되는\n자가 따로 있을 때에는 사실상 귀속되는 자를 납세의무자로 하여 세법을 적용한는 것은 다음 중 어떤\n원칙과 관련된 것인가?\n① 소급과세금지의 원칙\n② 실질과세의 원칙\n③ 조세법률주의\n④ 신의성실의 원칙", "answer": 2}, {"year": "2024", "month": "12", "qnum": 44, "text": "[44]세무조사결과통지 또는 과세예고통지를 받은 자가 통지를 받은 날부터 30일 이내에 통지를 한 세무서장\n이나 지방국세청장에게 통지 내용의 적법성에 관한 심사를 청구할 수 있도록 한 제도는?\n① 심판청구\n② 심사청구\n③ 과세전적부심사\n④ 이의신청", "answer": 3}, {"year": "2024", "month": "12", "qnum": 45, "text": "[45]다음 중 법인세와 관련된 설명으로 옳지 않은 것은?\n① 토지 등 양도소득에 대한 법인세는 주택, 별장, 주택을 취득하기 위한 권리로서 조합원 입주권 및\n분양권 그리고 비사업용 토지의 양도소득에 대해 과세한다.\n② 청산소득이란 영리내국법인이 해산(합병 또는 분할에 의한 해산 제외)하는 경우에 발생하는 소득을\n말한다.\n③ 상호출자제한기업집단에 속하는 내국법인과 자기자본이 500억원을 초과하는 내국법인은 미환류소득\n에 대한 법인세 납세의무를 진다.\n④ 법인세법상 소득금액은 각 사업연도의 법인의 순자산증가액을 화폐적 수치로써 표시한 가액을 말한\n다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 61, "text": "[61]다음 중 소득세의 납세의무자에 관한 설명으로 옳지 않은 것은?\n① 국내에 거소를 둔 기간은 입국하는 날의 다음 날부터 출국하는 날까지로 한다.\n② 1거주자로 보는 법인 아닌 단체의 경우 그 단체의 소득을 단체구성원들의 다른 소득과 합산하여 과\n세한다.\n③ 비거주자에 대하여는 국내원천소득에 대해서만 소득세를 과세한다.\n④ 국내에 주소를 두거나 1과세기간 중 183일이상 거소를 둔 개인을 거주자라고 한다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 41, "text": "[41]다음 중 조세의 분류에 관한 설명으로 옳지 않은 것은?\n① 법인세는 조세의 사용용도가 특정되지 않은 조세이다.\n② 부가가치세는 납세의무자와 담세자가 다른 조세이다.\n③ 소득세는 과세물건을 중심으로 그 물적 측면에 주안점을 두어 부과되는 조세이다.\n④ 농어촌특별세는 다른 조세에 부가되는 조세이다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 42, "text": "[42]납세의무자 본인이 개인인 경우 혈족·인척 등 일정한 친족관계에 있는 사람은 국세기본법상 특수관계\n로 본다. 다음 중 친족관계에 관한 내용으로 옳지 않은 것은?\n① 배우자(사실혼 관계에 있는 자를 포함한다)\n② 6촌 이내의 혈족\n③ 친생자로서 다른 사람에게 친양자 입양된 자와 그 배우자·직계비속\n④ 3촌 이내의 인척", "answer": 2}, {"year": "2025", "month": "1", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙 및 세법적용의 원칙에 관한 설명으로 옳지 않은 것은?\n① 납세자가 그 의무를 이행할 때 신의에 따라 성실하게 할 것을 요구하는 신의성실의 원칙은 세무공무\n원이 직무를 수행할 때에도 적용된다.\n② 국세기본법의 실질과세의 원칙은 조세법률주의를 구체화한 것이다.\n③ 근거과세의 원칙에 의해 국세를 조사·결정할 때, 장부의 기록내용이 사실과 다르거나 장부의 기록\n에 누락된 것이 있을 때에는 그 부분에 대해서만 과세관청이 조사한 사실에 따라 결정할 수 있다.\n④ 실질과세원칙은 실질과 다른 법형식을 통해 조세부담을 회피하는 행위를 방지하고 부담능력에 따른\n과세를 실현하고자 하는 것이다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 44, "text": "[44]다음 중 납세자의 권리구제에 관한 설명으로 옳지 않은 것은?\n① 심판청구 또는 심사청구를 하기 전에 이의신청을 반드시 거쳐야 한다.\n② 국세기본법에 따른 동일한 처분에 대하여 심사청구와 심판청구를 중복하여 제기할 수 없다.\n③ 심판청구에 대한 결정통지를 받은 후 행정소송을 제기하려는 경우 심판청구에 대한 결정 통지를 받\n은 날부터 90일 이내에 제기하여야 한다.\n④ 세무조사결과통지 또는 과세예고통지를 받은 자는 통지를 받은 날부터 30일 이내에 과세전적부심사\n를 청구할 수 있다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 60, "text": "[60]중소기업인 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일)의 법인세 납부세액은\n50,000,000 원이다. ㈜삼일의 최대 분납가능금액과 분납기한을 올바르게 연결한 것은(단, 국세기본법에\n따른 기한연장의 특례(기한이 공휴일, 토요일 등인 경우 그 다음날)는 고려하지 않을 것)?\n최대 분납가능금액 분납기한\n① 10,000,000원 2026년 4월 30일\n② 10,000,000원 2026년 5월 31일\n③ 25,000,000원 2026년 4월 30일\n④ 25,000,000원 2026년 5월 31일", "answer": 4}, {"year": "2025", "month": "3", "qnum": 41, "text": "[41]다음 중 조세의 개념에 관한 설명으로 옳지 않은 것은?\n① 공공단체가 공공사업에 필요한 경비에 충당하기 위하여 부과하는 공과금은 조세에 해당하지 않는다.\n② 조세는 위법행위에 대한 제재에 목적을 두고 있는 과태료와 그 성격이 매우 유사하다.\n③ 조세의 과세요건은 반드시 법률로 규정해야 한다.\n④ 조세는 금전납부가 원칙이나, 특수한 경우 물납을 허용하고 있다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 42, "text": "[42]다음 중 국세기본법상 서류의 송달에 관한 설명으로 옳지 않은 것은?\n① 공시송달의 경우, 서류의 주요 내용을 공고한 날부터 14일이 지나면 서류송달이 된 것으로 본다.\n② 서류는 교부, 우편 또는 전자송달에 의하여 송달함을 원칙으로 하지만 주소불명 등의 사유로 서류를\n송달할 수 없는 경우에는 공시송달에 의한다.\n③ 서류의 송달에 대한 효력은 원칙적으로 발신주의에 의하나, 공시송달의 경우는 특례규정을 두고 있\n다.\n④ 국세기본법 또는 세법에 규정하는 서류는 그 명의인의 주소·거소·영업소 또는 사무소(전자우편의\n경우에는 명의인의 전자우편주소)에 송달하는 것을 원칙으로 한다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 43, "text": "[43]과세권자가 납세의무자에게 세금을 부과하기 위해서는 과세요건을 법에서 규정하고 있어야 한다. 다음\n중 과세요건으로 옳지 않은 것은?\n① 가산세\n② 납세의무자\n③ 과세표준\n④ 세율", "answer": 1}, {"year": "2025", "month": "3", "qnum": 44, "text": "[44]다음 중 국세기본법상 기한 후 신고제도에 관한 설명으로 옳지 않은 것은?\n① 법정신고기한 내에 과세표준신고서를 제출하지 아니한 자는 기한 후 신고를 할 수 있다.\n② 법정신고기한이 지난 후 1개월 초과 3개월 이내 기한 후 신고납부를 한 경우 무신고가산세의 30 %\n를 감면한다.\n③ 관할세무서장이 세법에 의하여 해당 국세의 과세표준과 세액을 결정하여 통지한 후에도 기한후과세\n표준신고서를 제출할 수 있다.\n④ 기한후과세표준신고서를 제출한 자가 과세표준수정신고서를 제출한 경우 관할 세무서장은 세법에 따\n라 신고일부터 3개월 이내에 해당 국세의 과세표준과 세액을 결정 또는 경정하여 신고인에게 통지\n하는 것을 원칙으로 한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 42, "text": "[42]다음 중 국세기본법상 특수관계인에 관한 설명으로 옳지 않은 것은?\n① 본인이 개인인 경우 해당 개인의 6촌 이내의 혈족은 특수관계인에 해당한다.\n② 본인이 개인인 경우 해당 개인의 배우자(사실상의 혼인관계에 있는 자를 포함한다)는 특수관계인에\n해당한다.\n③ 본인이 법인인 경우 해당 법인의 임원은 특수관계인에 해당한다.\n④ 본인이 개인인 경우 3촌 이내의 인척은 특수관계인에 해당한다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙 및 세법적용의 원칙에 관한 설명으로 옳지 않은 것은?\n① 납세자가 그 의무를 이행할 때 신의에 따라 성실하게 할 것을 요구하는 신의성실의 원칙은 세무공무\n원이 직무를 수행할 때에도 적용된다.\n② 실질과세의 원칙은 조세법률주의를 구체화한 국세부과의 원칙이다.\n③ 소급과세금지의 원칙이란 세법의 해석이나 국세행정의 관행이 일반적으로 납세자에게 받아들여진 후\n에는 그 해석이나 관행에 의한 행위 또는 계산은 정당한 것으로 보며, 새로운 해석이나 관행에 의하\n여 소급하여 과세하지 아니하는 것을 말한다.\n④ 근거과세의 원칙에 의해 국세를 조사ㆍ결정할 때, 장부의 기록내용이 사실과 다르거나 장부의 기록\n에 누락된 것이 있을 때에는 그 부분에 대해서만 과세관청이 조사한 사실에 따라 결정할 수 있다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 44, "text": "[44]다음 중 수정신고에 관한 설명으로 옳지 않은 것은?\n① 수정신고를 법정신고기한이 지난 후 2년 이내에 한 자에 대해서는 기간경과 정도에 따라 과소신고\nㆍ초과환급신고 가산세의 일정비율을 감면한다.\n② 과세표준신고서에 기재된 결손금액 또는 환급세액이 세법에 따라 신고하여야 할 금액을 초과할 때\n수정신고를 할 수 있다.\n③ 수정신고는 관할세무서장이 당해 국세에 대한 과세표준과 세액의 결정 또는 경정통지를 하기 전으로\n서 국세부과의 제척기간이 끝나기 전까지 할 수 있다.\n④ 법정신고기한까지 과세표준과 세액을 신고한 자만 수정신고할 수 있으므로 기한 후 과세표준신고를\n한 자는 수정신고를 할 수 없다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 41, "text": "[41]다음 중 조세의 분류기준에 따른 구분과 세목을 연결한 것으로 옳지 않은 것은?\n분류기준 구분 조세항목\n국세 법인세, 소득세\n① 과세권자\n지방세 취득세, 상속세\n사용용도의 보통세 법인세, 소득세\n②\n특정여부 목적세 교육세, 농어촌특별세\n조세부담의 직접세 법인세, 소득세\n③\n전가여부 간접세 부가가치세\n납세의무자의 인세 소득세\n④\n인적사항 고려여부 물세 부가가치세", "answer": 1}, {"year": "2025", "month": "6", "qnum": 42, "text": "[42]다음 중 국세기본법상 서류의 송달에 관한 설명으로 옳지 않은 것은?\n① 교부송달의 경우 우편법에 의한 우편날짜도장이 찍힌 날에 신고된 것으로 본다.\n② 우편에 의한 서류의 송달에 대한 효력은 도달주의에 의한다.\n③ 서류는 교부, 우편 또는 전자송달에 의하여 송달함을 원칙으로 하나, 주소불명 등의 사유로 송달할\n수 없는 경우에는 공시송달에 의한다.\n④ 납세고지서를 송달받아야 할 자의 주소를 주민등록표에 의해 확인할 수 없는 경우, 서류의 주요 내\n용을 공고한 날부터 14일이 지나면 서류 송달이 된 것으로 본다.", "answer": 1}, {"year": "2025", "month": "6", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙과 관련된 내용으로 옳지 않은 것은?\n① 정부는 장부의 기록 내용과 다른 사실 또는 장부 기록에 누락된 것을 조사하여 결정하였을 때에는\n정부가 조사한 사실과 결정의 근거를 결정서에 적어야 한다.\n② 국세를 조사ㆍ결정할 때 장부의 기록 내용이 사실과 다르거나, 장부의 기록에 누락된 것이 있을 때\n에는 추계결정할 수 있다.\n③ 사실상 당해 사업자가 취득하여 사업에 공하였음이 확인되는 경우에도 공부상 등기ㆍ등록 등이 타인\n의 명의로 되어 있는 경우에는 이를 그 사실상 사업자의 사업용자산으로 본다.\n④ 정부는 국세를 감면한 경우에 그 감면의 취지를 성취하거나 국가정책을 수행하기 위하여 필요하다고\n인정하면 세법에서 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용범위를 정할 수\n있다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 44, "text": "[44]다음 중 국세기본법상 수정신고와 경정청구에 관한 내용으로 옳지 않은 것은?\n① 수정신고는 관할 세무서장이 각 세법에 따라 해당 국세의 과세표준과 세액을 결정 또는 경정하여 통\n지하기 전으로서 국세부과 제척기간이 끝나기 전까지 할 수 있다.\n② 납세의무자가 당초신고시 과세표준과 세액을 과다신고하거나 결손금액 또는 환급세액을 과소신고한\n경우 경정 등 청구를 할 수 있다.\n③ 과세표준신고서를 법정신고기한까지 제출한 자 또는 국세의 과세표준 및 세액의 결정을 받은 자는\n후발적 사유가 발생하였을 때에는 그 사유가 발생한 것을 안 날부터 3개월 이내에 결정 또는 경정\n을 청구할 수 있다.\n④ 과세표준신고서를 법정신고기한까지 제출한 자가 법정신고기한이 지난 후 2년 이내에 수정신고한\n경우(과세표준과 세액을 경정할 것을 미리 알고 과세표준수정신고서를 제출한 경우는 제외한다)에는\n납부지연가산세의 법 소정 비율에 상당하는 금액을 감면한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 신설된 내국법인의 최초 사업연도 개시일은 원칙적으로 설립등기일이다.\n② 법령 또는 정관 등에 사업연도에 관한 규정이 없는 내국법인은 법인설립신고 또는 사업자등록과 함\n께 사업연도를 신고하여야 하며, 신고를 하지 않은 경우에는 매년 1월 1일부터 12월 31일까지를\n그 법인의 사업연도로 한다.\n③ 최초 사업연도의 개시일 전에 생긴 손익을 사실상 그 법인에 귀속시킨 것이 있는 경우 조세포탈의\n우려가 없을 때에는 최초 사업연도의 기간이 1년 1개월을 초과하지 아니하는 범위 내에서 이를 당\n해 법인의 최초사업연도의 손익에 산입할 수 있다.\n④ 사업연도는 법령이나 정관 등에서 정하는 1회계기간으로 하며 그 기간은 1년을 초과하지 못한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 41, "text": "[41]다음 중 조세의 개념에 관한 설명으로 옳은 것은?\n① 조세를 부과하는 주체는 국가, 지방자치단체, 공공단체이다.\n② 조세는 금전납부만을 허용하고, 물납은 허용되지 않는다.\n③ 납세는 국민의 당연한 의무이므로 조세의 과세요건은 법률로 규정할 필요가 없다.\n④ 조세는 국가 또는 지방자치단체의 경비충당을 위한 재정수입을 조달할 목적으로 부과된다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 42, "text": "[42]다음 중 세법상 기간과 기한의 규정에 관한 설명으로 옳지 않은 것은?\n① 기간을 일∙주∙월∙연으로 정한 때에는 기간의 초일은 기간 계산시 산입하지 않는 것이 원칙이다.\n② 주, 월 또는 연의 처음으로부터 기간을 기산하지 아니하는 때에는 최후의 주, 월 또는 연에서 그 기\n산일에 해당하는 날의 전일로 기간이 만료한다.\n③ 2026년 2월 28일로 사업연도가 종료하는 법인은 2026년 5월 31일까지 법인세를 신고 ∙ 납부하여\n야 하는데 공교롭게도 2026년 5월 31일이 일요일인 경우에는 금요일인 2026년 5월 29일까지 법인\n세를 신고·납부하여야 한다.\n④ 과세표준신고서, 과세표준수정신고서, 경정청구서 또는 그와 관련한 서류를 국세정보통신망을 이용\n하여 제출하는 경우에는 해당 신고서 등이 국세청장에게 전송된 때에 신고되거나 청구된 것으로 본\n다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 43, "text": "[43]다음 중 국세부과의 원칙에 관한 설명으로 옳지 않은 것은?\n① 신의성실의 원칙이란 납세자가 그 의무를 이행할 때 또 세무공무원이 직무를 수행할 때 신의에 따라\n성실하게 하여야 한다는 원칙이다.\n② 근거과세의 원칙이란 납세의무자가 세법에 따라 장부를 갖추어 기록하고 있는 경우에는 해당 국세\n과세표준의 조사와 결정은 그 장부와 이와 관계되는 증거자료에 의하여야 한다는 원칙이다.\n③ 조세감면의 사후관리란 국세를 감면한 경우에 그 감면의 취지를 성취하거나 국가정책을 수행하기 위\n하여 필요하다고 인정하면 세법이 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용\n범위를 정할 수 있다는 원칙이다.\n④ 실질과세의 원칙은 조세법률주의를 구체화한 국세부과의 원칙이다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 44, "text": "[44]다음 중 국세기본법상 과세와 환급에 관한 설명으로 옳은 것은?\n① 과세표준신고서를 법정신고기한까지 제출한 자는 과세표준신고서에 기재된 과세표준 및 세액이 세법\n에 따라 신고하여야 할 과세표준 및 세액에 미치지 못할 때에는 법정신고기한이 지난 후 6개월 이\n내에 수정신고를 하여야 한다.\n② 가산세는 해당 의무가 규정된 세법의 해당 국세의 세목으로 한다. 다만 해당 국세를 감면하는 경우\n가산세는 감면대상에 포함시키지 아니한다.\n③ 납세자의 국세환급금과 국세환급가산금에 관한 권리는 행사할 수 있는 때부터 10년간 행사하지 아\n니하면 소멸시효가 완성된다.\n④ 사후권리구제제도로서 과세전적부심사는 납세자가 세무조사결과에 대한 서면통지 또는 과세예고통지\n를 받은 경우 납세자가 그 내용에 대하여 이의가 있을 때 통지를 받은 날부터 30일 이내에 청구할\n수 있다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 신설된 내국법인의 최초 사업연도 개시일은 원칙적으로 설립등기일이다.\n② 법령 또는 정관 등에 사업연도에 관한 규정이 없는 내국법인은 법인설립신고 또는 사업자등록과 함\n께 사업연도를 신고하여야 한다.\n③ 법인설립 이전에 발생한 손익은 조세포탈의 우려가 없을 때에는 최초 사업연도가 1년을 초과하는\n경우에도 신설법인의 최초사업연도의 손익에 산입할 수 있다.\n④ 사업연도는 법령이나 정관 등에서 정하는 1회계기간으로 하며 그 기간은 1년을 초과하지 못한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 61, "text": "[61]다음 중 소득세의 납세의무자에 관한 설명으로 옳지 않은 것은?\n① 국내에 거소를 둔 기간은 입국하는 날의 다음 날부터 출국하는 날까지로 한다.\n② 1거주자로 보는 법인 아닌 단체의 경우 그 단체의 소득을 단체구성원들의 다른 소득과 합산하여 과\n세한다.\n③ 비거주자에 대하여는 국내원천소득에 대해서만 소득세를 과세한다.\n④ 법인이 아닌 사단∙재단 그 밖의 단체가 법인으로 의제되지 않는 경우 구성원 간 이익의 분배비율이\n정해져 있고 해당 구성원별로 이익의 분배비율이 확인되는 경우 각 구성원 별로 소득세 또는 법인세\n를 납부할 의무를 진다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 41, "text": "[41]다음 중 조세의 분류기준에 따른 구분과 세목을 연결한 것으로 옳지 않은 것은?\n분류기준 구분 조세항목\n국세 법인세, 소득세, 부가가치세\n① 과세권자\n지방세 취득세, 등록면허세, 종합부동산세\n사용용도의 보통세 법인세, 소득세, 부가가치세\n②\n특정여부 목적세 교육세\n조세부담의 직접세 법인세, 소득세\n③\n전가여부 간접세 주세\n납세의무자의 인세 소득세\n④\n인적사항 고려여부 물세 재산세, 부가가치세", "answer": 1}, {"year": "2025", "month": "9", "qnum": 42, "text": "[42]다음 중 국세기본법상 특수관계인에 관한 설명으로 옳지 않은 것은?\n① 본인이 법인인 경우 해당 법인의 임원은 특수관계인에 해당한다.\n② 본인이 법인인 경우 해당 법인의 사용인과 생계를 함께 하는 친족은 특수관계인에 해당하지 않는다.\n③ 본인이 개인인 경우 해당 개인의 배우자(사실상의 혼인관계에 있는자를 포함)는 특수관계인에 해당\n한다.\n④ 본인이 개인인 경우 해당 개인의 4촌인 인척은 특수관계인에 해당하지 않는다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 43, "text": "[43]다음 중 국세기본법상 세법적용의 원칙에 관한 설명으로 옳지 않은 것은?\n① 세법을 해석·적용할 때에는 과세의 형평과 해당 조항의 합목적성에 비추어 납세자의 재산권이 부당\n하게 침해되지 않도록 하여야 한다.\n② 세무공무원은 어떠한 경우에도 납세의무자가 계속하여 적용하고 있는 기업회계기준이나 관행으로서\n일반적으로 공정 타당하다고 인정되는 것은 이를 존중하여야 한다.\n③ 세무공무원이 재량으로 직무를 수행할 때에는 과세의 형평과 해당 세법의 목적에 비추어 일반적으로\n적당하다고 인정되는 한계를 엄수하여야 한다.\n④ 일반적으로 받아들여진 세법의 해석이 변경된 경우 종전의 해석에 따른 과세는 소급하여 수정되지\n아니한다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 44, "text": "[44]다음 중 수정신고와 경정청구에 관한 설명으로 옳지 않은 것은?\n① 원칙적으로 경정청구는 법정신고기한이 지난 후 5년 이내에 하여야 한다.\n② 원칙적으로 수정신고는 관할세무서장이 당해 국세에 대한 과세표준과 세액의 결정 또는 경정하여 통\n지하기 전으로서 국세부과의 제척기간이 끝나기 전까지 할 수 있다.\n③ 납세의무자가 신고 시 과세표준 및 세액을 과다신고하거나 결손금액 또는 환급세액을 과소신고한 경\n우에 경정청구를 할 수 있다.\n④ 법정신고기한이 지난 후 3개월 초과 6개월 이내에 수정신고 시 과소신고가산세 50 % 를 무조건 감\n면 받을 수 있다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 45, "text": "[45]다음 중 미환류소득에 대한 법인세에 관한 설명으로 옳지 않은 것은?\n① 영리내국법인 중「독점규제 및 공정거래에 관한 법률」에 따른 상호출자제한기업집단에 속하는 법인\n은 미환류소득에 대한 법인세의 납세의무가 있다.\n② 미환류소득에 대한 법인세 계산시 해당 사업연도에 초과환류액이 있는 경우에는 그 초과환류액을 그\n다음 3개 사업연도까지 이월하여 그 다음 3개 사업연도 동안 미환류소득에서 공제할 수 있다.\n③ 투자 포함 방법으로 미환류소득 계산시 투자액, 임금증가액과 상생협력출연금으로 지출한 금액이 기\n업소득의 70 % 에 미달하는 경우 미환류소득이 발생한다.\n④ 미환류소득에 대한 법인세는 미환류소득에서 이월된 초과환류액과 차기환류적립금을 차감한 금액에\n20 % 의 세율을 곱하여 산출한다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 41, "text": "[41]다음 중 조세에 관한 설명으로 옳지 않은 것은?\n① 조세는 금전납부가 원칙이다.\n② 조세는 법률에 규정된 과세요건을 충족한 모든 자에게 부과된다.\n③ 벌금·과태료도 재정에 충당되므로 조세에 해당한다.\n④ 조세는 직접적인 반대급부 없이 부과되므로 납부한 세액에 비례하여 개별적 보상을 제공하는 것은\n아니다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 42, "text": "[42]다음 중 국세기본법상 서류의 송달에 관한 설명으로 옳지 않은 것은?\n① 서류의 송달에 대한 효력은 원칙적으로 도달주의에 의하나, 전자송달 및 공시송달 등의 경우는 특례\n규정을 두고 있다.\n② 국세기본법 또는 세법에 규정하는 서류는 그 명의인의 주소·거소·영업소 또는 사무소(전자송달인\n경우에는 명의인의 전자우편주소)에 송달하는 것을 원칙으로 한다.\n③ 서류는 교부, 우편 또는 전자송달에 의하여 송달함을 원칙으로 한다. 다만, 주소불명 등의 사유로\n송달할 수 없는 경우에는 공시송달에 의한다.\n④ 공시송달의 경우에는 서류의 주요 내용을 공고한 날부터 15일이 지나면 서류 송달이 된 것으로 본\n다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 43, "text": "[43]다음의 괄호에 들어갈 국세부과의 원칙으로 적합한 것은?\n김철수 씨는 기업체에 훈련교육용역을 제공하는 사업을 운영하였다. 국세청장은 해당\n사업이 부가가치세 면세대상에 해당한다는 유권해석을 공식적으로 표명하였고, 김철수\n씨는 이를 신뢰하여 면세사업자로 사업을 운영해왔다. 그러나 김철수 씨가 폐업한 후,\n과세관청은 김철수 씨의 사업이 과세사업에 해당한다고 입장을 변경하고 부가가치세를\n부과하였다. 이에 대하여 대법원은 이러한 과세처분은 ( )에 위배된다고 판\n결하였다.\n① 실질과세의 원칙\n② 신의성실의 원칙\n③ 근거과세의 원칙\n④ 조세감면의 사후관리", "answer": 2}, {"year": "2025", "month": "11", "qnum": 44, "text": "[44]다음 중 국세기본법상 가산세에 관한 설명으로 옳지 않은 것은?\n① 정부는 세법이 규정하는 의무를 위반한 자에게 국세기본법 또는 세법에서 정하는 바에 따라 가산세\n를 부과할 수 있다.\n② 해당 국세를 감면하는 경우 가산세는 그 감면대상에 포함한다.\n③ 과세표준수정신고서를 법정신고기한 경과 후 일정기간 이내에 제출한 경우 과소신고·초과환급신고\n가산세를 감면받을 수 있다.\n④ 가산세는 해당 의무가 규정된 세법의 해당 국세의 세목으로 한다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 45, "text": "[45]다음 중 법인세에 관한 설명으로 옳지 않은 것은?\n① 토지 등 양도소득에 대한 법인세는 주택, 상가, 주택을 취득하기 위한 권리로서 조합원 입주권 및\n분양권 그리고 비사업용 토지의 양도소득에 대해 과세한다.\n② 청산소득이란 영리내국법인이 해산(합병 또는 분할에 의한 해산 제외)하는 경우에 발생하는 소득을\n말한다.\n③ 법인세법상 소득금액은 각 사업연도의 법인의 순자산증가액이 화폐적 수치로써 표시된 가액을 말한\n다.\n④ 상호출자제한기업집단에 속하는 내국법인은 미환류소득에 대한 법인세 납세의무를 진다.", "answer": 1}, {"year": "2025", "month": "12", "qnum": 41, "text": "[41]다음 중 조세의 분류기준에 따른 구분과 세목을 연결한 것으로 옳지 않은 것은?\n분류기준 구분 조세항목\n국세 법인세, 소득세, 취득세\n① 과세권자\n지방세 등록면허세, 주민세\n사용용도의 보통세 법인세, 소득세, 부가가치세\n②\n특정여부 목적세 교육세, 농어촌특별세\n조세부담의 직접세 법인세, 소득세\n③\n전가여부 간접세 부가가치세, 개별소비세\n납세의무자의 인세 소득세\n④\n인적사항 고려여부 물세 부가가치세", "answer": 1}, {"year": "2025", "month": "12", "qnum": 42, "text": "[42]다음 중 국세기본법상 기간과 기한에 관한 설명으로 옳은 것은?\n① 국세기본법 또는 세법에서 규정하는 기간의 계산은 민법에 특별한 규정이 있는 것을 제외하고는 국\n세기본법 또는 세법에 따른다.\n② 기간은 일정시점의 도래로 인하여 법률효과가 발생·소멸하거나 또는 일정한 시점까지의 의무를 이\n행하여야 하는 경우에 그 시점을 말한다.\n③ 주, 월 또는 연의 처음으로부터 기간을 기산하지 아니하는 때에는 최후의 주, 월 또는 연에서 그 기\n산일에 해당한 날에 기간이 만료한다.\n④ 월 또는 연으로 기간을 정한 경우에 최종의 월에 해당일이 없는 때에는 그 월의 말일로 기간이 만료\n한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 43, "text": "[43]다음 중 국세기본법상 국세부과의 원칙에 관한 설명으로 옳지 않은 것은?\n① 정부는 국세를 감면한 경우에 그 감면의 취지를 성취하거나 국가정책을 수행하기 위하여 필요하다고\n인정하면 세법에서 정하는 바에 따라 감면한 세액에 상당하는 자금 또는 자산의 운용 범위를 정할\n수 있다.\n② 국세를 조사·결정할 때 장부의 기록 내용이 사실과 다르거나, 장부의 기록에 누락된 것이 있을 때\n에는 그 부분에 대해서만 정부가 조사한 사실에 따라 결정할 수 있다.\n③ 주주명부에 등재된 주주가 회사의 대표자가 임의로 명부상 주주로 등재한 것일뿐 주주로서 권리행사\n를 한 사실이 없는 경우에도 주주명부는 공식적으로 주주를 나타내는 공식적인 서류이므로 주주명부\n에 등재된 주주를 세법상 주주로 본다.\n④ 정부는 장부의 기록 내용과 다른 사실 또는 장부 기록에 누락된 것을 조사하여 결정하였을 때에는\n정부가 조사한 사실과 결정의 근거를 결정서에 적어야 한다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 44, "text": "[44]다음 중 국세기본법상 수정신고와 경정청구에 관한 설명으로 옳지 않은 것은?\n① 과세표준신고서를 법정신고기한까지 제출한 자 또는 국세의 과세표준 및 세액의 결정을 받은 자는\n후발적 사유가 발생하였을 때에는 그 사유가 발생한 것을 안 날부터 3개월 이내에 결정 또는 경정\n을 청구할 수 있다.\n② 납세의무자가 당초신고시 과세표준과 세액을 과다신고하거나 결손금액 또는 환급세액을 과소신고한\n경우 경정청구를 할 수 있다.\n③ 과세표준신고서를 법정신고기한까지 제출한 자는 수정신고를 할 수 있으나, 기한 후 신고를 한 자는\n수정신고를 할 수 없다.\n④ 과세표준신고서를 법정신고기한까지 제출한 자가 법정신고기한이 지난 후 2년 이내에 수정신고한\n경우(과세표준과 세액을 경정할 것을 미리 알고 과세표준수정신고서를 제출한 경우는 제외한다)에는\n과소신고·초과환급신고가산세의 법 소정 비율에 상당하는 금액을 감면한다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 61, "text": "[61]다음 중 소득세법상 과세기간에 관한 설명으로 옳지 않은 것은?\n① 소득세법상 과세기간은 매년 1월 1일부터 12월 31일까지가 원칙이다.\n② 납세의무자가 사망한 경우의 과세기간은 1월 1일부터 사망일까지로 한다.\n③ 신규사업자에 해당하는 경우의 과세기간은 사업개시일부터 12월 31일까지로 한다.\n④ 주소 또는 거소를 이전한 출국에 해당하는 경우의 과세기간은 1월 1일부터 출국한 날까지로 한다.", "answer": 3}], "02_법인세법 총론": [{"year": "2024", "month": "1", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 신설된 내국법인의 최초 사업연도 개시일은 원칙적으로 설립등기일이다.\n② 법령 또는 정관 등에 사업연도에 관한 규정이 없는 내국법인은 법인설립신고 또는 사업자등록과 함\n께 사업연도를 신고하여야 하며, 신고를 하지 않은 경우에는 매년 1월 1일부터 12월 31일까지를\n그 법인의 사업연도로 한다.\n③ 법인설립 이전에 발생한 손익은 최초 사업연도가 1년을 초과하는 경우에도 신설법인의 최초사업연\n도의 손익에 산입할 수 있다.\n④ 사업연도는 법령이나 정관 등에서 정하는 1회계기간으로 하며 그 기간은 1년을 초과하지 못한다.", "answer": 3}, {"year": "2024", "month": "1", "qnum": 49, "text": "[49]다음 자료는 ㈜삼일의 손익계산서에 비용처리된 내역이다. 이 중 법인세법상 각 사업연도 소득금액 계\n산시 손금불산입으로 세무조정할 금액을 계산하면 얼마인가?\nŸ 법인지방소득세 2,000,000원\nŸ 본사 건물 재산세 3,000,000원\nŸ 직원의 업무 수행과 관련하여 발생한 교통벌과금 500,000원\nŸ 납품계약위반으로 인한 지체상금 1,500,000원\nŸ 채권자불분명사채이자 1,000,000원\n① 2,500,000원\n② 3,500,000원\n③ 4,500,000원\n④ 5,500,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 50, "text": "[50]제조업을 영위하는 ㈜삼일은 제24기(2024년 1월 1일 ~ 2024년 12월 31일)에 한국은행에서 1년 만기\n예금(만기 : 2025년 9월 30일)에 가입하였다. 해당 예금의 만기시 이자수령액은 12,000,000원이고,\n이자 지급시 법인세법에 따라 원천징수한다. ㈜삼일은 제24기 결산시 기간경과분 이자수익 3,000,000\n원을 수익으로 계상하였다. 이러한 회계처리에 대한 제24기 세무조정으로 옳은 것은?\n① 세무조정 없음\n② (익금산입) 이자수익 3,000,000원 (유보)\n③ (익금불산입) 이자수익 3,000,000원 (△유보)\n④ (익금산입) 이자수익 9,000,000원 (유보)", "answer": 3}, {"year": "2024", "month": "3", "qnum": 45, "text": "[45]다음 중 법인세법상 미환류소득 법인세에 관한 설명으로 옳지 않은 것은?\n① 미환류소득에 대한 법인세 납부의무가 있는 법인은 각사업연도의 소득에 대한 법인세액에 추가하여\n미환류소득에 대한 법인세를 납부해야 한다.\n② 상호출자제한기업집단에 속하는 법인이 적용대상 법인이다.\n③ 미환류소득에서 차기환류적립금, 이월된 초과환류액을 차감한 금액의 10 % 를 미환류소득 법인세로\n납부한다.\n④ 초과환류액 발생시 그 다음 2개 사업연도 동안 미환류소득에서 공제할 수 있다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 52, "text": "[52]㈜삼일(법인세를 감면․면제받는 법인이 아니며, 한국채택국제회계기준을 적용하지 않음)의 감가상각비\n관련 자료이다. 감가상각비에 대하여 세무조정을 할 경우 세무조정으로 인하여 소득금액이 얼마나 변동\n되는가(단, 주어진 자료 이외에는 고려하지 않으며, △는 시인부족액임)?\n(단위：원)\n구 분 건 물 트 럭 비 품\n전 기 상 각 시 부 인 액 1,000,000 △1,000,000 △2,000,000\n당기감가상각비계상액 1,200,000 1,600,000 3,000,000\n당 기 상 각 범 위 액 2,000,000 3,000,000 2,000,000\n① 200,000원 증가\n② 200,000원 감소\n③ 1,200,000원 증가\n④ 1,200,000원 감소", "answer": 1}, {"year": "2024", "month": "3", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 당기 사업연도(2024년 1월 1일 ~ 2024년 12월 31일)의 대손충당\n금 관련 내역이다. 당기의 대손처리내역은 없으며 전기 대손충당금 부인액이 4,000,000원이라고 가정할\n때 당기의 대손충당금 한도초과액은 얼마인가?\n(1) 결산서상 대손충당금 내역\n대손충당금\n대손처리액 - 기초잔액 20,000,000원\n기말잔액 30,000,000원 당기설정액 10,000,000원\n합계 30,000,000원 합계 30,000,000원\n(2) 당기 말 대손충당금 설정대상 채권가액 : 2,000,000,000원\n① 5,000,000원\n② 6,000,000원\n③ 8,000,000원\n④ 10,000,000원", "answer": 4}, {"year": "2024", "month": "3", "qnum": 60, "text": "[60]다음 중 법인세법의 신고와 납부에 관한 설명으로 옳은 것은?\n① 법인세 납세의무가 있는 내국법인은 각 사업연도 종료일이 속하는 달의 말일로부터 3개월(내국법인\n이 성실신고확인서를 제출하는 경우에는 5개월)이내에 법인세 과세표준과 세액을 신고하여야 한다.\n② 각 사업연도의 기간이 6개월을 초과하는 법인은 사업연도 개시일부터 6개월을 중간예납기간으로 하\n여 중간예납기간이 경과한 날로부터 3개월 이내에 그 기간에 대한 법인세를 신고 납부하여야 한다.\n③ 납부할 세액이 1천만 원을 초과하는 경우 납부기한이 경과한 날로부터 2개월(중소기업은 3개월)내\n에 분납할 수 있다.\n④ 납세의무가 있는 내국법인은 각사업연도소득금액이 없거나 결손금이 있는 경우에도 법인세 신고를\n하여야 한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 사업연도는 법령이나 법인의 정관(定款) 등에서 정하는 1회계기간으로 하되, 그 기간은 1년을 초\n과하지 못한다.\n② 내국법인의 최초 사업연도개시일은 설립등기일로 한다.\n③ 사업연도를 변경하려는 법인은 그 법인의 해당 사업연도 종료일 이전 3개월이 되는 날까지 납세지\n관할 세무서장에게 이를 신고하여야 한다.\n④ 최초 사업연도의 개시일전에 생긴 손익을 사실상 그 법인에 귀속시킨 것이 있는 경우 조세포탈의\n우려가 없을 때에는 최초 사업연도의 기간이 1년을 초과하지 아니하는 범위내에서 이를 당해 법인\n의 최초사업연도의 손익에 산입할 수 있다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 50, "text": "[50]제조업을 영위하는 ㈜삼일이 제24기(2024년 1월 1일 ~ 2024년 12월 31일)에 1년 만기 해외 예금(만\n기: 2025년 6월 30일)에 대한 기간경과분 이자수익 4억원을 수익으로 계상한 경우 세무조정으로 옳은\n것은(단, 해외예금 이자는 법인세법상 원천징수대상에 해당하지 않는다)?\n① (익금산입) 이자수익 4억원 (유보)\n② (익금불산입) 이자수익 2억원 (△유보)\n③ (익금불산입) 이자수익 4억원 (△유보)\n④ 세무조정 없음", "answer": 4}, {"year": "2024", "month": "5", "qnum": 54, "text": "[54]다음은 제조업을 영위하는 ㈜삼일의 제24 기 사업연도(2024 년 1 월 1 일 ~ 2024 년 12 월 31 일)의 기\n업업무추진비에 관한 자료이다. 기업업무추진비 한도초과액은 얼마인가?\nㄱ. 기업업무추진비 지출액 : 73,000,000 원\n(문화 기업업무추진비와 전통시장 기업업무추진비는 없음)\nㄴ. 매 출 액 : 12,000,000,000 원(특수관계인간 거래분은 없음)\nㄷ. ㈜삼일은 중소기업이고, 법인세법상 특정법인은 아니다.\nㄹ. 수입금액 적용률\n수입금액 적용율\n100억원 이하분 0.3 %\n100억원 초과 500억원 이하 3천만원＋100억원 초과분×0.2 %\n500억원 초과분 1억 1천만원＋500억원 초과분×0.03 %\n① 1,000,000원\n② 3,000,000원\n③ 4,000,000원\n④ 5,000,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 59, "text": "[59]다음 중 법인세법상 과세표준 계산에 관한 설명으로 옳지 않은 것은?\n① 각 사업연도 소득에 대한 법인세의 과세표준은 각 사업연도 소득의 범위에서 이월결손금, 비과세소\n득, 소득공제액을 차례로 공제한 금액으로 한다.\n② 중소기업과 회생계획을 이행 중인 기업 등 법령으로 정하는 법인을 제외한 내국법인의 경우 이월결\n손금 금액에 대한 공제의 범위는 각 사업연도 소득의 100분의 80으로 한다.\n③ 결손금 공제 중 이월공제는 신청을 요건으로 하지 않는다.\n④ 자산수증이익과 채무면제이익으로 보전에 충당된 이월결손금도 과세표준 계산상 공제할 수 있다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도와 납세지에 관한 설명으로 옳지 않은 것은?\n① 사업연도가 변경된 경우에는 종전의 사업연도 개시일부터 변경된 사업연도 개시일 전날까지의 기간\n을 1사업연도로 하되, 그 기간이 1개월 미만인 경우에는 변경된 사업연도에 그 기간을 포함한다.\n② 매년 1월 1일부터 12월 31일까지를 사업연도로 하는 법인이 2024년부터 변경된 사업연도를 적용\n하려면 2024년 3월 31일까지 납세지 관할 세무서장에게 사업연도변경신고서를 제출해야 한다.\n③ 내국법인이 본점 등의 소재지가 자산 또는 사업장과 분리되어 있어 조세포탈의 우려가 있는 경우에\n는 등기부상의 소재지 등에 불구하고 관할 지방국세청장(또는 국세청장)이 법인의 납세지를 지정할\n수 있다.\n④ 내국법인이 본점의 이전 등으로 인하여 법인의 납세지가 변경된 경우에는 그 변경일로부터 15일 이\n내에 변경 전의 납세지 관할 세무서장에게 납세지 변경신고를 하여야 한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 46, "text": "[46]다음 중 세무조정시 기타사외유출로 처분하는 것은?\n① 기업업무추진비 한도초과액\n② 감가상각비 한도초과액\n③ 임원퇴직급여 한도초과액\n④ 업무용승용차 관련비용 중 업무미사용금액", "answer": 1}, {"year": "2024", "month": "6", "qnum": 52, "text": "[52]다음 자료에 의한 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 사업연도의 세무조정 사항\n이 각 사업연도 소득금액에 미치는 영향으로 옳은 것은?\n구분 건물 비품 차량운반구\n회사계상 상각비 5,000,000원 5,000,000원 1,000,000원\n세법상 상각범위액 6,000,000원 3,500,000원 1,400,000원\n내 용 연 수 40년 5년 5년\n전기이월상각 부인액 1,300,000원 600,000원 -\n① 영향 없음\n② 500,000원 감소\n③ 500,000원 증가\n④ 1,000,000원 증가", "answer": 3}, {"year": "2024", "month": "6", "qnum": 58, "text": "[58]㈜삼일은 2024년 7월 1일 개인대주주에게 시가 3억원인 토지를 장부가액인 2억원에 매도하고 다음과\n같이 회계처리 하였다. 다음 중 해당 토지 처분과 관련하여 2024년에 필요한 세무조정으로 옳은 것은?\n(차) 현금 2억원 (대) 토지 2억원\n① (익금산입) 저가양도 1억원 (배당)\n② (익금산입) 저가양도 1억원 (배당), (손금산입) 토지 1억원 (△유보)\n③ (익금산입) 토 지 1억원 (유보)\n④ (손금산입) 토 지 1억원 (△유보)", "answer": 1}, {"year": "2024", "month": "6", "qnum": 59, "text": "[59]다음 중 법인세법상 과세표준의 계산에 관한 설명으로 옳지 않은 것은?\n① 자산수증이익이나 채무면제이익에 의해 충당된 이월결손금은 과세표준 계산시 공제할 수 없다.\n② 과세표준은 각 사업연도 소득금액에서 이월결손금, 비과세소득, 소득공제를 순서대로 차감하여 계산\n한다.\n③ 공제대상 이월결손금은 각 사업연도 소득금액의 60 %(중소기업과 회생계획 이행 중인 기업 등은 100\n%)의 범위에서 공제한다.\n④ 각 사업연도 소득금액에서 이월결손금을 공제한 금액을 초과하는 비과세소득은 다음 사업연도로 이\n월되지 않고 소멸한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 60, "text": "[60]다음 중 법인세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 법인세 납세의무가 있는 내국법인은 각 사업연도 종료일이 속하는 달의 말일부터 3개월 이내에 법\n인세 과세표준과 세액을 신고하는 것을 원칙으로 한다.\n② 법인세 과세표준 신고시 필수적 첨부서류인 개별내국법인의 재무상태표, 포괄손익계산서, 이익잉여\n금처분(결손금처리)계산서, 법인세 과세표준 및 세액조정계산서를 첨부하여야 한다.\n③ 내국법인으로서 각 사업연도 소득금액이 없거나 결손금이 있는 법인의 경우에는 법인세 과세표준 신\n고의무가 없다.\n④ 각 사업연도의 기간이 6개월을 초과하는 법인은 사업연도 개시일부터 6개월간을 중간예납기간으로\n하여 중간예납기간이 지난 날부터 2개월 이내에 그 기간에 대한 법인세를 납부해야 한다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 45, "text": "[45]다음 중 법인세법상 과세소득에 관한 설명으로 옳지 않은 것은?\n① 토지 등 양도소득에 대한 법인세는 주택, 별장 및 비사업용 토지의 양도소득에 대해서만 과세하며\n비과세법인을 제외한 모든 법인이 부담해야 한다.\n② 청산소득이란 영리내국법인이 해산(합병 또는 분할에 의한 해산 제외)하는 경우에 발생하는 소득을\n말한다.\n③ 각 사업연도 소득이란 회계학상 계속기업의 가정 아래 매기마다 반복적으로 계산되는 소득을 말한\n다.\n④ 법인세법상 소득금액은 각 사업연도의 법인의 순자산증가액을 화폐적 수치로써 표시한 가액을 말한\n다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 46, "text": "[46]다음 중 법인세법상 세무조정에 관한 설명으로 옳지 않은 것은?\n① 결산조정사항은 회사장부에 비용으로 계상해야만 손금으로 인정되나 신고조정사항은 장부에 비용으\n로 계상하지 않아도 인정된다.\n② 신고조정사항은 경정청구 대상에서 제외되나 결산조정사항은 경정청구의 대상이 된다.\n③ 결산조정사항을 당해 사업연도에 비용으로 계상하지 아니한 경우라도 그 이후 사업연도에 결산상 비\n용으로 계상하면 손금으로 인정된다.\n④ 고유목적사업준비금이나 비상위험준비금은 잉여금 처분에 의한 신고조정사항이다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 49, "text": "[49]㈜삼일은 다음 항목을 손익계산서에 비용으로 처리하였다. ㈜삼일의 제 24기(2024년 1월 1일 ~ 2024\n년 12월 31일) 각 사업연도 소득금액 계산시 손금불산입으로 세무조정해야 하는 금액은 얼마인가?\nㄱ. 국세의 체납으로 인한 강제징수비 5,000,000원\nㄴ. 고용보험료(사용자부담분) 12,000,000원\nㄷ. 법인지방소득세 6,000,000원\nㄹ. 제23기 사업연도에 상법상 소멸시효가 완성된 외상매출금 2,000,000원\nㅁ. 파손으로 인한 재고자산의 평가손실 10,000,000원\n① 11,000,000원\n② 13,000,000원\n③ 23,000,000원\n④ 24,000,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 52, "text": "[52]㈜삼일(사업연도 : 1.1 ~ 12.31)은 2023년 1월 1일에 기계장치를 100,000,000원에 취득하였다. 회사\n는 세법상 기계장치에 대한 감가상각방법을 정액법으로, 내용연수는 5년으로 신고하였으며 잔존가치는\n없다. 회사가 2024년 감가상각비로 16,000,000원을 계상한 경우, 다음 각 상황에 따른 세무조정으로\n옳은 것은?\n상황1. 전기 상각부인액이 5,000,000원이 있는 경우\n상황2. 전기 시인부족액이 5,000,000원이 있는 경우\n상황1 상황2\n① 손금산입 4,000,000원 손금산입 4,000,000원\n② 손금산입 5,000,000원 세무조정 없음\n③ 손금산입 5,000,000원 손금산입 4,000,000원\n④ 손금산입 4,000,000원 세무조정 없음", "answer": 4}, {"year": "2024", "month": "7", "qnum": 58, "text": "[58]㈜삼일은 대표이사에게 보유 중이던 비상장법인인 ㈜용산의 주식을 양도하였다. 다음 자료를 이용하여\n㈜삼일에 대하여 부당행위계산의 부인을 적용할 경우 세무조정으로 옳은 것은?\n(1) 양도주식수는 10,000주이며, 양도가액은 주당 7,000원이다.\n(2) 감정평가법인인 한국감정원에서 양도일부터 3개월 전에 ㈜용산의 주식을 감정평가하였는데,\n1주당 평가액은 9,000원이었다.\n(3) 양도 당시 장외시장에서 거래되는 ㈜용산의 주식의 1주당 거래가격은 10,000원이며,\n이 금액은 법인세법상 시가로 인정되는 금액이다.\n① 세무조정없음\n② 익금산입 20,000,000원\n③ 익금산입 25,000,000원\n④ 익금산입 30,000,000원", "answer": 4}, {"year": "2024", "month": "9", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 법인의 사업연도는 법령 또는 정관상에서 정하고 있는 회계기간을 우선적으로 적용하며 원칙적으로\n1년을 초과할 수 없다.\n② 사업연도를 변경하려는 법인은 직전 사업연도 종료일 이전 3개월 이내에 사업연도 변경신고서를 제\n출해야 한다.\n③ 신설법인의 최초 사업연도 개시일은 설립등기일이다.\n④ 법령 또는 정관상에 사업연도가 규정되어 있지 않은 경우에는 법인이 관할세무서장에게 신고한 사업\n연도를 적용하며, 신고하지 않은 경우에는 1월 1일에서 12월 31일까지를 사업연도로 한다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 50, "text": "[50]㈜삼일은 제24기(2024년 1월 1일 ~ 2024년 12월 31일)에 회사가 제조한 기계를 할부판매하고 인도\n한 후 다음과 같이 회계처리 하였다. 제24기 회사에 필요한 세무조정으로 옳은 것은(단, ㈜삼일은 중\n소기업이 아니며 매출원가나 현재가치는 고려하지 않는다)?\nㄱ. 계약일 : 2024년 2월 25일\nㄴ. 판매금액 : 50,000,000원\nㄷ. 대금결제조건 : 2024년 2월 25일 계약금 5,000,000원, 6개월이 경과할 때마다 5,000,000원씩\n9회에 분할하여 결제함\nㄹ. 회사의 회계처리 : 회사는 당기에 50,000,000원을 매출로 인식함\n① 세무조정 없음\n② (익금불산입) 할부매출액 35,000,000원(△유보)\n③ (익금불산입) 할부매출액 40,000,000원(△유보)\n④ (익금불산입) 할부매출액 45,000,000원(△유보)", "answer": 1}, {"year": "2024", "month": "9", "qnum": 52, "text": "[52]다음 자료에 의한 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 사업연도의 세무조정 사항\n이 각 사업연도 소득금액에 미치는 영향으로 옳은 것은?\n구분 건물 기계 영업권\n회사계상 상각비 7,000,000원 3,000,000원 1,000,000원\n세법상 상각범위액 6,000,000원 4,000,000원 1,200,000원\n내용연수 40년 5년 5년\n전기이월상각 부인액 2,000,000원 - -\n① 영향 없음\n② 500,000원 감소\n③ 1,000,000원 증가\n④ 2,000,000원 감소", "answer": 3}, {"year": "2024", "month": "9", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 제 24기(2024년 1월 1일 ~ 2024년 12월 31일) 대손충당금과 관\n련된 자료이다. 이 자료를 이용하여 대손충당금에 대한 세무조정 결과를 ‘자본금과 적립금조정명세서\n(을)’에 기입하고자 할 때, 빈칸에 들어갈 금액으로 가장 올바르게 짝지어진 것은?\n<자료1> 대손충당금 관련 자료\nㄱ. 결산서상 대손충당금 내역\n기초 대손충당금 잔액 20,000,000원\n당기 대손 처리액 6,000,000원(소멸시효 완성 채권)\n당기 추가 설정액 8,000,000원\nㄴ. 전기 대손충당금 부인액 4,000,000원\nㄷ. 당기 말 세법상 대손충당금 설정대상 채권금액 400,000,000원\nㄹ. 당기 대손실적률은 3 % 임\n<자료2> 자본금과 적립금조정명세서(을)\n당기중증감\n과목 또는 사항 기초잔액 기말잔액\n감소 증가\n대손충당금한도초과액 4,000,000 (ㄱ) xxx (ㄴ)\n(ㄱ) (ㄴ)\n① 0 22,000,000\n② 4,000,000 22,000,000\n③ 0 10,000,000\n④ 4,000,000 10,000,000", "answer": 4}, {"year": "2024", "month": "9", "qnum": 60, "text": "[60]다음 중 법인세 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 기납부세액은 중간예납세액, 원천징수 된 세액 및 수시부과세액을 의미하며, 이는 사업연도 중에 납\n부한 세액이므로 회사가 총부담할 세액에서 이를 차감하여 납부세액을 구한다.\n② 원천징수한 세액은 징수일이 속하는 달의 다음달 10일까지 납세지 관할세무서장에게 납부하여야 한\n다.\n③ 사업연도의 기간이 6개월을 초과하는 법인은 해당 사업연도 개시일부터 6개월간을 중간예납기간으\n로 하여 중간예납기간이 지난 날부터 3개월 이내에 그 기간에 대한 법인세를 신고·납부해야 한다.\n④ 법인세 납세의무가 있는 내국법인은 각 사업연도 소득금액이 없거나 결손금이 있는 경우에도 과세표\n준과 세액을 신고해야 한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 사업연도는 법령이나 법인의 정관(定款) 등에서 정하는 1회계기간으로 하되, 그 기간은 1년을 초과\n하지 못한다.\n② 내국법인의 최초사업연도 개시일은 사업자등록을 한 날로 한다.\n③ 사업연도를 변경하려는 법인은 그 법인의 직전 사업연도 종료일부터 3개월 이내에 납세지 관할 세\n무서장에게 이를 신고하여야 한다.\n④ 최초사업연도의 개시일전에 생긴 손익을 사실상 그 법인에 귀속시킨 것이 있는 경우 조세포탈의 우\n려가 없을 때에는 최초 사업연도의 기간이 1년을 초과하지 아니하는 범위내에서 이를 당해 법인의\n최초사업연도의 손익에 산입할 수 있다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 46, "text": "[46]다음 항목에 대한 세무조정의 결과 공통적으로 발생하는 법인세법상 소득처분으로 옳은 것은?\nㄱ. 기업업무추진비 한도초과액\nㄴ. 채권자불분명사채이자에 대한 원천징수세액\nㄷ. 일반기부금 한도초과액\n① 배당\n② 유보\n③ 상여\n④ 기타사외유출", "answer": 4}, {"year": "2024", "month": "11", "qnum": 50, "text": "[50]㈜삼일은 제24기(2024 년 1 월 1 일 ~ 2024 년 12 월 31 일)에 제품을 장기할부조건으로 판매하고 다\n음과 같이 회계처리 하였다. 제24기 세부담을 최소화하려는 경우 필요한 세무조정으로 옳은 것은(단,\n㈜삼일은 중소기업이며 매출원가는 고려하지 않는다)?\nㄱ. 인도일 : 2024년 2월 25일\nㄴ. 판매금액 : 40,000,000원\nㄷ. 대금결제조건 :\n일자 2024년 2월 25일 2024년 8월 25일 2025년 2월 25일 2025년 8월 25일\n할부금 10,000,000원 10,000,000원 10,000,000원 10,000,000원\nㄹ. 회사의 회계처리 : 회사는 당기에 40,000,000원을 매출로 인식함\n① 세무조정 없음\n② (익금불산입) 할부매출액 10,000,000원(△유보)\n③ (익금불산입) 할부매출액 20,000,000원(△유보)\n④ (익금불산입) 할부매출액 40,000,000원(△유보)", "answer": 3}, {"year": "2024", "month": "11", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 당기 사업연도(2024 년 1 월 1 일 ~ 2024 년 12 월 31 일)의 대손\n충당금 관련 내역이다. 당기의 대손처리내역은 없으며 전기 대손충당금 부인액이 3,0
