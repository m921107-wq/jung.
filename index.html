조간접원가 예산 7,100,000원\n① 135,000원(불리)\n② 135,000원(유리)\n③ 235,500원(불리)\n④ 235,500원(유리)", "answer": 1}, {"year": "2024", "month": "7", "qnum": 111, "text": "[111]다음 중 판매부서의 성과평가에 관한 설명으로 옳지 않은 것은?\n① 판매부서의 성과평가는 수익중심점보다 이익중심점으로 운영하는 것이 바람직하다.\n② 판매부서의 성과보고서에는 일반적으로 예산매출액과 실제매출액의 비교가 포함된다.\n③ 매출총차이는 매출가격차이와 매출조업도차이로 구분된다.\n④ 매출조업도차이는 매출배합차이와 시장점유율차이로 구분된다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 91, "text": "[91]다음 중 표준원가계산의 목적에 관한 설명으로 옳지 않은 것은?\n① 원가관리와 통제\n② 회계업무의 간소화\n③ 적시성 있는 원가정보 제공\n④ 제품별 발생원가의 정확한 계산", "answer": 4}, {"year": "2024", "month": "9", "qnum": 92, "text": "[92]다음 중 제조간접원가 차이를 3분법으로 분석할 경우에 나타나지 않는 항목은 무엇인가?\n① 소비차이\n② 조업도차이\n③ 예산차이\n④ 능률차이", "answer": 3}, {"year": "2024", "month": "9", "qnum": 93, "text": "[93]다음은 표준원가계산제도를 채택하고 있는 ㈜삼일의 재료비 표준원가와 실제원가의 차이에 관한 자료이\n다. ㈜삼일의 제품 1단위당 직접재료 표준투입량을 계산하면 얼마인가?\n[실제원가] 직접재료원가 실제사용량 3,200 kg, 11원/kg\n실제완성품 생산수량 2,000단위\n[재료비 원가차이] 직접재료비 능률차이 2,800원 (불리한 차이)\n직접재료비 가격차이 9,600원 (유리한 차이)\n① 1.3 kg\n② 1.5 kg\n③ 1.8 kg\n④ 2.0 kg", "answer": 2}, {"year": "2024", "month": "9", "qnum": 94, "text": "[94]다음 중 직접노무원가 능률차이의 계산식을 올바르게 나타낸 것은?\n① 표준임률 × (실제작업시간 - 표준작업시간)\n② 실제임률 × (실제작업시간 - 표준작업시간)\n③ (실제임률 - 표준임률) × 실제작업시간\n④ (실제임률 - 표준임률) × 표준작업시간", "answer": 1}, {"year": "2024", "month": "9", "qnum": 95, "text": "[95]㈜삼일은 직접노동시간을 기준으로 고정제조간접원가를 배부하고 있다. 당기 고정제조간접원가 예산과\n실제자료는 다음과 같다.\n예 산 실 제\n직접노동시간 8,000시간 9,000시간\n고정제조간접원가 4,000원 5,000원\n제품 단위당 표준직접노동시간은 4시간이고, 당기 실제생산량은 2,500개이다. 또한 회사는 기준조업\n도로 예산조업도를 사용한다. 이 경우 당기 고정제조간접원가 조업도차이를 계산하면 얼마인가?\n① 500원 유리\n② 500원 불리\n③ 1,000원 유리\n④ 1,000원 불리", "answer": 3}, {"year": "2024", "month": "11", "qnum": 92, "text": "[92]다음 중 표준원가와 표준원가계산제도에 관한 설명으로 옳은 것은?\n① 표준원가계산제도는 원가절감을 위한 원가통제를 포함한다.\n② 표준원가는 한번 설정되면 기업 내적인 요소나 기업 외부환경이 변화하더라도 변경되어서는 안된다.\n③ 표준지표로 이상적 표준을 사용하게 되면 종업원들에게 강한 동기를 부여하는 효과가 있다.\n④ 사전에 설정된 표준원가를 사용함으로써 예산편성을 위한 원가자료를 수집하는 데 소요되는 시간이\n늘어나게 된다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 93, "text": "[93]다음 자료는 구입시점에서 직접재료원가 가격차이를 분리하기 위한 자료이다. 직접재료원가의 단위당\n표준가격은 얼마인가?\n기초재고액 145,000원\n기말재고액 160,000원\n생산공정 투입액 400,000원\n단위당 실제 구입가격 200원\n불리한 가격차이 41,500원\n① 160원\n② 180원\n③ 195원\n④ 220원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 94, "text": "[94]㈜삼일의 3월 중 직접노무원가에 대한 자료이다. 직접노무원가 실제발생액은 얼마인가?\n직접노무원가 표준임률 : 2,000원\n실제 생산량 : 200단위\n생산량 단위당 표준직접노동시간 : 4시간\n직접노무원가 능률차이 : 36,000원(유리)\n직접노무원가 가격차이 : 40,000원(불리)\n① 1,245,000원\n② 1,347,000원\n③ 1,560,000원\n④ 1,604,000원", "answer": 4}, {"year": "2024", "month": "12", "qnum": 92, "text": "[92]다음 중 표준원가계산제도에 관한 설명으로 옳은 것을 모두 고르면?\nㄱ. 변동원가계산제도에서는 적용할 수 없다.\nㄴ. 직접재료원가 가격차이를 원재료 구입시점에서 분리하든 사용시점에서 분리하든 직접재료원가\n능률차이에는 영향을 주지 않는다.\nㄷ. 원가통제를 포함한 표준원가시스템을 잘 활용하여도 원가절감을 유도할 수는 없다.\nㄹ. 기말에 원가차이를 매출원가에서 조정할 경우 불리한 차이는 매출원가에 가산하고 유리한 차\n이는 매출원가에서 차감한다.\n① ㄱ, ㄷ\n② ㄴ, ㄷ\n③ ㄴ, ㄹ\n④ ㄷ, ㄹ", "answer": 3}, {"year": "2024", "month": "12", "qnum": 93, "text": "[93]다음 중 표준원가 차이분석에 관한 설명으로 옳은 것은?\n① 원재료의 효율적 이용으로 투입량이 절감된 경우 직접재료원가에 있어 불리한 능률차이가 발생할 것\n이다.\n② 공장노무자의 비능률적 업무수행으로 인해 직접노무원가에 있어 불리한 능률차이가 발생할 수 있다.\n③ 품질이 떨어지는 원재료를 매우 저렴한 가격으로 구매한 경우 직접재료원가에 있어 불리한 가격차이\n가 발생할 것이나, 이로 인하여 유리한 능률차이가 발생할 수 있다.\n④ 직접노동시간을 조업도로 사용하여 변동제조간접원가를 배부할 경우, 노동의 능률적 혹은 비능률적\n사용은 변동제조간접원가 능률차이에 전혀 영향을 미치지 않는다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 94, "text": "[94]㈜삼일의 20X1년 4월 직접노무원가 관련 자료는 다음과 같다. 직접노무원가 가격차이를 계산하면 얼마\n인가?\n직접노무원가 능률차이 20,000원(유리) 실제발생액 150,000원\n실제직접노동시간 50,000시간 표준직접노동시간 55,000시간\n① 20,000원 불리\n② 20,000원 유리\n③ 50,000원 불리\n④ 50,000원 유리", "answer": 4}, {"year": "2024", "month": "12", "qnum": 95, "text": "[95]㈜삼일은 직접노동시간을 조업도로 사용하고 있다. 변동제조간접원가와 관련한 자료가 다음과 같을 때\n실제생산량에 허용된 표준변동제조간접원가는 얼마인가?\n실제작업시간기준 표준변동제조간접원가 1,200,000원\n변동제조간접원가 소비차이 300,000원(불리)\n변동제조간접원가 능률차이 400,000원(유리)\n① 1,300,000원\n② 1,600,000원\n③ 1,700,000원\n④ 1,900,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 92, "text": "[92]다음 중 직접재료원가 가격차이가 발생하는 원인에 관한 설명으로 옳지 않은 것은?\n① 원재료 시장의 수요와 공급 상황에 따라 발생할 수 있다.\n② 생산과정에서 원재료를 효율적으로 사용하지 못함으로써 발생할 수 있다.\n③ 표준을 설정할 때 고려한 품질수준과 상이한 품질의 원재료를 구입함에 따라 가격차이가 발생할 수\n있다.\n④ 원재료 구매담당자의 업무능력에 따라 유리하거나 불리한 가격차이가 발생할 수 있다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 93, "text": "[93]㈜삼일의 직접재료원가에 관한 자료는 다음과 같다.\n직접재료 실제투입수량 1,500 kg\n직접재료원가 kg당 실제가격 15원\n직접재료원가 가격차이 7,500원(유리)\n㈜삼일이 가격차이를 사용시점에서 분류하는 경우, ㈜삼일의 직접재료원가 kg당 표준가격은 얼마인가?\n① 5원\n② 10원\n③ 15원\n④ 20원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 94, "text": "[94]㈜삼일의 직접노무원가와 관련된 자료는 다음과 같다. 이에 관한 설명으로 옳지 않은 것은?\n표준 직접노무시간 4,000시간\n실제 직접노무시간 4,100시간\n직접노무원가 가격차이 82,000원 (불리)\n표준임률 200원 / 시간\n① 직접노무원가 실제원가는 902,000원이다.\n② 직접노무원가 표준원가는 820,000원이다.\n③ 직접노무원가 총차이는 102,000원 불리하게 나타난다.\n④ 직접노무원가 능률차이는 20,000원 불리하게 나타난다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 95, "text": "[95]㈜삼일의 변동제조간접원가와 관련한 자료가 다음과 같을 때 변동제조간접원가 능률차이는 얼마인가?\n변동제조간접원가 실제 발생액 7,100,000원\n실제작업시간기준 변동제조간접원가 예산 7,235,000원\n실제생산량에 허용된 변동제조간접원가 예산 7,000,000원\n① 135,000원(불리)\n② 135,000원(유리)\n③ 235,000원(불리)\n④ 235,000원(유리)", "answer": 3}, {"year": "2025", "month": "1", "qnum": 109, "text": "[109]㈜삼일이 제조판매하고 있는 제품 A와 제품 B에 관련된 자료는 다음과 같다. ㈜삼일의 매출가격차이\n와 매출조업도차이에 관한 설명으로 옳지 않은 것은?\n제품 A 제품 B\n단위당 예산판매가격 2,000원 3,000원\n단위당 예산변동원가 1,200원 2,000원\n단위당 실제판매가격 2,200원 2,900원\n예산매출수량 200단위 150단위\n실제매출수량 180단위 180단위\n① 제품 A에 대해 예산보다 높은 가격으로 판매한 결과 유리한 매출가격차이가 발생하였다.\n② 제품 A의 경우, 예산보다 실제판매가격은 높았으나 당초 예산매출수량을 달성하지 못하여 불리한\n매출조업도차이가 발생하였다.\n③ 제품 B의 경우, 실제판매가격이 예산에 미치지 못하므로 불리한 매출총차이가 발생하였다.\n④ 제품 B의 경우, 유리한 매출조업도차이를 보이고 있다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 92, "text": "[92]표준원가의 종류는 이상적표준, 정상적표준 및 현실적표준으로 구분할 수 있다. 다음 중 이상적표준을\n기준으로 표준원가를 설정할 경우 나타날 수 있는 영향으로 옳은 것은?\n① 근로자들의 임금상승 효과를 가져온다.\n② 이상적표준을 달성하는 경우가 거의 없기 때문에 유리한 차이가 발생할 가능성이 크다.\n③ 실제원가와의 차이가 크지 않으므로 재고자산가액과 매출원가가 적절하게 계상된다.\n④ 최선의 조건 하에서만 달성할 수 있는 최저목표원가이다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 93, "text": "[93]실제원가계산을 사용하던 ㈜삼일은 새롭게 표준원가계산제도의 도입을 검토하고 있다. 원가관리부서의\n실무담당자들은 표준원가계산제도에 대해 아래와 같이 주장하고 있다. 다음 중 옳지 않은 주장을 펼치\n고 있는 실무담당자는 누구인가?\n강부장 : 표준원가를 도입하면 차이분석을 실시하는데, 차이분석의 결과는 당기에만 유용하며 차기\n의 표준이나 예산 설정에 피드백되어 유용한 정보를 제공하지는 못한다는 점을 고려해야\n합니다.\n황과장 : 표준원가의 달성을 지나치게 강조할 경우 제품의 품질을 희생시킬 수 있고, 납품업체에 표\n준원가를 기초로 지나친 원가절감을 요구할 경우 관계가 악화될 수 있으므로 신중을 기해\n야 합니다.\n정대리 : 표준원가는 기업 내적인 요소나 기업 외부환경의 변화에 따라 수시로 수정을 필요로 하기\n때문에, 사후 관리하지 않을 경우 향후 원가계산을 왜곡할 소지가 있습니다.\n김사원 : 표준원가는 사전에 과학적이고 통계적인 방법으로 적정하게 산정되어야 하지만, 표준원가\n의 산정에 객관성이 보장되기 힘들고 많은 비용이 소요되는 단점이 있다는 것을 잊어서는\n안됩니다.\n① 강부장\n② 황과장\n③ 정대리\n④ 김사원", "answer": 1}, {"year": "2025", "month": "3", "qnum": 94, "text": "[94]㈜삼일은 표준원가계산제도를 채택하고 있다. 다음은 재료비 표준원가와 실제원가의 차이에 관한 자료\n이다. 자료를 바탕으로 ㈜삼일의 제품 2,000단위 표준재료비를 계산하면 얼마인가?\n[실제원가] 직접재료원가 실제사용량 3,200 kg, 11원/kg\n실제완성품 생산수량 2,000단위\n[재료비 원가차이] 직접재료비 가격차이 9,600원 (유리한 차이)\n직접재료비 능률차이 2,800원 (불리한 차이)\n① 35,200원\n② 42,000원\n③ 44,800원\n④ 47,600원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 95, "text": "[95]다음은 ㈜삼일의 20X1년 1월 직접노무원가에 관한 자료이다. 1월의 실제직접노무시간이 2,500시간이\n었을때 실제 생산량에 허용된 표준직접노무시간은 얼마인가?\nㄱ. 실제 직접노무원가 10,000원\nㄴ. 직접노무원가 가격차이 2,500원(유리)\nㄷ. 직접노무원가 능률차이 3,500원(불리)\n① 1,800시간\n② 2,000시간\n③ 3,000시간\n④ 3,200시간", "answer": 1}, {"year": "2025", "month": "3", "qnum": 108, "text": "[108]다음 중 판매부서의 성과평가에 관한 설명으로 옳지 않은 것은?\n① 판매부서의 성과평가는 수익중심점보다 이익중심점으로 운영하는 것이 바람직하다.\n② 판매부서의 성과보고서에는 일반적으로 예산매출액과 실제매출액의 비교가 포함된다.\n③ 매출총차이는 매출가격차이와 매출조업도차이로 구분된다.\n④ 매출조업도차이는 매출배합차이와 시장점유율차이로 구분된다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 92, "text": "[92]다음 중 표준원가계산제도의 차이분석에 관한 설명으로 옳지 않은 것은?\n① 고정제조간접원가는 조업도와 관계없이 일정하게 발생하므로 원가통제 목적상 실제 고정제조간접원\n가 실제발생액과 고정제조간접원가 예산을 총액으로 비교하여 그 차이를 예산차이로 관리하게 된다.\n② 생산부문 책임자의 감독소홀이나 일정계획의 차질 등으로 인해 변동제조간접원가 능률차이가 발생할\n수 있다.\n③ 생산에 투입되는 노동력의 질에 따라 직접노무원가 가격차이가 발생할 수 있다.\n④ 원재료를 표준보다 비싸게 구입할 경우 직접재료원가 능률차이가 발생할 수 있다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 93, "text": "[93]다음은 표준원가계산제도를 채택하고 있는 ㈜삼일의 12월 중 생산활동과 관련한 직접노무원가에 대한\n자료이다. 직접노무원가 가격차이는 얼마인가?\n직접노무원가 표준임률 10,000원 / 시간\n실제 직접노무비 임률 8,000원 / 시간\n실제생산량에 허용된 표준직접작업시간 8,500시간\n직접노무원가 유리한 능률차이 15,000,000원\n① 14,000,000원 (유리)\n② 14,000,000원 (불리)\n③ 7,000,000원 (유리)\n④ 7,000,000원 (불리)", "answer": 1}, {"year": "2025", "month": "5", "qnum": 94, "text": "[94]㈜삼일의 표준원가계산제도는 제조간접원가의 배부에 있어서 작업시간을 배부기준으로 사용한다. 다음\n은 이 회사의 원가차이분석에 필요한 자료이다. 자료를 바탕으로 변동제조간접원가 소비차이를 계산하\n면 얼마인가?\n제조간접원가 실제발생액 15,000원\n고정제조간접원가 실제발생액 7,800원\n실제작업시간 3,000시간\n표준작업시간 3,500시간\n변동제조간접원가 표준배부율 작업시간당 2.5원\n① 250원 유리\n② 250원 불리\n③ 300원 유리\n④ 300원 불리", "answer": 3}, {"year": "2025", "month": "6", "qnum": 92, "text": "[92]다음은 표준원가계산제도의 도입과 관련된 논의이다. 논의의 내용 중 옳은 것을 고르면?\n가. 표준원가를 설정할 때 가장 이상적인 표준을 설정하는게 일반적이다.\n나. 이상적 표준을 설정하면 표준원가계산제도를 도입하는 의의가 없습니다. 표준은 최선의 조건하\n에서 달성 가능한 현실적인 목표하의 최적목표원가로 설정해야 종업원으로 하여금 최선을 다하\n도록 동기부여 할 수 있습니다.\n다. 표준원가와 실제발생원가의 차이를 성과평가 및 보상과 연계하는 경우, 종업원은 자신에게 불리\n한 예외사항을 숨기려고 할 유인이 있습니다. 따라서 표준원가계산제도의 정보는 예산수립 등\n의 계획에만 사용하고, 통제 도구로는 사용하지 않는 것이 바람직합니다.\n① 가\n② 가, 나\n③ 나\n④ 나, 다", "answer": 3}, {"year": "2025", "month": "6", "qnum": 93, "text": "[93]㈜삼일의 직접노무원가와 관련된 자료는 다음과 같다. 이와 관련된 설명 중 옳지 않은 것은?\n표준 직접노무시간 11,000시간\n실제 직접노무시간 10,000시간\n직접노무원가 가격차이 20,000원(유리)\n직접노무원가 실제원가 150,000원\n① 직접노무원가 표준원가는 187,000원이다.\n② 직접노무원가 시간당 실제임률은 15원이다.\n③ 직접노무원가 시간당 표준임률은 17원이다.\n④ 직접노무원가 능률차이는 7,000원 유리하게 나타난다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 94, "text": "[94]㈜삼일은 고정제조간접원가를 노동시간 기준으로 배부하는데 기준조업도는 20,000시간이다. 또한 제품\n단위당 표준노동시간은 8시간이며, 제품의 실제생산량은 2,000단위이고 고정제조간접원가의 실제발생\n액은 2,300,000원이다. 고정제조간접원가 예산차이가 300,000원(불리)이라면 조업도차이는 얼마인가?\n① 400,000원 불리\n② 400,000원 유리\n③ 500,000원 유리\n④ 500,000원 불리", "answer": 1}, {"year": "2025", "month": "6", "qnum": 107, "text": "[107]㈜삼일은 계산기를 생산하여 판매하고 있다. 올해 계산기의 예산판매량 및 예산판매가격은 각각\n12,000단위와 180원이며, 단위당 표준변동제조원가와 표준변동판매비는 각각 80원과 70원이다. 올해\n실제 매출수량과 단위당 판매가격은 다음과 같다.\n생산 및 매출수량 10,000단위\n단위당 판매가격 200원\n이 경우 매출가격차이와 매출조업도차이를 계산하면 각각 얼마인가?\n매출가격차이 매출조업도차이\n① 200,000원 불리 40,000원 유리\n② 200,000원 유리 60,000원 불리\n③ 220,000원 불리 60,000원 유리\n④ 220,000원 유리 60,000원 불리", "answer": 2}, {"year": "2025", "month": "7", "qnum": 92, "text": "[92]다음 중 표준원가의 종류에 관한 설명으로 옳지 않은 것은?\n① 기업 경영과 관련된 비교적 장기간의 과거 실적치를 통계적으로 평균화하고 미래 예상추세를 감안하\n여 결정되는 것은 정상적 표준이다.\n② 표준원가계산제도에서 표준원가는 일반적으로 현실적 표준원가를 의미하며 실제원가와 현실적 표준\n의 차이는 정상에서 벗어난 비효율을 의미한다.\n③ 차이분석 시 일반적으로 불리한 원가차이를 발생시켜 종업원의 동기부여에 역효과를 가져올 수 있는\n것은 이상적 표준이다.\n④ 표준원가와 실제원가와의 차이가 가장 적게 발생하여 매출원가 산정에 가장 적합한 것은 이상적 표\n준이다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 93, "text": "[93]다음 중 표준원가계산의 목적에 관한 설명으로 옳지 않은 것은?\n① 원가관리와 통제\n② 회계업무의 간소화\n③ 적시성 있는 원가정보 제공\n④ 제품별 발생원가의 정확한 계산", "answer": 4}, {"year": "2025", "month": "7", "qnum": 94, "text": "[94]㈜삼일의 직접재료원가에 관한 자료는 다음과 같다. 직접재료원가의 능률차이는 얼마인가?\n제품예산생산량 2,000개\n제품실제생산량 2,500개\nkg당 실제재료원가 350원\n제품 1개당 표준투입수량 4 kg\n직접재료원가 kg당 표준가격 300원\n직접재료원가 가격차이(불리한차이) 450,000원\n① 300,000원(유리)\n② 300,000원(불리)\n③ 600,000원(유리)\n④ 600,000원(불리)", "answer": 1}, {"year": "2025", "month": "7", "qnum": 95, "text": "[95]다음 중 직접노무원가 능률차이의 발생 원인으로 옳지 않은 것은?\n① 노동의 비능률적 사용\n② 단순한 작업에 고임률의 숙련된 노동자를 투입\n③ 생산에 투입되는 원재료의 품질 향상\n④ 생산부문 책임자의 감독 소홀", "answer": 2}, {"year": "2025", "month": "7", "qnum": 108, "text": "[108]제조업을 영위하는 ㈜삼일의 A제품 생산과 관련된 자료는 다음과 같다. 자료를 이용하여 직접재료원가\n의 수율차이를 계산하면 얼마인가?\n구 분 A제품\n직접재료(가) 10개, 단위당 100원\n제품 단위당 표준원가\n직접재료(나) 5개, 단위당 200원\n제품 생산량 480개\n직접재료(가) 4,500개\nA제품 생산시 실제투입량\n직접재료(나) 2,400개\n① 40,000원 불리한 차이\n② 40,000원 유리한 차이\n③ 80,000원 불리한 차이\n④ 80,000원 유리한 차이", "answer": 2}, {"year": "2025", "month": "9", "qnum": 93, "text": "[93]㈜삼일은 총 재료원가 100,000원인 원재료 50,000단위로 완제품 50,000단위를 생산하는 표준예산을 수\n립하였다. 실제 생산품은 50,000단위였고, 원재료는 45,000단위가 투입되었으며 원재료의 단위당 가격\n은 2.1원이었다. 직접재료원가의 가격차이와 능률차이는 얼마인가?\n가격차이 능률차이\n① 4,500원 불리 10,000원 유리\n② 4,500원 유리 10,500원 불리\n③ 5,000원 불리 10,500원 유리\n④ 10,000원 유리 4,500원 불리", "answer": 1}, {"year": "2025", "month": "9", "qnum": 94, "text": "[94]다음 중 제조간접원가차이를 3분법으로 분석할 경우에 나타나지 않는 항목은 무엇인가?\n① 소비차이\n② 조업도차이\n③ 예산차이\n④ 능률차이", "answer": 3}, {"year": "2025", "month": "9", "qnum": 95, "text": "[95]다음 중 ㈜삼일의 고정제조간접원가 차이분석에 관한 설명으로 옳은 것은?\n① 고정제조간접원가 실제발생액과 고정제조간접원가 예산과의 차이를 고정제조간접원가 총차이라고 한\n다.\n② 고정제조간접원가 예산은 실제산출량에 허용된 표준조업도에 조업도 단위당 표준배부율을 곱하여 계\n산한 금액을 의미한다.\n③ 고정제조간접원가 실제발생액과 고정제조간접원가 배부액과의 차이를 고정제조간접원가 예산차이라\n고 한다.\n④ 고정제조간접원가 예산과 고정제조간접원가 배부액과의 차이를 고정제조간접원가 조업도차이라고 한\n다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 109, "text": "[109]다음 중 이익중심점인 판매부서의 성과평가시 복수제품을 판매하는 경우에만 나타나는 차이는 무엇인\n가?\n① 매출조업도차이\n② 시장점유율차이\n③ 매출가격차이\n④ 매출배합차이", "answer": 4}, {"year": "2025", "month": "11", "qnum": 94, "text": "[94]㈜삼일은 표준원가계산제도를 채택하고 있으며, 당기의 예산생산량은 1,000개이나 실제생산량은 600개\n이다. 당기 중 직접재료 1,000kg를 200,000원에 외상으로 구입하여 800kg을 사용하였다. 직접재료의\n기초재고는 없으며, 제품 단위당 표준직접재료원가는 아래와 같다. 직접재료원가 가격차이를 (a)사용시\n점에 분리했을 경우와 (b)구입시점에 분리했을 경우의 가격차이는 각각 얼마인가?\n직접재료원가 : 2kg × 150 = 300원\n(a) (b)\n① 40,000원 유리 50,000원 유리\n② 40,000원 불리 50,000원 불리\n③ 40,000원 유리 50,000원 불리\n④ 40,000원 불리 50,000원 유리", "answer": 2}, {"year": "2025", "month": "11", "qnum": 95, "text": "[95]㈜삼일의 생산 및 원가와 관련된 자료는 다음과 같다. 변동제조간접원가 소비차이는 얼마인가(단, 제조\n간접원가 배부를 위한 조업도는 투입시간을 기준으로 한다)?\n변동제조간접원가 실제 발생액 500,000원\n실제 투입시간에 허용된 표준 변동제조간접원가 600,000원\n실제 산출량에 허용된 표준 변동제조간접원가 540,000원\n① 60,000원(유리)\n② 60,000원(불리)\n③ 100,000원(유리)\n④ 100,000원(불리)", "answer": 3}, {"year": "2025", "month": "12", "qnum": 92, "text": "[92]다음 중 표준원가계산의 한계점에 관한 설명으로 옳지 않은 것은?\n① 표준원가가 적정하게 산정되었는지의 여부에 객관성이 보장되기 힘들고 많은 비용이 소요된다.\n② 표준원가의 적정성을 사후 관리하지 않을 경우 미래원가계산을 왜곡할 소지가 있다.\n③ 표준원가계산제도를 채택할 경우 계량적인 정보를 무시할 가능성이 있다.\n④ 예외에 의한 관리기법을 사용할 경우 근로자에게 동기부여 측면에서 문제가 발생할 수 있다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 93, "text": "[93]다음은 20X1년 ㈜삼일의 직접노무원가에 관한 자료이다. 20X1년 ㈜삼일의 제품단위당 실제작업시간은\n얼마인가?\n실제제품생산량 5,000개\n실제직접노무원가 발생액 11,000,000원\n제품단위당 표준시간 9시간\n직접노무원가 가격차이 1,000,000원(유리)\n직접노무원가 능률차이 1,200,000원(불리)\n① 9.5시간\n② 10시간\n③ 10.5시간\n④ 11시간", "answer": 2}, {"year": "2025", "month": "12", "qnum": 94, "text": "[94]표준원가계산제도 적용 시, 제조간접원가의 차이는 분석방법에 따라 4분법, 3분법, 2분법, 1분법 등\n으로 다양하게 구분된다. 다음 중 제조간접원가 차이분석 절차 중 나타나지 않는 차이 항목은 무엇인\n가?\n① 소비차이\n② 능률차이\n③ 예산차이\n④ 가격차이", "answer": 4}, {"year": "2025", "month": "12", "qnum": 95, "text": "[95]다음 중 직접재료원가 가격차이가 발생하는 원인에 관한 설명으로 옳지 않은 것은?\n① 생산과정에서 원재료를 효율적으로 사용하지 못함으로써 발생할 수 있다.\n② 원재료 구매담당자의 업무능력에 따라 유리하거나 불리한 가격차이가 발생할 수 있다.\n③ 표준을 설정할 때 고려한 품질수준과 상이한 품질의 원재료를 구입함에 따라 가격차이가 발생할 수\n있다.\n④ 원재료 시장의 수요와 공급 상황에 따라 발생할 수 있다.", "answer": 1}], "04_변동원가계산·CVP분석": [{"year": "2024", "month": "1", "qnum": 96, "text": "[96]다음 중 초변동원가계산방법에 관한 설명으로 옳은 것은?\n① 변동원가계산방법에 비하여 불필요한 재고누적 방지효과가 크다.\n② 이익은 판매량에 의해서만 결정된다.\n③ 매출액에서 판매된 제품의 기초원가를 차감하여 재료처리량공헌이익을 계산한다.\n④ 외부보고목적의 재무제표 작성에 이용될 수 있다.", "answer": 1}, {"year": "2024", "month": "1", "qnum": 114, "text": "[114]㈜삼일은 다음과 같이 3가지 제품을 생산, 판매하고 있으며, 이와 관련된 변동손익계산서는 다음과 같\n다. 손실이 발생하는“가”제품의 폐지시 회피가능 고정비가 2,500원일때, 폐지여부와 의사결정에 따\n른 증분이익을 계산하면 얼마인가?\n가 나 다 합계\n매 출 액 5,000원 6,000원 9,000원 20,000원\n변 동 비 3,000원 2,000원 5,000원 10,000원\n공헌이익 2,000원 4,000원 4,000원 10,000원\n고 정 비 3,000원 2,000원 1,000원 6,000원\n손 익 (1,000원) 2,000원 3,000원 4,000원\n① 폐지, 500원\n② 폐지, 1,000원\n③ 유지, 500원\n④ 유지, 1,000원", "answer": 1}, {"year": "2024", "month": "3", "qnum": 96, "text": "[96]다음 중 전부원가계산에서 재고자산가액에 포함되는 원가항목을 모두 나열한 것으로 옳은 것은?\n① 직접재료원가\n② 직접재료원가, 직접노무원가, 변동제조간접원가\n③ 직접재료원가, 직접노무원가, 변동제조간접원가, 변동판매비와관리비\n④ 직접재료원가, 직접노무원가, 변동제조간접원가, 고정제조간접원가", "answer": 4}, {"year": "2024", "month": "3", "qnum": 99, "text": "[99]㈜삼일의 20X1년 손익에 대한 자료가 다음과 같을 경우 (a) 변동원가계산에 따른 공헌이익과 (b) 초변\n동원가계산에 따른 재료처리량공헌이익의 차이는 얼마인가?\n단위당 판매가격 500원 고정제조간접원가 200,000원\n단위당 직접재료원가 150원 고정판매비와관리비 70,000원\n단위당 직접노무원가 120원 기초제품 없음\n단위당 변동제조간접원가 50원 생산량 20,000개\n단위당 변동판매비와관리비 30원 판매량 10,000개\n① 1,070,000원\n② 1,900,000원\n③ 2,000,000원\n④ 2,170,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 104, "text": "[104]다음 자료를 이용하여 공헌이익률과 손익분기점 매출액을 계산하면 얼마인가?\n제품단위당 판매가격 500원\n제품단위당 변동제조원가 350원\n제품단위당 변동판매비 50원\n고정제조간접원가 500,000원\n고정판매비와관리비 1,500,000원\n공헌이익률 손익분기점 매출액\n① 20% 10,000,000원\n② 20% 12,000,000원\n③ 30% 10,000,000원\n④ 30% 12,000,000원", "answer": 1}, {"year": "2024", "month": "3", "qnum": 106, "text": "[106]다음 중 영업레버리지도(Degree of Operating Leverage)에 관한 설명으로 옳지 않은 것은(단, 모든 경\n우에 영업이익은 0 보다 크다고 가정한다)?\n① 영업레버리지란 고정원가로 인하여 매출액의 변화율보다 영업이익의 변화율이 확대되는 효과이다.\n② 고정원가가 감소하면 영업레버리지도는 낮아진다.\n③ 영업레비리지도가 높다는 것은 대체로 영업이익 규모가 양호함을 의미한다.\n④ 영업레버리지도는 손익분기점 부근에서 가장 크다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 92, "text": "[92]다음 중 표준원가계산에 관한 설명으로 옳지 않은 것은?\n① 표준원가제도는 전부원가계산 및 변동원가계산제도 모두에 적용할 수 있다.\n② 표준원가계산제도를 채택할 경우 계량적인 정보를 무시할 가능성이 있다.\n③ 원가발생의 예외를 관리하여 통제하기에 적절한 원가계산방법이다.\n④ 원가표준은 기본적으로 수량표준과 가격표준으로 이루어진다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 98, "text": "[98]㈜삼일은 당기 초에 영업활동을 시작하여 당기에 제품 1,100단위를 생산하였으며, 당기의 원가자료는\n다음과 같다. 당기 판매량이 800단위였다면, 전부원가계산에 의한 매출원가를 계산하면 얼마인가?\nŸ 단위당 직접재료원가 800원\nŸ 단위당 직접노무원가 300원\nŸ 단위당 변동제조간접원가 100원\nŸ 단위당 변동판매비와관리비 300원\nŸ 고정제조간접원가 220,000원\nŸ 고정판매비와관리비 110,000원\n① 420,000원\n② 960,000원\n③ 1,120,000원\n④ 1,200,000원", "answer": 3}, {"year": "2024", "month": "5", "qnum": 99, "text": "[99]다음 자료를 참고하여 ㈜삼일의 전부원가계산에 따른 매출총이익, 변동원가계산에 따른 공헌이익, 초변\n동원가계산에 따른 재료처리량공헌이익을 각각 올바르게 계산한 것은 어느 것인가?\nŸ 제품단위당 직접재료원가 100원\nŸ 제품단위당 직접노무원가 120원\nŸ 제품단위당 변동제조간접원가 50원\nŸ 제품단위당 변동판매비와관리비 40원\nŸ 고정제조간접원가 400,000원\nŸ 고정판매비와관리비 800,000원\n기초제품과 기말제품은 없으며 ㈜삼일은 당기 10,000개를 생산하여 전량 판매하였다. 제품 단위당 판매\n가격은 1,400원이다.\n전부원가계산 변동원가계산 초변동원가계산\n매출총이익 공헌이익 재료처리량공헌이익\n① 11,300,000원 11,300,000원 13,000,000원\n② 11,300,000원 11,300,000원 11,800,000원\n③ 10,900,000원 10,900,000원 13,000,000원\n④ 10,900,000원 10,900,000원 11,800,000원", "answer": 3}, {"year": "2024", "month": "5", "qnum": 100, "text": "[100]기초재고액보다 기말재고액이 작은 경우에 변동원가계산에 의한 순이익과 전부원가계산에 의한 순이익\n을 비교한 결과로 옳은 것은(단, 단위당 고정제조간접원가는 매년 동일하다고 가정한다)?\n① 변동원가계산에 의한 순이익이 더 크다.\n② 전부원가계산에 의한 순이익이 더 크다.\n③ 순이익은 같다.\n④ 상황에 따라 이익의 크기가 달라진다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 109, "text": "[109]다음 자료를 이용하여 ㈜삼일의 시장규모차이를 계산하면 얼마인가?\nŸ 단위당 예산평균공헌이익 100원\nŸ 실제시장점유율 25 %\nŸ 예산시장점유율 30 %\nŸ 실제시장규모 100,000개\nŸ 예산시장규모 120,000개\n① 500,000원(유리)\n② 500,000원(불리)\n③ 600,000원(유리)\n④ 600,000원(불리)", "answer": 4}, {"year": "2024", "month": "6", "qnum": 96, "text": "[96]다음 중 변동원가계산과 전부원가계산에 관한 설명으로 옳은 것은?\n① 기초재고자산이 없고 당기 생산량과 판매량이 동일하다면 변동원가계산 순이익이 전부원가계산보다\n크다.\n② 변동원가계산은 의사결정에 유용하므로 전부원가계산에 비하여 외부보고용으로 적절한 원가계산방법\n이다.\n③ 변동원가계산은 변동판매비와관리비를 제품원가로 인식하고, 전부원가계산은 고정제조간접원가를 제\n품원가로 인식한다.\n④ 변동원가계산을 표준원가 및 변동예산과 같이 사용하면 원가통제와 성과평가에 유용하게 활용할 수\n있다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 97, "text": "[97]20X1년에 영업을 시작한 ㈜삼일은 당기에 1,000단위의 제품을 생산하여 900단위의 제품을 판매하였다.\n당기의 판매가격 및 원가자료가 다음과 같을 때, 전부원가계산의 영업이익은 얼마인가?\n판매가격 100원\n제품단위당 직접재료원가 25원\n제품단위당 직접노무원가 20원\n제품단위당 변동제조간접원가 6원\n제품단위당 변동판매비와관리비 5원\n고정제조간접원가 30,000원\n① 9,000원\n② 12,600원\n③ 14,000원\n④ 17,100원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 98, "text": "[98]㈜삼일은 20X1년에 사업을 개시하였다. 20X1년 변동원가계산에 의한 순이익이 200,000원일 때, 제조간\n접비 배부액이 다음과 같을 경우 전부원가계산에 의한 순이익을 계산하면 얼마인가?\n변동제조간접원가 고정제조간접원가\n재 공 품 45,000원 30,000원\n제 품 30,000원 25,000원\n매출원가 230,000원 120,000원\n① 145,000원\n② 180,000원\n③ 220,000원\n④ 255,000원", "answer": 4}, {"year": "2024", "month": "6", "qnum": 99, "text": "[99]㈜삼일의 20X1년 2월의 제품 생산 및 판매와 관련된 자료는 다음과 같다. 초변동원가계산을 이용한 ㈜\n삼일의 20X1년 2월 재료처리량 공헌이익을 계산하면 얼마인가?\n생산량 5,000개\n판매량 4,700개\n제품단위당 판매가격 370원\n제품단위당 직접재료원가 130원\n제품단위당 직접노무원가 60원\n제품단위당 변동제조간접원가 30원\n고정제조간접원가 80,000원\n단, 기초 제품재고는 없다.\n① 705,000원\n② 846,000원\n③ 1,128,000원\n④ 1,200,000원", "answer": 3}, {"year": "2024", "month": "6", "qnum": 103, "text": "[103]다음 중 CVP분석에 관한 설명으로 옳은 것은?\n① 공헌이익률은 원가구조와 밀접한 관련이 있으며 변동원가 비중이 높으면 공헌이익률이 높게 나타난\n다.\n② 영업레버리지도가 3이라는 의미는 매출액이 1 % 변화할 때 당기순이익이 3 % 변화한다는 의미이\n다.\n③ 법인세를 고려하더라도 손익분기점 분석결과는 변하지 않는다.\n④ 복수제품인 경우 매출배합은 변동한다고 가정한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 104, "text": "[104]㈜삼일은 단일제품을 생산판〮매하고 있으며, 당해 공헌이익 손익계산서는 다음과 같다.\n매출액(800개×1,000원) 800,000원\n(-) 변동비 640,000원\n공헌이익 160,000원\n(-) 고정비 120,000원\n(=) 영업이익 40,000원\n내년에도 당해년도의 단위당 판매가격과 원가구조가 동일하게 유지되나 판매수량 감소가 예상된다.\n내년도에 영업손실이 발생되지 않으려면 판매수량이 최대 몇 개까지 감소하여도 되는가?\n① 150개\n② 180개\n③ 200개\n④ 250개", "answer": 3}, {"year": "2024", "month": "6", "qnum": 110, "text": "[110]㈜삼일은 복사기를 판매한다. ㈜삼일은 20X1년 복사기 시장규모가 80,000대일 것으로 예측했으나, 실\n제 시장규모는 70,000대로 집계되었다. 20X1년 예산판매량은 8,000대이고 단위당 예산공헌이익은 50\n원이었으나 20X1년 실제판매량은 5,600대이고 단위당 실제공헌이익은 40원이었다. 20X1년 ㈜삼일의\n시장점유율 차이를 구하면 얼마인가?\n① 70,000원 유리\n② 80,000원 유리\n③ 70,000원 불리\n④ 80,000원 불리", "answer": 3}, {"year": "2024", "month": "7", "qnum": 97, "text": "[97]다음 중 변동원가계산, 전부원가계산 및 초변동원가계산에 관한 설명으로 옳지 않은 것은?\n① 표준원가는 변동원가계산에는 사용될 수 없고 전부원가계산에서만 사용된다.\n② 전부원가계산에서 계산된 영업이익은 판매량뿐만 아니라 생산량의 변화에도 영향을 받는다.\n③ 변동원가계산은 기업의 내부계획 및 단기의사결정 목적으로 활용된다.\n④ 초변동원가계산에서는 혼합원가의 주관적 구분이 불필요하다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 103, "text": "[103]다음 중 영업레버리지에 관한 설명으로 옳지 않은 것은?\n① 영업레버리지란 영업고정원가가 지렛대의 작용을 함으로써 매출액의 변화율보다 영업이익의 변화율\n이 확대되는 효과이다.\n② 영업고정원가의 비중이 큰 기업은 영업레버리지가 크며, 영업고정원가의 비중이 작은 기업은 영업\n레버리지가 작다.\n③ 고정원가가 없는 기업은 영업레버리지 효과가 없기 때문에 영업레버리지도는 0(영)이다.\n④ 일반적으로 한 기업의 영업레버리지도는 손익분기점 부근에서 가장 크며, 매출액이 증가함에 따라\n점점 작아진다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 104, "text": "[104]다음 중 CVP분석에 관한 설명으로 옳은 것은?\n① 조업도와 원가의 변화가 이익에 어떠한 영향을 미치는가를 분석하는 기법이다.\n② 생산량과 판매량은 다르다고 가정한다.\n③ 기초적인 CVP분석에 있어 원가함수는 선형이라는 가정이 필요하지만, 수익함수는 선형이라는 가정\n이 필요하지 않다.\n④ 공헌이익률은 원가구조와 밀접한 관련이 있으며, 총원가 중 변동원가 비중이 높으면 공헌이익률도\n높게 나타난다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 110, "text": "[110]㈜삼일이 판매하고 있는 제품 A와 제품 B에 관련된 자료는 다음과 같다.\n제품 A 제품 B\n단위당 예산공헌이익 2,000원 3,000원\n예산매출수량 700단위 300단위\n실제매출수량 950단위 250단위\n㈜삼일의 매출배합차이는 얼마인가?\n① 110,000원 유리\n② 110,000원 불리\n③ 460,000원 유리\n④ 460,000원 불리", "answer": 2}, {"year": "2024", "month": "9", "qnum": 96, "text": "[96]다음 중 변동원가계산에 의한 손익계산서에 관한 내용으로 옳은 것을 모두 나열한 것은?\nㄱ. 변동제조간접원가를 기간비용으로 처리한다.\nㄴ. 고정제조간접원가는 공헌이익 산출에 포함되지 않는다.\nㄷ. 제품생산량이 영업이익에 영향을 미친다.\nㄹ. 판매비와관리비를 변동비와 고정비로 분리하여 보고한다.\n① ㄱ, ㄴ\n② ㄴ, ㄷ\n③ ㄴ, ㄹ\n④ ㄷ, ㄹ", "answer": 3}, {"year": "2024", "month": "9", "qnum": 99, "text": "[99]20X1년 초에 영업을 시작한 ㈜삼일은 선입선출법에 의한 실제원가계산제도를 채택하고 있으며, 20X1년\n1월의 생산과 판매에 관한 자료는 다음과 같다.\n1월\n생 산 량 10,000단위\n판 매 량 7,000단위\n20X1년 1월 중 전부원가계산에 의한 영업이익이 변동원가계산에 의한 영업이익보다 300,000원이 크다고\n할 때, 1월 고정제조간접원가는 얼마인가?\n① 700,000원\n② 1,000,000원\n③ 1,300,000원\n④ 2,000,000원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 100, "text": "[100]다음 중 초변동원가계산에 관한 설명으로 옳지 않은 것은?\n① 초변동원가계산에 의한 영업이익은 단위당 현금창출공헌이익에 판매수량을 곱하고 운영비용을 차감\n하여 계산한다.\n② 제조간접원가에 포함되는 혼합원가를 임의로 고정원가와 변동원가로 구분해야 하므로 혼합원가의\n주관적 구분이 필요하다.\n③ 생산량이 증가할수록 영업이익이 감소되므로 재고자산 보유를 최소화하도록 유인을 제공한다.\n④ 변동원가계산제도와 마찬가지로 원가회피개념에 근거를 두고 있다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 103, "text": "[103]다음 중 원가-조업도-이익 도표에 관한 설명으로 옳지 않은 것은?\n수익\n원\nc\n비용\nd\na\nb 조업도\n① a는 총고정원가를 의미한다.\n② b는 손익분기점 생산량을 의미한다.\n③ c는 공헌이익을 의미한다.\n④ d는 총변동비를 의미한다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 115, "text": "[115]다음은 ㈜삼일의 제품별 예산자료이다.\n제품A 제품B\n단위당 공헌이익 300원 450원\n단위당 기계시간 3 h 5 h\n연간 최대 수요량 100단위 80단위\n㈜삼일의 연간 사용가능 기계시간이 400시간일 때, 이익을 극대화하기 위해서는 두 제품을 각각 몇 단\n위씩 생산하여야 하는가?\n제품A 제품B\n① 100단위 20단위\n② 75단위 35단위\n③ 50단위 50단위\n④ 0단위 80단위", "answer": 1}, {"year": "2024", "month": "11", "qnum": 96, "text": "[96]다음 중 괄호 안에 들어갈 알맞은 용어를 옳게 짝지은 것은?\n전부원가계산제도는 ( A )개념에 근거를 두고 있다. ( A )개념이란 제품생산과 관련한 원가는\n원가의 행태에 관계없이 모두 제품의 원가로 보는 것이다. 변동원가계산제도는 ( B )개념에 근\n거를 두고 있다. ( B )개념이란 발생한 원가가 미래에 동일한 원가의 발생을 방지할 수 없다면\n그 원가는 자산성을 인정할 수 없다는 것이다.\nA B A B\n① 원가회피 기간원가 ② 원가회피 원가부착\n③ 원가부착 기간원가 ④ 원가부착 원가회피", "answer": 4}, {"year": "2024", "month": "11", "qnum": 98, "text": "[98]다음은 ㈜삼일의 원가자료이다. 전부원가계산 방법에 의한 영업이익이 변동원가계산방법에 의한 영업이\n익보다 2,000원 더 큰 경우 당기의 재고 증감량은 몇 개인가(단, 전기의 고정제조간접원가는 당기와 동\n일한 금액이 발생한 것으로 가정한다)?\n․ 당기 생산량 1,000개 ․ 변동제조간접원가 단위당 50원\n․ 기말 재고수량 100개 ․ 변동판매비와관리비 단위당 20원\n․ 기초 재고수량 ? ․ 고정제조간접원가 20,000원\n․ 판매가격 단위당 150원 ․ 고정판매비와관리비 3,000원\n① 변동 없음\n② 50개 감소\n③ 50개 증가\n④ 100개 증가", "answer": 4}, {"year": "2024", "month": "11", "qnum": 99, "text": "[99]㈜삼일의 20X1년 손익에 대한 자료가 다음과 같을 경우 (a) 변동원가계산에 따른 공헌이익, (b) 초변동\n원가계산에 따른 재료처리량공헌이익은 각각 얼마인가?\n․ 단위당 판매가격 4,000원 ․ 고정제조간접원가 1,200,000원\n․ 단위당 직접재료원가 1,000원 ․ 고정판매비와관리비 900,000원\n․ 단위당 직접노무원가 500원 ․ 기초제품 없음\n․ 단위당 변동제조간접원가 200원 ․ 생산량 1,000개\n․ 단위당 변동판매비와관리비 300원 ․ 판매량 1,000개\n① (a) 1,300,000원 (b) 2,500,000원\n② (a) 2,000,000원 (b) 3,000,000원\n③ (a) 2,500,000원 (b) 3,200,000원\n④ (a) 2,700,000원 (b) 3,500,000원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 100, "text": "[100]다음 중 초변동원가계산에서 재고자산가액에 포함되는 원가항목을 모두 나열한 것으로 옳은 것은?\n① 직접재료원가\n② 직접재료원가, 직접노무원가\n③ 직접재료원가, 직접노무원가, 변동제조간접원가, 고정제조간접원가\n④ 직접재료원가, 직접노무원가, 제조간접원가, 판매비와관리비", "answer": 1}, {"year": "2024", "month": "11", "qnum": 105, "text": "[105]다음 중 영업레버리지도(Degree of Operating Leverage)에 관한 설명으로 옳지 않은 것은(단, 모든 경\n우에 영업이익은 0 보다 크다고 가정한다)?\n① 영업레버리지란 고정원가로 인하여 매출액의 변화율보다 영업이익의 변화율이 확대되는 효과이다.\n② 영업레버리지도가 높다는 것은 대체로 영업이익 규모가 양호함을 의미한다.\n③ 고정원가가 감소하면 영업레버리지도는 낮아진다.\n④ 영업레버리지도는 손익분기점 부근에서 가장 크다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 109, "text": "[109]다음 자료를 이용하여 ㈜삼일의 시장규모차이를 계산하면 얼마인가?\n단위당 예산평균공헌이익 500원\n실제시장점유율 35 %\n예산시장점유율 30 %\n실제시장규모 150,000개\n예산시장규모 200,000개\n① 7,500,000원(유리)\n② 7,500,000원(불리)\n③ 8,750,000원(유리)\n④ 8,750,000원(불리)", "answer": 2}, {"year": "2024", "month": "11", "qnum": 115, "text": "[115]㈜삼일은 제품 A, B, C를 생산하여 판매하고 있다. 이 세 제품에 공통으로 필요한 재료 S는 품귀현상\n이 발생하여 당분간 구입이 불가능하다. ㈜삼일의 재료 S 보유량은 600 kg이며, 해당 재료가 소진되면\n더 이상 제품을 생산할 수 없다. ㈜삼일은 의무적으로 각 제품을 최소 수량까지는 생산하여야 한다.\n다음 자료를 이용하여 ㈜삼일의 최대 공헌이익을 산출하면 얼마인가(단, A, B, C 세 제품의 시장 수요\n는 충분하다고 가정한다)?\n구분 제품A 제품B 제품C\n의무생산 수량 10단위 10단위 30단위\n공헌이익 250원 200원 150원\n단위당 재료 S 사용량 4 kg 5 kg 2 kg\n① 42,750원\n② 48,250원\n③ 52,500원\n④ 57,500원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 100, "text": "[100]㈜삼일의 20X1년 2월의 제품 생산 및 판매와 관련된 자료는 다음과 같다. 초변동원가계산을 이용한\n㈜삼일의 20X1년 2월 재료처리량 공헌이익을 계산하면 얼마인가?\n생산량 4,500개\n판매량 4,300개\n제품단위당 판매가격 630원\n제품단위당 직접재료원가 320원\n제품단위당 직접노무원가 80원\n제품단위당 변동제조간접원가 90원\n고정제조간접원가 275,000원\n(단, 기초 제품재고는 없다)\n① 989,000원\n② 1,035,000원\n③ 1,333,000원\n④ 1,395,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 104, "text": "[104]다음은 매출액과 영업이익이 동일한 ㈜삼일과 ㈜용산의 영업활동에 관한 자료이다.\n㈜삼일 ㈜용산\n매 출 액 1,000,000원 1,000,000원\n변동원가 600,000원 300,000원\n공헌이익 400,000원 700,000원\n고정원가 200,000원 500,000원\n영업이익 200,000원 200,000원\n다음 중 ㈜삼일과 ㈜용산의 영업레버리지에 관한 설명으로 옳지 않은 것은?\n① 영업레버리지도는 손익분기점에 접근할수록 점점
