입을 위해 지출한 비용", "answer": 3}, {"year": "2024", "month": "1", "qnum": 68, "text": "[68]다음 중 소득세법상 퇴직소득에 관한 설명으로 옳은 것은?\n① 사용자 부담금을 기초로 하여 현실적 퇴직을 원인으로 지급받는 소득은 퇴직소득으로 본다.\n② 퇴직소득에 대한 총수입금액의 수입시기는 원칙적으로 퇴직소득을 실제로 지급받은 날로 한다.\n③ 법인의 상근임원이 비상근임원이 된 경우 실제로 퇴직금을 지급받지 않아도 퇴직으로 본다.\n④ 과세이연된 퇴직소득금액을 연금외수령한 경우 기타소득으로 과세한다.", "answer": 1}, {"year": "2024", "month": "1", "qnum": 69, "text": "[69]다음 중 소득세법상 양도소득에 관한 설명으로 옳지 않은 것은?\n① 기계장치와 함께 양도한 영업권의 양도소득은 양도소득세 과세대상이 아니다.\n② 특정시설물이용권의 양도소득은 양도소득세 과세대상이다.\n③ 신탁의 이익을 받을 권리(금전신탁수익증권, 투자신탁 수익권의 그 양도로 발생하는 소득이 배당소\n득으로 과세되는 경우 제외)의 양도로 발생하는 소득은 양도소득세 과세대상이다.\n④ 부동산의 취득시기가 도래하기 전에 해당 부동산을 취득할 수 있는 권리의 양도소득은 양도소득세\n과세대상이 아니다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 70, "text": "[70]다음 중 반드시 종합소득세 확정신고를 해야 하는 자는 누구인가(다만, 제시된 소득은 소득세법에 따라\n원천징수되었다고 가정한다)?\n① ㈜삼일에 재직 중인 비상근 임원으로서 개인사업도 영위하여 사업소득이 발생 중인 김아중씨\n② ㈜서울에 근무하다가 당기에 퇴직하여 퇴직금을 수령하였고 아직까지 취직을 하지 못하고 있는 최현\n빈씨\n③ 3억원의 정기예금에서 연 1,600만원의 이자를 수령하고 해당 이자소득 외에는 소득이 없는 한소희\n씨\n④ 로또복권당첨금 50,000,000원 외에 다른 소득이 없는 신미나씨", "answer": 1}, {"year": "2024", "month": "3", "qnum": 61, "text": "[61]다음 중 소득세와 관련된 설명으로 옳지 않은 것은?\n① 비거주자인 경우 국내원천소득에 대해서만 소득세를 과세한다.\n② 일용근로자의 근로소득은 원천징수로 납세의무를 종결한다.\n③ 사업자가 해당 과세기간 중에 폐업한 경우 1월 1일부터 폐업일까지를 과세기간으로 한다.\n④ 소득세는 신고납세제도를 채택하고 있으므로 납세의무자의 확정신고로 과세표준과 세액이 확정된다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 62, "text": "[62]다음 중 소득세법상 무조건 분리과세대상 금융소득인 것은?\n① 국외에서 받은 배당소득(국내 대리인이 원천징수한 것은 제외)\n② 비실명금융소득\n③ 국내금융소득 중 원천징수하지 않은 금융소득\n④ 출자공동사업자의 배당소득", "answer": 2}, {"year": "2024", "month": "3", "qnum": 63, "text": "[63]다음 자료로 복식부기의무자인 개인사업자 김삼일씨의 2024년 사업소득금액을 계산하면 얼마인가?\nㄱ. 손익계산서상 당기순이익 300,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 본인에 대한 급여 40,000,000원\n- 영업부장으로 근무하는 아들의 급여 30,000,000원\n- 정기예금이자 10,000,000원\n- 기계장치처분이익(사업용유형자산에 해당함) 5,000,000원\n- 세금과공과 중 과태료 3,000,000원\n① 320,000,000원\n② 323,000,000원\n③ 330,000,000원\n④ 333,000,000원", "answer": 4}, {"year": "2024", "month": "3", "qnum": 64, "text": "[64]정일품씨의 2024년 급여내역이 다음과 같을 때 총급여액을 계산하면 얼마인가(근무기간 : 2024. 1. 1 ~\n2024. 12. 31)?\n- 월급여액: 4,000,000원\n- 상여 : 월급여액의 400 %\n- 연월차수당: 3,000,000원\n- 식사대: 2,400,000원(월 200,000원. 단, 식사 또는 기타 음식물을 제공받지 않음)\n- 자가운전보조금: 3,000,000원(월 250,000원)(본인 소유 차량을 직접 운전하여 회사의\n업무 수행에 이용하고 실제 여비를 받는 대신 회사의 규정에 따라 받은\n금액임)\n① 67,000,000원\n② 67,600,000원\n③ 69,200,000원\n④ 70,000,000원", "answer": 2}, {"year": "2024", "month": "3", "qnum": 65, "text": "[65]다음은 근로자 황정남씨의 2024년 기타소득에 대한 자료이다. 황정남씨의 종합과세 될 기타소득금액을\n계산하면 얼마인가(단, 실제필요경비는 확인되지 아니한다.)?\nㆍ 슬롯머신 당첨금품 5,000,000원\nㆍ 일시적인 강연료(필요경비 차감 전) 10,000,000원\nㆍ 법인세법에 따라 처분된 기타소득 3,000,000원\n① 5,000,000원\n② 7,000,000원\n③ 10,000,000원\n④ 14,000,000원", "answer": 2}, {"year": "2024", "month": "3", "qnum": 66, "text": "[66]거주자 갑의 2024년 종합소득공제 관련 자료이다. 갑의 2024년 종합소득공제 중 인적공제액으로 옳은\n것은?\n<본인 및 부양가족 현황>\n구 분 나 이 소 득\n본 인(남성) 43세 총급여액 50,000,000원\n부 친 73세 총급여액 4,000,000원\n모 친* 72세 소득 없음\n아 들 10세 소득 없음\n* 모친은 항시 치료를 요하는 중증환자인 장애인이다.\n① 8,500,000원\n② 9,500,000원\n③ 10,000,000원\n④ 11,000,000원", "answer": 4}, {"year": "2024", "month": "3", "qnum": 67, "text": "[67]다음 중 소득세법상 세액공제에 관한 설명으로 옳지 않은 것은?\n① 거주자의 종합소득금액에 Gross-up된 배당소득금액이 합산된 경우에는 당해 배당소득에 가산된 금\n액을 산출세액에서 공제한다.\n② 복식부기의무자는 장부를 기장해도 기장세액공제를 적용받을 수 없다.\n③ 거주자의 종합소득에 국외원천소득이 포함되어 있는 경우 국외에서 납부한 세액이 있는 때에는 외국\n납부세액공제를 적용할 수 있다.\n④ 간편장부대상자가 간편장부로 기장하고 종합소득과세표준 확정신고시 간편장부 소득금액계산서를 제\n출하는 경우 기장세액공제가 적용된다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 68, "text": "[68]다음 중 연말정산 공제항목에 관한 설명으로 옳은 것은?\n① 유럽여행 중 현지에 있는 병원에서 치료를 받고 지급한 의료비는 의료비세액공제를 받을 수 있다.\n② 본인을 위해 자동차종합보험에 가입하고 납부한 보험료는 보험료세액공제 대상에 해당하지 아니한\n다.\n③ 자동차리스료를 직불카드로 지급한 경우에도 신용카드 등 사용금액에 대한 소득공제를 적용 받을 수\n있다.\n④ 중학생 자녀의 학교 수업료 뿐만 아니라 급식비나 교과서 구입비도 교육비세액공제대상에 해당한다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 69, "text": "[69]다음 중 양도소득세 과세대상자산으로 옳지 않은 것은?\n① 골프회원권\n② 과점주주가 보유하는 부동산과다보유법인 주식\n③ 전환사채\n④ 토지ㆍ건물과 함께 양도하는 영업권", "answer": 3}, {"year": "2024", "month": "3", "qnum": 70, "text": "[70]다음 중 소득세법상 신고ㆍ납부에 관한 설명으로 옳은 것은?\n① 소득세 중간예납 적용대상은 원칙적으로 종합소득이 있는 거주자 중 사업소득 또는 기타소득이 있는\n자로 한다.\n② 부가가치세법에 따른 사업자가 예정신고 또는 확정신고를 한 경우에도 사업장 현황신고를 하여야 한\n다.\n③ 근로소득과 퇴직소득이 있는 거주자는 적법하게 원천징수된 경우 소득세 확정신고 의무가 없다.\n④ 소득세 과세표준과 세액의 결정 및 경정방법은 추계조사를 원칙으로 한다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 61, "text": "[61] 다음 중 소득세법상 과세기간 및 납세지에 대한 설명으로 옳지 않은 것은?\n① 비거주자의 납세지는 국내사업장의 소재지로 하되, 국내사업장이 없는 경우에는 국내원천소득이 발\n생하는 장소로 한다.\n② 거주자가 폐업하는 경우에는 1월 1일부터 폐업일까지를 과세기간으로 한다.\n③ 거주자의 납세지는 주소지로 하되, 주소지가 없으면 거소지로 한다.\n④ 거주자가 사망한 경우에는 1월 1일부터 사망일까지를 과세기간으로 한다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 62, "text": "[62]다음 중 소득세법상 무조건 분리과세대상 금융소득인 것은?\n① 직장공제회 초과반환금\n② 국내금융소득 중 원천징수하지 않은 금융소득\n③ 출자공동사업자의 배당소득\n④ 국외에서 받은 배당소득(국내 대리인이 원천징수한 것은 제외)", "answer": 1}, {"year": "2024", "month": "5", "qnum": 63, "text": "[63]다음 자료를 이용하여 개인사업자 김삼일씨(복식부기의무자 아님)의 2024년도 사업소득금액을 계산하면\n얼마인가?\nㄱ. 손익계산서상 당기순이익 100,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 본인에 대한 급여 5,000,000원\n- 사업자금의 예치로 인한 정기예금이자 3,000,000원\n- 공장건물의 처분이익 4,000,000원\n① 95,000,000원\n② 98,000,000원\n③ 101,000,000원\n④ 103,000,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 64, "text": "[64]다음 자료에 의하여 거주자 김삼일 대리의 2024년 근로소득금액을 계산하면 얼마인가(단, 김삼일 대리\n는 2024년 1년 동안 계속 근무하였다)?\nㄱ. 월급여 : 3,000,000원(상여, 자가운전보조금, 식사대 제외)\nㄴ. 상여 : 월급여의 400 %\nㄷ. 실비변상적 성격의 자가운전보조금 : 월 300,000원\nㄹ. 식사대 : 월 200,000원(별도의 식사를 제공함)\n연간급여액 근로소득공제액\n4,500만원 초과 1억원 이하 1,200만원 + 4,500만원 초과액 × 5 %\n① 33,520,000원\n② 36,250,000원\n③ 37,300,000원\n④ 39,270,000원", "answer": 4}, {"year": "2024", "month": "5", "qnum": 65, "text": "[65]다음 중 기타소득에 해당하지 않는 것은?\n① 주택입주 지체상금\n② 일시적인 문예창작소득\n③ 퇴직한 후 주식매수선택권을 행사하여 얻은 이익\n④ 지상권의 설정 또는 대여로 인한 소득(공익사업과 관련 없음)", "answer": 4}, {"year": "2024", "month": "5", "qnum": 66, "text": "[66]다음 중 소득세법상 결손금 및 이월결손금 공제에 관한 설명으로 옳지 않은 것은?\n① 해당 과세기간의 소득금액을 추계신고 및 추계조사결정하는 경우에는 이월결손금을 공제할 수 없다.\n② 사업소득의 결손금은 소득세 법령에 따라 공제한다.\n③ 부동산임대업(주거용 건물임대업 포함)에서 발생한 결손금은 해당 과세기간의 다른 소득에서 공제할\n수 없다.\n④ 결손금은 발생한 과세기간 종료일부터 15년(2020. 1. 1. 전에 개시한 과세기간에 발생한 결손금은\n10년) 내에 종료하는 과세기간의 소득금액 계산시 먼저 발생한 것부터 순차로 공제한다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 67, "text": "[67]다음 중 의료비 세액공제 대상 의료비지출액에 해당하지 않는 것은?\n① 미용을 위한 성형수술비\n② 뇌졸중환자 휠체어를 구입하기 위한 비용\n③ 보청기 구입을 위해 지출한 비용\n④ 시력보정용 안경 또는 콘택트렌즈 구입을 위하여 지출한 비용(1인당 연 50만원 이내의 금액)", "answer": 1}, {"year": "2024", "month": "5", "qnum": 68, "text": "[68]다음 중 근로소득 연말정산에 관한 설명으로 옳지 않은 것은?\n① 중도퇴직자가 아닌 근로자인 경우에는 다음 해 2월분 급여를 지급하는 때에 1년간의 총급여에 대한\n연말정산을 한다.\n② 중도 퇴직한 경우에는 퇴직한 달의 급여를 지급하는 때 정산한다.\n③ 연간 소득금액이 100만원을 초과하는 배우자에 대한 의료비는 세액공제대상이 아니다.\n④ 해외에서 지출한 신용카드 사용액은 신용카드소득공제 대상이 아니다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 70, "text": "[70]다음 중 소득세법상 신고납부에 관한 설명으로 옳지 않은 것은?\n① 토지를 양도한 거주자는 양도일이 속하는 달의 말일부터 2개월 이내에 양도소득과세표준 예정신고\n를 하여야 한다.\n② 근로소득과 퇴직소득만 있는 자는 적법하게 원천징수된 경우에도 소득세 확정신고의무가 있다.\n③ 공적연금소득만 있는 자는 적법하게 원천징수된 경우 종합소득과세표준 확정신고는 하지 아니할 수\n있다.\n④ 사업소득이 있는 자는 6개월간의 소득세를 미리 납부하는 중간예납제도 적용대상으로서, 11월 말까\n지 중간예납하여야 한다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 61, "text": "[61]다음 중 소득세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 소득세법은 원칙적으로 열거주의에 의해 과세대상소득을 규정하고 있으며 예외적으로 이자 및 배당\n소득에 한하여 유형별 포괄주의를 채택하고 있다.\n② 퇴직소득과 양도소득은 다른 소득과 합산하지 않고 별도로 과세한다.\n③ 소득세법은 개인단위과세제도를 원칙으로 하되, 예외적으로 가족이 공동으로 사업을 경영하는 경우\n에는 무조건 합산과세한다.\n④ 소득세법은 과세표준의 증가에 따라 세율이 증가하는 누진과세를 채택하고 있다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 62, "text": "[62]다음 자료에 의하여 거주자 김삼일씨의 2024년 소득 중 종합과세할 금융소득금액을 계산하면 얼마인가\n(제시된 배당은 모두 Gross-up 대상이며, 배당소득 가산율은 10 % 이다)?\nㄱ. 현금배당 : 10,000,000원\nㄴ. 주식배당 : 30,000,000원\nㄷ. 은행예금이자 : 10,000,000원\nㄹ. 직장공제회 초과반환금 : 20,000,000원\n① 53,000,000원\n② 55,000,000원\n③ 73,000,000원\n④ 75,000,000원", "answer": 1}, {"year": "2024", "month": "6", "qnum": 63, "text": "[63]다음 자료로 간편장부대상자인 개인사업자 김삼일씨의 2024년 사업소득금액을 계산하면 얼마인가?\nㄱ. 손익계산서상 당기순이익 100,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 본인에 대한 급여 20,000,000원\n- 영업부장으로 근무하는 아들의 급여 10,000,000원\n- 정기예금이자 5,000,000원\n- 기계장치처분이익(사업용유형자산에 해당함) 1,000,000원\n- 사업용 건물에 대한 재산세 3,000,000원\n① 110,000,000원\n② 114,000,000원\n③ 115,000,000원\n④ 118,000,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 64, "text": "[64]다음은 ㈜삼일에 근무하는 김철수 대리의 2024년 급여지급 내역이다. 이와 관련한 설명으로 옳지 않은\n것은?\nㄱ. 월 급여 : 4,000,000원(상여, 자녀보육수당, 중식대 제외)\nㄴ. 상여 : 연간 12,000,000원\nㄷ. 6세 이하 자녀보육수당 : 월 200,000원\nㄹ. 중식대 : 월 200,000원(식사를 제공받지 않음)\nㅁ. 인정상여 : 3,000,000원\n① 총급여액 계산시 비과세소득은 근로소득에서 제외된다.\n② 법인세법에 따라 상여로 처분된 금액은 근로소득에서 제외된다.\n③ 근로자가 식사를 제공받지 않은 경우 월 20만원 이내의 식사대는 비과세한다.\n④ 6세 이하의 자녀 보육과 관련하여 사용자로부터 받는 급여로서 월 20만원 이내의 금액은 비과세한\n다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 65, "text": "[65]다음 중 소득세법상 기타소득에 관한 설명으로 옳지 않은 것은?\n① 복권당첨소득은 기타소득으로 분류되며 무조건 분리과세되므로 종합과세되지 않는다.\n② 법인세법에 따라 처분된 기타소득의 수입시기는 그 법인의 해당 사업연도의 결산확정일이다.\n③ 서화ㆍ골동품을 박물관 또는 미술관에 양도함으로써 발생하는 소득은 비과세 기타소득이다.\n④ 주택입주지체상금은 기타소득으로 분류되며 증빙이 없더라도 총수입금액의 60 % 를 필요경비 인정률\n로 적용받을 수 있다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 66, "text": "[66]다음 신용카드 등 사용금액 소득공제에 관한 설명으로 옳지 않은 것은?\n① 리스료(자동차대여사업의 자동차대여료를 포함함)는 신용카드 등 사용금액에 대한 소득공제대상이\n아니다.\n② 신용카드 사용액이 총급여의 25 % 를 초과하는 경우 소득공제액이 발생한다.\n③ 신용카드로 결제한 월세액은 세액공제를 적용받았는지 여부에 관계없이 신용카드 등 사용금액에 대\n한 소득공제대상이 아니다.\n④ 해외에서 지출한 신용카드 사용액은 신용카드 등 사용금액에 대한 소득공제대상이 아니다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 67, "text": "[67]다음 중 소득세법상 의료비세액공제에 관한 설명으로 옳지 않은 것은?\n① 근로소득이 있는 거주자가 기본공제대상자(나이 및 소득의 제한을 받지 아니한다)를 위하여 해당 과\n세기간에 의료비를 지급한 경우 의료비세액공제를 적용한다.\n② 공제대상 의료비에는 미용ㆍ성형수술을 위한 비용 및 건강증진을 위한 의약품 구입비용은 포함하지\n않는다.\n③ 미숙아·선천성이상아 의료비에 대한 의료비세액공제는 세액공제대상 금액의 20 % 로 한다.\n④ 시력보정용 안경 또는 콘택트렌즈 구입을 위하여 지출한 비용으로서 기본공제대상자 1명당 70만원\n이내의 금액은 공제대상 의료비에 해당한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 68, "text": "[68]다음 중 소득세법상 원천징수에 관한 설명으로 옳지 않은 것은?\n① 분리과세대상소득은 원천징수로써 납세의무가 종결된다.\n② 원천징수에 있어서 세금을 실제로 부담하는 납세의무자와 이를 실제 신고·납부하는 원천징수의무자\n는 서로 다르다.\n③ 비영업대금의 이익의 경우 원천징수세율은 14 % 이다.\n④ 법인이 개인에게 소득을 지급하는 경우 소득세법에 따라 원천징수한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 69, "text": "[69]거주자 최순희씨는 2024년 5월 6일에 10년간 보유한 토지(등기된 사업용토지)를 양도하였다. 다음 자\n료에 의해 양도소득과세표준을 계산하면 얼마인가(단, 동 토지의 실지양도비용은 6,000,000원이다)?\n기준시가\n구분 실지거래가액\n(개별공시지가)\n양도가액 100,000,000원 80,000,000원\n취득가액 50,000,000원 30,000,000원\n단, 장기보유특별공제율은 20 % 를 적용한다.\n① 32,700,000원\n② 35,200,000원\n③ 37,200,000원\n④ 39,500,000원", "answer": 1}, {"year": "2024", "month": "6", "qnum": 70, "text": "[70]다음 중 반드시 종합소득과세표준 확정신고를 해야 하는 자는 누구인가(다만, 제시된 소득은 소득세법\n에 따라 원천징수되었다고 가정한다)?\n① ㈜삼일에 재직 중인 비상근 임원으로서 소장하던 서화를 5천만원에 양도한 유지태씨\n② ㈜서울에 근무하다가 당기에 퇴직하여 퇴직금을 수령하였고 아직까지 취직을 하지 못하고 있는 한미\n진씨\n③ 10억원의 정기예금에서 연 3,600만원의 이자를 수령하고 해당 이자소득 외에는 소득이 없는 한소희\n씨\n④ 로또복권당첨금 50,000,000원 외에 다른 소득이 없는 신미나씨", "answer": 3}, {"year": "2024", "month": "7", "qnum": 50, "text": "[50]다음 중 법인세법상 손익의 귀속시기에 관한 설명으로 옳지 않은 것은?\n① 손익의 귀속사업연도는 법인세법의 규정을 우선 적용하고 법인세법에 규정되지 않는 사항에 대해서\n는 회계기준 등을 따르도록 하고 있다.\n② 위탁판매의 경우 수탁자가 상품을 판매한 날에 손익을 인식한다.\n③ 부동산 양도의 경우 소유권이전등기일이 대금청산일보다 빠르더라도 대금청산일이 속하는 사업연도\n를 손익의 귀속시기로 한다.\n④ 배당소득의 귀속시기는 소득세법상 배당소득의 수입시기를 귀속시기로 한다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 61, "text": "[61]다음 중 소득세와 관련된 설명으로 옳지 않은 것은?\n① 개인의 세금부담능력(담세력)은 소득의 증가에 비례하여 누진적으로 증가하므로 누진과세를 채택하\n고 있다.\n② 이자소득은 유형별 포괄주의를 채택하고 있으므로 이자소득으로 열거된 것과 유사한 것으로서 금전\n사용에 따른 대가로서의 성격이 있는 것은 법령에 열거되어 있지 않아도 이자소득으로 본다.\n③ 퇴직소득 및 양도소득은 다른 소득과 합산하지 않고 별도로 과세하는 분류과세 방식이 적용된다.\n④ 소득세는 납세의무자가 과세표준확정신고를 하더라도 소득세가 확정되지 않고 정부가 결정함으로서\n비로소 확정된다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 62, "text": "[62]다음 중 소득세법상 금융소득에 관한 설명으로 옳지 않은 것은?\n① 법원보증금의 이자는 무조건 종합과세한다.\n② 비실명으로 가입한 저축 등에서 발생하는 이자소득은 높은 세율로 과세하기 위해 무조건 분리과세\n한다.\n③ 보통예금의 이자소득은 원칙적으로 실제로 지급받은 날을 수입시기로 한다.\n④ 금융소득 종합과세란 이자소득과 배당소득을 종합소득에 합산하여 과세하는 제도이다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 63, "text": "[63]다음은 2024년 김삼일씨의 상가임대 관련 소득 내역이다. 김삼일씨의 2024년 부동산임대 관련 사업소\n득의 총수입금액을 계산하면 얼마인가(단, 임대보증금은 없는 것으로 가정한다)?\nㄱ. 임대기간 : 2024년 8월 1일 - 2025년 7월 31일\nㄴ. 임 대 료 : 60,000,000원(2024년 7월 1일에 선불로 수령함)\n① 25,000,000원\n② 30,000,000원\n③ 60,000,000원\n④ 100,000,000원", "answer": 1}, {"year": "2024", "month": "7", "qnum": 64, "text": "[64]다음 자료에 의하여 거주자 김삼일씨의 2024년 근로소득금액을 계산하면 얼마인가?\nㄱ. 월급여：2,000,000원\nㄴ. 상여：월급여의 500 %\nㄷ. 실비변상적 성격의 자가운전보조금：월 200,000원\nㄹ. 중식대：월 200,000원(식사를 제공받지 않음)\nㅁ. 연간 연월차수당 총합계：1,000,000원\n* 김삼일씨는 당해 1년 동안 계속 근무하였다.\n연간급여액 근로소득공제액\n1,500만원 초과 4,500만원 이하 750만원 ＋ 1,500만원 초과액×15 %\n4,500만원 초과 1억원 이하 1,200만원 ＋ 4,500만원 초과액×5 %\n① 21,330,000원\n② 23,650,000원\n③ 24,500,000원\n④ 25,520,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 65, "text": "[65]다음 중 연금소득에 관한 설명으로 옳지 않은 것은?\n① 개인이 가입한 연금계좌에서 연금수령한 사적연금소득도 연금소득으로 과세된다.\n② 국민연금법에 따라 받는 유족연금은 연금소득으로 과세되지 않는다.\n③ 연금소득금액 계산시 필요경비인정방식과 연금 소득공제방식 중 선택하여 적용 가능하다.\n④ 공적연금소득에 대한 수입시기는 연금을 지급받기로 한 날로 한다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 66, "text": "[66]다음 중 소득세법상 인적공제에 관한 설명으로 옳은 것은?\n① 기본공제는 생계를 같이하는 가족 1명당 150만원을 공제하는 것으로 본인은 공제대상에 포함하지\n않는다.\n② 기본공제를 적용하는 경우 장애인은 소득금액요건을 적용하지 않는다.\n③ 경로우대자 공제는 기본공제대상자의 연령이 만 65세 이상인 경우 적용한다.\n④ 종합소득금액이 3천만원 이하인 여성거주자가 배우자가 있는 경우 부녀자 공제를 받을 수 있다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 67, "text": "[67]다음은 근로소득자(일용근로자 아님)인 이주원씨가 자녀들을 위하여 지출한 교육비와 관련한 자료이다.\n연말정산시 세액공제대상 교육비는 모두 얼마인가(단, 제시된 자료 외에는 없는 것으로 가정한다)?\nㄱ. 자녀의 연령 및 소득\n- 장남 : 29세(대학원생), 소득금액 없음\n- 차남 : 23세(대학생), 사업소득금액 80 만원\n- 장녀 : 15세(중학생), 소득금액 없음\nㄴ. 자녀의 교육비 지출액\n- 장남의 대학원 수업료 12,000,000 원\n- 차남의 대학교 수업료 12,000,000 원\n- 장녀의 고등학교 수업료 5,000,000 원\n① 5,000,000원\n② 12,000,000원\n③ 17,000,000원\n④ 29,000,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 68, "text": "[68]다음 중 소득세법상 원천징수에 관한 설명으로 옳지 않은 것은?\n① 원천징수는 납세의무자 입장에서 세금부담을 가중시킨다.\n② 원천징수는 징세비용절약과 징수사무의 간소화를 기한다.\n③ 원천징수는 조세수입의 조기확보와 정부재원조달의 평준화를 기한다.\n④ 완납적 원천징수에 해당하면 별도의 확정신고가 불필요하다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 69, "text": "[69]다음 중 양도소득세 과세대상은 몇 개인가?\nㄱ. 골프회원권을 양도한 경우\nㄴ. 토지를 무상이전한 경우\nㄷ. 자산총액 중 토지와 건물의 합계액이 90 % 인 골프장을 직접 경영하는 법인의 주식을 양도하는\n경우\nㄹ. 부동산 상의 권리와 함께 양도하는 영업권\n① 1개\n② 2개\n③ 3개\n④ 4개", "answer": 3}, {"year": "2024", "month": "7", "qnum": 70, "text": "[70]다음은 소득세법상 중간예납에 관한 설명으로 옳지 않은 것은?\n① 중간예납은 1 년간 소득에 대한 소득세를 분할 예납하게 하여 정부의 세수조기확보 및 납세자의 자\n금부담을 분산시킬 수 있다.\n② 소득세 중간예납대상자는 종합소득이 있는 거주자 중 사업소득이 있는 자이다.\n③ 중간예납세액이 50만원 미만일 경우 중간예납세액을 징수하지 아니한다.\n④ 중간예납기간은 매년 1월 1일부터 6월 30일까지의 기간으로 하며 납부기한은 9월 30일이다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 61, "text": "[61]다음 중 소득세법상 소득의 구분 및 과세에 관한 설명으로 옳지 않은 것은?\n① 비거주자에 대하여 과세하는 소득세는 해당 국내원천소득을 종합하여 과세하는 경우와 분류하여 과\n세하는 경우 및 그 국내원천소득을 분리하여 과세하는 경우로 구분하여 계산한다.\n② 일용근로자에 대한 근로소득은 종합소득대상이 아니다.\n③ 국내사업장이 없는 비거주자에 대하여는 국내원천소득(퇴직소득·양도소득을 포함)을 소득별로 분리\n하여 과세한다.\n④ 분리과세대상소득은 소득을 지급하는 자가 소득을 지급할 때 원천징수함으로써 납세의무가 종결된\n다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 62, "text": "[62]다음 중 금융소득의 과세방법에 관한 설명으로 옳지 않은 것은?\n① 이자, 배당소득 중 원천징수되지 않은 금융소득은 분리과세 대상이 아니다,\n② 비실명금융소득의 경우 종합소득에 합산하지 아니하고 원천징수로써 납세의무가 종결된다.\n③ 종합과세대상 금융소득이 2,000만원 이하인 경우에는 누진세율이 적용되지 않는다.\n④ 종합과세 되는 배당소득의 경우 원천징수세율의 적용여부와 관계없이 Gross-up이 적용된다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 64, "text": "[64]다음 중 소득세가 과세되는 근로소득 항목을 모두 고르면?\nㄱ. 법인세법에 의해 상여로 처분된 금액\nㄴ. 6세 이하 자녀에 대하여 월 20만 원을 초과하여 지급하는 보육비\nㄷ. 사내 급식으로 제공받는 식사\nㄹ. 퇴직급여로 지급되기 위하여 적립되는 급여\nㅁ. 종업원(임원아님)이 사택을 제공받음으로써 얻는 이익\n① ㄱ, ㄴ\n② ㄱ, ㄹ\n③ ㄴ, ㄹ\n④ ㄷ, ㅁ", "answer": 1}, {"year": "2024", "month": "9", "qnum": 65, "text": "[65]다음 중 소득세법상 기타소득에 관한 설명으로 옳지 않은 것은?\n① 국내에서 거주자 또는 비거주자에게 기타소득을 지급하는 자는 기타소득금액의 22 % 에 해당하는 세\n액을 원천징수하여 그 징수일이 속하는 달의 다음달 10일까지 납부하여야한다.\n② 기타소득은 종합과세하는 것이 원칙이나 소득세법이 정하는 일부 기타소득은 분리과세한다,\n③ 기타소득금액이 연 300만원 이하인 경우 선택적 분리과세가 가능하다.\n④ 법인세법에 따라 처분된 기타소득의 수입시기는 해당법인의 해당 사업연도 결산 확정일이다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 66, "text": "[66]다음은 거주자 김삼일씨의 2024년 부양가족 현황이다. 김삼일씨가 소득공제로 적용받을 수 있는 인적공\n제(기본공제와 추가공제)의 합계를 계산하면 얼마인가(단, 제시된 자료 외 다른 사항은 고려하지 않는\n다)?\n가족구성원 연령 소득종류 및 금액\n김삼일(남성) 42세 종합소득금액 5,000만원\n배우자(장애인) 40세 총급여 500만원\n부친 72세 소득 없음\n모친(장애인) 69세 사업소득금액 120만원\n딸 10세 소득 없음\n아들 8세 소득 없음\n① 900만원\n② 950만원\n③ 1,050만원\n④ 1,150만원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 67, "text": "[67]다음 중 소득세법상 세액공제·감면에 관한 설명으로 옳은 것은?\n① 만 7세 이상의 기본공제대상자에 해당하는 자녀(입양자 및 위탁아동 포함) 1명당 15만원을 세액공\n제 받을 수 있다.\n② 해당 과세기간에 출생한 자녀가 셋째인 경우 70만원을 세액공제 받을 수 있다.\n③ 장애인전용 보장성보험료는 200만원까지 보험료 세액공제 대상이 된다.\n④ 총급여액의 5 % 를 초과하는 의료비에 대해서 의료비 세액공제를 받을 수 있다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 68, "text": "[68]다음 중 원천징수에 관한 설명으로 옳지 않은 것은?\n① 비영업대금의 이익의 경우 원천징수세율은 25 % 이다.\n② 법인이 개인에게 소득을 지급하는 경우 법인세법에 따라 원천징수한다.\n③ 원천징수에 의해서 정부는 조세수입을 조기에 확보할 수 있으며, 탈세를 방지할 수 있는 장점이 있다.\n④ 완납적 원천징수의 경우에는 별도의 소득세 확정신고 절차가 불필요하다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 69, "text": "[69]다음 중 양도소득에 관한 설명으로 옳지 않은 것은?\n① 상장주식을 양도한 경우에는 원칙적으로 양도소득세 대상이 아니나, 대주주 거래분과 장외거래분에\n한해서 양도소득세를 과세한다.\n② 1세대 1주택(고가주택 제외)과 그 부수토지의 양도로 인한 소득에 대해서는 비과세를 적용한다.\n③ 토지를 법인에게 현물출자한 경우에는 양도가 아니므로 양도소득세 대상이 아니다.\n④ 거주자가 토지 및 건물을 양도한 경우 양도한 날이 속하는 달의 말일부터 2개월 이내에 양도소득세\n를 신고 및 납부하여야 한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 61, "text": "[61]다음 중 소득세법에 관한 설명으로 옳은 것은?\n① 소득세법상 과세기간은 1월 1일부터 12월 31일까지 1년간이나 사업자가 폐업한 경우에는 1월 1\n일부터 폐업일까지를 과세기간으로 한다.\n② 일용근로자의 근로소득은 원천징수로 납세의무를 종결하는 분리과세 대상 소득이다.\n③ 비거주자는 국내외원천소득에 대하여 소득세를 납부하여야 한다.\n④ 개인단위로 과세하는 것이 원칙이나 부부인 경우에는 금융소득을 합산하여 과세한다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 62, "text": "[62]다음 중 소득세법상 무조건 분리과세대상 금융소득인 것은?\n① 국내금융소득 중 원천징수하지 않은 금융소득\n② 비실명금융소득\n③ 출자공동사업자의 배당소득\n④ 국외에서 받은 배당소득(국내 대리인이 원천징수한 것은 제외)", "answer": 2}, {"year": "2024", "month": "11", "qnum": 63, "text": "[63]다음 자료를 이용하여 개인사업자 김삼일씨(복식부기의무자임)의 2024년도 사업소득금액을 계산하면 얼\n마인가?\nㄱ. 손익계산서상 당기순이익 100,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 본인에 대한 급여 3,000,000원\n- 사업자금의 예치로 인한 정기예금이자 5,000,000원\n- 기계장치(유형자산)의 처분이익 4,000,000원\n- 토지의 처분이익 2,000,000원\n① 96,000,000원\n② 98,000,000원\n③ 101,000,000원\n④ 103,000,000원", "answer": 1}, {"year": "2024", "month": "11", "qnum": 64, "text": "[64]거주자 김철수 씨는 ㈜경기(중소기업)에서 영업부 부장으로 재직하던 중 2024년 6월 30일에 퇴직하였\n다. 다음 자료는 김철수 씨가 2024년 1월 1일부터 2024년 6월 30일까지 ㈜경기로부터 지급받은 금액\n또는 이익이다. 김철수 씨의 2024년 근로소득 총급여액을 계산하면 얼마인가?\n구 분 금액(이익) 비 고\n(1) 급여 60,000,000원 월 10,000,000원\n(2) 식사 3,000,000원 월 50만원 상당의 식사를 제공받음\n(3) 식사대 1,200,000원 월 200,000원\n소유차량을 이용하여 업무를 수행하였으며, 실제 여비를\n(4) 차량유지비 1,800,000원\n받는 대신에 ㈜경기의 사규에 따라 월 30만원씩 지급받음\n(5) 건강보험료 1,500,000원 국민건강보험법에 의한 사용자부담 국민건강보험료\n(6) 단체순수보장성보험\n300,000원 ㈜경기가 부담한 단체순수보장성보험의 보험료\n의 보험료\n① 61,800,000원\n② 62,100,000원\n③ 63,000,000원\n④ 64,500,000원", "answer": 1}, {"year": "2024", "month": "11", "qnum": 65, "text": "[65]다음 중 기타소득에 해당하지 않는 것은?\n① 주택입주 지체상금\n② 일시적인 문예창작소득\n③ 근무 중에 주식매수선택권을 행사하여 얻은 이익\n④ 공익사업과 관련하여 지상권의 설정 또는 대여로 인한 소득", "answer": 3}, {"year": "2024", "month": "11", "qnum": 66, "text": "[66]거주자 김삼일씨의 부양가족 현황이 다음과 같은 경우 김삼일씨(남성, 49 세)의 2024년 종합소득 과세\n표준 계산시 공제되는 인적공제액을 계산하면 얼마인가?\n구 분 나 이 비 고\n배우자 48 세 소득 없음\n부 친 75 세 2024년 4월 15일 사망함, 소득없음\n모 친 69 세 소득 없음\n장 모 68 세 주거형편상 별거하고 있으며, 소득 없음\n장 남 23 세 장애인이며, 사업소득금액 4,000,000원 있음\n장 녀 18 세 소득 없음\n① 9,000,000 원\n② 10,000,000 원\n③ 11,000,000 원\n④ 13,000,000 원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 67, "text": "[67]다음 중 소득세법상 의료비세액공제에 관한 설명으로 옳지 않은 것은?\n① 미용을 위한 성형수술비는 의료비세액공제대상이 아니다.\n② 건강증진을 위한 의약품 구입비용은 공제대상 의료비에 해당하지 않는다.\n③ 의료비지출액에 대하여 보험회사등으로부터 실손의료보험금을 받은 경우에도 의료비지출액은 의료비\n세액공제 대상이 된다.\n④ 시력보정용 안경 또는 콘택트렌즈 구입을 위하여 지출한 비용으로서 기본공제대상자(나이 및 소득제\n한 없음) 1명당 50만원 이내의 금액은 공제대상 의료비에 해당한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 68, "text": "[68]다음 중 퇴직소득에 해당하지 않는 것은?\n① 공적연금 관련법에 따라 받는 일시금\n② 사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받는 소득\n③ 「건설근로자의 고용개선 등에 관한 법률」 에 따라 지급받는 퇴직공제금\n④ 임원 퇴직소득 한도초과액", "answer": 4}, {"year": "2024", "month": "11", "qnum": 69, "text": "[69]거주자 최순희씨는 2024년 5월 6일에 15년간 보유한 토지(등기된 사업용토지)를 양도하였다. 다음 자\n료에 의해 양도소득과세표준을 계산하면 얼마인가(단, 동 토지의 실지양도비용은 6,000,000원이다)?\n기준시가\n구분 실지거래가액\n(개별공시지가)\n양도가액 90,000,000원 80,000,000원\n취득가액 40,000,000원 30,000,000원\n단, 장기보유특별공제율은 30 % 를 적용한다.\n① 28,300,000원\n② 30,800,000원\n③ 32,500,000원\n④ 35,000,000원", "answer": 1}, {"year": "2024", "month": "11", "qnum": 70, "text": "[70]다음 중 반드시 종합소득세 확정신고를 해야 하는 자는 누구인가(단, 원천징수 대상소득에 대하여는 소\n득세법에 따라 적법하게 원천징수 하였다)?\n① 삼일전자에 근무하고 있고 연간 총급여액 5,000만원의 근로소득 외에 다른 소득이 없는 김철수씨\n② 용산상사에 근무하다가 당기에 퇴직하여 3억원 퇴직금을 수령하였고 다른 소득은 없는 김영희씨\n③ 3억원의 정기예금에서 연간 1,500만원씩 이자를 수령하고, 수령한 이자소득만으로 생활을 하고 계\n신 이철수 할아버지\n④ 상가를 임대하여 연간 4,000만원의 임대료를 받고 있는 성부자 할머니", "answer": 4}, {"year": "2024", "month": "12", "qnum": 62, "text": "[62]다음 중 무조건 분리과세대상 금융소득에 해당하지 않는 것은?\n① 출자공동사업자의 배당소득\n② 직장공제회 초과반환금\n③ 법원보증금 등의 이자\n④ 법인으로 보는 단체 이외의 단체 중 수익을 구성원에게 분배하지 아니하는 단체가 단체명을 표시하\n여 금융거래를 함으로써 금융기관으로부터 받는 이자소득 및 배당소득", "answer": 1}, {"year": "2024", "month": "12", "qnum": 63, "text": "[63]다음 자료로 개인사업자 김삼일씨(복식부기의무자 아님)의 2024년 사업소득금액을 계산하면 얼마인가?\nㄱ. 손익계산서상 당기순이익 200,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n(아래 기술한 내용 이외에는 모두 세법상 적정하게 계상되어 있음)\n- 본인에 대한 급여 50,000,000원\n- 배당금수익 2,000,000원\n- 유형자산처분이익 10,000,000원\n- 세금과공과 중 벌금 5,000,000원\n① 195,000,000원\n② 205,000,000원\n③ 232,000,000원\n④ 243,000,000원", "answer": 4}, {"year": "2024", "month": "12", "qnum": 64, "text": "[64]다음 자료에 의하여 거주자 김삼일씨의 2024년 근로소득금액을 계산하면 얼마인가?\nㄱ. 급여：월 3,000,000원\nㄴ. 상여：연 8,000,000원\nㄷ. 실비변상적 성격의 자가운전보조금：월 200,000원\nㄹ. 중식대：월 200,000원(식사를 제공받지 않음)\nㅁ. 연간 연월차수당 총합계：1,000,000원\n* 김삼일씨는 당해 1년 동안 계속 근무하였다.\n연간급여액 근로소득공제액\n1,500만원 초과 4,500만원 이하 750만원 ＋ 1,500만원 초과액×15 %\n4,500만원 초과 1억원 이하 1,200만원 ＋ 4,500만원 초과액×5 %\n① 33,000,000원\n② 35,280,000원\n③ 36,420,000원\n④ 38,760,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 65, "text": "[65]다음은 거주자 김삼일 씨의 2024년 기타소득에 관한 자료이다. 김삼일 씨의 종합과세 할 기타소득금액\n은 얼마인가(단, 기타소득의 실제 필요경비는 확인되지 아니한다)?\nㆍ 통신판매중개를 하는 자를 통하여 장소를 대여하고 받은 대여료 5,000,000원\nㆍ 주택입주지체상금 6,000,000원\nㆍ 복권당첨소득 3,000,000원\n① 3,200,000원\n② 4,200,000원\n③ 5,600,000원\n④ 8,600,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 66, "text": "[66]근로소득이 있는 거주자 김지나 씨(여성)의 다음 자료를 바탕으로 2024년 종합소득공제 중 인적공제액\n을 계산한 것으로 옳은 것은?\n(1) 본인 및 부양가족 현황\n관 계 연 령 소 득 비 고\n본 인 42세 근로소득금액 40,000,000원\n부 친 75세 없 음 2024년 1월 10일 사망\n모 친 72세 사업소득금액 6,000,000원\n남 편 43세 총급여액 5,000,000원\n아 들 7세 없 음\n동 생 39세 없 음 장애인\n(2) 본인과 부양가족은 주민등록표의 동거가족으로서 해당 과세기간 동안 동일한\n주소에서 생계를 같이하고 있다.\n(3) 조세부담 최소화를 가정한다.\n① 9,500,000원\n② 10,000,000원\n③ 10,500,000원\n④ 11,000,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 67, "text": "[67]다음 중 소득세법상 세액공제에 관한 설명으로 옳지 않은 것은?\n① 거주자의 종합소득금액에 Gross-up된 배당소득금액이 합산된 경우에는 당해 배당소득에 가산된 금\n액을 산출세액에서 공제한다.\n② 복식부기의무자는 복식부기로 기장한 경우에도 기장세액공제를 적용받을 수 없다.\n③ 간편장부대상자가 간편장부로 기장하고 종합소득과세표준 확정신고시 간편장부 소득금액계산서를 제\n출하는 경우 기장세액공제가 적용된다.\n④ 거주자의 종합소득에 국외원천소득이 포함되어 있는 경우 국외에서 납부한 세액이 있는 때에는 외국\n납부세액공제를 적용할 수 있다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 68, "text": "[68]다음 중 소득세법상 퇴직소득에 관한 설명으로 옳지 않은 것은?\n① 종업원이 임원이 된 경우에 퇴직급여를 실제로 지급받지 않은 경우에는 퇴직으로 보지 않을 수 있\n다.\n② 사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받는 소득은 퇴직소득에 해당한다.\n③ 퇴직일 현재 연금계좌에 있거나 퇴직소득을 연금계좌로 지급하는 경우 퇴직일에 해당 퇴직소득에 대\n한 소득세를 원천징수하여야 한다.\n④ 「건설근로자의 고용개선 등에 관한 법률」에 따라 지급받는 퇴직공제금은 퇴직소득으로 본다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 69, "text": "[69]다음 중 소득세법상 양도소득에 관한 설명으로 옳지 않은 것은?\n① 비상장주식의 양도소득은 원칙적으로 양도소득세 과세대상이다.\n② 대주주의 상장법인 주식의 양도소득은 양도소득세 과세대상이다.\n③ 1세대 1주택은 고가주택 해당 여부에 관계없이 과세하지 않는다.\n④ 건물을 무상이전하는 경우에는 양도소득세를 과세하지 아니한다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 70, "text": "[70]다음 중 소득세법상 신고납부와 관련된 설명으로 옳지 않은 것은?\n① 성실신고확인대상사업자가 성실신고확인서를 제출하는 경우에는 종합소득과세표준 확정신고를 그 과\n세기간의 다음 연도 5월 1일부터 6월 30일까지 하여야 한다.\n② 중간예납세액이 50만원 미만일 경우 중간예납세액을 징수하지 아니한다.\n③ 모든 거주자는 소득의 종류와 관계없이 6개월간의 소득세를 미리 납부하는 중간예납제도 적용대상\n이다.\n④ 근로소득만이 있는 자는 연말정산으로 모든 납세절차가 종결되기 때문에 확정신고는 원칙적으로 하\n지 않아도 된다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 61, "text": "[61]다음 중 소득세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 소득세법은 과세표준의 증가에 따라 세율이 증가하는 누진과세를 채택하고 있다.\n② 소득세법은 개인단위과세제도를 원칙으로 하되, 예외적으로 부부가 공동으로 사업을 경영하는 경우\n에는 무조건 합산과세한다.\n③ 퇴직소득과 양도소득은 다른 소득과 합산하지 않고 별도로 과세한다.\n④ 소득세법은 원칙적으로 열거주의에 의해 과세대상소득을 규정하고 있으며 예외적으로 이자 및 배당\n소득에 한하여 유형별 포괄주의를 채택하고 있다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 62, "text": "[62]다음은 거주자 김삼일씨의 금융소득(이자소득과 배당소득)과 관련된 자료이다. 김삼일씨의 금융소득 중\n종합과세되는 금융소득금액을 계산하면 얼마인가?\n가. 국내 예금이자 10,000,000원\n나. 비상장 내국법인으로부터 받은 현금배당금 20,000,000원\n다. 외국법인으로부터 받은 현금배당금(원천징수되지 않음) 5,000,000원\n단. 배당소득 가산율은 10 % 이다.\n① 35,000,000원\n② 36,500,000원\n③ 36,650,000원\n④ 37,750,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 63, "text": "[63]다음은 2025년 김삼일씨의 상가임대 관련 소득 내역이다. 김삼일씨의 2025년 부동산임대 관련 사업소\n득의 총수입금액을 계산하면 얼마인가(단, 임대보증금은 없는 것으로 가정한다)?\n가. 임대기간 : 2025년 7월 1일 ~ 2027년 6월 30일\n나. 임대료 : 200,000,000원(2025년 7월 1일에 선불로 수령함)\n① 0원\n② 50,000,000원\n③ 100,000,000원\n④ 200,000,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 64, "text": "[64]다음 중 소득세법상 근로소득의 수입시기에 관한 설명으로 옳지 않은 것은?\n① 지급받지 못한 급여는 실제 대금수령일을 수입시기로 한다.\n② 잉여금 처분에 의한 상여의 경우 당해 법인의 잉여금 처분 결의일을 수입시기로 한다.\n③ 인정상여의 경우 근로를 제공한 날이 속하는 사업연도를 수입시기로 한다.\n④ 주식매수선택권 행사로 인한 근로소득은 주식매수선택권을 행사한 날을 수입시기로 한다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 65, "text": "[65]다음은 거주자 김삼일씨의 2025년 귀속 기타소득에 대한 자료이다. 김삼일씨가 기타소득에 대한 필요경\n비로 공제가능한 최대금액은 얼마인가(단, 제시된 소득은 사업소득이 아니며, 주어진 자료 외에는 고려\n하지 않음)?\n구 분 총수입금액 실제 필요경비\n계약의 위약으로 인하여 받는 위약금 중 주택입주지체상금 10,000,000원 7,000,000원\n신문에 기고한 원고에 대한 원작자로서 받는 대가 5,000,000원 3,000,000원\n산업재산권이 양도소득 3,000,000원 1,500,000원\n① 10,800,000원\n② 11,500,000원\n③ 11,800,000원\n④ 12,800,000원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 66, "text": "[66]거주자 김삼일씨의 2025년 소득자료가 다음과 같을 경우 2026년 5월말까지 신고해야 할 종합소득금액\n을 계산하면 얼마인가?\n가. 근로소득금액 40,000,000원\n나. 양도소득금액 20,000,000원\n다. 사업소득금액 15,000,000원\n라. 퇴직소득금액 50,000,000원\n마. 기타소득금액 6,000,000원\n① 61,000,000원\n② 111,000,000원\n③ 125,000,000원\n④ 131,000,000원", "answer": 1}, {"year": "2025", "month": "1", "qnum": 68, "text": "[68]다음 중 소득세법상 원천징수에 관한 설명으로 옳지 않은 것은?\n① 분리과세대상소득은 원천징수로써 납세의무가 종결된다.\n② 법인이 개인에게 소득을 지급하는 경우 법인세법에 따라 원천징수한다.\n③ 비영업대금의 이익의 경우 원천징수세율은 25 % 이다.\n④ 원천징수에 있어서 세금을 실제로 부담하는 납세의무자와 이를 실제 신고 납부하는 원천징수의무자\n는 서로 다르다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 69, "text": "[69]다음 중 양도소득세 과세대상자산으로 옳지 않은 것은?\n① 지상권\n② 과점주주가 보유하는 부동산과다보유법인 주식\n③ 부동산을 취득할 수 있는 권리\n④ 전환사채", "answer": 4}, {"year": "2025", "month": "1", "qnum": 70, "text": "[70]다음 중 개인의 소득세 신고에 관한 내용으로 옳지 않은 것은(단, 소득세법상 원천징수대상은 모두 적\n법하게 원천징수되었다고 가정한다)?\n① 내국법인의 부장으로 근무하는 김삼일씨가 근로소득 총수입금액 1억원 외의 다른 소득이 없는 경우\n종합소득세 확정신고를 안 해도 된다.\n② 국내은행에서 발생하는 정기예금이자 1,500만원 외의 다른 소득이 없는 거주자 김철수 할아버지는\n종합소득세 확정신고를 안 해도 된다.\n③ 사업장 현황신고는 부가가치세 면세사업자의 총수입금액을 파악하기 위한 제도로써 다음연도 2월\n10일까지 자진신고하여야 한다.\n④ 종합소득이 있는 거주자로서 중간예납을 하여야 할 자는 중간예납기간에 대한 중간예납세액을 매년\n10월 30일까지 납부해야 한다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 61, "text": "[61]다음 중 필요경비 공제가 인정되지 않는 소득으로만 이루어진 것은?\n① 이자소득, 배당소득\n② 이자소득, 기타소득\n③ 배당소득, 사업소득\n④ 사업소득, 기타소득", "answer": 1}, {"year": "2025", "month": "3", "qnum": 62, "text": "[62]다음 중 소득세법상 이자소득에 관한 설명으로 옳지 않은 것은?\n① 보험기간이 10년 미만인 저축성보험의 보험차익은 이자소득으로 과세한다.\n② 이자소득을 발생시키는 거래 ․ 행위와 파생상품이 결합된 경우 해당 파생상품의 거래 ․ 행위로부터의\n이익은 이자소득으로 과세한다.\n③ 자금대여를 영업으로 하는 자가 금전을 대여하여 얻은 이익은 이자소득으로 과세한다.\n④ 동일 직장이나 동일 직종에 종사하는 근로자로 구성된 공제조합 또는 공제회로부터 받는 공제회 반\n환금 중 납입원금을 초과하는 금액은 이자소득으로 과세한다(단, 1999년 1월 1일 이후 최초로 직\n장공제회에 가입하고 탈퇴 또는 퇴직으로 인하여 받는 반환금임).", "answer": 3}, {"year": "2025", "month": "3", "qnum": 63, "text": "[63]다음 자료로 개인사업자 김삼일씨(복식부기의무자 아님)의 2025년 사업소득금액을 계산하면 얼마인가?\n가. 손익계산서상 당기순이익 100,000,000원\n나. 손익계산서에는 다음의 수익과 비용이 포함되어 있다\n- 대표자에 대한 급여 10,000,000원\n- 회계부장인 배우자의 급여 5,000,000원\n- 배당금 수익 1,000,000원\n- 세금과공과 중 벌금 2,000,000원\n① 100,000,000원\n② 110,000,000원\n③ 111,000,000원\n④ 116,000,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 64, "text": "[64]거주자 김삼일씨는 ㈜삼일에서 영업부 부장으로 재직하던 중 2025년 6월 30일에 퇴사하였다. 다음 자\n료는 2025년 1월 1일부터 2025년 6월 30일까지 ㈜삼일로부터 지급받은 금액 또는 이익이다. 김삼일\n씨의 2025년 과세대상 총급여액으로 옳은 것은?\n가. 급여 30,000,000원 (월 5,000,000원)\n나. 식사대 2,400,000원(월 40만원 상당의 식사대를 제공받음)\n다. 차량유지비 2,400,000원(소유차량을 이용하여 업무를 수행하였으며, 실제 여비를 받는 대신에\n㈜삼일의 사규에 따라 매월 40만원씩 지급받음)\n라. 건강보험료 1,500,000원(국민건강보험법에 따라 사용자부담 국민건강보험료)\n마. ㈜삼일로부터 법인세법상 상여로 처분된 금액 3,000,000원\n① 31,200,000원\n② 34,200,000원\n③ 35,400,000원\n④ 36,900,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 65, "text": "[65]다음 중 연금소득에 관한 설명으로 옳지 않은 것은?\n① 개인이 가입한 연금계좌에서 연금수령한 사적연금소득도 연금소득으로 과세된다.\n② 산업재해보상법에 따라 받는 각종 연금은 비과세연금소득이다.\n③ 공적연금소득은 무조건 종합과세대상이다.\n④ 사적연금소득의 수입시기는 연금을 지급받기로 한 날이다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 66, "text": "[66]다음 중 소득세법상 결손금 및 이월결손금에 관한 설명으로 옳지 않은 것은?\n① 해당 과세기간의 소득금액을 추계신고하는 경우에는 이월결손금 공제규정을 적용하지 않는다.\n② 2020년 1월 1일 이후 발생한 결손금은 발생연도 종료일로부터 15년 이내에 끝나는 과세기간의 소\n득금액을 계산할 때 먼저 발생한 과세기간의 이월결손금부터 순서대로 공제한다.\n③ 사업소득에서 발생한 결손금은 연금소득금액, 기타소득금액, 이자소득금액, 배당소득금액, 근로소득\n금액 순서로 공제하고, 남은 결손금은 다음연도로 이월시킨다.\n④ 부동산임대업(주거용 건물 임대업 제외)에서 발생한 결손금은 다른 소득금액과 통산하지 않고 다음\n연도로 이월시킨다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 67, "text": "[67]다음은 근로소득자(일용근로자 아님)인 김삼일씨가 자녀들을 위하여 지출한 교육비와 관련한 자료이다.\n연말정산시 교육비 세액공제 금액은 모두 얼마인가(단, 소득세 또는 증여세가 비과세되는 소득으로 지\n출한 교육비는 없는 것으로 가정한다)?\n가. 자녀의 연령 및 소득\n- 장남 : 29세, 대학원생, 소득금액 없음\n- 차남 : 23세, 대학생, 사업소득금액 1,000,000원\n- 장녀 : 15세, 중학생, 소득금액 없음\n나. 자녀의 교육비 지출액\n- 장남의 대학원 수업료 : 12,000,000원\n- 차남의 대학교 수업료 : 12,000,000원\n- 장녀의 중학교 수업료 : 6,000,000원\n- 장녀의 체험학습비 : 300,000원\n① 450,000원\n② 495,000원\n③ 1,800,000원\n④ 3,150,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 68, "text": "[68]다음 중 퇴직소득에 관한 설명으로 옳지 않은 것은?\n① 법인의 상근임원이 비상근임원이 될 때 퇴직급여를 지급받은 경우는 현실적인 퇴직으로 본다.\n② 과세이연된 퇴직소득금액을 연금외수령한 경우 퇴직소득에 해당한다.\n③ 퇴직소득공제는 근속연수에 따른 공제액과 환산급여에 따른 공제액을 합계한 금액이다.\n④ 사용자부담금을 기초로 하여 비현실적인 퇴직을 원인으로 지급받는 소득은 퇴직소득으로 과세된다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 69, "text": "[69]거주자 김삼일씨는 6년 간 보유한 토지(등기된 사업용 토지)를 양도하였다. 다음 자료에 의해 양도소득\n세 과세표준을 계산하면 얼마인가(단, 동 토지의 실지양도비용은 3,000,000원이고, 장기보유특별공제율\n은 12 % 이다)?\n구분 실지거래가액 기준시가\n양도가액 150,000,000원 80,000,000원\n취득가액 50,000,000원 30,000,000원\n① 38,860,000원\n② 41,360,000원\n③ 82,860,000원\n④ 85,360,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 70, "text": "[70]다음 중 종합소득 과세표준 확정신고 의무자는 누구인가(단, 제시된 소득에 대한 원천징수(연말정산 포\n함)는 적법하게 되었다)?\n① 공적연금소득과 퇴직소득만 있는 자\n② 근로소득과 퇴직소득만 있는 자\n③ 퇴직소득과 연말정산대상인 사업소득만 있는 자\n④ 연말정산대상인 사업소득과 근로소득만 있는 자", "answer": 4}, {"year": "2025", "month": "5", "qnum": 45, "text": "[45]다음 중 법인세법상 과세소득의 범위에 관한 설명으로 옳지 않은 것은?\n① 영리내국법인이 해산(합병이나 분할에 의한 해산 제외)한 경우 그 영리내국법인은 그 청산소득에 대\n한 법인세의 납세의무를 진다.\n② 외국법인도 토지 등 양도소득에 대하여 법인세 납세의무가 있다.\n③ 영리내국법인 중 공시대상기업집단에 속하는 법인은 미환류소득에 대한 법인세의 납세의무가 있다.\n④ 비영리내국법인은 수익사업소득에 대한 법인세 납세의무가 있다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 61, "text": "[61]다음 중 소득세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 소득세법은 원칙적으로 포괄주의에 의해 과세소득을 규정하고 있으며 과세대상으로 열거되지 않은\n것도 과세할 수 있다.\n② 퇴직소득과 양도소득은 다른 소득과 합산하지 않고 별도로 과세한다.\n③ 소득세법은 개인단위과세제도를 원칙으로 하되, 예외적으로 거주자 1인과 그의 특수관계인이 공동\n사업자에 포함되어 있는 경우로서 손익분배비율을 거짓으로 정하는 등 법 소정 사유가 있는 경우에\n는 합산과세한다.\n④ 소득세법은 과세표준의 증가에 따라 세율이 증가하는 누진과세를 채택하고 있다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 62, "text": "[62]다음은 거주자 김삼일 씨의 2025년 귀속 금융소득(이자소득과 배당소득)과 관련된 자료이다. 김삼일 씨\n의 금융소득 중 종합과세되는 금융소득금액을 계산하면 얼마인가?\nㄱ. 국내 예금이자 15,000,000원\nㄴ. 비상장 내국법인으로부터 받은 현금배당금 15,000,000원\nㄷ. 외국법인으로부터 받은 현금배당금 10,000,000원\n(원천징수되지 않음)\n단, 배당소득 가산율은 10 % 이다.\n① 39,000,000원\n② 40,000,000원\n③ 41,000,000원\n④ 41,500,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 63, "text": "[63]다음은 2025년 김삼일 씨의 상가임대 관련 소득 내역이다. 김삼일 씨의 2025년 부동산임대 관련 사업\n소득의 총수입금액을 계산하면 얼마인가(단, 임대보증금은 없는 것으로 가정한다)?\nㄱ. 임대기간 : 2025년 8월 1일 ~ 2027년 7월 31일\nㄴ. 임 대 료 : 24,000,000원(2025년 7월 1일에 선불로 수령함)\n① 5,000,000원\n② 6,000,000원\n③ 12,000,000원\n④ 24,000,000원", "answer": 1}, {"year": "2025", "month": "5", "qnum": 64, "text": "[64]다음 중 소득세가 과세되는 근로소득은?\n① 고용보험법에 따라 받는 실업급여\n② 월 20만원의 6세 이하 자녀에 대한 보육비\n③ 법인의 주주총회의 결의에 따라 받는 소득\n④ 월정액급여 210만원인 생산직근로자(직전 과세기간 총급여는 2,500만원)가 1년간 받은\n연장 근로수당 240만원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 65, "text": "[65]다음은 거주자 김삼일 씨의 2025년 기타소득금액에 대한 자료이다. 김삼일 씨의 종합과세할 기타소득금\n액은 얼마인가(단, 기타소득의 실제 필요경비는 확인되지 아니한다)?\n일시적인 문예창작소득 8,000,000원\n주택입주지체상금 6,000,000원\n가상자산 양도소득 10,000,000원\n① 4,400,000원\n② 4,800,000원\n③ 6,400,000원\n④ 6,800,000원", "answer": 1}, {"year": "2025", "month": "5", "qnum": 66, "text": "[66]다음은 거주자 김삼일(남자) 씨의 2025년 부양가족 현황이다. 김삼일 씨가 적용받을 수 있는 인적공제\n(기본공제와 추가공제)의 합계는 얼마인가?\n<부양가족 현황>\n부양가족 연령 소득종류 및 금액\n김삼일 55세 종합소득금액 5,000만원\n배우자 50세 소득 없음\n모친 81세 소득 없음\n장남 20세 사업소득금액 100만원\n차남(장애인) 18세 소득 없음\n① 700만원\n② 800만원\n③ 900만원\n④ 1,050만원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 67, "text": "[67]다음의 세액공제 중 개인과 법인 모두에게 적용될 수 있는 것은?\n① 근로소득세액공제\n② 기장세액공제\n③ 외국납부세액공제\n④ 의료비세액공제", "answer": 3}, {"year": "2025", "month": "5", "qnum": 68, "text": "[68]다음 중 소득세법상 퇴직소득에 관한 설명으로 옳지 않은 것은?\n① 종업원이 임원이 된 경우에 퇴직급여를 실제로 지급받지 않은 경우에도 퇴직으로 본다.\n② 사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받는 소득은 퇴직소득에 해당한다.\n③ 퇴직일 현재 연금계좌에 있거나 퇴직소득을 연금계좌로 지급하는 경우 해당 퇴직소득에 대한\n소득세는 연금외수령하기 전까지 원천징수하지 아니한다.\n④ 국민연금법에 따라 받는 일시금은 퇴직소득으로 본다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 69, "text": "[69]다음 중 소득세법상 양도소득에 관한 설명으로 옳지 않은 것은?\n① 기계장치와 함께 양도한 영업권의 양도소득은 양도소득세 과세대상이다.\n② 신탁의 이익을 받을 권리(금전신탁수익증권 등 대통령령으로 정하는 수익권은 제외)의 양도로 발생\n하는 소득은 양도소득세 과세대상이다.\n③ 특정시설물이용권의 양도소득은 양도소득세 과세대상이다.\n④ 부동산의 취득시기가 도래하기 전에 해당 부동산을 취득할 수 있는 권리의 양도소득은 양도소득세\n과세대상이다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 70, "text": "[70]다음 중 반드시 종합소득 과세표준 확정신고를 해야 하는 자는 누구인가(단, 제시된 소득은 소득세법에\n따라 원천징수되었다고 가정한다)?\n① 일용근로소득 6,000,000원 외에 다른 소득이 없는 유인나 씨\n② ㈜서울에 근무하다가 당기에 퇴직하여 퇴직금을 수령하였고 아직까지 취직을 하지 못하고 있는 한미\n진 씨\n③ 10억원의 정기예금에서 연 3,000만원의 이자를 수령하고 해당 이자소득 외에는 소득이 없는 오유나\n씨\n④ ㈜삼일에 재직 중인 비상근 임원으로서 로또복권 당첨금 1억원을 받은 한소희 씨", "answer": 3}, {"year": "2025", "month": "6", "qnum": 61, "text": "[61]다음 중 소득세법에 관한 설명으로 옳지 않은 것은?\n① 비거주자인 경우 국내원천소득에 대해서만 소득세를 과세한다.\n② 일용근로자의 근로소득은 원천징수로 납세의무를 종결한다.\n③ 사업자가 해당 과세기간 중에 폐업한 경우에도 1월 1일부터 12월 31일까지를 과세기간으로 한다.\n④ 소득세는 부과납세제도를 채택하고 있으므로 납세의무자의 확정신고로 과세표준과 세액이 확정되지\n아니한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 62, "text": "[62]다음은 김삼일 씨의 2025년 귀속 금융소득의 내역이다. 다음의 자료를 이용하여 거주자 김삼일 씨의 소\n득 중 종합과세대상인 금융소득금액을 계산하면 얼마인가(단, 배당소득가산율은 10 % 이다)?\nㄱ. 비영업대금의 이익 4,000,000원\nㄴ. 외국은행으로부터 수령한 정기예금이자 3,000,000원\nㄷ. 비실명이자 소득금액 5,000,000원\nㄹ. 상장법인 현금배당 25,000,000원\n① 32,000,000원\n② 33,200,000원\n③ 38,200,000원\n④ 38,700,000원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 63, "text": "[63]다음 자료를 이용하여 개인사업자 김삼일 씨(복식부기의무자임)의 2025년 사업소득금액을 계산하면 얼\n마인가?\nㄱ. 손익계산서상 당기순이익 100,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 본인에 대한 급여 5,000,000원\n- 사업자금의 예치로 인한 정기적금이자 3,000,000원\n- 기계장치(유형자산)의 처분손실 4,000,000원\n- 토지의 처분손실 1,000,000원\n① 96,000,000원\n② 98,000,000원\n③ 101,000,000원\n④ 103,000,000원", "answer": 4}, {"year": "2025", "month": "6", "qnum": 64, "text": "[64]다음 자료에 의하여 거주자 김삼일 씨의 2025년 근로소득금액을 계산하면 얼마인가?\nㄱ. 급여：월 4,000,000원\nㄴ. 상여：연 8,000,000원\nㄷ. 실비변상적 성격의 자가운전보조금：월 200,000원\nㄹ. 중식대：월 200,000원(중식대 외에 월 30만원 상당의 중식을 별도로 제공받음)\nㅁ. 보육급여(5세인 자녀 있음)：월 200,000원\n* 김삼일씨는 당해 1년 동안 계속 근무하였다.\n연간급여액 근로소득공제액\n1,500만원 초과 4,500만원 이하 750만원 ＋ 1,500만원 초과액×15 %\n4,500만원 초과 1억원 이하 1,200만원 ＋ 4,500만원 초과액×5 %\n① 42,240,000원\n② 43,450,000원\n③ 45,730,000원\n④ 48,010,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 65, "text": "[65]다음 중 소득세법상 기타소득에 관한 설명으로 옳지 않은 것은?\n① 복권당첨소득은 기타소득으로 분류되며 무조건 3억원까지는 분리과세되나 3억원 초과분은 종합과세\n된다.\n② 법인세법에 따라 처분된 기타소득의 수입시기는 그 법인의 해당 사업연도의 결산확정일이다.\n③ 산업재산권을 양도하고 그 대가로 받는 금품은 실제필요경비와 총수입금액의 60 % 중 큰 금액을 필\n요경비로 인정받을 수 있다.\n④ 주택입주지체상금은 기타소득으로 분류되며 증빙이 없더라도 총수입금액의 80 % 를 필요경비 인정률\n로 적용받을 수 있다.", "answer": 1}, {"year": "2025", "month": "6", "qnum": 66, "text": "[66]다음은 거주자 김삼일 씨의 2025년 부양가족 현황이다. 김삼일 씨가 적용받을 수 있는 인적공제의 합계\n는 얼마인가(단, 배우자를 제외한 가족에 대한 인적공제는 모두 김삼일 씨가 공제 받는 것으로 한다)?\n가족 연령 소득현황 비고\n김삼일 72세 총급여액 60,000,000원\n배우자 70세 사업소득금액 5,000,000원\n장남 30세 장애인\n입양자 19세\n① 6,000,000원\n② 7,000,000원\n③ 7,500,000원\n④ 9,000,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 67, "text": "[67]다음 중 소득세법상 의료비세액공제에 관한 설명으로 옳지 않은 것은?\n① 근로소득이 있는 거주자는 소득 및 연령조건을 미충족한 기본공제대상자의 의료비에 대해서도 의료\n비세액공제 적용이 가능하다.\n② 건강증진을 위한 의약품 구입비용도 공제대상 의료비에 해당한다.\n③ 모자보건법에 따른 산후조리원에 산후조리 및 요양의 대가로 지급하는 비용으로서 출산 1회당 200\n만원 이내의 금액도 의료비세액공제대상 의료비로 본다.\n④ 시력보정용 안경 또는 콘택트렌즈 구입을 위하여 지출한 비용으로서 기본공제대상자(나이 및 소득제\n한 없음) 1명당 50만원 이내의 금액은 공제대상 의료비에 해당한다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 68, "text": "[68]다음 중 소득세법상 원천징수에 관한 설명으로 옳지 않은 것은?\n① 원천징수를 하더라도 납세의무자 입장에서는 세금부담이 동일하다.\n② 원천징수는 징세비용절약과 징수사무의 간소화를 기한다.\n③ 원천징수는 조세수입의 조기확보와 정부재원조달의 평준화를 기한다.\n④ 예납적 원천징수에 해당하면 별도의 확정신고가 불필요하다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 69, "text": "[69]다음 중 양도소득세 과세대상은 몇 개인가?\nㄱ. 콘도회원권을 양도한 경우\nㄴ. 토지를 자녀에게 증여한 경우\nㄷ. 자산총액 중 토지와 건물의 합계액이 90 % 인 골프장을 직접 경영하는\n법인의 주식을 양도하는 경우\nㄹ. 부동산상의 권리와 함께 양도하는 영업권\n① 1개\n② 2개\n③ 3개\n④ 4개", "answer": 3}, {"year": "2025", "month": "6", "qnum": 70, "text": "[70]다음 중 소득세법상 신고납부에 관한 설명으로 옳지 않은 것은?\n① 토지를 양도한 거주자는 양도일이 속하는 달의 말일부터 2개월 이내에 양도소득과세표준 예정신고\n를 하여야 한다.\n② 근로소득과 퇴직소득만 있는 자인 경우 적법하게 원천징수된 경우에는 소득세 확정신고를 하지 아니\n할 수 있다.\n③ 공적연금소득만 있는 자는 적법하게 원천징수된 경우 종합소득과세표준 확정신고는 하지 아니할 수\n있다.\n④ 사업소득 또는 기타소득이 있는 자는 6개월간의 소득세를 미리 납부하는 중간예납제도 적용대상으\n로서, 11월 말까지 중간예납하여야 한다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 퇴직급여충당금조정명세서이다. 고문회계사인 홍길동 회계사가 퇴\n직급여충당금조정명세서를 검토한 결과, 퇴직급여 지급대상이 되는 임직원에게 지급한 총급여액의 정확\n한 금액은 100,000,000원이나 직원의 실수로 235,000,000원으로 기록되어 있음을 발견하였다. 다음의\n퇴직급여충당금조정명세서를 정확하게 작성할 경우 퇴직급여충당금 한도초과액은 얼마인가?\n사 업 2025. 1. 1. 법인명 ㈜삼일\n~ 퇴직급여충당금조정명세서\n연 도 2025. 12. 31. 사업자등록번호 123－45－12345\n1. 퇴직급여충당금 조정\n｢법인세법 ①퇴직급여 지급대상이 되는 임원 ③한도액\n②설정률 비 고\n시행령｣ 또는 사용인에게 지급한 총급여액 (①×②)\n제60조\n제1항에\n따른 235,000,000 5/100 11,750,000\n한도액\n｢법인세법 ④장부상\n⑤기중충 ⑥기초충당 ⑦기중 ⑧차감액 ⑨누적한도\n시행령｣\n충당금 ⑩한도액\n제60조 당 금 환 금부인누계 퇴직금 (④－⑤ 액(⑰ ＋퇴\n제2항 및 기 초 잔 (⑨－⑧)\n입액 액 지급액 －⑥－⑦) 직금전환금)\n제3항에 액\n따른\n한도액 40,000,000 － 5,000,000 30,000,000 5,000,000 45,000,000 40,000,000\n⑪ 한 도 액 ⑬ 한도초과액\n⑫ 회사계상액\n한도초과액 (③과 ⑩중 적은 금액) (⑫－⑪)\n계 산\n11,750,000 25,000,000 13,250,000\n① 한도초과액 없음\n② 13,250,000원\n③ 15,000,000원\n④ 20,000,000원", "answer": 4}, {"year": "2025", "month": "7", "qnum": 62, "text": "[62]다음 자료에 의하여 거주자 김삼일씨의 2025년 소득 중 종합과세할 금융소득금액을 계산하면 얼마인가\n(제시된 배당은 모두 Gross-up 대상이며, 배당소득 가산율은 10 % 이다)?\nㄱ. 현금배당 20,000,000원\nㄴ. 주식배당 30,000,000원\nㄷ. 은행예금이자 10,000,000원\nㄹ. 직장공제회 초과반환금 20,000,000원\n① 55,000,000원\n② 64,000,000원\n③ 84,000,000원\n④ 85,000,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 63, "text": "[63]3주택(소형주택 없음)을 보유한 김삼일씨가 주택 2개를 다음과 같이 임대한 경우 추계결정시 간주임대\n료를 계산하면 얼마인가(단, 기획재정부령이 정하는 정기예금이자율은 3.1 % 이다)?\n구분 임대보증금 임대일수 임대보증금 적수\nA 주택 2억원 365일 730억원\nB 주택 2억원 146일 292억원\n① 744,000원\n② 1,240,000원\n③ 1,860,000원\n④ 3,100,000원", "answer": 1}, {"year": "2025", "month": "7", "qnum": 64, "text": "[64]다음 자료에 의하여 거주자 김삼일씨의 2025년 근로소득금액을 계산하면 얼마인가?\nㄱ. 월급여 : 2,000,000원(자녀보육수당, 중식대 제외)\nㄴ. 상여금 : 월급여의 400 %\nㄷ. 6세 이하 자녀 보육수당 : 월 150,000원\nㄹ. 중식대 : 월 200,000원(식사를 별도 제공받음)\nㅁ. 연월차수당 : 4,000,000원\nㅂ. 김삼일 씨는 당해 1년 동안 계속 근무하였다.\n연간급여액 근로소득공제액\n1,500만원 초과 4,500만원 이하 750만원 + 1,500만원 초과액 × 15 %\n4,500만원 초과 1억원 이하 1,200만원 + 4,500만원 초과액 × 5 %\n① 25,350,000원\n② 25,860,000원\n③ 27,390,000원\n④ 27,900,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 65, "text": "[65]다음은 거주자 김삼일씨의 2025년 귀속 기타소득에 대한 자료이다. 김삼일씨가 기타소득에 대한 필요경\n비로 공제가능한 최대금액은 얼마인가(단, 제시된 소득은 사업소득이 아니며, 주어진 자료 외에는 고려\n하지 않음)?\n실제 필요경비\n구 분 총수입금액\n필요경비 인정률\n계약의 위약으로 인하여 받는 위약금 중 주택입주\n6,000,000원 4,000,000원 80 %\n지체상금\n신문에 기고한 원고에 대한 원작자로서 받는 대가 10,000,000원 7,000,000원 60 %\n다수가 순위 경쟁하는 대회에서 입상자가 받는 상금 4,000,000원 1,000,000원 80 %\n① 12,000,000원\n② 12,800,000원\n③ 13,400,000원\n④ 15,000,000원", "answer": 4}, {"year": "2025", "month": "7", "qnum": 66, "text": "[66]거주자인 김삼일씨의 2025년 소득자료는 다음과 같다. 이에 의하여 2026년 5월말까지 신고해야 할 종\n합소득금액을 계산하면 얼마인가(단, 제시된 소득 중 분리과세대상은 없다)?\nㄱ. 근로소득금액 35,000,000원\nㄴ. 양도소득금액 10,000,000원\nㄷ. 사업소득금액 15,000,000원\nㄹ. 퇴직소득금액 20,000,000원\nㅁ. 기타소득금액 6,000,000원\n① 50,000,000원\n② 56,000,000원\n③ 60,000,000원\n④ 66,000,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 67, "text": "[67]다음 중 소득세법상 세액공제에 관한 설명으로 옳지 않은 것은?\n① 거주자의 종합소득금액에 Gross-up된 배당소득금액이 합산된 경우에는 당해 배당소득에 가산된 금\n액을 산출세액에서 공제한다.\n② 복식부기의무자는 복식부기로 기장한 경우에도 기장세액공제를 적용받을 수 없다.\n③ 종합소득이 있는 거주자의 경우 셋째 출생∙입양시 70만원을 세액공제하나, 넷째부터는 세액공제금\n액이 없다.\n④ 거주자의 종합소득에 국외원천소득이 포함되어 있는 경우 국외에서 납부한 세액이 있는 때에는 외국\n납부세액공제를 적용할 수 있다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 68, "text": "[68]다음 중 예납적 원천징수와 완납적 원천징수에 관한 비교내용으로 옳지 않은 것은?\n구 분 예납적 원천징수 완납적 원천징수\n① 납세의무 원천징수로 납세의무 종결되지 않음 원천징수로 납세의무 종결됨\n② 확정신고 확정신고 의무 있음 확정신고 의무 없음\n확정신고 시 정산하고 원천징수 세액을\n③ 조세부담 원천징수세액\n기납부세액으로 공제함\n④ 대상소득 분리과세 소득 분리과세 이외의 소득", "answer": 4}, {"year": "2025", "month": "7", "qnum": 69, "text": "[69]다음 중 소득세법상 양도소득에 관한 설명으로 옳지 않은 것은?\n① 기계장치와 함께 양도한 영업권의 양도소득은 양도소득세 과세대상이다.\n② 특정시설물이용권의 양도소득은 양도소득세 과세대상이다.\n③ 신탁의 이익을 받을 권리(금전신탁수익증권, 투자신탁 수익권의 그 양도로 발생하는 소득이 배당소\n득으로 과세되는 경우 제외)의 양도로 발생하는 소득은 양도소득세 과세대상이다.\n④ 부동산의 취득시기가 도래하기 전에 해당 부동산을 취득할 수 있는 권리의 양도소득은 양도소득세\n과세대상이다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 70, "text": "[70]다음 중 소득세법상 신고납부와 관련된 설명으로 옳지 않은 것은?\n① 성실신고확인대상사업자가 성실신고확인서를 제출하는 경우에는 종합소득과세표준 확정신고를 그 과\n세기간의 다음 연도 5월 1일부터 6월 30일까지 하여야 한다.\n② 중간예납세액이 50만원 미만일 경우 중간예납세액을 징수하지 아니한다.\n③ 공적연금소득과 퇴직소득만 있는 자는 해당 과세기간의 다음 연도 5월 1일부터 5월31일까지 종합\n소득세 확정신고를 해야 한다.\n④ 근로소득만이 있는 자는 연말정산으로 모든 납세절차가 종결되기 때문에 확정신고는 원칙적으로 하\n지 않아도 된다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 61, "text": "[61]다음 중 소득세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 소득세법은 원칙적으로 열거주의에 의해 과세대상소득을 규정하고 있으며 예외적으로 이자 및 배당\n소득에 한하여 유형별 포괄주의를 채택하고 있다.\n② 퇴직소득과 양도소득은 다른 소득과 합산하지 않고 별도로 과세한다.\n③ 소득세법은 개인단위과세제도를 원칙으로 하되, 예외적으로 가족이 공동으로 사업을 경영하는 경우\n에는 무조건 합산과세한다.\n④ 소득세법은 과세표준의 증가에 따라 세율이 증가하는 누진과세를 채택하고 있다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 62, "text": "[62]다음 자료를 참고하여 총급여 45,000,000원인 거주자 김철수씨의 종합과세되는 배당소득금액을 계산하\n면 얼마인가(단, 제시된 소득 외의 금융소득은 없다)?\n1. 2025년에 수령한 배당금 내역은 다음과 같다.\n(1) 주권상장법인으로부터의 배당(금전배당) 20,000,000원\n(2) 비상장법인으로부터의 배당(주식배당) 40,000,000원\n(3) A법인의 주식발행초과금의 자본전입으로 수령한 무상주 30,000,000원\n2. 배당소득 가산율은 10 % 이다.\n① 60,000,000원\n② 64,000,000원\n③ 90,000,000원\n④ 97,000,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 64, "text": "[64]다음 중 소득세법상 근로소득의 수입시기에 관한 설명으로 옳지 않은 것은?\n① 잉여금처분에 의한 상여의 경우 당해 법인의 잉여금처분 결의일을 수입시기로 한다.\n② 인정상여의 경우 근로를 제공한 날이 속하는 사업연도를 수입시기로 한다.\n③ 급여의 경우 근로를 제공한 날을 수입시기로 한다.\n④ 지급받지 못한 급여는 실제 대금 수령일을 수입시기로 한다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 65, "text": "[65]다음은 거주자 김삼일 씨의 2025년 기타소득금액에 대한 자료이다. 김삼일 씨의 종합과세할 기타소득금\n액은 얼마인가(단, 기타소득의 실제 필요경비는 확인되지 아니한다)?\n주택입주지체상금 6,000,000원\n복권당첨소득 3,000,000원\n일시적인 문예창작소득 12,000,000 원\n① 6,000,000원\n② 7,200,000원\n③ 8,100,000원\n④ 18,000,000원", "answer": 1}, {"year": "2025", "month": "9", "qnum": 66, "text": "[66]다음 자료는 거주자 김삼일씨의 2025년 소득금액이다. 종합소득산출세액을 계산하면 얼마인가(단, 모든\n소득은 국내에서 발생한 것이다)?\nㄱ. 근로소득금액 80,000,000원\nㄴ. 부동산임대사업소득금액(상가임대소득) 20,000,000원\nㄷ. 기타소득금액(분리과세 대상이 아님) 40,000,000원\nㄹ. 종합소득공제 10,000,000원\nㅁ. 부동산임대사업 이월결손금(2024년 상가임대사업에서 발생) 50,000,000원\n<종합소득세율>\n종합소득 과세표준 세율\n5,000만원 초과 8,800만원 이하 624만원 + 5,000만원 초과분의 24 %\n8,800만원 초과 1억 5천만원 이하 1,536만원 + 8,800만원 초과분의 35 %\n① 13,440,000원\n② 23,060,000원\n③ 26,560,000원\n④ 30,060,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 67, "text": "[67]근로소득자인 홍길동씨는 2025년 다음과 같이 보험료를 납부하였다. 홍길동씨의 2025년 연말정산시 보\n험료세액공제 대상금액은 얼마인가?\nㄱ. 고용보험료 총부담금 2,000,000원(회사부담 1,000,000원 포함)\nㄴ. 국민건강보험료 총부담금 800,000원(회사부담 400,000원 포함)\nㄷ. 자동차 보험료 납부액 600,000원\nㄹ. 보장성 정기보험료 납부액 1,000,000원(기본공제대상자인 장애인을 피보험자로 하는\n장애인전용 보장성보험료 500,000원 포함)\n① 1,000,000원\n② 1,500,000원\n③ 2,400,000원\n④ 2,900,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 68, "text": "[68]다음 중 소득세법상 원천징수에 관한 설명으로 옳지 않은 것은?\n① 분리과세대상소득은 원천징수로써 납세의무가 종결된다.\n② 원천징수에 있어서 세금을 실제로 부담하는 납세의무자와 이를 실제 신고·납부하는 원천징수의무자\n는 서로 다르다.\n③ 비영업대금의 이익의 경우 원천징수세율은 14 % 이다.\n④ 법인이 개인에게 소득을 지급하는 경우 소득세법에 따라 원천징수한다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 69, "text": "[69]다음 중 소득세법상 양도소득에 관한 설명으로 옳지 않은 것은?\n① 비상장주식의 양도소득은 원칙적으로 양도소득세 과세대상이다.\n② 대주주의 상장법인 주식의 양도소득은 양도소득세 과세대상이다.\n③ 토지에 대해서 법원의 확정판결에 의하여 신탁해지를 원인으로 하는 소유권이전등기를 하는 경우 양\n도소득세를 과세한다.\n④ 건물을 무상이전하는 경우에는 양도소득세를 과세하지 아니한다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 70, "text": "[70]다음 중 소득세법상 중간예납에 관한 설명으로 옳지 않은 것은?\n① 해당 과세기간 중에 신규로 사업을 시작한 자는 중간예납의무가 없다.\n② 소득세 중간예납대상자는 종합소득이 있는 거주자 중 사업소득이 있는 자이다.\n③ 중간예납이란 매년 1월 1일부터 6월 30일까지의 기간동안의 소득에 대해 소득세를 납부하는 것이\n며, 납부기한은 8월 31일이다.\n④ 중간예납세액이 50만원 미만일 경우 중간예납세액을 징수하지 아니한다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 61, "text": "[61]다음 중 소득세의 특징에 관한 설명으로 옳지 않은 것은?\n① 현행 소득세법상 분류과세소득으로는 퇴직소득과 금융투자소득이 있다.\n② 소득세법은 개인별 소득을 기준으로 과세하는 개인단위과세제도를 원칙으로 한다.\n③ 소득세법은 열거주의에 의하여 과세대상 소득을 규정하고 있으나 이자소득과 배당소득은 유형별 포\n괄주의를 채택하고 있다.\n④ 소득세는 신고납세주의를 채택하고 있으므로 납세의무자의 확정신고로 과세표준과 세액이 확정된다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 62, "text": "[62]다음의 자료를 이용하여 거주자 김삼일씨의 소득 중 종합과세할 금융소득금액을 계산하면 얼마인가(단,\n상장법인 현금배당은 Gross-up 대상이며, 배당가산율은 10 % 이다)?\nㄱ. 국내은행으로부터 수령한 정기예금이자 5,000,000원\nㄴ. 외국은행으로부터 수령한 정기예금이자 7,000,000원\nㄷ. 비실명이자 소득금액 6,000,000원\nㄹ. 상장법인 현금배당 20,000,000원\n① 32,000,000원\n② 33,200,000원\n③ 39,600,000원\n④ 40,200,000원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 63, "text": "[63]다음 자료를 이용하여 개인사업자 김삼일씨(복식부기의무자임)의 2025년 사업소득금액을 계산하면 얼마\n인가?\nㄱ. 손익계산서상 당기순이익 100,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 대표자 급여 15,000,000원\n- 사업자금의 대여로 인한 비영업대금의 이익 8,000,000원\n- 비품(유형자산)의 처분이익 7,000,000원\n- 건물의 처분이익 4,000,000원\n① 98,000,000원\n② 100,000,000원\n③ 101,000,000원\n④ 103,000,000원", "answer": 4}, {"year": "2025", "month": "11", "qnum": 64, "text": "[64]다음은 거주자 김여진 과장(지배주주 등에 해당하지 않음)이 ㈜경기에서 2025년 1월 1일부터 2025년\n12월 31일까지 지급받은 금액 또는 이익이다. 김여진 과장의 2025년 과세대상 근로소득은 얼마인가?\n구 분 금액(이익) 비 고\n(1) 급여 60,000,000원 월 5,000,000원\n(2) 식사 3,000,000원 월 25만원 상당의 식사를 제공받음\n(3) 식사대 1,200,000원 월 100,000원\n소유차량을 이용하여 업무를 수행하였으며, 실제\n(4) 차량유지비 1,800,000원 여비를 받는 대신에 ㈜경기의 사규에 따라 월 15\n만원씩 지급받음\n(5) 건강보험료 1,500,000원 국민건강보험법에 의한 사용자부담 국민건강보험료\n(6) 단체순수보장성보험의\n700,000원 ㈜경기가 부담한 단체순수보장성보험의 보험료\n보험료\n2025년 3월에 장녀 출산으로 받은 출산지원금\n(7) 기업출산지원금 10,000,000원\n(1회 지급)\n① 61,200,000원\n② 70,000,000원\n③ 71,200,000원\n④ 73,000,000원", "answer": 1}, {"year": "2025", "month": "11", "qnum": 65, "text": "[65]다음 중 소득세법상 기타소득에 해당하는 것을 모두 고르면?\nㄱ. 고용관계 없이 다수인에게 강연을 하고 받은 대가\nㄴ. 뇌물·알선수재·배임수재에 의하여 받은 금품\nㄷ. 법인세법상 기타소득으로 처분된 소득\nㄹ. 고용보험법에 따라 받는 실업급여\n① ㄱ, ㄴ, ㄷ, ㄹ\n② ㄱ, ㄷ, ㄹ\n③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ", "answer": 3}, {"year": "2025", "month": "11", "qnum": 66, "text": "[66]다음은 거주자 김삼일씨의 2025년 부양가족 현황이다. 김삼일씨가 소득공제로 적용받을 수 있는 인적공\n제(기본공제와 추가공제)의 합계를 계산하면 얼마인가(단, 제시된 자료 외 다른 사항은 고려하지 않는\n다)?\n가족구성원 연령 소득종류 및 금액\n김삼일(남성) 42세 종합소득금액 5,000만원\n배우자 40세 총급여 600만원\n부친 72세 사업소득금액 120만원\n모친(장애인) 70세 소득 없음\n딸 10세 소득 없음\n아들 8세 소득 없음\n① 750만원\n② 900만원\n③ 1,050만원\n④ 1,150만원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 67, "text": "[67]다음의 자료를 이용하여 근로소득자 김삼일 씨(35세)의 2025년 의료비세액공제액을 계산하면 얼마인가\n(단, 김삼일 씨의 2025년 총급여액은 5,000만원이다)?\n의료비 지출내역 금액\n모자보건법에 따른 미숙아를 위한 의료비 300만원\n사업소득금액 2,000만원이 있는 배우자(32세)의 질병치료비 130만원\n70세인 아버지의 국내병원 치료비 80만원\n본인의 목디스크 치료비 200만원\n① 69만원\n② 80만원\n③ 99만원\n④ 105만원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 68, "text": "[68]㈜삼일은 2025년 11월 5일 사업소득자 최영희씨의 사업소득 1,000,000원에 대해 소득세로 3 % 세율을\n적용하여 30,000원을 원천징수한 경우 원천징수 신고·납부기한으로 옳은 것은?\n① 2025년 11월 25일\n② 2025년 11월 31일\n③ 2025년 12월 10일\n④ 2025년 12월 31일", "answer": 3}, {"year": "2025", "month": "11", "qnum": 69, "text": "[69]다음 중 양도소득세 과세대상자산으로 옳지 않은 것은?\n① 헬스클럽회원권\n② 과점주주가 보유하는 부동산과다보유법인 주식\n③ 골동품\n④ 사업에 사용하는 토지, 건물, 부동산에 관한 권리와 함께 양도하는 영업권", "answer": 3}, {"year": "2025", "month": "11", "qnum": 70, "text": "[70]다음 중 소득세법상 신고납부에 관한 설명으로 옳지 않은 것은?\n① 근로소득만이 있는 자는 연말정산으로 모든 납세절차가 종결되기 때문에 확정신고는 원칙적으로 하\n지 않아도 된다.\n② 중간예납세액이 100만원 미만일 경우 중간예납세액을 징수하지 아니한다.\n③ 사업소득이 있는 자가 중간예납대상이므로 모든 거주자가 중간예납대상인 것은 아니다.\n④ 성실신고확인대상사업자가 성실신고확인서를 제출하는 경우에는 종합소득과세표준 확정신고를 그 과\n세기간의 다음 연도 5월 1일부터 6월 30일까지 하여야 한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 62, "text": "[62]다음은 거주자 김삼일씨의 2025년 금융소득(이자소득과 배당소득) 자료이다. 김삼일씨의 금융소득 중\n종합과세되는 금융소득금액을 계산하면 얼마인가(단, 비상장 내국법인으로부터 받은 현금배당금은\nGross-up대상이며, 배당소득 가산율은 10 % 이다)?\nㄱ. 국내 예금이자 12,000,000원\nㄴ. 비상장 내국법인으로부터 받은 현금배당금 15,000,000원\nㄷ. 직장공제회 초과 반환금 3,000,000원\nㄹ. 외국법인으로부터 받은 현금배당금(원천징수되지 않음) 10,000,000원\nㅁ. 법원 보증금 이자 4,000,000원\n① 16,500,000원\n② 18,700,000원\n③ 38,500,000원\n④ 38,700,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 63, "text": "[63]다음 자료로 제조업을 영위하는 간편장부대상자인 개인사업자 김삼일씨의 2025년 사업소득금액을 계산\n하면 얼마인가?\nㄱ. 손익계산서상 당기순이익 100,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n- 본인에 대한 급여 30,000,000원\n- 영업부장으로 근무하는 딸의 급여 10,000,000원\n- 비상장주식 처분이익 3,000,000원\n- 기계장치처분이익(사업용유형자산에 해당함) 2,000,000원\n- 사업용 건물에 대한 재산세 4,000,000원\n① 116,000,000원\n② 118,000,000원\n③ 120,000,000원\n④ 125,000,000원", "answer": 4}, {"year": "2025", "month": "12", "qnum": 64, "text": "[64]다음은 중소기업인 ㈜삼일에서 영업사원으로 근무하던 거주자 김용산 씨의 근로소득 관련 자료이다. 김\n용산 씨의 2025년 귀속 근로소득금액은 얼마인가(단, 김용산 씨는 ㈜삼일의 지배주주 등에 해당하지 않\n으며, 주어진 자료 이외에는 고려하지 않는다)?\n(1) 근무기간 ： 2025년 1월 1일부터 2025년 10월 31일(퇴직일)까지 계속 근무하였음.\n(2) 급여내역\n구분 금액 비고\n기본급여총액 50,000,000원 기본급으로 월 5,000,000원 지급 받음.\n상여금 9,200,000원\n자가운전보조금 3,000,000원 월 300,000원(시내출장 등이 있을 시 김용산 씨 소유 차\n량을 업무에 이용하였고, 이에 소요된 실제 여비는 자가\n운전보조금을 받았음에도 불구하고 출장여비 규정에 의\n해 별도로 지급받았음)\n주택구입자금대여이익 4,000,000원 회사로부터 주택구입자금 1억원을 무이자로 대여받아\n얻은 이익\n(3) 근로소득공제액\n총급여액 근로소득공제액\n1,500만원 초과 4,5000만원 이하 750만원 ＋ 1,500만원을 초과하는 금액의 100분의 15\n4,500만원 초과 1억원 이하 1,200만원 ＋ 4,500만원을 초과하는 금액의 100분의 5\n① 45,600,000원\n② 46,940,000원\n③ 48,200,000원\n④ 49,340,000원", "answer": 4}, {"year": "2025", "month": "12", "qnum": 65, "text": "[65]다음은 음식점을 영위하는 거주자 김삼일씨의 2025년 소득금액이다. 아래 소득 이외에 다른 소득이 없\n는 경우 종합소득세 신고시 반드시 포함해야 할 소득은 무엇인가(단, 모든 소득은 국내에서 발생하였으\n며, 소득세법에 따라 적법하게 원천징수되었다)?\n① 은행예금에서 발생한 이자수익 20,000,000원\n② 음식점 운영수익 10,000,000원\n③ 가상자산 처분시 발생한 이익 30,000,000원\n④ 복권당첨소득 100,000,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 66, "text": "[66]다음 중 소득세법상 결손금 및 이월결손금 공제에 관한 설명으로 옳지 않은 것은?\n① 해당 과세기간의 소득금액을 추계신고 및 추계조사결정하는 경우에는 결손금과 이월결손금을 공제할\n수 없다.\n② 사업소득의 결손금은 소득세 법령에 따라 공제한다.\n③ 부동산임대업(주거용 건물임대업 제외)에서 발생한 결손금은 해당 과세기간의 다른 소득에서 공제할\n수 없다.\n④ 결손금은 발생한 과세기간 종료일부터 15년(2020년 1월 1일 전에 개시한 과세기간에 발생한 결손\n금은 10년) 내에 종료하는 과세기간의 소득금액 계산시 먼저 발생한 것부터 순차로 공제한다.", "answer": 1}, {"year": "2025", "month": "12", "qnum": 67, "text": "[67]다음은 거주자 김삼일씨의 자녀에 관한 자료이다. 해당 자료를 이용하여 김삼일씨가 2025년에 적용 가\n능한 자녀세액공제액은 얼마인가?\n< 자녀 현황 >\n자녀 연령(만) 소득종류 및 금액\n김금일 20세 소득 없음\n김금이 7세 소득 없음\n김금삼(2025년 출산) 0세 소득 없음\n① 900,000원\n② 950,000원\n③ 1,200,000원\n④ 1,300,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 68, "text": "[68]다음 중 예납적 원천징수와 완납적 원천징수에 관한 비교내용으로 옳지 않은 것은?\n구 분 예납적 원천징수 완납적 원천징수\n① 납세의무 원천징수로 납세의무 종결되지 않음 원천징수로 납세의무 종결\n② 대상소득 분리과세 이외의 소득 분리과세 소득\n③ 확정신고 확정신고 의무 있음 확정신고 의무 없음\n확정신고 시 정산하고 원천징수 세액을\n④ 조세부담 원천징수 세액\n기납부세액으로 공제함", "answer": 4}, {"year": "2025", "month": "12", "qnum": 69, "text": "[69]다음 중 소득세법상 양도소득에 관한 설명으로 옳지 않은 것은?\n① 건물을 유상 또는 무상으로 이전하는 경우에는 양도소득세를 과세한다.\n② 대주주의 상장법인 주식의 양도소득은 양도소득세 과세대상이다.\n③ 1세대 1주택으로 비과세대상인 경우에도 고가주택은 전액 비과세되지 아니한다.\n④ 비상장주식의 양도소득은 원칙적으로 양도소득세 과세대상이다.", "answer": 1}, {"year": "2025", "month": "12", "qnum": 70, "text": "[70]다음 중 소득세 과세표준 확정신고 의무자는 누구인가(단, 제시된 소득에 대한 원천징수(연말정산 포\n함)는 적법하게 하였다)?\n① 공적연금소득과 퇴직소득만 있는 자\n② 근로소득과 퇴직소득만 있는 자\n③ 연말정산대상인 공적연금소득과 근로소득만 있는 자\n④ 퇴직소득만 있는 자", "answer": 3}]}, "원가관리회계": {"01_원가의 기초개념과 배분": [{"year": "2024", "month": "1", "qnum": 81, "text": "[81]다음에서 설명하고 있는 원가를 원가행태에 따라 분류하고자 할 때 옳은 것은?\n조업도의 증감에 따라 총원가는 일정하나, 단위당 원가는 조업도의 증가(감소)에\n따라 감소(증가)하는 원가\n① 준고정원가\n② 준변동원가\n③ 고정원가\n④ 변동원가", "answer": 3}, {"year": "2024", "month": "1", "qnum": 82, "text": "[82]㈜삼일의 원가자료가 다음과 같을 때 기말제품재고액은 얼마인가?\n매출액 200,000원\n매출총이익률 40 %\n기초제품재고액 10,000원\n당기제조간접원가 32,000원\n기초재공품재고액 25,000원\n기말재공품재고액 16,000원\n직접재료원가는 기초원가의 50 % 이고, 직접노무원가는 가공원가의 60 % 이다.\n① 13,000원\n② 15,000원\n③ 21,000원\n④ 27,000원", "answer": 4}, {"year": "2024", "month": "1", "qnum": 83, "text": "[83]다음 중 보조부문원가를 제조부문에 배분하는 목적으로 옳지 않은 것은?\n① 보조부문원가를 제품원가에 포함시킴으로써 이익을 크게 보고하기 위하여\n② 제품 가격의 정당성을 확보하기 위하여\n③ 종업원에게 동기를 부여하는 한편, 성과평가의 기준으로 활용하기 위하여\n④ 외부보고 목적의 재무제표 작성을 위하여", "answer": 1}, {"year": "2024", "month": "1", "qnum": 84, "text": "[84]㈜삼일은 A와 B의 두 제조부문이 있으며, 제조과정에서 필요한 설비의 수선을 할 수 있는 수선부문을\n보조부문으로 두고 있다. 두 제조부문의 최대사용가능시간은 A가 6,000시간이고 B가 4,000시간이며,\n실제로 사용한 수선시간은 A, B 모두 4,000시간이고, 고정원가는 4,000,000원, 변동원가는 8,000,000\n원이다. 단일배부율법을 사용하는 경우에 이중배분율법을 사용하는 경우와 비교하여 제조부문A에 배부\n되는 수선부문원가는 얼마나 차이가 나는가?\n① 400,000원\n② 600,000원\n③ 800,000원\n④ 1,000,000원", "answer": 1}, {"year": "2024", "month": "1", "qnum": 86, "text": "[86]다음 자료를 읽고 문제에 답하시오.\nㄱ. ㈜삼일은 두 개의 제조부문(A, B)이 있다. 다음은 당기의 자료이다.\nA부문 B부문 합 계\n제조간접원가 400,000원 800,000원 1,200,000원\n직접기계시간 2,000시간 8,000시간 10,000시간\nㄴ. 당기 중 착수하여 완성된 #1C 작업의 원가자료는 다음과 같다.\nA부문 B부문 합 계\n직접재료원가 30,000원 20,000원 50,000원\n직접노무원가 20,000원 32,000원 52,000원\n직접기계시간 120시간 240시간 360시간\nㄷ. 회사는 직접기계시간을 기준으로 제조간접원가를 배부하고 있다.\n부문별 제조간접원가 배부율을 사용할 경우 #1C의 가공원가는 얼마인가?\n① 95,200원\n② 98,000원\n③ 100,000원\n④ 102,200원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 87, "text": "[87]㈜삼일은 일반형 전화기와 프리미엄 전화기 두 종류의 제품을 생산하고 있다. 4월 한 달 동안 생산한\n두 제품의 작업원가표는 아래와 같다.\n일반형 전화기 프리미엄 전화기\n직접재료 투입액 400,000원 500,000원\n직접노동시간 100시간 200시간\n직접노무원가 임률 1,000원/시간 2,000원/시간\n㈜삼일은 실제 발생한 제조간접원가를 실제조업도에 의해 배부하는 원가계산방식을 채택하고 있다. 동\n기간 동안 발생한 회사의 총제조간접원가는 2,000,000원이며, 제조간접원가를 직접노무원가 기준으로\n배부할 경우 4월 한 달 동안 생산한 일반형 전화기와 프리미엄 전화기의 총제조원가 차이는 얼마인가?\n① 400,000원\n② 1,600,000원\n③ 2,000,000원\n④ 2,300,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳은 것은?\n① 직접재료원가는 실제원가로 측정하지만 노무원가와 제조간접원가는 예정배부된 원가로 측정한다.\n② 특정 작업에 대한 예정배부액은 해당 작업의 실제조업도에 예정배부율을 곱하여 산정한다.\n③ 개별원가계산을 적용하는 기업의 경우 각 작업별로 실제원가에 기반한 기초원가를 계산한 이후에 제\n조간접원가에 대한 예정배부율을 결정한다.\n④ 실제 원가와 예정배부액 간에 차이가 발생하였다면 외부 보고용 재무제표를 작성하기 위한 조정이\n필요하며 이 때 부족배부액은 매출원가로, 초과배부액은 기타수익으로 각각 인식한다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 97, "text": "[97]다음 회계처리방법 중 변동원가계산제도에서 사용되는 것으로 옳은 것은?\n① 고정원가는 전부 기간비용으로 처리한다.\n② 매출액에서 변동제조원가와 고정제조원가를 차감하여 공헌이익을 계산한다.\n③ 손익계산서에는 변동원가만이 포함된다.\n④ 제품원가에는 변동제조원가와 변동판매비와관리비가 포함된다.", "answer": 1}, {"year": "2024", "month": "1", "qnum": 98, "text": "[98]다음은 ㈜삼일의 5월 전부원가계산과 변동원가계산에 의한 순이익을 비교한 자료이다.\n생 산 량 ? 판매량 600개\n판매단가 100원 고정판매관리비 12,000원\n고정제조원가 24,000원 단위당 변동판매관리비 15원\n단위당 변동제조원가 45원\n전부원가계산의 영업이익이 변동원가계산에 비해 8,000원 만큼 많다면 생산량은 몇 개인가(단, 월초재\n고는 없다고 가정한다)?\n① 800개\n② 900개\n③ 1,000개\n④ 1,100개", "answer": 2}, {"year": "2024", "month": "1", "qnum": 100, "text": "[100]변동원가계산에 의한 공헌이익 손익계산서 작성 자료가 아래와 같을 경우 공헌이익은 얼마인가?\n판매수량 3,500개\n단위당 판매가격 4,200원\n단위당 변동제조원가 2,300원\n단위당 변동판매비와관리비 300원\n고정제조간접원가 2,000,000원\n고정판매비와관리비 500,000원\n① 3,600,000원\n② 3,780,000원\n③ 5,600,000원\n④ 6,650,000원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 103, "text": "[103]다음 중 CVP분석의 기본가정으로 옳지 않은 것은?\n① 모든 원가는 변동원가와 고정원가로 분류할 수 있다.\n② 단위당 판매단가는 판매량의 변동과 관계없이 일정하다.\n③ 재고자산이 손익에 영향을 미치지 않는다.\n④ 복수제품의 경우 매출배합이 변동한다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 104, "text": "[104]㈜삼일은 변동원가율이 80 % 인 단일의 제품을 생산하여 판매하고 있다. ㈜삼일의 사업계획상 차년도에\n500,000,000 원의 매출액과 10,000,000 원의 영업이익이 예상된다고 할 때, 안전한계율을 계산하면 얼\n마인가?\n① 2 %\n② 5 %\n③ 10 %\n④ 12 %", "answer": 3}, {"year": "2024", "month": "1", "qnum": 105, "text": "[105]㈜삼일은 LED스탠드를 제조하는 회사이며 연간 생산능력은 80,000 단위이다. 최근 ㈜삼일은 판매가격\n30,000 원에 60,000 단위를 판매하였으며 제품의 원가구조는 다음과 같다.\n단위당 변동제조원가 11,000 원\n고정제조원가 300,000,000 원\n단위당 변동마케팅원가 3,000 원\n고정마케팅원가 100,000,000 원\n제조부서에서는 새로운 사양을 추가하기 위해 제조공정을 변화시킬 것을 제안하였다. 제조공정의 변화\n는 고정제조원가를 120,000,000 원 증가시키고 단위당 변동제조원가를 2,000 원 증가시키게 된다. 현재\n판매량인 60,000 단위를 기준으로 할 때, ㈜삼일이 제조공정의 변화 후에도 최소한 기존의 세전영업이\n익을 유지하기 위해서는 단위당 판매가격을 얼마로 해야 하는가?\n① 31,000원\n② 32,000원\n③ 33,000원\n④ 34,000원", "answer": 4}, {"year": "2024", "month": "1", "qnum": 119, "text": "[119]제품의 판매가격 결정은 기업 전체에 영향을 미치므로 경영진의 중요한 의사결정 사항 중 하나로 여겨\n지고 있다. 다음 중 가격 결정에 영향을 미치는 요소들에 관한 설명으로 옳은 것은?\n① 고객 관점을 고려했을 때 제품 가격의 인하는 항상 수요의 증가를 수반한다.\n② 기업 자신의 원가는 가격 절정에 영향을 미치는 주요 요소이나, 경쟁기업의 원가 정보는 유의미한\n정보에 해당되지 않는다.\n③ 제품에 대해 장기적인 정상가격을 결정할 때에는 고정원가를 포함한 모든 제조원가가 고려되어야\n하나, 판매비와관리비는 고려되지 아니한다.\n④ 경제학에서는 한계수익과 한계비용이 일치하는 점에서 제품의 최적판매가격이 결정된다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 81, "text": "[81]다음 중 원가의 일반적인 특성에 관한 설명으로 옳은 것은?\n① 기업의 수익획득 활동에 필요한 물품을 아직 소비하지 않았더라도 구입하는 시점에서 원가가 된다.\n② 원가는 정상적인 경제활동 과정에서 소비된 가치와 비정상적인 상황에서 발생한 가치의 감소분을 모\n두 포함한다.\n③ 경제적 가치를 가지고 있지 않더라도 원가가 될 수 있다.\n④ 발생한 제조원가 중 기업의 수익획득에 아직 사용되지 않은 부분은 자산으로, 수익획득에 사용된 부\n분은 비용으로 재무제표에 계상된다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 82, "text": "[82]다음은 ㈜삼일의 20X1년 한 해 동안의 제조원가 자료이다. ㈜삼일의 20X1년 제조원가명세서상의 당기\n제품제조원가를 계산하면 얼마인가?\n기 초 기 말\n직접재료 5,000원 7,000원\n재공품 10,000원 14,000원\n제 품 15,000원 10,000원\n직접재료 매입액 25,000원\n기초원가 60,000원\n가공원가 45,000원\n① 60,000원\n② 64,000원\n③ 68,000원\n④ 70,000원", "answer": 2}, {"year": "2024", "month": "3", "qnum": 83, "text": "[83]다음 중 보조부문원가 배분방법인 이중배분율법에 관한 설명으로 옳은 것은?\n① 보조부문의 원가를 원가행태에 따라 고정원가와 변동원가로 분류하여 다른 배분기준을 적용하는 방\n법이다.\n② 변동원가는 제조부문에서 사용할 수 있는 최대사용가능량을 기준으로 배분한다.\n③ 고정원가는 실제 용역사용량을 기준으로 배분한다.\n④ 단일배분율법에 비해 사용하기가 간편하지만 부문의 최적의사결정이 조직전체의 차원에서는 최적의\n사결정이 되지 않을 수 있다는 문제점이 있다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 84, "text": "[84]두 개의 제조부문과 두 개의 보조부문으로 이루어진 ㈜삼일의 부문간 용역수수에 관련된 자료는 다음과\n같다.\n보조부문 제조부문\nA B C D\nA부문 용역제공 - 40 % 20 % 40 %\nB부문 용역제공 20 % - 50 % 30 %\n발생원가 200,000원 300,000원 450,000원 600,000원\n단계배분법을 사용할 경우 제조부문 D에 배분되는 보조부문의 원가는 얼마인가(단, 보조부문원가는\nA부문의 원가를 우선 배분한다)?\n① 182,500원\n② 222,500원\n③ 230,000원\n④ 277,500원", "answer": 2}, {"year": "2024", "month": "3", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배부한다.\n20X1년의 제조간접원가배부율은 X부문에 대해서는 20 %, Y부문에 대해서는 50 % 이다. 제조지시서\n#105와 관련된 기초재공품은 300,000원이며, 당기 중 완성되어 판매가 완료되었다. 원가 발생액과 관\n련된 자료가 다음과 같은 경우 제조지시서 #105와 관련하여 당기 손익계산서에 반영될 매출원가는 얼마\n인가(단, 기초제품은 존재하지 않는다)?\n< 제조지시서 #105 >\n구 분 X부문 Y부문 합 계\n직접재료원가 700,000원 500,000원\n직접노무원가 1,000,000원\n제조간접원가 200,000원\n합 계\n① 2,800,000원\n② 3,000,000원\n③ 3,300,000원\n④ 3,800,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 87, "text": "[87] ㈜삼일은 기계가동시간을 기준으로 제조간접원가를 예정배부하고 있으며 연간 제조간접원가는\n5,000,000원으로, 연간 기계가동시간은 5,000시간으로 예상하고 있으나 실제로는 4,000시간이 발생\n하였다. 실제 제조간접원가가 5,000,000원이 발생한 경우 #A의 예정배부와 실제배부의 제조간접원가\n차이는 얼마인가?\n#A #B 계\n예상기계가동시간 3,000시간 2,000시간 5,000시간\n실제기계가동시간 2,000시간 2,000시간 4,000시간\n① 200,000원\n② 300,000원\n③ 400,000원\n④ 500,000원", "answer": 4}, {"year": "2024", "month": "3", "qnum": 88, "text": "[88]다음 중 아래 그림과 가장 관련 있는 원가회계 개념은 무엇인가?\n←1개를 100 % 완성\n∥\n← 2개를 50 % 완성\n∥\n← 4개를 25 % 완성\n① 개별원가계산의 간접원가배부율 계산\n② 보조부문원가계산의 단계배분법\n③ 종합원가계산의 완성품환산량\n④ 표준원가계산의 차이분석", "answer": 3}, {"year": "2024", "month": "3", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳지 않은 것은?\n① 직접재료원가와 직접노무원가는 실제원가로 측정하지만 제조간접원가는 사전에 정해 놓은 예정배부\n율에 의해 배부된 원가로 측정한다.\n② 제조간접원가 예정배부율에 의한 배부를 함으로써 특정 작업이 종료됨과 동시에 제품원가를 계산할\n수 있도록 하고 매월 제품원가가 변동하지 않도록 하는 원가계산제도이다.\n③ 제조간접원가의 배부가 기말까지 지연되어 제품원가계산이 지연되는 표준원가계산의 문제점을 보완\n하기 위한 원가계산제도이다.\n④ 제품원가를 정상원가로 측정하는 원가계산제도로서 평준화원가계산이라고도 한다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 97, "text": "[97]다음 중 초변동원가계산에 관한 설명으로 옳은 것은?\n① 초변동원가계산에 의한 영업이익은 단위당 공헌이익에 판매수량을 곱한 금액에서 운영비용을 차감하\n여 계산한다.\n② 생산량이 증가할수록 영업이익이 감소되므로 재고자산 보유를 최소화하도록 유인을 제공한다.\n③ 기간비용으로 처리하는 제조간접원가에 포함되는 혼합원가를 변동원가와 고정원가로 구분하는 것이\n필요하다.\n④ 변동원가계산제도와 마찬가지로 원가부착개념에 근거를 두고 있다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 98, "text": "[98]㈜삼일은 당기 초에 영업활동을 시작하여 당기에 제품 1,000단위를 생산하였으며, 당기의 원가자료는\n다음과 같다(단, 기말 재공품은 없다.)\n단위당 직접재료원가 420원\n단위당 직접노무원가 300원\n단위당 변동제조간접원가 120원\n단위당 변동판매비와관리비 150원\n고정제조간접원가 200,000원\n고정판매비와관리비 250,000원\n당기 판매량이 600단위였다면, 전부원가계산에 의한 기말제품재고액과 변동원가계산에 의한 기말제품재\n고액의 차이는 얼마인가?\n① 40,000원\n② 60,000원\n③ 80,000원\n④ 100,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 100, "text": "[100]㈜삼일은 당기에 영업을 개시하여10,000단위의 제품을 생산하고 이 중에서 9,500단위의 제품을 단위당\n2,000원에 판매하였다. 회사의 경영자는 외부보고 목적으로는 전부원가계산제도를 사용하고 있으나, 관\n리목적으로는 변동원가계산제도를 사용하고 있다. 다음 설명 중 옳은 것은?\n제품단위당 직접재료원가 1,000원\n제품단위당 직접노무원가 400원\n제품단위당 변동제조간접원가 200원\n제품단위당 변동판매비와관리비 100원\n고정제조간접원가 1,200,000원\n고정판매비와관리비 400,000원\n① 전부원가계산에 의한 영업이익이 변동원가계산에 의한 영업이익보다 크다.\n② 전부원가계산에 의할 경우 제품단위당 제조원가는 1,820원이다.\n③ 변동원가계산에 의할 경우 제품단위당 제조원가는 1,700원이다.\n④ 전부원가계산에 의할 경우 기말제품재고액은 910,000원이다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 103, "text": "[103]다음 중 CVP분석의 주된 목적으로 옳은 것은?\n① 변동원가와 고정원가의 상관관계를 분석한다.\n② 품질관리에서 발생하는 낭비요소를 분석한다.\n③ 기업의 비재무적 성과를 분석한다.\n④ 다양한 조업도수준에서 원가와 이익의 관계를 분석한다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 105, "text": "[105]다음은 CVP그래프이다. B지점과 비교하여 A지점의 단위당 변동원가와 단위당 고정원가는 어떻게 변하\n는가?\n수익,\n비용\n(금액)\nA\nB\n조업도\n① 단위당 변동원가와 단위당 고정원가 모두 같다.\n② 단위당 변동원가와 단위당 고정원가 모두 더 크다.\n③ 단위당 변동원가는 같으며, 단위당 고정원가는 더 크다.\n④ 단위당 변동원가는 더 크며, 단위당 고정원가는 같다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 114, "text": "[114]㈜삼일은 최근에 ㈜우주로부터 제품을 단위당 4,000원에 1,000단위를 구입하겠다는 제안을 받았다.\n제품과 관련된 단위당 원가자료는 다음과 같으며 위 주문을 수락하더라도 고정원가에는 아무런 영향을\n초래하지 않으며, 별도의 판매비와 관리비는 발생하지 않는다. 다음 중 ㈜우주의 제안과 관련하여 올\n바른 의사결정안과 관련 손익을 가장 올바르게 짝지은 것은(단, 직접노무원가는 변동원가로 분류한\n다)?\n금액\n직접재료원가 1,000원\n직접노무원가 1,000원\n변동제조간접원가 800원\n고정제조간접원가 500원\n변동판매비와관리비 200원\n고정판매비와관리비 1,000원\n① 거절, 300,000원의 손실\n② 거절, 500,000원의 손실\n③ 수락, 1,000,000원의 이익\n④ 수락, 1,200,000원의 이익", "answer": 4}, {"year": "2024", "month": "3", "qnum": 115, "text": "[115]지난해 ㈜삼일의 사업부 X의 공헌이익은 85,000 원이고, 사업부 X에 대한 공통원가 배분액은 80,000\n원이었다. 공통원가 배분액 중 35,000 원은 사업부 X를 폐지하더라도 계속하여 발생하는 것이다. 만\n약 회사가 사업부 X를 폐지한다면 회사의 순이익은 어떻게 변화하는가?\n① 40,000 원 감소\n② 40,000 원 증가\n③ 50,000 원 감소\n④ 50,000 원 증가", "answer": 1}, {"year": "2024", "month": "5", "qnum": 81, "text": "[81]원가는 경영자의 의사결정 목적에 따라 여러 가지로 분류할 수 있다. 다음 중 원가 분류에 관한 설명으\n로 옳은 것은?\n① 원가의 추적가능성에 따라 직접원가와 고정원가로 분류할 수 있다.\n② 원가의 행태에 따라 변동원가와 기간원가로 분류할 수 있다.\n③ 수익과의 대응관계에 따라 제품원가와 기간원가로 분류할 수 있다.\n④ 경영자의 의사결정과의 관련성에 따라 역사적원가와 예정원가로 분류할 수 있다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 82, "text": "[82]㈜삼일은 매출총이익을 매출액의 30 % 로 설정하고 있다. 다음의 자료를 이용하여 ㈜삼일의 기말재공품\n을 계산하면 얼마인가?\n직접재료원가 1,500,000원 직접노무원가 900,000원\n제조간접원가 1,100,000원 당기매출액 8,000,000원\n기초제품 4,000,000원 기말제품 1,200,000원\n기초재공품 1,250,000원 기말재공품 ?\n① 1,500,000원\n② 1,550,000원\n③ 1,750,000원\n④ 1,950,000원", "answer": 4}, {"year": "2024", "month": "5", "qnum": 83, "text": "[83]다음 내용에서 설명하고 있는 원가배분방법은 무엇인가?\n보조부문원가의 배분순서를 정하여 그 순서에 따라 보조부문원가를 다른 보조부문과 제조부문에\n배분하는 방법\n① 직접배분법\n② 단계배분법\n③ 상호배분법\n④ 간접배분법", "answer": 2}, {"year": "2024", "month": "5", "qnum": 84, "text": "[84]㈜삼일은 두 개의 제조부문 C, D와 두 개의 보조부문 A, B를 두고 있다. 보조부문 A와 B의 발생원가\n는 각각 480,000원과 540,000원이며, 각 부문의 용역수수관계는 다음과 같다. 직접배분법을 사용할 경\n우 D가 배분받은 보조부문 원가를 계산하면 얼마인가?\n사용 보조부문 제조부문\n제공\nA B C D\nA － 20 % 30 % 50 %\nB 40 % － 40 % 20 %\n① 410,000원\n② 450,000원\n③ 480,000원\n④ 510,000원", "answer": 3}, {"year": "2024", "month": "5", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳지 않은 것은?\n① 제조간접원가는 개별작업과 관련하여 직접적으로 추적할 수 없으므로 이를 배부하는 절차가 필요하\n다.\n② 개별원가계산은 제조간접원가의 배부절차가 반드시 필요하므로, 개별원가계산을 사용하면서 변동원\n가계산제도를 채택할 수 없다.\n③ 개별원가계산은 제품원가를 개별작업별로 구분하여 집계하므로 제조직접비와 제조간접비의 구분이\n중요하다.\n④ 각 작업별로 원가가 계산되기 때문에 원가계산자료가 상세하고 복잡하여 오류가 발생할 가능성이 높\n아진다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 86, "text": "[86]㈜삼일은 직접노동시간을 기준으로 제조간접원가를 예정배부하고 있으며, 연간 제조간접원가는 2,000,000\n원, 연간 직접노동시간은 20,000시간으로 예상하고 있다. 20X1년 12월 중 작업지시서 #A와 #B를 시작하\n여 #A만 완성하였다면 제품제조원가(a)와 기말 재공품원가(b)는 각각 얼마인가(단, 월초에 재공품은 없다\n고 가정한다)?\n#A #B 계\n직접재료원가 130,000원 90,000원 220,000원\n직접노무원가 60,000원 50,000원 110,000원\n직접노동시간 2,400시간 1,600시간 4,000시간\n① a : 430,000원, b : 300,000원\n② a : 300,000원, b : 430,000원\n③ a : 730,000원, b : 0원\n④ a : 0원, b : 730,000원", "answer": 1}, {"year": "2024", "month": "5", "qnum": 87, "text": "[87]㈜삼일은 제조간접원가를 직접노동시간에 비례하여 실제배부한다. 1월 중 발생한 원가자료가 다음과 같\n을 경우 작업지시서 #03와 관련된 총제조원가는 얼마인가?\nŸ 1월 중 발생한 제조간접원가 총액 : 2,400,000원\nŸ 1월 중 발생한 실제직접노무시간 : 200시간\nŸ 작업지시서 #03에 투입된 직접노무시간 : 150시간\nŸ 작업지시서 #03 직접재료원가 : 1,340,000원\nŸ 작업지시서 #03 직접노무원가 : 760,000원\n① 3,900,000원\n② 4,000,000원\n③ 4,260,000원\n④ 4,500,000원", "answer": 1}, {"year": "2024", "month": "5", "qnum": 96, "text": "[96]다음 중 직접재료원가와 직접노무원가는 실제원가로, 제조간접원가는 사전에 정해놓은 예정배부율로 측\n정하는 원가계산방법은 무엇인가?\n① 전부원가계산\n② 종합원가계산\n③ 표준원가계산\n④ 정상원가계산", "answer": 4}, {"year": "2024", "month": "5", "qnum": 97, "text": "[97]다음 중 변동원가계산의 유용성에 관한 설명으로 옳지 않은 것은?\n① 일반적으로 인정된 회계원칙으로 기업회계측면의 외부보고자료로서 이용될 수 있다.\n② 특정기간의 이익이 생산량에 의해 영향을 받지 않는다.\n③ 이익계획과 예산편성에 필요한 원가－조업도－이익에 관련된 자료를 변동원가계산제도에 의한 공헌\n손익계산서로부터 쉽게 얻을 수 있다.\n④ 이익이 매출액과 동일한 방향으로 움직이므로 경영자의 입장에서 이해하기 쉽다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 102, "text": "[102]다음 중 원가추정방법에 관한 설명으로 옳지 않은 것은?\n① 계정분석법은 분석자의 전문적 판단에 따라 각 계정과목에 기록된 원가를 변동원가와 고정원가로\n분석하여 원가함수를 추정하는 방법으로 분석자의 주관적 판단이 개입될 여지가 없다.\n② 공학적방법은 투입과 산출사이의 관계를 계량적으로 분석하여 원가함수를 추정하는 방법으로서 과\n거의 자료를 이용할 수 없는 경우에도 이용 가능한 방법이다.\n③ 공학적방법은 제조간접원가의 추정에 어려움이 있다.\n④ 고저점법은 최고조업도와 최저조업도의 원가자료를 이용하여 원가함수를 추정하는 방법이다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 103, "text": "[103]다음 중 CVP분석에 필요한 가정에 관한 설명으로 옳지 않은 것은?\n① 화폐의 시간가치를 고려하는 분석 방법이다.\n② 모든 원가는 변동원가와 고정원가로 분류할 수 있다.\n③ 제품의 종류가 복수인 경우 판매량 변화에 따른 매출배합은 일정하다.\n④ 생산량이 모두 판매된 것으로 가정함으로써 기초재고자산과 기말재고자산의 변화가 손익에 영향을\n미치지 않는 것으로 본다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 104, "text": "[104]㈜삼일의 20X1년 손익분기점 매출액은 150,000원이었다. 20X1년 실제 발생한 총변동원가가 100,000\n원이고, 총고정원가가 90,000원이었다면, 영업이익은 얼마인가(단 동 기간동안 생산능력의 변동은 없\n다)?\n① 40,000원\n② 60,000원\n③ 80,000원\n④ 100,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 105, "text": "[105]㈜삼일은 회계프로그램을 판매하는 회사로 단위당 판매가격은 100원이며, 단위당 변동원가는 40원이\n다. 연간 고정원가는 60,000원이며 당기에 30,000원의 이익을 목표로 하고 있다. 다음 설명 중 옳지\n않은 것은(단, 법인세 효과는 고려하지 않는다)?\n① 공헌이익률은 60 % 이다.\n② 단위당 공헌이익은 60원이다.\n③ 목표이익을 달성하려면 150,000원의 매출이 발생하여야 한다.\n④ 손익분기점을 달성하기 위한 매출수량은 1,500단위이다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 106, "text": "[106]㈜삼일의 20X1년 영업이익은 100,000원이고 영업레버리지도(DOL)는 5 이다. 만일 경기호황으로 인하\n여 20X2년 판매량이 20 % 증가한다면 영업이익은 얼마가 될 것으로 예상되는가(단, 20X1년과 20X2년\n의 단위당 판매가격, 단위당 변동원가, 총고정원가는 동일하다고 가정한다.)?\n① 120,000원\n② 140,000원\n③ 200,000원\n④ 240,000원", "answer": 3}, {"year": "2024", "month": "5", "qnum": 114, "text": "[114]A, B, C 3개의 사업부를 운영하는 ㈜삼일은 20X1년 당기순이익으로 500,000원을 보고하였으며, 최근\n수익성이 악화되고 있는 A사업부의 폐지를 고려중이다. A사업부의 공헌이익은 70,000원이고, A사업\n부에 대한 공통원가 배분액은 90,000원이다. 공통원가배분액 중 40,000원은 A사업부를 폐지하더라도\n계속하여 발생한다. A사업부를 폐지하는 경우 20X1년 당기순이익은 얼마인가?\n① 450,000원\n② 460,000원\n③ 470,000원\n④ 480,000원", "answer": 4}, {"year": "2024", "month": "5", "qnum": 115, "text": "[115]㈜삼일은 유행이 지난 의류 500벌을 보유하고 있다. 이 제품에 대한 총제조원가는 20,000,000원이었으\n나 현재로는 의류 한벌당 30,000원에 처분하거나 8,000,000원을 투입하여 개조한 후 의류 한벌당\n50,000원에 판매할 수 밖에 없는 상황이다. 다음 설명 중 옳은 것은?\n① 총제조원가 20,000,000원은 두 가지 대안 중 한 가지 대안을 선택할 경우에 고려하여야 하는 관련원\n가이다.\n② 그대로 의류 한벌당 30,000원에 처분하면 2,500,000원의 손실이 발생한다.\n③ 개조하여 판매하는 것이 그대로 처분하는 것보다 2,000,000원만큼 유리하다.\n④ 8,000,000원의 추가비용을 지출하지 않고 한벌당 30,000원에 판매하는 것이 가장 유리하다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 119, "text": "[119]㈜삼일의 부품생산부분은 최대생산량인 360,000단위를 생산하여 외부시장에 전량 판매하고 있다. 부품\n생산부분의 관련정보는 다음과 같다.\nŸ 단위당 외부판매가격 100 원\nŸ 단위당 변동제조원가 60 원\nŸ 단위당 변동판매비 6 원\nŸ 단위당 고정제조원가 14 원\nŸ 단위당 고정관리비 10 원\n단위당 고정비는 최대생산량 360,000 단위 기준의 수치이다. 부품생산부문의 이익을 극대화시키기 위해\n내부대체를 허용할 수 있는 단위당 최소대체가격을 계산하면 얼마인가(단, 내부대체에 대해서는 변동판\n매비가 발생하지 않는다.)?\n① 60 원\n② 66 원\n③ 90 원\n④ 94 원", "answer": 4}, {"year": "2024", "month": "6", "qnum": 81, "text": "[81]다음 중 재무회계와 관리회계에 관한 설명으로 옳은 것은?\n① 관리회계는 과거지향적이고 객관성을 강조하나, 재무회계는 미래지향적이며, 목적적합성을 강조한\n다.\n② 관리회계의 보고수단은 일반목적을 위한 재무제표이나, 재무회계의 보고수단은 특수목적의 재무제표\n와 기타보고서이다.\n③ 관리회계는 기업회계기준 등 일정한 준거기준이 있으나, 재무회계는 일정한 기준이 없다.\n④ 관리회계는 주로 내부경영자의 경제적 의사결정에 유용한 정보를 제공하기 위한 내부보고 목적으로\n이용되나, 재무회계는 주로 외부보고 목적으로 이용된다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 82, "text": "[82]다음 자료를 이용하여 당기제품제조원가를 구하면 얼마인가?\nㄱ. 기초재공품 15,000원\nㄴ. 직접재료원가 40,000원\nㄷ. 기말재공품 10,000원\nㄹ. 직접노무원가 30,000원\nㅁ. 제조간접원가 배부액은 직접노무원가 발생액의 70 % 이다.\n① 75,000원\n② 93,000원\n③ 96,000원\n④ 99,000원", "answer": 3}, {"year": "2024", "month": "6", "qnum": 83, "text": "[83]다음 중 보조부문의 원가배분에 관한 설명으로 옳은 것은?\n① 보조부문원가는 제조부문에 배부하지 않고 기간원가로 처리해야 한다.\n② 직접배분법은 보조부문 상호간의 용역수수관계를 고려하는 원가배분방법이다.\n③ 보조부문의 원가를 배부할 때에는 항상 수혜기준을 우선적으로 고려해야 한다.\n④ 단계배분법은 보조부문 간의 용역수수관계를 일부 인식하기는 하지만 배분순서가 적절하지 않은 경\n우 원가배분결과가 왜곡될 수 있다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 84, "text": "[84]㈜삼일은 단계배분법을 이용하여 보조부문원가를 배분하고 있다. 다음의 자료를 이용하여 물음에 답하\n시오(단, 보조부문A의 원가부터 배분한다).\n사용부문 보조부문 제조부문\n합계\n제공부문 A B 갑 을\n부문원가 6,000원 7,000원 12,000원 15,000원 40,000원\nA － 30 % 30 % 40 % 100 %\nB 25 % － 33 % 42 % 100 %\n위의 자료에서 보조부문 B가 제조부문 갑에 배분해야 하는 금액을 계산하면 얼마인가?\n① 3,276원\n② 3,872원\n③ 4,928원\n④ 7,328원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배분한다.\n20X1년의 제조간접원가 배부율은 A부문에 대해서는 300 %, B부문에 대해서는 50 % 이다. 제조지시서\n#04는 20X1년 중에 시작되어 완성되었으며, 원가 발생액은 다음과 같다. 제조지시서 #04와 관련된 총\n제조원가를 계산하면 얼마인가?\n제조지시서 #04 A부문 B부문\n직접재료원가 50,000원 10,000원\n직접노무원가 ? 60,000원\n제조간접원가 90,000원 ?\n① 210,000원\n② 250,000원\n③ 270,000원\n④ 300,000원", "answer": 3}, {"year": "2024", "month": "6", "qnum": 87, "text": "[87]㈜삼일은 개별원가계산제도를 채택하고 있으며, 제품 A의 작업원가표가 아래와 같을 때 제품 A의 제조\n원가는 얼마인가?\nㄱ. 직접재료 투입액 135,000원\nㄴ. 직접노동시간 200시간\nㄷ. 직접노무원가 임률 500원/시간\nㄹ. 제조간접원가 배부율(직접노동시간당) 750원/시간\n① 350,000원\n② 385,000원\n③ 412,500원\n④ 435,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 91, "text": "[91]㈜삼일의 제조간접원가와 직접노무시간에 대한 자료이다. ㈜삼일은 예상제조간접원가를 예상직접노무시\n간으로 나눈 제조간접원가 배부율로 원가배분한다. 정상원가계산에 따른 제조간접원가 배부차이가\n300,000원 (과소배부) 발생했다면 실제 직접노무시간으로 옳은 것은?\n제조간접원가 직접노무시간(시간)\n예상 1,000,000원 1,000시간\n실제 800,000원 ?\n① 300시간\n② 500시간\n③ 800시간\n④ 1,000시간", "answer": 2}, {"year": "2024", "month": "6", "qnum": 92, "text": "[92]다음 중 표준원가계산의 원가차이 처리방법으로서 매출원가조정법에 관한 설명으로 옳지 않은 것은?\n① 유리한 원가차이는 매출원가에서 차감하며 불리한 원가차이는 매출원가에 가산한다.\n② 원가차이가 중요하지 않은 경우 매출원가조정법을 적용할 수 있다.\n③ 매출원가조정법을 사용하면 비례배분법을 사용하는 경우보다 당기순이익이 항상 크게 나타난다.\n④ 매출원가조정법이란 모든 제조간접원가 배부차이를 매출원가에 가감하는 방법이다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 100, "text": "[100]㈜삼일은 12월 중 아래 영업자료를 참고하여 전부원가계산과 변동원가계산에 의한 순이익을 비교하고\n있다. 전부원가계산의 영업이익이 변동원가계산에 비해 80,000원 만큼 크다면 판매량은 몇 개인가?\n생산량 2,000개 판매량 ?\n고정제조원가 400,000원 고정판매관리비 80,000원\n(단, 월초재고는 없음)\n① 1,500개\n② 1,600개\n③ 1,800개\n④ 2,000개", "answer": 2}, {"year": "2024", "month": "6", "qnum": 102, "text": "[102]㈜삼일의 과거 원가자료를 바탕으로 총제조간접원가를 추정한 원가함수는 다음과 같다. 이에 관한 설\n명으로 옳지 않은 것은(단, 조업도는 기계시간이다.)?\ny = 100,000 + 40x\n① 100,000은 총고정원가 추정치를 의미한다.\n② x는 기계시간을 의미한다.\n③ 40은 기계시간당 고정제조간접원가를 의미한다.\n④ 조업도가 1,000기계시간일 경우 총제조간접비는 140,000 원으로 추정된다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 105, "text": "[105]㈜삼일은 제품 10,000개를 판매하여 2,000,000원의 세전영업이익을 달성하는 것을 목표로 하고 있다.\n이에 대한 고정원가는 4,000,000원이고 공헌이익률은 40 % 이다. ㈜삼일의 제품 단위당 판매가격과 제\n품 단위당 변동원가는 각각 얼마인가(단, 회사는 단일제품을 생산, 판매하며 판매가격은 연중 일정하\n다고 가정한다)?\n단위당 판매가격 단위당 변동원가\n① 1,500원 600원\n② 1,500원 900원\n③ 1,000원 900원\n④ 1,000원 600원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 114, "text": "[114]㈜삼일은 여러 사업부를 운영하고 있는 기업이며, 20X1년의 당기순이익은 1,000,000원이다. 여러 사\n업부 중에서 사업부 갑의 공헌이익은 300,000원이고, 사업부 갑에 대한 공통원가 배분액은 100,000원\n이다. 공통원가배분액 중 70,000원은 사업부 갑을 폐지하더라도 계속하여 발생하는 것이다. 만약 회사\n가 사업부 갑을 폐지하였다면 20X1년 당기순이익은 얼마로 변하였겠는가?\n① 700,000원\n② 730,000원\n③ 770,000원\n④ 800,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 115, "text": "[115]㈜삼일은 최근 고객사로부터 제품 400단위를 단위당 30,000원에 구입하겠다는 제안을 받았다. 이 주\n문의 수락여부와 회사의 이익에 미치는 영향으로 옳은 것은(단, 제품과 관련된 자료는 다음과 같으며\n동 주문을 수락하더라도 고정원가에는 아무런 영향을 초래하지 않는다)?\n제품단위당 원가\n직접재료원가 22,000원\n직접노무원가(변동원가) 4,000원\n변동제조간접원가 2,500원\n고정제조간접원가 3,000원\n변동판매비와관리비 500원\n고정판매비와관리비 1,000원\n33,000원\n① 수락, 400,000원의 이익 증가\n② 수락, 800,000원의 이익 증가\n③ 거절, 400,000원의 손실 증가\n④ 거절, 800,000원의 손실 증가", "answer": 1}, {"year": "2024", "month": "6", "qnum": 119, "text": "[119]㈜삼일은 분권화된 사업부 갑과 을을 이익중심점으로 설정하고 있다. 사업부 갑에서 생산되는 제품 A\n는 사업부 을에 대체하거나 외부시장에 판매할 수 있으며, 관련된 원가자료는 다음과 같이 제시되어\n있다. 사업부 을은 제품 A를 주요부품으로 사용하여 완제품을 생산하고 있으며, 공급처는 자유로이 선\n택할 수 있다. 현재 사업부 갑은 500,000 단위의 제품 A를 생산하여 전부 외부시장에 판매하고 있으\n며, 사업부 을에서는 연간 300,000 단위의 제품 A를 단위당 980 원의 가격으로 외부공급업자로부터 구\n입하고 있다. 만일 사업부 갑이 제품 A를 사업부 을에 사내대체하여야 하고, 이 경우 단위당 60 원의\n판매비와관리비를 절감할 수 있다면 제품 A의 사내대체가격은 어느 범위에서 결정되겠는가(단, 사업부\n을에서 제품 A를 이용해 생산한 완제품의 순실현가치는 제품 A의 외부구입가보다 크다)?\n제품 A의 원가자료\n단위당 외부판매가격 1,000 원\n단위당 변동원가 620 원 (변동판매비와관리비 포함)\n연간 고정원가 100,000,000 원\n연간 최대생산능력 500,000 단위\n① 620 원과 920 원 사이\n② 920 원과 980 원 사이\n③ 940 원과 980 원 사이\n④ 980 원과 1,000 원 사이", "answer": 3}, {"year": "2024", "month": "7", "qnum": 82, "text": "[82]다음은 ㈜삼일의 20X1년 한 해 동안의 제조원가 자료이다. ㈜삼일의 20X1년 손익계산서상의 매출원가\n를 계산하면 얼마인가?\n기 초 기 말\n직접재료 4,000원 6,000원\n재공품 10,000원 5,000원\n제 품 12,000원 10,000원\n직접재료 매입액 25,000원\n가공원가 발생액 32,000원\n① 58,000원\n② 60,000원\n③ 62,000원\n④ 68,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 83, "text": "[83]원가배분은 공통원가를 원가대상에 합리적으로 대응시키는 과정을 말한다. 다음 중 원가배분기준 선택\n에서 가장 먼저 고려할 사항은?\n① 각 원가대상의 효율성 제고\n② 원가동인과의 인과관계 고려\n③ 각 원가대상에 균등하게 배분\n④ 입수비용이 가장 저렴한 배부기준", "answer": 2}, {"year": "2024", "month": "7", "qnum": 84, "text": "[84]㈜삼일은 보조부문에 대하여 단계배부법에 의하여 보조부문원가를 배부하며, 두개의 제조부문(제조A\n부, 제조B부)과 두 개의 보조부문(보조X부, 보조Y부)을 두고 있다. 다음 자료에 따라 제조B부에 배\n부되는 보조Y 부문의 원가는 얼마인가(단, 보조X부를 먼저 배분한다)?\n용역사용부문 제조부문 보조부문\n합계\n용역제공부문\nA부 B부 X부 Y부\n보조X부 50 % 30 % 20 % 100 %\n보조Y부 20 % 60 % 20 % 100 %\n발생원가 800,000원 400,000원\n① 240,000원\n② 420,000원\n③ 600,000원\n④ 640,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 86, "text": "[86]㈜삼일은 과거 원가자료를 분석하여 아래와 같은 제조간접원가 예산식을 만들었다.\n연간 제조간접원가예산 = ￦200,000 + @200 X 직접노동시간\n회사가 총직접노동시간을 1,000시간으로 예상하고 있을 때, 제조간접원가 예정배부율은 얼마인가?\n① 직접노동시간당 300 원\n② 직접노동시간당 400 원\n③ 직접노동시간당 500 원\n④ 직접노동시간당 600 원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 87, "text": "[87]다음 자료를 읽고 문제에 답하시오.\nㄱ. ㈜삼일에는 두 개의 제조부문(A, B)이 있다. 다음은 당기의 자료이다.\nA부문 B부문 합 계\n제조간접원가 500,000원 640,000원 1,140,000원\n직접노무시간 2,000시간 8,000시간 10,000시간\nㄴ. 당기 중 착수하여 완성된 #2052 작업의 원가자료는 다음과 같다.\nA부문 B부문 합 계\n직접재료원가 30,000원 20,000원 50,000원\n직접노무원가 20,000원 32,000원 52,000원\n직접노무시간 120시간 240시간 360시간\nㄷ. 회사는 직접노무시간을 기준으로 제조간접원가를 배부하고 있다.\n부문별 제조간접원가 배부율을 사용할 경우 #2052의 가공원가는 얼마인가?\n① 93,040원\n② 99,200원\n③ 100,000원\n④ 101,200원", "answer": 4}, {"year": "2024", "month": "7", "qnum": 96, "text": "[96]다음 중 원가부착개념(cost attach concept)에 근거를 둔 원가계산에서 재고자산가액에 포함되는 항목\n을 모두 고르면?\nㄱ. 직접재료원가\nㄴ. 직접노무원가\nㄷ. 변동제조간접원가\nㄹ. 고정제조간접원가\nㅁ. 변동판매비와관리비\n① ㄱ\n② ㄱ,ㄴ,ㄷ\n③ ㄱ,ㄴ,ㄷ,ㄹ\n④ ㄱ,ㄴ,ㄷ,ㅁ", "answer": 3}, {"year": "2024", "month": "7", "qnum": 98, "text": "[98]㈜삼일의 6월 중 아래 영업자료를 참고하여 전부원가계산과 변동원가계산에 의한 순이익을 비교한 것으\n로 옳은 것은(재고자산은 평균법으로 평가한다)?\n생 산 량 1,200개 판매량 800개\n판매단가 100원 기초재고량 200개\n(단위당 고정제조간접원가 27원)\n고정제조간접원가 24,000원 고정판매관리비 12,000원\n단위당 변동판매관리비 15원 단위당 변동제조원가 30원\n① 전부원가계산에 의한 순이익이 변동원가계산에 의한 순이익보다 6,600원 더 많다.\n② 전부원가계산에 의한 순이익이 변동원가계산에 의한 순이익보다 7,200원 더 많다.\n③ 전부원가계산에 의한 순이익이 변동원가계산에 의한 순이익보다 12,600원 더 많다.\n④ 전부원가계산에 의한 순이익이 변동원가계산에 의한 순이익보다 12,600원 더 적다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 99, "text": "[99]㈜삼일의 초변동원가계산에 의한 영업이익이 5,000,000원이라고 할 때 아래의 자료를 이용하여 변동원\n가계산에 의한 영업이익을 구하면 얼마인가(단, 기초와 기말 재공품 재고는 존재하지 않으며, 각 원가\n항목별 단가의 변동은 없음을 가정한다)?\n기초제품재고수량 3,000개\n기말제품재고수량 2,000개\n제품단위당 고정제조간접원가 500원\n제품단위당 변동제조간접원가 300원\n제품단위당 직접노무원가 200원\n① 4,400,000원\n② 4,500,000원\n③ 5,400,000원\n④ 5,500,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 100, "text": "[100]변동원가계산에 의한 공헌이익 손익계산서 작성 자료가 아래와 같을 경우 공헌이익을 계산하면 얼마인\n가?\n판매수량 3,500개\n단위당 판매가격 4,200원\n단위당 변동제조원가 2,300원\n단위당 변동판매비와관리비 300원\n고정제조간접원가 2,000,000원\n고정판매비와관리비 500,000원\n① 3,600,000원\n② 3,780,000원\n③ 5,600,000원\n④ 6,650,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 105, "text": "[105]㈜삼일은 야구공을 제조하여 개당 10,000원에 판매하고 있다. 야구공 제조에 사용되는 변동원가는 개\n당 5,000원이고 월고정원가는 2,000,000원이다. ㈜삼일이 월 1,500,000원의 세후이익을 얻기 위해서\n는 몇 개의 야구공을 생산ㆍ판매하여야 하는가(단, ㈜삼일은 20 % 의 단일 법인세율을 적용받는다)?\n① 387개\n② 400개\n③ 700개\n④ 775개", "answer": 4}, {"year": "2024", "month": "7", "qnum": 112, "text": "[112]㈜삼일은 흠집이 있는 제품 A를 4개 보유하고 있다. 흠집이 없는 정상적 제품 A의 판매가격은 300원\n이다. 제품A의 생산에는 단위당 변동제조원가 80원과 단위당 고정제조원가 20원이 투입되었다. 흠집\n이 있는 제품 A를 외부에 단위당 150원에 처분하려면 단위당 판매관리비가 15원이 소요될 것으로 추\n정된다. 이 의사결정에 고려될 관련원가로 옳은 것은?\n① 정상판매가격 300원\n② 단위당 변동제조원가 80원\n③ 단위당 고정제조원가 20원\n④ 단위당 판매관리비 15원", "answer": 4}, {"year": "2024", "month": "7", "qnum": 115, "text": "[115]지난해 ㈜삼일의 사업부 X의 공헌이익은 75,000 원이고, 사업부 X에 대한 공통원가 배분액은 80,000\n원이었다. 공통원가배분액 중 45,000 원은 사업부 X를 폐지하더라도 계속하여 발생하는 것이다. 만약\n회사가 사업부 X를 폐지한다면 회사전체의 순이익은 어떻게 변화하는가?\n① 40,000 원 감소\n② 40,000 원 증가\n③ 50,000 원 감소\n④ 50,000 원 증가", "answer": 1}, {"year": "2024", "month": "7", "qnum": 119, "text": "[119]㈜삼일은 A 사업부와 B 사업부로 구성되어 있다. B 사업부는 A 사업부에서 생산되는 부품을 가공하여\n완제품을 제조한다. B 사업부에서 부품 한 단위를 완제품으로 만드는데 소요되는 추가가공원가는 450\n원이며, 완제품의 단위당 판매가격은 1,150원이다. 부품의 외부시장가격이 단위당 650원인 경우, B\n사업부가 받아들일 수 있는 최대대체가격을 계산하면 얼마인가?\n① 450원\n② 650원\n③ 700원\n④ 1,150원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 81, "text": "[81]다음은 원가의 분류에 관한 설명이다. 괄호 안에 들어갈 용어로 옳은 것은?\n원가란 특정목적을 달성하기 위해 소멸된 경제적 자원의 희생을 화폐가치로 측정한 것으로, 발생한\n원가 중 기업의 수익획득에 아직 사용되지 않은 부분은 ( a )(으)로, 수익획득에 사용된 부분은\n( b )(으)로 재무제표에 계상되며 수익획득에 기여하지 못하고 소멸된 부분은 ( c )(으)로\n계상된다.\n① (a) 손실, (b) 비용, (c) 자산\n② (a) 비용, (b) 자산, (c) 손실\n③ (a) 자산, (b) 손실, (c) 비용\n④ (a) 자산, (b) 비용, (c) 손실", "answer": 4}, {"year": "2024", "month": "9", "qnum": 82, "text": "[82]다음은 ㈜삼일의 제조원가명세서(약식)와 관련된 자료이다. 아래 자료를 이용하여 ㈜삼일의 당기 기초\n원가와 가공원가를 계산하면 얼마인가?\n제조원가명세서\n(20X1.1.1. ~ 20X1.3.31.)\nㄱ. 직접재료원가\n- 기초재료재고액 30,000원\n- 당기재료매입액 300,000원\n- 기말재료재고액 20,000원\nㄴ. 직접노무원가 90,000원\nㄷ. 제조간접원가 350,000원\nㄹ. 기초재공품원가 100,000원\nㅁ. 기말재공품원가 50,000원\n기초원가 가공원가 기초원가 가공원가\n① 400,000원 350,000원 ② 410,000원 440,000원\n③ 400,000원 440,000원 ④ 410,000원 650,000원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 83, "text": "[83]다음 중 보조부문의 원가배분 방법에 관한 설명으로 옳지 않은 것은?\n① 직접배분법이란 보조부문 상호간에 행해지는 용역의 수수를 완전히 무시하고 보조부문의 원가를 배\n분하는 방법이다.\n② 상호배분법에서 특정보조부문의 배분할 총원가는 [자기부문의 발생원가 + 다른 부문으로부터 배분된\n원가] 이다.\n③ 단계배분법이란 보조부문원가의 배분순서를 정하여 그 순서에 따라 단계적으로 보조부문 원가를 다\n른 보조부문과 제조부문에 배분하는 방법이다.\n④ 단계배분법의 경우 보조부문간의 용역수수관계가 완전히 인식되나, 보조부문간의 배분순위 결정이\n부적절한 경우 원가배분 결과가 왜곡될 수 있다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 84, "text": "[84]원목가구 제조회사인 ㈜삼일은 두 개의 제조부문(조각부와 도료부)과 두 개의 보조부문(창고부와 전력\n부)으로 구성되어 있다. 각 부문에서 발생한 원가 및 부문간의 용역관계는 다음과 같다.\n용역사용부문 제조부문 보조부문\n합계\n용역제공부문\n조각부 도료부 창고부 전력부\n창고부 40 % 50 % 10 % 100 %\n전력부 30 % 50 % 20 % 100 %\n발생원가 800,000원 400,000원 200,000원 600,000원 2,000,000원\n위 자료에 따라 보조부문 상호간의 용역수수에 의한 배분방법 중 단계배분법을 사용하여 보조부문 원가\n를 각 제조부문에 배분하기 위한 계산과정에서 괄호 안에 들어갈 금액에 대한 설명으로 옳지 않은 것은\n(단, 창고부문원가부터 먼저 배분한다)?\n용역사용부문 제조부문 보조부문\n용역제공부문\n조각부 도료부 창고부 전력부\n각 부문의 발생원가 800,000원 400,000원 200,000원 600,000원\n보조부문의 원가배부\n창고부 괄호1( ) 괄호2( )\n전력부 괄호3( ) 괄호4( )\n① “괄호2”는 100,000원이다.\n② “괄호3”은 232,500원이다.\n③ “괄호4”는 262,500원이다.\n④ 직접배분법을 사용할 경우“괄호4”는 375,000원이다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 85, "text": "[85]다음 중 개별원가계산제도에 관한 설명으로 옳지 않은 것은?\n① 개별원가계산은 원가계산제도 중 기업의 생산형태에 따른 분류방법 중 하나이다.\n② 소수의 제품을 대량생산하는 회사에서 적합한 원가계산방법이다.\n③ 개별원가계산은 직접원가와 간접원가의 분류가 중요하다.\n④ 제품별 손익분석이 용이한 계산방법이다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배부한다.\n20X1년의 제조간접원가배부율은 X부문에 대해서는 50 % , Y부문에 대해서는 20 % 이다. 제조지시서\n#105와 관련된 기초재공품은 300,000원이며, 당기 중 판매가 완료되었다. 원가 발생액과 관련된 자료\n가 다음과 같은 경우 제조지시서 #105와 관련하여 당기 손익계산서에 반영될 매출원가는 얼마인가?\n< #105 >\n구 분 X부문 Y부문 합 계\n직접재료원가 700,000원 500,000원\n직접노무원가 1,000,000원\n제조간접원가 200,000원\n합 계\n① 2,900,000원\n② 3,000,000원\n③ 3,900,000원\n④ 4,200,000원", "answer": 4}, {"year": "2024", "month": "9", "qnum": 87, "text": "[87]㈜삼일은 직접노동시간을 기준으로 제조간접원가를 예정배부하고 있으며 연간 제조간접원가 2,000,000\n원으로, 연간 직접노동시간은 5,000시간으로 각각 예상하고 있으나 실제로는 연간 직접노동시간이\n4,000시간 발생하였다. 실제 제조간접원가가 1,800,000원이 발생한 경우 #B의 예정배부와 실제배부의\n제조간접원가 차이는 얼마인가?\n#A #B 계\n예상직접노동시간 3,000시간 2,000시간 5,000시간\n실제직접노동시간 1,500시간 2,500시간 4,000시간\n① 100,000원\n② 125,000원\n③ 150,000원\n④ 225,000원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 97, "text": "[97]직접재료원가와 직접노무원가는 실제원가로, 제조간접원가는 사전에 전해놓은 예정배부율로 측정하는\n원가계산방법은 무엇인가?\n① 전부원가계산\n② 종합원가계산\n③ 표준원가계산\n④ 정상원가계산", "answer": 4}, {"year": "2024", "month": "9", "qnum": 98, "text": "[98]20X1년 1월1일에 영업을 개시한 ㈜삼일은 단일제품을 생산, 판매하며 20X1년 한 해 동안 총 2,000단\n위를 생산하여 1,500단위(단위당 판매가격 1,800원)를 판매하였다. 20X1년에 발생한 추가정보가 다음\n과 같을 경우 변동원가계산에 의한 ㈜삼일의 영업이익은 얼마인가?\n고 정 원 가 단위당 변동원가\n직접재료원가 - 300원\n직접노무원가 - 250원\n제조간접원가 300,000원 150원\n판매비와관리비 200,000원 200 원\n① 825,000원\n② 850,000원\n③ 900,000원\n④ 925,000원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 101, "text": "[101]㈜삼일은 활동기준 원가계산을 사용하고 있으며, 당기의 관련 원가자료는 다음과 같다.\n활동구분 가공원가 총액 원가동인 원가동인 수\n세척 800,000원 재료의 부피 100,000리터\n조립 2,500,000원 부품의 수량 500,000단위\n검사 620,000원 완성품 수량 15,500단위\n제품 A 한 단위당 투입되는 재료의 원가는 200원, 부피는 12리터이고, 25단위의 부품이 소요된다고\n할 때, 당기에 생산된 제품 A 50단위의 총 제조원가는 얼마인가?\n① 13,050원\n② 18,250원\n③ 21,050원\n④ 23,050원", "answer": 4}, {"year": "2024", "month": "9", "qnum": 104, "text": "[104]20X1년도에 ㈜삼일의 변동원가는 매출액의 60 % 였다. 20X2년도에 경영자가 단위당 판매가격을 10 %\n인상하였을 경우, 20X1년 대비 20X2년도의 공헌이익증가율은 (단, 판매량과 단위당 변동원가 및 고정\n원가는 동일하다고 가정한다)?\n① 10 %\n② 15 %\n③ 20 %\n④ 25 %", "answer": 4}, {"year": "2024", "month": "9", "qnum": 105, "text": "[1
