05]㈜삼일은 회계프로그램을 판매하는 회사로 단위당 판매가격은 50원이며, 단위당 변동원가는 30원이\n다. 연간 고정원가는 30,000원이며 당기에 10,000원의 이익을 목표로 하고 있다. 다음 설명 중 옳지\n않은 것은(단, 법인세는 고려하지 않는다)?\n① 공헌이익률은 40 % 이다.\n② 단위당 공헌이익은 20원이다.\n③ 목표이익을 달성하려면 66,667원의 매출을 하여야 한다.\n④ 손익분기점을 달성하기 위한 매출수량은 1,500단위이다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 106, "text": "[106]다음은 ㈜삼일의 예산자료이다. 안전한계율은 얼마인가?\n매출액 5,000,000원\n변동원가 3,000,000원\n공헌이익 2,000,000원\n고정원가 1,800,000원\n영업이익 200,000원\n① 10 %\n② 20 %\n③ 30 %\n④ 40 %", "answer": 1}, {"year": "2024", "month": "9", "qnum": 108, "text": "[108]다음은 ㈜삼일의 20X1년 이익중심점의 통제책임이 있는 A사업부의 공헌이익 손익계산서이다. A사업부\n의 성과평가목적에 가장 적합한 이익은 얼마인가?\n매 출 액 5,000,000 원\n변 동 원 가 2,000,000 원\n공 헌 이 익 3,000,000 원\n추적가능·통제가능고정원가 500,000 원\n사업부경영자공헌이익 2,500,000 원\n추적가능·통제불능고정원가 500,000 원\n사업부공헌이익 2,000,000 원\n공통고정원가배분액 400,000 원\n법인세비용차감전순이익 1,600,000 원\n법인세비용 600,000 원\n순 이 익 1,000,000 원\n① 1,000,000원\n② 2,000,000원\n③ 2,500,000원\n④ 3,000,000원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 109, "text": "[109]㈜삼일은 A, B의 두 가지 제품을 생산하여 판매한다. 20X1 년 예산과 실제자료는 다음과 같다.\n<20X1 년 예산>\n판매수량 및 비율\n단위당 단위당\n제품종류\n판매가격 변동원가\n수량 비율\nA 800 원 500 원 4,000 개 40 %\nB 600 원 400 원 6,000 개 60 %\n합계 10,000 개 100 %\n<20X1 년 실제 결과>\n판매수량 및 비율\n단위당 단위당\n제품종류\n판매가격 변동원가\n수량 비율\nA 780 원 510 원 4,950 개 45 %\nB 560 원 390 원 6,050 개 55 %\n합계 11,000 개 100 %\n20X1 년 매출배합차이와 매출수량차이는 얼마인가?\n매출배합차이 매출수량차이\n① 55,000 원 유리 240,000 원 유리\n② 55,000 원 불리 240,000 원 불리\n③ 60,000 원 유리 235,000 원 유리\n④ 60,000 원 불리 235,000 원 불리", "answer": 1}, {"year": "2024", "month": "9", "qnum": 119, "text": "[119]㈜삼일은 A, B 두 개의 사업부를 가지고 있다. A사업부는 부품 갑을 생산하여 외부에 판매하거나 B사\n업부에 내부대체할 수 있다. A사업부의 연간 생산 및 판매자료는 다음과 같다.\n최대생산능력 20,000개\n외부수요량 18,000개\n단위당 판매가격 500원\n단위당 변동원가 250원\nB사업부는 부품 갑을 필요한 수량만큼 외부시장에서 370원에 구입할 수 있다. 만약 A사업부가 2,000개\n의 부품을 B사업부에 내부대체한다면 대체수량 1개당 회사전체이익이 얼마만큼 증가 또는 감소하겠는가\n(단, B사업부의 단위당 내부대체량의 순실현가치는 외부구입가격보다 크다)?\n① 20원 증가\n② 20원 감소\n③ 120원 증가\n④ 120원 감소", "answer": 3}, {"year": "2024", "month": "11", "qnum": 81, "text": "[81]다음은 ㈜삼일의 20X1년 제조원가명세서 중 일부이다. 다음 자료를 이용하여 (a)기초원가와 (b)가공원\n가를 계산하면 얼마인가?\n제조원가명세서\n20X1년 1월 1일 ~ 20X1년 12월 31일\nⅠ. 직접재료원가 50,000원\nⅡ. 직접노무원가 40,000원\nⅢ. 제조간접원가 120,000원\nⅣ. 당기총제조원가 210,000원\n(a)기초원가 (b)가공원가\n① 120,000원 210,000원\n② 50,000원 90,000원\n③ 120,000원 90,000원\n④ 90,000원 160,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 82, "text": "[82]㈜삼일의 원가 관련 자료가 다음과 같을 경우, 당기제품제조원가를 계산하면 얼마인가?\n․ 재료 매입액 8,000원 ․ 기초 원재료 재고 4,000원\n․ 생산직 노무원가 12,000원 ․ 기말 원재료 재고 2,000원\n․ 공장설비 감가상각비 3,000원 ․ 기초 재공품 재고 5,000원\n․ 본사건물 감가상각비 5,000원 ․ 기말 재공품 재고 2,000원\n․ 기타 제조경비 6,000원\n① 28,000원\n② 32,000원\n③ 34,000원\n④ 42,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 83, "text": "[83]다음 중 원가배분기준에 관한 설명으로 옳지 않은 것은?\n① 공정성과 공평성기준은 공정성과 공평성에 따라 공통원가를 원가배분대상에 배분해야 한다는 원칙을\n강조하는 포괄적인 기준이다.\n② 부담능력기준은 원가대상이 원가를 부담할 수 있는 능력에 따라 원가를 배분하는 기준으로, 품질검\n사원가를 품질검사시간을 기준으로 배분하는 경우가 대표적인 예이다.\n③ 인과관계기준은 원가대상과 배분대상원가 간의 인과관계에 따라 원가를 배분하는 기준이다.\n④ 수혜기준은 원가배분대상이 공통원가로부터 제공받은 경제적 효익의 크기에 따라 원가를 배분하는\n기준으로 수익자 부담의 원칙에 입각한 배분기준이다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 84, "text": "[84]㈜삼일은 보조부문에 대하여 직접배분법에 의하여 보조부문원가를 배부하며, 두개의 제조부문(제조A\n부, 제조B부)과 두 개의 보조부문(보조X부, 보조Y부)을 두고 있다. 다음 자료에 따라 제조B부에 배\n분되는 보조부문의 원가는 얼마인가?\n용역사용부문 제조부문 보조부문\n합계\n용역제공부문\nA부 B부 X부 Y부\n보조X부 50 % 30 % 20 % 100 %\n보조Y부 20 % 60 % 20 % 100 %\n발생원가 200,000원 100,000원\n① 25,000원\n② 120,000원\n③ 150,000원\n④ 180,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배분한다.\n20X1년의 제조간접원가배분율은 200 % 이며, 제조지시서 #11와 관련된 총제조원가는 59,000원이다. 제\n조지시서 #11는 20X1년 중에 시작되어 완성되었으며, 원가 발생 세부내역은 다음과 같다. B부문 제조\n간접원가 배분액을 계산하면 얼마인가?\n구분 A부문 B부문\n직접재료원가 8,000원 6,000원\n직접노무원가 6,000원 ?\n제조간접원가 12,000원 ?\n① 18,000원\n② 20,000원\n③ 24,000원\n④ 28,000원", "answer": 1}, {"year": "2024", "month": "11", "qnum": 87, "text": "[87]㈜삼일은 개별원가계산을 적용하고 있다. 작업 #A는 전기부터 작업이 진행되어 오고 있고, 작업 #B와\n#C는 당기에 착수되었다. 당기 중 작업 #A와 #B는 완성되었으나, 작업 #C는 미완성이다. 완성된 작업\n#A는 판매가 완료되었고, #B는 제품 재고로 전량 남아 있다. 당기 제조간접원가는 직접노무원가를 이\n용하여 배부한다. 다음 자료에 관한 설명으로 옳지 않은 것은?\n구분 작업 #A 작업 #B 작업 #C 합계\n기초재공품 원가 22,500원 - - 22,500원\n당기투입 원가\n직접재료원가 300,000원 125,000원 ? 500,000원\n직접노무원가 25,000원 ? ? 50,000원\n제조간접원가 ? 50,000원 ? 200,000원\n① 당기제품제조원가는 796,000원이다.\n② 당기총제조원가는 750,000원이다.\n③ 기말재공품원가는 137,500원이다.\n④ 매출원가는 447,500원이다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳지 않은 것은?\n① 제품원가를 정상원가로 측정하는 원가계산제도로서 평준화원가계산이라고도 한다.\n② 직접재료원가와 직접노무원가는 실제원가로 측정하지만 제조간접원가는 사전에 정해 놓은 예정배부\n율에 의해 배부된 원가로 측정한다.\n③ 제조간접원가의 배부가 기말까지 지연되어 제품원가계산이 지연되는 표준원가계산의 문제점을 보완\n하기 위한 원가계산제도이다.\n④ 제조간접원가 예정배부율에 의한 배부를 함으로써 특정 작업이 종료됨과 동시에 제품원가를 계산할\n수 있도록 하고 매월 제품원가가 변동하지 않도록 하는 원가계산제도이다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 95, "text": "[95]다음 중 원가차이의 배분방법에 관한 설명으로 옳지 않은 것은?\n① 매출원가조정법이란 모든 원가차이를 매출원가에 가감하는 방법으로서, 재공품과 제품계정은 모두\n실제원가로 기록된다.\n② 기타손익법은 비배분법에 해당하며, 불리한 차이는 기타비용 항목으로, 유리한 차이는 기타수익 항\n목으로 처리한다.\n③ 총원가 비례배분법은 재고자산 계정과 매출원가 계정의 총원가(기말잔액)를 기준으로 원가차이를 배\n분하는 방법이다.\n④ 원가요소별 비례배분법은 재고자산 계정과 매출원가 계정의 원가요소를 기준으로 각 해당되는 원가\n요소의 원가차이를 배분하는 방법이다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 97, "text": "[97]다음은 ㈜삼일의 7월 한달간 변동원가계산에 관한 자료이다. 7월의 총매출액을 계산하면 얼마인가?\n제품 단위당 판매가격 6,000원\n단위당 변동원가 2,000원\n총고정원가 1,500,000원\n영업이익 12,000,000원\n① 16,274,000원\n② 17,350,000원\n③ 20,250,000원\n④ 25,000,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 103, "text": "[103]다음 중 CVP 분석 시 적용하는 가정사항으로 옳지 않은 것은?\n① 복수의 제품을 생산할 경우 매출배합은 항상 일정하다고 가정한다.\n② 모든 원가는 변동원가와 고정원가로 구분할 수 있다고 가정한다.\n③ 화폐의 시간가치를 고려하지 않는다.\n④ 생산량과 판매량이 다르다고 가정한다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 104, "text": "[104]㈜삼일은 수제피자를 단위당 판매가격 7,500 원에 판매하고 있다. 수제피자 단위당 변동원가는 3,500\n원이고 연간 고정원가는 150,000,000 원이다. ㈜삼일의 연간 손익분기점 판매량은 몇 단위인가?\n① 31,300 단위\n② 33,000 단위\n③ 37,500 단위\n④ 40,000 단위", "answer": 3}, {"year": "2024", "month": "11", "qnum": 114, "text": "[114]A, B, C 3개의 사업부를 운영하는 ㈜삼일은 20X1년 당기순이익으로 1,500,000원을 보고하였으며, 최\n근 수익성이 악화되고 있는 A사업부의 폐지를 고려 중이다. A사업부의 공헌이익은 180,000원이고, A\n사업부에 대한 공통원가 배분액은 210,000원이다. 공통원가배분액 중 90,000원은 A사업부를 폐지하더\n라도 계속하여 발생한다. A사업부를 폐지하는 경우 20X1년 당기순이익은 얼마인가?\n① 1,380,000원\n② 1,440,000원\n③ 1,560,000원\n④ 1,670,000원", "answer": 2}, {"year": "2024", "month": "12", "qnum": 81, "text": "[81]다음 중 원가의 일반적인 특성에 관한 설명으로 옳지 않은 것은?\n① 기업의 수익획득 활동에 필요한 물품은 아직 소비하지 않았더라도 구입하는 시점에서 원가가 된다.\n② 제조원가는 정상적인 경제활동 과정에서 소비된 가치만을 포함하고, 비정상적인 상황에서 발생한 가\n치의 감소분은 포함되지 않는다.\n③ 경제적 가치를 가지고 있는 요소만 원가가 될 수 있다.\n④ 발생한 제조원가 중 기업의 수익획득에 아직 사용되지 않은 부분은 자산으로, 수익획득에 사용된 부\n분은 비용으로 재무제표에 계상된다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 82, "text": "[82]㈜삼일의 20X1년 12월 매출원가는 1,000,000원이다. 제조간접원가는 직접노무원가의 25 % 였으며, 기\n타관련 자료는 다음과 같을 때 20X1년 12월의 기초원가는 얼마인가?\n20X1년 12월 1일 20X1년 12월 31일\n재공품 50,000원 20,000원\n제품 100,000원 70,000원\n20X1년 12월 중 직접재료비 : 240,000원\n① 600,000원\n② 730,000원\n③ 800,000원\n④ 1,000,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 83, "text": "[83]다음 중 원가배분에 관한 설명으로 옳은 것을 모두 고르면?\nㄱ. 원가배분은 공통원가를 일정한 기준에 따라 원가대상에 합리적으로 대응시키는 과정을 말한다\nㄴ. 원가배분은 재고자산 및 매출원가의 금액을 산출하는 목적과는 무관하다.\nㄷ. 원가대상의 부담능력에 따라 원가를 배분하는 것은 사용할 수 없는 원가배분기준이다.\nㄹ. 원가집합(cost pool)이란 원가대상에 직접적으로 추적할 수 없는 원가를 모아둔 것을 의미한다.\n① ㄱ, ㄴ\n② ㄴ, ㄷ\n③ ㄷ, ㄹ\n④ ㄱ, ㄹ", "answer": 4}, {"year": "2024", "month": "12", "qnum": 84, "text": "[84]㈜삼일은 단계배분법을 이용하여 보조부문원가를 배분하고 있다. 다음의 자료를 이용하여 물음에 답하\n시오(단, 보조부문 A의 원가부터 배분한다).\n사용부문 보조부문 제조부문\n합계\n제공부문 A B 갑 을\n부문원가 60,000원 70,000원 240,000원 350,000원 720,000원\nA － 30 % 30 % 40 % 100 %\nB 20 % － 35 % 45 % 100 %\n위의 자료에서 보조부문 B가 제조부문 을에 배분해야 하는 금액을 계산하면 얼마인가?\n① 32,500원\n② 38,000원\n③ 49,500원\n④ 73,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 86, "text": "[86]다음은 ㈜삼일의 20X1년 12월 원가자료이다. 회사는 직접노무비를 기준으로 하여 제조간접원가를 예정\n배부하고 있다. 다음 자료에 따라 12월에 완성된 제품 #101의 제조원가를 계산하면 얼마인가(단, 기초\n재고자산은 존재하지 않는 것으로 가정한다)?\nㄱ. 당월 제조간접비 발생총액 500,000원\nㄴ. 당월 노무비 발생총액 700,000원\nㄷ. 제조간접비 예정배부율 직접노무비 1원당 \\ 0.5\nㄹ. 제품 #101의 직접원가 직접재료비 64,000원\n직접노무비 40,000원\n① 124,000원\n② 153,000원\n③ 272,000원\n④ 353,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 87, "text": "[87]다음은 ㈜삼일의 제조부문과 관련하여 당기 발생한 원가에 대한 자료들이다. 회사가 부문별 제조간접원\n가 배부율을 사용할 경우 #1B의 가공원가는 얼마인가?\nㄱ. ㈜삼일은 두 개의 제조부문(A, B)이 있다. 다음은 당기의 자료이다.\nA부문 B부문 합 계\n제조간접원가 4,000,000원 8,000,000원 12,000,000원\n직접기계시간 2,000시간 8,000시간 10,000시간\nㄴ. 당기 중 착수하여 완성된 #1B 작업의 원가자료는 다음과 같다.\nA부문 B부문 합 계\n직접재료원가 500,000원 200,000원 700,000원\n직접노무원가 200,000원 100,000원 300,000원\n직접기계시간 120시간 240시간 360시간\nㄷ. 회사는 직접기계시간을 기준으로 제조간접원가를 배부하고 있다.\n① 475,000원\n② 780,000원\n③ 1,080,000원\n④ 1,347,000원", "answer": 2}, {"year": "2024", "month": "12", "qnum": 91, "text": "[91]㈜삼일은 정상원가계산을 적용하고 있으며, 제조간접원가를 기계작업시간 기준으로 예정배부하고 있다.\n20X1년 실제 기계작업시간은 몇 시간인가?\n제조간접원가(예산) 816,000원\n제조간접원가(실제) 801,600원\n제조간접원가 배부액 785,400원\n기계작업시간(예산) 4,000시간\n① 3,640시간\n② 3,730시간\n③ 3,850시간\n④ 4,015시간", "answer": 3}, {"year": "2024", "month": "12", "qnum": 96, "text": "[96]다음 중 변동원가계산과 전부원가계산의 차이에 관한 설명으로 옳은 것은?\n① 기초재고자산이 없고 당기 생산량과 판매량이 동일하다면 변동원가계산과 전부원가계산의 순이익은\n같게 된다.\n② 고정판매비와관리비는 변동원가계산과 전부원가계산간의 처리방법이 상이하다.\n③ 변동원가계산은 외부보고 목적으로 적합하며, 전부원가계산은 내부계획과 통제 목적에 적합하다.\n④ 변동원가계산은 원가부착개념에 근거를 두고 있고, 전부원가계산은 원가회피개념에 근거를 두고 있\n다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 97, "text": "[97]다음 중 변동원가계산에서 재고자산가액에 포함되는 원가항목을 옳게 나열한 것은?\n① 직접재료원가, 직접노무원가, 변동판매비와관리비\n② 직접재료원가, 직접노무원가, 변동제조간접원가\n③ 직접재료원가, 직접노무원가, 고정제조간접원가\n④ 직접재료원가, 변동판매비와관리비, 고정제조간접원가", "answer": 2}, {"year": "2024", "month": "12", "qnum": 98, "text": "[98]변동원가계산에 의한 공헌이익 손익계산서 작성을 위한 자료가 아래와 같을 경우 변동원가계산에 의한\n영업이익은 얼마인가?\n판매수량 4,000개\n단위당 판매가격 3,000원/개\n단위당 변동제조원가 2,000원/개\n단위당 변동판매비와관리비 500원/개\n고정제조간접원가 1,000,000원\n고정판매비와관리비 500,000원\n① 200,000원\n② 500,000원\n③ 1,500,000원\n④ 2,500,000원", "answer": 2}, {"year": "2024", "month": "12", "qnum": 99, "text": "[99]㈜삼일은 20X1년에 사업을 개시하였다. 20X1년 변동원가에 의한 순이익이 700,000원일 때, 제조간접비\n배부액이 다음과 같을 경우 전부원가계산에 의한 순이익은 얼마인가?\n변동제조간접원가 고정제조간접원가\n재 공 품 15,000원 20,000원\n제 품 30,000원 15,000원\n매출원가 630,000원 510,000원\n① 625,000원\n② 700,000원\n③ 735,000원\n④ 1,240,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 103, "text": "[103]다음 중 단위당 판매가격과 단위당 변동원가가 불변이고 총고정원가가 감소할 경우에 관한 설명으로\n옳은 것은?\n① 손익분기점 판매량이 증가한다.\n② 손익분기점 매출액이 감소한다.\n③ 공헌이익이 감소한다.\n④ 공헌이익률이 증가한다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 106, "text": "[106]다음 중 고정예산과 변동예산의 차이에 관한 설명으로 옳은 것은?\n① 고정예산의 범위는 특정부서로 한정되는 반면, 변동예산은 회사전체를 범위로 한다.\n② 고정예산은 고정원가만을 고려하고, 변동예산은 변동원가만을 고려한다.\n③ 고정예산은 조업도의 변동을 고려하지 않고 특정조업도를 기준으로 작성되는 예산이고, 변동예산은\n조업도의 변동에 따라 조정되어 작성되는 예산이다.\n④ 고정예산에서는 권한이 하부 경영자들에게 위양되나, 변동예산에서는 그렇지 않다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 109, "text": "[109]다음은 ㈜삼일의 12월 예산 및 실제 성과와 관련한 자료이다. 자료를 바탕으로 매출조업도차이를 계산\n하면 얼마인가?\n실 제 예 산\n단위당 판매가격 100원 105원\n단위당 변동원가 54원 58원\n고정제조간접원가 755,000원 748,000원\n고정판매관리비 670,000원 650,000원\n판매량 47,000단위 50,000단위\n① 126,000원 불리\n② 126,000원 유리\n③ 141,000원 불리\n④ 141,000원 유리", "answer": 3}, {"year": "2024", "month": "12", "qnum": 113, "text": "[113]㈜삼일은 진부화된 컴퓨터 50대를 보유하고 있다. 이 제품에 대한 총제조원가는 35,000,000원이었으\n나 현재로는 컴퓨터 1대당 250,000원에 처분하거나, 11,000,000원을 투입하여 개조한 후 컴퓨터 1대\n당 500,000원에 판매할 수 있는 상황이다. 다음 설명 중 옳은 것은?\n① 그대로 컴퓨터 1대당 250,000원에 처분하면 27,500,000원의 손실이 발생하므로 처분해서는 안된\n다.\n② 제품에 대한 총제조원가 35,000,000원은 의사결정에 고려하여야 하는 관련원가이다.\n③ 11,000,000원의 추가비용을 지출하지 않고 컴퓨터 1대당 250,000원에 판매하는 것이 유리하다.\n④ 개조하여 판매하는 것이 그대로 처분하는 것보다 1,500,000원 만큼 유리하다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 119, "text": "[119]제품의 판매가격 결정은 기업 전체에 영향을 미치므로 경영진의 중요한 의사결정 사항 중 하나로 여겨\n지고 있다. 다음 중 가격 결정에 영향을 미치는 요소들에 관한 설명으로 옳지 않은 것은?\n① 제품의 가격을 인하하면 수요가 증가하는 것이 일반적이지만, 수요의 변동이 없을 수도 있다.\n② 제품에 대해 장기적인 정상가격을 결정할 때에는 고정원가를 포함한 모든 제조원가가 고려되어야\n하나, 판매비와관리비는 고려되지 아니한다.\n③ 경쟁기업의 원가정보는 경쟁력 있는 가격을 설정하는데 가치있는 정보가 될 것이다.\n④ 경제학에서는 한계수익과 한계비용이 일치하는 점에서 제품의 최적판매가격이 결정된다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 81, "text": "[81]삼일병원은 환자들의 초음파 분석 검사를 위한 장비를 의료기기 회사로부터 임차하여 사용하고 있다.\n임차료는 매월 5,000,000원이고, 검사분석결과 조회 건당 5,000원이 추가 부과된다. 삼일병원이 부담\n하는 매월 임차료의 원가행태로 옳은 것은?\n① 고정원가\n② 준고정원가\n③ 변동원가\n④ 준변동원가", "answer": 4}, {"year": "2025", "month": "1", "qnum": 82, "text": "[82]다음 중 ( ㄱ ), ( ㄴ )에 해당하는 용어로 옳은 것은?\n제조원가명세서\n(단위: 원)\nⅠ. 직접재료원가 XXX\n기초재고액 XXX\n당기매입액 XXX\n기말재고액 (XXX)\nⅡ. 직접노무원가 XXX\nⅢ. 제조간접원가 XXX\nⅣ. ( ㄱ ) XXX\nⅤ. 기초재공품 XXX\nⅥ. 기말재공품 (XXX)\nⅦ. ( ㄴ ) XXX\nㄱ ㄴ\n① 당기총제조원가 당기제품제조원가\n② 당기총제조원가 매출원가\n③ 당기제품제조원가 매출원가\n④ 매출원가 당기총제조원가", "answer": 1}, {"year": "2025", "month": "1", "qnum": 83, "text": "[83]다음 빈칸에서 설명하고 있는 원가배분방법은 무엇인가?\n보조부문간의 상호 관련성을 모두 고려하는 배분방법으로서 보조부문 사이에 용역수수관계가 존재할\n때 각 보조부문간의 용역수수관계를 방정식을 통해 계산한 다음 보조부문원가를 배부하는 방법\n① 직접배분법\n② 상호배분법\n③ 단계배분법\n④ 간접배분법", "answer": 2}, {"year": "2025", "month": "1", "qnum": 84, "text": "[84]㈜삼일은 A와 B의 두 제조부문이 있으며, 제조과정에서 필요한 설비의 수선을 할 수 있는 수선부문을\n보조부문으로 두고 있다. 두 제조부문의 최대사용가능시간은 A가 6,000시간이고 B가 4,000시간이며,\n실제로 사용한 수선시간은 A, B 모두 4,000시간이고, 고정원가는 4,000,000원, 변동원가는 8,000,000\n원이다. 단일배부율법을 사용하는 경우에 이중배분율법을 사용하는 경우와 비교하여 제조부문B에 배부\n되는 수선부문원가는 얼마나 차이가 나는가?\n① 400,000원 더 작다.\n② 400,000원 더 크다.\n③ 800,000원 더 작다.\n④ 800,000원 더 크다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 86, "text": "[86]다음 자료를 읽고 문제에 답하시오.\nㄱ. ㈜삼일의 두 제조부문(A, B)에 관한 당기 자료이다.\nA부문 B부문 합 계\n제조간접원가 400,000원 800,000원 1,200,000원\n직접기계시간 2,000시간 8,000시간 10,000시간\nㄴ. 당기 중 착수하여 완성된 # P1087의 원가자료는 다음과 같다.\nA부문 B부문 합 계\n직접재료원가 30,000원 20,000원 50,000원\n직접노무원가 20,000원 32,000원 52,000원\n직접기계시간 120시간 240시간 360시간\nㄷ. 회사는 직접기계시간을 기준으로 제조간접원가를 배부하고 있다.\n부문별 제조간접원가 배부율을 사용할 경우 # P1087의 총제조원가는 얼마인가?\n① 95,200원\n② 100,000원\n③ 145,200원\n④ 150,000원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 87, "text": "[87]다음은 개별원가계산제도를 이용하고 있는 ㈜삼일의 원가계산 자료이다. 제조간접원가는 기초원가\n(prime costs)를 기준으로 배부한다.\n원가항목 작업 #1 작업 #2 작업 #3 합계\n기초재공품 5,500원 3,000원 - 8,500원\n직접재료원가 2,800원 3,000원 2,200원 8,000원\n직접노무원가 4,000원 5,000원 3,000원 12,000원\n제조간접원가 ( ) ( ) ( ) 8,000원\n작업 #1과 작업 #3은 완성되었고, 작업 #2는 미완성되었다. ㈜삼일이 기말재공품으로 계상할 금액을 계\n산하면 얼마인가?\n① 9,520원\n② 11,200원\n③ 14,200원\n④ 15,020원", "answer": 3}, {"year": "2025", "month": "1", "qnum": 101, "text": "[101]다음 중 활동기준원가계산의 도입배경에 관한 설명으로 옳지 않은 것은?\n① 제조원가에서 제조간접원가의 비중이 과거에 비해 감소함에 따라 새로운 원가배부기준이 필요하게\n되었다.\n② 제조환경의 변화로 단일배부기준에 의한 원가의 배부가 원가의 왜곡현상을 초래하였다.\n③ 컴퓨터통합시스템의 도입으로 제조와 관련된 활동에 대한 원가를 수집하는 것이 용이해졌다.\n④ 제품의 연구개발 단계에서부터 폐기까지의 원가를 종합적으로 고려하는‘수명주기 원가계산’개념\n이 등장하였다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 105, "text": "[105]㈜삼일은 회계프로그램을 판매하는 회사로 단위당 판매가격은 100원이며, 공헌이익률은 40 % 이다. 연\n간 고정원가는 50,000원이며, 당기에 10,000원의 영업이익을 목표로 하고 있다. 이와 관련한 설명으\n로 옳지 않은 것은(단, 법인세 효과는 고려하지 않는다)?\n① 단위당 변동원가는 60원이다.\n② 단위당 공헌이익은 40원이다.\n③ 손익분기점 매출액은 100,000원이다.\n④ 목표이익을 달성하려면 150,000원의 매출을 달성해야 한다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 110, "text": "[110]㈜삼일은 A, B의 두 가지 제품을 생산하여 판매한다. 20X1 년 예산과 실제자료는 다음과 같다.\n< 20X1년 예산 >\n단위당 단위당 판매수량 및 비율\n제품종류\n판매가격 변동원가 수량 비율\nA 800원 500원 5,000개 50 %\nB 600원 400원 5,000개 50 %\n합계 10,000개 100 %\n< 20X1년 실제 결과 >\n단위당 단위당 판매수량 및 비율\n제품종류\n판매가격 변동원가 수량 비율\nA 780원 510원 4,950개 45 %\nB 560원 390원 6,050개 55 %\n합계 11,000개 100 %\n20X1년 매출배합차이와 매출수량차이는 얼마인가?\n매출배합차이 매출수량차이\n① 55,000원 유리 250,000원 불리\n② 55,000원 불리 250,000원 유리\n③ 60,000원 유리 220,000원 불리\n④ 60,000원 불리 220,000원 유리", "answer": 2}, {"year": "2025", "month": "1", "qnum": 114, "text": "[114]㈜삼일은 진부화된 제품을 300단위 보유하고 있다. 이 제품의 총 제조원가는 200,000원이었으나 현재\n로는 제품 단위당 200원에 처분하거나 12,000원을 추가로 투입하여 개조한 후 제품 단위당 250원에\n판매할 수 있는 상황이다. 다음 설명 중 옳은 것은?\n① 개조하여 판매하면 12,000원의 순손실이 발생한다.\n② 12,000원의 추가비용을 지출하지 않고 200원에 처분하는 것이 가장 유리하다.\n③ 개조하여 판매하는 것이 그대로 처분하는 것보다 3,000원 만큼 유리하다.\n④ 그대로 200원에 처분하면 140,000원의 손실이 발생하므로 처분하지 않는다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 115, "text": "[115]다음은 세 사업부문(A, B, C)을 보유한 ㈜삼일의 손익자료이다. 이에 관한 분석으로 옳지 않은 것은?\n(단위 : 원)\nA사업부 B사업부 C사업부 전 체\n매 출 액 3,000 3,500 2,500 9,000\n변 동 원 가 2,400 2,500 1,200 6,100\n공 헌 이 익 600 1,000 1,300 2,900\n회피 불능 원가 900 1,200 900 3,000\n이 익 (손 실) (300) (200) 400 (100)\n① 사업부 A를 폐쇄하면 회사의 전체손실은 1,700원이 된다.\n② 사업부 B, C를 폐쇄하면 회사의 전체손실은 2,400원이 된다.\n③ 사업부 A, C를 폐쇄하면 회사의 전체손실은 2,000원이 된다.\n④ 사업부 A, B, C를 모두 폐쇄하지 않고 유지하는 것이 유리하다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 119, "text": "[119]㈜삼일은 A 사업부와 B 사업부로 구성되어 있다. B 사업부는 A 사업부에서 생산되는 부품을 가공하여\n완제품을 제조한다. B 사업부에서 부품 한 단위를 완제품으로 만드는 데 소요되는 추가가공원가는 500\n원이며, 완제품의 단위당 판매가격은 1,150원이다. 부품의 외부시장가격이 단위당 600원인 경우, B\n사업부가 받아들일 수 있는 최대대체가격은 얼마인가?\n① 550원\n② 600원\n③ 650원\n④ 1,150원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 81, "text": "[81]경영자의 의사결정 목적에 따라 원가를 여러가지로 분류할 수 있다. 다음 중 원가를 분류할 때의 분류\n방법과 그 내용에 관한 설명으로 옳지 않은 것은?\n① 원가의 행태에 따라 변동원가와 고정원가로 분류한다.\n② 추적가능성에 따라 직접원가와 간접원가로 분류한다.\n③ 원가의 통제가능성에 따라 통제가능원가와 예정원가로 분류한다.\n④ 수익과의 대응관계에 따라 제품원가와 기간원가로 분류한다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 82, "text": "[82]㈜삼일은 매출총이익을 매출액의 25 % 로 설정하고 있다. 다음의 자료에서 ㈜삼일의 기말재공품은 얼마\n인가?\n직접재료원가 1,350,000원 직접노무원가 1,050,000원\n제조간접원가 1,100,000원 당기매출액 8,000,000원\n기초제품 4,000,000원 기말제품 1,200,000원\n기초재공품 1,250,000원 기말재공품 ?\n① 1,250,000원\n② 1,300,000원\n③ 1,500,000원\n④ 1,550,000원", "answer": 4}, {"year": "2025", "month": "3", "qnum": 83, "text": "[83]두 개의 제조부문과 두 개의 보조부문으로 이루어진 ㈜삼일의 부문간 용역수수에 관련된 자료는 다음과\n같다. 상호배분법을 사용할 경우 도료부문에 배분되는 보조부문의 원가는 얼마인가(단, 소수점 첫째자\n리에서 반올림한다)?\n용역사용부문 보조부문 제조부문\n용역제공부문 창고부문 전력부문 조각부문 도료부문\n창고부문의 제공용역 - 40 % 30 % 30 %\n전력부문의 제공용역 20 % - 50 % 30 %\n발생원가 200,000 800,000\n① 391,304원\n② 404,348원\n③ 595,652원\n④ 956,522원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 84, "text": "[84]다음 중 보조부문원가를 제조부문에 배분하는 목적으로 옳지 않은 것은?\n① 보조부문원가를 제품원가에 포함시킴으로써 이익을 크게 보고하기 위하여\n② 제품 가격의 정당성을 확보하기 위하여\n③ 종업원에게 동기를 부여하는 한편, 성과평가의 기준으로 활용하기 위하여\n④ 외부보고 목적의 재무제표 작성을 위하여", "answer": 1}, {"year": "2025", "month": "3", "qnum": 85, "text": "[85]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배부한다.\n20X1년의 제조간접원가배부율은 X부문에 대해서는 50 % , Y부문에 대해서는 40 % 이다. 제조지시서\n#105와 관련된 기초재공품은 800,000원이며, 당기 중 판매가 완료되었다. 원가 발생액과 관련된 자료\n가 다음과 같은 경우 제조지시서 #105와 관련하여 당기 손익계산서에 반영될 매출원가는 얼마인가?\n< #105 >\n구 분 X부문 Y부문 합 계\n직접재료원가 700,000원 500,000원\n직접노무원가 1,000,000원\n제조간접원가 200,000원\n합 계\n① 2,900,000원\n② 3,000,000원\n③ 3,900,000원\n④ 4,200,000원", "answer": 4}, {"year": "2025", "month": "3", "qnum": 86, "text": "[86]다음 중 일반적인 개별원가계산절차를 나열한 것으로 옳은 것은?\nㄱ. 집계된 제조간접원가를 배부하기 위한 배부기준을 설정한다.\nㄴ. 원가집적대상이 되는 개별작업을 파악한다.\nㄷ. 원가배부기준에 따라 제조간접원가 배부율을 계산하여 개별작업에 배부한다.\nㄹ. 개별작업에 대한 제조직접원가를 계산하여 개별작업에 직접 추적한다.\nㅁ. 개별작업에 직접 대응되지 않는 제조간접원가를 파악한다.\n① ㄱ-ㄴ-ㄷ-ㄹ-ㅁ\n② ㄴ-ㄱ-ㄹ-ㅁ-ㄷ\n③ ㄴ-ㄹ-ㅁ-ㄱ-ㄷ\n④ ㄴ-ㄹ-ㄱ-ㅁ-ㄷ", "answer": 3}, {"year": "2025", "month": "3", "qnum": 87, "text": "[87]㈜삼일은 기계가동시간을 기준으로 제조간접원가를 예정배부하고 있으며 연간 제조간접원가는\n5,000,000원으로, 연간 기계가동시간은 5,000시간으로 각각 예상하고 있으나 실제 기계가동시간은\n4,000시간이 발생하였다. 실제 제조간접원가가 5,000,000원이 발생한 경우 #A의 예정배부와 실제배\n부의 제조간접원가 차이는 얼마인가?\n#A #B 계\n예상기계가동시간 2,600시간 2,400시간 5,000시간\n실제기계가동시간 2,400시간 1,600시간 4,000시간\n① 300,000원\n② 400,000원\n③ 500,000원\n④ 600,000원", "answer": 4}, {"year": "2025", "month": "3", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳은 것은?\n① 특정 작업에 대한 예정배부액은 해당 작업의 실제조업도에 예정배부율을 곱하여 산정한다.\n② 직접재료원가는 실제원가로 측정하지만 노무원가와 제조간접원가는 예정배부된 원가로 측정한다.\n③ 개별원가계산을 적용하는 기업의 경우 각 작업별로 실제원가에 기반한 기초원가를 계산한 이후에 제\n조간접원가에 대한 예정배부율을 결정한다.\n④ 실제원가와 예정배부액 간에 차이가 발생하였다면 외부 보고용 재무제표를 작성하기 위한 조정이 필\n요하며 이 때 부족배부액은 매출원가로, 초과배부액은 기타수익으로 각각 인식한다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 97, "text": "[97]다음 중 변동원가계산의 한계에 관한 설명으로 옳지 않은 것은?\n① 일반적으로 인정된 회계원칙은 아니므로 외부보고용 회계정보로 활용될 수 없다.\n② 원가행태의 구분이 현실적으로 쉽지 않다.\n③ 고정원가의 중요성을 간과할 수 있어 가격결정과 관련된 잘못된 의사결정을 할 수 있다.\n④ 공통적인 고정원가를 부문이나 제품에 배부하므로 부문별, 제품별 의사결정 문제에 왜곡을 초래할\n수 있다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 98, "text": "[98]20X1년 ㈜삼일은 신제품 A를 700단위 생산하였는데 이에 대한 단위당 변동원가는 6원이고 총 고정원\n가는 1,400원이다. 20X1년에 신제품에 대한 기초재고액은 없었으며 기말재고 수량이 100단위일 경우,\n전부원가계산방법 대신에 변동원가계산방법을 적용한다면 20X1년 12월 31일의 기말재고액은 전부원가\n계산방법에 비해 얼마나 변동할 것인가?\n① 100원 증가\n② 100원 감소\n③ 200원 증가\n④ 200원 감소", "answer": 4}, {"year": "2025", "month": "3", "qnum": 99, "text": "[99]㈜삼일의 당기 변동원가계산에 관한 자료를 이용하여 총매출액을 계산하면 얼마인가?\n제품 단위당 판매가격 9,200원\n단위당 변동원가 4,900원\n단위당 고정제조원가 300원\n총고정원가 2,150,000원\n영업이익 10,750,000원\n① 18,400,000원\n② 27,000,000원\n③ 27,600,000원\n④ 29,670,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 103, "text": "[103]다음 중 CVP분석의 기본가정으로 옳지 않은 것은?\n① 모든 원가는 변동원가와 고정원가로 분류할 수 있다.\n② 복수제품의 경우 매출배합이 변동한다.\n③ 재고자산이 손익에 영향을 미치지 않는다.\n④ 수익과 원가의 행태는 관련범위 내에서 선형이다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 104, "text": "[104]다음은 원가·조업도·이익(CVP)분석과 관련된 신문기사이다. ( ㄱ )과 ( ㄴ )은 각각 얼마인가\n(단, 한 달은 30일로 가정한다)?\n“월세 1억 원 내는 커피숍 하루 ( ㄱ ) 이상 팔아야 남는다”\n서울 강남역 인근에 위치한 커피전문점 OO카페 강남역점의 인건비와 임차료 등의 월 평균 고정원가\n는 1억 9천 2백만원이다. 점포전문 포털 점포라인과 커피전문점 업계에 따르면 매장면적에 따라\n인건비 비중이 다르지만 최소 하루 매출이 ( ㄴ ) 이 되어야 손익분기점을 맞출 수 있는 것으로\n나타났다. 이는 4,000원짜리 커피를 하루 ( ㄱ ) 판매해야 달성할 수 있다는 의미이다. 커피 한\n잔의 평균 변동원가는 잔당 800원이다.\nㄱ ㄴ\n① 1,600잔 400만원\n② 1,600잔 800만원\n③ 2,000잔 400만원\n④ 2,000잔 800만원", "answer": 4}, {"year": "2025", "month": "3", "qnum": 107, "text": "[107]다음은 ㈜삼일의 20X1년 이익중심점의 통제책임이 있는 A사업부의 공헌이익 손익계산서이다. A사업부\n의 성과평가목적에 가장 적합한 이익은 얼마인가?\n매 출 액 5,000,000원\n변 동 원 가 2,000,000원\n공 헌 이 익 3,000,000원\n추적가능·통제가능고정원가 500,000원\n사업부경영자공헌이익 2,500,000원\n추적가능·통제불능고정원가 500,000원\n사업부공헌이익 2,000,000원\n공통고정원가배분액 400,000원\n법인세비용차감전순이익 1,600,000원\n법인세비용 600,000원\n순 이 익 1,000,000원\n① 1,000,000원\n② 2,000,000원\n③ 2,500,000원\n④ 3,000,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 113, "text": "[113]㈜삼일은 여러 사업부를 운영하고 있는 기업이며, 20X1년의 당기순이익은 1,200,000원이다. 여러 사\n업부 중에서 사업부 갑의 공헌이익은 450,000원이고, 사업부 갑에 대한 공통원가 배분액은 100,000원\n이다. 공통원가배분액 중 80,000원은 사업부 갑을 폐지하더라도 계속하여 발생하는 것이다. 회사가 사\n업부 갑을 폐지할 경우 20X1년 당기순이익을 계산하면 얼마인가?\n① 700,000원\n② 730,000원\n③ 770,000원\n④ 800,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 119, "text": "[119]㈜삼일은 당기에 가격탄력성이 높고 고정원가의 비율이 높은 신제품을 출시하면서 초기에 높은 시장점\n유율을 얻기 위한 방향으로 해당 제품의 가격을 결정하고자 한다. 다음 중 가장 적합한 특별가격 결정\n방법은 무엇인가?\nⓛ 입찰가격\n② 약탈적가격\n③ 시장침투가격\n④ 상층흡수가격", "answer": 3}, {"year": "2025", "month": "5", "qnum": 82, "text": "[82]다음은 ㈜삼일의 20X1년 한 해 동안의 제조원가 자료이다. ㈜삼일의 20X1년 제조원가명세서상의 당기\n제품제조원가를 계산하면 얼마인가?\n기초 기말\n직접재료 5,000원 7,000원\n재공품 10,000원 14,000원\n제 품 15,000원 10,000원\n직접재료 매입액 25,000원\n기초원가 40,000원\n가공원가 35,000원\n① 54,000원\n② 64,000원\n③ 68,000원\n④ 70,000원", "answer": 1}, {"year": "2025", "month": "5", "qnum": 83, "text": "[83]다음 중 보조부문과 제조부문을 포함한 원가배분의 절차에 관한 설명으로 옳은 것은?\n① 부문공통원가의 배분은 공통적으로 발생한 원가를 회사의 각 부문에 배분하는 과정이다.\n② 보조부문원가의 배분은 보조부문에 집계되거나 보조부문이 배분받은 공통원가를 판매부문에 배분하\n는 과정이다.\n③ 제조간접원가의 배부는 제조부문에 집계된 원가를 제품제조원가와 판매비와관리비로 배부하는 과정\n이다.\n④ 제품원가계산은 제품별로 집계된 제조원가를 기초로 매출액과 기말 재고자산가액을 산출하는 과정이\n다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 84, "text": "[84]㈜삼일의 보조부문인 전력부문에서 발생한 변동원가는 24,000원이고 고정원가는 20,000원이었다. 전력\n부문은 제조부문인 절단부문과 조립부문에 용역을 공급하고 있으며, 각 제조부문의 실제사용시간 및 최\n대사용시간은 다음과 같다. 사용시간을 배분기준으로 하여 이중배분율법을 적용하는 경우 절단부문에\n배분되는 전력부문의 원가는 얼마인가?\n구 분 절단부문 조립부문\n실제사용시간 500 h 500 h\n최대사용시간 1,000 h 1,500 h\n① 20,000원\n② 24,000원\n③ 25,000원\n④ 30,000원", "answer": 1}, {"year": "2025", "month": "5", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산제도를 채택하고 있으며, 제품 A의 작업원가표가 아래와 같을 때 제조간접원가배\n부율(직접노동시간당)을 계산하면 얼마인가?\nㄱ. 직접재료 투입액 100,000원\nㄴ. 직접노동시간 200시간\nㄷ. 직접노무원가 임률 800원 / 시간\nㄹ. 제품 A의 제조원가 460,000원\n① 500원\n② 750원\n③ 800원\n④ 1,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 87, "text": "[87]다음 중 제조간접원가의 배부에 관한 설명으로 옳지 않은 것은?\n① 제조부문에서 발생하는 감독자의 급료, 공장 건물에 대한 재산세 및 감가상각비 등과 같이 제품과의\n직접적인 관련성을 찾기가 어려운 제조간접원가는 제품원가로 부과하기 위한 배부절차가 필요하다.\n② 모든 제조간접원가를 하나의 원가집합(공장전체)에 집계하고 단일의 배부기준을 사용하여 배부하는\n방법을“공장전체 제조간접원가 배부율”이라고 한다.\n③ 제조간접원가를 복수의 원가집합(제조부문)에 집계하고, 제조부문별로 서로 다른 배부기준을 사용하\n여 각각 배부하는 방법을“부문별 제조간접원가 배부율”이라고 한다.\n④ 공장전체 제조간접원가 배부율은 공장전체 제조간접원가를 부문별 배부기준으로 나눠서 구하며, 부\n문별 제조간접원가 배부율을 적용하는 경우보다 더 정확한 제조간접원가 배부가 이루어진다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 95, "text": "[95]다음 중 표준원가계산에서 원가차이의 처리방법인 매출원가조정법에 관한 설명으로 옳지 않은 것은?\n① 매출원가조정법에서는 재공품과 제품계정은 모두 표준원가로 기록된다.\n② 불리한 원가차이는 매출원가에 차감하고 유리한 원가차이는 매출원가에서 가산한다.\n③ 매출원가조정법은 모든 원가차이를 매출원가에 가감하여 차이를 조정하는 방법이다.\n④ 매출원가조정법 대신 비례배분법을 사용하면 실제원가계산제도의 금액에 근접할 수 있다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 96, "text": "[96]다음 중 변동원가계산의 유용성에 관한 설명으로 옳지 않은 것은?\n① 이익계획과 예산편성에 필요한 원가－조업도－이익에 관련된 자료를 변동원가계산제도에 의한 공헌\n손익계산서로부터 쉽게 얻을 수 있다.\n② 원가통제와 성과평가에 유용하게 활용될 수 있다.\n③ 공통적인 고정원가를 제품에 배분하기 때문에 제품별 의사결정 문제에 왜곡을 초래하지 않는다.\n④ 이익이 매출액과 동일한 방향으로 움직이므로 경영자의 입장에서 이해하기 쉽다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 99, "text": "[99]㈜삼일은 12월 중 아래 영업자료를 참고하여 전부원가계산과 변동원가계산에 의한 순이익을 비교하고\n있다. 전부원가계산의 영업이익이 변동원가계산에 비해 75,000원 만큼 크다면 판매량은 몇 개인가?\n생산량 2,500개 판매량 ?\n고정제조원가 375,000원 고정판매관리비 75,000원\n(단, 월초재고와 기말재공품 재고는 없음)\n① 1,500개\n② 1,600개\n③ 1,800개\n④ 2,000개", "answer": 4}, {"year": "2025", "month": "5", "qnum": 103, "text": "[103]다음 중 CVP분석에 필요한 가정에 관한 설명으로 옳은 것은?\n① 화폐의 시간가치를 고려하는 분석 방법이다.\n② 모든 원가는 변동원가와 고정원가로 분류할 수 없다.\n③ 제품의 종류가 복수인 경우에는 판매량 변화에 따라 매출의 배합이 변동한다고 가정한다.\n④ 생산량과 판매량이 같다고 가정함으로써 기초재고자산과 기말재고자산의 변화가 손익에 영향을 미\n치지 않는 것으로 본다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 104, "text": "[104]㈜삼일의 제품 단위당 판매가격과 원가자료는 다음과 같다.\n단위당 판매가격 500원\n단위당 직접재료원가 90원\n단위당 직접노무원가(모두 변동원가) 60원\n단위당 변동제조간접원가 70원\n단위당 변동판매비와관리비 30원\n연간 고정원가 800,000원\n㈜삼일이 영업이익 450,000원을 달성하기 위한 판매량은 얼마인가(단, 법인세 효과는 고려하지 않는\n다)?\n① 4,000 단위\n② 5,000 단위\n③ 6,000 단위\n④ 7,000 단위", "answer": 2}, {"year": "2025", "month": "5", "qnum": 105, "text": "[105]㈜삼일의 20X1년도 영업이익은 100,000원이고 영업레버리지도(DOL)는 4이다. 만일 경기호황으로 인하\n여 20X2년도 판매량이 20 % 증가한다면 영업이익은 얼마가 될 것으로 예상되는가(단, 20X1년과 20X2\n년의 단위당 판매가격, 단위당 변동원가, 총고정원가는 동일하다고 가정한다)?\n① 120,000원\n② 140,000원\n③ 180,000원\n④ 240,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 113, "text": "[113]매월 1,000단위의 제품을 생산하는 ㈜삼일의 단위당 판매가격은 700원이고 단위당 변동원가는 500원\n이며 고정원가는 월 300,000원이다. ㈜삼일은 ㈜용산으로부터 400단위의 특별주문을 받았다. 현재 유\n휴설비능력은 특별주문 수량보다 부족한 상황이며, 특별주문을 수락할 경우 주문 처리를 위한 비용\n900원이 추가로 발생한다. 다음 중 특별주문에 대한 의사결정을 함에 있어 관련항목으로만 구성된 것\n은 어느 것인가(단, 특별주문을 수락하더라도 고정원가총액의 변동은 없다)?\n① 특별주문가, 단위당 변동원가, 특별주문 처리비용, 기존판매량 감소분의 공헌이익\n② 특별주문 수락 전의 단위당 고정원가, 단위당 변동원가, 특별주문 처리비용\n③ 특별주문 수락 후의 단위당 고정원가, 특별주문 처리비용, 기존판매량 감소분의 공헌이익\n④ 특별주문가, 특별주문 처리비용, 특별주문 수락 후의 단위당 고정원가, 기존판매량 감소분의 공헌\n이익", "answer": 1}, {"year": "2025", "month": "5", "qnum": 114, "text": "[114]㈜삼일은 최근 고객사로부터 제품 400단위를 단위당 19,000원에 구입하겠다는 제안을 받았다. 이 주\n문의 수락여부와 회사의 이익에 미치는 영향으로 옳은 것은(단, 제품과 관련된 자료는 다음과 같으며\n동 주문을 수락하더라도 고정원가에는 아무런 영향을 초래하지 않으며, 유휴설비능력이 존재한다)?\n제품단위당 원가\n직접재료원가 11,000원\n직접노무원가(변동원가) 4,000원\n변동제조간접원가 2,500원\n고정제조간접원가 3,000원\n변동판매비와관리비 500원\n고정판매비와관리비 1,000원\n22,000원\n① 수락, 400,000원의 이익 증가\n② 수락, 800,000원의 이익 증가\n③ 거절, 400,000원의 손실 증가\n④ 거절, 800,000원의 손실 증가", "answer": 1}, {"year": "2025", "month": "5", "qnum": 119, "text": "[119]㈜삼일의 A사업부는 LED를 생산하고 있으며, 연간 생산능력은 100,000단위이다. ㈜삼일의 A사업부\n수익과 원가자료는 다음과 같다. ㈜삼일은 텔레비전을 생산하는 B사업부도 보유하고 있다. B사업부는\n현재 연간 10,000단위의 LED를 단위당 400원에 외부에서 조달하고 있다. A사업부는 생산하는 LED제\n품 전량을 외부시장에 판매할 수도 있고 사내대체시 단위당 변동원가 50원을 절감할 수 있다. A사업\n부의 이익을 극대화시키기 위해 A사업부가 내부대체를 허용할 수 있는 LED의 단위당 최소대체가격은\n얼마인가?\n단위당 외부판매가격 430원\n단위당 변동원가 250원\n단위당 고정원가(연간 100,000단위 기준) 12원\n① 230원\n② 242원\n③ 370원\n④ 380원", "answer": 4}, {"year": "2025", "month": "6", "qnum": 81, "text": "[81]원가는 경영자의 의사결정 목적에 따라 다음과 같이 여러 가지로 분류할 수 있다. 다음 중 원가 분류가\n옳게 짝지어진 것은?\nㄱ. 원가행태에 따른 분류\nㄴ. 추적가능성에 따른 분류\nㄷ. 의사결정과의 관련성에 따른 분류\nㄹ. 통제가능성에 따른 분류\nA. 직접원가와 간접원가\nB. 변동원가와 고정원가\nC. 관련원가와 매몰원가\nD. 미소멸원가와 소멸원가\n원가의 분류 원가 종류\n① ㄱ D\n② ㄴ A\n③ ㄷ B\n④ ㄹ C", "answer": 2}, {"year": "2025", "month": "6", "qnum": 82, "text": "[82]다음은 ㈜삼일의 20X1년 1분기 제조원가명세서이다. 다음 중 아래의 (ㄱ)과 (ㄴ)에 들어갈 금액의 합\n계액은?\n제조원가명세서\n20X1년 1월 1일 ~ 20X1년 3월 31일\nㄱ. 재료원가 4,000,000원\n가. 기초재고액 600,000원\n나. 당기매입액 6,300,000원\n다. 기말재고액 (ㄱ)\nㄴ. 노무원가 1,800,000원\nㄷ. 제조경비 3,000,000원\nㄹ. 당기총제조원가 8,800,000원\nㅁ. 기초재공품 1,000,000원\nㅂ. 기말재공품 (ㄴ)\nㅅ. 당기제품제조원가 9,200,000원\n① 3,500,000원\n② 3,800,000원\n③ 4,000,000원\n④ 4,400,000원", "answer": 1}, {"year": "2025", "month": "6", "qnum": 83, "text": "[83]다음 중 보조부문의 원가배분 방법에 관한 설명으로 옳지 않은 것은?\n① 직접배분법이란 보조부문 상호간에 행해지는 용역의 수수를 완전히 무시하고 보조부문의 원가를 배\n분하는 방법이다.\n② 상호배분법에서 특정보고부문의 배분할 총원가는 [자기부문의 발생원가 - 다른 부문으로부터 배분된\n원가] 이다.\n③ 단계배분법이란 보조부문원가의 배분순서를 정하여 그 순서에 따라 단계적으로 보조부문원가를 다른\n보조부문과 제조부문에 배분하는 방법이다.\n④ 단계배분법의 경우 보조부문간의 용역수수관계가 일부 인식되며, 보조부문간의 배분순위 결정이 부\n적절한 경우 원가배분 결과가 왜곡될 수 있다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 84, "text": "[84]㈜삼일은 보조부문(S1, S2)과 제조부문(P1, P2)을 이용하여 제품을 생산하고 있으며, 단계배분법을 사\n용하여 보조부문원가를 제조부문에 배분한다. 각 부문 간의 용역수수관계와 보조부문원가가 다음과 같\n을 때 P2에 배분될 보조부문원가를 계산하면 얼마인가(단, 보조부문원가는 S1, S2의 순으로 배분한\n다)?\n보조부문 제조부문\n구분 합계\nS1 S2 P1 P2\n부문원가 120,000원 180,000원 - -\nS1 - 25 % 50 % 25 % 100 %\nS2 20 % - 30 % 50 % 100 %\n① 112,250원\n② 147,250원\n③ 152,250원\n④ 161,250원", "answer": 4}, {"year": "2025", "month": "6", "qnum": 86, "text": "[86]㈜삼일은 일반형 자전거와 고급형 자전거 두 가지의 제품을 생산하고 있다. 12월 한 달 동안 생산한 두\n제품의 작업원가표는 아래와 같다.\n일반형 자전거 고급형 자전거\n직접재료 투입액 300,000원 600,000원\n직접노동시간 1,000시간 4,000시간\n직접노무원가 임률 100원/ 시간 200원/ 시간\n동 기간 동안 발생한 회사의 총제조간접원가는 2,000,000원이며, 제조간접원가는 직접노동시간을 기준\n으로 배부하고 있다. ㈜삼일은 실제 발생한 제조간접원가를 실제조업도에 의해 배부하는 원가계산방식\n을 채택하고 있다. 12월 한 달 동안 생산한 일반형 자전거의 제조원가는 얼마인가?\n① 500,000원\n② 600,000원\n③ 700,000원\n④ 800,000원", "answer": 4}, {"year": "2025", "month": "6", "qnum": 89, "text": "[89]㈜삼일은 단일공정에서 단일제품을 대량으로 생산하고 있다. 재료는 공정초기에 전량 투입되며, 가공원\n가는 공정 전반에 걸쳐 균등하게 발생한다.\nㄱ. 기초재공품 없음\nㄴ. 당기투입량 400,000 개\nㄷ. 당기완성량 320,000 개\nㄹ. 기말재공품 수량 80,000 개\n가공원가의 완성도 20 %\nㅁ. 당기투입원가 재료원가 4,000,000원\n가공원가 1,800,000원\n위의 자료를 이용하여 재료원가와 가공원가에 대한 완성품환산량을 구하면 얼마인가?\n재료원가 가공원가\n① 320,000개 400,000개\n② 400,000개 320,000개\n③ 400,000개 336,000개\n④ 400,000개 360,000개", "answer": 3}, {"year": "2025", "month": "6", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳지 않은 것은?\n① 정상원가계산은 실제원가계산 지연성 문제를 보완할 수 있다.\n② 정상원가계산에서 제조간접원가 예정배부율은 제조간접원가예산을 예정조업도로 나누어 계산한다.\n③ 정상원가계산에서 제조간접원가 예정배부는 특정작업의 예정조업도에 제조간접원가 예정배부율을 곱\n하여 계산할 수 있다.\n④ 정상원가계산에서 제조간접원가 실제발생액이 예정배부액보다 크다면 과소배부 되었다고 표현한다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 95, "text": "[95]다음 중 표준원가계산의 원가차이 처리방법에 관한 설명으로 옳은 것은?\n① 매출원가조정법을 사용하면 비례배분법을 사용하는 경우보다 당기순이익이 항상 크게 나타난다.\n② 비례배분법이란 원가차이를 매출원가와 재고자산 금액에 비례하여 배분하는 방법이다.\n③ 원가차이가 중요한 경우에는 반드시 매출원가 조정법을 적용해야 한다.\n④ 기타손익법으로 원가차이를 처리할 경우 영업이익에 영향을 미칠 수 있다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 96, "text": "[96]다음 중 변동원가계산 하의 손익계산서와 관련된 설명으로 옳지 않은 것은?\n① 매출액에서 변동제조원가만 차감하여 공헌이익을 구한다.\n② 고정제조간접원가는 공헌이익 산출에 포함되지 않는다.\n③ 고정제조간접원가는 기간원가로 처리한다.\n④ 판매비와관리비는 변동원가와 고정원가로 분리하여 작성한다.", "answer": 1}, {"year": "2025", "month": "6", "qnum": 97, "text": "[97]㈜삼일은 20X1년 1월 1일 영업을 개시하였으며, A제품을 50,000단위 생산하여 개당 600원에 모두 판\n매하였다. 20X1년 A제품의 제조원가에 관한 자료는 다음과 같다. 변동원가계산방법에 의한 A제품의 영\n업이익은 얼마인가?\n변동원가 고정원가\n직접재료원가 단위당 200원 -\n직접노무원가 단위당 80원 -\n제조간접원가 단위당 40원 8,000,000원\n① 6,000,000원\n② 8,000,000원\n③ 10,000,000원\n④ 14,000,000원", "answer": 1}, {"year": "2025", "month": "6", "qnum": 104, "text": "[104]㈜삼일의 제품생산에 관한 자료는 다음과 같다. 손익분기점 판매량은 얼마인가?\n제품단위당 판매가격 1,200원\n제품단위당 변동제조원가 600원\n제품단위당 변동판매비와관리비 175원\n고정제조간접원가 2,500,000원\n고정판매비와관리비 1,750,000원\n① 10,000개\n② 12,500개\n③ 13,000개\n④ 15,000개", "answer": 1}, {"year": "2025", "month": "6", "qnum": 108, "text": "[108]다음은 ㈜삼일이 생산하는 제품에 대한 단위당 표준원가 중 원재료에 관한 자료이다. ㈜삼일은 당기\n중 10,000개의 제품을 완성하였고, 기초재공품과 기말재공품은 없었다. 원재료의 실제사용량이 A가\n14,000 kg(kg당 ￦ 22)이고 B가 28,000 kg(kg당 ￦ 9)일 경우, 원재료(a) 배합차이와 (b) 수율차이는\n얼마인가?\n수량표준 가격표준\n원재료 A : 2 kg ￦ 20 / kg\n원재료 B : 3 kg ￦ 10 / kg\n① (a) 36,400 불리, (b) 120,000 유리\n② (a) 36,400 유리, (b) 120,000 불리\n③ (a) 28,000 불리, (b) 112,000 불리\n④ (a) 28,000 유리, (b) 112,000 유리", "answer": 4}, {"year": "2025", "month": "6", "qnum": 113, "text": "[113]㈜삼일의 사업부 X의 매출액은 300,000원, 변동원가는 280,000원이고 고정원가는 120,000원이다. 고\n정원가 중 50,000원은 회피가능원가에 해당한다. 만약 회사가 사업부 X를 폐지한다면 회사 전체 순이\n익은 어떻게 변화하겠는가?\n① 30,000원 감소\n② 30,000원 증가\n③ 80,000원 감소\n④ 80,000원 증가", "answer": 2}, {"year": "2025", "month": "7", "qnum": 81, "text": "[81]원가는 경영자의 활용 목적에 따라 다양하게 분류될 수 있다. 다음 중 ‘준고정원가’에 대한 설명으로\n옳은 것은?\n① 일정 범위의 조업도 내에서는 총원가가 일정하지만 조업도가 일정범위를 벗어나면 총원가가 계단 형\n태로 증가하거나 감소한다.\n② 조업도의 변동에 관계없이 총원가가 일정한 원가를 말하며, 이 때 단위당 원가는 조업도의 증가(감\n소)에 따라 감소(증가)한다.\n③ 예를 들어, 월 통신비가 기본요금 10,000원에 10초당 20원을 가산하여 부과된다면 이는 준고정원\n가에 해당한다.\n④ 조업도의 변동에 따라 총원가가 비례하여 변동하는 원가를 말하며, 이 때 단위당 원가는 조업도의\n변동에 관계없이 일정하게 나타난다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 82, "text": "[82]다음은 ㈜삼일의 원가관련 자료이다. 직접노무원가는 가공원가의 80 % 라고 할 때, ㈜삼일의 당기총제\n조원가는 얼마인가?\n직접재료원가 : 기초재고액 8,000원\n당기매입액 36,000원\n기말재고액 12,000원\n직접노무원가 : 전기말 미지급액 7,000원\n당기 현금지급액 66,000원\n당기말 미지급액 5,000원\n① 64,000원\n② 112,000원\n③ 134,000원\n④ 525,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 83, "text": "[83]다음은 원가배분에 관한 설명이다. 옳은 것은 모두 몇 개인가?\nㄱ. 원가배분은 공통원가를 일정한 기준에 따라 원가대상에 합리적으로 대응시키는 과정을 말한다.\nㄴ. 원가배분은 재고자산 및 매출원가의 금액을 산출하는 목적과는 무관하다.\nㄷ. 원가대상의 부담능력에 따라 원가를 배분하는 것은 가장 이상적인 원가배분기준이다.\nㄹ. 원가집합(cost pool)이란 원가대상에 직접적으로 추적할 수 없는 원가를 모아둔 것을 의미한다.\n① 1개\n② 2개\n③ 3개\n④ 4개", "answer": 2}, {"year": "2025", "month": "7", "qnum": 84, "text": "[84]㈜삼일은 A와 B의 두 제조부문이 있으며, 제조과정에서 필요한 설비의 수선을 할 수 있는 수선부문을\n보조부문으로 두고 있다. 두 제조부문의 최대사용가능시간은 A가 6,000시간이고 B가 4,000시간이며,\n실제로 사용한 수선시간은 A, B 모두 4,000시간이고, 수선부문의 고정원가는 8,000,000원, 변동원가는\n4,000,000원이다. 단일배부율법을 사용하는 경우에 이중배분율법을 사용하는 경우와 비교하여 제조부\n문A에 배부되는 수선부문원가는 얼마나 차이가 나는가?\n① 400,000원 더 적다.\n② 400,000원 더 많다.\n③ 800,000원 더 적다.\n④ 800,000원 더 많다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 85, "text": "[85]다음 중 일반적인 개별원가계산절차를 나열한 것으로 옳은 것은?\nㄱ. 집계된 제조간접원가를 배부하기 위한 배부기준을 설정한다.\nㄴ. 원가집적대상이 되는 개별작업을 파악한다.\nㄷ. 원가배부기준에 따라 제조간접원가 배부율을 계산하여 개별작업에 배부한다.\nㄹ. 개별작업에 대한 제조직접원가를 계산하여 개별작업에 직접 추적한다.\nㅁ. 개별작업에 직접 대응되지 않는 제조간접원가를 파악한다.\n① ㄱ - ㄴ - ㄷ - ㄹ - ㅁ\n② ㄴ - ㄱ - ㄹ - ㅁ - ㄷ\n③ ㄴ - ㄱ - ㅁ - ㄷ - ㄹ\n④ ㄴ - ㄹ - ㅁ - ㄱ - ㄷ", "answer": 4}, {"year": "2025", "month": "7", "qnum": 86, "text": "[86]다음 자료는 개별원가계산제도를 이용하여 원가계산을 하는 ㈜삼일의 작업 A101과 관련된 것이다.\n< 당기의 작업 A101 관련 작업원가표 >\n직접재료원가 직접노무원가 제조간접원가\n일자\n재료출고 작업시간\n금액 금액 배부율 배부금액\n청구서 NO. 보고서 NO.\n3월 1일 #1 140,000원 #1 45,000원\n800원 /\n150,000원\n시간\n3월 10일 #2 250,000원 #2 72,000원\n당기에 완성된 작업 A101의 기초재공품원가는 163,000원이다. 작업 A101의 당기제품제조원가는 얼마\n인가(단, 기말재공품원가는 없다고 가정한다)?\n① 507,000원\n② 657,000원\n③ 820,000원\n④ 970,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 87, "text": "[87]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배분한다.\n20X1년의 제조간접원가배부율은 200 % 이며, 제조지시서 #11과 관련된 총제조원가는 59,000원이다. 제\n조지시서 #11은 20X1년 중에 시작되어 완성되었으며, 원가 발생 세부내역은 다음과 같다. B부문 제조\n간접원가를 계산하면 얼마인가?\n< #11 >\n구분 A부문 B부문\n직접재료원가 8,000원 6,000원\n직접노무원가 6,000원 ( )\n제조간접원가 ( ) ( )\n① 18,000원\n② 20,000원\n③ 24,000원\n④ 28,000원", "answer": 1}, {"year": "2025", "month": "7", "qnum": 96, "text": "[96]다음 중 원가부착개념(cost attach concept)에 근거를 둔 원가계산에서 재고자산가액에 포함되는 항목\n을 모두 고르면?\nㄱ. 직접재료원가\nㄴ. 직접노무원가\nㄷ. 변동제조간접원가\nㄹ. 고정제조간접원가\nㅁ. 변동판매비와관리비\n① ㄱ\n② ㄱ,ㄴ,ㄷ\n③ ㄱ,ㄴ,ㄷ,ㄹ\n④ ㄱ,ㄴ,ㄷ,ㅁ", "answer": 3}, {"year": "2025", "month": "7", "qnum": 98, "text": "[98]㈜삼일의 12월 한 달간 변동원가계산에 대한 자료이다. 12월의 총매출액은 얼마인가?\n제품 단위당 판매가격 9,000원\n단위당 변동원가 4,700원\n총고정원가 2,150,000원\n영업이익 10,750,000원\n① 22,500,000원\n② 24,187,500원\n③ 27,000,000원\n④ 29,025,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 101, "text": "[101]다음 중 활동기준원가계산의 도입배경에 관한 설명으로 옳지 않은 것은?\n① 산업이 고도화됨에 따라 제조원가 중 제조간접원가가 차지하는 비중이 감소하였다.\n② 제조환경의 변화로 단일배부기준에 의한 원가의 배부가 원가의 왜곡현상을 초래하였다.\n③ 컴퓨터통합시스템의 도입으로 제조와 관련된 활동에 대한 원가를 수집하는 것이 용이해졌다.\n④ 최근에는 종전에 비해 원가개념이 확대되어 연구개발, 제품설계 등의 기타원가를 포함한 정확한 원\n가계산이 요구되었다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 103, "text": "[103]다음은 ㈜삼일의 원가·조업도·이익(CVP) 도표이다. 이에 관한 설명으로 옳지 않은 것은?\n수익\n수익\nㆍ\n비용\n비용\nB\nA\nC\n판매량\n① 점 A는 회사의 총고정원가를 나타낸다.\n② 점 B는 회사의 손익분기점을 나타낸다.\n③ C에서는 손실이 발생하며 이 구간에서는 제품 1단위를 판매할 때마다 손실이 증가한다.\n④ 회사의 단위당 판매가격은 단위당 변동원가보다 크다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 107, "text": "[107]다음은 ㈜삼일의 12월 예산 및 실제 성과와 관련한 자료이다. 자료를 바탕으로 매출조업도차이를 계산\n하면 얼마인가?\n실 제 예 산\n단위당 판매가격 100원 105원\n단위당 변동원가 54원 58원\n고정제조간접원가 755,000원 748,000원\n고정판매관리비 670,000원 650,000원\n판매량 47,000단위 50,000단위\n① 138,000원 불리\n② 138,000원 유리\n③ 141,000원 불리\n④ 141,000원 유리", "answer": 3}, {"year": "2025", "month": "7", "qnum": 112, "text": "[112]㈜삼일은 제품 제조에 필요한 일부 부품을 자가제조할 것인지 아니면 외부구입할 것인지에 대하여 의\n사결정 하고자 한다. 이와 관련하여 논의된 내용 중 옳은 것은?\n① 오주임 : 공급업자와의 관계와 같은 비재무적 측면도 반드시 고려되어야 합니다.\n② 박과장 : 외부구입을 선택할 경우 발생하는 유휴생산시설의 활용방안은 단기 의사결정에\n있어 영향을 미치지 않습니다.\n③ 이대리 : 자가제조원가 중 모든 고정원가를 제외한 변동원가만이 고려 대상이 됩니다.\n④ 유차장 : 제품에 특별한 지식이나 기술이 요구된다면 외부구입시 품질 유지가 어려울\n가능성이 높습니다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 114, "text": "[114]다음은 세 사업부문(A, B, C)을 보유한 ㈜삼일의 손익자료이다. 다음 중 자료에 관한 분석으로 옳지\n않은 것은?\n(단위 : 원)\nA사업부 B사업부 C사업부 전 체\n매 출 액 4,000 3,000 2,000 9,000\n변 동 원 가 2,400 2,000 1,200 5,600\n공 헌 이 익 1,600 1,000 800 3,400\n회피 불능 원가 1,900 1,200 400 3,500\n이 익 (손 실) (300) (200) 400 (100)\n① 사업부 A, B를 폐쇄하면 회사의 전체손실은 2,700원이 된다.\n② 사업부 B, C를 폐쇄하면 회사의 전체손실은 1,900원이 된다.\n③ 사업부 A, C를 폐쇄하면 회사의 전체손실은 2,500원이 된다.\n④ 사업부 A, B, C 모두를 폐쇄하면, 손실은 발생하지 않는다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 115, "text": "[115]㈜삼일의 생산 및 판매에 대한 자료는 다음과 같다.\n제품단위당 판매가격 80원\n제품단위당 변동제조원가 35원\n고정제조간접원가 400,000원\n고정판매비 200,000원\n연간 생산능력 20,000단위\n연간 판매량 15,000단위\n㈜삼일은 최근 고객사로부터 제품 3,000단위를 단위당 40원에 공급해 달라는 특별주문을 받았다. 동\n특별주문에 대하여 ㈜삼일이 취할 행동으로 옳은 것은(단, 특별주문 수락으로 인한 기존 판매수량 및\n판매가격에는 영향이 없으며, 변동판매비는 존재하지 않는다)?\n① 특별주문의 가격이 시장가격보다 낮으므로 주문을 거절하여야 한다.\n② 제품단위당 제조원가가 55원이므로 주문을 거절하여야 한다.\n③ 제안을 받아들일 경우 15,000원의 이익이 추가로 발생하므로 주문을 수락하여야 한다.\n④ 제안을 받아들일 경우 45,000원의 이익이 추가로 발생하므로 주문을 수락하여야 한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 119, "text": "[119]㈜삼일의 엔진사업부는 엔진을 생산하고 있으며 연간 생산능력은 100,000단위이고 수익과 원가자료는\n다음과 같다.\n단위당 외부판매가격 500원\n단위당 변동제조원가 270원\n단위당 변동판매관리비 20원\n단위당 고정제조원가(연간 100,000단위 기준) 50원\n단위당 고정판매관리비 30원\n㈜삼일은 자동차를 생산하는 완성차사업부도 보유하고 있다. 완성차사업부는 연간 10,000단위의 엔진\n을 단위당 490원에 외부에서 조달하고 있다. 엔진사업부가 유휴 생산시설이 없다면 사내대체를 허용할\n수 있는 엔진의 단위당 최소 대체가격은 얼마인가(단, 사내대체시 변동판매관리비는 발생하지 않음)?\n① 370원\n② 480원\n③ 490원\n④ 500원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 81, "text": "[81]다음 중 원가의 일반적인 특성에 관한 설명으로 옳지 않은 것은?\n① 기업의 수익획득 활동에 필요한 물품을 단순히 구입하는 것만으로 무조건 원가가 되지는 않으며 이\n를 소비해야 비로소 원가가 된다.\n② 원가는 정상적인 경제활동 과정에서 소비된 가치만을 포함하고 비정상적인 상황에서 발생한 가치의\n감소분은 포함하지 않는다.\n③ 경제적 가치를 가지고 있는 요소만이 원가가 될 수 있다.\n④ 원가성 없는 재고자산감모손실과 같이, 발생한 제조원가 중 수익획득에 기여하지 못하고 소멸된 부\n분은 비용으로서 매출원가로 분류된다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 82, "text": "[82]다음은 ㈜삼일의 당기 생산부문과 관련된 자료이다. 이 자료를 이용하여 물음에 답하시오.\n항목 금액 항목 금액 항목 금액\n급 여 310원 감가상각비 120원 기초재료재고 50원\n가스수도비 20원 특허사용료 2원 기말재료재고 40원\n복리후생비 35원 임 차 료 15원 기초재공품재고 65원\n수 선 비 10원 여비교통비 50원 기말재공품재고 70원\n퇴직급여 70원 보 험 료 4원 기초제품재고 30원\n통 신 비 4원 당기재료매입액 250원 기말제품재고 60원\n㈜삼일의 당기제품제조원가는 얼마인가(단, ㈜삼일은 복리후생비를 제조경비로 처리한다)?\n① 890원\n② 895원\n③ 900원\n④ 960원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 83, "text": "[83]공통원가를 일정한 배부기준에 따라 하나 또는 둘 이상의 원가대상에 합리적으로 대응시키는 원가배분\n(cost allocation)의 목적으로 옳지 않은 것은?\n① 보조부문원가를 제품원가에 포함시킴으로써 보고될 이익의 규모를 조정하기 위하여\n② 기업의 순이익 측정에 영향을 미치는 재고자산 가액과 매출원가를 정확히 산출하여 이해관계자들에\n게 합리적인 정보를 제공하기 위하여\n③ 합리적 원가배분을 통하여 적정가격을 설정함으로써 제품가격의 정당성을 확보하기 위하여\n④ 최적의 자원배분을 위한 경제적 의사결정과 관련된 원가정보 파악을 위하여", "answer": 1}, {"year": "2025", "month": "9", "qnum": 84, "text": "[84]두 개의 제조부문과 두 개의 보조부문으로 이루어진 ㈜삼일의 부문간 용역수수에 관련된 자료는 다음과\n같다.\n보조부문 제조부문\nA B C D\nA부문\n- 40 % 20 % 40 %\n용역제공\nB부문\n20 % - 60 % 20 %\n용역제공\n발생원가 200,000원 300,000원 450,000원 600,000원\n상호배분법을 사용할 경우 제조부문 D에 배분되는 보조부문의 원가를 계산하면 얼마인가(단, 계산 과정\n에서 발생하는 소수점 이하 숫자는 반올림한다)?\n① 140,000원\n② 165,000원\n③ 195,653원\n④ 208,333원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 85, "text": "[85]다음 중 개별원가계산의 장점에 관한 설명으로 옳지 않은 것은?\n① 제품별로 정확한 원가계산이 가능하다.\n② 제조간접원가의 배부문제가 없고 기장절차가 간단하므로 시간과 비용이 절약된다.\n③ 제품별 손익분석 및 계산이 비교적 용이하다.\n④ 작업원가표에 의해 개별 제품별로 효율성을 통제할 수 있고 개별 작업에 집계되는 실제원가를 예산\n액과 비교하여 미래예측에 이용할 수 있다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 86, "text": "[86]다음은 ㈜삼일의 20X1년 12월 원가자료이다. 회사는 직접노무원가를 기준으로 하여 제조간접원가를 예\n정배부하고 있다. 다음 자료에 따라 12월에 완성된 제품 #101의 제조원가를 계산하면 얼마인가(단, 기\n초 재고자산은 존재하지 않는 것으로 가정한다)?\nㄱ. 당월 제조간접원가 실제 발생총액 500,000원\nㄴ. 당월 직접노무원가 실제 발생총액 700,000원\nㄷ. 제조간접원가 예정배부율 직접노무비 1원당 \\ 0.5\nㄹ. 제품 #101의 직접원가 직접재료원가 104,000원\n직접노무원가 112,000원\n① 124,000원\n② 153,000원\n③ 272,000원\n④ 566,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 87, "text": "[87]다음은 개별원가계산제도를 이용하고 있는 ㈜삼일의 원가계산 자료이다. 제조간접원가는 기초원가\n(prime costs)를 기준으로 배부한다.\n원가항목 작업 #1 작업 #2 작업 #3 합계\n기초재공품 2,000원 4,000원 - 6,000원\n직접재료원가 2,800원 3,000원 2,200원 8,000원\n직접노무원가 4,000원 5,000원 3,000원 12,000원\n제조간접원가 ( ) ( ) ( ) 6,000원\n작업 #1과 작업 #3은 완성되었고, 작업 #2는 미완성되었다. ㈜삼일이 기말재공품으로 계상할 금액을\n계산하면 얼마인가?\n① 8,840원\n② 10,400원\n③ 10,840원\n④ 14,400원", "answer": 4}, {"year": "2025", "month": "9", "qnum": 88, "text": "[88]종합원가계산에서 완성품원가와 기말재공품원가는 일반적으로 다섯단계를 거쳐 계산된다. 종합원가계산\n의 절차로 옳은 것은?\nㄱ. 물량의 흐름 파악\nㄴ. 완성품환산량 단위당 원가계산\nㄷ. 배분할 원가 파악\nㄹ. 완성품환산량 계산\nㅁ. 완성품과 기말재공품에 원가배분\n① ㄱ → ㄹ → ㄷ → ㄴ → ㅁ\n② ㄱ → ㄷ → ㄹ → ㄴ → ㅁ\n③ ㄱ → ㄹ → ㄷ → ㅁ → ㄴ\n④ ㄴ → ㄹ → ㄷ → ㄱ → ㅁ", "answer": 1}, {"year": "2025", "month": "9", "qnum": 91, "text": "[91]다음은 ㈜삼일의 제조간접원가와 직접노무시간에 대한 자료이다. ㈜삼일은 예상제조간접원가를 예상직\n접노무시간으로 나눈 제조간접원가 배부율로 원가배분한다. 정상원가계산에 따른 제조간접원가 배부차\n이가 200,000원(과대배부) 발생했다면 실제 직접노무시간으로 옳은 것은?\n제조간접원가 직접노무시간\n예상 1,000,000원 1,000시간\n실제 600,000원 ?\n① 400시간\n② 600시간\n③ 800시간\n④ 1,000시간", "answer": 3}, {"year": "2025", "month": "9", "qnum": 96, "text": "[96]다음 중 변동원가계산제도에서의 회계처리방법에 관한 설명으로 옳은 것은?\n① 손익계산서에는 변동원가만이 포함되어 표시된다.\n② 고정원가는 전부 기간비용으로 처리한다.\n③ 매출액에서 변동제조원가와 고정제조원가를 차감하여 공헌이익을 계산한다.\n④ 제품원가에는 변동제조원가와 변동판매비와관리비가 포함된다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 100, "text": "[100]㈜삼일전자의 20X1년 제품 생산 및 판매와 관련된 자료는 다음과 같다. 전부원가계산에 의한 영업이익\n이 260,000원일 경우, 변동원가계산을 이용한 ㈜삼일전자의 20X1년 영업이익은 얼마인가(단, 기초 및\n기말재공품재고는 없다)?\n매출량(단위당 판매가격 200원) 3,000개\n기말제품재고량(단, 기초제품재고는 없다) 500개\n변동판매비와관리비 50,000원\n단위당 변동직접원가 60원\n단위당 변동제조간접원가 20원\n단위당 고정제조간접원가 5원\n단, 고정판매비와관리비는 발생하였으나 금액은 알 수 없다.\n① 250,000원\n② 257,500원\n③ 262,000원\n④ 알 수 없음", "answer": 2}, {"year": "2025", "month": "9", "qnum": 102, "text": "[102]다음 중 원가추정에 관한 설명으로 옳지 않은 것은?\n① 원가추정의 목적은 계획과 통제 및 의사결정에 유용한 미래원가를 추정하기 위함이다.\n② 원가추정은 조업도(종속변수)와 원가(독립변수) 사이의 관계를 규명하여 원가함수를 추정하는 것이\n다.\n③ 원가추정시 원가에 영향을 미치는 요인은 조업도 뿐이라고 가정한다.\n④ 원가추정시 관련범위에서 단위당 변동원가와 총고정원가가 일정하다고 가정한다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 104, "text": "[104]㈜삼일은 야구공을 제조하여 개당 10,000원에 판매하고 있다. 야구공 제조에 사용되는 변동원가는 개\n당 5,000원이고 고정원가는 한 달에 2,000,000원이다. ㈜삼일이 월간 1,200,000원의 세후이익을 얻기\n위해서는 월간 몇 개의 야구공을 생산·판매하여야 하는가(단, ㈜삼일은 20 % 의 단일 법인세율을 적\n용받는다)?\n① 592개\n② 640개\n③ 700개\n④ 775개", "answer": 3}, {"year": "2025", "month": "9", "qnum": 105, "text": "[105]20X1년에 ㈜삼일의 변동원가는 매출액의 60 % 였다. 20X2년에 경영자가 단위당 판매가격을 10 % 인상\n하였을 경우, 20X1년 대비 20X2년의 공헌이익증가율은(단, 판매량과 단위당 변동원가 및 고정원가는\n동일하다고 가정한다)?\n① 10 %\n② 15 %\n③ 20 %\n④ 25 %", "answer": 4}, {"year": "2025", "month": "9", "qnum": 114, "text": "[114]다음의 자료를 바탕으로 A제품라인의 폐지시 예상되는 증분이익을 계산하면 얼마인가?\n• ㈜삼일은 사무용품을 제조·판매하고 있으며, 제품생산을 위하여 A, B, C 제품제조라인을 운영하\n고 있다. 회사는 고정원가를 각 제품에 배분하는 기준으로 매출액을 사용하고 있다. 라인별 분석\n결과 A제품라인에서 100,000원의 순손실이 발생하여 A제품라인을 폐지할 것인지를 고려하고 있\n다.\n• A제품라인 당기 손익\n매출액 변동원가 공헌이익 고정원가 순이익(손실)\n1,000,000원 600,000원 400,000원 500,000원 (100,000원)\n• A제품라인의 폐지시 고정원가 중 400,000원이 회피가능하며, 유휴설비를 임대하여 당기에\n300,000원의 임대수익이 예상된다.\n① 100,000원\n② 200,000원\n③ 300,000원\n④ 400,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 119, "text": "[119]㈜삼일은 분권화된 사업부 갑과 을을 이익중심점으로 설정하고 있다. 사업부 갑에서 생산되는 제품 A\n는 사업부 을에 대체하거나 외부시장에 판매할 수 있으며, 관련 원가자료는 아래와 같다. 사업부 을은\n제품 A를 주요부품으로 사용하여 완제품을 생산하고 있으며, 공급처는 자유로이 선택할 수 있다. 현재\n사업부 갑은 500,000단위의 제품 A를 생산하여 전부 외부시장에 판매하고 있으며, 사업부 을에서는\n연간 300,000단위의 제품 A를 단위당 950원의 가격으로 외부공급업자로부터 구입하고 있다. 만일 사\n업부 갑이 제품 A를 사업부 을에 사내대체하여야 하고, 이 경우 단위당 80원의 판매비와관리비를 절\n감할 수 있다면 제품 A의 사내대체가격은 어느 범위에서 결정되겠는가(단, 단위당 내부대체품의 순실\n현가능가치는 950원보다 크다)?\n제품 A의 원가자료\n단위당 외부판매가격 1,000원\n단위당 변동원가 640원 (변동판매비와관리비 포함)\n연간 고정원가 100,000,000원\n연간 최대생산능력 500,000단위\n① 640 원과 870 원 사이\n② 870 원과 950 원 사이\n③ 920 원과 950 원 사이\n④ 950 원과 1,000 원 사이", "answer": 3}, {"year": "2025", "month": "11", "qnum": 81, "text": "[81]다음 설명과 관련된 원가회계 용어로 옳은 것은?\nㄱ. 직접적인 대응이나 간접적인 원가배분방법에 의한 원가측정을 통하여 원가가 집계\n되는 활동이나 항목\nㄴ. 이것에 대한 전통적인 예로는 제품, 부문 등이 있으나 최근에는 활동(activity),\n작업(operation) 등으로 다양화 되고 있음\n① 원가대상(cost object)\n② 원가집합(cost pool)\n③ 조업도(volume)\n④ 원가배분(cost allocation)", "answer": 1}, {"year": "2025", "month": "11", "qnum": 82, "text": "[82]다음 중 A, B에 해당하는 용어로 옳은 것은?\nA : 당기에 완성되어 제품으로 대체된 완성품의 제조원가\nB : 당기에 판매된 제품의 제조원가\nA B\n① 당기총제조원가 매출원가\n② 당기총제조원가 당기제품제조원가\n③ 당기제품제조원가 매출원가\n④ 기말제품재고 당기총제조원가", "answer": 3}, {"year": "2025", "month": "11", "qnum": 83, "text": "[83]다음 중 원가배분 기준에 관한 설명으로 옳지 않은 것은?\n① 부담능력기준은 원가대상이 원가를 부담할 수 있는 능력에 따라 원가를 배분하는 기준으로, 수익성\n이 높은 원가대상이 원가를 부담할 능력을 더 많이 가지고 있다는 가정 하에 원가를 배분하는 방법\n이다.\n② 인과관계기준은 원가대상과 배분대상원가 간의 인과관계에 따라 원가를 배분하는 기준으로, 예를 들\n어 그룹의 이미지를 향상시키기 위하여 지출한 광고선전비를 광고 후 일정기간 동안 그룹 내 각 기\n업의 매출증가액을 기준으로 배분하는 경우이다.\n③ 수혜기준은 원가배분대상이 공통원가로부터 제공받은 경제적 효익의 크기에 따라 원가를 배분하는\n기준으로, 수익자 부담의 원칙에 입각한 배분기준이다.\n④ 공정성과 공평성기준은 공정성과 공평성에 따라 공통원가를 원가배분대상에 배분해야 한다는 원칙을\n강조하는 포괄적인 기준이다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 84, "text": "[84]㈜삼일은 단계배분법을 이용하여 보조부문원가를 배분하고 있다. 다음의 자료를 이용하여 물음에 답하\n시오.\n사용부문 보조부문 제조부문\n합계\n제공부문 A B 갑 을\n부문원가 100,000원 35,000원 500,000원 650,000원 1,285,000원\nA － 15 % 40 % 45 % 100 %\nB 20 % － 35 % 45 % 100 %\n위의 자료에서 보조부문 B가 제조부문 을에 배분해야 하는 금액을 계산하면 얼마인가(단, 보조부문A의\n원가부터 배분한다)?\n① 17,375원\n② 21,875원\n③ 28,125원\n④ 30,425원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산제도를 채택하고 있으며, 직접노무원가를 기준으로 제조간접원가를 배분한다.\n20X1년의 제조간접원가 배부율은 A부문에 대해서는 150 %, B부문에 대해서는 50 % 이다. 제조지시서\n#04는 20X1년 중에 시작되어 완성되었으며, 원가 발생액은 다음과 같다. 제조지시서 #04와 관련된 총\n제조원가를 계산하면 얼마인가?\n제조지시서 #04 A부문 B부문\n직접재료원가 50,000원 10,000원\n직접노무원가 ? 30,000원\n제조간접원가 90,000원 ?\n① 225,000원\n② 255,000원\n③ 260,000원\n④ 290,000원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 87, "text": "[87]㈜삼일은 일반형 스마트폰과 프리미엄 스마트폰 두 종류의 제품을 생산하고 있다. 4월 한 달 동안 생산\n한 두 제품의 작업원가표는 아래와 같다.\n일반형 스마트폰 프리미엄 스마트폰\n직접재료 투입액 50,000원 70,000원\n직접노동시간 50시간 100시간\n직접노무원가 임률 1,000원 / 시간 2,000원 / 시간\n동 기간 동안 발생한 회사의 총제조간접원가는 1,500,000원이며, 제조간접원가는 직접노무원가를 기준\n으로 배부하고 있다. ㈜삼일은 실제 발생한 제조간접원가를 실제조업도에 의해 배부하는 원가계산방식\n을 채택하고 있다. 4월 한 달 동안 생산한 프리미엄 스마트폰과 일반형 스마트폰의 제조원가 차이는 얼\n마인가?\n① 1,070,000원\n② 1,170,000원\n③ 1,340,000원\n④ 1,500,000원", "answer": 1}, {"year": "2025", "month": "11", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳지 않은 것은?\n① 직접재료원가와 직접노무원가는 실제원가로 측정하지만 제조간접원가는 사전에 정해 놓은 제조간접\n원가 예정배부율에 의해 예정배부된 원가로 측정한다.\n② 제조간접원가의 배부가 기말까지 지연되어 제품원가계산이 지연되는 실제원가계산의 문제점을 보완\n하기 위한 원가계산제도이다.\n③ 제조간접원가 실제발생액이 제조간접원가 예정배부액보다 클 경우 이를 과대배부라고 한다.\n④ 제조간접원가 예정배부율에 의한 배부를 함으로써 특정 작업이 종료됨과 동시에 제품원가를 계산할\n수 있도록 하고 매월 제품원가가 제조간접원가 배부액에 따라 변동하지 않도록 하는 원가계산제도이\n다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 93, "text": "[93]다음 중 표준제조간접원가를 결정하기 위한 기준조업도와 관련된 내용으로 옳지 않은 것은?\n① 기준조업도와 제조간접원가의 발생 사이에는 인과관계가 존재하여야 한다.\n② 기준조업도는 물량 기준보다는 금액 기준으로 설정하는 것이 바람직하다.\n③ 기준조업도는 단순하고 이해하기 쉬워야 한다.\n④ 사전에 설정된 제조간접원가 예산을 기준조업도로 나누어 표준배부율을 계산한다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 97, "text": "[97]다음 중 변동원가계산에서 재고자산가액에 포함되는 원가항목을 옳게 나열한 것은?\n① 직접재료원가, 직접노무원가, 변동제조간접원가\n② 직접재료원가, 직접노무원가, 변동판매비와관리비\n③ 직접재료원가, 직접노무원가, 고정제조간접원가\n④ 직접재료원가, 변동판매비와관리비, 고정제조간접원가", "answer": 1}, {"year": "2025", "month": "11", "qnum": 99, "text": "[99]㈜삼일은 아래의 20X1년 12월 영업자료를 참고하여 전부원가계산과 변동원가계산에 의한 순이익을 비\n교하고 있다. 전부원가계산의 영업이익이 변동원가계산에 비해 45,000원만큼 크다면 당월 판매량은 몇\n개인가?\n생산량 2,000개 판매량 ?\n고정제조원가 300,000원 고정판매관리비 275,000원\n(단, 월초재고는 없음)\n① 1,400개\n② 1,500개\n③ 1,600개\n④ 1,700개", "answer": 4}, {"year": "2025", "month": "11", "qnum": 100, "text": "[100]㈜삼일의 초변동원가계산에 의한 영업이익이 7,000,000원이라고 할 때 아래의 자료를 이용하여 변동원\n가계산에 의한 영업이익을 구하면 얼마인가(단, 기초와 기말 재공품 재고는 존재하지 않으며, 각 원가\n항목별 단가의 변동은 없음을 가정한다)?\n기초제품재고수량 8,000개\n기말제품재고수량 7,000개\n제품단위당 고정제조간접원가 500원\n제품단위당 변동제조간접원가 300원\n제품단위당 직접노무원가 200원\n① 6,000,000원\n② 6,500,000원\n③ 7,000,000원\n④ 7,500,000원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 104, "text": "[104]다음은 단일 제품을 생산하여 판매하고 있는 ㈜삼일의 관련 자료이다.\n구분 20X1년 20X2년\n매출액 2,150,000원 2,500,000원\n제품단위당 변동원가 300원 365원\n총고정원가 469,000원 497,500원\n20X1년의 영업이익은 2,000원이고, 20X2년의 영업이익은 20X1년에 비해 25 % 증가하였을 때, 20X2년\n의 공헌이익률은 얼마인가?\n① 20 %\n② 22.5 %\n③ 25 %\n④ 27.5 %", "answer": 1}, {"year": "2025", "month": "11", "qnum": 105, "text": "[105]㈜삼일은 단위당 판매가격이 400원, 단위당 변동원가가 200원인 제품을 생산하여 판매하고 있다. 당\n기의 판매량은 10,000개이고, 총 고정원가는 1,500,000원이다. ㈜삼일의 안전한계율을 계산하면 얼마\n인가?\n① 25 %\n② 30 %\n③ 35 %\n④ 40 %", "answer": 1}, {"year": "2025", "month": "11", "qnum": 113, "text": "[113]㈜삼일은 흠집이 있는 제품 A를 4개 보유하고 있다. 흠집이 없는 정상적 제품 A의 판매가격은 4,000\n원이다. 제품A의 생산에는 단위당 변동제조원가 1,500원과 단위당 고정제조원가 2,100원이 투입되었\n다. 흠집이 있는 제품 A를 외부에 단위당 3,000원에 처분하려면 단위당 판매관리비가 300원이 소요될\n것으로 추정된다. 이 의사결정에 고려될 관련원가로 옳은 것은?\n① 정상판매가격 4,000원\n② 단위당 판매관리비 300원\n③ 단위당 변동제조원가 1,500원\n④ 단위당 고정제조원가 2,100원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 114, "text": "[114]㈜삼일은 A제품을 생산하여 판매하고 있다. ㈜삼일은 20X1년 중 기존고객에게 A제품을 900개 판매할\n것으로 예상하고 있으며, A제품과 관련된 자료는 다음과 같다.\n연간 최대 생산량 1,000개\n단위당 판매가격(기존고객) 1,500원\n단위당 변동제조원가 800원\n단위당 변동판매비와관리비 100원\n총 고정제조원가 272,000원\n총 고정판매비와관리비 68,000원\n20X1년초 ㈜삼일은 신규 고객으로부터 A제품 200개를 구매하겠다는 특별주문을 제안받았다. 특별주문\n수락 시 최대 생산량의 제약으로 인해 기존고객에 대한 판매량 중 100개를 감소시켜야 하며, 특별주문\n에 대해서 단위당 변동판매비와관리비는 발생하지 않는다. ㈜삼일의 이익 극대화를 위하여 특별주문에\n적용하여야 하는 단위당 최소판매가격은 얼마인가(단, 특별주문 수락이 기존 주문에 미치는 영향은 제\n시된 내용 외에는 없으며, 특별주문의 수락으로 인한 고정원가의 변동은 없는 것으로 가정한다)?\n① 900원\n② 1,100원\n③ 1,300원\n④ 1,500원", "answer": 2}, {"year": "2025", "month": "11", "qnum": 119, "text": "[119]제품의 판매가격 결정은 기업 전체에 영향을 미치므로 경영진의 중요한 의사결정 사항 중 하나로 여겨\n지고 있다. 다음 중 가격 결정에 영향을 미치는 요소들에 관한 설명으로 옳지 않은 것은?\n① 제품의 가격을 인하하면 수요가 증가하는 것이 일반적이지만, 수요의 변동이 없을 수도 있다.\n② 경제학에서는 한계수익과 한계비용이 일치하는 점에서 제품의 최적판매가격이 결정된다.\n③ 경쟁기업의 원가정보는 경쟁력 있는 가격을 설정하는데 가치있는 정보가 될 것이다.\n④ 제품에 대해 장기적인 정상가격을 결정할 때에는 고정원가를 포함한 모든 제조원가가 고려되어야\n하나, 고정판매비와관리비는 고려되지 아니한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 81, "text": "[81]경영자의 의사결정 목적에 따라 원가를 여러 가지로 분류할 수 있다. 다음 중 원가를 분류할 때의 분류\n방법과 그 내용에 관한 설명으로 옳지 않은 것은?\n① 원가의 행태에 따라 변동원가와 고정원가로 분류한다.\n② 추적가능성에 따라 직접원가와 간접원가로 분류한다.\n③ 원가의 통제가능성에 따라 통제가능원가와 회피불능원가로 분류한다.\n④ 수익과의 대응관계에 따라 제품원가와 기간원가로 분류한다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 82, "text": "[82]다음은 ㈜삼일의 20X1년 제조원가명세서이다. 아래의 (A)와 (B)에 들어갈 금액의 합계액을 계산하면 얼\n마인가?\n제조원가명세서\n㈜삼일 (단위 : 원)\nⅠ. 재료비 3,800,000\n기초재고액 500,000\n당기매입액 4,300,000\n기말재고액 (A)\nⅡ. 노무비 2,000,000\nⅢ. 제조경비 3,000,000\nⅣ. 당기총제조원가 8,800,000\nⅤ. 기초재공품 600,000\nⅥ. 기말재공품 (B)\nⅦ. 당기제품제조원가 9,000,000\n① 1,000,000원\n② 1,400,000원\n③ 1,600,000원\n④ 2,000,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 83, "text": "[83]다음 중 보조부문과, 해당 보조부문의 원가를 인과관계기준(cause and effect criterion)에 따라 제조\n부문으로 배분하기 위한 배분기준을 잘못 짝지은 것은?\n① 구매부문 - 점유면적\n② 전력부문 - 사용한 전력량 및 전기용량\n③ 수선유지부 - 수선횟수\n④ 식당부문 - 종업원수", "answer": 1}, {"year": "2025", "month": "12", "qnum": 84, "text": "[84]㈜삼일은 2개의 제조부문과 1개의 보조부문으로 구성되어 있다. 당기 중 보조부문에서 발생한 변동원\n가는 500,000원이고, 고정원가는 300,000원이었다. 보조부문에서는 두 개의 제조부문에 용역을 공급하\n고 있는데 각 제조부문이 실제 사용한 시간과 최대 사용 가능시간은 다음과 같다.\n제조 # 1부문 제조 # 2부문\n최대 사용 가능시간 800시간 700시간\n실제 사용한 시간 400시간 400시간\n제조 # 1부문에 배분될 보조부문의 원가는 얼마인가(단, 보조부문원가를 제조부문으로 배분할 때 이중\n배분율법을 사용한다고 가정한다)?\n① 390,000원\n② 410,000원\n③ 430,000원\n④ 450,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 86, "text": "[86]㈜삼일은 개별원가계산을 적용하고 있다. 작업 #A는 전기부터 작업이 진행되어 오고 있고, 작업 #B와\n#C는 당기에 착수되었다. 당기 중 작업 #A와 #B는 완성되었으나, 작업 #C는 미완성이다. 완성된 작업\n#A는 판매가 완료되었고, #B는 제품 재고로 전량 남아 있다. 당기 제조간접원가는 직접노무원가를 이\n용하여 배부한다. 다음 자료에 관한 설명으로 옳지 않은 것은?\n구분 작업 #A 작업 #B 작업 #C 합계\n기초재공품 원가 22,500원 - - 22,500원\n당기투입 원가\n직접재료원가 315,000원 125,000원 ? 525,000원\n직접노무원가 25,000원 ? ? 50,000원\n제조간접원가 ? 50,000원 ? 200,000원\n① 당기총제조원가는 775,000원이다.\n② 당기제품제조원가는 650,000원이다.\n③ 기말재공품원가는 147,500원이다.\n④ 매출원가는 447,500원이다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 87, "text": "[87]다음 자료를 읽고 문제에 답하시오.\nㄱ. ㈜삼일에는 두 개의 제조부문(A, B)이 있다. 다음은 당기의 자료이다.\nA부문 B부문 합 계\n제조간접원가 400,000원 640,000원 1,040,000원\n직접노무시간 2,000시간 8,000시간 10,000시간\nㄴ. 당기 중 착수하여 완성된 # 2052 작업의 원가자료는 다음과 같다.\nA부문 B부문 합 계\n직접재료원가 30,000원 20,000원 50,000원\n직접노무원가 20,000원 32,000원 52,000원\n직접노무시간 100시간 240시간 340시간\nㄷ. 회사는 직접노무시간을 기준으로 제조간접원가를 배부하고 있다.\n부문별 제조간접원가 배부율을 사용할 경우 # 2052의 가공원가는 얼마인가?\n① 87,300원\n② 89,700원\n③ 91,200원\n④ 93,400원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 91, "text": "[91]직접재료원가와 직접노무원가는 실제원가로, 제조간접원가는 사전에 전해놓은 예정배부율로 측정하는\n원가계산방법은 무엇인가?\n① 전부원가계산\n② 목표원가계산\n③ 표준원가계산\n④ 정상원가계산", "answer": 4}, {"year": "2025", "month": "12", "qnum": 98, "text": "[98]다음은 ㈜삼일의 20X1년 손익 관련 자료이다. 변동원가계산에 의한 ㈜삼일의 기말제품재고액과 영업이\n익을 계산하면 얼마인가?\n순매출액 15,000,000원 변동판매관리비 1,250,000원\n변동제조원가 6,750,000원 고정판매관리비 2,200,000원\n고정제조원가 2,500,000원 생산량 90,000단위\n판매량 70,000단위 기초제품재고 없음\n기말제품재고액 영업이익\n① 1,500,000원 3,100,000원\n② 1,500,000원 3,800,000원\n③ 2,000,000원 3,100,000원\n④ 2,000,000원 3,800,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 104, "text": "[104]다음은 단일 제품을 생산하여 판매하는 ㈜삼일의 20X1년 관련 자료 중 일부이다.\n매출액 : 3,600,000원 단위당 변동원가 : 30원 공헌이익률 : 40 %\n㈜삼일은 20X1년 중 손실도 이익도 보지 않았으며, 20X2년에 해당 제품의 단위당 판매가격, 판매량,\n그리고 단위당 변동원가의 수준에 변화가 없을 것으로 예상하고 있다. ㈜삼일의 20X2년 목표이익이\n500,000원이라면 20X2년의 고정원가 지출액은 얼마이어야 하는가(단, 법인세는 없는 것으로 가정한\n다)?\n① 750,000원\n② 940,000원\n③ 1,230,000원\n④ 1,440,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 105, "text": "[105]다음은 매출액과 영업이익이 동일한 ㈜삼일과 ㈜용산의 영업활동에 관한 자료이다.\n㈜삼일 ㈜용산\n매 출 액 500,000원 500,000원\n변동원가 300,000원 150,000원\n공헌이익 200,000원 350,000원\n고정원가 100,000원 250,000원\n영업이익 100,000원 100,000원\n다음 중 ㈜삼일과 ㈜용산의 영업레버리지에 관한 설명으로 옳지 않은 것은?\n① 영업레버리지도는 매출액이 증가함에 따라 점점 작아진다.\n② ㈜삼일의 경우 영업레버리지도는 2이다.\n③ ㈜용산의 경우 매출액이 500,000원 증가하면 영업이익은 450,000원으로 산출된다.\n④ 경기침체로 인해 매출액이 감소할 때 ㈜삼일의 영업이익 감소율이 ㈜용산의 영업이익 감소율보다\n크다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 109, "text": "[109]다음은 ㈜삼일의 판매부서 성과평가 관련 자료이다. ㈜삼일의 매출가격차이는 얼마인가?\n예산판매가격 3,500원 / 1단위\n예산변동원가 2,200원 / 1단위\n실제판매가격 3,200원 / 1단위\n예산매출수량 300단위\n실제매출수량 280단위\n① 84,000원(불리)\n② 84,000원(유리)\n③ 90,000원(불리)\n④ 90,000원(유리)", "answer": 1}, {"year": "2025", "month": "12", "qnum": 113, "text": "[113]매월 5,000단위의 제품을 생산하는 ㈜삼일의 단위당 판매가격은 700원이고 단위당 변동원가는 500원\n이며 고정원가는 월 300,000원이다. ㈜삼일은 ㈜용산으로부터 1,000단위의 비반복적 1회성 특별주문\n을 받았다. 현재 유휴설비능력은 특별주문 수량보다 부족한 상황이며, 특별주문을 수락할 경우 주문\n처리를 위한 비용 900원이 추가로 발생한다. 다음 중 특별주문에 대한 의사결정을 함에 있어 관련항목\n으로만 구성된 것은 어느 것인가?\n① 특별주문 수락 전의 단위당 고정원가, 단위당 변동원가, 특별주문 처리비용\n② 특별주문 수락 후의 단위당 고정원가, 특별주문 처리비용, 기존판매량 감소분의 공헌이익\n③ 특별주문가, 단위당 변동원가, 특별주문 처리비용, 기존판매량 감소분의 공헌이익\n④ 특별주문가, 특별주문 처리비용, 특별주문 수락 전의 단위당 고정원가, 기존판매량 감소분의 공헌\n이익", "answer": 3}, {"year": "2025", "month": "12", "qnum": 119, "text": "[119]㈜삼일은 A 사업부와 B 사업부로 구성되어 있다. B 사업부는 A 사업부에서 생산되는 부품을 가공하여\n완제품을 제조한다. B 사업부에서 부품 한 단위를 완제품으로 만드는데 소요되는 추가가공원가는 900\n원이며, 완제품의 단위당 판매가격은 2,000원이다. 부품의 외부시장가격이 단위당 1,400원인 경우, B\n사업부가 받아들일 수 있는 최대대체가격을 계산하면 얼마인가?\n① 500원\n② 600원\n③ 1,100원\n④ 1,400원", "answer": 3}], "02_개별원가계산·종합원가계산": [{"year": "2024", "month": "1", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳은 것은?\n① 개별원가계산은 동종의 제품을 반복적으로 생산하는 업종에 적합한 원가제도이다.\n② 개별원가계산은 제품별로 원가를 집계하기 때문에 간접원가의 구분은 중요하지 않다.\n③ 개별원가계산은 개별작업에 집계되는 실제원가와 예산을 비교하여 미래예측에 이용할 수 있다.\n④ 개별원가계산은 도 ․ 소매업, 화학산업, 조선업 등에 적합하다.", "answer": 3}, {"year": "2024", "month": "1", "qnum": 88, "text": "[88]다음 중 종합원가계산에 관한 설명으로 옳지 않은 것은?\n① 특정기간 동안 특정공정에서 가공된 제품은 원가측면에서 서로가 동일하다고 가정한다.\n② 원가의 집계는 개별작업별로 작업지시서를 통해 이루어진다.\n③ 종합원가계산의 원가요소별 단위당 원가는 완성품환산량에 기초하여 계산된다.\n④ 원가통제 및 성과평가는 개별 작업이 아닌 공정이나 부문별로 수행되는 것이 일반적이다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 89, "text": "[89]㈜삼일은 평균법을 이용한 종합원가계산제도를 채택하고 있다. 재료는 공정 초기에 전량 투입되며, 가\n공원가는 공정 전반에 걸쳐 균등하게 발생할 경우 당기완성품원가와 기말재공품원가는 각각 얼마인가?\n< 수량, 재공품 완성도 >\n기초재공품 200개(40 %) 완 성 품 900개\n착 수 량 800개 기말재공품 100개(20 %)\n< 원가 > 재료원가 가공원가\n기초재공품원가 200,000원 150,000원\n당기발생원가 800,000원 632,000원\n당기완성품원가 기말재공품원가\n① 1,666,200원 115,600원\n② 1,666,200원 117,560원\n③ 1,665,000원 168,000원\n④ 1,665,000원 117,000원", "answer": 4}, {"year": "2024", "month": "1", "qnum": 90, "text": "[90]㈜삼일은 선입선출법에 따라 종합원가계산을 하고 있다. 당월 완성품환산량 단위당 원가는 재료원가 5\n원, 가공원가 10원이며, 당월 중 생산과 관련된 자료는 다음과 같다. 재료는 공정초기에 전량 투입되\n고, 가공원가는 공정전반에 걸쳐 균등하게 발생한다고 할 때 ㈜삼일의 당월에 실제 발생한 가공원가를\n계산하면 얼마인가?\n기초재공품 500단위 (완성도 20 %)\n기말재공품 800단위 (완성도 75 %)\n당기완성품 4,200단위\n① 42,000원\n② 44,000원\n③ 47,000원\n④ 50,000원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 99, "text": "[99]발생한 원가가 미래의 동일한 원가의 발생을 방지할 수 없다면, 그 원가는 자산성을 인정할 수 없다는\n원가회피개념에 근거를 두고 있는 원가계산방법은 무엇인가?\n① 변동원가계산\n② 개별원가계산\n③ 정상원가계산\n④ 전부원가계산", "answer": 1}, {"year": "2024", "month": "3", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳지 않은 것은?\n① 수요자의 요구에 따라 개별적으로 제품을 생산하는 업종에서 주로 사용한다.\n② 간접원가의 배부 절차가 불필요하다.\n③ 개별작업에 집계되는 실제원가를 예산액과 비교하여 미래예측에 이용할 수 있다.\n④ 상대적으로 원가계산 자료가 상세하고 복잡하여 오류 발생 가능성이 높다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 89, "text": "[89]㈜삼일은 종합원가계산제도를 채택하고 있으며, 원재료는 공정의 초기에 전량 투입되고, 가공원가는 공\n정 전반에 걸쳐서 진척도에 따라 균등하게 발생한다. 재료원가의 경우 평균법에 의한 완성품환산량은\n22,000단위이고, 선입선출법에 의한 완성품환산량은 20,000단위이다. 또한 가공원가의 경우 평균법에\n의한 완성품환산량은 21,000단위이고, 선입선출법에 의한 완성품환산량은 20,400단위이다. 기말재공품\n이 2,000단위인 경우 기초재공품의 진척도는 몇 % 인가?\n① 10 %\n② 30 %\n③ 50 %\n④ 70 %", "answer": 2}, {"year": "2024", "month": "3", "qnum": 90, "text": "[90]㈜삼일은 평균법을 이용한 종합원가계산제도를 채택하고 있다. 원재료는 공정초기에 전량 투입되며, 가\n공원가는 공정전반에 걸쳐 발생한다. 당기 완성품원가와 기말재공품원가를 계산하면 얼마인가?\n<수량>\n기초재공품 80개(완성도 40 %) 당기완성품 400개\n당기투입량 420개 기말재공품 100개(완성도 40 %)\n<원가> 재료원가 가공원가\n기초재공품원가 8,000,000원 5,720,000원\n당기발생원가 32,260,000원 28,556,000원\n당기완성품원가 기말재공품원가\n① 63,368,000원 11,168,000원\n② 63,368,000원 15,842,000원\n③ 67,760,000원 12,266,000원\n④ 67,760,000원 16,940,000원", "answer": 1}, {"year": "2024", "month": "5", "qnum": 88, "text": "[88]다음 중 평균법과 선입선출법에 의한 종합원가계산의 차이점에 관한 설명으로 옳지 않은 것은?\n① 선입선출법은 완성품환산량 산출시 기초재공품의 기완성도를 고려한다.\n② 평균법의 완성품환산량 단위당 원가에는 전기의 원가가 포함되어 있다.\n③ 선입선출법의 원가배분대상액은 기초재공품원가와 당기투입원가의 합계액이다.\n④ 선입선출법은 완성품환산량 산출시 기초재공품과 당기투입량을 구분한다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 89, "text": "[89]㈜삼일은 평균법에 의한 종합원가계산시스템을 도입하고 있다. 직접재료는 공정의 초기에 전량 투입되\n고 가공원가는 공정 전반에 걸쳐 균등하게 발생된다. ㈜삼일은 원가계산을 위해 다음과 같은 자료를 수\n집하였다. 하기 자료를 이용하여 기말재공품 가공원가의 완성도를 계산하면 얼마인가?\n직접재료원가 완성품환산량 5,000개\n가공원가의 완성품환산량 4,550개\n당기완성품수량 3,500개\n① 50%\n② 60%\n③ 70%\n④ 80%", "answer": 3}, {"year": "2024", "month": "5", "qnum": 90, "text": "[90]다음은 ㈜삼일의 원가자료이다. 원재료는 공정시작 시점에서 전량 투입되고 가공원가는 공정전반에 걸\n쳐 균등하게 투입된다.\n< 수량 >\n기초재공품수량 500개(40 %) 완성수량 1,800개\n착수수량 2,000개 기말재공품수량 700개(60 %)\n평균법과 선입선출법을 적용하여 각각 종합원가계산을 하는 경우 두 방법의 가공원가 완성품환산량 차\n이는 얼마인가?\n① 평균법이 100개 더 크다.\n② 평균법이 100개 더 작다.\n③ 선입선출법이 200개 더 크다.\n④ 선입선출법이 200개 더 작다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 85, "text": "[85]다음 중 개별원가계산의 장점에 관한 설명으로 옳지 않은 것은?\n① 종합원가계산에 비하여 제조간접원가의 배부문제가 없고 기장절차가 간단하므로 시간과 비용이 절약\n된다.\n② 종합원가계산에 비해 상대적으로 보다 정확한 원가계산이 가능하다.\n③ 작업원가표에 의해 개별 제품별로 효율성을 통제할 수 있고 개별 작업에 집계되는 실제원가를 예산\n액과 비교하여 미래예측에 이용할 수 있다.\n④ 제품별 손익분석 및 계산이 비교적 용이하다.", "answer": 1}, {"year": "2024", "month": "6", "qnum": 88, "text": "[88]다음 중 종합원가계산에 관한 설명으로 옳은 것은?\n① 각 제품의 원가요소별 단위당 원가를 완성품환산량에 기초하여 계산한다.\n② 조선업, 기계제작업 등과 같이 수요자의 주문에 기초하여 제품을 생산하는 업종에서 주로 사용한다.\n③ 여러 종류의 제품을 주문에 의해 생산하거나 또는 동종의 제품을 일정 간격을 두고 비반복적으로 생\n산하는 업종에 적합한 원가계산제도이다.\n④ 제조과정에서 발생한 원가는 개별제품별로 작성된 작업원가표에 집계되므로 재공품원가를 집계하는\n것이 용이하다.", "answer": 1}, {"year": "2024", "month": "6", "qnum": 89, "text": "[89]㈜삼일은 선입선출법에 따라 종합원가계산을 하고 있다. 당월 완성품환산량 단위당 원가는 재료원가 10\n원, 가공원가 15원이며, 당월 중 생산과 관련된 자료는 다음과 같다.\n기초재공품 600단위 (완성도 40 %)\n기말재공품 700단위 (완성도 60 %)\n당기완성품 4,300단위\n재료는 공정초기에 전량 투입된다고 할 때 이 회사의 당월에 실제 발생한 재료원가는 얼마인가?\n① 43,600원\n② 44,000원\n③ 47,200원\n④ 50,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 90, "text": "[90]㈜삼일은 종합원가계산제도를 채택하고 있다. 원재료는 공정초기에 전량 투입되며, 가공원가는 공정 전\n반에 걸쳐 균등하게 발생한다. 평균법과 선입선출법에 의한 직접재료원가의 완성품환산량은 각각\n85,000단위와 73,000단위이다. 기초재공품의 완성도는 30 % 이고, 기말재공품의 완성도는 40 % 라면,\n기초재공품 수량은 몇 개인가?\n① 12,000개\n② 25,500개\n③ 36,000개\n④ 40,000개", "answer": 1}, {"year": "2024", "month": "7", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳지 않은 것은?\n① 원가계산 자료가 단순하고 명료하여 오류 발생 가능성이 낮다.\n② 간접원가의 배부 절차가 반드시 필요하다.\n③ 개별작업에 집계되는 실제원가를 예산액과 비교하여 미래예측에 이용할 수 있다.\n④ 수요자의 요구에 따라 개별적으로 제품을 생산하는 업종에서 주로 사용한다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 88, "text": "[88]다음 중 종합원가계산에 관한 설명으로 옳지 않은 것은?\n① 기초재공품이 없을 경우, 선입선출법에 의한 제품제조원가가 평균법에 의한 제품제조원가보다 적게\n나타난다.\n② 원가요소별 단위당 원가는 완성품환산량에 기초하여 계산된다.\n③ 원가관리 및 통제가 공정이나 부문별로 수행되므로 원가에 대한 책임중심점이 명확해진다.\n④ 동일한 과정을 거쳐서 생산된 제품은 동질적이기 때문에 각 제품의 단위당 원가도 동일하다고 가정\n한다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 89, "text": "[89]㈜삼일은 선입선출법을 이용한 종합원가계산제도를 채택하고 있다. 당월 완성품환산량 단위당 원가는\n재료원가 10원, 가공원가 5원이며, 당월 중 생산과 관련된 자료는 다음과 같다.\n기초재공품 500단위 (완성도 40 %)\n기말재공품 800단위 (완성도 50 %)\n당기완성품 4,200단위\n이 회사의 당월 실제 발생한 가공원가는 얼마인가(단, 재료원가는 공정초기에 전량투입되고 가공원가는\n공정전반에 걸쳐 균등하게 발생한다고 가정한다)?\n① 21,500원\n② 22,000원\n③ 22,500원\n④ 45,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 90, "text": "[90]㈜삼일은 평균법을 이용한 종합원가계산제도를 채택하고 있다. 재료는 공정초기에 전량 투입되며, 가공\n원가는 공정전반에 걸쳐 균등하게 발생한다. 당기 완성품원가와 기말재공품원가를 계산하면 얼마인가?\n<수량>\n기초재공품 80개(완성도 40 %) 당기완성품 400개\n당기투입량 420개 기말재공품 100개(완성도 40 %)\n<원가> 재료원가 가공원가\n기초재공품원가 8,000,000원 5,720,000원\n당기발생원가 32,260,000원 28,556,000원\n당기완성품원가 기말재공품원가\n① 63,368,000원 11,168,000원\n② 63,368,000원 15,842,000원\n③ 67,760,000원 12,266,000원\n④ 67,760,000원 16,940,000원", "answer": 1}, {"year": "2024", "month": "7", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳은 것을 모두 고르면?\nㄱ. 실제원가계산에 비하여 제품의 원가계산이 지연된다는 문제점이 있다.\nㄴ. 직접재료원가와 직접노무원가를 실제원가로 측정한다.\nㄷ. 원가계산제도를 실제원가계산, 정상원가계산, 표준원가계산으로 구분하는 것은 제품원가의\n구성항목에 따른 것이다.\n① ㄴ\n② ㄱ,ㄴ\n③ ㄴ,ㄷ\n④ ㄱ,ㄴ,ㄷ", "answer": 1}, {"year": "2024", "month": "7", "qnum": 92, "text": "[92]다음 중 표준 직접재료원가 결정에 관한 설명으로 옳지 않은 것은?\n① 표준 소비수량은 제품 생산에 필요한 각종 재료의 종류, 품질, 가공방법 등을 고려하여 결정한다.\n② 표준 직접재료비는 직접재료의 종류별로 제품 단위당 표준 소비수량과 표준 소비가격을 설정하고 이\n를 곱하여 산정한다.\n③ 표준 소비수량은 과학적·통계적 조사에 의하여 결정하여야 하며, 여기에 정상적인 공손 및 감손은\n제외한다.\n④ 표준 소비가격은 과거 및 현재의 시장가격과 장래에 예측되는 가격 동향이나 거래관습 등 제반 여건\n을 고려하여 결정한다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 88, "text": "[88]다음 종합원가계산의 특징 및 장단점에 대한 설명 중 옳은 것은 모두 몇 개인가?\nㄱ. 특정기간 동안 특정 공정에서 생산된 제품은 원가측면에서 서로가 동일하다고 가정한다.\n즉 제품원가를 평균개념에 의해서 산출한다.\nㄴ. 원가의 집계가 공정별로 이루어지는 것이 아니기 때문에 개별작업별로 작업지시서를 작성\n해야 한다.\nㄷ. 동일제품을 연속적으로 대량생산하지만 일반적으로 어떤 공정에 있어서든지 기말시점에서\n는 부분적으로 가공이 완료되지 않은 재공품이 존재하게 된다.\nㄹ. 원가통제와 성과평가가 공정별로 이루어지는 것이 아니라 개별작업별로 이루어진다.\nㅁ. 기장절차가 상대적으로 간단한 편이므로 시간과 비용이 절약된다는 장점이 있다.\n① 2개\n② 3개\n③ 4개\n④ 5개", "answer": 2}, {"year": "2024", "month": "9", "qnum": 89, "text": "[89]다음은 ㈜삼일의 원가자료이다. ㈜삼일은 평균법을 이용하여 종합원가계산을 하며, 원재료는 공정시작\n시점에서 전량 투입되고 가공원가는 공정 전반에 걸쳐 균등하게 투입된다.\n< 수량 >\n기초재공품수량 0개 완성수량 1,200개\n착수수량 2,000개 기말재공품수량 800개(50%)\n< 원가 >\n재료원가 가공원가\n당기발생원가 1,000,000원 800,000원\n㈜삼일의 (ㄱ) 재료원가와 (ㄴ) 가공원가의 완성품환산량 단위당 원가는 각각 얼마인가?\nㄱ ㄴ ㄱ ㄴ\n① 500원 500원 ② 500원 400원\n③ 625원 500원 ④ 625원 400원", "answer": 1}, {"year": "2024", "month": "9", "qnum": 90, "text": "[90]㈜삼일은 선입선출법을 이용한 종합원가계산을 한다. 원재료는 공정시작 시점에서 전량 투입되며, 가공\n원가는 공정 전반에 걸쳐 균등하게 발생한다. 만약 기말재공품의 완성도가 70 % 임에도 90 % 로 잘못\n파악하여 종합원가계산을 수행한다면 어떤 결과가 발생하는가?\n① 기말재공품의 원가가 과대계상된다.\n② 당기완성품의 완성품환산량이 과대계상된다.\n③ 완성품환산량 단위당 원가가 과대계상된다.\n④ 기말재공품의 완성품환산량이 과소계상된다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳은 것은?\n① 개별원가계산은 동종의 제품을 반복적으로 생산하는 업종에 적합한 원가제도이다.\n② 개별원가계산은 제품별로 원가를 집계하기 때문에 직접원가와 간접원가의 구분이 중요하다.\n③ 개별원가계산을 적용할 경우 개별작업에 집계되는 실제원가와 예산을 비교할 수 없다.\n④ 개별원가계산은 도 ․ 소매업, 화학산업, 조선업 등에 적합하다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 88, "text": "[88]㈜삼일은 평균법에 의한 종합원가계산을 채택하고 있다. 기초와 기말의 재공품 물량은 동일하나 기초에\n비하여 재공품 기말 잔액이 증가하였다. 다음 중 이 현상을 설명할 수 있는 것으로 옳은 것은?\n① 전년도에 비해 판매량이 감소하였다.\n② 기초보다 기말의 재공품 완성도가 감소하였다.\n③ 전년도에 비해 노무임률이 감소하였다.\n④ 전년도에 비해 제조간접원가가 증가하였다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 89, "text": "[89]제2공정에서 재료 X는 60 % 진행시점에서 투입되며 가공원가는 공정이 진행됨에 따라 균등하게 투입된\n다. 50 % 가 완료된 재공품의 완성품환산량에는 다음 중 어떤 원가가 포함되는가?\n재료원가 가공원가 재료원가 가공원가\n① 불포함 불포함 ② 불포함 포함\n③ 포함 불포함 ④ 포함 포함", "answer": 2}, {"year": "2024", "month": "11", "qnum": 90, "text": "[90]㈜삼일은 선입선출법에 따라 종합원가계산을 하고 있다. 당월 완성품환산량 단위당 원가는 재료원가 5\n원, 가공원가 10원이며, 당월 중 생산과 관련된 자료는 다음과 같다.\n기초재공품 200단위 (완성도 20 %)\n기말재공품 900단위 (완성도 80 %)\n당기완성품 3,500단위\n재료는 공정초기에 전량 투입된다고 할 때 이 회사의 당월에 실제 발생한 재료원가는 얼마인가?\n① 18,500원\n② 20,000원\n③ 21,000원\n④ 22,500원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 85, "text": "[85]㈜삼일의 박원가 회계팀장은 회사의 업무흐름을 더욱 투명하게 관리하고자 영업활동 Flowchart를 작성\n하고 있다. ㈜삼일이 개별원가계산을 채택하고 있을 때 ( ㄱ )과 ( ㄴ )에 각각 들어갈 내용으로 옳은\n것은?\n직접재료의 원가흐름\n생 재료출고요청 원재료계정\n산\n부\n회\n서 ( ㄱ ) 계정처리\n계\n부\n서\n창 재료출고 ( ㄴ )\n고\n부\n서\n청구서확인 송부 기장(입력)\nㄱ ㄴ ㄱ ㄴ\n① 재료원가표 작업시간표 ② 작업시간표 재료원가표\n③ 재료출고청구서 재료원가표 ④ 재료출고청구서 작업시간표", "answer": 3}, {"year": "2024", "month": "12", "qnum": 88, "text": "[88]다음 중 종합원가계산에 관한 설명으로 옳지 않은 것은?\n① 원가통제 및 성과평가는 개별 작업이 아닌 공정이나 부문별로 수행되는 것이 일반적이다.\n② 원가의 집계는 개별작업별로 작업지시서를 통해 이루어진다.\n③ 모든 생산공정이 원가계산기간 말에 종료되는 것은 아니므로, 기말 시점에는 공정에 따라 가공이 완\n료되지 않은 재공품이 존재할 수 있다.\n④ 특정기간 동안 특정공정에서 가공된 제품은 원가측면에서 서로가 동일하다고 가정한다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 89, "text": "[89]다음 중 종합원가계산제도의 선입선출법과 평균법에 관한 설명으로 옳지 않은 것은?\n① 평균법 적용하의 완성품환산량은 선입선출법 적용하의 완성품환산량보다 크거나 같다.\n② 평균법에서는 당기 이전의 기초재공품 작업분도 당기에 작업이 이루어진 것으로 간주한다.\n③ 선입선출법에서는 완성품환산량 산출시 당기 이전의 기초재공품 작업분과 당기 작업분을 별도로 구\n분한다.\n④ 원재료 단가 산정시 선입선출법을 사용하는 기업이라면 종합원가계산제도 적용시 평균법을 사용할\n수 없다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 90, "text": "[90]다음은 ㈜삼일의 원가자료이다. 재료는 공정 초기에 전량 투입되며, 가공원가는 공정전반에 걸쳐 균등\n하게 발생한다. ㈜삼일이 선입선출법을 사용할 경우 기말재공품의 완성도(%)는 얼마인가(단, 가공원가\n의 당기 완성품환산량은 2,070개라고 가정한다)?\n< 수량 >\n기초재공품수량 100개(80 %) 완성수량 2,000개\n착수수량 2,200개 기말재공품수량 300개(? %)\n① 50 %\n② 60 %\n③ 70 %\n④ 80 %", "answer": 1}, {"year": "2025", "month": "1", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳은 것은?\n① 개별원가계산은 제품원가를 개별작업별로 구분하여 집계하므로 제조직접비와 제조간접비의 구분이\n중요하지 않다.\n② 개별원가계산은 해당 제품이나 공정으로 직접 추적할 수 있기 때문에 실제원가계산만 가능하다.\n③ 제조간접원가는 개별작업과 관련하여 직접적으로 추적할 수 없으므로 이를 배부하는 절차가 반드시\n필요하다.\n④ 각 작업별로 원가가 계산되기 때문에 원가계산자료가 상세해짐에 따라 오류가 발생할 가능성이 적어\n진다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 88, "text": "[88]다음은 선입선출법(FIFO)에 의한 기말재공품원가를 계산하는 식을 나타낸 것이다. 괄호 안에 들어갈 내\n용으로 옳은 것은?\n기말재공품의 완성품환산량\n당기발생원가 × = 기말재공품원가\n( )\n① 당기완성품수량 + 기말재공품의 완성품환산량 - 기초재공품의 완성품환산량\n② 당기완성품수량 + 기말재공품의 완성품환산량\n③ 기초재공품의 완성품환산량 + 당기완성품수량 - 기말재공품의 완성품환산량\n④ 기초재공품수량 + 당기투입수량 - 기말재공품수량", "answer": 1}, {"year": "2025", "month": "1", "qnum": 89, "text": "[89]㈜삼일은 종합원가계산을 적용하여 제품의 원가를 계산하고 있다. 재료는 공정 초기에 전량 투입되며\n기말재공품 400개에 대한 가공원가는 60 % 의 완성도를 보이고 있다. 완성품환산량 단위당 재료원가와\n가공원가가 각각 1,500원, 500원으로 계산된 경우의 기말재공품 원가는 얼마인가?\n① 640,000원\n② 680,000원\n③ 720,000원\n④ 760,000원", "answer": 3}, {"year": "2025", "month": "1", "qnum": 90, "text": "[90]㈜삼일은 선입선출법을 이용한 종합원가계산제도를 채택하고 있다. 원재료는 공정초기에 모두 투입되\n고, 가공원가는 공정전반에 걸쳐 균등하게 발생하고 있다. 물량흐름 및 원가관련 정보는 다음과 같을\n때, 당기완성품원가는 얼마인가?\n수량 완성도 재료원가 가공원가\n기초재공품 3,000개 60 % 8,000원 10,000원\n당기투입 30,000개 - 150,000원 320,400원\n기말재공품 6,000개 25 %\n① 408,000원\n② 422,400원\n③ 432,000원\n④ 440,400원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳지 않은 것을 모두 고르면?\nㄱ. 실제원가계산에 비하여 제품의 원가계산이 지연된다는 문제점이 있다.\nㄴ. 직접재료원가와 직접노무원가를 실제원가로 측정한다.\nㄷ. 원가계산제도를 실제원가계산, 정상원가계산, 표준원가계산으로 구분하는 것은 관련\n제품의 생산형태에 따른 것이다.\n① ㄱ\n② ㄱ, ㄷ\n③ ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄷ", "answer": 2}, {"year": "2025", "month": "1", "qnum": 100, "text": "[100]다음 빈칸에서 설명하고 있는 원가회피개념에 근거를 두고 있는 원가계산방법은 무엇인가?\n발생한 원가가 미래에 동일한 원가의 발생을 방지할 수 없다면, 그 원가는 자산성을 인정할 수 없다.\n① 변동원가계산\n② 개별원가계산\n③ 정상원가계산\n④ 전부원가계산", "answer": 1}, {"year": "2025", "month": "3", "qnum": 88, "text": "[88]㈜삼일은 종합원가계산을 채택하고 있다. 원재료는 공정 초기에 전량 투입되며 가공원가는 공정전반에\n걸쳐서 균등하게 발생한다. 완성품환산량 계산시 기말재공품의 완성도를 직접재료와 가공원가를 혼동하\n여 파악한 경우 발생하는 결과로 옳은 것은?\n① 기말재공품 직접재료원가가 과대계상된다.\n② 기말재공품 가공원가가 과대계상된다.\n③ 제품 계정과 재공품 계정에 미치는 영향은 없다.\n④ 당기완성품의 완성품환산량이 과대계상된다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 89, "text": "[89]다음 중 평균법과 선입선출법에 의한 종합원가계산의 차이점에 관한 설명으로 옳지 않은 것은?\n① 평균법은 완성품환산량 산출시 기초재공품의 기완성도를 고려한다.\n② 평균법 적용시의 완성품 환산량은 선입선출법 적용시의 완성품 환산량보다 크거나 같다.\n③ 평균법의 원가배분대상액은 기초재공품원가와 당기투입원가의 합계액이다.\n④ 선입선출법은 완성품환산량 산출시 기초재공품과 당기투입량을 구분한다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 90, "text": "[90]㈜삼일은 종합원가계산 방식을 채택하고 있으며, 선입선출법에 의해 완성품환산량을 계산한다. 재료는\n공정 초기에 전량 투입되며 가공원가는 공정 전반에 걸쳐 균등하게 발생한다. 다음 자료를 이용하여\n기말재공품 원가를 계산하면 얼마인가?\n기초재공품 400개(완성도 50 %) 완성품 1,000개\n수량\n착수량 800개 기말재공품 200개(완성도 60 %)\n원가 재료원가 가공원가\n기초재공품원가 200,000원 500,000원\n당기 발생원가 2,000,000원 3,450,000원\n① 875,000원\n② 900,000원\n③ 950,000원\n④ 1,250,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 85, "text": "[85]다음 중 개별원가계산제도를 이용하는 것이 가장 적합한 업종은?\n① 자동 공정화된 자동차 제조업\n② 소품종 대량 생산하는 화학업\n③ 주문을 받아 제작·판매하는 조선업\n④ 패스트푸드 제조 판매업", "answer": 3}, {"year": "2025", "month": "5", "qnum": 88, "text": "[88]다음 중 종합원가계산에 관한 설명으로 옳지 않은 것은?\n① 종합원가계산은 소품종 대량생산에 적합한 원가계산방법이다.\n② 종합원가계산에서 기말 재공품 수량은 기말 재공품 완성품환산량보다 항상 작거나 같다.\n③ 기말재공품이 300단위이고 완성도가 70 % 일 때, 가공원가가 공정전반에 걸쳐 균등하게 발생한다\n면, 가공원가의 완성품환산량은 210단위이다.\n④ 선입선출법에 따른 종합원가계산은 먼저 제조착수된 것이 먼저 완성된다고 가정한다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 89, "text": "[89]다음은 ㈜삼일의 원가자료이다. 원재료는 공정 초기에 전량 투입되고 가공원가는 공정 전반에 걸쳐 균\n등하게 투입된다.\n< 수량 >\n기초재공품수량 600개(60 %) 완성수량 2,000개\n착수수량 1,900개 기말재공품수량 500개(70 %)\n평균법과 선입선출법을 적용하여 종합원가계산을 하는 경우 가공원가 완성품환산량 차이는 얼마인가?\n① 선입선출법이 360개 더 크다.\n② 선입선출법이 360개 더 작다.\n③ 평균법이 240개 더 크다.\n④ 평균법이 240개 더 작다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 90, "text": "[90]㈜삼일은 평균법을 이용한 종합원가계산제도를 채택하고 있다. 재료는 공정초기에 전량 투입되며, 가공\n원가는 공정전반에 걸쳐 균등하게 투입된다. 자료를 바탕으로 완성품원가를 계산하면 얼마인가?\n< 수량 >\n기초재공품 50개(완성도40 %) 완 성 품 400개\n착 수 량 450개 기말재공품 100개(완성도50 %)\n< 원가 > 재료원가 가공원가\n기초재공품원가 8,000,000원 6,000,000원\n당기발생원가 42,000,000원 24,240,000원\n① 58,880,000원\n② 60,800,000원\n③ 66,880,000원\n④ 68,880,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 91, "text": "[91]㈜삼일은 정상원가계산제도를 채택하고 있다. 원가자료가 다음과 같을 때 실제 발생한 제조간접원가 금\n액은 얼마인가?\n제조간접원가 예산 400,000원\n기준조업도(기계시간) 20,000시간\n실제기계시간 21,000시간\n제조간접원가 과대배부액 30,000원\n① 320,000원\n② 350,000원\n③ 390,000원\n④ 400,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳지 않은 것은?\n① 한 종류의 제품을 주문에 의해 생산하거나 또는 동종의 제품을 일정 간격을 두고 반복적으로 생산하\n는 업종에 적합한 원가계산제도이다.\n② 각 제품별로 원가를 집계하기 때문에 제품에 직접대응이 불가능한 제조간접원가의 구분이 중요한 의\n미를 갖는다.\n③ 개별원가계산은 작업별로 원가가 계산되기 때문에 비용과 시간이 많이 발생하는 단점이 있다.\n④ 제조과정에서 발생한 원가는 개별제품별로 작성된 작업원가표에 집계되므로 재공품원가를 집계하는\n것이 용이하다.", "answer": 1}, {"year": "2025", "month": "6", "qnum": 87, "text": "[87]다음 중 종합원가계산과 개별원가계산의 비교 설명으로 옳지 않은 것은?\n① 개별원가계산은 다품종 소량생산 업종에 적용되며, 종합원가계산은 소품종 대량생산 업종에 적용된\n다.\n② 개별원가계산에서 제조간접원가의 배부기준은 노동시간 및 기계시간 등의 조업도이며, 종합원가계산\n에서 집계된 원가의 배부기준은 완성품환산량이다.\n③ 종합원가계산은 원가보고서를 각 작업별로 작성하며, 개별원가계산은 원가보고서를 각 공정별로 작\n성한다.\n④ 종합원가계산에서 평균법의 경우 제품은 완성품수량에 완성품환산량 단위당원가를 곱하여 계산하고,\n개별원가계산에서 재고자산의 평가는 작업이 완성된 것은 제품계정으로 대체되고 미완성된 작업은\n재공품이 된다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 88, "text": "[88]㈜삼일은 종합원가계산제도를 적용하고 있다. 기말재공품에 대한 완성도가 실제보다 과대평가되어 있다\n면 다음 각각에 어떤 영향을 미치는가?\n완성품환산량 완성품환산량 단위당 원가\n① 과대평가 과대평가\n② 과소평가 과소평가\n③ 과대평가 과소평가\n④ 과소평가 과대평가", "answer": 3}, {"year": "2025", "month": "6", "qnum": 90, "text": "[90]㈜삼일은 종합원가계산을 채택하고 있으며, 선입선출법에 의하여 완성품환산량을 계산한다. 재료는 공\n정초기에 전량 투입되며 가공원가는 공정 전반에 걸쳐 균등하게 발생한다. ㈜삼일의 완성품원가를 계산\n하면 얼마인가?\n기초재공품 400개(완성도50 %) 완성품 1,000개\n수량\n착수량 800개 기말재공품 200개(완성도80 %)\n구분 재료원가 가공원가\n기초재공품원가 300,000원 450,000원\n당기 발생원가 2,000,000원 3,000,000원\n① 3,375,000원\n② 4,000,000원\n③ 4,750,000원\n④ 4,700,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 88, "text": "[88]다음 종합원가계산의 특징 및 장단점에 대한 설명으로 옳은 것을 모두 고르시오.\nㄱ. 제품원가를 평균개념에 의해서 산출한다.\nㄴ. 원가의 집계가 공정별로 이루어지기 때문에 개별작업별로 작업지시서를 작성해야 한다.\nㄷ. 일반적으로 기말시점에서는 부분적으로 가공이 완료되지 않은 재공품이 존재하게 된다.\nㄹ. 원가통제가 제품별로 수행되므로 원가에 대한 책임중심점이 명확하지 않을 수 있다.\nㅁ. 개별원가계산에 비하여 기장절차가 간단하므로 시간과 비용이 절약된다.\n① ㄱ, ㄴ, ㄷ\n② ㄱ, ㄷ, ㅁ\n③ ㄴ, ㄷ, ㄹ\n④ ㄷ, ㄹ, ㅁ", "answer": 2}, {"year": "2025", "month": "7", "qnum": 89, "text": "[89]㈜삼일은 단일제품을 대량으로 생산하고 있으며, 평균법에 의한 종합원가계산을 채택하고 있다. 원재료\n는 공정초기에 전량 투입되고, 가공원가는 공정전반에 걸쳐 균등하게 발생한다. 기초재공품이 4,000단\n위이고 당기착수량이 22,000단위이다. 기말재공품이 3,000단위이고, 완성도는 40 % 이다. 기초재공품\n에 포함된 가공원가가 28,000원이고, 당기발생 가공원가가 165,600원이면 기말재공품에 포함된 가공원\n가는 얼마인가?\n① 8,200원\n② 8,860원\n③ 8,930원\n④ 9,600원", "answer": 4}, {"year": "2025", "month": "7", "qnum": 90, "text": "[90]㈜삼일은 종합원가계산제도를 채택하고 있으며, 원재료는 공정의 초기에 전량 투입되고, 가공원가는 공\n정 전반에 걸쳐 균등하게 발생한다. 재료원가의 경우 평균법에 의한 완성품환산량은 22,000단위이고,\n선입선출법에 의한 완성품환산량은 20,000단위이다. 또한 가공원가의 경우 평균법에 의한 완성품환산량\n은 21,000단위이고, 선입선출법에 의한 완성품환산량은 20,400단위이다. 기말재공품이 2,000단위인 경\n우 기초재공품의 진척도는 몇 % 인가?\n① 10 %\n② 30 %\n③ 50 %\n④ 70 %", "answer": 2}, {"year": "2025", "month": "7", "qnum": 91, "text": "[91]다음 중 정상원가계산에 관한 설명으로 옳은 것을 모두 고르면?\nㄱ. 실제원가계산에 비하여 제품의 원가계산이 지연된다는 문제점이 있다.\nㄴ. 직접재료원가와 직접노무원가를 실제원가로 측정한다.\nㄷ. 원가계산제도를 실제원가계산, 정상원가계산, 표준원가계산으로 구분하는 것은 제품원가의\n구성항목에 따른 것이다.\n① ㄴ\n② ㄱ,ㄴ\n③ ㄴ,ㄷ\n④ ㄱ,ㄴ,ㄷ", "answer": 1}, {"year": "2025", "month": "9", "qnum": 89, "text": "[89]다음 중 종합원가계산의 평균법과 선입선출법 비교에 관한 설명으로 옳지 않은 것은?\n① 평균법의 경우 원가배분 대상액은 기초재공품원가와 당기투입원가의 합계액이지만, 선입선출법의 경\n우 기초재공품원가는 완성품원가의 일부가 되며, 당기투입원가는 완성품과 기말재공품에 배분한다.\n② 평균법의 경우 완성품원가는 [기초재공품원가 + 당기투입원가 중 완성품에 배분된 금액]이지만, 선\n입선출법의 경우 당기완성품수량에 완성품환산량 단위당 원가를 곱한 금액이다.\n③ 평균법의 경우 완성품환산량 단위당 원가에는 전기의 원가가 포함되어 있지만, 선입선출법의 경우\n당기투입원가로만 구성된다.\n④ 평균법의 경우 완성품환산량 산출시 기초재공품은 당기에 착수된 것으로 간주한다. 즉, 평균법은 기\n초재공품의 완성도를 무시하지만, 선입선출법은 완성품 수량을 기초재공품과 당기투입량으로 구분한\n다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 90, "text": "[90]㈜삼일은 평균법을 이용한 종합원가계산제도를 채택하고 있다. 재료는 공정 초기에 전량 투입되며, 가\n공원가는 공정 전반에 걸쳐 균등하게 발생할 경우 당기완성품원가와 기말재공품원가는 각각 얼마인가?\n< 수량, 재공품 완성도 >\n기초재공품 200개(80 %) 완 성 품 900개\n착수량 800개 기말재공품 100개(40 %)\n< 원가 > 재료원가 가공원가\n기초재공품원가 200,000원 150,000원\n당기발생원가 800,000원 649,000원\n당기완성품원가 기말재공품원가\n① 1,648,800원 134,000원\n② 1,648,800원 151,000원\n③ 1,665,000원 134,000원\n④ 1,665,000원 151,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 92, "text": "[92]다음 표준직접재료원가 결정에 관한 설명으로 옳지 않은 것은?\n① 표준소비수량은 제품 생산에 필요한 각종 재료의 종류, 품질, 가공방법 등을 고려하여 결정한다.\n② 표준직접재료원가는 직접재료의 종류별로 제품 단위당 표준소비수량과 표준소비가격을 설정하고 이\n를 곱하여 산정한다.\n③ 표준소비수량은 과학적·통계적 조사에 의하여 결정하여야 하며, 여기에 정상적인 공손 및 감손은\n제외한다.\n④ 표준소비가격은 과거 및 현재의 시장가격과 장래에 예측되는 가격 동향이나 거래관습 등 제반 여건\n을 고려하여 결정한다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 85, "text": "[85]다음 중 개별원가계산에 관한 설명으로 옳지 않은 것은?\n① 수요자의 요구에 따라 개별적으로 제품을 생산하는 업종에서 주로 사용한다.\n② 작업원가표에 의해 개별제품별로 효율성을 통제할 수 있다.\n③ 개별원가계산을 적용하는 경우에도 제조간접원가의 배분절차가 필요하다.\n④ 개별원가계산은 해당 제품이나 공정으로 직접 추적할 수 있기 때문에 실제원가계산만 가능하다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 88, "text": "[88]다음 중 종합원가계산에 관한 설명으로 옳지 않은 것은?\n① 원가관리 및 통제가 공정이나 부문별로 수행되므로 원가에 대한 책임중심점이 명확해진다.\n② 원가요소별 단위당 원가는 완성품환산량에 기초하여 계산된다.\n③ 평균법을 적용할 경우, 완성품과 기말재공품에 배분할 원가를 재료원가와 가공원가로 구분할 필요가\n없다.\n④ 특정기간 동안 특정공정에서 생산된 제품은 원가측면에서 서로가 동일하다고 가정한다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 89, "text": "[89]㈜삼일은 종합원가계산제도를 적용하고 있으며, 단일의 제품을 생산하고 있다. 재료는 공정 초기에 전\n량 투입되며, 가공원가는 공정 전반에 걸쳐 균등하게 발생한다. 하기 자료를 이용하여 기초재공품의 수\n량을 계산하면 몇 단위인가?\n선입선출법에 의한 가공원가의 완성품환산량 10,000단위\n평균법에 의한 가공원가의 완성품환산량 11,200단위\n기초재공품의 가공원가 완성도 40 %\n① 1,200단위\n② 2,000단위\n③
