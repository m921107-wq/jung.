, "text": "[104]다음 중 CVP분석에 관한 설명으로 옳지 않은 것은?\n① 공헌이익률은 원가구조와 밀접한 관련이 있으며 변동원가 비중이 높으면 공헌이익률이 낮게 나타난\n다.\n② 현재가치의 개념을 사용하지 않고 명목가치로만 의사결정한다.\n③ 법인세를 고려하는 경우 손익분기점 분석결과는 변화한다.\n④ 복수제품인 경우 매출배합은 일정하다고 가정한다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 106, "text": "[106]㈜삼일의 영업이익이 200,000원이고 영업레버리지도(DOL)가 5일 경우 공헌이익은 얼마인가?\n① 500,000원\n② 1,000,000원\n③ 1,500,000원\n④ 2,000,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 96, "text": "[96]다음 원가구성에 따른 원가계산방법에 관한 설명으로 옳지 않은 것을 모두 고르면?\nㄱ. 전부원가계산과 초변동원가계산에서 이익의 결정 요인은 판매량과 생산량이다.\nㄴ. 원가부착개념에 근거를 두는 전부원가계산은 운영비용의 중요성을 간과한다는 한계점을 갖는다.\nㄷ. CVP 분석이 목적이라면 재료처리량공헌이익이 표시되는 손익계산서가 가장 유용하다.\n① ㄱ, ㄴ\n② ㄴ, ㄷ\n③ ㄱ, ㄷ\n④ ㄱ, ㄴ, ㄷ", "answer": 2}, {"year": "2025", "month": "3", "qnum": 100, "text": "[100]20X1년에 영업을 시작한 ㈜삼일은 당기에 1,000단위의 제품을 생산하여 800단위의 제품을 판매하였\n다. 당기의 판매가격 및 원가자료가 다음과 같을 때, 전부원가계산의 영업이익은 얼마인가?\n판매가격 100원\n제품단위당 직접재료원가 27원\n제품단위당 직접노무원가 20원\n제품단위당 변동제조간접원가 6원\n제품단위당 변동판매비와관리비 5원\n고정제조간접원가 20,000원\n① 13,600원\n② 17,600원\n③ 21,600원\n④ 23,200원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 105, "text": "[105]다음 중 영업레버리지도(Degree of Operating Leverage)에 관한 설명으로 옳은 것은(단, 모든 경우에\n영업이익은 0 보다 크다고 가정한다)?\n① 영업레버리지란 고정원가로 인하여 매출액의 변화율보다 영업이익의 변화율이 확대되는 효과이다.\n② 고정원가가 증가하면 영업레버리지도는 낮아진다.\n③ 영업레버리지도가 높다는 것은 그 기업의 영업이익이 양호한 수준임을 의미한다.\n④ 영업레버리지도는 손익분기점 부근에서 가장 작다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 109, "text": "[109]다음 자료를 이용하여 ㈜삼일의 시장점유율차이를 계산하면 얼마인가?\n단위당 예산평균공헌이익 100원\n실제시장점유율 45 %\n예산시장점유율 40 %\n실제시장규모 100,000개\n예산시장규모 120,000개\n① 500,000원(유리)\n② 500,000원(불리)\n③ 600,000원(유리)\n④ 600,000원(불리)", "answer": 1}, {"year": "2025", "month": "3", "qnum": 115, "text": "[115]다음은 ㈜삼일의 재품별 예산자료이다.\n제품A 제품B\n단위당 공헌이익 300원 450원\n단위당 기계시간 3 h 5 h\n연간 최대 수요량 100단위 80단위\n㈜삼일의 연간 사용가능 기계시간이 500시간일 때, 이익을 극대화하기 위해서는 두 제품을 각각 몇 단\n위씩 생산하여야 하는가?\n제품A 제품B\n① 100단위 40단위\n② 75단위 55단위\n③ 50단위 70단위\n④ 33단위 80단위", "answer": 1}, {"year": "2025", "month": "5", "qnum": 97, "text": "[97]기말재고수량보다 기초재고수량이 작은 경우에 변동원가계산에 의한 순이익과 전부원가계산에 의한 순\n이익을 비교한 결과로 옳은 것은(단, 전기와 당기의 단위당 고정제조간접원가가 동일하다)?\n① 변동원가계산에 의한 순이익이 더 크다.\n② 전부원가계산에 의한 순이익이 더 크다.\n③ 순이익은 같다.\n④ 상황에 따라 이익의 크기가 달라진다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 98, "text": "[98]다음 중 변동원가계산, 전부원가계산 및 초변동원가계산에 관한 설명으로 옳지 않은 것은?\n① 변동원가계산에서는 판매량이 일정할 때 생산량이 증가하면 영업이익이 증가한다.\n② 초변동원가계산에서는 직접노무원가와 변동제조간접원가를 기간비용으로 처리한다.\n③ 초변동원가계산에서는 제조간접원가를 고정원가와 변동원가로 구분할 필요가 없다.\n④ 전부원가계산의 영업이익은 일반적으로 생산량과 판매량에 의해 영향을 받는다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 100, "text": "[100]㈜삼일의 20X1년 손익에 대한 자료가 다음과 같을 경우 변동원가계산에 따른 공헌이익과 초변동원가계\n산에 따른 재료처리량공헌이익의 차이는 얼마인가?\n단위당 판매가격 500원 고정제조간접원가 200,000원\n단위당 직접재료원가 200원 고정판매비와관리비 70,000원\n단위당 직접노무원가 120원 기초제품 없음\n단위당 변동제조간접원가 50원 생산량 20,000개\n단위당 변동판매비와관리비 30원 판매량 10,000개\n① 1,070,000원\n② 1,900,000원\n③ 2,000,000원\n④ 2,170,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 108, "text": "[108]㈜삼일이 판매하고 있는 제품 A와 제품 B에 관련된 자료는 다음과 같다.\n제품 A 제품 B\n단위당 예산공헌이익 2,000원 3,000원\n예산매출수량 700단위 300단위\n실제매출수량 1,000단위 200단위\n㈜삼일의 매출배합차이는 얼마인가?\n① 160,000원 유리\n② 160,000원 불리\n③ 460,000원 유리\n④ 460,000원 불리", "answer": 2}, {"year": "2025", "month": "6", "qnum": 98, "text": "[98]㈜삼일의 재고자산 및 매출원가의 구성이 다음과 같을 경우, 변동원가계산에 의한 영업이익과 전부원가\n계산에 의한 영업이익의 차이는 얼마인가(단, 물량흐름의 가정은 선입선출법을 적용한다)?\n수량 변동원가 고정제조간접원가\n기초제품 500단위 700,000원 205,000원\n기말제품 200단위 300,000원 705,000원\n매출원가 3,600단위 5,220,000원 2,268,000원\n① 0원\n② 205,000원\n③ 295,000원\n④ 500,000원", "answer": 4}, {"year": "2025", "month": "6", "qnum": 99, "text": "[99]초변동원가계산제도 하에서 제품원가로서 비용화되는 원가항목을 옳게 나열한 것은?\n① 직접재료원가\n② 직접재료원가, 직접노무원가\n③ 직접재료원가, 직접노무원가, 변동제조간접원가\n④ 직접재료원가, 직접노무원가, 변동제조간접원가, 변동판매비와관리비", "answer": 1}, {"year": "2025", "month": "6", "qnum": 100, "text": "[100]다음 중 원가계산방법과 그 특징이 짝지어진 것으로 옳지 않은 것은?\n① 전부원가계산 - 기업 외부 공시 목적의 기능적 손익계산서를 작성하는데 이용된다.\n② 변동원가계산 - 모든 고정원가는 기간원가로 처리된다.\n③ 변동원가계산 - 공헌이익 계산에 이용된다.\n④ 초변동원가계산 - 재고최대화를 유인한다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 103, "text": "[103]다음 중 CVP분석에 관한 설명으로 옳지 않은 것은?\n① 다양한 조업도 수준에서 원가와 이익의 관계를 분석하는 기법이다.\n② 손익분기점 매출액에 미달하는 매출액을 안전한계라고 말한다.\n③ 제품의 가격을 결정하거나 생산 및 판매계획을 수립하는데 활용할 수 있다.\n④ 공헌이익률은 원가구조와 밀접한 관련이 있으며, 총원가 중 변동원가 비중이 높으면 공헌이익률이\n낮게 나타난다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 105, "text": "[105]다음 중 영업레버리지에 관한 설명으로 옳은 것을 모두 고르면?\n가. 영업레버리지란 영업고정원가가 지렛대의 작용을 함으로써 매출액 변화율보다 당기순이\n익 변화율이 확대되는 효과를 말한다.\n나. 일반적으로 한 기업의 영업레버리지도는 손익분기점 부근에서 가장 크며, 매출액이 증가\n함에 따라 점점 커진다.\n다. 영업레버리지도가 높다는 것은 그 기업의 영업이익이 더 민감하게 반응한다는 것을 의미\n한다.\n라. 고정원가가 클수록 영업레버리지효과가 더 크다.\n① 가, 나\n② 가, 다\n③ 나, 다\n④ 다, 라", "answer": 4}, {"year": "2025", "month": "6", "qnum": 115, "text": "[115]다음은 ㈜삼일의 제품별 예산자료이다.\n제품A 제품B\n단위당 공헌이익 300원 450원\n단위당 기계시간 3 h 5 h\n연간 최대 수요량 100단위 80단위\n㈜삼일의 연간 사용가능 기계시간이 500시간일 때, 최대 공헌이익은 얼마인가?\n① 48,000원\n② 50,000원\n③ 52,000원\n④ 62,000원", "answer": 1}, {"year": "2025", "month": "7", "qnum": 97, "text": "[97]다음 중 변동원가계산, 전부원가계산 및 초변동원가계산에 관한 설명으로 옳지 않은 것을 모두 고르면?\n가. 전부원가계산에서는 표준원가를 사용할 수 없다.\n나. 변동원가계산에서는 고정제조간접원가를 기간비용으로 인식한다.\n다. 초변동원가계산은 판매가 수반되지 않는 상황에서 생산량이 많을수록 영업이익이\n낮게 계산되므로 불필요한 재고누적 방지효과가 변동원가계산보다 크다.\n라. 전부원가계산은 생산량이 이익에 아무런 영향을 미치지 않는다.\n① 가, 다\n② 가, 라\n③ 나, 라\n④ 나, 다", "answer": 2}, {"year": "2025", "month": "7", "qnum": 99, "text": "[99]㈜삼일의 20X1년 2월의 제품 생산 및 판매와 관련된 자료는 다음과 같다. 초변동원가계산을 이용한 ㈜\n삼일의 20X1년 2월 재료처리량 공헌이익을 계산하면 얼마인가?\n생산량 4,500개\n판매량 4,300개\n제품단위당 판매가격 680원\n제품단위당 직접재료원가 320원\n제품단위당 직접노무원가 80원\n제품단위당 변동제조간접원가 90원\n고정제조간접원가 295,000원\n(단, 기초 제품재고는 없다)\n① 817,000원\n② 1,204,000원\n③ 1,548,000원\n④ 1,620,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 100, "text": "[100]20X1년 1월에 영업을 시작한 ㈜삼일은 선입선출법에 의한 실제원가계산제도를 채택하고 있으며, 20X1\n년 1월의 생산과 판매에 관한 자료는 다음과 같다. 20X1년 1월 변동원가계산에 의한 영업이익이\n1,500,000원이라면 1월 전부원가계산에 의한 영업이익을 계산하면 얼마인가?\n생산량 10,000단위\n판매량 8,000단위\n고정제조간접비 2,000,000원\n① 1,000,000원\n② 1,100,000원\n③ 1,600,000원\n④ 1,900,000원", "answer": 4}, {"year": "2025", "month": "7", "qnum": 104, "text": "[104]다음 중 영업레버리지도(Degree of Operating Leverage)에 관한 설명으로 옳은 것은(단, 모든 경우에\n영업이익은 0 보다 크다고 가정한다)?\n① 영업레버리지란 매출액의 변화율보다 영업이익의 변화율이 확대되는 효과이다.\n② 고정원가가 감소하면 영업레버리지도는 높아진다.\n③ 매출액이 증가하여도 영업레버리지도는 일정하다.\n④ 영업레버리지도는 손익분기점 부근에서 가장 작다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 105, "text": "[105]캡슐 커피머신을 제조하는 ㈜삼일은 최근의 홈카페 트렌드에 따라 신제품 프리미엄 커피머신을 출시하\n고자 한다. 현재 해당 신제품의 판매가격 및 원가는 다음과 같이 예상된다.\n예상판매수량 2,000단위\n총 고정비 월 30,000,000원\n단위당 변동원가 75,000원\n단위당 판매가격 120,000원\n한편, ㈜삼일은 다음의 두 가지 시나리오에 따른 영업전략을 추가로 분석 중에 있다.\n[Scenario Ⅰ] 마케팅 강화 : 판매량이 1,000 단위 증가하지만 고정비가 5,000,000 원 증가한다.\n[Scenario Ⅱ] 판매단가 10 % 인하 : 판매량을 2,000 단위 늘릴 수 있다.\n다음 중 옳지 않은 것은?\n① 현 상황에서 손익분기점 매출액은 약 80,000,000원이다.\n② Scenario Ⅰ 을 채택할 경우 공헌이익률은 37.5 % 로 기존 시나리오 대비 변동이 없으나, Scenario\nⅡ 를 채택할 경우 약 30.6 % 로 낮아진다.\n③ 손익분기점 판매량은 Scenario Ⅰ 보다 Scenario Ⅱ 가 더 많다.\n④ 안전한계율은 Scenario Ⅰ 보다 Scenario Ⅱ 가 더 낮다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 97, "text": "[97]다음 중 전부원가계산에 관한 설명으로 옳지 않은 것은?\n① 전부원가계산을 이용하여 작성하는 손익계산서를 기능적 손익계산서(Functional income statement)\n라고 한다.\n② 고정제조간접원가에 대한 자산성을 인정하는 개념에 근거를 둔다.\n③ 단기적 의사결정보다는 장기적 의사결정에 활용된다.\n④ 특정 기간의 이익이 생산량에 영향을 받지 않고 매출액과 동일한 방향으로 움직이므로 경영자 입장\n에서 이해가 쉽다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 98, "text": "[98]㈜삼일의 20X1년 손익에 대한 자료가 다음과 같을 경우 (a) 전부원가계산에 따른 매출총이익, (b) 변동\n원가계산에 따른 공헌이익, (c) 초변동원가계산에 따른 재료처리량공헌이익을 계산하면 얼마인가?\n단위당 판매가격 500원 고정제조간접원가 250,000원\n단위당 직접재료원가 130원 고정판매비와관리비 70,000원\n단위당 직접노무원가(변동원가) 100원 기초제품 없음\n단위당 변동제조간접원가 70원 생산량 25,000개\n단위당 변동판매비와관리비 30원 판매량 20,000개\n(a) (b) (c)\n① 3,800,000원 3,000,000원 5,400,000원\n② 3,800,000원 3,400,000원 7,400,000원\n③ 4,000,000원 3,000,000원 7,400,000원\n④ 4,000,000원 3,400,000원 5,400,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 99, "text": "[99]㈜삼일의 20X1년 재고자산 물량 자료는 다음과 같다. ㈜삼일의 제조간접원가 및 판매비와관리비 중 약\n50 % 는 변동비성 원가이다.\n기초재고수량 10,000개\n당기제조 20,000개\n당기판매 25,000개\n기말재고수량 5,000개\n다음 중 각 원가계산 방법을 적용했을 때 당기 영업이익이 큰 순서대로 나열한 것으로 옳은 것은(단,\n전기 및 당기 중 재고자산에 배부된 각 원가요소별 단위당 원가는 동일하다)?\n① 초변동원가계산 > 변동원가계산 > 전부원가계산\n② 전부원가계산 > 변동원가계산 > 초변동원가계산\n③ 초변동원가계산 = 변동원가계산 > 전부원가계산\n④ 초변동원가계산 > 변동원가계산 = 전부원가계산", "answer": 1}, {"year": "2025", "month": "9", "qnum": 103, "text": "[103]다음 중 CVP분석에 관한 설명으로 옳지 않은 것은?\n① 공헌이익률은 원가구조와 밀접한 관련이 있으며 변동원가 비중이 높으면 공헌이익률이 낮게 나타난\n다.\n② 영업레버리지도가 3이라는 의미는 매출액이 1 % 변화할 때 영업이익이 3 % 변화한다는 의미이다.\n③ 법인세를 고려하는 경우 손익분기점 분석결과는 변화한다.\n④ 복수제품인 경우 매출배합은 일정하다고 가정한다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 92, "text": "[92]다음 중 표준원가계산에 관한 설명으로 옳지 않은 것은?\n① 경영자는 금액의 중요성과 상관없이 표준원가와 실제원가의 모든 차이에 대해 반드시 관심을 가지고\n개선책을 강구해야 한다.\n② 표준원가제도는 전부원가계산 및 변동원가계산제도 모두에 적용할 수 있다.\n③ 표준원가와 실제원가와의 차이를 원가통제의 책임과 관련시켜 효과적인 원가통제를 수행할 수 있다.\n④ 표준원가계산제도를 채택할 경우 비계량적인 정보를 무시할 가능성이 있다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 96, "text": "[96]실제 기업의 원가계산시스템은 다양한 원가계산방법들이 상호간 결합되어 운영되고 있다. 아래의 그림\n중 원가구성에 따른 원가계산방법에 해당하지 않는 것은 무엇인가?\n생산형태에 따른 원가계산 방법 원가구성에 따른 원가계산 방법\n?\n개별원가계산\n?\n종합원가계산\n?\n① 초변동원가계산\n② 표준원가계산\n③ 전부원가계산\n④ 변동원가계산", "answer": 2}, {"year": "2025", "month": "11", "qnum": 98, "text": "[98]다음 중 초변동원가계산에 관한 설명으로 옳지 않은 것은?\n① 제조간접원가에 포함되는 혼합원가를 임의로 고정원가와 변동원가로 구분해야 하므로 혼합원가의 주\n관적 구분이 필요하다.\n② 매출액에서 직접재료원가를 차감하여 재료처리량공헌이익을 계산한다.\n③ 판매량은 증가하지 않고 생산량만 증가할 경우, 영업이익이 감소되므로 재고자산 보유를 최소화하도\n록 유인을 제공한다.\n④ 변동원가계산제도와 마찬가지로 원가회피개념에 근거를 두고 있다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 103, "text": "[103]다음 중 CVP분석에 필요한 가정에 관한 설명으로 옳지 않은 것은?\n① 화폐의 시간가치를 고려하지 않는 분석 방법이다.\n② 생산량이 증가할 경우 총원가의 기울기인 한계원가는 학습효과로 인해 곡선의 형태를 가진다고 가\n정한다.\n③ 제품의 종류가 복수인 경우에는 매출의 배합이 일정하다고 가정한다.\n④ 판매량만큼 생산하는 것으로 가정함으로써 기초재고자산과 기말재고자산의 변화가 손익에 영향을\n미치지 않는 것으로 본다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 109, "text": "[109]㈜삼일의 다음 자료를 이용하여 시장규모차이를 계산하면 얼마인가?\n단위당 예산평균공헌이익 300원\n실제시장점유율 30 %\n예산시장점유율 25 %\n실제시장규모 100,000개\n예산시장규모 120,000개\n① 1,500,000원(유리)\n② 1,500,000원(불리)\n③ 1,800,000원(유리)\n④ 1,800,000원(불리)", "answer": 2}, {"year": "2025", "month": "11", "qnum": 115, "text": "[115]다음은 ㈜삼일의 제품별 예산자료이다.\n구분 제품A 제품B\n단위당 공헌이익 300원 450원\n단위당 기계시간 3 h 5 h\n연간 최대 수요량 500단위 400단위\n㈜삼일의 연간 사용가능 기계시간이 2,000시간일 때, 이익을 극대화하기 위해서는 두 제품을 각각 몇\n단위씩 생산하여야 하는가?\n제품A 제품B\n① 0단위 400단위\n② 200단위 280단위\n③ 500단위 100단위\n④ 500단위 400단위", "answer": 3}, {"year": "2025", "month": "12", "qnum": 96, "text": "[96]다음 중 변동원가계산에 의한 손익계산서에 관한 내용으로 옳은 것을 모두 나열한 것은?\nㄱ. 직접노무원가를 기간비용으로 처리한다.\nㄴ. 제품생산량이 영업이익에 영향을 미친다.\nㄷ. 고정제조간접원가는 공헌이익 산출 시 차감되지 않는다.\nㄹ. 판매비와관리비를 변동비와 고정비로 분리하여 보고한다.\n① ㄱ, ㄴ\n② ㄱ, ㄷ\n③ ㄴ, ㄹ\n④ ㄷ, ㄹ", "answer": 4}, {"year": "2025", "month": "12", "qnum": 97, "text": "[97]다음 중 괄호 안에 들어갈 알맞은 용어를 옳게 짝지은 것은?\n초변동원가계산제도는 ( A )개념에 근거를 두고 있다. ( A )개념이란 발생한 원가가\n미래에 동일한 원가의 발생을 방지할 수 없다면 그 원가는 자산성을 인정할 수 없다는 것\n이다. 전부원가계산제도는 ( B )개념에 근거를 두고 있다. ( B )개념이란 제품생산과\n관련한 원가는 원가의 행태에 관계없이 모두 제품의 원가로 보는 것이다.\nA B\n① 원가회피 원가부착\n② 원가부착 기간원가\n③ 기간원가 원가회피\n④ 원가부착 원가회피", "answer": 1}, {"year": "2025", "month": "12", "qnum": 99, "text": "[99]다음 중 변동원가계산에 의한 영업이익이 전부원가계산에 의한 영업이익보다 작게 산출되는 경우는(단,\n다른 모든 조건은 동일한 것으로 가정한다)?\n① 판매량이 생산량보다 많을 때\n② 생산량이 판매량보다 많을 때\n③ 고정판매비와관리비 금액이 고정제조간접비 금액보다 클 때\n④ 고정제조간접비 금액이 고정판매비와관리비 금액보다 클 때", "answer": 2}, {"year": "2025", "month": "12", "qnum": 100, "text": "[100]㈜삼일의 20X1년 제품 생산 및 판매와 관련된 자료는 다음과 같다. 전부원가계산에 의한 영업이익이\n290,000원일 경우, 초변동원가계산을 이용한 ㈜삼일의 20X1년 영업이익은 얼마인가?\n매출량 3,000개(단위당 판매가격 200원)\n기말 제품재고량 300개(단, 기초제품재고는 없다)\n변동판매관리비 50,000원\n단위당 직접재료원가 20원\n단위당 직접노무원가 30원\n단위당 변동제조간접원가 10원\n단위당 고정제조간접원가 15원\n단, 고정판매관리비는 발생하였으나 금액은 알 수 없다.\n① 220,500원\n② 257,500원\n③ 273,500원\n④ 295,500원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 103, "text": "[103]다음 중 손익분기점 분석에 관한 설명으로 옳지 않은 것은?\n① 손익분기점에서 공헌이익 금액과 고정원가 금액은 일치한다.\n② 법인세를 고려하는 손익분기점 분석결과와 법인세를 고려하지 않는 손익분기점 분석결과는 동일하\n다.\n③ 다른 조건이 동일할 경우, 단위당 판매가격이 상승하면 손익분기점 판매량은 감소한다.\n④ 다른 조건이 동일할 경우, 고정원가가 상승하면 손익분기점 판매량은 감소한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 115, "text": "[115]㈜삼일은 제품 A, B, C를 생산하여 판매하고 있다. 이 세 제품에 공통으로 필요한 재료 S는 품귀현상\n이 발생하여 당분간 구입이 불가능하다. ㈜삼일의 재료 S 보유량은 500 kg이며, 해당 재료가 소진되면\n더 이상 제품을 생산할 수 없다. ㈜삼일은 의무적으로 각 제품을 최소 수량까지는 생산하여야 한다.\n다음 자료를 이용하여 ㈜삼일의 최대 공헌이익을 산출하면 얼마인가(단, A, B, C 세 제품의 시장 수요\n는 충분하다고 가정한다)?\n구분 제품A 제품B 제품C\n의무생산 수량 10단위 20단위 30단위\n공헌이익 25,000원 20,000원 15,000원\n단위당 재료 S 사용량 4 kg 5 kg 2 kg\n① 2,390,000원\n② 3,350,000원\n③ 4,130,000원\n④ 5,270,000원", "answer": 2}], "05_활동기준원가계산·원가추정": [{"year": "2024", "month": "1", "qnum": 101, "text": "[101]다음 중 활동기준원가계산제도의 도입에 따른 효익이 크게 나타날 수 있는 기업의 조건이 아닌 것은?\n① 제조과정의 다양성 때문에 제품의 자원소비가 다양한 경우\n② 기존의 원가시스템이 확립된 후에 제조하는 제품의 종류가 크게 감소하고 있는 경우\n③ 복잡한 제품은 수익성이 높게 나타나고, 간단한 제품에서는 손실이 발생되는 것처럼 보이는 경우\n④ 아주 큰 비중의 간접원가가 소수의 원가집합을 사용해서 배부되는 경우", "answer": 2}, {"year": "2024", "month": "1", "qnum": 102, "text": "[102]다음 중 원가추정에 관한 설명으로 옳은 것은?\n① 원가추정은 조업도(종속변수)와 원가(독립변수) 사이의 관계를 규명하여 원가행태를 결정하는 것이\n다.\n② 회귀분석법에서는 독립변수가 한 단위 변화함에 따른 종속변수의 평균적 변화량을 측정하여 원가함\n수를 추정하며 이 과정에서 정상적인 원가자료를 모두 이용한다.\n③ 공학적 방법은 과거의 자료가 없어도 적용 가능하므로 주로 제조간접원가의 추정에 활용된다.\n④ 고저점법은 상대적으로 적은 노력으로 원가함수를 추정할 수 있다는 장점이 있는 반면, 분석자의\n주관이 크게 개입될 수 있다는 단점이 있다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 101, "text": "[101]다음 중 활동기준원가계산(ABC)에 관한 설명으로 옳지 않은 것은?\n① 개별원가계산제도와는 결합되어 함께 사용될 수 있으나, 종합원가계산제도와는 함께 사용될 수 없\n다는 한계점이 존재한다.\n② 활동 및 활동원가의 분석을 통하여 원가통제를 보다 효과적으로 수행할 수 있다.\n③ 제조간접원가의 비중이 과거보다 커진 것이 활동기준원가계산제도를 도입하는 주된 배경이다.\n④ 일반적으로 활동기준원가계산은 전통적 원가계산제도보다 더 다양한 원가동인 요소를 고려한다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 102, "text": "[102]다음 중 원가추정에 관한 설명으로 옳지 않은 것은?\n① 원가추정의 목적은 계획과 통제 및 의사결정에 유용한 미래원가를 추정하기 위함이다.\n② 조업도와 원가 사이의 관계를 규명하여 원가함수를 추정하는 것이다.\n③ 원가추정시 원가에 영향을 미치는 요인은 조업도 뿐이라고 가정한다.\n④ 관련 범위 내에서 총 원가가 일정함을 가정한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 101, "text": "[101]다음 중 활동기준원가계산의 도입배경에 관한 설명으로 옳지 않은 것은?\n① 최근에는 종전에 비해 원가개념이 확대되어 연구개발, 제품설계 등의 기타원가를 포함한 정확한 원\n가계산이 요구되었다.\n② 제조환경의 변화로 단일배부기준에 의한 원가의 배부가 원가의 왜곡현상을 초래하였다.\n③ 컴퓨터통합시스템의 도입으로 제조와 관련된 활동에 대한 원가를 수집하는 것이 용이해졌다.\n④ 직접노무원가와 같은 직접원가의 증가로 인해 새로운 원가배부기준이 필요하게 되었다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 101, "text": "[101]다음 중 활동기준원가계산(ABC)에 관한 설명으로 옳지 않은 것은?\n① 활동기준원가계산을 통해 산출된 정보는 원가계산뿐만 아니라 관리회계의 의사결정과 성과평가에도\n활용할 수 있다.\n② 활동분석과 원가동인의 파악에 소요되는 비용과 시간이 크다는 단점이 존재한다.\n③ 각 활동별로 적절한 배부기준을 사용하여 원가를 배부하기 때문에 종전에는 제품별로 추적 불가능\n하던 제조간접원가도 개별제품에 추적가능한 직접원가로 인식되어 원가계산이 보다 정확해진다.\n④ 제품원가를 계산하기 위한 활동은 분석이 가능하나 고객이나 서비스 등의 원가대상에 대해서는 활\n동분석이 불가능하여 활동기준원가계산을 적용할 수 없다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 101, "text": "[101]다음 활동기준원가계산(ABC)의 절차를 올바르게 나타낸 것은 무엇인가?\nⓐ 원가대상별 원가계산\nⓑ 활동분석\nⓒ 제조간접원가 배부율 계산\nⓓ 활동별 원가동인(배부기준의 결정)\nⓔ 각 활동별로 제조간접원가를 집계\n① ⓔ－ⓑ－ⓓ－ⓒ－ⓐ\n② ⓑ－ⓒ－ⓓ－ⓔ－ⓐ\n③ ⓑ－ⓔ－ⓒ－ⓓ－ⓐ\n④ ⓑ－ⓔ－ⓓ－ⓒ－ⓐ", "answer": 4}, {"year": "2024", "month": "7", "qnum": 102, "text": "[102]다음 중 원가추정방법에 관한 설명으로 옳지 않은 것은?\n① 공학적 방법은 과거의 원가 자료를 이용할 수 없는 경우 적용이 불가능하다.\n② 계정분석법은 분석자의 주관적 판단이 개입될 수 있는 원가추정방법이다.\n③ 고저점법은 최고조업도와 최저조업도의 원가자료를 이용하여 원가함수를 추정하는 방법이다.\n④ 회귀분석법에 의한 추정에 있어 통계적 가정이 충족되지 않을 때는 무의미한 결과가 산출될 수 있\n다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 102, "text": "[102]다음 중 원가추정에 관한 설명으로 옳지 않은 것은?\n① 관련 범위 내에서 총 원가가 일정함을 가정한다.\n② 조업도와 원가 사이의 관계를 규명하여 원가함수를 추정하는 것이다.\n③ 원가추정시 원가에 영향을 미치는 요인은 조업도 뿐이라고 가정한다.\n④ 원가추정의 목적은 계획과 통제 및 의사결정에 유용한 미래원가를 추정하기 위함이다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 101, "text": "[101]다음 중 활동기준원가계산(ABC)에 관한 설명으로 옳지 않은 것은?\n① 활동 및 활동원가의 분석을 통하여 원가통제를 보다 효과적으로 수행할 수 있다.\n② 개별원가계산제도와는 결합되어 함께 사용될 수 있으나, 종합원가계산제도와는 함께 사용될 수 없\n다는 한계점이 존재한다.\n③ 제조간접원가의 비중이 과거보다 커진 것이 활동기준원가계산제도를 도입하는 주된 배경이다.\n④ 일반적으로 활동기준원가계산은 전통적 원가계산제도보다 더 다양한 원가동인 요소를 고려한다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 102, "text": "[102]다음 중 원가추정에 관한 설명으로 옳은 것은?\n① 원가추정은 조업도와 원가 사이의 관계를 규명하여 원가행태를 결정하는 것이다.\n② 회귀분석법에서는 독립변수가 한 단위 변화함에 따른 종속변수의 평균적 변화량을 측정하여 원가함\n수를 추정하며, 통계적 가정이 충족되지 않아도 유의미한 결과를 산출할 수 있는 것이 장점이다.\n③ 공학적 방법은 과거의 자료가 없어도 적용 가능하므로 주로 제조간접원가의 추정에 활용된다.\n④ 고저점법은 상대적으로 적은 노력으로 원가함수를 추정할 수 있다는 장점이 있는 반면, 분석자의\n주관이 크게 개입될 수 있다는 단점이 있다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 101, "text": "[101]㈜삼일은 세 종류의 책상을 생산하여 판매하고 있으며, 활동기준원가계산을 적용하고 있다. 당월에 원\n가계산을 통해 B제품에 제조간접원가를 136,500원 배부하였다면, B제품의 당월 생산량은 몇 개인가?\n제품별 활동 수\n활동 구분 제조간접원가 원가동인\nA제품 B제품 C제품\n재단 142,500원 재단횟수 250회 300회 400회\n연마 100,000원 직접노무시간 30시간 40시간 30시간\n코팅 75,000원 기계작업시간 15시간 5시간 10시간\n조립 102,000원 생산량 100개 ? 110개\n① 100개\n② 110개\n③ 120개\n④ 130개", "answer": 4}, {"year": "2024", "month": "12", "qnum": 102, "text": "[102]㈜삼일의 과거 원가자료를 바탕으로 총제조간접원가를 추정한 원가함수는 다음과 같다. 이에 관한 설\n명으로 옳지 않은 것은(단, 조업도는 기계시간이다)?\n = 150,000 + 45\n① 150,000은 총고정제조간접원가 추정치를 의미한다.\n② 는 기계시간을 의미한다.\n③ 45는 기계시간당 고정제조간접원가를 의미한다.\n④ 조업도가 1,000기계시간일 경우 총제조간접비는 195,000 원으로 추정된다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 102, "text": "[102]㈜삼일은 활동기준원가계산제도(ABC)를 사용하며, 작업활동별 예산자료와 생산관련 자료는 다음과 같\n다.\n< 작업활동별 예산자료(제조간접원가) >\n작업활동 배부기준 배부기준당 예정원가\n포 장 생산수량 300원\n재료처리 부품의 수 15원\n절 삭 부품의 수 20원\n조 립 직접작업시간 150원\n< 생산관련자료 >\n제 품 보 급 형 특 수 형\n생산수량 5,000개 4,000개\n부품의 수 90,000개 80,000개\n직접작업시간 6,000시간 4,000시간\n직접재료원가 8,000,000원 8,000,000원\n직접노무원가 7,000,000원 4,000,000원\n㈜삼일이 생산하는 제품 중 특수형 제품의 단위당 제조원가는 얼마인가?\n① 3,750원\n② 4,110원\n③ 4,115원\n④ 4,150원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 103, "text": "[103]조업도와 원가 사이의 관계를 규명함으로써 원가행태를 결정하는 것을 원가추정이라고 한다. 다음 중\n고저점법으로 원가를 추정할 때의 특징으로 옳은 것을 모두 고르시오.\nㄱ. 분석자의 주관이 개입된 결과가 도출된다.\nㄴ. 상대적으로 시간과 비용이 많이 소요되는 만큼 그 정확성이 높다.\nㄷ. 과거의 원가자료가 없다면 적용할 수 없다.\nㄹ. 비정상적인 결과가 도출될 가능성이 있다.\n① ㄱ, ㄴ\n② ㄱ, ㄷ\n③ ㄴ, ㄹ\n④ ㄷ, ㄹ", "answer": 4}, {"year": "2025", "month": "3", "qnum": 101, "text": "[101]다음 중 활동기준원가계산(ABC)에 관한 설명으로 옳지 않은 것은?\n① 제품원가를 계산하기 위한 활동은 분석이 가능하나 고객이나 서비스 등의 원가대상에 대해서는 활\n동분석이 불가능하여 활동기준원가계산을 적용할 수 없다.\n② 활동기준원가계산을 통해 산출된 정보는 원가계산뿐만 아니라 관리회계의 의사결정과 성과평가에도\n활용할 수 있다.\n③ 다품종 소량생산을 주로 하고 원가요소 중 제조간접원가의 비중이 큰 기업에 적합하다.\n④ 각 활동별로 적절한 배부기준을 사용하여 원가를 배부하기 때문에 종전에는 제품별로 추적 불가능\n하던 제조간접원가도 개별제품에 추적가능한 직접원가로 인식되어 원가계산이 보다 정확해진다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 102, "text": "[102]원가추정을 위한 방법에는 공학적 방법, 계정분석법, 산포도법, 고저점법, 회귀분석법 등이 있다. 다\n음 중 회귀분석법에 관한 설명으로 옳지 않은 것은?\n① 정상적인 원가자료를 모두 이용한다.\n② 독립변수가 한 단위 변화함에 따른 종속변수의 평균적 변화량을 측정하는 통계적 방법에 의하여 원\n가함수를 추정하는 방법이다.\n③ 상대적으로 적용이 간단하나 분석자의 주관적 판단이 개입될 수 있다는 단점이 있다.\n④ 통계적 가정이 충족되지 않을 경우에는 무의미한 결과가 산출될 수 있다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 101, "text": "[101]다음 중 활동기준원가 계산의 활동분석 중 활동중심점과 추적가능원가 조합이 가장 적합하지 않은 것\n은?\n① 단위수준활동 - 노무원가\n② 배치수준활동 - 전수(제품전량)품질검사원가\n③ 제품유지활동 - 제품설계원가\n④ 설비유지활동 - 공장관리활동원가", "answer": 2}, {"year": "2025", "month": "5", "qnum": 102, "text": "[102]㈜삼일은 단일 제품을 생산하여 판매하고 있으며 제조간접원가에 대한 원가동인은 기계가동시간이다.\n과거 6개월간의 원가 자료가 다음과 같을 때, 고저점법으로 추정한 고정제조간접원가가 9,800,000원\n이라면 5월의 총제조간접원가는 얼마인가?\n대상기간 기계가동시간(h) 제조간접원가\n1월 285 19,500,000원\n2월 260 19,160,000원\n3월 290 19,950,000원\n4월 310 21,200,000원\n5월 320 ?\n6월 305 20,600,000원\n① 21,320,000원\n② 22,050,000원\n③ 22,400,000원\n④ 22,750,000원", "answer": 1}, {"year": "2025", "month": "6", "qnum": 101, "text": "[101]활동기준원가계산에서 활동을 분석할 때, 배치(batch)수준활동에 해당되는 것을 모두 고르시오.\na. 구매주문활동\nb. 표본검사활동\nc. 제품연구개발 및 A/S 활동\nd. 안전유지활동\n① a\n② a, b\n③ a, b, c\n④ a, b, c, d", "answer": 2}, {"year": "2025", "month": "6", "qnum": 102, "text": "[102]다음은 원가추정방법 중 어느 것에 해당 되는가?\n• 객관적이고 시간과 비용이 적게 소요된다.\n• 최저치와 최고치만을 고려하여 비정상적인 결과가 도출될 수 있다.\n• 단위당 변동원가 추정치는 최고조업도의 총원가와 최저조업도의 총원가의 차이를\n최고, 최저조업도의 차이로 나누어서 계산한다.\n① 산포도법\n② 계정분석법\n③ 고저점법\n④ 회귀분석법", "answer": 3}, {"year": "2025", "month": "7", "qnum": 102, "text": "[102]다음 중 원가추정방법에 관한 설명으로 옳지 않은 것은?\n① 공학적 방법은 과거의 원가 자료를 이용할 수 없는 경우 적용이 불가능하다.\n② 계정분석법은 분석자의 주관적 판단이 개입될 수 있는 원가추정방법이다.\n③ 고저점법은 최고조업도와 최저조업도의 원가자료를 이용하여 원가함수를 추정하는 방법이다.\n④ 회귀분석법에 의한 추정에 있어 통계적 가정이 충족되지 않을 때는 무의미한 결과가 산출될 수 있\n다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 101, "text": "[101]㈜삼일은 활동기준원가계산제도(ABC)를 사용하며, 작업활동별 예산자료와 생산관련 자료는 다음과 같\n다.\n< 작업활동별 예산자료(제조간접원가) >\n작업활동 배부기준 배부기준당 예정원가\n포 장 생산수량 300원\n재료처리 부품의 수 15원\n절 삭 생산수량 360원\n조 립 직접작업시간 150원\n< 생산관련자료 >\n제 품 보 급 형 특 수 형\n생산수량 5,000개 4,000개\n부품의 수 90,000개 80,000개\n직접작업시간 6,000시간 4,000시간\n직접재료원가 6,000,000원 8,000,000원\n직접노무원가 5,000,000원 4,000,000원\n㈜삼일이 생산하는 제품 중 보급형 제품의 단위당 제조원가를 계산하면 얼마인가?\n① 2,200원\n② 2,671원\n③ 3,310원\n④ 4,150원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 101, "text": "[101]다음 중 활동기준원가계산의 절차를 나열한 것으로 옳은 것은?\nⓐ 각 활동별로 제조간접원가를 집계 ⓑ 활동별 원가동인(배부기준)의 결정\nⓒ 활동분석 ⓓ 활동별 제조간접원가 배부율 계산\nⓔ 원가대상별 원가계산\n① ⓐ - ⓓ - ⓑ - ⓒ - ⓔ\n② ⓐ - ⓔ - ⓓ - ⓑ - ⓒ\n③ ⓒ - ⓔ - ⓑ - ⓐ - ⓓ\n④ ⓒ - ⓐ - ⓑ - ⓓ - ⓔ", "answer": 4}, {"year": "2025", "month": "11", "qnum": 102, "text": "[102]㈜삼일의 과거 원가자료를 바탕으로 총제조간접원가를 추정한 원가함수는 다음과 같다. 이에 관한 설\n명으로 옳지 않은 것은(단, 조업도는 생산량이다)?\n = 150,000 + 45\n① 150,000은 총고정제조간접원가 추정치를 의미한다.\n② 는 생산량을 의미한다.\n③ 45는 생산량 당 고정제조간접원가를 의미한다.\n④ 조업도가 1,000단위일 경우 총제조간접원가는 195,000원으로 추정된다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 101, "text": "[101]다음 중 활동기준원가계산에 관한 설명으로 옳지 않은 것은?\n① 전통적 원가계산방법에 비해 활동분석과 원가동인의 파악에 소요되는 비용과 시간이 크다는 단점이\n존재한다.\n② 활동기준원가계산은 제조간접원가의 추적가능성을 향상시켜 보다 정확한 원가자료를 산출할 수 있\n다.\n③ 활동기준원가계산은 제조간접원가의 비중이 낮은 기업에 적합하다.\n④ 활동 및 활동원가의 분석을 통하여 원가통제를 보다 효과적으로 수행할 수 있다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 102, "text": "[102]다음 중 아래의 설명에 해당하는 원가추정방법으로 옳은 것은?\nŸ 투입과 산출 사이의 관계를 계량적으로 분석하여 원가함수를 추정하는 방법\nŸ 과거의 자료를 이용할 수 없는 경우에도 이용 가능한 방법\n① 공학적 방법\n② 계정분석법\n③ 고저점법\n④ 회귀분석법", "answer": 1}], "06_예산·책임회계·성과평가": [{"year": "2024", "month": "1", "qnum": 106, "text": "[106]다음 중 고정예산에 관한 설명으로 옳은 것은?\n① 특정기간의 조업도의 변화여부를 고려하여 고정예산을 조정할 필요가 있다.\n② 특정수준의 조업도를 기준으로 하여 사전에 수립되는 예산이다.\n③ 특정산출량에 대하여 사용된 투입량의 정도에 대한 정보를 제공한다.\n④ 통제를 위한 정보로서 적합하며 경영관리적 측면에서 큰 의미를 갖는다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 107, "text": "[107]다음 중 원가와 수익 모두에 대해서 통제책임을 지는 책임중심점은 무엇인가?\n① 이익중심점\n② 수익중심점\n③ 생산중심점\n④ 원가중심점", "answer": 1}, {"year": "2024", "month": "1", "qnum": 108, "text": "[108]다음 중 투자수익률법(return on investment : ROI)에 관한 설명으로 옳지 않은 것은?\n① 투자규모가 다른 투자중심점을 상호 비교하기가 용이하다.\n② 사업부의 이익뿐만 아니라 투자액도 함께 고려하는 성과평가 기준이다.\n③ 준최적화 현상이 발생하지 않는다.\n④ 매출액이익률과 자산회전율로 구분하여 분석이 가능하다.", "answer": 3}, {"year": "2024", "month": "1", "qnum": 109, "text": "[109]다음은 ㈜삼일의 20X1년도 이익중심점으로 분류되는 A사업부의 요약손익계산서이다.\n공헌이익 1,000,000원\n추적가능 ․ 통제가능고정원가 100,000원\n사업부경영자공헌이익 900,000원\n추적가능 ․ 통제불능고정원가 200,000원\n사업부공헌이익 700,000원\n공통고정원가배분액 300,000원\n순이익 400,000원\nA사업부 경영자의 성과평가목적에 적합한 이익은 얼마인가?\n① 공헌이익 1,000,000원\n② 사업부경영자공헌이익 900,000원\n③ 사업부공헌이익 700,000원\n④ 순이익 400,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 110, "text": "[110]다음 중 경제적부가가치(EVA)에 관한 설명으로 옳지 않은 것은?\n① 자기자본비용과 타인자본비용을 모두 고려한다.\n② 전체 기업활동에서 창출된 순가치의 증가분을 의미한다.\n③ 주주관점에서 기업의 경영성과를 보다 정확히 측정하는데 도움이 된다.\n④ 투자중심점과 회사전체의 목표일치성을 충족시킬 수 있다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 107, "text": "[107]다음 중 예산에 관한 설명으로 옳지 않은 것은?\n① 기업의 공식적인 경영계획을 화폐단위로 표시한 것이다.\n② 예산편성 성격에 따라 운영예산과 재무예산으로 구분된다.\n③ 예산편성 대상에 따라 종합예산과 부문예산으로 구분된다.\n④ 예산편성 방법에 따라 예산을 분류함에 있어, 조업도의 변동을 고려하지 않고 작성되는 예산을 영\n업예산이라고 한다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 108, "text": "[108]다음 중 책임회계제도에 관한 설명으로 옳지 않은 것은?\n① 책임회계제도가 그 기능을 효율적으로 발휘하기 위해서는 각 책임중심점의 경영자가 권한을 위임받\n은 원가항목들에 대해 통제권을 행사할 수 없어야 한다.\n② 책임회계제도는 실제 성과와 예산과의 차이를 쉽게 파악할 수 있게 해줌으로써 예외에 의한 관리가\n가능하게 해준다.\n③ 책임중심점은 책임의 성격 및 책임범위에 따라 원가중심점, 수익중심점, 이익중심점 및 투자중심점\n으로 분류할 수 있다.\n④ 책임중심점이 조직의 한 부분, 즉 판매부서, 점포단위 등으로 설정되는 경우 보통 이익중심점을 뜻\n하는 것이 일반적이다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 109, "text": "[109]다음 중 경제적부가가치(EVA)를 증대시키기 위한 방안에 관한 설명으로 옳지 않은 것은(단, 다른 조건\n은 일정하다고 가정한다)?\n① 판매비와관리비를 줄여야 한다.\n② 비영업자산을 늘려야 한다.\n③ 매출액을 늘려야 한다.\n④ 자본비용을 줄여야 한다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 111, "text": "[111]㈜삼일은 분권화된 세 개의 제품별 사업부를 운영하고 있다. 이들은 모두 투자중심점으로 설계되어 있\n으며, 회사의 최저필수수익률은 12 % 이다. 각 사업부의 영업자산, 영업이익 및 매출액에 관한 정보는\n다음과 같다. 각 사업부를 잔여이익법으로 평가했을 경우 잔여이익이 높은 사업부의 순서로 옳은 것\n은?\n구분 A사업부 B사업부 C사업부\n평균영업자산 700,000원 1,000,000원 2,000,000원\n영업이익 120,000원 170,000원 230,000원\n매출액 1,500,000원 2,000,000원 3,000,000원\n① A > B > C\n② B > A > C\n③ C > B > A\n④ B > C > A", "answer": 2}, {"year": "2024", "month": "3", "qnum": 119, "text": "[119]기업 내 사업부 간에 이루어지는 이전거래의 가격을 대체가격이라고 한다. 다음 중 대체가격 결정방법\n에 관한 설명으로 옳지 않은 것은?\n① 시장가격기준 : 거래될 재화에 대한 완전경쟁시장이 존재하고 각 사업부 관리자의 의사결정이 자율\n성을 가진다면, 목표일치성 및 성과평가 측면에서의 공정성을 대체로 만족시킨다고\n본다.\n② 원 가 기 준 : 수요사업부의 비능률이 모두 공급사업부에 전가되기 때문에 원가통제에 대한 동기\n부여가 어렵다.\n③ 원 가 기 준 : 준최적화 현상이 나타날 가능성이 존재한다.\n④ 협상가격기준 : 각 사업부의 이익이 관리자의 능력에 민감하게 영향을 받는다는 단점이 있다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 107, "text": "[107]㈜삼일의 제 1사업부는 계산기를 생산하여 판매하고 있다. 투자중심점으로 운영되는 ㈜삼일의 제 1사\n업부의 계산기 생산 및 판매에 관한 예상자료는 다음과 같다.\nŸ 제 1사업부 연간 총고정비 200,000,000원\nŸ 계산기 단위당 변동비 30,000원\nŸ 계산기 연간 판매대수 50,000대\nŸ 제 1사업부 평균 총영업자산 500,000,000원\n제 1사업부의 목표 투자수익률 10 % 를 달성하기 위한 계산기의 단위당 최소판매가격은 얼마인가?\n① 33,000 원\n② 35,000 원\n③ 40,000 원\n④ 45,000 원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 108, "text": "[108]기업은 미래의 불확실성에 대처하기 위하여 계획을 수립하며, 이러한 계획의 일부분으로서 예산을 편\n성한다. 예산은 다양하게 분류할 수 있는데 조업도 변동에 따라 작성되는 예산으로 실제원가를 실제조\n업도 수준의 예산원가와 비교하는 예산으로 옳은 것은?\n① 종합예산\n② 재무예산\n③ 변동예산\n④ 고정예산", "answer": 3}, {"year": "2024", "month": "5", "qnum": 110, "text": "[110]다음 중 투자중심점의 성과평가에 관한 설명으로 옳지 않은 것은?\n① 투자중심점은 원가 및 수익뿐만 아니라 투자의사결정에 대해서도 책임을 지는 책임중심점으로서 가\n장 포괄적인 책임중심점이다.\n② 투자중심점은 투자수익률, 잔여이익, 경제적부가가치 등으로 성과를 평가한다.\n③ 잔여이익은 투자규모가 서로 다른 투자중심점의 성과를 상호 비교하기가 용이하다는 장점이 있다.\n④ 투자수익률은 준최적화 현상을 유발할 수 있다는 문제점이 있다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 111, "text": "[111]다음 중 경제적부가가치(EVA)에 관한 설명으로 옳은 것은?\n① 다른 조건이 동일한 경우 영업이익이 감소하면 경제적부가가치(EVA)는 증가한다.\n② 재고자산회전율을 높이면 일반적으로 경제적부가가치(EVA)는 증가한다.\n③ 투하자본에 대한 자본비용이 높아지고, 세후순영업이익의 변동이 없다면 경제적부가가치(EVA)는 일\n반적으로 증가한다.\n④ 경제적부가가치(EVA)를 증가시키기 위해서는 영업이익률을 높이거나, 투하자본의 회전율을 낮추는\n것이 바람직하다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 106, "text": "[106]다음 중 변동예산을 사용하는 목적에 관한 설명으로 옳은 것은?\n① 실제 조업도 수준에서 예산원가와 실제원가를 비교 평가하기 위하여\n② 기준 조업도 수준에서 예산원가와 실제원가를 비교 평가하기 위하여\n③ 예산설정에 소요되는 총시간을 감소시키기 위하여\n④ 하부 경영자들에게 권한을 위양하기 위하여", "answer": 1}, {"year": "2024", "month": "6", "qnum": 107, "text": "[107]다음 중 책임회계제도에 관한 설명으로 옳지 않은 것은?\n① 원가중심점은 특정 원가의 발생에만 통제책임을 지는 책임중심점으로 판매부서 및 영업소 등이 원\n가중심점의 예가 될 수 있다.\n② 수익중심점은 매출액에 대해서만 통제책임을 지는 책임중심점으로 기업의 최종산출물인 제품 또는\n서비스의 판매수익을 창출하는데 일차적인 책임을 진다.\n③ 책임중심점은 책임의 성격 및 책임범위에 따라 원가중심점, 수익중심점, 이익중심점 및 투자중심점\n으로 분류할 수 있다.\n④ 책임중심점이란 경영관리자가 특정활동에 대해 통제할 책임을 지는 조직의 부문을 말한다.", "answer": 1}, {"year": "2024", "month": "6", "qnum": 108, "text": "[108]아래에 주어진 재무자료를 이용하여 경제적부가가치(EVA)를 산출하면 얼마인가(단, 법인세효과는 무시\n한다)?\n매출액 100억원\n매출원가 60억원\n판매비와관리비 30억원\n투하자본 50억원\n(타인자본 25억원, 자기자본 25억원)\n타인자본비용 10 %\n자기자본비용 12 %\n① 3.5억원\n② 4억원\n③ 4.5억원\n④ 5억원", "answer": 3}, {"year": "2024", "month": "6", "qnum": 109, "text": "[109]다음 중 경제적부가가치(EVA)에 관한 설명으로 옳지 않은 것은?\n① EVA는 고유의 영업활동에서 창출된 순가치의 증가분을 의미한다.\n② EVA는 자기자본에 대한 자본비용을 고려하지 않고 성과평가를 한다.\n③ EVA는 투자중심점이 고유의 영업활동에서 세금, 타인자본과 자기자본에 대한 자본비용을 초과하여\n벌어들인 이익을 의미한다.\n④ EVA는 발생주의 회계수치를 성과측정목적에 맞게 수정하여 계산한다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 111, "text": "[111]㈜삼일은 전자제품을 생산하여 판매하는 회사로서 각 사업부의 영업자산, 영업이익 및 매출액에 관한\n정보는 다음과 같다. 다음 중 투자수익률이 높은 사업부의 순서로 옳은 것은?\n구 분 휴대폰사업부 청소기사업부 냉장고사업부\n평균영업자산 1,000,000원 500,000원 2,000,000원\n영업이익 50,000원 30,000원 160,000원\n매출액 4,000,000원 3,000,000원 1,000,000원\n① 휴대폰 > 청소기 > 냉장고\n② 청소기 > 휴대폰 > 냉장고\n③ 냉장고 > 청소기 > 휴대폰\n④ 청소기 > 냉장고 > 휴대폰", "answer": 3}, {"year": "2024", "month": "7", "qnum": 106, "text": "[106]기업은 미래의 불확실성에 대처하기 위하여 계획을 수립하며, 이러한 계획의 일부분으로서 예산을 편\n성한다. 예산은 다양하게 분류할 수 있는데 조업도의 변동에 따라 조정되어 작성되는 예산을 무엇이라\n하는가?\n① 종합예산\n② 운영예산\n③ 고정예산\n④ 변동예산", "answer": 4}, {"year": "2024", "month": "7", "qnum": 107, "text": "[107]다음 중 책임회계제도에 관한 설명으로 옳지 않은 것은?\n① 책임회계제도가 그 기능을 효율적으로 수행하기 위해서는 각 책임중심점의 경영자가 권한을 위임받\n은 원가항목들에 대해 통제권을 행사할 수 없어야 한다.\n② 책임중심점이란 경영관리자가 특정활동에 대해 통제할 책임을 지는 조직의 부문을 말한다.\n③ 책임회계제도 하에서는 권한을 위임 받은 관리자가 책임범위 내에서 독자적인 의사결정을 내릴 수\n있다.\n④ 책임중심점은 책임의 성격 및 책임범위에 따라 원가중심점, 수익중심점, 이익중심점 및 투자중심점\n으로 분류할 수 있다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 108, "text": "[108]다음 중 책임중심점과 책임범위에 대하여 잘못 짝지어진 것은?\n① 원가중심점 – 통제가능한 원가\n② 수익중심점 – 매출액, 매출원가\n③ 이익중심점 – 수익, 원가\n④ 투자중심점 – 수익, 원가, 투자 의사결정", "answer": 2}, {"year": "2024", "month": "7", "qnum": 109, "text": "[109]다음 중 사업부별 성과평가에 관한 설명으로 옳은 것은?\n① 통제가능원가와 통제불능원가는 구분의 실익이 없다.\n② 특정사업부로의 추적가능성에 따른 사업부별 추적가능고정원가와 공통고정원가는 구분하지 않는 것\n이 바람직하다.\n③ 여러 사업부에 공통으로 관련되는 공통고정원가를 특정사업부에 임의로 배분하는 경우 성과의 왜곡\n이 발생할 수 있다.\n④ 특정사업부의 경영자에 대한 성과평가시 통제불능원가를 포함하는 것이 바람직하다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 107, "text": "[107]㈜삼일에 새로 부임한 박상무는 올해 철저한 성과평가제도의 도입을 검토하고 있다. 성과평가제도의\n도입과 관련하여 옳지 않은 주장을 펼치고 있는 실무담당자는 누구인가?\n유팀장 : 효율적인 성과평가제도는 기업 구성원들의 성과극대화 노력이 기업전체 목표의 극대화로\n연결될 수 있도록 설계되어야 합니다.\n장과장 : 각 책임중심점의 성과평가를 수행하는 과정에서 성과측정의 오류가 발생하는 것이 일반적\n인데, 효율적인 성과평가제도는 성과평가치의 성과측정오류가 최소화되도록 설계되어야\n합니다.\n김대리 : 많은 시간과 비용을 투입할수록 더욱 정확하고 공정한 성과평가가 가능하므로 성과평가제\n도의 운영을 적시성 및 경제성의 잣대로 바라보지 않도록 주의해야 합니다.\n최사원 : 성과평가를 한다는 사실 자체가 피평가자의 행위에 영향을 미치는 현상도 고려하여 이를\n적절히 반영해야 합니다.\n① 유팀장\n② 장과장\n③ 김대리\n④ 최사원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 110, "text": "[110]다음 중 투자중심점의 성과지표로 투자수익률(ROI : return on investment)을 사용할 때의 특징으로\n옳은 것은?\n① 준최적화 현상이 발생하지 않는다.\n② 현금의 흐름을 기준으로 성과를 평가하므로 적용되는 회계기준과 무관한 결과를 도출한다.\n③ 투자규모가 다른 투자중심점의 상호 비교가 어렵다는 단점이 있다.\n④ 자본예산기법에 의한 성과평가에 비하여 단기적인 성과를 강조한다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 111, "text": "[111]다음 재무자료를 이용하여 계산한 경제적부가가치(EVA)가 14억원인 경우, 자기자본비용을 계산하면 얼\n마인가(단, 아래의 자료에서 법인세효과는 무시한다)?\n매출액 120억원\n매출원가 75억원\n판매비와관리비 15억원\n투하자본(타인자본 120억원, 자기자본 80억원) 200억원\n타인자본비용 6 %\n① 10 %\n② 11 %\n③ 12 %\n④ 13 %", "answer": 2}, {"year": "2024", "month": "11", "qnum": 106, "text": "[106]다음 중 예산에 관한 설명으로 옳지 않은 것은?\n① 기업의 공식적인 경영계획을 화폐단위로 표시한 것이다.\n② 조직구성원에게 동기를 부여함과 동시에 의사전달과 조정의 역할을 수행한다.\n③ 예산편성 방법에 따라 예산을 분류함에 있어, 조업도의 변동을 고려하지 않고 작성되는 예산을 재\n무예산이라고 한다.\n④ 예산편성 대상에 따라 종합예산과 부문예산으로 구분된다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 107, "text": "[107]다음 중 효율적인 성과평가제도를 설계하기 위해 고려해야 할 사항에 관한 설명으로 옳지 않은 것은?\n① 각 책임중심점들의 이익극대화가 기업 전체적인 이익극대화로 이어지지 않도록 설계되어야 한다.\n② 성과평가치의 성과측정 오류가 최소화 되도록 설계되어야 한다.\n③ 적시성과 경제성을 적절히 고려하여야 한다.\n④ 각 책임중심점의 행동에 미치는 영향을 적절히 고려하여야 한다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 108, "text": "[108]다음 중 책임회계제도에 관한 설명으로 옳지 않은 것은?\n① 책임회계제도는 실제 성과와 예산과의 차이를 쉽게 파악할 수 있게 해줌으로써 예외에 의한 관리가\n가능하다.\n② 책임중심점은 책임의 성격 및 책임범위에 따라 원가중심점, 수익중심점, 이익중심점 및 투자중심점\n으로 분류할 수 있다.\n③ 이익중심점은 원가와 수익에 대해서 통제책임을 지는 책임중심점이다.\n④ 책임회계제도가 그 기능을 효율적으로 수행하기 위해서는 각 책임중심점의 경영자가 권한을 위임받\n은 원가항목들에 대해 통제권을 행사할 수 없어야 한다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 110, "text": "[110]다음 중 투자수익률법(return on investment : ROI)에 관한 설명으로 옳지 않은 것은?\n① 투자규모가 다른 투자중심점을 상호 비교하기가 용이하다.\n② 사업부의 이익뿐만 아니라 투자액도 함께 고려하는 성과평가 기준이다.\n③ 고정원가가 존재할 경우, 매출액이 증가해도 투자수익률은 증가하지 않는다.\n④ 준최적화 현상이 발생하지 않도록 유의하여야 한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 111, "text": "[111]다음 자료를 기초로 하여 경제적부가가치(EVA)를 계산하면 얼마인가?\n세후순영업이익 100억원\n투하자본 400억원\n타인자본비용 6 %\n자기자본비용 12 %\n부채비율(부채/자본) 100 %\n세율 20 %\n① 52.8억원\n② 56.4억원\n③ 62.8억원\n④ 66.4억원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 119, "text": "[119]기업 내 사업부 간에 이루어지는 이전거래의 가격을 대체가격이라고 한다. 다음 중 각 대체가격결정방\n법에 대한 설명으로 옳지 않은 것은?\n① 시장가격기준 : 거래될 재화에 대한 완전경쟁시장이 존재하고 각 사업부의 의사결정이 자율성을 가\n진다면, 목표일치성 및 성과평가 측면에서의 공정성을 대체로 만족시킨다고 본다.\n② 원가기준 : 공급사업부의 비능률이 모두 수요사업부에 전가되기 때문에 원가통제에 대한 동기부여\n가 어렵다.\n③ 원가기준 : 준최적화 현상이 나타날 가능성이 존재한다.\n④ 협상가격기준 : 각 사업부 관리자의 자율성을 저해한다는 단점이 있으나, 협상과정에서 시간의 소\n요가 적다는 장점이 존재한다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 107, "text": "[107]다음 중 사업부별 성과평가시 사업부경영자의 성과를 평가할 때 포함하여야 하는 원가는 무엇인가?\n① 공통 고정원가\n② 추적불가능하고 통제불가능한 고정원가\n③ 추적불가능하고 통제가능한 고정원가\n④ 추적가능하고 통제가능한 고정원가", "answer": 4}, {"year": "2024", "month": "12", "qnum": 108, "text": "[108]분권화란 의사결정권한이 조직 전반에 걸쳐서 위양되어 있는 상태를 의미한다. 다음 중 분권화에 관한\n설명으로 옳지 않은 것은?\n① 각 사업부에서 동일한 활동이 개별적으로 중복되어 수행될 가능성이 있다.\n② 하위경영자들이 고객 등의 요구에 신속한 대응을 하기 어렵다.\n③ 분권화될 경우 각 사업부의 이익만 고려하는 준최적화 현상이 발생할 수 있다.\n④ 하위 경영자들에게 보다 큰 재량권이 주어지므로 보다 많은 동기 부여가 된다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 110, "text": "[110]㈜삼일의 분권화된 사업부 A의 당기 영업이익은 1,800,000원이며, 평균 영업자산은 5,000,000원, 평\n균 이자부부채는 1,500,000원이다. 다음 중 사업부 A의 투자수익률(ROI)로 옳은 것은?\n① 18 %\n② 36 %\n③ 43 %\n④ 51 %", "answer": 2}, {"year": "2024", "month": "12", "qnum": 111, "text": "[111]다음 중 경제적부가가치(EVA)와 관련된 설명으로 옳지 않은 것은?\n① 고유의 영업활동에서 창출된 순가치의 증가분을 의미한다.\n② 가중평균자본비용의 측정에 있어 이자비용의 법인세 절감효과는 별도로 고려하지 않는다.\n③ 세후순영업이익이 증가하면, 경제적 부가가치는 증가한다.\n④ 투하자본의 회전율을 높이면 매출액이익률이 동일하더라도 경제적부가가치는 높아진다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 120, "text": "[120]다음 중 균형성과표의 관점과 그에 대한 적절한 성과평가지표를 연결한 것으로 옳은 것은?\n① 재무적 관점 – 총자산수익률, 배송시간\n② 고객 관점 – 고객만족도, 고객유지율\n③ 내부프로세스 관점 – 종업원 직무만족도, 이직률\n④ 학습과 성장 관점 – 서비스 대응시간, 주문 - 배달기간", "answer": 2}, {"year": "2025", "month": "1", "qnum": 107, "text": "[107]다음 중 고정예산에 관한 설명으로 옳은 것은?\n① 특정수준의 조업도를 기준으로 하여 사전에 수립되는 예산이다.\n② 특정기간의 조업도의 변화여부를 고려하여 고정예산을 조정할 필요가 있다.\n③ 특정산출량에 대하여 사용된 투입량의 정도에 대한 정보를 제공한다.\n④ 통제를 위한 정보로서 적합하며 경영관리적 측면에서 큰 의미를 갖는다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 108, "text": "[108]다음 중 책임회계제도에 관한 설명으로 옳지 않은 것은?\n① 책임중심점이란 경영관리자가 특정활동에 대해 통제할 책임을 지는 조직의 부문을 말한다.\n② 원가중심점은 특정 원가의 발생에만 통제책임을 지는 책임중심점으로 판매부서 및 영업소 등이 원\n가중심점의 예가 될 수 있다.\n③ 수익중심점은 매출액에 대해서만 통제책임을 지는 책임중심점으로 기업의 최종산출물인 제품 또는\n서비스의 판매수익을 창출하는데 일차적인 책임을 진다.\n④ 투자중심점은 책임의 범위가 가장 포괄적인 책임중심점이다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 111, "text": "[111]다음 중 경제적부가가치(EVA)에 관한 설명으로 옳지 않은 것은?\n① 자기자본비용과 타인자본비용을 모두 고려한다.\n② 전체 기업활동에서 창출된 순가치의 증가분을 의미한다.\n③ 주주관점에서 기업의 경영성과를 보다 정확히 측정하는데 도움이 된다.\n④ 투자중심점과 회사전체의 목표일치성을 충족시킬 수 있다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 106, "text": "[106]기업은 미래의 불확실성에 대처하기 위하여 계획을 수립하며, 이러한 계획의 일부분으로서 예산을 편\n성한다. 예산은 다양하게 분류할 수 있는데 조업도 변동에 따라 작성되는 예산으로서, 실제원가를 실\n제조업도 수준의 예산원가와 비교하는 예산으로 가장 옳은 것은?\n① 부문예산\n② 운영예산\n③ 변동예산\n④ 고정예산", "answer": 3}, {"year": "2025", "month": "3", "qnum": 110, "text": "[110]다음 중 사업부제에서 투자수익률을 이용하여 각 사업부의 성과를 평가할 때의 문제점으로 옳은 것은?\n① 사업부의 이익만을 고려하므로 투자중심점의 성과평가기준으로 적절하지 않다.\n② 회계이익이 아닌 현금의 흐름을 기준으로 성과를 평가하므로 업종에 따라 다른 영향을 미칠 수 있\n다.\n③ 소규모 투자중심점보다 대규모 투자중심점이 상대적으로 유리한 성과평가를 받는다.\n④ 투자중심점의 투자수익률 극대화 노력이 회사 전체 관점에서는 채택하는 것이 유리한 투자안을 부\n당하게 기각할 가능성이 있다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 111, "text": "[111]㈜삼일은 투자중심점으로 운영되는 X, Y 사업부로 구성되어 있으며, 각 사업부는 경제적부가가치로 성\n과평가를 받고 있다. 각 사업부의 20X1 년 실제자료는 다음과 같다(단, 총자산은 모두 영업자산이며,\n유동부채는 모두 무이자부채이다).\n구 분 X 사업부 Y 사업부\n총 자 산 100,000원 400,000원\n유 동 부 채 20,000원 100,000원\n영업이익(세전) 40,000원 80,000원\n㈜삼일의 가중평균자본비용 계산과 관련된 자료는 다음과 같다.\n시장가액 자본비용\n타 인 자 본 750,000원 12 %\n자 기 자 본 250,000원 20 %\n법인세율이 20 % 일 때 Y 사업부의 경제적부가가치는 얼마인가?\n① 15,200원\n② 22,000원\n③ 27,400원\n④ 43,400원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 81, "text": "[81]다음 중 주로 내부이용자의 경제적 의사결정에 유용한 정보를 제공하는 것을 목적으로 하는 회계분야에\n관한 설명으로 옳지 않은 것은?\n① 의사결정, 계획과 통제 및 성과평가에 유용한 정보를 제공한다.\n② 반드시 회계기준을 적용할 필요는 없다.\n③ 특수목적의 보고서를 통해 정보를 제공한다.\n④ 주로 과거지향적이며, 객관성을 강조한다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 106, "text": "[106]기업은 미래의 불확실성에 대처하기 위하여 계획을 수립하며, 이러한 계획의 일부분으로서 예산을 편\n성한다. 예산은 다양하게 분류할 수 있는데 조업도의 변동을 고려하지 않고 특정조업도를 기준으로 작\n성되는 예산을 무엇이라 하는가?\n① 종합예산\n② 운영예산\n③ 고정예산\n④ 변동예산", "answer": 3}, {"year": "2025", "month": "5", "qnum": 107, "text": "[107]다음 중 책임회계제도에 대한 설명으로 옳지 않은 것은?\n① 책임중심점이란 경영관리자가 특정활동에 대해 통제할 책임을 지는 조직의 부문을 말한다.\n② 책임중심점은 책임의 성격 및 책임범위에 따라 원가중심점, 수익중심점, 이익중심점 및 투자중심점\n으로 분류할 수 있다.\n③ 수익중심점은 매출액에 대해서만 통제책임을 지는 책임중심점으로 기업의 최종산출물인 제품 또는\n서비스의 판매수익을 창출하는데 일차적인 책임을 진다.\n④ 원가중심점은 특정 원가의 발생에만 통제책임을 지는 책임중심점으로 경제적부가가치(EVA)를 통해\n성과를 측정할 수 있다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 109, "text": "[109]다음은 ㈜삼일의 컨설팅부분 20X1년 재무자료이다. ㈜삼일의 컨설팅부문 20X1년 잔여이익은 얼마인\n가?\n매출액 100,000원\n매출원가 50,000원\n판매비와관리비 43,000원\n평균 영업자산 20,000원\n최저필수수익률 15 %\n① 900원\n② 3,000원\n③ 4,000원\n④ 7,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 110, "text": "[110]다음 중 분권화와 책임회계, 성과평가 등과 관련한 설명으로 옳지 않은 것은?\n① 원가중심점은 통제가능한 원가의 발생에 대해서만 책임을 지며, 제조부문이 한 예이다.\n② 잔여이익의 준최적화 문제를 해결하기 위하여 투자수익률(ROI)이라는 개념이 나타났다.\n③ 잔여이익은 투자규모가 다른 투자중심점을 상호 비교하기가 어렵다.\n④ 분권화된 사업부는 기업전체의 관점에서 최적이 아닌 의사결정을 할 가능성이 있다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 111, "text": "[111]다음은 ㈜삼일의 재무상태표와 포괄손익계산서 자료의 일부이다.\n항 목 금 액 항 목 금 액\n유동자산(영업자산) 12,000원 유동부채(무이자부채) 6,000원\n비유동자산(영업자산) 8,000원 세전영업이익 5,000원\n㈜삼일의 가중평균자본비용 계산에 관련된 자료가 다음과 같을 때 경제적부가가치(EVA)를 계산하면 얼\n마인가(단, 법인세율은 30 % 이다)?\n타인자본시장가치 20,000원 이자율 10 %\n자기자본시장가치 20,000원 자기자본비용 13 %\n① 1,270원\n② 1,890원\n③ 2,100원\n④ 2,900원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 106, "text": "[106]다음 중 효율적인 성과평가제도를 설계하기 위해 고려해야 할 사항에 관한 설명으로 옳지 않은 것은?\n① 각 책임중심점들의 이익극대화가 기업 전체적인 이익극대화로 연결될 수 있도록 설계되어야 한다.\n② 성과평가치의 성과측정 오류가 최소화 되도록 설계되어야 한다.\n③ 성과평가에 많은 시간과 비용을 투입하면 적시성과 경제성을 얻을 수 있다.\n④ 각 책임중심점의 행동에 미치는 영향을 적절히 고려하여야 한다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 109, "text": "[109]다음 중 투자중심점의 성과평가에 관한 설명으로 옳은 것은?\n① 투자중심점의 성과평가를 위해서는 각 사업부 경영자에게 배부되는 통제가능한 투자액을 고려하지\n않고 매출액이나 공헌이익 등의 지표들만을 반영하는 것이 적절하다.\n② 투자수익률은 화폐의 시간가치를 고려하지 않기 때문에 순현재가치법이나 내부수익률법과 같은 자\n본예산기법에 의한 성과평가에 비하여 장기적인 성과를 강조한다.\n③ 투자수익률은 현금흐름으로 평가하기 때문에 회계원칙에 대한 영향을 받지 않는다.\n④ 잔여기준으로 성과평가를 하는 경우 산업간 위험의 차이에 대해서 쉽게 조정할 수 있다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 110, "text": "[110]다음 중 경제적부가가치(EVA)에 관한 설명으로 옳은 것은?\n① 경제적부가가치는 기업의 영업, 투자, 재무활동을 모두 반영한 이익개념이다.\n② 경제적부가가치는 자기자본에 대한 자본비용만을 고려한 이익개념이다.\n③ 주주관점에서 기업의 경영성과를 보다 정확히 측정하는데 도움이 된다.\n④ 경제적부가가치 계산시 적용되는 이익은 세전영업이익이다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 120, "text": "[120]다음 중 균형성과표(BSC)에 관한 설명으로 옳지 않은 것은?\n① 균형성과표는 재무적인 성과지표를 중심으로 하는 전통적인 성과측정제도의 문제점을 보완할 수 있\n는 성과측정시스템으로 인식되고 있다.\n② 균형성과표는 조직의 수익성을 최종적인 목표로 설정하기 때문에 재무적관점이 비재무적관점보다\n더 중요시 된다.\n③ 균형성과표의 네 가지 관점에는 재무적, 고객, 내부프로세스 및 학습과 성장 관점이 있다.\n④ 균형성과표에서 제시된 정보는 외부 성과지표와 내부 성과지표 사이의 균형을 제공한다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 106, "text": "[106]다음 중 예산에 관한 설명으로 옳지 않은 것은?\n① 성과평가의 기준을 제공한다.\n② 예산편성 대상에 따라 운영예산과 재무예산으로 구분된다.\n③ 기업이 미래의 불확실성에 대처하기 위하여 수립하는 계획의 일부이다.\n④ 조직구성원에게 동기를 부여하고 의사전달과 조정의 역할을 수행한다.", "answer": 2}, {"year": "2025", "month": "7", "qnum": 109, "text": "[109]완전경쟁시장이 존재하는 경우 분권화된 사업부 조직에서 사업부간 공정한 성과평가의 기준으로 가장\n적절한 기준은?\n① 협상가격\n② 변동원가\n③ 취득가격\n④ 시장가격", "answer": 4}, {"year": "2025", "month": "7", "qnum": 110, "text": "[110]㈜삼일은 투하자본이 3,000,000원이며 세전영업이익은 525,000원이다. ㈜삼일의 가중평균자본비용 계\n산에 관련된 자료는 다음과 같다. 법인세율이 20 % 라고 할 경우, ㈜삼일의 경제적부가가치(EVA)는 얼\n마인가?\n이자부부채 시장가치 8,000,000원 이자율 5 %\n자기자본 시장가치 8,000,000원 자기자본비용 14 %\n① 100,000원\n② 130,000원\n③ 150,000원\n④ 185,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 111, "text": "[111]㈜삼일은 가전제품을 생산하여 판매하는 회사로 세 개의 사업부 A, B, C는 모두 투자중심점으로 설계\n되어 운영되고 있다. 회사 및 각 사업부의 최저필수수익률은 15 % 이며, 각 사업부의 20X1년도 매출\n액, 영업이익 및 영업자산에 관한 자료는 다음과 같다.\n사업부 A 사업부 B 사업부 C\n매출액 500,000원 300,000원 100,000원\n영업이익 78,000원 50,000원 36,000원\n평균영업자산 300,000원 200,000원 150,000원\n20X1년 말 현재 사업부 A는 50,000원을 투자하면 연간 9,000원의 영업이익을 추가로 얻을 수 있는\n신규 투자안을 고려하고 있다. 이 신규 투자에 소요되는 예산은 현재의 자본비용 수준으로 조달할 수\n있다. ㈜삼일이 투자수익률 혹은 잔여이익으로 사업부를 평가하는 경우, 다음 설명 중 옳지 않은 것\n은?\n① 투자수익률 혹은 잔여이익 중 어느 것으로 사업부를 평가하더라도, 신규 투자안을 고려하기 이전인\n20X1년에는 사업부 A가 가장 우수하다.\n② 투자수익률로 사업부를 평가하는 경우, 사업부 A의 경영자는 동 사업부가 현재 고려 중인 신규 투\n자안을 채택할 것이다.\n③ 잔여이익으로 사업부를 평가하는 경우, 사업부 A의 경영자는 동 사업부가 현재 고려 중인 신규 투\n자안을 채택할 것이다.\n④ 투자수익률 혹은 잔여이익 중 어느 것으로 사업부를 평가하더라도, 회사전체 관점에서는 사업부 A\n가 고려 중인 신규 투자안을 채택하는 것이 유리하다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 106, "text": "[106]다음 예산에 대한 설명 중 옳은 것은 모두 몇 개인가?\nㄱ. 변동예산은 사전에 계획된 목표의 달성 정도는 물론이고 특정 산출량에 대하여 사용된\n투입량의 정도에 관한 정보도 제공한다.\nㄴ. 변동예산은 특정기간 동안의 조업도의 변화 여부를 고려하지 않는다.\nㄷ. 고정예산과 변동예산은 예산의 편성대상 차이에 따른 분류이다.\nㄹ. 고정예산은 변동예산에 비하여 통제를 위한 정보로서 적합하며, 경영관리적 측면에서\n큰 의미를 갖는다.\n① 1 개\n② 2 개\n③ 3 개\n④ 4 개", "answer": 1}, {"year": "2025", "month": "9", "qnum": 107, "text": "[107]책임회계제도에 기반을 둔 경영체제가 운영되기 위해서는 책임중심점이 있어야 한다. 다음 중 책임중\n심점별로 통제책임을 지는 부문과 부서의 연결이 옳은 것은?\n① 수익중심점 - 영업소\n② 원가중심점 - 분권화된 조직\n③ 이익중심점 – 제조부문\n④ 투자중심점 - 판매부서", "answer": 1}, {"year": "2025", "month": "9", "qnum": 108, "text": "[108]다음은 ㈜삼일의 20X1년도 이익중심점으로 분류되는 A사업부의 요약손익계산서이다.\n공헌이익 1,000,000원\n추적가능 ․ 통제가능고정원가 100,000원\n사업부경영자공헌이익 900,000원\n추적가능 ․ 통제불능고정원가 200,000원\n사업부공헌이익 700,000원\n공통고정원가배분액 300,000원\n순이익 400,000원\nA사업부의 성과평가 목적에 적합한 이익은 얼마인가?\n① 공헌이익 1,000,000원\n② 사업부경영자공헌이익 900,000원\n③ 사업부공헌이익 700,000원\n④ 순이익 400,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 110, "text": "[110]다음은 버터식빵을 만들어 판매하는 ㈜삼일의 제품 생산량이 1,000단위일 때 해당 공정의 생산 관련\n자료이다. ㈜삼일의 원재료 성과평가에 관한 설명으로 옳은 것은?\n표준 실제\n구 분\n사용량(KG) 단가(원 / KG) 사용량(KG)\n밀가루 50 1,000 48,000\n설 탕 20 2,000 23,000\n버 터 10 5,000 11,000\n① 원재료의 수량(능률)차이는 9,000,000원만큼 유리한 차이가 발생한다.\n② 배합차이는 5,500,000원만큼 불리한 차이가 발생한다.\n③ 수율차이는 3,000,000원만큼 불리한 차이가 발생한다.\n④ 원재료의 수율차이가 발생하는 근본적인 이유는 투입요소 사이의 대체성 때문이다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 111, "text": "[111]다음 중 경제적부가가치 산출시, 투하자본을 구하는 과정에 관한 설명으로 옳지 않은 것은?\n① 기업 전체 자산을 영업활동과 관련된 자산과 영업활동과 관련이 없는 자산으로 구분한다.\n② 자산 중 적정 시재 이상의 현금 및 금융상품, 영업활동과 관련없는 대여금 등은 비영업자산으로 구\n분해야 한다.\n③ 투자부동산, 콘도회원권 등 영업과 무관한 투자자산은 비영업자산으로 구분한다.\n④ 단기차입금이나 유동성장기차입금의 경우, 영업활동을 위해 조달된 운전자본이므로 순운전자본을\n산출할 때 차감되어야 한다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 118, "text": "[118]기업 내 사업부 간에 이루어지는 이전거래의 가격을 대체가격이라고 한다. 다음 중 각 대체가격 결정\n방법에 관한 설명으로 옳지 않은 것은?\n① 시장가격기준 : 거래될 재화에 대한 완전경쟁시장이 존재하고 각 사업부 관리자의 의사결정이\n자율성을 가진다면, 목표일치성 및 성과평가 측면에서의 공정성을 대체로 만\n족시킨다고 본다.\n② 원가기준 : 수요사업부의 비능률이 모두 공급사업부에 전가되기 때문에 원가통제에 대한\n동기부여가 어렵다.\n③ 원가기준 : 준최적화 현상이 나타날 가능성이 존재한다.\n④ 협상가격기준 : 각 사업부의 이익이 관리자의 능력에 민감하게 영향을 받는다는 단점이 있다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 106, "text": "[106]기업은 미래의 불확실성에 대처하기 위하여 계획을 수립하며, 이러한 계획의 일부분으로서 예산을 편\n성한다. 예산은 다양하게 분류할 수 있는데, 그 중 조업도 변동에 따라 작성되는 예산으로서 실제원가\n를 실제조업도 수준의 예산원가와 비교하는 것은 무엇인가?\n① 종합예산\n② 운영예산\n③ 고정예산\n④ 변동예산", "answer": 4}, {"year": "2025", "month": "11", "qnum": 107, "text": "[107]다음 중 책임중심점과 책임범위에 대하여 잘못 짝지어진 것은?\n① 투자중심점 - 수익, 원가, 투자 의사결정\n② 이익중심점 - 수익, 원가\n③ 수익중심점 - 매출액, 매출원가\n④ 원가중심점 - 통제가능한 원가", "answer": 3}, {"year": "2025", "month": "11", "qnum": 108, "text": "[108]분권화란 의사결정권한이 조직 전반에 걸쳐서 위임되어 있는 상태를 의미한다. 다음 중 분권화의 문제\n점으로 옳지 않은 것은?\n① 분권화될 경우 각 사업부의 이익만 고려하는 준최적화 현상이 발생할 수 있다.\n② 고객, 공급업체 및 종업원의 요구에 대한 신속한 대응이 어려워진다.\n③ 각 사업부에서 동일한 활동이 개별적으로 중복 수행될 수 있다.\n④ 각 사업부간의 협력이 저해되어 비효율을 초래할 수 있다.", "answer": 2}, {"year": "2025", "month": "11", "qnum": 110, "text": "[110]다음 중 투자중심점의 성과지표로 투자수익률(ROI : return on investment)을 사용할 때의 특징으로\n옳은 것은?\n① 준최적화 현상을 방지할 수 있다.\n② 사업부의 경영자가 자신의 사업부 투자액에 대한 통제 권한이 있는 경우 그 경영자의 성과평가지표\n로 활용할 수 없다.\n③ 투자규모가 다른 투자중심점의 상호 비교가 어렵다는 단점이 있다.\n④ 자본예산기법에 의한 성과평가에 비하여 단기적인 성과를 강조한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 111, "text": "[111]다음 재무자료를 이용하여 계산한 경제적부가가치(EVA)가 12억원인 경우, 자기자본비용을 계산하면 얼\n마인가(단, 아래의 자료에서 법인세효과는 무시한다)?\n매출액 120억원\n매출원가 75억원\n판매비와관리비 15억원\n투하자본(타인자본 100억원, 자기자본 100억원) 200억원\n타인자본비용 6 %\n① 10 %\n② 11 %\n③ 12 %\n④ 13 %", "answer": 3}, {"year": "2025", "month": "12", "qnum": 106, "text": "[106]다음 중 변동예산을 사용하는 목적에 관한 설명으로 옳은 것은?\n① 실제 조업도 수준에서 예산원가와 실제원가를 비교 평가하기 위하여\n② 기준 조업도 수준에서 예산원가와 실제원가를 비교 평가하기 위하여\n③ 하부 경영자들에게 권한을 위양하기 위하여\n④ 예산설정에 소요되는 총시간을 감소시켜 업무 효율을 높이기 위하여", "answer": 1}, {"year": "2025", "month": "12", "qnum": 107, "text": "[107]다음 중 책임회계제도에 관한 설명으로 옳지 않은 것은?\n① 책임회계제도는 실제 성과와 예산과의 차이를 쉽게 파악할 수 있게 해줌으로써 예외에 의한 관리가\n가능하다.\n② 책임중심점은 책임의 성격 및 책임범위에 따라 원가중심점, 수익중심점, 이익중심점 및 투자중심점\n으로 분류할 수 있다.\n③ 원가중심점은 통제가능한 원가의 발생에 대해서만 책임을 지는 책임중심점이다.\n④ 책임회계제도가 그 기능을 효율적으로 수행하기 위해서는 각 책임중심점의 경영자가 권한을 위임받\n은 원가항목들에 대해 통제권을 행사할 수 없어야 한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 108, "text": "[108]다음 중 효율적인 성과평가제도를 설계하기 위해 고려해야 할 사항에 관한 설명으로 옳지 않은 것은?\n① 각 책임중심점들의 이익극대화가 기업 전체적인 이익극대화로 이어질 수 있도록 설계되어야 한다.\n② 성과평가치의 성과측정 오류가 최소화 되도록 설계되어야 한다.\n③ 각 책임중심점의 행동에 미치는 영향을 고려하여서는 안된다.\n④ 적시성과 경제성을 적절히 고려하여야 한다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 110, "text": "[110]㈜삼일은 전자제품을 생산하여 판매하는 회사로서 각 사업부의 영업자산, 영업이익 및 매출액에 관한\n정보는 다음과 같다. 다음 중 투자수익률이 높은 사업부의 순서로 옳은 것은?\n구 분 휴대폰사업부 청소기사업부 냉장고사업부\n평균영업자산 1,500,000원 1,000,000원 2,000,000원\n영업이익 150,000원 230,000원 220,000원\n매출액 5,000,000원 3,000,000원 1,000,000원\n① 휴대폰 > 청소기 > 냉장고\n② 청소기 > 휴대폰 > 냉장고\n③ 냉장고 > 청소기 > 휴대폰\n④ 청소기 > 냉장고 > 휴대폰", "answer": 4}, {"year": "2025", "month": "12", "qnum": 111, "text": "[111]다음 중 경제적부가가치(EVA)에 관한 설명으로 옳지 않은 것은?\n① 고유의 영업활동에서 창출된 순가치의 증가분과 영업외수익에서 발생한 순가치의 증가분을 합산하\n여 산출한다.\n② 타인자본비용의 측정에 있어 이자비용의 법인세 절감효과를 고려하여야 한다.\n③ 세후순영업이익이 증가하면, 경제적 부가가치는 증가한다.\n④ 투하자본의 회전율을 높이면 매출액이익률이 동일하더라도 경제적부가가치는 높아진다.", "answer": 1}], "07_의사결정": [{"year": "2024", "month": "1", "qnum": 112, "text": "[112]㈜삼일은 6개월 전에 차량을 2,000,000원에 구입하였으나 침수로 인해 이 차량을 더 이상 사용할 수\n없게 되었다. 회사는 동 차량에 대하여 수리비용 2,000,000원을 들여 2,500,000원에 팔거나 현재 상\n태로 거래처에 1,000,000원에 팔 수 있다. 이런 경우에 총매몰원가는 얼마인가?\n① 1,000,000원\n② 2,000,000원\n③ 2,500,000원\n④ 4,000,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 113, "text": "[113]다음 중 의사결정에 관한 설명으로 옳지 않은 것은?\n① 고정원가가 당해 의사결정과 관계없이 계속 발생한다면 해당 고정원가는 비관련원가이다.\n② 현재 시설능력을 100 % 활용하고 있는 기업은 특별주문의 수락 여부를 고려할 때 동 주문생산에 따\n른 추가 시설 임차료를 고려하여야 한다.\n③ 제품라인을 폐지한 후 유휴생산시설을 이용하여 발생시키는 수익은 의사결정시 고려하여야 한다.\n④ 부품의 자가제조 또는 외부구입 의사결정시 회피가능원가가 외부구입원가보다 작은 경우에는 외부\n구입하는 것이 바람직하다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 115, "text": "[115]㈜삼일은 제품A의 생산을 위하여 필요한 부품 X를 직접 생산하여 사용하고 있다. ㈜삼일의 부품 X 제\n조에 대한 원가자료는 다음과 같다.\n부품단위당 직접재료원가 500원\n부품단위당 직접노무원가 100원\n부품단위당 변동제조간접원가 200원\n부품 X 관련 고정제조간접원가 500,000원\n생산량 5,000단위\n㈜삼일은 현재 원가절감을 위하여 부품 X의 외부구매를 검토하고 있다. 부품을 외부에서 구입할 경우\n고정제조간접원가의 40 % 는 계속해서 발생할 것이다. ㈜삼일이 최대한 허용할 수 있는 부품의 단위당\n구입가격은 얼마인가?\n① 800원\n② 840원\n③ 860원\n④ 900원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 116, "text": "[116]다음 중 자본예산에 관한 설명으로 옳지 않은 것은?\n① 자본예산은 고정자산에 대한 효율적인 투자 수행을 위해 투자안의 타당성을 평가하는 기법이다.\n② 자본예산은 고정자산에 대한 투자안의 현금흐름이나 이익에 미치는 영향을 평가하는 기법이다.\n③ 자본예산에 의한 투자는 불확실성(경제상황, 소비자 선호, 기술진보 등)으로 인한 위험이 크다.\n④ 자본예산은 기업의 장·단기적 경영계획에 바탕을 둔 장·단기투자에 관한 의사결정이다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 117, "text": "[117]㈜삼일은 당기 초 새로운 투자안에 950,000원을 투자하였다. 회사는 이 투자안으로부터 앞으로 5년\n동안 매년 말 280,000원의 세후 현금유입을 예측하고 있다. 회사의 최저필수수익률이 연 10 % 일 경\n우 이 투자안의 순현재가치(NPV)는 얼마인가?\n연 10 %\n5년 현가계수 0.62\n5년 연금현가계수 3.79\n① 111,200원\n② 120,000원\n③ 187,000원\n④ 279,000원", "answer": 1}, {"year": "2024", "month": "1", "qnum": 118, "text": "[118]장기의사결정을 위한 방법 중 회수기간법은 여러가지 이론적인 단점에도 불구하고 실무상 많이 사용되\n고 있다. 다음 중 회수기간법이 실무에서 많이 사용되는 이유로 옳지 않은 것은?\n① 비현금자료도 반영되는 포괄적 분석기법이다.\n② 기업의 유동성 확보와 관련된 의사결정에 유용하다.\n③ 화폐의 시간적 가치를 고려하지 않으므로 순현재가치법, 내부수익률법에 비해서 적용하기가 쉽다.\n④ 위험지표(risk indicator)로서의 정보를 제공한다.", "answer": 1}, {"year": "2024", "month": "1", "qnum": 120, "text": "[120]다음 중 품질원가에 관한 설명으로 옳지 않은 것은?\n① 품질원가란 불량품이 생산되지 않도록 하거나 불량품이 생산된 결과로 발생하는 모든 원가를 말한\n다.\n② 예방원가란 불량품의 생산을 예방하기 위한 원가로 공급업체 평가원가, 품질관리시스템 기획원가\n등이 있다.\n③ 내부실패원가와 외부실패원가는 불량품이 생산된 결과로써 발생하는 원가이므로 실패원가라고 한\n다.\n④ 일반적으로 예방원가와 평가원가가 증가하면 실패원가도 증가하게 된다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 112, "text": "[112]㈜삼일은 제조에 필요한 부품을 자가제조할 것인지 아니면 외부구입할 것인지의 여부에 대한 의사결정\n을 하려고 한다. 이에 관한 설명 중 옳지 않은 것은?\n① 회피가능 고정원가는 의사결정을 하는데 있어 고려대상이 아니다.\n② 매몰원가는 비관련원가로 의사결정을 하는데 영향을 미치지 않는다.\n③ 외부구입원가가 회피가능원가보다 큰 경우에는 자가제조하는 것이 바람직하다.\n④ 기존설비를 다른 용도로 사용함에 따라 발생할 수 있는 기회비용도 함께 고려해야 한다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 113, "text": "[113]다음은 로스쿨과 관련한 신문기사 내용이다. 의사결정과 관련하여 괄호 안에 들어갈 용어로 옳은 것\n은?\n로스쿨은 도전할 만한 가치가 있는 것일까?\n로스쿨의 연간 등록금은 최소 8백만원에서 최대 2천만원이 넘는 곳까지 천차만별이다. 책값과\n생활비 등을 감안하면 사립대의 경우 로스쿨에 다니는 동안 9천만원 ~ 1억원 정도는 투자해야\n할 각오를 해야 한다.\n하지만 등록금보다 더 큰 부담은 ( )로 볼 수 있다. 직장에서 휴직을 허용하고, 로스쿨 진\n학 비용을 대주지 않는 한 직장인이 로스쿨에 다니려면 사표를 내야 한다. 연봉 3천만원인 직장\n인이 로스쿨을 다니기 위해 사표를 낸다면 3년 동안 ( )가 1억원에 이른다. 사립대 로스쿨\n에 들어간다면 ( )와 등록금까지 감안하여 2억원에 이르는 돈을 투자하는 것이다.\n① 기회원가\n② 매몰원가\n③ 추적불능원가\n④ 추적가능원가", "answer": 1}, {"year": "2024", "month": "3", "qnum": 116, "text": "[116]다음 중 장기의사결정을 위한 자본예산 과정의 현금흐름 추정원칙으로 옳지 않은 것은?\n① 증분현금흐름을 측정할 때 과거의 투자결정에 의한 매몰원가는 제외한다.\n② 법인세가 고려되어야 한다.\n③ 감가상각비는 현금흐름에 직·간접적으로 어떠한 영향도 미치지 않는다.\n④ 현금흐름계산에서 이자비용은 할인율에 반영하여 계산한다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 117, "text": "[117]다음 자료에 의하여 회수기간법에 따른 의사결정을 할 경우 옳은 것은?\n㈜삼일은 190,000 원에 기계를 구입하고자 하며, 조건은 다음과 같다.\n• 5년 이내에 회수가 되어야 한다.\n• 연중 현금흐름은 일정하게 발생한다고 가정한다.\n연도 기계A 연간 원가절감액 기계B 연간 원가절감액\n1 100,000원 50,000원\n2 50,000원 50,000원\n3 30,000원 50,000원\n4 20,000원 50,000원\n5 20,000원 50,000원\n① 기계 A를 구입한다.\n② 기계 B를 구입한다.\n③ 둘 중 어떤 것을 구입해도 관계없다.\n④ 기계 A, B 모두 구입하지 않는다.", "answer": 1}, {"year": "2024", "month": "3", "qnum": 118, "text": "[118]다음 중 기말 연금의 현재가치를 나타내는 산식으로 옳은 것은?\n\n①\n\n\n           \n②    \n\n\n\n \n\n \n\n \n        \n③ \n\n\n\n \n\n④   ×\n", "answer": 2}, {"year": "2024", "month": "3", "qnum": 120, "text": "[120]다음은 불량률과 품질원가의 관계를 나타내는 도표이다. 이에 관한 설명으로 옳지 않은 것은?\na\n원가 b\nc\n0 d 불량률\n① 품질원가를 최소화하기 위하여 어느 정도의 불량률은 허용되어야 한다는 전통적인 관점이 반영되어\n있다.\n② 총 품질원가를 나타내는 것은 a 이다.\n③ b 는 통제원가를 의미하며 실패원가와 상반관계를 가진다.\n④ d 는 허용가능품질수준에 해당하는 불량률을 의미한다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 112, "text": "[112]다음 중 부품의 자가제조 또는 외부구입 의사결정 시 고려해야 하는 비재무적 정보에 관한 설명으로\n옳지 않은 것은?\n① 부품을 자가제조 할 경우 부품의 공급업자에 대한 의존도를 줄일 수 있는 장점이 있다.\n② 부품을 자가제조 할 경우 기존 외부공급업자와의 유대관계를 상실하게 되는 단점이 있다.\n③ 부품을 외부구입 할 경우 향후 주문량의 변동에 유연하게 대응할 수 있다는 장점이 있다.\n④ 부품을 외부구입 할 경우 제품에 특별한 지식이나 기술이 요구될 때 품질을 유지하기 위한 관리가\n어렵다는 단점이 있다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 113, "text": "[113]다음은 신인가수 발굴 오디션에서 일어난 심사위원과 지원자 김삼일의 인터뷰 내용이다. 의사결정 기\n초개념과 관련하여 밑줄 친 (ㄱ), (ㄴ)에 가장 적절하게 대응되는 용어는 무엇인가?\n심사위원 : 오디션에 합격하면 (ㄱ) 현재의 직장을 포기해야 하는데도 가수를 하실 생각이신가요?\n김 삼 일 : 과거에 (ㄴ) 직장에 들어가기 위해 많은 노력을 했습니다. 하지만, 오디션에 합격하여\n어릴 적 꿈이었던 가수로서 제 2의 인생을 살고 싶습니다.\n① (ㄱ) 기회원가 (ㄴ) 매몰원가\n② (ㄱ) 매몰원가 (ㄴ) 기회원가\n③ (ㄱ) 기회원가 (ㄴ) 간접원가\n④ (ㄱ) 지출원가 (ㄴ) 매몰원가", "answer": 1}, {"year": "2024", "month": "5", "qnum": 116, "text": "[116]다음 중 자본예산을 편성하기 위한 현금흐름추정의 기본원칙에 관한 설명으로 옳지 않은 것은?\n① 증분기준에 의한 현금흐름을 추정해야하므로 이미 현금유출이 이루어진 매몰원가는 현금흐름추정 시\n고려하지 않는다.\n② 이자비용은 명백한 현금의 유출에 해당하므로 현금흐름추정 시 현금의 유출로 반영해야 한다.\n③ 감가상각비는 비현금거래에 해당하므로 현금흐름추정 시 현금의 유출로 보지 않는다.\n④ 법인세와 관련된 비용은 명백한 현금의 유출에 해당하므로 현금흐름추정 시 반영해야 한다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 117, "text": "[117]㈜삼일은 자료처리의 신속·정확화를 위해 새로운 전산정보시스템을 설치하고자 한다. 이 설비의 초기\n투자액은 480,000원이며, 설비이용으로 인하여 연간 400,000원의 노무비를 절약할 수 있을 것으로 기\n대된다. 그러나 설비의 유지보수와 교육훈련을 위하여 추가로 200,000원의 운영경비가 증가하게 된\n다. 이 설비의 내용연수는 6년, 잔존가치는 없으며, 정액법으로 감가상각한다. 법인세율이 40 % 인 경\n우, ㈜삼일의 연간순현금유입액을 계산하면 얼마인가?\n① 120,000원\n② 152,000원\n③ 168,000원\n④ 210,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 118, "text": "[118]㈜삼일은 당기 초 새로운 투자안에 600,000원을 투자하였다. 회사는 이 투자안으로부터 앞으로 5년\n동안 매년 말 250,000원의 현금유입을 예측하고 있다. 회사의 최저필수수익률이 연 12 % 일 경우 이\n투자안의 순현재가치(NPV)는 얼마인가?\n연 12 %\n5년 현가계수 0.57\n5년 연금현가계수 3.60\n① 300,000원\n② 558,000원\n③ 720,000원\n④ 900,000원", "answer": 1}, {"year": "2024", "month": "5", "qnum": 120, "text": "[120]다음 중 품질원가계산에 관한 설명으로 옳지 않은 것은?\n① 허용가능품질관점에서는 통제원가와 실패원가 사이에는 상반관계가 존재하는 것으로 본다.\n② 일반적으로 원재료나 제품의 검사 및 시험 비용은 예방원가로 분류된다.\n③ 일반적으로 재작업 및 재검사 비용은 내부실패원가로 분류된다.\n④ 일반적으로 보증기간 내 보증수리 및 교환 비용은 외부실패원가로 분류된다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 112, "text": "[112]다음 중 의사결정시에 필요한 원가용어와 그에 대한 정의를 연결한 것으로 옳지 않은 것은?\n① 매몰원가는 과거에 발생한 역사적 원가로서 현재 또는 미래에 회수할 수 없는 원가이다.\n② 기회원가는 자원을 현재 용도 이외의 다른 용도에 사용할 경우 얻을 수 있는 최대금액이다.\n③ 지출원가는 미래에 현금 등의 지출을 수반하는 원가이다.\n④ 관련원가는 과거원가이거나 대안 간에 차이가 나지 않는 미래원가이다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 113, "text": "[113]다음 제시된 원가 중 의사결정을 위한 관련원가에 해당되는 원가의 합으로 옳은 것은?\n기회원가 5,000원 매몰원가 20,000원\n회피가능원가 16,000원 회피불능원가 14,000원\n① 16,000원\n② 21,000원\n③ 30,000원\n④ 36,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 116, "text": "[116]다음 중 자본예산을 편성하기 위해 현금흐름을 추정할 때 주의해야 할 사항으로 옳지 않은 것은?\n① 세금을 납부하는 것은 현금의 유출에 해당하므로 세금을 차감한 후의 현금흐름을 기준으로 추정하\n여야 한다.\n② 현금흐름의 추정시에는 이자비용이 전혀 없는 상황을 가정하여 현금흐름을 추정해야 한다.\n③ 감가상각비를 계상함으로써 발생하는 세금의 절약분인 감가상각비 감세 효과는 현금흐름을 파악할\n때 고려해서는 안된다.\n④ 증분기준에 의한 현금흐름을 추정하여야 한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 117, "text": "[117]㈜삼일의 경영진은 새로운 투자안을 검토 중이며, 경영진이 분석한 이 투자안의 NPV는 0보다 큰 값이\n산출되었다. 그러나 재무담당자인 갑의 분석에 의하면 이 투자안은 경제성이 없는 것으로 판단된다.\n갑의 분석이 옳다고 했을 때, 이 기업의 경영진은 경제성분석 과정에서 어떤 오류를 범하였겠는가?\n① 투자종료시점의 투자안의 처분가치를 너무 낮게 추정하였다.\n② 자본비용을 너무 높게 추정하였다.\n③ 투자시점의 투자세액공제액을 현금흐름에 포함시키지 않았다.\n④ 현금영업비용을 너무 낮게 추정하였다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 118, "text": "[118]㈜삼일은 35,000원에 기계를 구입할 예정이며, 기계를 사용할 때 연간 원가절감액은 아래의 표와 같\n다. 연중 현금흐름이 고르게 발생한다고 가정하고 이 투자안의 회수기간을 계산하면 얼마인가?\n연도 1년 2년 3년 4년\n연간 원가절감액 8,500원 9,000원 9,500원 10,000원\n① 2.75년\n② 2.95년\n③ 3.75년\n④ 3.80년", "answer": 4}, {"year": "2024", "month": "6", "qnum": 120, "text": "[120]보증수리비, 손해배상비, 반품비(반품의 운송, 재작업, 재검사 포함), 판매기회상실에 따른 기회비용\n등은 품질원가항목 중 어떤 영역에 포함되는 원가들인가?\n① 예방원가\n② 평가원가\n③ 내부실패원가\n④ 외부실패원가", "answer": 4}, {"year": "2024", "month": "7", "qnum": 81, "text": "[81]다음 중 원가회계의 한계점에 관한 설명으로 옳지 않은 것은?\n① 비화폐성 정보와 질적인 정보는 제공하지 못한다.\n② 특정한 시점에서 모든 의사결정에 목적적합한 원가정보를 제공할 수는 없다.\n③ 경영자의 목적에 따라 다양한 회계절차를 적용해야 하는 어려움이 있다.\n④ 객관적으로 측정가능한 회계자료를 기초로 수익과 비용을 인식해야 하므로 자료수집에 어려움이 있\n다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 113, "text": "[113]㈜삼일은 제품 제조에 사용되는 부품 10,000단위를 자체 생산하여 왔다. 10,000단위 생산수준에서 부\n품을 제조하는데 소요되는 단위당 원가는 다음과 같다.\n금 액\n직접재료원가 180원\n직접노무원가 120원\n변동제조간접원가 60원\n고정제조간접원가 40원\n제품단위당원가 400원\n동일한 부품을 생산하고 있는 ㈜용산이 이 부품 10,000단위를 공급하겠다고 제안하였을 경우 ㈜삼일이\n최대한 허용할 수 있는 부품의 단위당 구입가격은 얼마인가(단, 부품을 외부에서 구입할 경우 고정제조\n간접원가는 전혀 회피할 수 없다)?\n① 180원\n② 300원\n③ 360원\n④ 400원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 114, "text": "[114]다음은 철수와 친구 동철이의 대화내용이다. 의사결정과 관련하여 괄호 안에 들어갈 원가용어로 옳은\n것은?\n철수 : 동철아, 아직 결혼 소식 없어?\n동철 : 그러게 말야. 더 이상 나이 먹기 전에 결혼을 해야겠는데 영희는 결혼 생각이 없는 거 같아.\n헤어져야 할지 말아야 할지 고민이야.\n철수 : 잘 생각해서 판단해. 네가 영희와 사귀기 위해 쓴 데이트비용, 시간 등이 정말 많은데 헤어\n지면 너무 아깝지 않겠어?\n동철 : 물론 아깝긴 하지. 그러나, 그런 것들은 전부 ( ) 일 뿐이야. 이미 과거에 지출된 원\n가라서 내가 영희와 헤어질 것인가를 결정하는 것과는 관계가 없어. 하지만 알면서도 자꾸\n미련이 남아.\n① 기회원가\n② 추적가능원가\n③ 추적불능원가\n④ 매몰원가", "answer": 4}, {"year": "2024", "month": "7", "qnum": 116, "text": "[116]다음 중 자본예산에 관한 설명으로 옳지 않은 것은 ?\n① 자본예산이란 고정자산에 대한 효율적인 투자 수행을 위해 투자안의 타당성을 평가하고 투자안의\n현금흐름이나 이익에 미치는 영향을 평가하는 기법이다.\n② 현금흐름은 원칙적으로 증분기준, 세후기준으로 추정된다.\n③ 자본예산모형에는 화폐의 시간적 가치를 고려하는 할인모형과 화폐의 시간적 가치를 고려하지 않는\n전통적 방법인 비할인모형이 있다.\n④ 회수기간법과 회계적 이익률법은 할인모형에 해당한다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 117, "text": "[117]㈜삼일은 내용연수가 3년인 기계장치에 투자하려고 하고 있다. 기계장치를 구입하면, 1년째에는\n5,000,000원, 2년째에는 4,000,000원, 그리고 3년째에는 3,000,000원의 현금지출운용비를 줄일 것\n으로 판단하고 있다. 회사의 최저필수수익률은 12 % 이고 기계장치에 대한 투자액의 현재가치는\n8,000,000원 이라고 할 때, 기계장치에 대한 투자안의 순현재가치(NPV)는 얼마인가(단, 이자율 12 %\n의 1원당 현재가치는 1년은 0.9, 2년은 0.8, 3년은 0.7이며 향후 현금지출의 감소는 매년 말에 발\n생하고 법인세는 없는 것으로 가정한다)?\n① 1,800,000원\n② 1,900,000원\n③ 2,000,000원\n④ 2,100,000원", "answer": 1}, {"year": "2024", "month": "7", "qnum": 118, "text": "[118]㈜삼일은 10,000원에 기계를 구입할 예정으로, 회수기간법을 이용하여 동 투자안을 평가하고자 한다.\n이 기계는 정액법에 의하여 5년간 감가상각되며, 잔존가치는 없을 것으로 추정하고 있다. 이 기계는\n매년 법인세비용 차감 전 기준으로 5,000원의 현금유입을 발생시킬 수 있다. 이 투자안의 회수기간은\n얼마인가(단, 감가상각비 이외에 추가적인 비용은 발생하지 않으며, 법인세율은 40 % 이다)?\n① 약 3.65년\n② 약 2.63년\n③ 약 4.11년\n④ 약 4.25년", "answer": 2}, {"year": "2024", "month": "7", "qnum": 120, "text": "[120]다음 중 제품의 검사 및 시험, 현장 및 라인검사 등으로 인하여 소요되는 지출로서 불량품을 적발하기\n위하여 발생하는 품질원가를 의미하는 것으로 옳은 것은?\n① 내부실패원가\n② 외부실패원가\n③ 평가원가\n④ 예방원가", "answer": 3}, {"year": "2024", "month": "9", "qnum": 112, "text": "[112]다음은 로스쿨과 관련한 신문기사 내용이다. 의사결정과 관련하여 괄호 안에 들어갈 용어로 옳은 것\n은?\n로스쿨은 도전할 만한 가치가 있는 것일까?\n로스쿨의 연간 등록금은 최소 8백만원에서 최대 2천만원이 넘는 곳까지 천차만별이다. 책값과\n생활비 등을 감안하면 사립대의 경우 로스쿨에 다니는 동안 9천만원 ~ 1억원 정도는 투자해야\n할 각오를 해야 한다.\n하지만 등록금보다 더 큰 부담은 ( )로 볼 수 있다. 직장에서 휴직을 허용하고, 로스쿨 진\n학 비용을 대주지 않는 한 직장인이 로스쿨에 다니려면 사표를 내야 한다. 연봉 3천만원인 직장\n인이 로스쿨을 다니기 위해 사표를 낸다면 3년 동안 ( )가 1억원에 이른다. 사립대 로스쿨\n에 들어간다면 ( )와 등록금까지 감안하여 2억원에 이르는 돈을 투자하는 것이다.\n① 추적불능원가\n② 회피불능원가\n③ 기회원가\n④ 매몰원가", "answer": 3}, {"year": "2024", "month": "9", "qnum": 113, "text": "[113]㈜삼일의 손익계산서는 다음과 같다.\n제품단위당 판매가격 1,200원\n매출액 7,200,000원\n매출원가 3,200,000원\n매출총이익 4,000,000원\n판매비와관리비 2,700,000원\n영업이익 1,300,000원\n매출원가 중 1/4 과 판매비와관리비 중 2/3 가 고정비이다. 유휴생산능력이 있다고 할 경우, 제품단위\n당 500원에 700단위의 제품에 대한 추가주문을 받아들인다면 회사의 영업이익에 미치는 영향은 얼마인\n가(단, 추가주문 수락이 기존주문에 미치는 영향은 없는 것으로 가정한다)?\n① 35,000원 증가\n② 35,000원 감소\n③ 75,000원 증가\n④ 75,000원 감소", "answer": 2}, {"year": "2024", "month": "9", "qnum": 114, "text": "[114]다음 중 의사결정에 관한 설명으로 옳지 않은 것은?\n① 현재 시설능력을 100 % 활용하고 있는 기업은 특별주문의 수락 여부를 고려할 때 동 주문생산에 따\n른 추가 시설 임차료를 고려하여야 한다.\n② 고정원가가 당해 의사결정과 관계없이 계속 발생한다면 해당 고정원가는 비관련원가이다.\n③ 제품라인 폐지 의사결정 시 유휴생산시설을 이용하여 발생시키는 수익을 고려하여야 한다.\n④ 부품의 자가제조 또는 외부구입 의사결정시 회피가능원가가 외부구입원가보다 작은 경우에는 외부\n구입하는 것이 바람직하다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 116, "text": "[116]다음은 ㈜삼일의 신규투자담당 팀장과의 인터뷰 내용이다. 괄호 안에 들어갈 말로 옳지 않은 것은?\n기자: 신규 투자 기획팀에서 15년 동안 팀장을 맡고 계신데 신규 투자에 대한 타당성 검토에는 어떠\n한 모형들이 사용됩니까?\n팀장: 여러 모형이 있지만 우리 회사에서는 회수기간법, 순현재가치법, 내부수익률법, 수익성지수법을\n이용하여 타당성 검토를 합니다.\n기자: 그렇다면, 그 중에서 가장 중요시 하는 모형이 있습니까?\n팀장: 물론입니다. 투자안마다 약간 다르긴 하지만 우리 회사는 회수기간법을 가장 중요시 합니다.\n왜냐하면 ( )\n① 회수기간 이후의 현금흐름을 포함한 수익성을 고려하는 투자안이기 때문입니다.\n② 투자자금을 빨리 회수하는 투자안을 선택하여 기업의 유동성확보에 도움을 줄 수 있기 때문입니다.\n③ 현금흐름의 할인을 고려하지 않고 계산할 수도 있는 장점이 있기 때문입니다.\n④ 회수기간이 짧을수록 안전한 투자안이라는 위험지표로서의 정보를 제공하기 때문입니다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 117, "text": "[117]㈜삼일은 당기 초 새로운 투자안에 950,000원을 투자하였다. 회사는 이 투자안으로부터 앞으로 5년\n동안 매년 말 280,000원의 세후 현금유입을 예측하고 있다. 회사의 최저필수수익률이 연 10 % 일 경우\n이 투자안의 순현재가치(NPV)는 얼마인가?\n연 10 %\n5년 현가계수 0.62\n5년 연금현가계수 3.79\n① 111,200원\n② 120,000원\n③ 187,000원\n④ 279,000원", "answer": 1}, {"year": "2024", "month": "9", "qnum": 118, "text": "[118]다음은 투자안 타당성 평가와 관련한 담당이사들의 대화내용이다. 각 담당이사별로 선호하는 자본예산\n모형을 가장 올바르게 짝지은 것은?\n최이사 : 저는 투자안 분석의 기초자료가 재무제표이기 때문에 자료확보가 용이한 (a)모형을 가\n장 선호합니다.\n박이사 : (a)모형의 경우 현금흐름이 아닌 회계이익에 기초하고 있다는 단점이 있습니다. 그래\n서 저는 현금흐름을 기초로 화폐의 시간가치를 고려하는 (b)모형을 가장 선호합니다.\n이 모형은 투자기간 동안 자본비용으로 재투자된다고 보기 때문에 가장 현실적인 가정\n을 하고 있습니다.\n① (a) 회계적이익률법 (b) 내부수익률법\n② (a) 내부수익률법 (b) 순현재가치법\n③ (a) 회계적이익률법 (b) 순현재가치법\n④ (a) 회수기간법 (b) 내부수익률법", "answer": 3}, {"year": "2024", "month": "9", "qnum": 120, "text": "[120]다음 품질원가 도표에 대한 설명으로 옳지 않은 것은?\n< 도표A > < 도표B >\n원가\n원가 총품질원가\n총품질원가\nb\nb\na\na\n0 불량률\n0 불량률\n① a는 통제원가를, b는 실패원가를 의미한다.\n② 도표A는 허용가능품질관점(acceptable quality view)을 나타낸다.\n③ 전사적 품질관리시스템(TQC system)은 도표B의 관점을 반영한다.\n④ 무결함관점(zero-defects view)에서는 통제원가와 실패원가 사이에 항상 상반관계가 존재한다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 112, "text": "[112]㈜삼일은 6개월 전에 차량을 3,000,000원에 구입하였으나 침수로 인해 이 차량을 더 이상 사용할 수\n없게 되었다. 회사는 동 차량에 대하여 수리비용 1,500,000원을 들여 2,000,000원에 팔거나 현재 상\n태로 거래처에 1,000,000원에 팔 수 있다. 이런 경우에 총매몰원가는 얼마인가?\n① 1,000,000원\n② 1,500,000원\n③ 2,000,000원\n④ 3,000,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 113, "text": "[113]㈜삼일은 단위당 27,000원에 판매 중인 제품을 단위당 22,000원에 500단위 구입하겠다는 특별주문을\n받았다. 주문을 수락하더라도 기존 판매가격이나 고정원가에는 아무런 영향을 주지 않으며 유휴생산능\n력은 충분하다. 단위당 원가가 다음과 같을 경우, ㈜삼일의 특별주문 수락여부와 회사의 이익에 미치\n는 영향으로 옳은 것은?\n금액\n직접재료원가 8,500원\n직접노무원가(변동비) 3,500원\n변동제조간접원가 7,000원\n고정제조간접원가 5,000원\n제품단위당 원가 24,000원\n① 거절, 1,000,000원의 추가손실 발생\n② 거절, 2,500,000원의 추가손실 발생\n③ 수락, 1,500,000원의 추가이익 발생\n④ 수락, 3,000,000원의 추가이익 발생", "answer": 3}, {"year": "2024", "month": "11", "qnum": 116, "text": "[116]장기의사결정시에는 미래 현금흐름을 추정하는 것이 중요하다. 다음 중 장기의사결정을 위한 현금흐름\n추정의 기본원칙으로 옳지 않은 것은?\n① 이자비용은 현금유출이므로 현금흐름 산정시 항상 이자비용을 차감한 금액을 기준으로 한다.\n② 감가상각비 감세효과는 현금흐름을 추정할 때 고려해야 한다.\n③ 명목현금흐름은 명목할인율로 할인해야 하며, 실질현금흐름은 실질할인율로 할인해야 한다.\n④ 법인세를 납부하는 것은 현금유출에 해당하므로, 현금흐름을 파악할 때에는 법인세를 차감한 후의\n금액을 기준으로 한다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 117, "text": "[117]㈜삼일은 내용연수가 3년인 기계장치에 1,000,000원을 투자할 예정이다. 기계장치를 구입하면, 아래\n의 표와 같이 현금운영비를 줄일 것으로 판단하고 있다. 회사의 자본비용은 12 % 라고 할 때 ㈜삼일의\n신규 기계장치 투자에 대한 순현재가치(NPV)를 계산하면 얼마인가(단, 현금운영비의 감소효과는 매년\n말에 발생하며 법인세 및 기계장치의 잔존가치는 없다고 가정한다)?\n1년 2년 3년\n현재가치요소(이자율 12 %) 0.89 0.80 0.71\n현금운영비 감소액 600,000원 700,000원 400,000원\n① 284,000원\n② 378,000원\n③ 534,000원\n④ 1,284,000원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 118, "text": "[118]㈜삼일은 70,000원에 기계를 구입할 예정이며, 기계를 사용할 때 연간 원가절감액은 아래의 표와 같\n다. 연중 현금흐름이 고르게 발생한다고 가정하고 이 투자안의 회수기간을 계산하면 얼마인가(단, 법\n인세는 없다고 가정한다)?\n연도 1년 2년 3년 4년 5년\n연간 원가절감액 17,000원 16,000원 20,000원 15,000원 10,000원\n① 3.75년\n② 3.80년\n③ 4.20년\n④ 4.75년", "answer": 3}, {"year": "2024", "month": "11", "qnum": 120, "text": "[120]다음 중 수명주기원가계산(LCC)에 관한 설명으로 옳지 않은 것은?\n① 수명주기원가계산(life-cycle costing：LCC)이란 제품수명주기동안 연구개발, 설계, 제조, 마케팅,\n유통, 고객서비스에서 발생하는 모든 원가를 제품별로 집계하는 원가계산제도이다.\n② 제조이후단계에서 대부분의 제품원가가 결정된다는 인식을 토대로 생산단계와 마케팅단계에서 원가\n절감을 위한 노력을 기울여야 한다는 것을 강조한다.\n③ 장기적 관점의 원가절감 및 원가관리에 유용하다.\n④ 프로젝트와 관련하여 언제 어떤 가치사슬단계에서 얼마만큼의 원가가 발생하는지를(비율로) 알게\n됨으로써 상이한 가치사슬단계에서 원가발생의 상호관계 파악이 가능하다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 112, "text": "[112]다음 중 의사결정시에 필요한 원가용어와 그에 대한 정의를 연결한 것으로 옳지 않은 것은?\n① 회피가능원가는 특정대안을 선택하는 것과 관계없이 계속해서 동일하게 발생하는 원가이다.\n② 기회원가는 자원을 현재 용도 이외의 다른 용도에 사용할 경우 얻을 수 있는 최대금액이다.\n③ 지출원가는 미래에 현금 등의 지출을 수반하는 원가이다.\n④ 매몰원가는 과거에 발생한 역사적 원가로서 현재 또는 미래에 회수할 수 없는 원가이다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 114, "text": "[114]㈜삼일은 부품 A를 자가제조하고 있으며, 이와 관련된 연간 생산 및 원가자료는 다음과 같다. 최근 외\n부업체로부터 부품 A 100단위를 단위당 1,000원에 공급하겠다는 제안을 받았다. 외부업체의 제안을\n수락할 경우 자가제조보다 연간 얼마나 유리(또는 불리)한가(단, 고정제조간접원가는 전액 회피 가능\n하다)?\n직접재료원가 86,000원\n변동직접노무원가 34,000원\n변동제조간접원가 26,000원\n고정제조간접원가 60,000원\n생산량 100단위\n① 46,000원 불리\n② 46,000원 유리\n③ 106,000원 불리\n④ 106,000원 유리", "answer": 4}, {"year": "2024", "month": "12", "qnum": 115, "text": "[115]㈜삼일은 특별추가생산 요청을 받았다. 현재 여유생산시설이 충분한 상황이라면 이 회사의 경영자가\n특별추가생산 의사결정에서 고려하지 않아도 되는 원가로 옳은 것은?\n① 직접재료원가\n② 직접노무원가\n③ 변동제조간접원가\n④ 고정제조간접원가", "answer": 4}, {"year": "2024", "month": "12", "qnum": 116, "text": "[116]다음 중 자본예산모형에 관한 설명으로 옳은 것은?\n① 자본예산모형은 장기 투자에 대한 타당성을 평가하기 위한 것이므로 모든 모형에서 화폐의 시간가\n치가 필수적으로 고려된다.\n② 둘 이상의 상호 독립적인 투자안의 우선순위를 결정함에 있어 순현재가치법과 내부수익률법이 서로\n다른 결과를 도출할 수 있다.\n③ 회수기간법은 계산이 간단하며, 투자기간 전체의 현금흐름을 고려한다는 특징을 가지고 있다.\n④ 내부수익률법을 적용할 때에는 산출된 내부수익률이 양수이면 투자안을 채택한다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 117, "text": "[117]㈜삼일은 당기 말 순장부가액이 600,000원인 기존의 기계장치를 800,000원에 처분하고, 새로운 기계\n장치를 1,000,000원에 매입하였다. 법인세율이 20 % 라고 가정하면, 위 거래로 인한 순현금흐름은 얼\n마인가(단, 감가상각비는 고려하지 않는다)?\n① 240,000원 유출\n② 800,000원 유출\n③ 200,000원 유입\n④ 680,000원 유입", "answer": 1}, {"year": "2024", "month": "12", "qnum": 118, "text": "[118]㈜삼일의 경영진은 새로운 투자안을 검토 중이며, 경영진이 분석한 이 투자안의 NPV는 0보다 큰 값이\n산출되었다. 그러나 재무담당자인 갑의 분석에 의하면 이 투자안은 경제성이 없는 것으로 판단된다.\n갑의 분석이 옳다고 했을 때, 이 기업의 경영진은 경제성분석 과정에서 어떤 오류를 범하였겠는가?\n① 투자종료시점의 투자안의 처분가치를 너무 낮게 추정하였다.\n② 현금 영업수익을 너무 낮게 추정하였다.\n③ 현금영업비용을 너무 낮게 추정하였다.\n④ 자본비용을 너무 높게 추정하였다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 112, "text": "[112]㈜삼일은 제조에 필요한 부품을 자가제조할 것인지 아니면 외부구입할 것인지의 여부에 대한 의사결정\n을 하려고 한다. 다음 설명 중 옳지 않은 것은?\n① 회피가능 고정원가는 의사결정을 하는데 있어 고려대상이 아니다.\n② 매몰원가는 비관련원가이므로 의사결정을 하는데 영향을 미치지 않는다.\n③ 외부구입원가가 회피가능원가보다 큰 경우에는 자가제조하는 것이 바람직하다.\n④ 기존설비를 다른 용도로 사용함에 따라 발생할 수 있는 기회비용도 함께 고려해야 한다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 113, "text": "[113]㈜삼일의 생산 및 판매에 관한 자료는 다음과 같다. 최근 고객사로부터 제품 3,000단위를 단위당 40\n원에 공급해 달라는 특별주문을 받았다. 특별주문에 관한 ㈜삼일의 의사결정으로 옳은 것은(단, 특별\n주문 수락으로 인한 기존 판매수량 및 판매가격에는 영향이 없다)?\n제품단위당 판매가격 80원\n제품단위당 변동제조원가 25원\n고정제조간접원가 400,000원\n고정판매비 200,000원\n연간 생산능력 20,000단위\n연간 판매량 15,000단위\n① 특별주문의 가격이 시장가격보다 낮으므로 주문을 거절하여야 한다.\n② 제품단위당 제조원가가 45원이므로 주문을 거절하여야 한다.\n③ 증분수익과 증분비용이 동일하므로 주문을 거절하여야 한다.\n④ 제안을 받아들일 경우 45,000원의 이익이 추가로 발생하므로 주문을 수락하여야 한다.", "answer": 4}, {"year": "2025", "month": "1", "qnum": 116, "text": "[116]다음 중 순현재가치(NPV)법과 내부수익률(IRR)법에 관한 설명으로 옳지 않은 것은?\n① 내부수익률법은 투자안의 내부수익률이 최저필수수익률을 상회하면 그 투자안을 채택하게 된다.\n② 순현재가치법은 투자안의 순현재가치가‘0(영)’보다 크면 그 투자안을 채택한다.\n③ 내부수익률법은 가치가산의 원칙이 적용되나 순현재가치법은 그렇지 않다.\n④ 두 방법 모두 화폐의 시간적 가치를 고려하는 방법이다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 117, "text": "[117]㈜삼일은 자료처리의 신속·정확화를 위해 새로운 전산정보시스템을 설치하고자 한다. 이 설비의 초기\n투자액은 480,000원이며, 설비이용으로 인하여 연간 400,000원의 노무비를 절약할 수 있을 것으로 기\n대된다. 그러나 설비의 유지보수와 교육훈련을 위하여 추가로 200,000원의 운영경비가 증가하게 된다.\n이 설비의 내용연수는 6년, 잔존가치는 없으며, 정액법으로 감가상각한다. ㈜삼일의 연간순현금유입액\n을 계산하면 얼마인가(단, 법인세율은 25 % 단일세율을 가정하며, 설비이용으로 인한 노무비와 운영경\n비 증감은 모두 현금 기준 추정치이다)?\n① 90,000원\n② 170,000원\n③ 200,000원\n④ 220,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 118, "text": "[118]다음 중 회수기간법에 관한 설명으로 옳지 않은 것은?\n① 많은 투자안의 평가가 필요할 경우 시간과 비용을 절약할 수 있다.\n② 화폐의 시간가치를 고려하지 않는다.\n③ 기업의 유동성 확보와 관련된 의사결정에 유용하다.\n④ 회수기간 전후의 현금흐름을 파악하여 수익성을 고려한다.", "answer": 4}, {"year": "2025", "month": "1", "qnum": 120, "text": "[120]다음 중 목표원가계산의 절차를 올바르게 나타낸 것은?\nⓐ 목표원가 달성을 위한 가치공학을 수행\nⓑ 잠재 고객의 요구를 충족하는 제품의 개발\nⓒ 목표가격에서 목표이익을 고려하여 목표원가를 산출\nⓓ 고객이 인지하는 가치와 경쟁기업의 가격 등을 고려하여 목표가격을 선택\n① ⓑ → ⓓ → ⓒ → ⓐ\n② ⓑ → ⓐ → ⓒ → ⓓ\n③ ⓓ → ⓑ → ⓒ → ⓐ\n④ ⓓ → ⓐ → ⓒ → ⓑ", "answer": 1}, {"year": "2025", "month": "3", "qnum": 112, "text": "[112]㈜삼일은 6개월 전에 차량을 2,500,000원에 구입하였으나 침수로 인해 이 차량을 더 이상 사용할 수\n없게 되었다. 회사는 동 차량에 대하여 수리비용 1,500,000원을 들여 2,000,000원에 팔거나 현재 상\n태로 거래처에 1,000,000원에 팔 수 있다. 이런 경우에 총매몰원가는 얼마인가?\n① 2,000,000원\n② 2,500,000원\n③ 3,000,000원\n④ 4,000,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 114, "text": "[114]㈜삼일은 제품 A의 생산을 위하여 필요한 부품 X를 직접 생산하여 사용하고 있으며, 부품 X 제조에\n대한 원가자료는 다음과 같다.\n부품단위당 직접재료원가 550원\n부품단위당 직접노무원가 100원\n부품단위당 변동제조간접원가 150원\n부품 X 관련 고정제조간접원가 500,000원\n생산량 5,000단위\n㈜삼일은 현재 원가절감을 위하여 부품 X의 외부구매를 검토하고 있다. 부품을 외부에서 구입할 경우\n고정제조간접원가의 60 % 는 계속해서 발생할 것이다. ㈜삼일이 최대한 허용할 수 있는 부품의 단위당\n구입가격은 얼마인가?\n① 800원\n② 840원\n③ 860원\n④ 900원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 116, "text": "[116]다음 중 자본예산을 편성하기 위해 현금흐름을 추정할 때 주의해야 할 사항으로 옳지 않은 것은?\n① 감가상각비를 계상함으로써 발생하는 세금의 절약분인 감가상각비 감세 효과는 현금흐름을 파악할\n때 고려해야 한다.\n② 세금을 납부하는 것은 현금의 유출에 해당하므로 세금을 차감한 후의 현금흐름을 기준으로 추정하\n여야 한다.\n③ 명목현금흐름은 명목할인율로 할인해야 하며, 실질현금흐름은 실질할인율로 할인해야 한다.\n④ 이자비용은 현금흐름 유출에 해당하므로 현금흐름 추정에 반영해야 한다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 117, "text": "[117]다음 중 자본예산모형에 의한 의사결정 기준에 관한 설명으로 옳은 것은?\nⓛ 회 수 기 간 법 : 검토 대상 투자안이 상호 독립적이라면 투자안의 회수기간이 기준회수기간보다\n길 때 해당 투자안을 채택한다.\n② 회계적이익률법 : 검토 대상 투자안이 상호 배타적이라면 회계적이익률이 목표치보다 높은 투자안\n들을 다시 한번 비교 검토하는 과정이 필요하다.\n③ 순현재가치법 : 검토 대상 투자안이 상호 독립적이라면 투자안의 순현재가치가 최저필수수익률을\n상회할 경우 해당 투자안을 채택한다.\n④ 내부수익률법 : 검토 대상 투자안이 상호 배타적이라면 내부수익율이 가장 낮은 투자안을 채택한\n다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 118, "text": "[118]소프트웨어 개발업을 영위하는 ㈜삼일은 빅데이터를 활용하기 위한 플랫폼 구축을 검토하고 있다. 현\n재 투자시점에서 900백만원이 소요되고 경제적 내용연수는 3년, 잔존가치는 없으며, 이후 정액법으로\n상각한다. ㈜삼일의 최저필수수익률은 10 % 이고 투자 이후 모든 거래는 현금으로 이루어지며 해당 현\n금흐름은 연말에 발생한다고 가정할 때, 다음 자료를 이용한 신규 플랫폼에 대한 투자 검토 결과로 옳\n은 것은(단, 계산 과정에서 소수점 이하 금액은 반올림한다)?\n[신규 플랫폼 관련 추정 손익계산서] (단위 : 백만원)\n구 분 투자 1차년도 투자 2차년도 투자 3차년도\n영업수익 1,500 2,500 2,000\n영업비용(감가상각비 제외) 900 1,700 1,300\n감가상각비 300 300 300\n영업이익 300 500 400\n법인세비용(20 %) 60 100 80\n세후이익 240 400 320\n[현가계수]\n구 분 투자 1차년도 투자 2차년도 투자 3차년도\n단일화폐 기준(10 %) 0.90 0.80 0.70\nⓛ 투자안의 순현재가치가 (+) 580백만원이므로, 해당 투자안을 채택한다.\n② 투자안의 순현재가치가 (+) 140백만원이므로, 해당 투자안을 채택한다.\n③ 투자안의 순현재가치가 (-) 140백만원이므로, 해당 투자안을 기각한다.\n④ 투자안의 순현재가치가 (-) 4백만원이므로, 해당 투자안을 기각한다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 120, "text": "[120]다음 중 품질원가(Cost of quality)의 측정 목적으로 옳지 않은 것은?\nⓛ 품질 프로그램의 전반적 유효성을 평가하기 위함이다.\n② 고객의 요구에 부합하는 품질목표를 설정하기 위함이다.\n③ 여러 품질활동들에 대하여 가용자원의 최적배분을 결정하기 위함이다.\n④ 제조 이전 단계에서부터 원가를 분석하여 목표원가를 설정하기 위함이다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 112, "text": "[112]1년전 토지를 1억원에 매입한 후 현재 주차장으로 이용하면서 매년 10,000,000원의 수익이 발생하고\n있다. 앞으로 이 주차장 토지에 빌딩을 건립할지 아니면 기존대로 주차장으로 이용할지 고민중이다.\n빌딩 건립과 관련된 의사결정에서 고려할 사항으로 옳은 것은?\n① 토지 매입금액 1억원은 기회비용으로 반드시 고려하여야 한다.\n② 매년 10,000,000원의 주차장 수입은 매몰원가로, 비관련원가이다.\n③ 토지 매입금액 1억원은 기회비용으로 비관련원가이다.\n④ 매년 10,000,000원의 주차장 수입은 기회비용으로, 관련원가이다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 115, "text": "[115]㈜삼일의 부품제조에 관한 원가자료는 다음과 같다. 외부의 제조업자가 이 부품을 납품하겠다고 제의\n하였으며, 부품을 외부에서 구입할 경우 고정제조간접원가 중 200,000원을 회피할 수 있다면 ㈜삼일이\n최대한 허용할 수 있는 부품의 단위당 구입가격은 얼마인가?\n부품단위당 직접재료원가 200원\n부품단위당 직접노무원가 80원\n부품단위당 변동제조간접원가 120원\n고정제조간접원가 600,000원\n생산량 10,000단위\n① 380원\n② 400원\n③ 420원\n④ 440원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 116, "text": "[116]다음 중 자본예산을 편성하기 위한 현금흐름추정의 기본원칙으로 옳은 것은?\n① 증분기준에 의한 현금흐름을 추정해야하므로 기회비용은 현금흐름추정 시 고려하지 않는다.\n② 법인세와 관련된 비용은 현금의 유출에 해당하지만 현금흐름추정 시 현금의 유출로 반영하지 않는\n다.\n③ 감가상각비는 현금의 유출에 해당하지 않으므로 현금흐름추정 시 현금의 유출로 보지 않는다.\n④ 이자비용은 명백한 현금의 유출에 해당하므로 현금흐름추정 시 현금의 유출로 반영해야 한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 117, "text": "[117]다음 중 순현재가치법과 내부수익률법에 관한 설명으로 옳지 않은 것은?\n① 순현재가치법과 내부수익률법에 따른 투자안 평가결과는 동일하지 않을 수 있다.\n② 순현재가치법은 투자기간동안 현금흐름을 자본비용으로 재투자한다고 가정한다.\n③ 내부수익률법은 투자안의 내부수익률이 최저필수수익률을 상회하면 그 투자안을 채택하게 된다.\n④ 두 방법 모두 가치가산의 원칙이 성립한다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 118, "text": "[118]㈜삼일은 내용연수가 3년인 기계장치에 투자하려고 하고 있다. 기계장치를 구입하면, 1년째에는\n8,000,000원, 2년째에는 5,000,000원, 그리고 3년째에는 4,000,000원의 현금지출운용비를 줄일 것으\n로 판단하고 있다. 회사의 최저필수수익률은 12 % 이고 기계장치에 대한 투자액의 현재가치는\n12,000,000원 이라고 할 때, 기계장치에 대한 투자안의 순현재가치(NPV)는 얼마인가(단, 이자율 12 %\n의 1원당 현재가치는 1년은 0.9, 2년은 0.8, 3년은 0.7이며 법인세는 없는 것으로 가정한다)?\n① 1,800,000원\n② 2,000,000원\n③ 2,200,000원\n④ 2,400,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 120, "text": "[120]다음 중 품질원가에 관한 설명으로 옳지 않은 것은?\n① 품질원가란 불량품이 생산되지 않도록 하거나 불량품이 생산된 결과로 발생하는 모든 원가를 말한\n다.\n② 평가원가란 불량품의 생산을 예방하기 위한 원가로 공급업체 평가원가, 품질관리시스템 기획원가\n등이 있다.\n③ 내부실패원가와 외부실패원가는 불량품이 생산된 결과로써 발생하는 원가이므로 실패원가라고 한\n다.\n④ 일반적으로 예방원가와 평가원가가 증가하면 실패원가가 감소하게 된다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 111, "text": "[111]다음의 기업경영 사례에서 밑줄 친 부분을 의미하는 원가용어에 관한 설명으로 옳은 것은?\n영국, 프랑스가 공동 개발한 초음속 여객기 '콩코드'는 개발과정에서 막대한 비용을 들였고, 완성하더\n라도 채산을 맞출 가능성이 없었다. 그러나, 이미 거액의 개발자금을 투자했기 때문에 도중에 중지하\n는 것은 낭비라는 이유로 개발작업이 계속 이어졌다고 한다.\n① 기회원가, 비관련원가\n② 매몰원가, 관련원가\n③ 기회원가, 관련원가\n④ 매몰원가, 비관련원가", "answer": 4}, {"year": "2025", "month": "6", "qnum": 112, "text": "[112]㈜삼일이 제조에 필요한 부품을 자가제조할 것인지 아니면 외부구입할 것인지의 의사결정 시 고려할\n사항에 관한 설명으로 옳지 않은 것은?\n① 당해 의사결정에 따라 회피가능한 고정원가는 관련원가이다.\n② 고정원가가 당해 의사결정과 관계없이 계속 발생한다면 고정원가는 비관련원가이다.\n③ 기존설비를 다른 용도로 사용함에 따라 발생할 수 있는 기회비용도 관련원가이다.\n④ 회피가능원가와 유휴시설 활용에 따른 이익증가의 합이 외부구입원가보다 큰 경우에는 자가제조하\n는 것이 바람직하다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 114, "text": "[114]선박 제조회사인 ㈜삼일은 소형모터를 자가제조하고 있다. 소형모터 10,000개를 자가제조하는 경우,\n단위당 원가는 다음과 같다.\n직접재료원가 5원\n직접노무원가 3원\n변동제조간접원가 2원\n특수기계 감가상각비 2원\n공통제조간접원가 배부액 5원\n제품원가 17원\n외부 회사에서 ㈜삼일에 소형모터 10,000개를 단위당 12원에 공급할 것을 제안하였다. ㈜삼일이 외부업\n체의 공급제안을 수용하는 경우, 소형모터 제작을 위하여 사용하던 특수기계는 다른 용도로 사용 및 처\n분이 불가능하며, 소형모터에 배부된 공통제조간접원가의 20 % 를 절감할 수 있다. ㈜삼일이 외부업체\n의 공급제안을 수용한다면, 자가제조하는 것보다 얼마나 유리 또는 불리한가?\n① 10,000원 불리\n② 10,000원 유리\n③ 40,000원 불리\n④ 40,000원 유리", "answer": 1}, {"year": "2025", "month": "6", "qnum": 116, "text": "[116]다음 중 자본예산에 관한 설명으로 옳지 않은 것은?\n① 자본예산은 고정자산에 대한 효율적인 투자 수행을 위해 투자안의 타당성을 평가하는 기법이다.\n② 자본예산은 고정자산에 대한 투자안의 현금흐름이나 이익에 미치는 영향을 평가하는 기법이다.\n③ 자본예산에 의한 투자는 불확실성(경제상황, 소비자 선호, 기술진보 등)으로 인한 위험이 상대적으\n로 작다.\n④ 자본예산은 기업의 장기적 경영계획에 바탕을 둔 장기투자에 관한 의사결정이다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 117, "text": "[117]㈜삼일은 20,000원에 기계를 구입할 예정이며, 이 기계를 정액법에 의하여 5년간 상각하기로 하고 잔\n존가치는 없을 것으로 추정하고 있다. 이 기계로 인하여 ㈜삼일은 매년 법인세비용차감전순이익 기준\n으로 8,000원의 현금유입을 추가로 발생시킬 수 있다. 이 투자안의 회수기간은 얼마인가(단, 감가상각\n비를 제외한 모든 수익·비용은 현금거래이며, 법인세율은 30 % 이다. 회수기간 계산시 소수점 둘째\n자리에서 반올림하시오)?\n① 약 2.9년\n② 약 3.2년\n③ 약 3.5년\n④ 약 4.0년", "answer": 1}, {"year": "2025", "month": "6", "qnum": 118, "text": "[118]㈜삼일은 당기 초에 새로운 프로젝트에 투입하기 위하여 새 기계를 3,000,000원에 구입했다. 내용연수\n는 5년이고 정액법으로 감가상각할 것이며 잔존가치는 없다. 이 프로젝트는 매년 1,000,000원의 법인\n세비용차감전순이익을 창출할 것으로 기대된다. ㈜삼일은 12 % 의 할인율을 사용하고, 법인세율은 매\n년 20 % 라고 가정한다. 이 프로젝트의 순현재가치를 계산하면 얼마인가?\n5년, 12 % 할인율의 1원에 대한 단일화폐의 현재가치는 0.57이며,\n5년, 12 % 할인율의 1원에 대한 연금화폐의 현재가치는 3.61이다.\n① 321,200원\n② 1,720,000원\n③ 2,054,000원\n④ 3,610,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 119, "text": "[119]다음 중 대체가격 결정시 고려할 사항으로 옳지 않은 것은?\n① 각 사업부 관리자의 경영노력에 대한 동기부여가 가능하도록 결정되어야 한다.\n② 각 사업부의 성과를 공정하게 평가할 수 있는 방법으로 결정되어야 한다.\n③ 각 사업부의 경영자가 자율적으로 의사결정을 하여 대체가격을 결정해야 한다.\n④ 각 사업부의 이익극대화가 이루어지도록 결정되면, 준최적화 현상은 발생하지 않는다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 113, "text": "[113]다음은 신인가수 발굴 오디션에서의 심사위원과 지원자 간 인터뷰 내용이다. 의사결정 기초개념과 관\n련하여 밑줄 친 (ㄱ), (ㄴ)에 가장 적절하게 대응되는 용어는 무엇인가?\n심사위원 : 오디션에 합격하면 (ㄱ)현재의 직장을 포기해야 하는데도 가수를 하실 생각이신가요?\n지 원 자 : 과거에 (ㄴ)직장에 들어가기 위해 많은 노력을 했습니다. 하지만, 오디션에 합격하여\n어릴 적 꿈이었던 가수로서 제 2의 인생을 살고 싶습니다.\n(ㄱ) (ㄴ)\n① 기회원가 간접원가\n② 기회원가 매몰원가\n③ 매몰원가 기회원가\n④ 매몰원가 간접원가", "answer": 2}, {"year": "2025", "month": "7", "qnum": 116, "text": "[116]다음 중 일반적인 자본예산의 수행과정을 순서대로 나열한 것으로 옳은 것은?\nㄱ. 투자안의 경제성 분석\nㄴ. 투자안의 기대현금흐름 추정\nㄷ. 투자 대상의 선정\nㄹ. 최적 투자안의 선택\nㅁ. 투자안의 실행\n① ㄱ - ㄴ - ㄷ - ㄹ - ㅁ\n② ㄴ - ㄱ - ㄷ - ㄹ - ㅁ\n③ ㄷ - ㄱ - ㄴ - ㄹ - ㅁ\n④ ㄷ - ㄴ - ㄱ - ㄹ - ㅁ", "answer": 4}, {"year": "2025", "month": "7", "qnum": 117, "text": "[117]다음은 연간 유지보수비용의 절감을 위하여 기존의 설비를 폐기하고 새로운 설비를 도입하고자 검토\n중에 있는 ㈜삼일의 자료이다. 기존 설비와 새로운 설비가 각각 동일한 현금매출을 발생시킨다고 할\n때, 신규 설비 도입에 따른 향후 3개년 간 총 현금흐름의 변동액은 얼마인가(단, 모든 거래는 현금으\n로 이루어지며, 법인세 효과와 화폐의 시간가치는 무시한다)?\n기존 설비의 잔존 내용년수 및 신규 설비의 예상 내용년수 3년\n기존 설비의 연간 유지보수비 15,000,000 원\n기존 설비의 처분 가능가액 5,000,000 원\n신규 설비 구입비용 50,000,000 원\n신규 설비의 연간 유지보수비 2,000,000 원\n① (-) 1,000,000원\n② (-) 6,000,000원\n③ (-) 11,000,000원\n④ (-) 12,000,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 118, "text": "[118]다음 중 순현재가치(NPV)법과 내부수익률(IRR)법에 관한 설명으로 옳지 않은 것은(단, 먼저 투자가 이\n루어지고 이후에 현금이 회수되는 투자안을 가정한다)?\n① 순현재가치(NPV)법에서는 순현재가치가 투자금액보다 큰 투자안을 채택한다.\n② 내부수익률(IRR)법에서는 내부수익률이 최저필수수익률을 상회하는 투자안을 채택한다.\n③ 순현재가치(NPV)법은 가치가산의 원칙이 적용되나 내부수익률(IRR)법은 그렇지 않다.\n④ 두 방법 모두 화폐의 시간가치를 고려하는 방법이다.", "answer": 1}, {"year": "2025", "month": "7", "qnum": 120, "text": "[120]무결점운동을 위한 교육비용, 고품질의 부품개발을 위한 연구개발비는 품질원가항목 중 어떤 영역에\n포함되는 원가들인가?\n① 예방원가\n② 평가원가\n③ 내부실패원가\n④ 외부실패원가", "answer": 1}, {"year": "2025", "month": "9", "qnum": 112, "text": "[112]다음 중 의사결정을 위한 관련원가에 해당되는 원가의 합계는 얼마인가?\n기회원가 14,000원 매몰원가 20,000원\n회피가능원가 7,000원 회피불능원가 5,000원\n① 7,000원\n② 19,000원\n③ 21,000원\n④ 26,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 113, "text": "[113]다음 중 부품을 자가제조하고 있는 어떤 기업이 외부에서 부품을 구입하는 대안을 고려하고 있다고 가\n정할 경우 부적절한 의사결정에 해당하는 것은(단, 고정제조간접원가는 당해 부품 생산설비의 감가상\n각비만 존재한다고 가정한다)?\n① 유휴설비를 다른 제품의 생산에 이용할 수 있는 경우에는 변동제조원가 절감액에서 외부부품 구입\n대금을 차감한 금액이 0(영)보다 작은 경우 외부구입 대안을 선택한다.\n② 유휴설비를 1년간 임대해주고 임대료를 받을 수 있는 경우에는 변동제조원가 절감액과 임대료 수\n입액의 합계에서 외부부품 구입대금을 차감한 금액이 0(영)보다 큰 경우 외부구입 대안을 선택한\n다.\n③ 유휴설비의 다른 용도가 없는 경우에는 변동제조원가 절감액에서 외부부품 구입대금을 차감한 금액\n이 0(영)보다 큰 경우 외부구입 대안을 선택한다.\n④ 금액적인 증분수익과 증분원가 이외에 외부공급처의 지속적 확보 여부, 품질의 동질성 등 비재무적\n요인도 고려하여야 한다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 115, "text": "[115]건강검진센터를 운영하는 ㈜삼일은 내용연수가 2년인 자동 생체인식 소프트웨어에 투자를 계획하고 있\n다. 동 소프트웨어에 투자 시, 1차년도에는 6,000,000원, 2차년도에는 3,000,000원의 운영비용이 각\n각 절감 가능하며, 사용 종료 후 해당 자산을 연구기관에 1,000,000원에 처분할 수 있을 것으로 예상\n된다. ㈜삼일의 최저필수수익률이 10 % 일 때, NPV법을 고려하여 수용 가능한 소프트웨어의 최대 취득\n금액을 계산하면 얼마인가(단, 법인세효과는 고려하지 않으며 투자를 제외한 모든 현금흐름은 연말에\n발생된다고 가정하고, 천원 단위에서 반올림한다)?\n① 7,934,000원\n② 8,264,000원\n③ 8,760,000원\n④ 9,091,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 116, "text": "[116]다음 중 투자안으로부터 얻어지는 현금유입액의 현재가치와 투자에 소요되는 현금유출액의 현재가치를\n같게 해주는 할인율을 산출하는 자본예산모형으로 옳은 것은?\n① 수익성지수법(PI)\n② 회계적이익률법(ARR)\n③ 순현재가치법(NPV)\n④ 내부수익률법(IRR)", "answer": 4}, {"year": "2025", "month": "9", "qnum": 117, "text": "[117]장기의사결정을 위한 방법 중 회수기간법은 여러가지 이론적인 단점에도 불구하고 실무상 많이 사용되\n고 있다. 다음 중 회수기간법이 실무에서 많이 사용되는 이유로 옳지 않은 것은?\n① 비현금자료도 반영되는 포괄적 분석기법이다.\n② 기업의 유동성 확보와 관련된 의사결정에 유용하다.\n③ 화폐의 시간적 가치를 고려하지 않으므로 순현재가치법, 내부수익률법에 비해서 적용하기가 쉽다.\n④ 위험지표(risk indicator)로서의 정보를 제공한다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 120, "text": "[120]다음 품질원가 도표에 관한 설명으로 옳지 않은 것은?\n도표A 도표B\n원 총품질원가\n원 총품질원가\n가\n가\nb\nb\na\na\n0 불량률 0 불량률\n① a는 통제원가를, b는 실패원가를 의미한다.\n② 도표A는 허용가능품질관점(acceptable quality view)을 나타낸다.\n③ 전사적 품질관리시스템(TQC system)은 도표B의 관점을 반영한다.\n④ 무결함관점(zero-defects view)에서는 통제원가와 실패원가 사이에 항상 상반관계가 존재한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 112, "text": "[112]다음의 사례에서 밑줄 친 부분이 의미하는 것은?\n김삼일씨는 최근 큰 고민에 빠져있다. 지인이 A회사가 앞으로 사업성이 좋다는 정보를 알려주어\n서 확인도 하지 않고 A사의 주식을 대량 매입하였으나, 기대와는 달리 A사의 주식이 연일 하락\n하고 있기 때문이다. 지금이라도 보유한 주식을 처분해야 할지 고민을 하고 있으나 이미 매입한\n평균주식단가가 너무 높아 이러지도 저러지도 못하고 있는 상황이다.\n① 매몰원가\n② 기회원가\n③ 간접원가\n④ 회피가능원가", "answer": 1}, {"year": "2025", "month": "11", "qnum": 116, "text": "[116]다음 중 자본예산에 관한 설명으로 옳지 않은 것은?\n① 자본예산은 고정자산에 대한 효율적인 투자 수행을 위해 투자안의 타당성을 평가하는 기법이다.\n② 일반적으로 자본예산에 의한 투자에는 거액의 자금이 동원되므로, 이 투자의 성패가 기업의 운명을\n좌우할 수 있다.\n③ 자본예산에 의한 투자는 불확실성(경제상황, 소비자 선호, 기술진보 등)으로 인한 위험이 크다.\n④ 자본예산은 기업의 단기적 경영계획에 바탕을 둔 단기투자에 관한 의사결정이다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 117, "text": "[117]㈜삼일의 경영진은 새로운 투자안을 검토 중이며, 경영진이 분석한 이 투자안의 NPV는 0보다 큰 값이\n산출되었다. 그러나 재무담당자인 갑의 분석에 의하면 이 투자안은 경제성이 없는 것으로 판단된다.\n갑의 분석이 옳다고 했을 때, 이 기업의 경영진은 경제성분석 과정에서 어떤 오류를 범하였겠는가?\n① 현금 영업수익을 너무 낮게 추정하였다.\n② 투자종료시점의 투자안의 처분가치를 너무 낮게 추정하였다.\n③ 법인세를 너무 낮게 추정하였다.\n④ 자본비용을 너무 높게 추정하였다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 118, "text": "[118]㈜삼일은 100,000원에 기계를 구입할 예정이며, 동 기계를 사용함에 따른 연간 원가절감액은 아래의\n표와 같다. 연중 현금흐름이 고르게 발생한다고 가정하고 이 투자안의 회수기간을 계산하면 얼마인가?\n연도 1년 2년 3년 4년 5년\n연간 원가절감액 27,000원 26,000원 27,000원 25,000원 20,000원\n① 3.75년\n② 3.80년\n③ 4.20년\n④ 4.80년", "answer": 2}, {"year": "2025", "month": "11", "qnum": 120, "text": "[120]노트북을 제조하여 판매하는 ㈜삼일의 20X1년 품질과 관련된 재무적 자료는 아래와 같다.\n손해배상 3,000원 원자재 공급업체 평가 2,500원\n재작업비용 1,500원 원재료 검사 및 시험 5,000원\n교환비용 3,000원 품질교육 및 훈련 23,000원\n위의 자료에 근거하여 품질원가 중 예방원가(prevention costs) 금액을 산정하면 얼마인가?\n① 12,000원\n② 23,000원\n③ 25,500원\n④ 30,500원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 112, "text": "[112]다음 중 의사결정과 관련된 원가용어에 관한 설명으로 옳지 않은 것은?\n① 관련원가는 대안간에 차이가 나는 미래원가로 의사결정과 관련된 원가이다.\n② 회피가능원가는 특정 대안을 선택하는 것과 관계없이 계속해서 동일하게 발생하는 원가이다.\n③ 기회원가는 자원을 현재 용도 이외의 다른 용도에 사용할 경우 얻을 수 있는 최대금액이다.\n④ 매몰원가는 과거에 발생한 역사적 원가로서 현재 또는 미래에 회수할 수 없는 원가이다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 114, "text": "[114]선박 제조회사인 ㈜삼일은 소형모터를 자가제조하고 있다. 소형모터 10,000개를 자가제조하는 경우,\n단위당 원가는 다음과 같다.\n직접재료원가 7,000원\n직접노무원가 3,000원\n변동제조간접원가 2,000원\n특수기계 감가상각비 2,000원\n공통제조간접원가 배부액 5,000원\n제품원가 19,000원\n외부 회사에서 ㈜삼일에 소형모터 10,000개를 단위당 16,000원에 공급할 것을 제안하였다. ㈜삼일이\n외부업체의 공급제안을 수용하는 경우, 소형모터 제작을 위하여 사용하던 특수기계는 다른 용도로 사\n용 및 처분이 불가능하며, 소형모터에 배부된 공통제조간접원가의 20 % 를 절감할 수 있다. ㈜삼일이\n외부업체의 공급제안을 수용한다면, 자가제조하는 것보다 얼마나 유리 또는 불리한가?\n① 30,000,000원 불리\n② 30,000,000원 유리\n③ 40,000,000원 불리\n④ 40,000,000원 유리", "answer": 1}, {"year": "2025", "month": "12", "qnum": 116, "text": "[116]다음 중 자본예산을 수행하기 위한 현금흐름을 추정할 때 주의해야 할 사항으로 옳지 않은 것은?\n① 세금을 납부하는 것은 현금의 유출에 해당하므로 세금을 차감한 후의 현금흐름을 기준으로 추정하\n여야 한다.\n② 이자비용은 현금흐름 유출에 해당하므로 이자비용을 차감한 후의 현금흐름을 기준으로 추정하여야\n한다.\n③ 감가상각비를 계상함으로써 발생하는 세금의 절약분인 감가상각비 감세 효과는 현금흐름을 파악할\n때 고려해야 한다.\n④ 명목현금흐름은 명목할인율로 할인해야 하며, 실질현금흐름은 실질할인율로 할인해야 한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 117, "text": "[117]다음 중 자본예산의 분석기법에 관한 설명으로 옳은 것은?\n① 회계적이익률법은 연평균순이익을 투자액으로 나눈 지표를 이용하여 투자안을 평가하는 방법으로\n서, 화폐의 시간가치를 고려하는 할 function renderWrongToc(){
  const list = document.getElementById('ch-list');
  const SCLR_MAP={'재무회계':'#1a73e8','세무회계':'#1e8e3e','원가관리회계':'#e37400'};
  const STAG_MAP={'재무회계':'fin','세무회계':'tax','원가관리회계':'cst'};

  // 어떤 문제가 해당하는지 수집
  const pool=[];
  ['재무회계','세무회계','원가관리회계'].forEach(s=>{
    Object.values(DATA[s]||{}).forEach(qs=>pool.push(...qs));
  });
  const filtered = curS_freq
    ? pool.filter(q=>FREQ[qid(q)])
    : pool.filter(q=>WRONG_EVER[qid(q)]);

  // 챕터별 카운트
  const map={}; // subj+'__'+ch -> {subj,ch,nm,count,tag,col}
  const qChMap={};
  ['재무회계','세무회계','원가관리회계'].forEach(s=>{
    const sd=DATA[s]||{};
    Object.keys(sd).forEach(ch=>{ sd[ch].forEach(q=>{ qChMap[qid(q)]={subj:s,ch,nm:ch.replace(/^\d+_/,'')}; }); });
  });
  filtered.forEach(q=>{
    const info=qChMap[qid(q)];
    if(!info) return;
    const key=info.subj+'__'+info.ch;
    if(!map[key]) map[key]={...info,count:0,tag:STAG_MAP[info.subj],col:SCLR_MAP[info.subj]};
    map[key].count++;
  });

  const groups=Object.values(map);
  if(!groups.length){ list.innerHTML='<div style="padding:12px 14px;font-size:12px;color:#aaa;">오답 없음</div>'; return; }

  // 전체 버튼 + 챕터 목록 렌더
  let html=`<div class="wrong-toc-all${curWrongCh===null?' on':''}" onclick="selectWrongCh(null)">
    <span>전체</span><span class="wrong-toc-cnt">${filtered.length}</span>
  </div>`;
  let lastSubj='';
  groups.forEach(g=>{
    if(g.subj!==lastSubj){
      html+=`<div class="wrong-toc-subj" style="color:${g.col}">${g.subj}</div>`;
      lastSubj=g.subj;
    }
    const isOn=(curWrongCh&&curWrongCh.subj===g.subj&&curWrongCh.ch===g.ch);
    html+=`<div class="chi ${g.tag}${isOn?' on':''}" onclick="selectWrongCh({subj:'${g.subj.replace(/'/g,"\\'")}',ch:'${g.ch.replace(/'/g,"\\'")}'})" style="padding-left:20px">
      <span class="chi-n">${escH(g.nm)}</span><span class="chi-c">${g.count}</span>
    </div>`;
  });
  list.innerHTML=html;
}
