와 관련하여 발생한 재측정요소는 얼마인가?\n· 20X1년 초 확정급여채무의 현재가치 60,000원\n· 당기근무원가 39,000원\n· 이자원가 6,000원\n· 퇴직급여지급액 7,000원\n· 20X1년 말 보험수리적 가정의 변동을 반영한 확정급여채무의 현재가치 110,000원\n① 2,000원\n② 8,000원\n③ 10,000원\n④ 12,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 28, "text": "[28]㈜삼일은 20X1년 1월 1일 임원 10명에게 3년의 용역제공조건(20X1년 1월 1일부터 20X3년 12월 31\n일)으로 1인당 주식결제형 주식선택권 100개를 부여하였다. 부여일 현재 주식선택권의 단위당 공정가\n치는 100원으로 추정되었다. 20X1년말과 20X2년말 추정권리상실률은 10 % 로 예상되었으며, 20X3년\n말 실제권리상실률은 15 % 이다. ㈜삼일이 20X3년 중 인식할 주식보상비용은 얼마인가(단, 제시된 권리\n상실률은 가득기간 전체의 권리상실률이다)?\n① 20,000원\n② 22,500원\n③ 25,000원\n④ 27,500원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 27, "text": "[27]다음 중 확정급여형 퇴직급여제도와 관련하여 당기손익으로 인식되는 항목이 아닌 것은?\n① 당기근무원가\n② 과거근무원가와 정산으로 인한 손익\n③ 순확정급여부채의 순이자\n④ 재측정요소", "answer": 4}, {"year": "2024", "month": "12", "qnum": 28, "text": "[28]㈜삼일은 20X1년 1월 1일 임원 10명에게 용역제공조건으로 주식결제형 주식선택권을 부여하였다. 주\n식결제형 주식기준보상과 관련하여 20X2년 주식보상비용 계산시 필요한 정보로 옳지 않은 것은?\n① 용역제공기간(가득기간)\n② 부여된 지분상품의 수량\n③ 보고기간말 현재 주가차액보상권의 공정가치\n④ 연평균기대권리소멸률", "answer": 3}, {"year": "2025", "month": "1", "qnum": 27, "text": "[27]㈜삼일은 20X1년 1월 1일 현재 근무하고 있는 임직원 100명에게 20X3년 12월 31일까지 의무적으로\n근무하는 것을 조건으로 각각 현금결제형 주가차액보상권 10개씩을 부여하였다. 20X1년 1월 1일 현재\n㈜삼일이 부여한 주가차액보상권의 단위당 공정가치는 3,000원이며, 행사가격은 단위당 2,000원이다.\n주가차액보상권 부여일 현재 임직원 중 10 % 가 3년 이내에 퇴사하여 주가차액보상권을 상실할 것으로\n추정하였다. 연도말 현재 임직원 퇴사비율 추정치, ㈜삼일 주식의 공정가치는 다음과 같다.\n구분 20X1년말 20X2년말 20X3년말\n3년 동안의 퇴사비율 10 % (추정) 20 % (추정) 20 % (실제)\n공정가치 2,500원 2,800원 3,200원\n현금결제형 주식기준보상과 관련하여 ㈜삼일이 인식할 20X2년 주식보상비용은 얼마인가(단, 계산방식에\n따라 단수차이로 인해 오차가 있는 경우, 가장 근사치를 선택한다)?\n① 199,666원\n② 233,333원\n③ 276,666원\n④ 366,666원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 26, "text": "[26]다음 중 종업원급여에 관한 설명으로 옳지 않은 것은?\n① 단기종업원급여는 해고급여를 제외한, 종업원이 관련 근무용역을 제공하는 연차 보고기간 후 12개\n월이 되기 전에 모두 결제될 것으로 예상하는 종업원급여를 말한다.\n② 퇴직급여는 고용주가 종업원의 퇴직 이후에 지급하는 종업원급여를 말하며, 단기종업원급여와 해고\n급여는 제외한다.\n③ 기타장기종업원급여는 종업원이 관련 근무용역을 제공한 연차보고기간 말부터 12개월 이후에 결제\n될 종업원급여를 말한다.\n④ 기타장기종업원급여의 재측정요소는 기타포괄손익으로 인식한다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 28, "text": "[28]다음 중 주식결제형 주식기준보상거래에 관한 설명으로 가장 옳지 않은 것은?\n① 부여한 지분상품(주식선택권 등)이 즉시 가득된다면 기업은 보상원가를 부여일에 전액 인식하고 그\n에 상응하여 자본의 증가를 인식한다.\n② 거래상대방이 특정기간동안 용역을 제공하여야 부여된 지분상품이 가득된다면, 보상원가를 용역제공\n기간에 배분하여 인식한다.\n③ 부여일에 측정한 지분상품의 공정가치가 부여일 이후 변동하는 경우 변동분을 반영하여 추정치를 변\n경한다.\n④ 권리행사시 신주발행 없이 자기주식을 교부할 수 있다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 28, "text": "[28]다음 중 주식기준보상거래에 관한 설명으로 옳지 않은 것은?\n① 주식결제형 주식기준보상거래는 기업이 재화나 용역을 제공받는 대가로 기업의 지분상품을 부여하는\n것이다.\n② 현금결제형 주식기준보상거래는 기업이 재화나 용역을 제공받는 대가로 기업의 지분상품의 가치에\n기초하여 현금 등을 지급하는 것이다.\n③ 종업원으로부터 용역을 제공받는 경우 주식결제형 주식기준보상거래의 보상원가 산정시 지분상품의\n공정가치는 부여일 현재로 측정하고 이후에 공정가치가 변동되는 경우에도 변동분을 반영하지 않는\n다.\n④ 현금결제형 주식기준보상거래에서 기업은 매 보고기간말에 부채의 공정가치를 재측정하지만 부채의\n결제시점에는 공정가치를 재측정하지 않는다.", "answer": 4}, {"year": "2025", "month": "6", "qnum": 27, "text": "[27]확정급여제도의 회계처리에서 다음의 확정급여원가 중 당기손익으로 인식되는 것을 모두 고르면?\n가. 당기근무원가\n나. 과거근무원가\n다. 사외적립자산의 재측정요소\n라. 순확정급여부채(자산)의 순이자\n① 가, 나\n② 나, 다\n③ 가, 나, 다\n④ 가, 나, 라", "answer": 4}, {"year": "2025", "month": "6", "qnum": 28, "text": "[28]다음 중 주식기준보상거래에 관한 설명으로 옳지 않은 것은?\n① 현금결제형 주식기준보상거래는 회사가 재화나 용역을 제공받는 대가로 회사의 주식이나 다른 지분\n상품의 가치에 기초하여 현금이나 기타자산을 지급해야 하는 부채를 재화나 용역의 공급자에게 부담\n하는 주식기준보상거래이다.\n② 현금결제형 주식기준보상거래에서는 제공받는 재화나 용역과 그 대가로 부담하는 부채를 부채의 공\n정가치로 측정한다.\n③ 주식결제형 주식기준보상거래에서 부여한 지분상품이 즉시 가득된다면 기업은 보상원가를 부여일에\n전액 인식하고 그에 상응하는 자본의 증가를 인식한다.\n④ 주식결제형 주식기준보상거래가 종업원으로부터 용역을 제공받는 경우에 해당하고, 기업이 부여한\n지분상품의 공정가치를 신뢰성 있게 추정할 수 없을 경우에는 지분상품을 내재가치로 측정하고, 후\n속적으로 내재가치를 재측정하지 않는다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 26, "text": "[26]다음 중 종업원급여에 관한 설명으로 옳지 않은 것은?\n① 종업원급여는 단기종업원급여, 퇴직급여, 기타장기종업원급여, 해고급여의 네 가지 범주를 포함한\n다.\n② 단기종업원급여는 종업원이 관련 근무용역을 제공하는 연차 보고기간 후 12개월이 되기 전에 모두\n결제될 것으로 예상되는 종업원급여로 해고급여는 제외한다.\n③ 기타장기종업원급여에서 발생하는 재측정요소는 기타포괄손익으로 인식한다.\n④ 확정기여제도에서는 기여금의 불입시 당해 회계기간에 대하여 회사가 납부해야할 부담금을 비용으로\n인식한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 27, "text": "[27]㈜삼일은 확정급여형 퇴직급여제도를 시행하고 있다. 확정급여채무의 현재가치와 사외적립자산의 공정\n가치 변동내역이 서에 계상될 법인세비용(B)은 각각 얼마인가?\n법인세비용차감전순이익 3,000,000원\n가산조정\n일시적차이가 아닌 차이 600,000원\n일시적차이 800,000원\n과세소득 4,400,000원(세율 : 30 %)\n< 추가자료 >\nㄱ. 일시적차이가 사용될 수 있는 미래과세소득의 발생가능성은 높다고 가정한다.\nㄴ. 일시적차이는 모두 차감할 일시적차이이고, 20X2년, 20X3년에 걸쳐 400,000원씩 소멸한다.\nㄷ. 20X1년도에 적용되는 법인세율은 30 % 이지만 20X2년도 이후의 법인세율은 20 % 가 적용되는\n것으로 가정한다.\n(A) (B)\n① 이연법인세부채 160,000원 1,160,000원\n② 이연법인세자산 160,000원 1,160,000원\n③ 이연법인세부채 160,000원 1,480,000원\n④ 이연법인세자산 160,000원 1,480,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 18, "text": "[18]다음 중 금융부채에 해당하는 것으로 옳은 것은?\n① 선수금\n② 이연법인세부채\n③ 기업자신의 지분상품 100주를 인도할 계약상의 의무\n④ 잠재적으로 불리한 조건으로 거래상대방과 금융자산과 금융부채를 교환하기로 한 계약상의 의무", "answer": 4}, {"year": "2025", "month": "12", "qnum": 29, "text": "[29]다음은 ㈜삼일의 20X1년 말과 20X2년 말의 법인세회계와 관련된 내역이다. 20X2년에 ㈜삼일이 인식할\n법인세비용은 얼마인가?\n20X1년 말 20X2년 말\n이연법인세자산 50,000원 80,000원\n이연법인세부채 10,000원 40,000원\n20X2년 당기법인세 240,000원\n① 130,000원\n② 200,000원\n③ 240,000원\n④ 270,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 30, "text": "[30]㈜삼일은 결손이 누적되고 미래 과세소득이 발생하지 않을 것이라 판단하여 미사용 세무상 결손금에 대\n하여 더 이상 이연법인세자산을 인식하지 않기로 하였다. 전기까지 인식하였던 세무상 결손금에 대한\n이연법인세자산을 더 이상을 인식하지 않을 경우 ㈜삼일의 재무제표에 미치는 영향으로 옳지 않은 것\n은?\n① 부채비율 감소\n② 법인세비용 증가\n③ 당기순이익 감소\n④ 법인세비용차감전순이익 변동없음", "answer": 1}], "17_환율변동효과": [{"year": "2024", "month": "1", "qnum": 35, "text": "[35]다음 중 기능통화 및 외화거래에 관한 설명으로 옳지 않은 것은?\n① 외화거래를 보고기간 말에 기능통화로 환산할 때 화폐성항목은 마감환율로 환산하고, 외환차이를 당\n기손익으로 인식한다.\n② 외화거래를 보고기간 말에 기능통화로 환산할 때 역사적원가로 측정하는 비화폐성항목은 거래일의\n환율로 환산하기 때문에, 외환차이가 발생하지 않는다.\n③ 외화거래를 보고기간 말에 기능통화로 환산할 때 공정가치로 측정하는 비화폐성항목은 공정가치가\n결정된 날의 환율로 환산하며, 외환차이는 항상 기타포괄손익으로 인식한다.\n④ 외화거래를 최초로 인식하는 경우 거래일의 환율을 외화금액에 적용하여 기능통화로 기록한다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 35, "text": "[35]다음 중 기능통화와 표시통화에 관한 설명으로 옳지 않은 것은?\n① 표시통화와 기능통화는 반드시 동일한 화폐로 사용하여야 한다.\n② 표시통화란 재무제표를 표시할 때 사용하는 통화이다.\n③ 기능통화로 외화거래를 최초로 인식하는 경우에 거래일의 외화와 기능통화 사이의 현물환율을 외화\n금액에 적용하여 기록한다.\n④ 기능통화란 영업활동이 이루어지는 주된 경제 환경의 통화이다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 35, "text": "[35]외화거래를 최초로 인식하는 경우 거래일의 외화와 기능통화 사이의 현물환율을 외화금액에 적용하여\n기능통화로 기록한다. 다음의 외화자산 및 부채 중 보고기간 말의 마감환율을 적용하여 환산하여야 할\n화폐성항목으로 옳지 않은 것은?\n① 선급금\n② 매입채무\n③ 매출채권\n④ 장기차입금", "answer": 1}, {"year": "2024", "month": "9", "qnum": 35, "text": "[35]다음 중 기능통화에 의한 외화거래의 보고에 관한 설명으로 옳지 않은 것은?\n① 외화거래를 최초로 인식하는 경우 거래일의 환율을 외화금액에 적용하여 기능통화로 기록한다.\n② 화폐성항목의 결제시점에 생기는 외환차이는 그 외환차이가 생기는 회계기간의 기타포괄손익으로 인\n식한다.\n③ 역사적원가로 측정하는 비화폐성 외화항목은 보고기간 말에 거래일의 환율로 환산한다.\n④ 공정가치로 측정하는 비화폐성항목에서 생긴 공정가치 평가손익을 기타포괄손익으로 인식하는 경우\n에는 그 손익에 포함된 환율변동효과를 기타포괄손익으로 인식한다.", "answer": 2}, {"year": "2024", "month": "11", "qnum": 35, "text": "[35]다음 중 환율변동효과에 관한 설명으로 옳지 않은 것은?\n① 재무제표를 표시할 때 사용되는 통화를 표시통화라고 한다.\n② 기능통화와 표시통화가 서로 다른 경우 기능통화로 표시된 재무제표를 표시통화로 환산하여야 한다.\n③ 표시통화는 영업활동이 이루어지는 주된 경제환경의 통화로서, 기업과 관련된 실제 거래, 사건과 상\n황을 반영하여 결정되어야 하다.\n④ 기능통화가 변경되는 경우에는 새로운 기능통화에 의한 환산절차를 변경한 날부터 전진적용한다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 34, "text": "[34]다음 중 환율변동효과와 관련하여 괄호 안에 들어갈 단어로 옳은 것은?\n기능통화와 표시통화가 다른 경우 표시통화로 재무상태와 경영성과를 환산하여 보고해야 한다.\n재무상태표의 자산과 부채는 ( ㄱ )을 적용하고, 포괄손익계산서의 수익과 비용은 ( ㄴ )을\n적용하되 환율이 유의적으로 변동하지 않을 경우에는 ( ㄷ )을 적용할 수 있다.\nㄱ ㄴ ㄷ\n① 해당 기간의 평균환율 해당 거래일의 환율 보고기간 말의 마감환율\n② 해당 기간의 평균환율 보고기간 말의 마감환율 해당 거래일의 환율\n③ 보고기간 말의 마감환율 해당 거래일의 환율 해당 기간의 평균환율\n④ 보고기간 말의 마감환율 해당 기간의 평균환율 해당 거래일의 환율", "answer": 3}, {"year": "2025", "month": "6", "qnum": 35, "text": "[35]다음 중 기능통화에 의한 외화거래의 보고에 관한 설명으로 옳지 않은 것은?\n① 기능통화로 외화거래를 최초로 인식하는 경우에 거래일의 외화와 기능통화 사이의 현물환율을 외화\n금액에 적용하여 기록한다.\n② 역사적원가로 측정하는 비화폐성 외화항목은 거래일의 환율로 환산한다.\n③ 화폐성항목의 결제시점에 생기는 외환차이는 그 외환차이가 생기는 회계기간의 당기손익으로 인식한\n다.\n④ 비화폐성항목에서 생긴 손익을 기타포괄손익으로 인식하는 경우에도 그 손익에 포함된 환율변동효과\n는 당기손익으로 인식한다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 35, "text": "[35]다음 중 기능통화 및 외화거래에 관한 설명으로 옳지 않은 것은?\n① 외화거래를 최초로 인식하는 경우 거래일의 환율을 외화금액에 적용하여 기능통화로 기록한다.\n② 외화거래를 보고기간 말에 기능통화로 환산할 때 화폐성항목은 마감환율로 환산하고, 외환차이를 당\n기손익으로 인식한다.\n③ 외화거래를 보고기간 말에 기능통화로 환산할 때 역사적원가로 측정하는 비화폐성항목은 거래일의\n환율로 환산하기 때문에, 외환차이가 발생하지 않는다.\n④ 외화거래를 보고기간 말에 기능통화로 환산할 때 공정가치로 측정하는 비화폐성항목은 공정가치가\n결정된 날의 환율로 환산하며, 외환차이는 항상 당기손익으로 인식한다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 35, "text": "[35]다음 중 재무제표의 외화환산에 관한 설명으로 가장 옳지 않은 것은?\n① 기능통화와 표시통화가 다른 경우 표시통화로 재무상태와 경영성과를 환산하여 보고해야 한다.\n② 재무상태표의 자산과 부채는 해당 보고기간 말의 마감환율로 환산한다.\n③ 포괄손익계산서의 수익과 비용은 해당 거래일의 환율로 환산한다.\n④ 재무제표의 환산에서 생기는 외환차이는 당기손익으로 인식한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 35, "text": "[35]다음 중 환율변동효과에 관한 설명으로 옳지 않은 것은?\n① 한번 결정된 기능통화는 그와 관련된 실제 거래, 사건과 상황의 변화가 있는 경우에도 변경할 수 없\n다.\n② 표시통화란 재무제표를 표시할 때 사용하는 통화로서 기업은 어떤 통화든지 표시통화로 사용할 수\n있다.\n③ 화폐성항목이란 미래에 확정되었거나 결정가능할 수 있는 화폐단위의 수량으로 받을 권리 또는 지급\n할 의무가 있는 자산과 부채를 말한다.\n④ 외화거래를 보고기간말에 환산하는 경우 공정가치로 측정하는 비화폐성 외화항목은 공정가치가 결정\n된 날의 환율로 환산한다.", "answer": 1}], "18_파생상품과 위험회피회계": [{"year": "2024", "month": "1", "qnum": 36, "text": "[36]다음 중 위험회피회계에 관한 설명으로 옳지 않은 것은?\n① 위험회피회계란 위험회피대상항목과 위험회피수단에 대한 손익이 상쇄되어 동일한 회계기간에 보고\n될 수 있도록 위험회피대상항목과 위험회피수단을 대칭적으로 인식하고 평가하는 회계처리를 말한\n다.\n② 현금흐름위험회피회계란 위험회피대상항목이 자산, 부채, 확정계약으로서 당해 항목의 공정가치변동\n을 상쇄하기 위하여 파생상품 등을 이용하는 것을 말한다.\n③ 현금흐름위험회피회계는 위험회피수단에 대한 손익 중 위험회피에 효과적인 부분은 기타포괄손익으\n로 인식하여 자본(기타포괄손익누계액)으로 처리하고 위험회피에 효과적이지 않은 부분은 당해 회계\n연도에 당기손익으로 인식한다.\n④ 공정가치위험회피회계는 원칙적으로 위험회피수단에 대한 손익과 위험회피대상항목의 회피대상위험\n에 대한 손익을 당기손익으로 반영한다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 36, "text": "[36]다음 중 파생상품회계의 일반원칙에 관한 설명으로 옳은 것은?\n① 현금흐름 위험회피회계에서 위험회피수단의 손익 중 위험회피에 효과적인 부분은 당해 회계연도의\n기타포괄손익으로 인식한다.\n② 현금흐름 위험회피회계에서 위험회피수단의 손익 중 위험회피에 효과적이지 않은 부분은 당해 회계\n연도의 기타포괄손익으로 인식한다.\n③ 위험회피수단으로 지정되지 않고 매매목적으로 보유하고 있는 파생상품의 평가손익은 기타포괄손익\n으로 처리한다.\n④ 공정가치 위험회피회계에서 위험회피대상이 채무상품인 경우 위험회피수단에 대한 손익은 당해 회계\n연도의 기타포괄손익으로 인식한다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 36, "text": "[36]㈜삼일은 상품을 $2,000에 외상으로 매출하고, 대금을 9개월 후에 달러($)로 지급받기로 하였다. 이\n경우 외화매출채권 $2,000은 환율변동위험에 노출되게 되어 ㈜삼일은 이를 회피하기 위한 방안을 고려\n중이다. 이와 관련된 위험회피 방안으로 적절한 것은?\n① 달러($)를 매입하는 선도계약 체결\n② 달러($)를 기초자산으로 하는 풋옵션 매입\n③ 달러($)를 기초자산으로 하는 콜옵션 매입\n④ 달러($)를 기초자산으로 하는 풋옵션 매도", "answer": 2}, {"year": "2024", "month": "6", "qnum": 36, "text": "[36]다음 중 파생상품의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 파생상품은 해당 계약에 따라 발생된 권리와 의무를 자산, 부채로 인식하여 재무제표에 계상한다.\n② 위험회피대상항목은 공정가치나 미래현금흐름의 변동위험에 노출되어 있고, 위험회피대상으로 지정\n된 자산, 부채, 확정계약, 발생가능성이 매우 높은 예상거래 또는 해외사업장에 대한 순투자를 말한\n다.\n③ 공정가치위험회피목적의 파생상품 평가손익은 기타포괄손익으로 인식한다.\n④ 위험회피수단으로 지정되지 않고 매매목적 등으로 보유하고 있는 파생상품의 평가손익은 당기손익으\n로 인식한다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 36, "text": "[36]다음 중 위험회피회계에 관한 설명으로 옳지 않은 것은?\n① 공정가치위험회피회계는 원칙적으로 위험회피수단에 대한 손익과 위험회피대상항목의 회피대상위험\n에 대한 손익을 당기손익으로 반영한다.\n② 현금흐름위험회피회계는 위험회피수단에 대한 손익 중 위험회피에 효과적인 부분은 기타포괄손익으\n로 인식하여 자본(기타포괄손익누계액)으로 처리하고 위험회피에 효과적이지 않은 부분은 당해 회계\n연도에 당기손익으로 인식한다.\n③ 현금흐름위험회피회계란 위험회피대상항목이 자산, 부채, 확정계약으로서 당해 항목의 공정가치변동\n을 상쇄하기 위하여 파생상품 등을 이용하는 것을 말한다.\n④ 위험회피회계란 위험회피대상항목과 위험회피수단에 대한 손익이 상쇄되어 동일한 회계기간에 보고\n될 수 있도록 위험회피대상항목과 위험회피수단을 대칭적으로 인식하고 평가하는 회계처리를 말한\n다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 36, "text": "[36]㈜삼일은 6개월 후에 $2,000의 재고자산을 구입할 예정이며 현재 환율은 1,000원/$ 이다. 그러나 6개\n월 후에 환율이 1,100원/$ 으로 상승한다면 재고자산의 매입으로 인한 현금 유출액은 당초 계획보다 증\n가하게 될 것이다. ㈜삼일은 이를 회피하기 위하여 6개월 후에 $2,000를 $1당 1,050원에 매입하는 통\n화선도계약을 체결하였다. 해당 거래의 위험회피유형으로 옳은 것은?\n① 매매목적위험회피\n② 공정가치위험회피\n③ 현금흐름위험회피\n④ 해외사업장순투자위험회피", "answer": 3}, {"year": "2024", "month": "11", "qnum": 36, "text": "[36]다음 중 파생상품 및 위험회피회계에 관한 설명으로 옳지 않은 것은?\n① 위험회피수단으로 지정되지 않고 매매목적으로 보유하고 있는 파생상품의 평가손익은 당기손익으로\n인식한다.\n② 위험회피대상항목이 미래에 예상되는 거래로서 당해 거래에 따른 미래현금흐름변동을 상쇄하기 위하\n여 현금흐름위험회피회계를 적용할 수 있다.\n③ 인식된 자산, 부채, 확정계약은 공정가치위험회피회계의 위험회피대상항목이 될 수 있다.\n④ 위험회피대상이 기타포괄손익-공정가치 측정 금융자산인 지분상품일 경우 위험회피수단인 파생상품\n의 평가손익은 당기손익으로 인식한다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 36, "text": "[36]㈜삼일은 외국의 수입업자에게 $ 10,000의 상품을 판매하기로 20X1년 11월 1일에 약정하고, 상품은\n20X2년 2월 1일에 인도하기로 하였다. ㈜삼일은 대금결제에 대비하기 위하여 판매계약시점에서 3개월\n후에 $ 1당 1,000원으로 $ 10,000를 매도할 수 있는 통화선도계약을 체결하였다. 20X1년 11월 1일의\n선도환율은 $ 1당 1,000원이었으나, 20X1년말 선도환율은 $ 1당 900원이다. 통화선도계약의 공정가치\n변동분 중 80 % 는 위험회피에 효과적이라고 가정할 때, ㈜삼일이 통화선도계약과 관련하여 20X1년에\n당기손익으로 인식할 파생상품평가손익을 계산하면 얼마인가(단, 파생상품의 공정가치 측정시 현재가치\n평가는 생략하기로  매매목적의 파생상품평가손익\n④ 공정가치위험회피 목적의 파생상품평가손익", "answer": 1}, {"year": "2025", "month": "9", "qnum": 36, "text": "[36]다음 중 위험회피회계에 관한 설명으로 가장 옳지 않은 것은?\n① 위험회피회계란 위험회피대상항목과 위험회피수단에 대한 손익이 상쇄되어 동일한 회계기간에 보고\n될 수 있도록 위험회피대상항목과 위험회피수단을 대칭적으로 인식하고 평가하는 회계처리를 말한\n다.\n② 공정가치위험회피란 위험회피대상항목이 자산, 부채, 확정계약으로서 당해 항목의 공정가치변동을\n상쇄하기 위하여 파생상품 등을 이용하는 것을 말한다.\n③ 공정가치위험회피회계는 원칙적으로 위험회피수단에 대한 손익과 위험회피대상항목의 회피대상위험\n에 대한 손익을 기타포괄손익으로 반영한다.\n④ 현금흐름위험회피회계는 위험회피수단에 대한 손익 중 위험회피에 효과적인 부분은 기타포괄손익으\n로 인식하여 자본(기타포괄손익누계액)으로 처리하고 위험회피에 효과적이지 않은 부분은 당해 회계\n연도에 당기손익으로 인식한다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 36, "text": "[36]다음 중 파생상품 및 위험회피회계에 관한 설명으로 옳지 않은 것은?\n① 위험회피수단으로 지정되지 않고 매매목적으로 보유하고 있는 파생상품의 평가손익은 기타포괄손익\n으로 인식한다.\n② 위험회피대상항목이 미래에 예상되는 거래로서 당해 거래에 따른 미래현금흐름변동을 상쇄하기 위하\n여 현금흐름위험회피회계를 적용할 수 있다.\n③ 인식된 자산, 부채, 확정계약은 공정가치위험회피회계의 위험회피대상항목이 될 수 있다.\n④ 위험회피대상이 기타포괄손익-공정가치 측정 금융자산인 지분상품일 경우 위험회피수단인 파생상품\n의 평가손익은 기타포괄손익으로 인식한다.", "answer": 1}, {"year": "2025", "month": "12", "qnum": 36, "text": "[36]다음 중 파생상품의 회계처리 등에 관한 설명으로 옳지 않은 것은?\n① 위험회피대상항목은 공정가치 변동위험 또는 미래현금흐름 변동위험에 노출된 자산, 부채, 확정계약\n또는 미래에 예상되는 거래를 말한다.\n② 내재파생상품은 파생상품이 아닌 주계약을 포함하는 복합상품의 구성요소이며, 복합상품의 현금흐름\n중 일부를 독립적인 파생상품의 경우와 유사하게 변동시키는 금융상품을 말한다.\n③ 위험회피수단으로 지정되지 않고 매매목적 등으로 보유하고 있는 파생상품의 평가손익은 당기손익으\n로 계상해야 한다.\n④ 현금흐름위험회피를 적용하는 경우, 위험회피수단에 대한 손익 중 위험회피에 효과적인 부분은 당기\n손익으로 처리한다.", "answer": 4}], "19_리스": [{"year": "2024", "month": "1", "qnum": 37, "text": "[37]㈜삼일리스는 20X1년 1월 1일 ㈜용산과 금융리스계약을 체결하였다. ㈜용산의 20X1년 말 재무상태표\n에 표시되는 사용권자산의 장부금액은 얼마인가?\nㄱ. 리스기간 : 20X1년 1월 1일 ~ 20X3년 12월 31일\nㄴ. 기초자산 내용연수 : 4년\nㄷ. 기초자산 잔존가치 : 0(영)\nㄹ. 리스료 지급방법 : 리스기간 동안 매년 말 지급\nㅁ. 리스실행일 현재 리스료의 현재가치 : 500,000원\nㅂ. ㈜용산의 리스개설직접원가 : 100,000원\nㅅ. 리스기간 종료 후 ㈜삼일리스에 반환하는 조건이며, 잔존가치보증에 대한 약정은 없다.\n① 300,000원\n② 350,000원\n③ 400,000원\n④ 450,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 14, "text": "[14]다음 중 투자부동산으로 분류되지 않는 것은?\n① 장기 시세차익을 얻기 위하여 보유하고 있는 토지\n② 장래 용도를 결정하지 못한 채로 보유하고 있는 토지\n③ 통상적인 영업과정에서 판매하기 위한 부동산\n④ 운용리스로 제공하기 위하여 보유하고 있는 미사용건물", "answer": 3}, {"year": "2024", "month": "3", "qnum": 37, "text": "[37]다음 중 리스가 일반적으로 금융리스로 분류될 수 있는 상황의 예로 옳지 않은 것은?\n① 리스기간 종료시점 이전에 기초자산의 소유권이 리스이용자에게 이전되는 경우\n② 리스이용자가 선택권을 행사할 수 있는 날의 공정가치보다 충분히 낮을 것으로 예상되는 가격으로\n기초자산을 매수할 수 있는 선택권을 가지고 있지만, 그 선택권을 행사하지 않을 것이 리스약정일\n현재 상당히 확실한 경우\n③ 기초자산의 소유권이 이전되지는 않더라도 리스기간이 기초자산의 경제적 내용연수의 상당 부분을\n차지하는 경우\n④ 리스약정일 현재 리스료의 현재가치가 적어도 기초자산 공정가치의 대부분에 해당하는 경우", "answer": 2}, {"year": "2024", "month": "5", "qnum": 37, "text": "[37]다음 중 리스에 관한 설명으로 옳은 것은?\n① 리스이용자의 입장에서 보증잔존가치와 무보증잔존가치는 모두 리스료에 포함한다.\n② 금융리스에서 리스제공자가 리스채권으로 인식할 금액은 리스료의 현재가치와 보증잔존가치의 현재\n가치를 합한 금액이다.\n③ 지수나 요율(이율)에 따라 달라지는 변동리스료는 리스료에 포함된다.\n④ 리스이용자는 각 리스를 운용리스나 금융리스로 분류한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 37, "text": "[37]다음 중 리스에 관한 설명으로 옳지 않은 것은?\n① 내재이자율은 리스료의 현재가치 합계액을 기초자산의 공정가치와 리스제공자의 리스개설직접원가의\n합계액과 동일하게 하는 할인율을 말한다.\n② 리스개설직접원가란 리스를 체결하지 않았더라면 부담하지 않았을 리스체결의 증분원가를 말한다.\n③ 리스이용자는 리스개시일에 그날 현재 지급되지 않은 리스료의 현재가치로 리스부채를 측정한다.\n④ 리스이용자는 단기리스와 소액 기초자산 리스에 대해 사용권자산과 리스부채를 인식하지 않기로 선\n택할 수 있다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 14, "text": "[14]다음 중 투자부동산에 관한 설명으로 옳지 않은 것은?\n① 투자부동산은 임대수익이나 시세차익 또는 두 가지 모두를 얻기 위하여 소유자가 보유하거나 리스이\n용자가 사용권자산으로 보유하고 있는 부동산을 의미한다.\n② 투자부동산은 공정가치모형과 원가모형 중 하나를 선택하여 모든 투자부동산에 적용한다.\n③ 투자부동산의 공정가치모형 적용시 공정가치 변동으로 발생하는 손익은 당기손익에 반영한다.\n④ 투자부동산으로 분류된 건물에 대하여 공정가치모형을 적용할 경우 잔여 내용연수동안 공정가치에\n기초하여 감가상각한다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 37, "text": "[37]다음 중 리스에 관한 설명으로 옳지 않은 것은?\n① 리스란 대가와 교환하여 기초자산의 사용권을 일정기간 이전하는 계약이나 계약의 일부를 말한다.\n② 리스제공자는 각 리스를 운용리스나 금융리스로 분류하여 유형별로 다른 회계처리를 한다.\n③ 리스이용자는 리스개시일에 사용권자산과 리스부채를 인식하는 것을 원칙으로 한다.\n④ 단기리스와 소액 기초자산 리스는 사용권자산과 리스부채를 인식할 수 없으며, 리스료를 비용으로만\n인식한다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 37, "text": "[37]㈜삼일은 20X1년 1월 1일에 사무실 임차계약을 체결하였다. ㈜삼일이 리스부채에 대해 20X1년에 인식\n할 이자비용은 얼마인가(단, 계산금액은 소수점 첫째자리에서 반올림함을 원칙으로 하고, 가장 근사치\n를 답으로 선택한다)?\nㄱ. 임차기간은 20X1년 1월 1일부터 20X3년 12월 31일까지 이며, 매년 12월 31일에 고정리스\n료 100,000원을 지급한다.\nㄴ. ㈜삼일의 20X1년 1월 1일 증분차입이자율은 연 10 % 이다.\nㄷ. 3년 10 % 정상연금 현가계수는 2.48685이며, 현가계수는 0.75131이다.\n① 17,355원\n② 21,711원\n③ 24,869원\n④ 28,526원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 38, "text": "[38]다음 중 리스이용자의 리스부채 측정치에 반영되지 않는 것은?\n① 리스이용자가 매수선택권을 행사할 것이 상당히 확실한 경우에 그 매수선택권의 행사가격\n② 무보증 잔존가치\n③ 지수나 요율(이율)에 따라 달라지는 변동리스료\n④ 고정리스료", "answer": 2}, {"year": "2024", "month": "11", "qnum": 37, "text": "[37]㈜삼일은 20X1년 1월 1일 ㈜용산과 기계장치에 대한 리스계약을 다음과 같이 체결하였다. 20X2년 말\n㈜용산이 인식해야 할 리스부채를 계산하면 얼마인가(단, 단수차이가 발생하는 경우 가장 근사치를 선\n택한다)?\nㄱ. 리스료 : 매년 말 200,000원씩 지급\nㄴ. 20X1년 1월 1일 현재 리스부채의 현가 : 758,158원\nㄷ. 리스부채 측정시 사용한 내재이자율 : 연 10 %\nㄹ. 리스기간 : 5년\n① 497,371원\n② 576,583원\n③ 633,974원\n④ 698,476원", "answer": 1}, {"year": "2024", "month": "11", "qnum": 40, "text": "[40]다음 중 현금흐름표 작성시 현금흐름의 유형구분에 관한 설명으로 옳지 않은 것은?\n① 종업원과 관련하여 직·간접적으로 발생하는 현금유출은 영업활동 현금흐름으로 분류한다.\n② 법인세의 납부 또는 환급과 관련된 현금흐름은 재무와 투자활동에 명백히 관련되어 있지 않는 한 영\n업활동 현금흐름으로 분류한다.\n③ 다른 기업의 지분상품 취득에 따른 현금유출은 투자활동으로 분류하는 것이 원칙이지만, 단기매매목\n적으로 보유하는 상품의 취득에 따른 현금유출은 영업활동 현금흐름으로 분류한다.\n④ 리스이용자의 리스부채 상환에 따른 현금흐름은 영업활동 현금흐름으로 분류한다.\n\n< 세무회계 >", "answer": 4}, {"year": "2025", "month": "1", "qnum": 14, "text": "[14]다음 중 투자부동산에 관한 설명으로 가장 옳지 않은 것은?\n① 투자부동산은 임대수익이나 시세차익 또는 두 가지 모두를 얻기 위하여 소유자가 보유하거나 리스이\n용자가 사용권자산으로 보유하고 있는 부동산을 의미한다.\n② 투자부동산은 공정가치모형과 원가모형 중 하나를 선택하여 투자부동산의 유형별로 동일하게 적용한\n다.\n③ 투자부동산의 공정가치모형 적용시 감가상각은 하지 않는다.\n④ 투자부동산의 공정가치모형 적용시 공정가치 변동으로 발생하는 손익은 당기손익에 반영한다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 36, "text": "[36]다음 중 ( ) 안에 들어갈 단어로 가장 옳은 것은?\n리스이용자의 ( )은 리스이용자가 비슷한 경제적 환경에서 비슷한 기간에 걸쳐 비슷한\n담보로 사용권자산과 가치가 비슷한 자산 획득에 필요한 자금을 차입한다면 지급해야 하는 이\n자율을 말한다.\n① 증분차입이자율\n② 시장이자율\n③ 내재이자율\n④ 우량회사채이자율", "answer": 1}, {"year": "2025", "month": "1", "qnum": 37, "text": "[37]㈜삼일은 20X1년 1월 1일 ㈜용산리스로부터 기계장치를 3년간 리스하기로 하고, 매년 말 고정리스료\n로 1,000,000원씩 지급하기 하였다. 리스기간 종료시 동 기계장치는 ㈜용산리스에 반환하는 조건이며,\n보증잔존가치는 300,000원이다. 리스개시일에 ㈜삼일은 잔존가치의 보증에 따라 리스기간 종료시 지급\n할 금액이 없다고 추정하였다. 리스개시일 현재 ㈜용산리스의 내재이자율은 알 수 없으며, ㈜삼일의 증\n분차입이자율은 10 % 이다. ㈜삼일이 리스개시일에 인식할 리스부채는 얼마인가?\n단일금액 1원의 현재가치 정상연금 1원의 현재가치\n기간\n(할인율 10 % ) (할인율 10 % )\n3년 0.7513 2.4869\n① 2,086,900원\n② 2,236,900원\n③ 2,486,900원\n④ 2,712,290원", "answer": 3}, {"year": "2025", "month": "1", "qnum": 38, "text": "[38]다음 중 재무활동으로 인한 현금흐름으로 분류되지 않는 것은?\n① 주식 발행에 따른 현금유입\n② 차입금의 상환에 따른 현금유출\n③ 단기매매목적으로 보유하는 계약에서 발생한 현금유입\n④ 리스이용자의 리스부채 상환에 따른 현금유출", "answer": 3}, {"year": "2025", "month": "3", "qnum": 37, "text": "[37]다음 중 리스에 관한 설명으로 옳지 않은 것은?\n① 리스란 대가와 교환하여 기초자산의 사용권을 일정기간 이전하는 계약이나 계약의 일부를 말한다.\n② 리스이용자는 각 리스를 운용리스나 금융리스로 분류하여 유형별로 다른 회계처리를 한다.\n③ 리스이용자는 리스개시일에 사용권자산과 리스부채를 인식하는 것을 원칙으로 한다.\n④ 단기리스와 소액 기초자산 리스는 사용권자산과 리스부채를 인식하지 않기로 선택할 수 있다.", "answer": 2}, {"year": "2025", "month": "5", "qnum": 37, "text": "[37]㈜삼일리스는 20X1년 1월 1일 ㈜용산(리스이용자)과 금융리스계약을 체결하였다. ㈜용산의 20X1년 말\n재무상태표에 표시되는 사용권자산의 장부금액은 얼마인가?\nㄱ. 리스기간 : 20X1년 1월 1일 ~ 20X4년 12월 31일\nㄴ. 기초자산 내용연수 : 5년\nㄷ. 기초자산 잔존가치 : 0(영)\nㄹ. 리스료 지급방법 : 리스기간 동안 매년 말 지급\nㅁ. 리스실행일 현재 리스료의 현재가치 : 500,000원\nㅂ. ㈜용산의 리스개설직접원가 : 100,000원\nㅅ. 리스기간 종료 후 ㈜삼일리스에 반환하는 조건이며, 잔존가치보증에 대한 약정은 없다.\n① 300,000원\n② 350,000원\n③ 400,000원\n④ 450,000원", "answer": 4}, {"year": "2025", "month": "6", "qnum": 14, "text": "[14]다음 중 투자부동산으로 분류되지 않는 것은?\n① 장기 시세차익을 얻기 위하여 보유하고 있는 토지\n② 장래 용도를 결정하지 못한 채로 보유하고 있는 토지\n③ 금융리스로 제공한 부동산\n④ 운용리스로 제공하기 위하여 보유하고 있는 미사용건물", "answer": 3}, {"year": "2025", "month": "7", "qnum": 37, "text": "[37]다음 중 리스에 관한 설명으로 옳지 않은 것은?\n① 리스란 대가와 교환하여 기초자산의 사용권을 일정기간 이전하는 계약이나 계약의 일부를 말한다.\n② 리스이용자는 리스개시일에 사용권자산과 리스부채를 인식하는 것을 원칙으로 한다.\n③ 단기리스와 소액 기초자산 리스는 사용권자산과 리스부채를 인식할 수 없으며, 리스료를 비용으로만\n인식한다.\n④ 리스이용자의 증분차입이자율은 리스이용자가 비슷한 경제적 환경에서 비슷한 기간에 걸쳐 비슷한\n담보로 사용권자산과 가치가 비슷한 자산 획득에 필요한 자금을 차입한다면 지급해야하는 이자율을\n말한다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 14, "text": "[14]다음 중 투자부동산에 해당하지 않는 것은(단, 해당부동산의 보유자는 제조업을 영위한다고 가정한다)?\n① 장래 용도를 결정하지 못한 채로 보유하고 있는 부동산\n② 임대수익을 얻기 위하여 리스이용자가 사용권자산으로 보유하고 있는 부동산\n③ 부동산 소유자가 부동산 사용자에게 경미한 부수용역을 제공하는 임대용 부동산\n④ 공장 건설 부지로 사용목적을 결정한 부동산", "answer": 4}, {"year": "2025", "month": "9", "qnum": 37, "text": "[37]㈜삼일은 20X1년 1월 1일에 사무실 임차계약을 체결하였다. ㈜삼일이 20X1년 1월 1일에 인식할 사용\n권자산의 원가는 얼마인가(단, 리스이용자의 내재이자율은 쉽게 산정할 수 없으며, 가장 근사치를 답으\n로 선택한다)?\nㄱ. 임차기간은 20X1년 1월 1일부터 20X3년 12월 31일까지이며, 매년 12월 31일에 고정리스료\n100,000원을 지급한다.\nㄴ. ㈜삼일의 20X1년 1월 1일 증분차입이자율은 연 10 % 이다.\nㄷ. 20X3년 12월 31일 임차계약 종료시점에 사무실을 원상복구해야하며, 20X1년 1월 1일 복구원가\n추정액의 현재가치는 200,000원이다.\nㄹ. 3기간 10 % 정상연금 현가계수는 2.48685이며, 현가계수는 0.75131이다.\n① 376,355원\n② 391,711원\n③ 448,685원\n④ 448,526원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 37, "text": "[37]㈜삼일은 20X1년 1월 1일 ㈜용산(리스이용자)과 기계장치에 대한 리스계약을 다음과 같이 체결하였다.\n20X3년에 ㈜용산이 인식해야 할 리스부채의 이자비용을 계산하면 얼마인가(단, 단수차이가 발생하는 경\n우 가장 근사치를 선택한다)?\nㄱ. 리스료 : 매년 말 200,000원씩 지급\nㄴ. 20X1년 1월 1일 현재 리스부채의 현재가치 : 758,158원\nㄷ. 20X1년 말 재무상태표상 리스부채의 장부금액 : 633,974원\nㄹ. 리스기간 : 5년\n① 34,711원\n② 49,737원\n③ 57,658원\n④ 63,397원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 37, "text": "[37]다음 중 리스에 관한 설명으로 옳지 않은 것은?\n① 내재이자율은 리스료 및 무보증잔존가치의 현재가치 합계액을 기초자산의 공정가치와 리스제공자의\n리스개설직접원가의 합계액과 동일하게 하는 할인율을 말한다.\n② 리스개설직접원가란 리스를 체결하지 않았더라면 부담하지 않았을 리스체결의 증분원가를 말한다.\n③ 리스이용자는 리스개시일에 그날 현재 지급되지 않은 리스료와 무보증잔존가치의 현재가치 합계액으\n로 리스부채를 측정한다.\n④ 리스이용자는 단기리스와 소액 기초자산 리스에 대해 사용권자산과 리스부채를 인식하지 않기로 선\n택할 수 있다.", "answer": 3}], "20_현금흐름표": [{"year": "2024", "month": "1", "qnum": 38, "text": "[38]다음 중 각 거래의 현금흐름에 관한 설명으로 옳지 않은 것은?\n① 이자수취는 투자자산에 대한 수익으로 보아 투자활동 현금흐름으로 분류할 수 있다.\n② 배당금지급은 재무자원을 획득하는 원가로 보아 재무활동 현금흐름으로 분류할 수 있다.\n③ 이자지급은 재무자원을 획득하는 원가로 보아 재무활동 현금흐름으로 분류할 수 있다.\n④ 배당금수취는 재무자원에 대한 수익으로 보아 재무활동 현금흐름으로 분류할 수 있다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 38, "text": "[38]다음 중 현금흐름표상 투자활동 현금흐름으로 구분할 수 있는 항목으로 옳지 않은 것은?\n① 지분상품의 취득으로 인한 현금흐름\n② 배당금 수입으로 인한 현금흐름\n③ 배당금의 지급으로 인한 현금흐름\n④ 이자수입으로 인한 현금흐름", "answer": 3}, {"year": "2024", "month": "5", "qnum": 38, "text": "[38]현금흐름표의 작성방법에는 직접법과 간접법이 있다. 다음 중 현금흐름표의 작성방법에 관한 설명으로\n옳은 것은?\n① 간접법은 현금흐름을 개별 항목별로 파악할 수 있기 때문에 거래유형별 현금흐름의 내용을 쉽게 파\n악할 수 있다.\n② 간접법은 당기순이익과 영업활동으로 인한 현금흐름과의 차이를 명확하게 보여준다.\n③ , "answer": 4}, {"year": "2024", "month": "12", "qnum": 38, "text": "[38]다음 중 현금흐름표에 관한 설명으로 옳지 않은 것은?\n① 직접법을 적용하여 표시한 영업활동 현금흐름은 간접법에 의한 영업활동 현금흐름에서는 파악할 수\n없는 정보를 제공하기 때문에 미래현금흐름을 추정하는데 보다 유용한 정보를 제공한다.\n② 영업활동은 기업의 주요 수익창출활동, 그리고 투자활동이나 재무활동이 아닌 기타의 활동을 말한\n다.\n③ 투자활동은 유ㆍ무형자산, 지분상품이나 채무상품 등의 발행과 상환활동, 제3자에 대한 대여 및 회\n수활동 등을 포함한다.\n④ 현금흐름표는 회계기간 동안 발생한 현금흐름을 영업활동, 투자활동 및 재무활동으로 분류하여 보고\n한다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 40, "text": "[40]㈜삼일의 20X1년 재무제표 관련 자료를 이용하여 현금흐름표에 보고될 간접법에 의한 영업활동현금흐름\n을 계산하면 얼마인가(단, 이자의 지급은 재무활동으로 분류한다)?\n당기순이익 20,000원 감가상각비 4,600원\n매출채권의 증가 15,000원 재고자산의 감소 2,500원\n매입채무의 증가 10,400원 유형자산처분손실 2,400원\n사채상환이익 4,000원 이자비용 100원\n① 20,100원\n② 20,900원\n③ 21,000원\n④ 22,500원\n\n< 세무회계 >", "answer": 3}, {"year": "2025", "month": "1", "qnum": 39, "text": "[39]다음 중 현금흐름표에 관한 설명으로 옳지 않은 것은?\n① 현금흐름표는 영업활동에 관한 정보뿐만 아니라 투자활동 및 재무활동에 관한 정보도 제공한다.\n② 한국채택국제회계기준은 영업활동현금흐름에 대해 간접법은 인정하지만, 직접법은 인정하지 않고 있\n다.\n③ 이자와 배당금의 수취 및 지급에 따른 현금흐름은 각각 별도로 공시한다.\n④ 현금흐름표상 현금및현금성자산은 보유현금과 요구불예금 및 현금성자산을 말한다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 40, "text": "[40]다음은 ㈜삼일의 20X1년 영업활동에 관련된 자료이다. 20X1년 12월 31일로 종료되는 회계연도에 ㈜삼\n일의 현금흐름표에 보고된 영업활동 현금흐름이 10,000,000원 유입일 경우 포괄손익계산서의 당기순이\n익은 얼마인가(단, 상기 자료 이외에 간접법으로 현금흐름표 작성 시 고려할 사항은 없다고 가정한다)?\n· 매출채권의 증가 3,000,000원\n· 매입채무의 감소 2,500,000원\n· 감가상각비 1,000,000원\n· 유형자산처분이익 500,000원\n① 13,000,000원\n② 14,000,000원\n③ 15,000,000원\n④ 16,000,000원\n\n< 세무회계 >\nü 자료에서 제시한 것 외의 사항은 고려하지 않고 답한다. 예를 들어, 중소기업에 대한 언급이 없으면 중소\n기업 관련 효과는 고려하지 않는다.\nü 별도 언급이 없는 한 2024년 세법을 적용한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 38, "text": "[38]현금흐름표의 작성방법에는 직접법과 간접법이 있다. 다음 중 현금흐름표의 작성방법에 관한 설명으로\n옳은 것은?\n① 간접법은 현금흐름을 개별항목별로 파악할 수 있기 때문에 거래유형별 현금흐름의 내용을 쉽게 파악\n할 수 있다.\n② 직접법은 당기순이익과 영업활동으로 인한 현금흐름과의 차이를 명확하게 보여준다.\n③ 간접법으로 영업활동현금흐름을 작성하더라도 이자 및 배당금수취, 이자 및 배당금지급, 법인세 납\n부는 직접법을 적용한 것처럼 별도로 표시해야 한다.\n④ 직접법과 간접법은 영업활동뿐만 아니라 투자활동 및 재무활동도 현금흐름표상의 표시방법이 다르\n다.", "answer": 3}, {"year": "2025", "month": "6", "qnum": 38, "text": "[38]다음은 특정 현금흐름을 영업활동, 투자활동 및 재무활동과 짝지은 것이다. 잘못 짝지어진 것은 어느\n것인가?\n① 리스부채의 상환 - 재무활동\n② 재고자산의 취득 - 투자활동\n③ 단기매매금융자산의 취득 - 영업활동\n④ 단기차입금의 상환 - 재무활동", "answer": 2}, {"year": "2025", "month": "7", "qnum": 38, "text": "[38]다음 중 현금흐름표에 관한 설명으로 옳지 않은 것은?\n① 현금흐름표는 기업의 현금흐름을 나타내는 재무제표로서 현금의 변동내용을 명확하게 보고하기 위하\n여 당해 회계기간에 속하는 현금의 유입과 유출내용을 적정하게 표시하는 보고서이다.\n② 현금흐름표에서는 기업의 경영활동에 따른 현금흐름을 영업활동·투자활동·재무활동으로 구분한다.\n③ 현금흐름표를 작성하는 방법은 영업활동 현금흐름을 어떻게 계산하느냐에 따라 간접법과 직접법으로\n구분된다.\n④ 법인세로 인한 현금흐름은 영업활동과 투자활동에 명백히 관련되지 않는 한 재무활동 현금흐름으로\n분류한다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 39, "text": "[39]㈜삼일의 20X1년 재무제표 관련 자료를 이용하여 현금흐름표에 보고될 간접법에 의한 영업활동현금흐름\n을 계산하면 얼마인가?\n당기순이익 20,000원 감가상각비 4,600원\n매출채권의 증가 15,000원 재고자산의 감소 2,500원\n매입채무의 증가 10,400원 유형자산처분이익 2,400원\n① 20,100원\n② 21,000원\n③ 22,500원\n④ 24,900원", "answer": 1}, {"year": "2025", "month": "7", "qnum": 40, "text": "[40]㈜삼일의 20X1년 매출액은 100,000원이고 대손상각비로 5,000원을 계상하였다. 다음의 자료를 이용하\n여 ㈜삼일의 매출로 인한 현금유입액을 계산하면 얼마인가?\n구 분 20X1년 1월 1일 20X1년 12월 31일\n매출채권 10,000원 30,000원\n대손충당금 3,000원 8,000원\n① 80,000원\n② 87,000원\n③ 89,000원\n④ 91,000원\n\n< 세무회계 >\nü 자료에서 제시한 것 외의 사항은 고려하지 않고 답한다. 예를 들어, 중소기업에 대한 언급이 없으면 중소\n기업 관련 효과는 고려하지 않는다.\nü 별도 언급이 없는 한 2025년 세법을 적용한다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 39, "text": "[39]다음 중 현금흐름표상에서 현금흐름의 활동구분에 관한 설명으로 옳지 않은 것은?\n① 이자수입 및 배당금수입은 영업활동 현금흐름 또는 투자활동 현금흐름으로 분류한다.\n② 이자지급 및 배당금지급은 영업활동 현금흐름 또는 재무활동 현금흐름으로 분류한다.\n③ 법인세로 인한 현금흐름은 재무활동과 투자활동에 명백히 관련되지 않는 한 영업활동 현금흐름으로\n분류한다.\n④ 외화로 표시된 현금및현금성자산의 환율변동효과는 영업활동 현금흐름 또는 재무활동 현금흐름으로\n분류한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 38, "text": "[38]다음 중 제조업을 영위하는 ㈜삼일의 현금흐름표상 활동의 구분이 다른 하나는?\n① 원재료의 구입에 따른 현금유출\n② 재화의 판매와 용역의 제공에 따른 현금유입\n③ 차입금의 상환에 따른 현금유출\n④ 종업원과 관련하여 간접적으로 발생하는 현금유출", "answer": 3}, {"year": "2025", "month": "11", "qnum": 39, "text": "[39]아래에 제시된 ㈜삼일의 재무제표 관련 자료만을 이용하여 영업활동현금흐름을 계산하면 얼마인가(단,\n㈜삼일은 이자수취를 투자활동으로 분류하고 있다)?\n항목 금액 항목 금액\n당기순이익 200,000원 매출채권 감소 15,000원\n이자수익 20,000원 매입채무 증가 12,000원\n사채상환이익 35,000원 미수이자 증가 6,000원\n① 142,000원\n② 172,000원\n③ 192,000원\n④ 227,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 38, "text": "[38]다음 중 현금흐름표에 관한 설명으로 옳지 않은 것은?\n① 현금흐름표는 기업의 현금흐름을 나타내는 표로서 현금의 변동내용을 명확하게 보고하기 위하여 당\n해 회계기간에 속하는 현금의 유입과 유출내용을 적정하게 표시하는 보고서이다.\n② 법인세로 인한 현금흐름은 영업활동과 재무활동에 명백히 관련되지 않는 한 투자활동 현금흐름으로\n분류한다.\n③ 현금흐름표에서는 기업의 경영활동에 따른 현금흐름을 영업활동·투자활동·재무활동으로 구분한다.\n④ 현금흐름표를 작성하는 방법은 영업활동 현금흐름을 어떻게 계산하느냐에 따라 간접법과 직접법으로\n구분된다.", "answer": 2}], "08_충당부채": [{"year": "2024", "month": "3", "qnum": 20, "text": "[20]다음 중 충당부채에 관한 설명으로 옳지 않은 것은?\n① 미래의 예상 영업손실은 부채의 정의에 부합하지 못할 뿐 아니라 충당부채의 인식기준도 충족하지\n못하기 때문에 충당부채로 인식하지 않는다.\n② 계약상의 의무에 따라 발생하는 회피 불가능한 원가가 당해 계약 때문에 받을 것으로 기대되는 경제\n적 효익을 초과하는 계약을 체결한 경우에는 관련된 현재의무를 충당부채로 인식한다.\n③ 입법 예고된 법률의 세부 사항이 아직 확정되지 않은 경우에는 해당 법안대로 제정될 것이 거의 확\n실한 경우에도 충당부채를 인식할 수 없다.\n④ 충당부채의 화폐의 시간가치 영향이 중요한 경우에는 의무를 이행하기 위하여 예상되는 지출액의 현\n재가치로 평가한다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 20, "text": "[20]㈜삼일은 제조상의 결함이나 하자에 대하여 1년간 제품보증을 시행하고 있다. 20X1년 7월 1일에 판매\n된 5,000,000원의 제품에서 중요하지 않은 결함이 발견된다면 70,000원의 수리비용이 발생하고, 치명\n적인 결함이 발생하면 200,000원의 수리비용이 발생할 것으로 예상한다. 20X1년 7월 1일의 매출액\n5,000,000원에 대하여 판매된 제품의 80 % 에는 하자가 없을 것으로 예상하고, 제품의 15 % 는 중요하\n지 않은 결함이 발견될 것으로 예상하며, 5 % 는 치명적인 결함이 있을 것으로 예상하였다. ㈜삼일이\n20X1년 말에 인식할 충당부채의 금액은 얼마인가(단, 20X1년에는 결함이나 하자가 발생하지 않았다)?\n① 10,000원\n② 10,500원\n③ 13,500원\n④ 20,500원", "answer": 4}, {"year": "2024", "month": "6", "qnum": 20, "text": "[20]다음 중 충당부채 및 우발부채 등에 관한 설명으로 옳지 않은 것은?\n① 과거사건에 의하여 발생하였으나, 기업이 전적으로 통제할 수는 없는 하나 이상의 불확실한 미래사\n건의 발생 여부에 의하여서만 그 존재가 확인되는 잠재적 의무는 충당부채에 해당하지 않는다.\n② 과거사건에 의하여 발생한 현재의무로서 그 의무를 이행하기 위하여 경제적효익을 갖는 자원이 유출\n될 가능성이 높은 경우에는 금액의 신뢰성 있는 추정가능 여부와 관계없이 충당부채를 인식하여야\n한다.\n③ 우발부채는 부채로 인식하지 않고, 유형별로 그 성격을 주석에 설명하는 것이 원칙이지만, 당해 의\n무를 이행하기 위하여 자원이 유출될 가능성이 희박한 경우에는 주석기재를 생략할 수 있다.\n④ 우발자산은 자산으로 인식하지 아니하고, 자원이 유입될 것이 확정된 경우에는 그러한 상황변화가\n발생한 기간에 관련 자산과 이익을 인식한다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 20, "text": "[20]다음 중 충당부채의 회계처리에 관한 설명으로 옳은 것은?\n① 미래의 예상 영업손실은 충당부채로 인식하지 아니한다.\n② 충당부채의 명목금액과 현재가치의 차이가 중요한 경우에도 현재가치로 평가하지 않는다.\n③ 충당부채로 인식하는 금액은 현재의무의 이행에 소요되는 지출에 대한 보고기간말 현재의 최선의 추\n정치이어야 하며 이 경우 관련된 사건과 상황에 대한 불확실성은 고려하지 않는다.\n④ 충당부채란 과거사건이나 거래의 결과에 의한 현재의무로서 그 의무를 이행하기 위하여 자원이 유출\n될 가능성이 높고 지출 금액이 불확실하지만, 지출 시기는 확정되어 있는 의무를 의미한다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 20, "text": "[20]다음 중 충당부채로 인식될 수 있는 사례로 옳지 않은 것은(단, 해당 의무를 이행하기 위하여 필요한\n금액을 신뢰성 있게 추정할 수 있다고 가정한다)?\n① 오염된 토지를 정화하여야 한다는 법규가 아직 제정되지 않았으나, 법룰제정이 거의 확실한 경우\n② 제품에 대해 만족하지 못하는 고객에게 법적의무가 없음에도 불구하고 환불해주는 정책을 펴고 있으\n며, 고객에게 이 사실이 널리 알려져 있는 경우\n③ 회사의 소비자 소송사건에 대하여 패소가능성이 높다는 법률전문가의 의견이 있는 경우\n④ 사업부를 매각하였으나 아직 구조조정에 대한 공식적이며 구체적인 계획이 없는 경우", "answer": 4}, {"year": "2024", "month": "11", "qnum": 20, "text": "[20]㈜삼일은 제조상의 결함이나 하자에 대하여 1년간 제품보증을 시행하고 있다. 20X1년 7월 1일에 판매\n된 5,000,000원의 제품에서 중요하지 않은 결함이 발견된다면 70,000원의 수리비용이 발생하고, 치명\n적인 결함이 발생하면 140,000원의 수리비용이 발생할 것으로 예상한다. 20X1년 7월 1일의 매출액\n5,000,000원에 대하여 판매된 제품의 80 % 에는 하자가 없을 것으로 예상하고, 제품의 15 % 는 중요하\n지 않은 결함이 발견될 것으로 예상하고, 5 % 는 치명적인 결함이 있을 것으로 예상하였다. ㈜삼일이\n20X1년 말에 인식할 제품보증충당부채의 금액은 얼마인가(단, 20X1년에는 결함이나 하자가 발생하지\n않았다)?\n① 7,500원\n② 10,000원\n③ 17,500원\n④ 20,500원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 20, "text": "[20]다음 중 손실부담계약에 관한 설명으로 옳지 않은 것은?\n① 손실부담계약을 체결한 경우에는 관련된 현재의 의무를 충당부채로 인식한다.\n② 손실부담계약은 계약상 의무에 따른 회피 불가능한 원가가 당해 계약에 의하여 받을 것으로 기대되\n는 경제적 효익을 초과하는 계약을 뜻한다.\n③ 손실이 예상되는 확정매입계약은 손실부담계약이 될 수 없다.\n④ 회피 불가능한 원가는 계약을 이행하기 위하여 필요한 원가와 계약을 이행하지 못하였을 때 지급하\n여야 할 보상금 중 작은 금액이다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 20, "text": "[20]다음 중 충당부채 및 우발부채에 관한 설명으로 옳지 않은 것은?\n① 충당부채는 지출하는 시기 또는 금액이 불확실한 부채를 말한다.\n② 충당부채를 인식하기 위해서는 과거에 사건이나 거래가 발생하여 현재의무가 존재하여야 한다.\n③ 충당부채를 설정하는 의무에는 법적의무가 포함되지만, 의제의무는 포함되지 않는다.\n④ 충당부채의 화폐의 시간가치 영향이 중요한 경우에는 의무를 이행하기 위하여 예상되는 지출액의 현\n재가치로 평가한다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 20, "text": "[20]다음 중 충당부채의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 미래의 예상 영업손실은 충당부채로 인식하지 아니한다.\n② 충당부채의 명목금액과 현재가치의 차이가 중요한 경우에는 현재가치로 평가한다.\n③ 충당부채를 발생시킨 사건과 밀접하게 관련된 자산의 처분이익이 예상되는 경우에 당해 처분이익을\n충당부채 금액을 측정하는데 고려한다.\n④ 현재의무를 이행하기 위하여 소요되는 지출 금액에 영향을 미치는 미래사건이 발생할 것이라는 충분\n하고 객관적인 증거가 있는 경우에는 그러한 미래사건을 감안하여 금액을 추정한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 20, "text": "[20]전자제품을 판매하는 ㈜삼일은 20X1년에 판매한 제품들부터 확신유형의 보증으로 판매 후 1년간 판매\n한 제품에서 발생하는 결함을 무상으로 수리해주고 있다. 과거의 판매경험에 의하면 제품보증비용은 매\n출액의 5 % 가 발생할 것으로 예상된다. ㈜삼일의 20X1년 매출액이 200억원이고 20X1년 중 발생된 제\n품보증비가 7억원인 경우, 20X1년말 재무상태표에 표시할 제품보증충당부채는 얼마인가?\n① 0억원\n② 3억원\n③ 7억원\n④ 10억원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 20, "text": "[20]㈜삼일은 제조상의 결함이나 하자에 대하여 1년간 제품보증을 시행하고 있다. 20X1년 7월 1일에 판매\n된 5,000,000원의 제품에서 중요하지 않은 결함이 발견된다면 70,000원의 수리비용이 발생하고, 치명\n적인 결함이 발생하면 140,000원의 수리비용이 발생할 것으로 예상한다. 20X1년 7월 1일의 매출액\n5,000,000원에 대하여 판매된 제품의 85 % 에는 하자가 없을 것으로 예상하고, 제품의 10 % 는 중요하\n지 않은 결함이 발견될 것으로 예상하고, 5 % 는 치명적인 결함이 있을 것으로 예상하였다. ㈜삼일이\n20X1년 말에 인식할 제품보증충당부채의 금액은 얼마인가(단, 20X1년에는 결함이나 하자가 발생하지\n않았다)?\n① 7,000원\n② 14,000원\n③ 17,500원\n④ 21,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 20, "text": "[20]다음 중 충당부채 및 우발부채, 우발자산에 관한 설명으로 옳지 않은 것은?\n① 충당부채를 인식하기 위해서는 과거에 사건이나 거래가 발생하여 현재의무가 존재하여야 한다.\n② 충당부채를 설정하는 의무에는 법적의무 또는 의제의무가 포함된다.\n③ 우발자산은 경제적효익의 유입가능성이 높고, 금액을 신뢰성 있게 추정할 수 있다면 재무제표에 자\n산으로 인식한다.\n④ 우발부채는 재무제표에 인식하지 않으며 의무를 이행하기 위하여 경제적효익이 있는 자원을 유출할\n가능성이 희박하지 않다면 주석으로 공시한다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 20, "text": "[20]㈜삼일은 20X1년 결산 중 다음과 같은 이슈들을 확인하였다. 다음 중 20X1년 말 현재 충당부채로 인식\n하여할 항목으로 옳은 것은(단, 해당의무를 이행하기 위하여 필요한 금액을 신뢰성 있게 추정할 수 있\n다고 가정한다)?\n① ㈜삼일은 20X2년 중 사업부를 매각할 계획이지만 20X1년 말 현재 구조조정에 대한 공식적이며 구체\n적인 계획은 없다.\n② ㈜삼일은 20X2년에 영업손실이 발생할 것으로 예상하고 있다.\n③ ㈜삼일은 20X1년 12월 1일 기자회견을 열어 공장시설에 인접한 호수에 예기치 않은 오염이 발생한\n것과 관련하여 이를 정화하겠다고 발표하였다.\n④ 미래 반복적으로 발생할 것으로 예상되는 대기오염을 막기 위하여 ㈜삼일의 공장과 설비에 대한 대\n규모 보수가 요구된다.", "answer": 3}, {"year": "2025", "month": "11", "qnum": 20, "text": "[20]다음 중 충당부채에 관한 설명으로 옳지 않은 것은?\n① 충당부채를 인식하기 위해서는 과거에 사건이나 거래가 발생하여 현재 의무가 존재하 변경인지 회계추정치의 변경인지 구분하는 것이 어려운 경우에는 이를 회계\n추정치의 변경으로 본다.\n④ 중요한 전기오류를 수정할 경우에는 과거에 보고된 비교표시 재무제표를 수정한다.", "answer": 2}], "15_지분법(관계기업투자)": [{"year": "2024", "month": "3", "qnum": 33, "text": "[33]20X1년 초 ㈜삼일은 ㈜한양의 보통주 40 % 를 800,000원에 취득하여 유의적인 영향력을 행사하게 되었\n다. 주식취득일 현재 ㈜한양의 순자산장부금액은 2,000,000원으로 공정가치와 동일하였다. ㈜한양의\n20X1년 당기순이익이 300,000원이며, 기타포괄이익이 100,000원이라 할 때 20X1년 말 ㈜삼일의 재무\n상태표에 기록될 관계기업투자주식(지분법적용투자주식)의 장부금액은 얼마인가?\n① 860,000원\n② 880,000원\n③ 920,000원\n④ 960,000원", "answer": 4}, {"year": "2024", "month": "3", "qnum": 34, "text": "[34]다음 중 지분법 회계처리에 관한 설명으로 옳지 않은 것은?\n① 투자회사가 수취하는 배당금 금액은 관계기업투자주식의 장부금액을 감소시킨다.\n② 관계기업투자주식의 장부금액이 ‘영(0)’ 이하가 될 경우 지분변동액에 대한 인식을 중지한다.\n③ 영업권은 상각하지 않는다.\n④ 염가매수차익이 발생하는 경우 취득한 기간의 기타포괄손익에 포함한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 33, "text": "[33]다음 중 지분법 회계처리에 관한 설명으로 옳지 않은 것은?\n① 지분법은 취득시점에서 관계기업투자주식을 공정가치로 기록한다.\n② 관계기업투자주식의 장부금액에 포함된 영업권은 별도로 표시하지 않는다.\n③ 피투자회사의 당기순이익 중 투자회사의 지분에 해당하는 금액은 투자회사의 지분법이익으로 보고된\n다.\n④ 투자자와 관계기업 사이의 내부거래에서 발생한 당기손익에 대하여 투자자는 그 관계기업에 대한 투\n자지분과 무관한 손익까지만 투자자의 재무제표에 인식한다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 34, "text": "[34]20X1년 초 ㈜삼일은 ㈜한양의 보통주 30 % 를 500,000원에 취득하여 유의적인 영향력을 행사하게 되었\n다. 주식취득일 현재 ㈜한양의 순자산장부금액은 2,000,000원으로 공정가치와 동일하였다. ㈜한양의\n20X1년 당기순이익이 300,000원이라 할 때 상기 관계기업투자 관련 회계처리가 ㈜삼일의 20X1년 당기\n순이익에 미치는 영향은 얼마인가?\n① 90,000원 손실\n② 190,000원 손실\n③ 90,000원 이익\n④ 190,000원 이익", "answer": 4}, {"year": "2024", "month": "6", "qnum": 33, "text": "[33]다음 중 지분법에 관한 설명으로 옳지 않은 것은?\n① 투자자가 직접 또는 간접으로 피투자자에 대한 의결권의 20 % 이상을 소유하고 있다면 명백한 반증\n이 없는 한 유의적인 영향력이 있는 것으로 본다.\n② 기업이 해당 피투자자에 대하여 유의적인 영향력이 있는지 여부를 평가할 때에는 다른 기업이 보유\n한 잠재적 의결권도 고려한다.\n③ 투자자의 보고기간종료일과 관계기업의 보고기간종료일이 다른 경우, 관계기업은 투자자의 재무제표\n와 동일한 보고기간종료일의 재무제표를 재작성한다.\n④ 지분법을 적용하는 경우, 관계기업으로부터 수취한 배당금은 배당금수익으로 인식한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 34, "text": "[34]㈜삼일은 20X1년 초에 ㈜용산의 주식 25 % 를 1,000,000원에 취득하면서 유의적인 영향력을 행사할 수\n있게 되었다. 취득일 현재 ㈜용산의 순자산 장부금액은 4,000,000원이며, 자산 및 부채의 장부금액은\n공정가치와 동일하다. 득일 현재 ㈜한양의 순자산장부금액은 2,000,000원으로 공정가치와 동일하였다. ㈜한양의\n20X1년 당기순이익이 300,000원이며, 기타포괄이익이 200,000원이라 할 때 20X1년 말 ㈜삼일의 재무\n상태표에 기록될 관계기업투자주식(지분법적용투자주식)의 장부금액은 얼마인가?\n① 860,000원\n② 880,000원\n③ 920,000원\n④ 1,000,000원", "answer": 4}, {"year": "2025", "month": "9", "qnum": 33, "text": "[33]다음 중 관계기업투자주식의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 유의적인 영향력의 판단에는 지분율 기준과 실질 영향력 기준이 있다.\n② 유의적인 영향력이란 피투자자의 재무정책과 영업정책에 관한 의사결정에 참여할 수 있는 능력을 말\n한다.\n③ 실질 영향력 기준이 적용되지 않을 경우로서 투자자가 직접 또는 간접으로 피투자자에 대한 의결권\n의 20 % 미만을 소유하고 있다면 유의적인 영향력이 없는 것으로 본다.\n④ 유의적인 영향력을 행사할 수 있는 경우에도 12개월 이내에 매각할 목적으로 투자주식을 취득하여\n적극적으로 매수자를 찾고 있는 경우에 해당하는 투자주식은 당기손익-공정가치 측정 금융자산으로\n분류한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 33, "text": "[33]다음 중 관계기업투자 및 지분법회계처리에 관한 설명으로 옳지 않은 것은?\n① 지분율 20 % 미만을 보유하는 경우에도 투자자와 피투자자 간에 경영진의 상호교류가 이루어지는 경\n우 유의적인 영향력이 존재할 수 있다.\n② 투자자의 보고기간 종료일과 관계기업의 보고기간 종료일이 다른 경우, 지분법을 적용하기 위해서는\n원칙적으로 관계기업은 투자자의 재무제표와 동일한 보고기간 종료일의 재무제표를 재작성한다.\n③ 지분법을 적용하는 투자자가 관계기업으로부터 수취하는 배당금은 관계기업투자주식에서 직접 차감\n한다.\n④ 지분법을 적용하는 투자자와 관계기업 사이의 상향거래나 하향거래에서 발생한 당기손익에 대하여\n투자자는 그 관계기업에 대한 투자지분과 관련된 손익까지만 투자자의 재무제표에 인식한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 34, "text": "[34]20X1년초 ㈜삼일은 ㈜한양의 보통주 40 % 를 800,000원에 취득하여 유의적인 영향력을 행사하게 되었\n다. 주식취득일 현재 ㈜한양의 순자산장부금액은 2,000,000원으로 공정가치와 동일하였다. ㈜한양은\n20X1년 중 중간배당으로 100,000원을 지급하였고, ㈜삼일은 이 중 40,000원을 수령하였다. ㈜한양의\n20X1년 당기순이익이 300,000원이며, 총포괄이익이 500,000원이라 할 때 20X1년 말 ㈜삼일의 재무상\n태표에 기록될 관계기업투자주식(지분법적용투자주식)의 장부금액은 얼마인가?\n① 860,000원\n② 880,000원\n③ 920,000원\n④ 960,000원", "answer": 4}, {"year": "2025", "month": "12", "qnum": 33, "text": "[33]다음 중 관계기업투자주식의 회계처리에 관한 설명으로 옳지 않은 것은?\n① 유의적인 영향력을 판단할 때에는 투자자가 아닌 다른기업이 보유한 잠재적 의결권도 함께 고려하여\n야 한다.\n② 유의적인 영향력을 판단함에 있어 피투자자에 대한 의결권은 투자자의 지분율과 관계기업이나 공동\n기업이 보유하고 있는 지분율의 단순합계로 계산한다.\n③ 투자자가 직접 또는 간접으로 피투자자에 대한 의결권의 20 % 이상을 소유하고 있다면 유의적인 영\n향력이 있는 것으로 본다.\n④ 유의적인 영향력의 판단기준에는 지분율 기준과 실질 영향력 기준이 있다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 34, "text": "[34]20X1년 초에 ㈜삼일은 ㈜용산의 주식 30 % 를 1,000,000원에 취득하면서 ㈜용산에 대해 유의적인 영향\n력을 갖게 되었다. 20X1년 초 ㈜용산의 순자산 장부금액은 2,000,000원이었으며, 건물을 제외한 자산\n과 부채에 대해서는 공정가치와 장부금액이 일치하였다. 동 건물의 공정가치는 장부금액보다 200,000원\n높게 평가되었으며, 잔존내용연수 10년, 잔존가치 0원, 정액법으로 감가상각하고 있다. ㈜용산의 20X1\n년 당기순이익이 300,000원일 경우, ㈜삼일의 20X1년 말 재무제표상 관계기업투자주식의 장부금액은\n얼마인가?\n① 98,000원\n② 1,078,000원\n③ 1,084,000원\n④ 1,090,000원", "answer": 3}], "16_연결회계": [{"year": "2024", "month": "12", "qnum": 5, "text": "[5] 다음 중 특수관계자 공시에 관한 설명으로 옳지 않은 것은?\n① 보고기업에 유의적인 영향력을 행사할 수 있는 개인은 보고기업과 특수관계에 있다.\n② 최상위 지배자와 지배기업이 다른 경우에는 최상위 지배자의 명칭도 공시한다.\n③ 주요 경영진에 대한 보상의 총액과 각 분류별 금액을 공시한다.\n④ 지배기업과 그 종속기업 사이의 관계는 거래가 없을 경우 공시를 생략할 수 있다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 5, "text": "[5]다음 중 기업과 특수관계에 있는 대상으로 옳지 않은 것은?\n① 당해 기업의 관계기업\n② 당해 기업의 주요 경영진\n③ 당해 기업의 주요 매입처\n④ 당해 기업의 지배기업 및 종속기업", "answer": 3}, {"year": "2025", "month": "12", "qnum": 5, "text": "[5]다음 중 특수관계자 공시에 관한 설명으로 옳지 않은 것은?\n① 지배기업과 그 종속기업 사이의 관계는 거래의 유무에 관계없이 공시하며, 기업은 지배기업의 명칭을\n공시한다.\n② 기업의 최상위 지배자와 지배기업이 다른 경우에는 최상위 지배자의 명칭도 공시하여야 한다.\n③ 기업의 재무제표에 미치는 특수관계자거래의 영향을 파악하기 위하여 분리하여 공시할 필요가 있는\n경우를 제외하고는 성격이 유사한 항목은 통합하여 공시할 수 있다.\n④ 특수관계자와의 거래가 독립된 당사자 사이의 거래 조건에 따라 거래가 이루어졌음을 입증할 수 있는\n경우에는 해당 특수관계자 거래를 공시하지 않는다.", "answer": 4}], "14_주당이익": [{"year": "2025", "month": "6", "qnum": 32, "text": "[32]다음 중 희석주당이익에 관한 설명으로 옳지 않은 것은?\n① 희석주당이익은 실제 발행된 보통주뿐만 아니라 보통주로 전환될 수 있는 잠재적 보통주까지 감안하\n여 산출한 주당이익을 말한다.\n② 잠재적 보통주는 모두 희석주당이익을 계산할 때 고려하는 것이 아니라 희석효과가 있는 경우에만\n그 영향을 고려한다.\n③ 희석성 잠재적 보통주는 기초에 전환 또는 행사된 것으로 본다. 다만, 당해 희석성 잠재적 보통주의\n발행일이 당기 중인 경우에는 그 발행일을 기준으로 희석성 잠재적 보통주의 주식수에 포함한다.\n④ 희석성 잠재적 보통주의 전환이나 행사 등으로 발행되는 주식수는 희석성 잠재적 보통주를 발행한\n기업에게 가장 유리한 전환비율 또는 행사가격을 이용하여 계산한다.", "answer": 4}]}, "세무회계": {"07_부가가치세법": [{"year": "2024", "month": "1", "qnum": 41, "text": "[41]다음 중 조세의 분류에 관한 설명으로 옳지 않은 것은?\n① 조세는 과세권자에 따라 국세와 지방세로 분류한다.\n② 농어촌특별세는 조세의 사용용도가 특정된 목적세에 해당한다.\n③ 소득세는 납세자의 인적사항이 고려되는 인세(人稅)에 해당한다.\n④ 부가가치세는 입법상 조세부담의 전가를 예상하지 아니한 직접세에 해당한다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되지 않는 금액은 얼마인가?\nㄱ. 전기에 손금에 산입된 종합부동산세 환급액 4,000,000원\nㄴ. 자산수증이익(이월결손금 보전에 사용되지 않음) 5,000,000원\nㄷ. 자기주식의 양도가액 3,000,000원\nㄹ. 부가가치세 매출세액 2,000,000원\nㅁ. 특수관계인으로부터 자본거래로 분여받은 이익 6,000,000원\n① 2,000,000원\n② 5,000,000원\n③ 11,000,000원\n④ 17,000,000원", "answer": 1}, {"year": "2024", "month": "1", "qnum": 61, "text": "[61]다음 중 소득세법에 관한 설명으로 옳은 것은?\n① 소득세법은 포괄주의에 의하므로 과세대상이 아닌 것으로 열거된 것을 제외한 모든 소득을 과세한\n다.\n② 개인별 소득을 기준으로 과세하는 개인단위과세제도를 원칙으로 하나, 부부인 경우에는 합산과세한\n다.\n③ 신규사업자는 사업개시일부터 12 월 31 일까지의 기간을 1 과세기간으로 한다.\n④ 소득세는 신고납세제도를 채택하고 있으므로 납세의무자는 과세기간에 대한 확정신고기간에 과세표\n준확정신고를 함으로써 소득세가 확정된다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 71, "text": "[71]다음 중 부가가치세법에 대하여 옳은 주장을 하는 사람은 누구인가?\n① 김영희 : 부가가치세가 과세되는 재화란 재산 가치가 있는 유체물을 말한다. 따라서 동력이나 열과\n같은 무체물은 부가가치세 과세대상이 아니다.\n② 박철수 : 우리나라의 부가가치세 제도는 전단계거래액공제법을 채택하고 있다.\n③ 최소영 : 재화의 수입은 수입자가 사업자인 경우에만 부가가치세가 과세된다. 따라서 사업자가 아닌\n개인이 재화를 수입하는 경우에는 부가가치세가 과세되지 않는다.\n④ 정예은 : 간접세에 대한 국제적 중복과세의 문제를 해결하기 위하여 수입국에서만 간접세를 과세할\n수 있도록 소비지국과세원칙을 채택하고 있다.", "answer": 4}, {"year": "2024", "month": "1", "qnum": 72, "text": "[72]다음 중 부가가치세법상 사업자와 관련된 설명으로 옳지 않은 것은?\n① 사업자는 면세사업자와 과세사업자로 구분된다.\n② 비영리법인은 공익적인 사업을 하므로 부가가치세 납세의무가 없다.\n③ 영세율을 적용받는 사업자도 부가가치세법상의 사업자 등록의무가 있다.\n④ 과세사업과 면세사업을 겸영하는 자를 겸영사업자라 하며, 겸영사업자도 부가가치세 납세의무가 있\n다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 계속사업자인 간이과세자의 과세기간은 1월 1일부터 12월 31일까지이다.\n② 일반과세자가 간이과세자로 변경되는 경우 과세유형이 변경되는 해에 간이과세 규정이 적용되는 기\n간은 그 변경 이후 7월 1일부터 12월 31일까지이다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에는 사업개시일부터 신청일이 속하는 과세\n기간의 종료일까지를 최초 과세기간으로 한다.\n④ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 3}, {"year": "2024", "month": "1", "qnum": 74, "text": "[74]다음 중 부가가치세법의 주사업장 총괄납부에 관한 설명으로 옳지 않은 것은?\n① 법인은 지점 또는 분사무소를 주사업장으로 할 수 있다.\n② 총괄납부하려는 자는 주사업장총괄납부신청서를 총괄납부하고자 하는 과세기간 개시 25일 전에 주\n사업장 관할세무서장에게 제출하여야 한다.\n③ 주사업장 총괄납부에 따라 납부하던 사업자가 총괄납부 포기신고를 하면 각 사업장에서 납부가 가능\n하다.\n④ 주사업장 총괄납부하는 경우 사업자등록 및 과세표준의 신고는 각 사업장마다 이행하여야 한다.", "answer": 2}, {"year": "2024", "month": "1", "qnum": 75, "text": "[75]다음 중 부가가치세법상 과세대상에 해당하는 것은?\n① 수출신고가 수리된 물품으로서 선적되지 아니한 물품을 우리나라에서 인취하는 경우\n② 특수관계에 있지 않은 자에게 무상으로 음식용역을 공급하는 경우\n③ 상대방으로부터 인도받은 재화에 대해 주요자재를 일부 부담하고 가공하는 경우\n④ 사업을 위해 사용인에게 작업복을 제공하는 경우", "answer": 3}, {"year": "2024", "month": "1", "qnum": 76, "text": "[76]다음 중 부가가치세법상 재화와 용역의 공급시기에 관한 설명으로 옳지 않은 것은?\n① 수출재화의 공급 : 수출재화의 선(기)적일\n② 완성도기준지급조건부 판매 : 재화가 인도되거나 이용가능하게 되는 때\n③ 판매목적 타사업장 반출 : 재화를 반출하는 때\n④ 조건부판매 : 조건이 성취되어 판매가 확정된 때", "answer": 2}, {"year": "2024", "month": "1", "qnum": 77, "text": "[77]다음은 김삼일씨의 2024년 1월 가계부 지출내역이다. 지출금액에 포함된 부가가치세 합계를 계산하면\n얼마인가(단, 공급자는 부가가치세법에 따라 적법하게 부가가치세를 거래징수 하였다고 가정한다)?\n일 자 적 요 지 출 금 액\n1월 14일 바나나 구입 11,000원\n1월 21일 수도료 납부 22,000원\n1월 27일 택시요금 33,000원\n1월 30일 영화관람 44,000원\n① 3,000원\n② 7,000원\n③ 8,000원\n④ 10,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 78, "text": "[78]다음 자료를 바탕으로 ㈜삼일의 2024년 제1기 확정신고분 부가가치세 과세표준을 계산하면 얼마인가\n(단, 제시된 금액에는 부가가치세가 포함되어 있지 않다)?\n거래일자 거 래 내 용\n4월 2일 거래처 A에 외상매출한 제품 40,000,000원(원가 30,000,000원)\n4월 9일 4월 2일 거래처 A에 매출한 제품의 환입액 1,000,000원\n대가를 받지 아니하고 거래처 B에 증여한 견본품\n6월 5일\n(원가 400,000원, 시가 500,000원)\n매입세액 공제를 받은 후 거래처에 증정한 제품\n6월 12일\n(원가 2,000,000원, 시가 2,500,000원)\n① 41,000,000원\n② 41,500,000원\n③ 41,900,000원\n④ 42,000,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 79, "text": "[79]㈜용산은 의료제조업을 영위하는 중소기업이며 일반과세자이다. 다음 자료는 2024년 제1기 예정신고기\n간(2024년 1월 1일 ~ 2024년 3월 31일)에 공급받은 재화 및 용역의 거래내역이다. ㈜용산의 2024\n년 제1기 예정신고기간의 매입세액공제액으로 옳은 것은(단, 제시된 금액은 부가가치세가 포함되어 있\n지 않다)?\nŸ 국내거래처로부터 원단을 구입하고 공급가액 50,000,000원의 세금계산서를 수취하였다.\nŸ 업무무관자산의 도색비를 지출하면서 공급가액 2,000,000원의 세금계산서를 수취하였다.\nŸ 공급가액 5,000,000원(세금계산서 수취)에 구입한 재화를 거래처에 접대 목적으로 무상 증정\n하였다.\nŸ 생산직 직원들의 회식비로 공급가액 4,000,000원을 지출하고 세금계산서를 수취하였다.\n① 5,400,000원\n② 5,800,000원\n③ 6,000,000원\n④ 6,800,000원", "answer": 1}, {"year": "2024", "month": "1", "qnum": 80, "text": "[80]다음 중 부가가치세의 신고 및 납부, 환급에 관한 설명으로 옳지 않은 것은?\n① 모든 개인사업자는 각 예정신고기간 또는 과세기간이 끝난 후 25일 이내에 사업장 관할 세무서장에\n게 과세표준을 신고하고 세액을 자진납부하여야 한다.\n② 일반환급세액은 확정신고기한이 지난 후 30일 이내에 환급한다.\n③ 조기환급을 신청한 경우 환급세액은 신고기한이 지난 후 15일 이내에 환급받을 수 있다.\n④ 당해 과세기간 중 대손이 발생하였거나 대손금이 회수되었을 경우 확정신고시에 대손세액을 가감한\n다.\n\n< 원가관리회계 >", "answer": 1}, {"year": "2024", "month": "3", "qnum": 41, "text": "[41]다음 중 조세의 분류기준과 구분 및 조세항목을 연결한 것으로 옳지 않은 것은?\n분류기준 구분 조세항목\n국세 법인세, 재산세\n① 과세권자\n지방세 취득세, 주민세\n독립된 독립세 법인세, 부가가치세\n②\n세원 부가세 교육세\n과세물건의 종가세 부가가치세\n③\n측정단위 종량세 주정에 대한 주세\n조세부담의 직접세 법인세, 소득세\n④\n전가여부 간접세 부가가치세, 개별소비세", "answer": 1}, {"year": "2024", "month": "3", "qnum": 54, "text": "[54]다음 중 법인세법상 접대비(2024년부터는 기업업무추진비로 명칭이 변경됨)에 관한 설명으로 옳지 않은\n것은?\n① 골프장을 경영하는 법인이 그 고객이 조직한 임의단체(골프클럽)에 지급하는 금품은 접대비로 본다.\n② 접대비 관련 부가가치세 매입세액 불공제액은 접대비에 포함된다.\n③ 법인의 생산품 등으로 접대한 경우 접대비를 시가와 장부가액 중 큰 금액으로 평가한다.\n④ 광고∙선전목적으로 달력 등을 불특정다수인에게 기증한 것은 접대비로 본다.", "answer": 4}, {"year": "2024", "month": "3", "qnum": 59, "text": "[59]다음 중 법인세 과세표준 및 세액의 계산과 관련하여 옳은 주장을 하고 있는 사람은 누구인가?\n김부장: 내국법인의 2024년에 발생한 결손금은 향후 10년간 이월하여 공제받을 수 있습니다.\n이과장: 연구 및 인력개발비 세액공제는 최저한세 적용대상이며, 최저한세 적용으로 공제받지 못한\n세액공제는 향후 5년간 이월공제가 가능합니다.\n박차장: 내국법인이 사업연도 중 천재지변이나 그 밖의 재해로 법 소정 자산총액의 20 % 이상 상실\n하여 납세가 곤란하다고 인정되는 경우 재해손실 세액공제를 받을 수 있습니다.\n최사원: 내국법인이 재화를 3만원(부가가치세 포함)에 공급받고 신용카드 매출전표 등 법정지출증\n명서류를 수취하지 아니한 경우에는 가산세를 납부하여야 합니다.\n① 김부장\n② 이과장\n③ 박차장\n④ 최사원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳은 것은?\n① 부가가치세는 특정한 재화 또는 용역만 과세하는 개별소비세에 해당한다.\n② 모든 거래단계에서 창출된 부가가치에 대하여 각 단계별로 과세하는 다단계과세방법이다.\n③ 매출액에서 매입액을 차감하여 부가가치를 계산한 후 부가가치에 세율을 곱하는 방식으로 세액을 계\n산하는 전단계거래액공제법을 채택하고 있다.\n④ 국제적 이중과세의 문제를 해결하기 위하여 수출품에 대하여 부가가치세를 과세하지 않는 면세제도\n를 두고 있다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 72, "text": "[72]다음 부가가치세와 관련된 재경담당자들의 대화 내용 중 옳은 설명을 하고 있는 사람은 누구인가?\n김부장 : 부가가치세 납세의무자인 개인사업자는 1년에 네 번 부가가치세를 신고하는 것이\n원칙입니다.\n이차장 : 주된 사업장에서 총괄납부하더라도 세금계산서는 각 사업장에서 발급하여야 하며,\n신고도 각 사업장별로 이행하여야 합니다.\n박과장 : 면세사업자의 경우 부가가치세법상 납세의무는 없으며, 법정증빙을 구비한 매입에\n대하여는 매입세액을 받을 수 있습니다.\n최사원 : 사업자란 사업목적이 영리로서 사업상 독립적으로 재화 또는 용역을 공급하는 자를\n말합니다.\n① 김부장\n② 이차장\n③ 박과장\n④ 최사원", "answer": 2}, {"year": "2024", "month": "3", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 사업개시일 이전에 사업자등록을 신청한 경우의 과세기간은 그 신청한 날부터 그 신청일이 속하는\n과세기간의 종료일까지로 한다.\n② 폐업자의 최종과세기간은 폐업일이 속하는 과세기간의 개시일부터 폐업일까지로 한다.\n③ 간이과세자가 간이과세를 포기한 경우 신고일이 속하는 과세기간 개시일부터 그 신고일이 속하는 달\n의 다음달 말일까지의 기간을 간이과세자의 과세기간으로 한다.\n④ 신규사업자의 최초과세기간은 사업개시일부터 그 날이 속하는 과세기간의 종료일까지로 하는 것이\n원칙이다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 부동산임대업은 그 부동산의 등기부상 소재지를 사업장으로 한다.\n② 제조업은 최종 제품을 완성하는 장소를 사업장으로 하며, 따로 제품의 포장만을 하거나 용기에 충전\n만을 하는 장소도 사업장으로 본다.\n③ 무인자동판매기를 통하여 재화 ․ 용역을 공급하는 사업은 그 사업에 관한 업무총괄장소를 사업장으\n로 한다.\n④ 재화의 보관 ․ 관리 시설만을 갖춘 장소로서 사업자가 관할세무서장에게 그 설치신고를 한 하치장은\n별개의 사업장으로 보지 아니한다.", "answer": 2}, {"year": "2024", "month": "3", "qnum": 75, "text": "[75]다음 중 부가가치세법상 재화의 공급에 해당하지 않는 것은?\n① 사용인에게 경조사와 관련하여 연간 10만원 이하의 재화를 제공한 경우\n② 대물변제계약에 따라 채무를 변제하기 위하여 재화의 소유권을 이전하는 경우\n③ 교환계약에 의하여 재화를 인도한 경우\n④ 구입시 매입세액공제를 받지 못한 재화를 외상 판매한 경우", "answer": 1}, {"year": "2024", "month": "3", "qnum": 76, "text": "[76]다음 중 부가가치세법상 공급시기에 관한 설명으로 옳지 않은 것은?\n① 장기할부판매의 경우에는 대가의 각 부분을 받기로 한 때를 공급시기로 한다.\n② 둘 이상의 과세기간에 걸쳐 부동산임대용역을 제공하고 그 대가를 선불 또는 후불로 받는 경우 대통\n령령에 따라 계산한 금액은 예정신고기간 또는 과세기간의 종료일을 공급시기로 한다.\n③ 내국신용장에 의하여 공급하는 재화의 공급시기는 수출재화의 선(기)적일로 한다.\n④ 무인판매기를 이용하여 재화를 공급하는 경우에는 무인판매기에서 현금을 꺼내는 때를 공급시기로\n한다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 77, "text": "[77]다음 중 부가가치세법상 영세율 적용대상이 아닌 것은?\n① 중개무역방식에 의한 수출\n② 국외에서의 용역공급\n③ 선박에 의한 외국항행용역\n④ 국내에서 비거주자에게 직접 인도한 재화", "answer": 4}, {"year": "2024", "month": "3", "qnum": 78, "text": "[78]다음 자료에 의하여 일반과세자인 ㈜삼일의 2024년 제1기 확정신고시의 과세표준을 계산하면 얼마인가\n(단, 모두 국내거래이고, 금액에는 부가가치세가 포함되지 않았으며, 아래의 자료를 제외한 세무상 처\n리는 모두 적정하다고 가정함)?\n거래일자 거 래 내 용 금 액\n4.11. 제품을 거래처에 외상으로 판매함(대금을 3개월 후 수령 예정) 8,000,000원\n시가 200,000원\n5.20. 거래처에 운송하는 중에 교통사고로 파손된 제품(매입세액공제분)\n원가 100,000원\n거래관계 개선목적으로 대리점에 제품(매입세액공제분)을 무상 제 시가 400,000원\n6.17.\n공함 원가 200,000원\n제품을 공급하기로 계약을 체결하였으나 계약자가 일방적으로 계\n6.27. 500,000원\n약을 해제함에 따라 위약금으로 받은 금액\n① 8,000,000원\n② 8,200,000원\n③ 8,400,000원\n④ 8,900,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 79, "text": "[79]일반과세자인 ㈜용산의 2024년 제1기 예정신고기간의 매입거래이다. ㈜용산의 2024년 제1기 예정신\n고기간의 매입세액공제액으로 옳은 것은?\n⑴ 법인으로부터 원재료를 9,000,000원(부가가치세 900,000원 별도)에 구입하고 공급시기에 세\n금계산서를 수취하였다.\n⑵ 비영업용소형승용차(개별소비세 과세대상임)의 수선비를 지급하고 공급가액 2,000,000원(부\n가가치세 200,000원 별도)의 세금계산서를 수령하였다.\n⑶ 영업부 직원 회식비로 1,320,000원(부가가치세 120,000원 포함)을 지급하고 일반과세자로부\n터 공급대가 1,320,000원의 신용카드매출전표(부가가치세가 별도로 구분됨)를 수령하였다.\n⑷ 광고선전비에 대하여 공급가액 4,000,000원(부가가치세 400,000원 별도)의 세금계산서를 수\n령하였다.\n① 900,000원\n② 1,100,000원\n③ 1,420,000원\n④ 1,620,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 80, "text": "[80]다음 중 부가가치세법상 가산세와 관련된 설명으로 옳지 않은 것은?\n① 세금계산서의 발급기한이 지난 후 해당 재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확정\n신고기한까지 세금계산서를 발급한 경우 공급가액의 1 %를 가산세로 한다.\n② 예정신고기간에 발급받은 세금계산서에 대한 합계표를 예정신고시 제출하지 아니하고 확정신고시 제\n출하여 매입세액을 공제받는 경우 가산세가 부과된다.\n③ 전자세금계산서 발급의무자가 발급기간 내에 종이세금계산서를 발급하면 가산세가 부과된다.\n④ 사업개시일부터 20일 이내에 사업자등록을 신청하지 아니한 경우에는 미등록가산세가 부과된다.\n\n< 원가관리회계 >", "answer": 2}, {"year": "2024", "month": "5", "qnum": 41, "text": "[41]다음 중 조세의 분류기준에 따른 구분과 세목을 연결한 것으로 옳지 않은 것은?\n분류기준 구분 조세항목\n국세 법인세, 소득세, 부가가치세\n① 과세권자\n지방세 취득세, 재산세, 주민세\n보통세 법인세, 소득세, 부가가치세\n② 사용용도의 특정여부\n목적세 교육세, 농어촌특별세\n종량세 등록면허세\n③ 과세물건측정 단위\n종가세 법인세, 소득세\n직접세 법인세, 소득세\n④ 조세부담의 전가여부\n간접세 부가가치세, 개별소비세", "answer": 3}, {"year": "2024", "month": "5", "qnum": 69, "text": "[69] 다음 자료를 이용하여 등기된 토지의 양도로 인한 양도소득세 과세표준을 계산하면 얼마인가?\nㄱ. 양도가액 : 100,000,000 원\nㄴ. 취득가액 : 60,000,000 원\nㄷ. 양도비용 : 2,000,000 원\nㄹ. 보유기간 : 2014 년 5 월 8 일에 취득하여 2024 년 7 월 10 일에 양도\nㅁ. 장기보유특별공제율(10 년 이상 11 년 미만 보유) : 20 %\nㅂ. 2024년에 위 토지 외의 다른 양도소득세 과세대상 자산을 양도하지 아니함.\n① 26,700,000원\n② 27,900,000원\n③ 29,700,000원\n④ 30,400,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 71, "text": "[71]다음 중 부가가치세에 관한 설명으로 옳지 않은 주장을 하는 사람은 누구인가?\n① 김철수 : 사업자란 사업목적이 영리이든 비영리이든 관계없이 사업상 독립적으로 재화 또는 용역을\n공급하는 자를 말합니다.\n② 박다혜 : 부가가치세는 납세의무자와 담세자가 다를 것으로 예정된 조세이므로 간접세에 해당합니\n다.\n③ 김영희 : 중소기업은 부가가치세 조기환급 신청이 가능합니다.\n④ 정민지 : 세금계산서의 필요적 기재사항의 전부 또는 일부가 기재되지 아니하거나 사실과 다를 경우\n적법한 세금계산서로 보지 않으며, 가산세 등의 불이익이 있습니다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳은 것은?\n① 영세율을 적용받는 사업자는 부가가치세법상의 사업자 등록의무가 없다.\n② 면세사업자는 부가가치세법에 따른 사업자 등록의무가 있다.\n③ 주사업장총괄납부사업자는 본점 또는 주사무소에서 모든 사업장의 부가가치세를 총괄하여 신고 및\n납부할 수 있다.\n④ 사업상 독립적으로 재화 또는 용역을 공급하는 경우 법인 뿐만 아니라 개인도 사업자에 해당한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 계속사업자인 간이과세자의 과세기간은 1년을 제 1기 과세기간과 제 2기 과세기간으로 나누어 각\n과세기간 별로 신고·납부하여야 한다.\n② 일반과세자가 간이과세자로 변경되는 경우 과세유형이 변경되는 해에 간이과세 규정이 적용되는 기\n간은 그 변경 이후 7월 1일부터 12월 31일까지이다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에는 사업자등록 신청일부터 신청일이 속하\n는 과세기간의 종료일까지를 최초 과세기간으로 한다.\n④ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 1}, {"year": "2024", "month": "5", "qnum": 74, "text": "[74]다음 중 부가가치세 납세지인 사업장에 관한 설명으로 옳은 것은?\n① 직매장과 하치장은 별도의 사업장으로 본다.\n② 부동산매매업의 경우 부동산의 등기부상의 소재지를 사업장으로 한다.\n③ 제조업의 경우 최종제품을 완성하는 장소를 사업장으로 하며, 이 경우 따로 제품의 포장만을 하거나\n용기에 충전만을 하는 장소를 포함한다.\n④ 무인자동판매기를 통하여 재화ㆍ용역을 공급하는 사업의 경우 그 사업에 관한 업무를 총괄하는 장소\n를 사업장으로 한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 75, "text": "[75]다음 중 부가가치세법상 재화의 공급에 관한 설명으로 옳지 않은 것은?\n① 사업자 단위과세를 적용받는 사업자가 자기사업과 관련하여 생산 또는 취득한 재화를 타인에게 직접\n판매할 목적으로 다른 사업장에 반출하는 경우에는 재화의 공급으로 보지 아니한다.\n② 사업자가 자기의 과세사업과 관련하여 취득한 재화(매입세액을 공제받지 않음)를 자기의 면세사업에\n전용한 경우에는 재화의 공급으로 본다.\n③ 주사업장총괄납부 신청을 한 사업자가 판매목적으로 타사업장에 반출하는 경우에는 이를 재화의 공\n급으로 보지 아니한다.\n④ 사업자가 자기의 사업과 관련하여 취득한 재화(매입세액공제를 받음)를 직장 연예 및 직장 문화 관\n련으로 사용한 경우에는 재화의 공급으로 보지 아니한다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 76, "text": "[76]다음 중 부가가치세법상 재화의 공급시기에 관한 설명으로 옳지 않은 것은?\n① 간주공급 중 개인적공급은 재화를 사용하거나 소비하는 때를 재화의 공급시기로 본다.\n② 폐업시 잔존재화의 공급시기는 폐업일이다.\n③ 내국신용장에 의하여 공급하는 재화의 공급시기는 인도일이다.\n④ 공급단위를 구획할 수 없는 재화를 계속적으로 공급하는 경우에는 예정신고기간 또는 과세기간 종료\n일이 공급시기이다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 77, "text": "[77]다음은 김삼일씨의 2024년 5월 가계부 지출내역이다. 지출금액에 포함된 부가가치세 합계를 계산하면\n얼마인가(단, 공급자는 부가가치세법에 따라 적법하게 부가가치세를 거래징수 하였다고 가정한다)?\n일 자 적 요 지 출 금 액\n1월 14일 딸기 구입 11,000원\n1월 21일 생수 구입 22,000원\n1월 27일 시내버스요금 33,000원\n1월 30일 프로야구 입장권 구입 44,000원\n① 4,000원\n② 6,000원\n③ 9,000원\n④ 10,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 78, "text": "[78]다음 자료를 이용하여 부가가치세 과세표준을 구하면 얼마인가?\nㄱ. 외상매출액(매출에누리 2,000,000원이 차감되지 않은 금액) 100,000,000원\nㄴ. 거래처 파산으로 인한 대손금 4,000,000원\nㄷ. 금전으로 지급한 판매장려금 3,000,000원\nㄹ. 외상매출금의 지급지연으로 인해 수령한 연체이자 2,000,000원\n① 94,000,000 원\n② 98,000,000 원\n③ 100,000,000 원\n④ 101,000,000 원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 79, "text": "[79]택시사업과 시내버스사업을 운영하는 ㈜삼일은 두 사업에 공통으로 사용할 목적으로 기계장비를 2024년\n1월 15일에 30,000,000원(부가가치세 제외)에 매입하였다. ㈜삼일의 공급가액의 내역이 다음과 같을\n때 2024년 제1기 확정신고에 있어서 이 기계장비의 매입세액 중 불공제되는 금액은?\n구분 2024년 1월 1일 ~ 3월 31일 2024년 4월 1일 ~ 6월 30일 합계\n택시사업 3억 2억 5억\n시내버스사업 7억 8억 15억\n합계 10억 10억 20억\n① 100,000 원\n② 125,000 원\n③ 150,000 원\n④ 200,000 원", "answer": 3}, {"year": "2024", "month": "5", "qnum": 80, "text": "[80]다음 중 부가가치세의 신고 및 납부, 환급에 관한 설명으로 옳지 않은 것은?\n① 일반환급의 경우 환급세액은 확정신고기한이 지난 후 30일 이내에 환급한다.\n② 조기환급을 신청한 경우 환급세액은 신고기한이 지난 후 15일 이내에 환급받을 수 있다.\n③ 당해 과세기간 중 대손이 발생하였거나 대손금이 회수되었을 경우 확정신고시에 대손세액을 가감한\n다.\n④ 2024년 4월 16일에 폐업한 사업자는 2024년 6월 25일까지 확정 신고를 하여야 한다.\n\n< 원가관리회계 >", "answer": 4}, {"year": "2024", "month": "6", "qnum": 41, "text": "[41]다음 중 조세의 분류에 관한 설명으로 옳지 않은 것은?\n① 조세는 과세권자에 따라 국세와 지방세로 분류한다.\n② 교육세는 조세의 사용용도가 특정되지 아니한 보통세에 해당한다.\n③ 소득세는 납세자의 인적사항이 고려되는 인세(人稅)에 해당한다.\n④ 부가가치세는 입법상 조세부담의 전가를 예상한 간접세에 해당한다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳은 것은?\n① 공장에서 제조하는 재화는 출고단계에서 한 번 과세하고, 유통단계에서는 추가로 과세하지 않는 단\n단계거래세이다.\n② 부가가치세는 면세로 열거되지 않은 모든 재화 또는 용역을 과세대상으로 하는 일반소비세이다.\n③ 매출액에서 매입액을 차감하여 부가가치를 계산한 후 부가가치에 세율을 곱하는 방식으로 세액을\n계산하는 전단계거래액공제법을 채택하고 있다.\n④ 국제적 이중과세의 문제를 해결하기 위하여 수출품에 대하여 부가가치세를 과세하지 않는 면세제도\n를 두고 있다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 면세사업자는 매출세액을 거래 징수할 필요는 없으나 매입세액 공제를 받을 수 있다.\n② 면세사업자는 부가가치세법에 따른 사업자등록 의무는 없다.\n③ 과세사업자는 일반과세자와 간이과세자로 구분할 수 있다.\n④ 비영리사업자도 부가가치세법상 납세의무자가 될 수 있다.", "answer": 1}, {"year": "2024", "month": "6", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 사업개시일 이전에 사업자등록을 신청한 경우의 과세기간은 그 신청한 날부터 그 신청일이 속하는\n과세기간의 종료일까지로 한다.\n② 간이과세자의 과세기간은 1년을 2개의 과세기간으로 나누어 6개월마다 신고ㆍ납부하도록 하고 있\n다.\n③ 간이과세자가 간이과세를 포기한 경우 신고일이 속하는 과세기간 개시일부터 그 신고일이 속하는 달\n의 말일까지의 기간을 간이과세자의 과세기간으로 한다.\n④ 신규사업자의 최초과세기간은 사업개시일부터 그 날이 속하는 과세기간의 종료일까지로 하는 것이\n원칙이다.", "answer": 2}, {"year": "2024", "month": "6", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 건설업을 영위하는 법인의 경우 법인의 등기부상 소재지(등기부상의 지점 소재지를 포함함)를 사업\n장으로 본다.\n② 제조업의 경우 최종 제품을 완성하는 장소를 사업장으로 본다.\n③ 부동산임대업의 경우 사업에 관한 업무를 총괄하는 장소를 사업장으로 본다.\n④ 사업장을 설치하지 않은 경우 해당 사업자의 주소 또는 거소를 사업장으로 본다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 75, "text": "[75]다음 중 부가가치세법상 재화의 공급에 관한 설명으로 옳지 않은 것은?\n① 사업자가 주요자재의 전부 또는 일부를 부담하고 해당 재화에 공작을 가해 새로운 재화를 만드는 가\n공계약은 재화의 공급에 해당된다.\n② 사업자가 다른 재화를 인도받거나 용역을 제공받는 교환계약에 의해 재화를 인도하는 교환계약은 재\n화의 공급에 해당된다.\n③ 사용인에게 경조사와 관련된 재화(매입세액공제를 받음)를 제공하는 경우 사용인 1명당 연간 20만원\n을 한도로 하며, 20만원을 초과하는 경우 해당 초과액에 대해서는 재화의 공급으로 본다.\n④ 사업자가 사업을 폐업할 때 취득한 재화(매입세액을 공제받음) 중 남아있는 재화는 재화의 공급으로\n본다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 76, "text": "[76]다음 중 부가가치세법상 공급시기에 관한 설명으로 옳지 않은 것은?\n① 장기할부판매의 경우에는 대가의 각 부분을 받기로 한 때를 공급시기로 한다.\n② 전력이나 그 밖에 공급단위를 구획할 수 없는 재화를 계속적으로 공급하는 경우에는 대가의 각 부분\n을 받기로 한 때를 재화의 공급시기로 본다.\n③ 내국신용장에 의하여 공급하는 재화의 공급시기는 수출재화의 선(기)적일로 한다.\n④ 무인판매기를 이용하여 재화를 공급하는 경우에는 무인판매기에서 현금을 꺼내는 때를 공급시기로\n한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 77, "text": "[77]다음은 겸용주택의 임대와 관련된 사항이다. 면세되는 건물과 토지의 면적은 얼마인가(단, 해당 겸용주\n택은 단층주택으로 도시계획구역 내에 소재함)?\nŸ 주택 40㎡이고 점포 50㎡ / 부수토지 450㎡\n면세건물 면세토지\n① 40㎡ 150㎡\n② 40㎡ 200㎡\n③ 90㎡ 400㎡\n④ 90㎡ 450㎡", "answer": 2}, {"year": "2024", "month": "6", "qnum": 78, "text": "[78]과세사업과 면세사업을 겸영하고 있는 ㈜삼일은 두 사업에서 공통으로 사용하고 있던 재화를 매각하였\n다. 다음 자료를 보고 ㈜삼일의 2024년 제2기 확정신고시 공통사용재화와 관련된 매출세액을 계산하면\n얼마인가?\n·공통사용재화 취득일: 2024년 1월 2일\n·공통사용재화 공급일: 2024년 11월 25일\n·공통사용재화 공급가액: 30,000,000원(부가가치세 불포함)\n·과세사업과 면세사업의 공급가액\n구분 2024년 1기 2024년 2기\n과세 1억원 2억원\n면세 3억원 3억원\n계 4억원 5억원\n① 750,000원\n② 900,000원\n③ 1,500,000원\n④ 3,000,000원", "answer": 1}, {"year": "2024", "month": "6", "qnum": 79, "text": "[79]다음은 부가가치세 과세사업을 영위하는 ㈜삼일의 2024년 제1기 예정신고기간의 매입내역이다. 2024\n년 제1기 예정신고시 공제받을 수 있는 매입세액은 얼마인가(단, 별도의 언급이 없는 항목은 정당하게\n세금계산서를 수령하였다고 가정한다)?\n매 입 내 역 매입세액\nㄱ. 기계장치 구입 10,000,000원\nㄴ. 업무무관비용 지출 7,000,000원\nㄷ. 원재료 구입 6,000,000원\nㄹ. 부재료 구입(세금계산서의 필요적 기재사항의 일부가 9,000,000원\n누락되었고, 그 세금계산서에 적힌 나머지 필요적 기\n재사항 또는 임의적 기재사항으로 보아 거래사실을 확\n인할 수 없음)\nㅁ. 기업업무추진비 4,000,000원\n① 16,000,000원\n② 20,000,000원\n③ 24,000,000원\n④ 33,000,000원", "answer": 1}, {"year": "2024", "month": "6", "qnum": 80, "text": "[80]다음 중 부가가치세법상 가산세가 부과되는 경우로 옳지 않은 것은?\n① 사업자등록을 하지 않은 경우\n② 재화를 공급받고 타인 명의로 세금계산서를 발급받은 경우\n③ 예정신고시 매입처별 세금계산서 합계표를 제출하지 않고 확정신고시 제출한 경우\n④ 세금계산서의 발급시기가 지난 후 해당 재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확정\n신고 기한까지 세금계산서를 발급하는 경우\n\n< 원가관리회계 >", "answer": 3}, {"year": "2024", "month": "7", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되는 금액의 합계액은 얼마인가?\n(1) 부가가치세 매출세액 200,000 원\n(2) 법인세환급액 100,000 원\n(3) 채무면제이익 100,000 원\n(4) 상품판매로 받은 금액 300,000 원\n(5) 자기주식의 양도금액 100,000 원\n① 300,000 원\n② 400,000 원\n③ 500,000 원\n④ 700,000 원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 71, "text": "[71]원재료 생산업자가 생산한 원료를 ㈜삼일에게 2,000,000원에 판매하고, ㈜삼일은 제품을 생산하여 도매\n업자인 ㈜용산에게 5,000,000원에 판매하였다. 그 후 ㈜용산은 소매업자인 ㈜강남에게 7,000,000원에\n판매하고, ㈜강남은 소비자 김삼일에게 10,000,000원에 판매한 경우 전체 거래에서 창출된 총 부가가치\n금액을 구하면 얼마인가?\n① 8,000,000원\n② 10,000,000원\n③ 22,000,000원\n④ 24,000,000원", "answer": 2}, {"year": "2024", "month": "7", "qnum": 72, "text": "[72]다음 중 부가가치세법상 사업자등록에 관한 설명으로 옳지 않은 것은?\n① 부가가치세 면세사업자는 부가가치세법상 사업자등록의무가 없다.\n② 신규로 사업을 개시하고자 하는 자는 사업개시일 전이라도 사업자등록을 할 수 있다.\n③ 다수의 사업장을 가진 사업자단위과세사업자는 사업장마다 사업개시일부터 20일 내에 사업자 등록\n신청을 하여야 한다.\n④ 사업자등록신청을 받은 세무서장은 원칙적으로 2일 이내에 사업자등록증을 발급하여야 한다.", "answer": 3}, {"year": "2024", "month": "7", "qnum": 73, "text": "[73]다음 중 부가가치세법상 과세기간에 관한 설명으로 옳지 않은 것은?\n① 일반과세자가 간이과세자로 변경되는 경우 과세유형이 변경되는 해에 간이과세규정이 적용되는 과세\n기간은 1월 1일부터 12월31일까지이다.\n② 간이과세자의 경우 과세기간을 1월 1일부터 12월 31일로 적용한다.\n③ 신규사업자의 경우 사업개시일부터 사업개시일이 속하는 과세기간의 종료일까지를 최초 과세기간으\n로 한다.\n④ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 74, "text": "[74]다음 중 부가가치세의 납세지에 관한 내용으로 옳지 않은 것은?\n① 사업장은 사업자가 사업을 하기 위하여 거래의 전부 또는 일부를 하는 고정된 장소로 한다.\n② 직매장이란 사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화를 직접 판매하기 위하여 특별\n히 판매시설을 갖춘 장소를 말하며, 직매장은 사업장으로 본다.\n③ 재화를 보관하고 관리할 수 있는 시설만 갖춘 장소로서 하치장으로 신고된 장소는 사업장으로 보지\n아니한다.\n④ 사업자단위과세제도에 따라 사업자단위 신고·납부를 하는 경우에도 세금계산서의 발급과 수령은 본\n점 또는 주사무소에서 수행할 수 없고 각 사업장에서 수행해야 한다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 75, "text": "[75]다음 중 부가가치세 과세대상에 관한 설명으로 옳은 것을 모두 고르면?\nㄱ. 재화 또는 용역의 공급은 부가가치세 과세대상이며, 재화의 수입은 부가가치세 과세대상에 해당\n되지 않는다.\nㄴ. 고용관계에 의해 근로를 제공하는 것은 부가가치세 과세대상인 용역의 공급이 아니다.\nㄷ. 용역의 무상공급은 부가가치세법상 용역의 공급으로 보지 않지만 특수관계인에게 무상으로 제공\n하는 부동산임대용역은 용역의 공급으로 본다.\nㄹ. 건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하는 경우 재화의 공급으로 본다.\n① ㄱ, ㄴ\n② ㄴ, ㄷ\n③ ㄱ, ㄹ\n④ ㄷ, ㄹ", "answer": 2}, {"year": "2024", "month": "7", "qnum": 76, "text": "[76]다음 중 부가가치세법상 재화·용역의 공급시기에 관한 내용으로 옳지 않은 것은?\n① 통상적인 용역공급 : 역무의 제공이 완료되는 때\n② 재화의 장기할부판매 : 계약에 따라 대가의 각 부분을 받기로 한 때\n③ 재화의 위탁판매 : 수탁자 또는 대리인의 공급시기\n④ 재화의 반환부조건판매 : 재화를 인도하는 때", "answer": 4}, {"year": "2024", "month": "7", "qnum": 77, "text": "[77]다음 중 부가가치세법에 따른 영세율과 면세에 관한 설명으로 옳지 않은 것은?\n① 영세율의 목적은 소비지국 과세원칙의 구현 등에 있고, 면세의 목적은 부가가치세의 역진성 완화 등\n에 있다.\n② 영세율 적용대상자는 부가가치세법에 따른 납세의무자이지만, 면세 적용대상자는 부가가치세법에 따\n른 납세의무자가 아니다.\n③ 면세사업자가 영세율을 적용받기 위해서는 면세를 포기하여야 한다.\n④ 면세가 적용되는 경우에는 매입세액을 환급받을 수 있는 반면, 영세율이 적용되는 경우에는 매입세\n액을 환급받을 수 없다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 78, "text": "[78]다음 자료를 이용하여 과세사업을 영위하는 ㈜삼일의 2024년 제 2기 예정신고기간의 부가가치세 과세\n표준을 구하면 얼마인가?\nㄱ. 특수관계가 없는 자에 대한 외상매출액 200,000,000원\n(매출에누리 5,000,000원, 매출할인 10,000,000원이 차감되어 있음)\nㄴ. 특수관계인에 대한 재화매출액(시가 60,000,000원) 40,000,000원\nㄷ. 상가건물의 처분액 700,000,000원\nㄹ. 하치장 용도로 사용하던 토지의 처분액 15,000,000원\n① 250,000,000원\n② 940,000,000원\n③ 960,000,000원\n④ 975,000,000원", "answer": 3}, {"year": "2024", "month": "7", "qnum": 79, "text": "[79]다음 자료를 이용하여 음식점업을 영위하고 있는 일반과세자인 김삼일씨의 제2기 예정신고기간의 매입\n세액공제액을 계산하면 얼마인가(음식점업(과세유흥장소 아님)의 의제매입세액공제율은 108분의 8이\n며, 공제한도를 초과하지 않는다고 가정한다)?\nㄱ. 세금계산서 수령 매입액(부가가치세 제외금액) : 50,000,000원\nㄴ. 세금계산서 수령분 중 기업업무추진비 관련 매입액(부가가치세 제외금액) : 5,000,000원\nㄷ. 면세로 구입한 농산물(계산서 수령) : 27,000,000원\nㄹ. 영수증 수령 비품매입액(부가가치세 포함) : 4,400,000원\n① 6,500,000원\n② 6,900,000원\n③ 7,000,000원\n④ 7,400,000원", "answer": 1}, {"year": "2024", "month": "7", "qnum": 80, "text": "[80]다음 중 부가가치세법상 가산세에 관한 설명으로 옳지 않은 것은?\n① 세금계산서불성실가산세(미발급은 제외)와 매출처별세금계산서합계표 불성실가산세에 동시에 해당하\n는 경우 두가지 모두 적용한다.\n② 신규로 사업을 개시한 사업자가 기한 내에 사업자등록을 신청하지 아니한 경우 사업개시일부터 등록\n신청일의 직전일까지의 공급가액에 대하여 1 % 를 미등록가산세가 부과된다.\n③ 예정신고시 제출하지 않은 매출처별세금계산서합계표를 확정신고시에 제출한 경우에 가산세를 납부\n하여야 한다.\n④ 세금계산서의 필요적 기재사항의 전부 또는 일부가 적혀있지 아니한 경우 가산세가 부과된다.\n\n< 원가관리회계 >", "answer": 1}, {"year": "2024", "month": "9", "qnum": 70, "text": "[70]다음 중 소득세법상 신고·납부기한에 관한 설명으로 옳지 않은 것은?\n① 사업소득이 있는 거주자는 11월 30일까지 중간예납세액을 납부하여야 한다.\n② 3월에 비상장주식을 양도한 거주자는 8월 말까지 양도차익에 대한 예정신고를 하고 세액을 납부해\n야 한다.\n③ 근로소득만 있는자가 연말정산을 한 경우에는 소득세 확정신고를 하지 않을 수 있다.\n④ 부가가치세 면세사업을 영위하는 면세사업자는 해당 과세기간의 다음연도 2월 말까지 사업장 현황\n신고를 해야한다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 71, "text": "[71]다음 중 우리나라 부가가치세에 관한 설명으로 옳지 않은 것은?\n① 전단계세액공제법을 적용하여 납부할 세액을 계산하고 있다.\n② 재화를 수입하는 자는 사업자인지 여부에 관계없이 모두 납세의무가 있다.\n③ 부가가치세법상 사업자의 요건을 충족하기 위해서는 영리를 목적으로 거래하여야 한다.\n④ 주된 재화의 공급에 부수되어 공급되는 재화의 과세대상여부는 주된재화의 과세여부에 의해서 결정\n된다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 72, "text": "[72]다음 중 우리나라 부가가치세법상 납세의무자에 관한 설명으로 옳지 않은 것은?\n① 부가가치세의 납세의무자는 재화 또는 용역을 공급받는 사업자이다.\n② 과세사업과 면세사업을 겸영하는 겸영사업자는 과세사업자로 분류된다.\n③ 신규로 사업을 개시하는 자는 원칙적으로 사업장마다 사업자등록을 하여야 한다.\n④ 과세사업자라 하더라도 면세대상 재화 또는 용역을 공급하는 경우 부가가치세가 면제되는 경우가 있\n다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 73, "text": "[73]다음 중 부가가치세법상 과세기간에 관한 설명으로 옳지 않은 것은?\n① 공급대가의 변동으로 간이과세자가 일반과세자로 변경되는 경우 그 변경 이전 1월 1일부터 6월 30\n일까지는 간이과세규정이 적용된다.\n② 간이과세자는 1월 1일부터 12월 31일까지를 과세기간으로 한다.\n③ 신규사업자가 사업개시일 이전에 사업자등록을 신청한 경우에도 사업개시일부터 개시일이 속하는 과\n세기간의 종료일까지를 최초 과세기간으로 한다.\n④ 폐업자의 경우 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 건설업의 경우 법인은 그 법인의 등기부상 소재지, 개인은 업무총괄장소를 사업장으로 한다.\n② 사업장을 설치하지 않은 경우 그 사업에 관한 업무총괄장소를 사업장으로 한다.\n③ 부동산임대업의 경우 그 부동산의 등기부상의 소재지를 사업장으로 본다.\n④ 재화를 보관하고 관리할 수 있는 시설만 갖춘 장소로서 하치장으로 신고된 장소는 사업장으로 보지\n않는다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 75, "text": "[75]다음 중 부가가치세 과세대상에 관한 설명으로 옳지 않은 것은?\n① 재화란 재산적 가치가 있는 유체물과 무체물이므로 주식은 물론 특허권도 과세대상에 해당된다.\n② 재화의 수입에 대해서는 수입자가 사업자는 물론 비사업자인 경우에도 부가가치세가 과세된다.\n③ 과학상의 지식, 경험 또는 숙련에 관한 정보를 제공하는 것은 용역의 공급으로 본다.\n④ 건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하는 경우에는 용역의 공급으로 본다.", "answer": 1}, {"year": "2024", "month": "9", "qnum": 76, "text": "[76]다음 중 부가가치세법상 재화의 공급시기에 관한 설명으로 옳지 않은 것은?\n① 재화의 이동이 필요한 경우에는 재화가 인도되는 때를 원칙적인 공급시기로 한다.\n② 조건부 판매는 조건이 성취되거나 기한이 지나 판매가 확정되는 때를 공급시기로 한다.\n③ 재화의 이동이 필요하지 아니한 경우에는 재화가 이용가능하게 되는 때를 원칙적인 공급시기로 한\n다.\n④ 폐업일 이전에 공급한 재화의 공급시기가 폐업일 이후에 도래하는 경우 공급한 때를 공급시기로 한\n다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 77, "text": "[77]다음 자료를 바탕으로 회사 입장에서 영세율 제도와 면세 제도에 따라 부가가치세 납부 또는 환급세액\n을 계산할 경우 어떤 제도가 얼마나 유리한지 알맞게 짝지어진 것을 고르시오.\n구 분 영세율 면세\n매출액 30,000,000원(수출) 30,000,000원(면세 - 국내 매출)\n매입액 20,000,000원(과세) 20,000,000원(과세)\n부가가치(매출액 - 매입액) 10,000,000원 10,000,000원\n① 영세율 제도가 1,000,000원 유리함\n② 영세율 제도가 2,000,000원 유리함\n③ 면세 제도가 1,000,000원 유리함\n④ 면세 제도가 2,000,000원 유리함", "answer": 2}, {"year": "2024", "month": "9", "qnum": 78, "text": "[78]다음은 과세사업을 영위하는 ㈜삼일의 2024년 제1기 예정신고기간에 발생한 거래이다. 2024년 제1기\n예정신고기간의 과세표준은 얼마인가(단, 모든 금액에는 부가가치세가 포함되지 아니하였다)?\n(1) 특수관계인에게 제품을 5,000,000 원(시가 7,000,000 원)에 판매하였다.\n(2) 제3자에게 제품을 장기할부조건으로 판매하였으며, 총 판매대금은 36,000,000 원이다.\n이 중 2024년 제1기 예정신고기간동안 회수하기로 약정된 금액은 6,000,000 원이나 실\n제로 회수된 금액은 4,000,000 원이다.\n(3) 제 3자에게 10,000,000 원 상당의 제품을 판매하고 이 중 3,000,000 원은 ㈜삼일이 적\n립한 마일리지로 결제하였으며, 나머지는 현금으로 결제하였다.\n(4) 거래처에 판매장려 목적으로 현금 4,000,000 원과 당사의 제품(원가 : 3,000,000 원, 시\n가 5,000,000 원)을 제공하였다.\n① 21,000,000원\n② 23,000,000원\n③ 25,000,000원\n④ 27,000,000원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 79, "text": "[79]다음 중 부가가치세법상 매입세액공제에 관한 설명으로 옳지 않은 것은?\n① 사업자가 법 소정 사업자로부터 재화를 공급받고 세금계산서 대신 부가가치세액이 별도로 구분 가능\n한 신용카드 매출전표 등을 발급 받은 경우 일정한 요건을 구비하면 매입세액 공제를 받을 수 있다.\n② 의제매입세액은 해당 면세 농산물 등의 사용시점에 공제된다.\n③ 기업업무추진비 및 이와 유사한 비용의 지출에 관련된 매입세액은 매출세액에서 공제되지 않는다.\n④ 재화를 공급받은 자가 발행한 매입자발행세금계산서는 원칙적으로 매입세액을 공제 받을 수 있는 세\n금계산서에 해당한다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 80, "text": "[80]부가가치세법상 일반과세자인 김삼일씨는 2024년 8월 20일에 사업을 개시하였으나 2024년 11월 1일\n에 사업자등록을 신청하였다. 2024년의 공급가액이 다음과 같을 때 2024년 제 2기 확정신고시 김삼일\n씨가 납부하여야 할 미등록가산세는 얼마인가?\n8월 20일 - 8월 31일: 5,000,000원\n9월 1일 - 9월 30일: 8,000,000원\n10월 1일 - 10월 31일: 10,000,000원\n11월 1일 - 11월 30일: 20,000,000원\n12월 1일 - 12월 31일: 30,000,000원\n① 50,000원\n② 130,000원\n③ 180,000원\n④ 230,000원\n\n< 원가관리회계 >", "answer": 4}, {"year": "2024", "month": "11", "qnum": 44, "text": "[44]다음 중 국세기본법상 가산세에 관한 설명으로 옳지 않은 것은?\n① 가산세는 해당 의무가 규정된 세법의 해당 국세의 세목으로 하나, 해당 국세를 감면하는 경우에도\n가산세는 그 감면대상에 포함시키지 아니하는 것으로 한다.\n② 법정신고기한이 지난 후 2년 이내에 수정신고한 경우에도 과세표준과 세액을 경정할 것을 미리 알\n고 과세표준수정신고서를 제출한 경우는 과소신고·초과환급신고가산세를 감면하지 아니한다.\n③ 부가가치세법에 따른 사업자가 영세율과세표준을 과소신고한 경우 과소신고한 영세율과세표준의 1%\n를 과소신고·초과환급신고가산세에 더한다.\n④ 법정신고기한이 지난 후 1개월 이내에 기한 후 신고를 한 경우 무신고가산세의 50%에 상당하는 금\n액을 감면한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 71, "text": "[71]㈜서울은 원재료를 매입하지 않고 공기와 햇빛으로 생산한 제품을 도매업자인 ㈜용산에 500,000원에,\n㈜용산은 소매업자인 ㈜한강에 800,000원에 판매하고, ㈜한강은 최종소비자에게 1,000,000원에 판매하\n였다. 각 사업자가 창출한 부가가치의 합계는 얼마인가?\n① 500,000원\n② 800,000원\n③ 900,000원\n④ 1,000,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 영세율을 적용받는 사업자는 부가가치세법상의 사업자 등록의무가 있다.\n② 사업상 독립적으로 재화 또는 용역을 공급하는 경우 법인 뿐만 아니라 개인도 사업자에 해당한다.\n③ 주사업장총괄납부사업자는 본점 또는 주사무소에서 모든 사업장의 부가가치세를 총괄하여 신고 및\n납부할 수 있다.\n④ 면세사업자는 부가가치세법에 따른 사업자 등록의무가 없다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 계속 사업을 하고 있는 일반과세자의 과세기간은 제1기는 1월 1일부터 6월 30일까지, 제2기는\n7월 1일부터 12월 31일까지로 한다.\n② 일반과세자가 간이과세자로 변경되는 경우 과세유형이 변경되는 해에 간이과세 규정이 적용되는 기\n간은 그 변경 이후 7월 1일부터 12월 31일까지이다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에는 사업개시일부터 신청일이 속하는 과세\n기간의 종료일까지를 최초 과세기간으로 한다.\n④ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.", "answer": 3}, {"year": "2024", "month": "11", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 부동산임대업은 그 부동산의 등기부상의 소재지를 사업장으로 한다.\n② 제조업은 최종 제품을 완성하는 장소를 사업장으로 하며, 따로 제품의 포장만을 하거나 용기에 충전\n만을 하는 장소는 사업장으로 보지 아니한다.\n③ 무인자동판매기를 통하여 재화 ․ 용역을 공급하는 사업은 그 사업에 관한 업무총괄장소를 사업장으\n로 한다.\n④ 재화의 보관 ․ 관리 시설만을 갖춘 장소로서 사업자가 관할세무서장에게 그 설치신고를 한 하치장은\n별개의 사업장으로 본다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 75, "text": "[75]다음 중 부가가치세법상 재화의 공급에 해당하지 않는 것은?\n① 구입시 매입세액공제를 받지 못한 재화를 외상 판매한 경우\n② 사용인에게 경조사와 관련하여 연간 10만원 이하의 재화를 제공한 경우\n③ 교환계약에 의하여 재화를 인도한 경우\n④ 대물변제계약에 따라 채무를 변제하기 위하여 재화의 소유권을 이전하는 경우", "answer": 2}, {"year": "2024", "month": "11", "qnum": 76, "text": "[76]다음은 제조업을 영위하는 ㈜삼일의 거래내역이다. 2024년 제1기 예정신고기간(2024년 1월 1일 ~\n2024년 3월 31일)의 과세표준은 얼마인가?\nㄱ. 2023년 12월 5일에 제품을 반환조건부로 판매(인도)하고, 그 대금 2,000,000원을 수령함.\n2024년 1월 5일에 반환기간이 종료되어 판매가 확정됨.\nㄴ. 2024년 1월 5일에 제품을 장기할부판매하고 그 대금을 1월 5일부터 20회에 걸쳐\n매월 1,000,000원씩 회수하기로 약정함.\nㄷ. 2024년 1월 5일에 제품을 다음의 조건으로 판매함.\n가. 계약금 2,000,000원을 2024년 1월 5일에 수령\n나. 중도금 3,000,000원을 2024년 3월 5일에 수령\n다. 잔금 5,000,000원을 2024년 6월 5일에 수령하고 제품을 인도\n① 3,000,000원\n② 5,000,000원\n③ 8,000,000원\n④ 10,000,000원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 77, "text": "[77]다음 중 부가가치세법상 영세율이 적용되는 거래에 해당하는 것을 모두 고르면?\nㄱ. 재화의 수출\nㄴ. 용역의 국외공급\nㄷ. 선박·항공기의 외국항행 용역\nㄹ. 내국신용장에 의하여 공급하는 재화\n① ㄱ, ㄷ\n② ㄱ, ㄴ, ㄷ\n③ ㄱ, ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ, ㄹ", "answer": 4}, {"year": "2024", "month": "11", "qnum": 78, "text": "[78]다음은 제조업을 영위하는 일반과세자인 ㈜삼일의 2024년 제2기 예정신고기간(2024년 7월 1일 ~\n2024년 9월 30일)에 대한 자료이다. ㈜삼일의 2024년 제2기 예정신고기간의 부가가치세 과세표준은\n얼마인가(단, 다음 자료의 금액에는 부가가치세가 포함되지 않음)?\nㄱ. 7월 1일：제품을 12,000,000원에 인도하고 대금은 7월 31일부터 6개월 간 매달 말일에\n2,000,000원씩 받기로 하였다.\nㄴ. 7월 25일：기계유지보수 계약을 맺고 7월 25일부터 24개월 간 매달 25일에 1,000,000원씩\n받기로 하였다.\nㄷ. 8월 14일：제품(매입세액공제분)을 거래처에 판매장려물품(제조원가：800,000원, 시가：\n1,000,000원)으로 증여하였다.\nㄹ. 9월 30일：공급에 대한 대가의 지급이 지체되어 거래처로부터 연체이자 800,000원을 받았다.\n① 15,000,000원\n② 16,000,000원\n③ 16,800,000원\n④ 19,000,000원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 79, "text": "[79]다음은 제조업을 영위하는 과세사업자인 ㈜삼일의 2024년 10월 1일부터 12월 31일까지의 매입내역이\n다. 2024년 제 2기 확정신고시 공제받을 수 있는 매입세액을 계산하면 얼마인가(단, 모두 세금계산서\n를 수령하였다)?\n매입내역 매입가액 매입세액\n기계장치 80,000,000원 8,000,000원\n기업업무추진비 40,000,000원 4,000,000원\n토지 조성을 위한\n20,000,000원 2,000,000원\n자본적 지출\n소모품 10,000,000원 1,000,000원\n① 8,000,000원\n② 9,000,000원\n③ 11,000,000원\n④ 15,000,000원", "answer": 2}, {"year": "2024", "month": "11", "qnum": 80, "text": "[80]다음 중 부가가치세의 신고 및 납부, 환급에 관한 설명으로 옳지 않은 것은?\n① 일반 환급의 경우 환급세액은 확정신고기한이 지난 후 30일 이내에 환급한다.\n② 조기환급을 신청한 경우 환급세액은 신고기한이 지난 후 10일 이내에 환급받을 수 있다.\n③ 사업설비(감가상각자산)를 신설·취득·확장 또는 증축하는 때에는 조기환급대상이 된다.\n④ 2024년 4월 19일에 폐업한 사업자는 2024년 5월 25일까지 확정 신고를 하여야 한다.\n\n< 원가관리회계 >", "answer": 2}, {"year": "2024", "month": "12", "qnum": 41, "text": "[41]다음 중 조세의 분류에 관한 설명으로 옳지 않은 것은?\n① 부가가치세는 과세권자가 국가인 국세에 해당한다.\n② 소득세는 납세자의 인적사정이 고려되는 인세에 해당한다.\n③ 교육세는 세수의 용도를 특정하여 징수하는 목적세에 해당한다.\n④ 농어촌특별세는 독립적인 세원에 대하여 부과되는 독립세에 해당한다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳은 것은?\n① 부가가치세는 특정한 재화 또는 용역만 과세하는 개별소비세에 해당한다.\n② 국제적 이중과세의 문제를 해결하기 위하여 원산지국 과세원칙을 채택하고 있다.\n③ 매출액에서 매입액을 차감하여 부가가치를 계산한 후 부가가치에 세율을 곱하는 방식으로 세액을 계\n산하는 전단계거래액공제법을 채택하고 있다.\n④ 모든 거래단계에서 창출된 부가가치에 대하여 각 단계별로 과세하는 다단계과세방법을 채택하고 있\n다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 72, "text": "[72]다음 부가가치세와 관련된 재경담당자들의 대화 내용 중 옳은 설명을 하고 있는 사람은 누구인가?\n김부장 : 부가가치세 납세의무자인 개인사업자는 1년에 네 번 부가가치세를 신고하는 것이\n원칙이다.\n박과장 : 면세사업자의 경우 부가가치세법상 납세의무는 없으며, 법정증빙을 구비한 매입에\n대하여는 매입세액을 공제 받을 수 있다.\n이차장 : 주된 사업장에서 총괄납부하더라도 세금계산서는 각 사업장에서 발급하여야 하며,\n신고도 각 사업장별로 이행하여야 한다.\n최사원 : 사업자란 사업목적이 영리로서 사업상 독립적으로 재화 또는 용역을 공급하는 자를\n말한다.\n① 김부장\n② 박과장\n③ 이차장\n④ 최사원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 73, "text": "[73]다음 중 부가가치세 과세기간에 관한 설명으로 옳지 않은 것은?\n① 사업개시일 이전에 사업자등록을 신청한 경우의 과세기간은 그 신청한 날부터 그 신청일이 속하는\n과세기간의 종료일까지로 한다.\n② 간이과세자가 간이과세를 포기한 경우 신고일이 속하는 과세기간 개시일부터 그 신고일이 속하는 달\n의 다음달 말일까지의 기간을 간이과세자의 과세기간으로 한다.\n③ 간이과세자의 과세기간은 1월 1일부터 12월 31일까지이다.\n④ 신규사업자의 최초과세기간은 사업개시일부터 그 날이 속하는 과세기간의 종료일까지로 하는 것이\n원칙이다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 건설업을 영위하는 법인의 경우 법인의 등기부상 소재지(등기부상의 지점 소재지를 포함하지 않음)\n를 사업장으로 본다.\n② 제조업의 경우 최종 제품을 완성하는 장소를 사업장으로 본다.\n③ 부동산임대업은 부동산의 등기부상 소재지를 사업장으로 한다.\n④ 사업장을 설치하지 않은 경우 해당 사업자의 주소 또는 거소를 사업장으로 본다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 75, "text": "[75]다음 중 부가가치세 과세대상에 관한 설명으로 옳지 않은 것은?\n① 재화의 수입에 대해서는 수입자가 사업자는 물론 비사업자인 경우에도 부가가치세가 과세된다.\n② 재화란 재산적 가치가 있는 유체물과 무체물이므로 상품권은 물론 주식도 과세대상에 해당된다.\n③ 건설업의 경우 건설업자가 건설자재의 전부 또는 일부를 부담하는 경우에는 용역의 공급으로 본다.\n④ 과학상의 지식, 경험 또는 숙련에 관한 정보를 제공하는 것은 용역의 공급으로 본다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 76, "text": "[76]㈜삼일은 2024년 10월 15일 상품을 할부판매하고 판매대금 3,000,000원은 아래와 같이 회수하기로 약\n정하였다. 할부대금의 실제 회수액이 다음과 같을 때 2024년 제2기 확정신고기간에 동 할부판매와 관\n련하여 신고할 과세표준은 얼마인가(단, 회수약정액과 회수액은 부가가치세를 포함하지 않은 금액임)?\nŸ 2024년 10월 15일 : 회수약정액 1,000,000원 / 실제회수액 0원\nŸ 2024년 12월 15일 : 회수약정액 1,000,000원 / 실제회수액 1,000,000원\nŸ 2025년 2월 15일 : 회수약정액 1,000,000원 / 실제회수액 1,800,000원\n① 1,000,000원\n② 1,800,000원\n③ 2,000,000원\n④ 3,000,000원", "answer": 4}, {"year": "2024", "month": "12", "qnum": 77, "text": "[77]다음은 김삼일씨의 2024년 1월 가계부 지출내역이다. 지출금액에 포함된 부가가치세 합계를 계산하면\n얼마인가(단, 공급자는 부가가치세법에 따라 적법하게 부가가치세를 거래징수 하였다고 가정한다)?\n일 자 적 요 지 출 금 액\n1월 14일 바나나 구입 11,000원\n1월 21일 생수 구입 22,000원\n1월 27일 도서(책) 구입 44,000원\n1월 30일 프로축구 입장권 구입 55,000원\n① 3,000원\n② 7,000원\n③ 8,000원\n④ 10,000원", "answer": 2}, {"year": "2024", "month": "12", "qnum": 78, "text": "[78]부가가치세 과세사업을 영위하던 일반과세자 김삼일씨는 2024년 11월 10일 당해 사업을 폐지하였다.\n다음 폐업시 잔존재화 자료를 보고 부가가치세 과세표준을 계산하면 얼마인가?\n자산의 종류 취득일 취득원가 시가\n상 품 2024년 9월 15일 20,000,000원* 28,000,000원\n토 지 2021년 7월 16일 100,000,000원 200,000,000원\n건 물 2023년 10월 15일 80,000,000원* 120,000,000원\n* 매입세액공제액를 적용받은 취득가액\n① 100,000,000원\n② 120,000,000원\n③ 125,000,000원\n④ 325,000,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 79, "text": "[79]일반과세자인 ㈜일품(음식점업)의 2024년 제2기 예정신고기간(7월 1일 ~ 9월 30일)의 세금계산서 수\n취분 매입세액은 다음과 같다. 이 자료를 이용하여 2024년 제2기 예정신고기간의 매입세액 공제액을\n계산하면 얼마인가?\n일자 내 용 매입세액\n7월 9일 가스렌지 구입비 6,000,000원\n8월 5일 개별소비세 과세대상 자동차(5인승, 배기량 2,000cc) 유류비 300,000원\n9월 20일 거래처접대(기업업무추진비) 100,000원\n9월 30일 조미료, 설탕 구입비 200,000원\n① 6,200,000원\n② 6,700,000원\n③ 6,800,000원\n④ 7,700,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 80, "text": "[80]다음 중 부가가치세법상 일반과세자와 간이과세자를 비교한 내용으로 옳지 않은 것은?\n일반과세자 간이과세자\n간이과세자를 포기하고 일반과세자가\n① 포기제도 포기제도 없음\n될 수 있음\n② 의제매입세액공제 적용 없음\n③ 대손세액공제 규정있음 규정없음\n④ 세금계산서 발급 세금계산서 발급 원칙 세금계산서 발급 불가\n\n< 원가관리회계 >", "answer": 4}, {"year": "2025", "month": "1", "qnum": 47, "text": "[47]다음 중 법인세법상 익금에 해당하는 금액을 합산하면 얼마인가?\n구 분 금 액\n부가가치세 매출세액 3,000,000원\n사업수입금액 2,000,000원\n법인세 환급액 1,500,000원\n자기주식 양도금액 10,000,000원\n특수관계인인 법인으로부터 저가로 매입한 2,300,000원\n유가증권의 시가와 매입가액의 차액\n① 12,000,000 원\n② 13,500,000 원\n③ 14,300,000 원\n④ 15,000,000 원", "answer": 1}, {"year": "2025", "month": "1", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳지 않은 것은?\n① 재화의 수입은 수입자가 사업자인지 여부와 관계없이 부가가치세가 과세된다.\n② 부가가치세는 납세자의 소득수준과 관계없이 모두 동일한 세율이 적용된다.\n③ 부가가치세법에서는 간접세에 대한 국제적 이중과세의 문제를 해결하기 위해 원산지국과세원칙을 채\n택하고 있다.\n④ 부가가치세는 최종소비자에게 이르기까지 모든 거래단계에서 창출된 부가가치에 대하여 각 단계별로\n과세하는 다단계과세방법에 따르고 있다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 72, "text": "[72]다음의 자료를 통해서 부가가치세 차가감납부세액을 계산하면 얼마인가(단, 면세로 매입한 금액 중 의\n제매입세액공제대상은 없다고 가정한다)?\n가. 공급가액 : 20,000,000원(면세공급가액 5,000,000원 포함)\n나. 매입가액 : 10,000,000원(면세 매입금액 1,000,000원, 기타 불공제 매입금액 2,000,000원 포함)\n다. 세금계산서 불성실 가산세 : 10,000원\n단, 위의 공급가액과 매입가액은 모두 부가가치세가 포함되지 않은 금액이다.\n① 610,000원\n② 810,000원\n③ 1,000,000원\n④ 1,010,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 73, "text": "[73]다음 중 부가가치세법상 과세기간에 관한 설명으로 옳지 않은 것은?\n① 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일까지를 최종 과세기간으로 한다.\n② 간이과세자의 경우 과세기간을 1월 1일부터 12월 31일로 한다.\n③ 신규사업자가 사업개시일 전에 사업자등록을 신청한 경우에도 사업개시일부터 그 신청일이 속하는\n과세기간의 종료일까지를 최초 과세기간으로 한다.\n④ 일반과세자의 경우 부가가치세의 과세기간은 1년을 2개의 과세기간으로 나누어, 매 6개월마다 확\n정신고 납부하도록 하고 있다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 74, "text": "[74]다음 중 부가가치세법상 사업장에 관한 설명으로 옳지 않은 것은?\n① 재화의 보관 관리 시설만을 갖춘 장소로서 사업자가 관할세무서장에게 그 설치신고를 한 하치장은\n사업장이 아니다.\n② 무인자동판매기를 통하여 재화·용역을 공급하는 사업은 그 사업에 관한 업무총괄장소를 사업장으로\n한다.\n③ 부동산임대업은 그 부동산의 등기부상의 소재지를 사업장으로 한다.\n④ 기존 사업장을 가지고 있는 사업자가 기존 사업장 외에 각종 경기대회나 박람회 등 행사가 개최되는\n장소에서 임시로 사업장을 개설하는 경우 그 임시사업장은 항상 기존 사업장에 포함되지 않고, 새로\n운 사업장에 해당하는 것으로 해야 한다.", "answer": 4}, {"year": "2025", "month": "1", "qnum": 75, "text": "[75]다음 중 간주공급에 관한 설명으로 옳지 않은 것은?\n① 주사업장 총괄납부 사업자가 판매목적 타사업장 반출시 세금계산서를 발급하고 부가가치세법상 신고\n규정에 따라 신고해야 한다.\n② 간주공급 중 개인적공급에 해당할 경우 세금계산서 발급의무가 면제된다.\n③ 사업을 위하여 무상으로 다른 사업자에게 인도 또는 양도하는 견본품은 사업상 증여에 해당하지 아\n니한다.\n④ 간주공급 중 면세전용의 공급시기는 재화를 사용하거나 소비하는 때이다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 76, "text": "[76]다음 중 2025년 제2기 예정신고시 부가가치세 과세표준 금액이 다른 회사는(단, 보기 이외의 다른 거\n래는 없으며 세금계산서는 부가가치세법상 원칙적인 교부시기에 발급했다고 가정한다)?\n① ㈜서울 : 2025년 7월 15일에 제빵기계 1대를 3,000,000원에 외상판매하였다.\n② ㈜부산 : 2025년 7월 1일에 제빵기계 1대를 3,000,000원에 할부판매하고 대금은 당월부터 30개월\n에 거쳐 매월 100,000원씩 받기로 하였다.\n③ ㈜대구 : 2025년 8월 1일에 제빵기계 1대를 3,000,000원에 할부판매하고 대금은 당월부터 5개월\n에 거쳐 매월 600,000원씩 받기로 하였다.\n④ ㈜광주 : 2025년 9월 7일에 매출부진으로 폐업하였다. 폐업시에 남아있던 재고자산의 시가는\n3,000,000원이였으며, 이는 10월 3일에 2,000,000원에 처분되었다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 77, "text": "[77]다음은 김삼일씨의 2025년 12월 가계부 지출내역이다. 지출금액에 포함된 부가가치세의 합계는 얼마인\n가(단, 공급자는 부가가치세법에 따라 적정하게 부가가치세를 거래징수하였다고 가정한다)?\n일자 적요 금액\n12월 1일 국민주택 월세 770,000원\n12월 10일 전쟁기념관 입장권 11,000원\n12월 11일 배추 22,000원\n12월 13일 김포에서 제주 간 비행기표 330,000원\n12월 15일 피부과 레이저시술 110,000원\n① 10,000원\n② 30,000원\n③ 40,000원\n④ 41,000원", "answer": 3}, {"year": "2025", "month": "1", "qnum": 78, "text": "[78]부가가치 과세사업을 영위하던 제조업자 김삼일씨는 2025년 10월 10일 당해 사업을 폐지하였다. 다음\n폐업시 잔존재화 자료를 기초로 부가가치세 과세표준을 계산하면 얼마인가?\n구분 취득일 취득원가 시가\n제품 2025년 3월 17일 20,000,000원 30,000,000원\n토지 2021년 1월 10일 100,000,000원 200,000,000원\n건물 2019년 3월 10일 300,000,000원 400,000,000원\n① 30,000,000원\n② 135,000,000원\n③ 430,000,000원\n④ 630,000,000원", "answer": 2}, {"year": "2025", "month": "1", "qnum": 79, "text": "[79]다음 중 세금계산서의 기능으로 옳지 않은 것은?\n① 청구서 또는 영수증\n② 부가가치세를 징수하였음을 증명하는 세금영수증\n③ 재화 및 용역의 공급계약서\n④ 거래여부를 확인하는 거래증빙자료 또는 기장의 기초자료", "answer": 3}, {"year": "2025", "month": "1", "qnum": 80, "text": "[80]다음은 ㈜삼일의 2025년 제2기 부가가치세 확정신고를 위한 자료이다. (ㄱ)에 들어갈 금액은 얼마인\n가?\n가. 국내판매분\n- 세금계산서 발행매출액 20,000,000원(부가가치세 제외금액)\n- 신용카드매출전표 발행분 11,000,000원(부가가치세 포함금액)\n나. 구매확인서에 의한 수출 30,000,000원\n다. 직수출분 22,000,000원\n<신고내용>\n구분 금액 세율 세액\n세금계산서 발급분 10/100\n매입자발행세금계산서 10/100\n과세표준 과세\n신용카드 현금영수증 발행분 10/100\n및\n기타(정규영수증 외 수취분) 10/100\n매출세액\n세금계산서 발급분 (ㄱ) 0/100\n영세율\n기타 0/100\n① 30,000,000원\n② 31,000,000원\n③ 60,000,000원\n④ 61,000,000원\n\n< 원가관리회계 >", "answer": 1}, {"year": "2025", "month": "3", "qnum": 54, "text": "[54]㈜삼일의 담당 회계사인 김삼일 회계사가 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월\n31일) 기업업무추진비에 대하여 자문한 내용으로 옳지 않은 것은?\n① 기업업무추진비 관련 부가가치세 매입세액 불공제액과 현물로 제공한 기업업무추진비에 대한 부가가\n치세 매출세액은 기업업무추진비로 간주합니다.\n② 문화관련 기업업무추진비 한도액 계산은 문화관련 기업업무추진비 지출액과 일반기업업무추진비 한\n도액의 20 % 중 작은 금액으로 합니다.\n③ 기업업무추진비를 금전 아닌 현물로 제공한 경우에는 장부가액이 아닌 시가를 기업업무추진비로 보\n아야 합니다.\n④ 2024년 12월에 기업업무추진비를 신용카드로 결제하고, 2025년 1월에 신용카드 대금을 지급한 경\n우에는 이를 2024년 기업업무추진비로 처리하여야 합니다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 71, "text": "[71]다음 중 부가가치세법에 관한 설명으로 옳은 것은?\n① 부가가치세는 특정한 재화 또는 용역만 과세하는 개별소비세에 해당한다.\n② 매출액에서 매입액을 차감하여 부가가치를 계산한 후 부가가치에 세율을 곱하는 방식으로 세액을 계\n산하는 전단계거래액공제법을 채택하고 있다.\n③ 재화나 용역의 공급 및 재화의 수입은 공급자 및 수입자가 사업자가 아니라도 부가가치세가 과세된\n다.\n④ 부가가치세는 국제적 이중과세문제를 해결하기 위해서 소비지국 과세원칙을 채택하고 있다.", "answer": 4}, {"year": "2025", "month": "3", "qnum": 72, "text": "[72]다음 중 부가가치세 납세의무자인 사업자에 관한 설명으로 옳지 않은 것은?\n① 면세사업자는 부가가치세법에 따른 사업자등록의무가 없다.\n② 영세율을 적용받는 사업자는 부가가치세법상의 사업자등록의무가 있다.\n③ 비영리법인은 공익적인 사업을 하므로 부가가치세 납세의무가 없다.\n④ 과세사업과 면세사업을 겸영하는 자를 겸영사업자라 하며, 겸영사업자도 부가가치세 납세의무가 있\n다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 73, "text": "[73]다음 중 부가가치세법상 과세기간에 관한 설명으로 옳은 것은?\n① 간이과세자가 간이과세를 포기함으로써 일반과세자로 되는 경우 그 적용을 받고자 하는 달의 전달\n마지막 날까지 간이과세 포기신고를 해야 한다.\n② 간이과세자의 과세기간은 1년을 2과세기간으로 나누어 6개월마다 신고 납부하도록 하고 있다.\n③ 폐업자는 폐업일이 속하는 과세기간 개시일부터 폐업일이 속하는 월의 말일까지를 최종 과세기간으\n로 한다.\n④ 부가가치세의 과세기간은 1년을 4개의 과세기간으로 나누어, 3개월마다 신고 납부하도록 하고 있\n다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 74, "text": "[74]다음 중 부가가치세법상 납세지인 사업장에 관한 설명으로 옳은 것은?\n① 직매장과 하치장은 별도의 사업장으로 본다.\n② 건설업은 사업자가 법인인 경우 그 법인의 등기부상의 소재지를 사업장으로 본다.\n③ 비거주자 또는 외국법인은 비거주자 또는 외국법인의 본점인 국외사업장을 사업장으로 본다.\n④ 임시사업장을 폐쇄하였을 때에는 그 폐쇄일부터 30일 이내에 임시사업장 폐쇄신고서를 그 임시사업\n장 관할세무서장에게 제출하여야 한다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 75, "text": "[75]다음 중 부가가치세법상 과세대상 거래에 관한 설명으로 옳지 않은 것은?\n① 사업자가 자기재화의 판매촉진을 위해서 거래상대방의 판매실적에 따라 일정률의 장려금품을 재화로\n제공하는 것은 재화의 공급으로 본다.\n② 사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화를 수선비에 대체하여 사용하거나 소비하\n는 경우에는 재화의 공급으로 보지 않는다.\n③ 사업자가 자기의 사업과 관련하여 사업장 내에서 그 사용인에게 음식용역을 무상으로 제공하는 것은\n용역의 자가공급으로 보아 부가가치세를 과세한다.\n④ 사업자가 자기의 사업과 관련하여 생산하거나 취득한 재화를 자기의 다른 사업장에 판매목적으로 반\n출하는 경우에도 사업자 단위 과세 사업자로 적용을 받는 과세기간인 경우에는 재화의 공급으로 보\n지 아니한다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 76, "text": "[76]다음은 핸드폰을 판매하는 ㈜삼일의 거래내역이다. 제1기 예정신고서 및 확정신고서의 과세표준을 계\n산하면 얼마인가?\n가. 2월 5일 : 핸드폰을 200,000원에 판매함\n나. 3월 6일 : 핸드폰을 600,000원에 할부판매하고\n대금을 당월부터 매월 100,000원씩 회수함\n다. 3월 15일 : 핸드폰을 2,000,000원에 할부판매하고,\n대금을 당월부터 매월 100,000원씩 회수함\n예정신고 확정신고\n① 400,000원 600,000원\n② 500,000원 600,000원\n③ 900,000원 300,000원\n④ 2,800,000원 0원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 77, "text": "[77]다음은 김삼일씨의 2025년 1월 가계부 지출내역이다. 지출금액에 포함된 부가가치세의 합계는 얼마인\n가(단, 공급자는 부가가치세법에 따라 적정하게 부가가치세를 거래징수하였다고 가정한다)?\n일자 적요 금액*\n1월 7일 쌀 구입비 330,000원\n1월 10일 의류 구입비 440,000원\n1월 20일 도서 구입비 110,000원\n1월 25일 주택 임대료 220,000원\n1월 31일 전자제품 구입비 550,000원\n* 부가가치세 과세대상은 부가가치세가 포함된 금액임\n① 70,000원\n② 80,000원\n③ 90,000원\n④ 120,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 78, "text": "[78]다음 자료를 이용하여 과세사업을 영위하는 ㈜삼일의 2025년 제2기 예정신고기간의 부가가치세 과세표\n준을 구하면 얼마인가?\n가. 특수관계 없는 자에 대한 외상매출액 100,000,000원\n(매출에누리 10,000,000원, 매출할인 20,000,000원이 차감되어 있음)\n나. 특수관계인에 대한 재화매출액(시가 20,000,000원) 10,000,000원\n다. 상가건물 처분액 500,000,000원\n라. 하치장 용도로 사용하던 토지의 처분액 30,000,000원\n① 600,000,000원\n② 610,000,000원\n③ 620,000,000원\n④ 640,000,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 79, "text": "[79]과세사업과 면세사업을 영위하는 ㈜삼일은 두 사업에 공통으로 사용할 목적으로 기계장치를 1억원에 매\n입(매입일 2025년 3월 28일, 공통매입세액 10,000,000원)하였다. 과세기간별 공급가액이 다음과 같을\n때 2025년 제1기 확정신고시 불공제매입세액은 얼마인가(단, 제1기 예정신고는 부가가치세법에 따라\n적법하게 이루어진 것으로 가정함)?\n(2025.1.1. ~ (2025.4.1. ~\n구분 합계\n2025.3.31.) 2025.6.30.)\n과세사업 3 억 2 억 5 억\n면세사업 7 억 8 억 15억\n합계 10억 10억 20억\n① 500,000원\n② 7,000,000원\n③ 7,500,000원\n④ 8,000,000원", "answer": 1}, {"year": "2025", "month": "3", "qnum": 80, "text": "[80]다음 중 부가가치세법상 가산세와 관련된 설명으로 옳지 않은 것은?\n① 세금계산서의 발급기한이 지난 후 해당 재화 또는 용역의 공급시기가 속하는 과세기간에 대한 확정\n신고기한까지 세금계산서를 발급한 경우 가산세는 해당 공급가액의 1 % 이다.\n② 전자세금계산서 발급의무자가 발급기간 내에 종이세금계산서를 발급할 경우 가산세는 해당 공급가액\n의 1 % 이다.\n③ 재화 또는 용역을 공급 ․ 매입하지 아니하고 세금계산서를 발급하거나 발급받는 경우 가산세는 해당\n공급가액의 3 % 이다.\n④ 사업개시일부터 20일 이내에 사업자등록을 신청하지 아니한 경우 가산세는 사업개시일부터 등록을\n신청한 날의 직전일까지의 공급가액의 2 % 이다.\n\n< 원가관리회계 >", "answer": 4}, {"year": "2025", "month": "5", "qnum": 41, "text": "[41]다음 중 조세의 분류에 관한 설명으로 옳지 않은 것은?\n① 조세는 과세권자에 따라 국세와 지방세로 분류한다.\n② 교육세는 조세의 사용용도를 특정하여 징수하는 목적세에 해당한다.\n③ 부가가치세는 납세자의 인적사항이 고려되는 인세(人稅)에 해당한다.\n④ 소득세는 입법상 조세부담의 전가를 예상하지 아니한 조세이므로 직접세에 해당한다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 71, "text": "[71]다음 중 부가가치세와 관련하여 옳지 않은 주장을 하는 사람은 누구인가?\n① 김철수 : 사업자란 사업목적이 영리이고 사업상 독립적으로 재화 또는 용역을 공급하는 자를\n말합니다.\n② 박다혜 : 부가가치세 과세사업자는 일반과세자와 간이과세자로 구분됩니다.\n③ 김
