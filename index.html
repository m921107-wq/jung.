,000,000원\n*당기에 소멸시효가 완성된 채권\nㄴ. 전기 대손충당금 부인액 3,000,000원\nㄷ. 당기 말 세법상 대손충당금 설정대상 채권금액 500,000,000원\nㄹ. 당기 대손실적률은 2 % 임\n<자료2> 자본금과 적립금조정명세서(을)\n당기중증감\n과목 또는 사항 기초잔액 기말잔액\n감소 증가\n대손충당금한도초과액 3,000,000 (ㄱ) xxx (ㄴ)\n(ㄱ) (ㄴ)\n① 0 22,000,000\n② 3,000,000 22,000,000\n③ 0 12,000,000\n④ 3,000,000 12,000,000", "answer": 4}, {"year": "2025", "month": "1", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 사업연도는 법령이나 법인의 정관 등에서 정하는 1회계기간으로 하되 그 기간은 1년을 초과하지 못\n한다.\n② 법령이나 정관 등에 사업연도에 관한 규정이 없는 내국법인은 따로 사업연도를 정하여 법인 설립신\n고 또는 사업자등록과 함께 납세지 관할 세무서장에게 사업연도를 신고하여야 하며, 신고하지 않은\n경우에는 매년 1월 1일부터 12월 31일까지를 그 법인의 사업연도로 한다.\n③ 최초 사업연도의 개시일전에 생긴 손익을 사실상 그 법인에 귀속시킨 것이 있는 경우 조세포탈의 우\n려가 없을 때에는 최초 사업연도의 기간이 1년을 초과하지 아니하는 범위 내에서 이를 당해 법인의\n최초 사업연도의 손익에 산입할 수 있으며, 이 경우 최초 사업연도의 개시일은 당해 법인의 설립등\n기일이다.\n④ 사업연도를 변경하려는 법인은 그 법인의 직전 사업연도 종료일부터 3개월 이내에 납세지 관할 세\n무서장에게 이를 신고하여야 한다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 49, "text": "[49]다음 중 법인세법상 손금불산입 항목에 관한 설명으로 옳은 것은?\n① 업무무관부동산의 취득세는 손금불산입하여 기타사외유출로 소득처분한다.\n② 업무무관부동산의 감가상각비는 손금불산입하여 유보로 소득처분한다.\n③ 2016년 1월 1일 이후 개시하는 사업연도에 취득한 업무용승용차의 감가상각비는 감가상각에 관한\n규정에도 불구하고 정률법을 상각방법으로 하고, 내용연수를 5년으로 하여 계산한 금액을 손금에\n산입하여야 한다.\n④ 파손으로 인한 재고자산평가차손은 손금불산입하여 유보로 소득처분한다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 50, "text": "[50]㈜삼일(사업연도 : 1월 1일 ~ 12월 31일)은 당기손익인식 금융자산인 상장법인 주식의 취득, 보유,\n처분과 관련하여 다음과 같이 회계처리하였다. 이 경우 필요한 세무조정 및 소득처분으로 옳은 것은?\n일 자 회계처리\n2025년 (차) 당기손익인식 금융자산 1,000,000원 (대) 현 금 1,000,000원\n1월 1일\n2025년 (차) 당기손익인식 금융자산 500,000원 (대) 금융자산평가이익(영업외수익) 500,000원\n12월 31일\n2026년 (차) 현 금 1,500,000원 (대) 당기손익인식 금융자산 1,500,000원\n3월 1일\n① 세무조정 필요없음\n② 2025년 : (익금불산입) 500,000원 (△유보)\n2026년 : (익금산입) 500,000원 (유보)\n③ 2025년 : (익금산입) 500,000원 (유보)\n2026년 : (손금산입) 500,000원 (△유보)\n④ 2025년 : (익금산입) 500,000원 (기타), 익금불산입 500,000원 (△유보)\n2026년 : (익금산입) 500,000원 (유보), 익금불산입 500,000원 (기타)", "answer": 2}, {"year": "2025", "month": "1", "qnum": 57, "text": "[57]다음 중 준비금 및 충당금에 관한 설명으로 옳은 것은?\n① 해약환급금 준비금은 증권회사가 설정대상이다.\n② 고유목적사업준비금은 세무조정에 의하여 손금에 산입할 수 없다.\n③ 준비금은 손금에 산입한 후 환입하거나 비용과 상계하기 때문에 손금에 산입하는 사업연도에는 조세\n부담을 경감시키고 환입하거나 상계하는 연도에 조세부담을 증가시키게 된다.\n④ 비영리내국법인의 고유목적사업준비금은 조세특례제한법에 근거하고 있다.", "answer": 3}, {"year": "2025", "month": "3", "qnum": 45, "text": "[45]㈜삼일은 2025년부터 사업연도를 변경하기로 하고 2025년 4월 18일에 사업연도 변경신고를 하였다.\n다음 중 법인세법상 사업연도의 구분으로 옳은 것은(단, ㈜삼일은 법령에 따라 사업연도가 정해지는 법\n인이 아님)?\n가. 변경 전 사업연도(24기) : 2024년 1월 1일 ~ 2024년 12월 31일\n나. 변경하려는 사업연도 : 7월 1일 ~ 다음연도 6월 30일\n① 제25기 : 2025년 1월 1일 ~ 2025년 4월 18일\n② 제25기 : 2025년 1월 1일 ~ 2025년 6월 30일\n③ 제25기 : 2025년 1월 1일 ~ 2025년 12월 31일\n④ 제25기 : 2025년 4월 19일 ~ 2025년 12월 31일", "answer": 3}, {"year": "2025", "month": "3", "qnum": 47, "text": "[47]㈜삼일은 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 사업연도 중에 보유하던 토지 A의 30 % 를\n시가에 양도하였다. 토지 A에 대한 제24기 사업연도 자본금과적립금조정명세서(을)의 내역과 제25기\n양도시점의 회계처리는 다음과 같다. 토지 A의 양도와 관련하여 제25기의 필요한 세무조정으로 옳은\n것은?\n가. 자본금과적립금조정명세서(을)\n과목 또는 사항 기초 감소 증가 기말\n토지 A 10,000,000 - 10,000,000 20,000,000\n나. 회계처리\n(차) 현금 31,000,000원 (대) 토지 30,000,000원\n유형자산처분이익 1,000,000원\n① (익금산입) 3,000,000원 (유보)\n② (손금산입) 3,000,000원 (△유보)\n③ (익금산입) 6,000,000원 (유보)\n④ (손금산입) 6,000,000원 (△유보)", "answer": 4}, {"year": "2025", "month": "3", "qnum": 48, "text": "[48]다음 자료는 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일) 손익계산서에 비용처\n리된 내역이다. 이 중 법인세법상 각 사업연도 소득금액 계산시 손금불산입으로 세무조정할 금액은 얼\n마인가?\n가. 법인지방소득세 1,000,000원\n나. 업무용승용차 관련 비용 중 업무미사용금액 2,000,000원\n다. 파견근로자를 위해서 지출한 직장체육비 3,000,000원\n라. 납품계약 위반으로 인한 지체상금 4,000,000원\n마. 제조물책임법에 따라 지급한 손해배상액(단, 실제 발생한 손해는 3,000,000원임) 5,000,000원\n① 3,000,000원\n② 5,000,000원\n③ 7,000,000원\n④ 8,000,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각범위액에 관한 설명으로 옳지 않은 것은?\n① 감가상각비는 결산조정사항이므로 한국채택국제회계기준을 도입하여 결산상 감가상각비가 감소한 경\n우에도 신고조정으로 손금산입하는 것은 불가능하다.\n② 사업연도 중 양도한 자산에 대해서는 법인세법상 감가상각비 시부인을 하지 않는다.\n③ 사업연도 중에 취득하여 사업에 사용한 감가상각자산의 상각범위액은 사업에 사용한 날부터 당해 사\n업연도 종료일까지 월수에 따라 계산한다.\n④ 감가상각자산에 대한 자본적 지출액은 감가상각자산의 장부가액에 합산하여 그 자산의 내용연수를\n그대로 적용하여 감가상각해야 한다.", "answer": 1}, {"year": "2025", "month": "3", "qnum": 52, "text": "[52]다음은 ㈜삼일의 기계장치 A(제22기 신규취득 자산임)의 감가상각비와 관련된 자료이다. 이 자료 관련\n세무조정사항이 각 사업연도 소득금액에 미치는 영향으로 옳은 것은(단, 감가상각의제 대상이 아님)?\n구 분 제22기 제23기 제24기\n회사계상 감가상각비 3,000,000원 0원 2,000,000원\n세법상 상각범위액 1,000,000원 1,000,000원 1,000,000원\n제 22기 제 23기 제 24기\n① 영향 없음 영향 없음 영향 없음\n② 2,000,000원 증가 1,000,000원 감소 1,000,000원 증가\n③ 2,000,000원 증가 영향 없음 1,000,000원 증가\n④ 영향 없음 1,000,000원 감소 영향 없음", "answer": 2}, {"year": "2025", "month": "3", "qnum": 53, "text": "[53]다음은 ㈜삼일의 제1기 사업연도(2024년 1월 1일 ~ 2024년 12월 31일)와 제2기 사업연도(2025년 1월\n1일 ~ 2025년 12월 31일)의 일반기부금지출액과 일반기부금한도액(전기한도초과이월분 손금산입액을\n공제하기 전의 금액)에 대한 자료이다.\n사업연도 일반기부금지출액 일반기부금한도액\n제1기 50,000,000원 30,000,000원\n제2기 30,000,000원 40,000,000원\n일반기부금 세무조정이 ㈜삼일의 제1기 사업연도와 제2기 사업연도의 각 사업연도 소득금액에 미치는\n순영향으로 옳은 것은?\n제 1기 제 2기\n① 영향 없음 영향 없음\n② 20,000,000원 증가 영향 없음\n③ 20,000,000원 증가 10,000,000원 감소\n④ 20,000,000원 감소 10,000,000원 증가", "answer": 3}, {"year": "2025", "month": "3", "qnum": 58, "text": "[58]㈜삼일은 2025년 7월 1일 대표이사 김삼일에게 시가 5억원, 장부가액인 3억원인 토지를 4억원에 매\n도하고 다음과 같이 회계처리하였다. 다음 중 해당 토지 처분과 관련하여 제25기 사업연도(2025년 1\n월 1일 ~ 12월 31일)에 필요한 세무조정으로 옳은 것은?\n(차) 현금 4억원 (대) 토지 3억원\n유형자산처분이익 1억원\n① (익금산입) 저가양도 1억원 (상여)\n② (익금산입) 저가양도 1억원 (상여)\n(손금산입) 토지 1억원 (△유보)\n③ (익금산입) 토지 1억원 (유보)\n④ (손금산입) 토지 1억원 (△유보)", "answer": 1}, {"year": "2025", "month": "5", "qnum": 46, "text": "[46]세무조정계산서 중에서 세무상 순자산(자기자본)을 나타내는 법정서식은 어느 것인가?\n① 법인세 과세표준 및 세액조정계산서\n② 소득금액조정합계표\n③ 자본금과 적립금 조정명세서(갑)\n④ 자본금과 적립금 조정명세서(을)", "answer": 3}, {"year": "2025", "month": "5", "qnum": 52, "text": "[52]㈜삼일(법인세를 감면․면제받는 법인이 아니며, 한국채택국제회계기준을 적용하지 않음)의 감가상각비\n관련 자료이다. 감가상각비에 대한 세무조정을 할 경우 각 사업연도 소득금액에 미치는 영향으로 옳은\n것은?\n(단위：원)\n구 분 건 물 기계장치 비 품\n전기상각부인액 1,000,000원 3,000,000원 -\n당기감가상각비계상액 1,300,000원 6,200,000원 2,000,000원\n당기상각범위액 2,000,000원 5,000,000원 2,400,000원\n① 100,000원 증가\n② 100,000원 감소\n③ 500,000원 증가\n④ 500,000원 감소", "answer": 3}, {"year": "2025", "month": "5", "qnum": 58, "text": "[58]다음은 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 법인세 신고 관련 자료이다. 제25기\n의 세무조정이 각 사업연도 소득금액에 미치는 영향으로 옳은 것은?\n(1) 2025년 1월 10일에 대주주 김한강 씨로부터 시가 10,000,000원인 건물을 30,000,000원에\n매입하고 다음과 같이 회계처리하였다.\n(차) 건 물 30,000,000원 (대) 현 금 30,000,000원\n(2) 2025년 12월 31일에 건물에 대하여 다음과 같이 감가상각비를 계상하였다.\n(차) 감가상각비 3,000,000원 (대) 감가상각누계액 3,000,000원\n건물의 신고내용연수는 10년이며, 정액법을 적용한다.\n① 2,000,000원 증가\n② 3,000,000원 증가\n③ 20,000,000원 증가\n④ 23,000,000원 증가", "answer": 1}, {"year": "2025", "month": "5", "qnum": 59, "text": "[59]㈜삼일은 2025년에 신규사업에 진출하면서 기존의 6월말이었던 결산일을 12월말로 변경하였다. ㈜삼일\n의 사업연도 변경내용과 과세표준이 다음과 같을 때 제13기 사업연도의 산출세액을 계산하면 얼마인가\n(단, 법인세 세율은 과세표준 2억원 이하 9 % 이고, 2억원 초과 200억원 이하 19 % 이다)?\n(1) 사업연도 변경내용\n<제12기> <제13기> <제14기> <제15기>\n2024.7.1 2025.7.1 2026.1.1 2027.1.1 2028.1.1\n2025.8.30. 사업연도 변경신고\n(2) 제13기 사업연도 과세표준 : 200,000,000원\n① 18,000,000원\n② 24,000,000원\n③ 28,000,000원\n④ 30,000,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 46, "text": "[46]다음 중 소득의 귀속자에게 소득세가 부과되지 않는 소득처분은 무엇인가?\n① 배당\n② 기타소득\n③ 기타\n④ 상여", "answer": 3}, {"year": "2025", "month": "6", "qnum": 50, "text": "[50]제조업을 영위하는 ㈜삼일은 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 9월 1일에 ㈜용산은행에\n서 1년 만기 정기예금(만기 : 2026년 8월 31일)에 가입하였다. 만기시 정기예금이자는 120,000,000원\n이며, ㈜삼일이 제25기 결산시 기간경과분 이자수익 40,000,000원을 영업외수익으로 계상한 경우 제\n25기 세무조정으로 옳은 것은(단, 정기예금이자는 원천징수 대상에 해당한다)?\n① (익금산입) 미수이자 40,000,000원 (유보)\n② (익금불산입) 미수이자 40,000,000원 (△유보)\n③ (익금불산입) 미수이자 160,000,000원 (△유보)\n④ (익금산입) 미수이자 160,000,000원 (유보)", "answer": 2}, {"year": "2025", "month": "6", "qnum": 52, "text": "[52]다음 자료에 의한 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 사업연도의 세무조정을 할\n경우 해당 세무조정이 각 사업연도 소득금액에 미치는 영향으로 옳은 것은?\n구분 건물 비품 차량운반구\n내 용 연 수 40년 5년 5년\n회사계상 상각비 6,000,000원 5,000,000원 2,000,000원\n세법상 상각범위액 7,000,000원 3,500,000원 1,400,000원\n전기이월상각 부인액 1,200,000원 600,000원 -\n① 영향 없음\n② 500,000원 감소\n③ 900,000원 증가\n④ 1,100,000원 증가", "answer": 4}, {"year": "2025", "month": "6", "qnum": 56, "text": "[56]다음은 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일)의 세무조정 자료이다. 이\n자료로 세무조정을 할 경우 손금산입으로 세무조정할 금액은 얼마인가?\n가. 상법에 따라 2025년 7월 1일에 소멸시효가 완성된 외상매출금 1,000,000원이 있으나, 이를\n당기에 대손처리하지 않고 장부상 채권으로 남겨두었다.\n나. 2025년 2월 1일에 부도가 발생한 어음상의 채권 2,000,000원이 있으나, 이를 당기에 대손\n처리하지 않고 장부상 채권으로 남겨두었다. 소멸시효는 완성되지 아니하였다.\n다. 2025년 10월 1일 채무자의 사망으로 회수가 불가능한 채권 3,000,000원을 당기에 대손처리\n하지 않고 장부상 채권을 남겨두었다.\n① 1,000,000원\n② 2,000,000원\n③ 3,000,000원\n④ 4,000,000원", "answer": 1}, {"year": "2025", "month": "6", "qnum": 58, "text": "[58]㈜삼일은 2025년 7월 1일 개인대주주에게 시가 5억원인 토지를 장부가액인 3억원에 매도하고 다음과\n같이 회계처리 하였다. 다음 중 해당 토지 처분과 관련하여 2025년에 필요한 세무조정으로 옳은 것은?\n(차) 현 금 3억원 (대) 토 지 3억원\n① (익금산입) 저가양도 2억원 (배당)\n② (익금산입) 저가양도 2억원 (배당)\n(손금산입) 토지 2억원 (△유보)\n③ (익금산입) 토지 2억원 (유보)\n④ (익금산입) 토지 2억원 (△유보)", "answer": 1}, {"year": "2025", "month": "6", "qnum": 59, "text": "[59]다음 중 법인세법상 과세표준의 계산에 관한 설명으로 옳지 않은 것은?\n① 자산수증이익이나 채무면제이익에 의해 충당된 이월결손금은 과세표준 계산시 공제할 수 없다.\n② 과세표준은 각 사업연도 소득금액에서 이월결손금, 소득공제, 비과세소득을 순서대로 차감하여 계산\n한다.\n③ 공제대상 이월결손금은 각 사업연도 소득금액의 80 %(중소기업과 회생계획 이행 중인 기업 등은 100\n%)의 범위에서 공제한다.\n④ 각 사업연도 소득금액에서 이월결손금을 공제한 금액을 초과하는 비과세소득은 다음 사업연도로 이\n월되지 않고 소멸한다.", "answer": 2}, {"year": "2025", "month": "6", "qnum": 60, "text": "[60]다음 중 법인세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 법인세 납세의무가 있는 내국법인은 각 사업연도 종료일이 속하는 달의 말일로부터 3개월 이내에\n법인세 과세표준과 세액을 신고하는 것을 원칙으로 한다.\n② 법인세 과세표준 신고시 필수적 첨부서류인 개별법인의 재무상태표, 포괄손익계산서, 이익잉여금처\n분(결손금처리)계산서, 법인세 과세표준 및 세액조정계산서를 첨부하여야 한다.\n③ 내국법인으로서 각 사업연도 소득금액이 없거나 결손금이 있는 법인의 경우에도 법인세 과세표준 신\n고를 하여야 한다.\n④ 각 사업연도의 기간이 6개월을 초과하는 법인은 사업연도 개시일부터 6개월간을 중간예납기간으로\n하여 중간예납기간이 지난 날로부터 3개월 이내에 그 기간에 대한 법인세를 납부해야 한다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 48, "text": "[48]다음 자료는 ㈜삼일의 손익계산서에 비용처리된 내역이다. 이 중 법인세법상 각 사업연도 소득금액 계\n산시 손금불산입으로 세무조정할 금액을 계산하면 얼마인가?\n⋅ 법인지방소득세 2,000,000원\n⋅ 직원의 업무 수행과 관련하여 발생한 교통사고 벌과금 500,000원\n⋅ 납품계약위반으로 인한 지체상금 1,500,000원\n⋅ 미술품 구입비용(환경미화를 위하여 사무실에 비치함) 5,000,000원\n① 2,000,000원\n② 2,500,000원\n③ 4,000,000원\n④ 5,500,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 54, "text": "[54]다음은 제조업을 영위하는 ㈜삼일(중소기업이 아님)의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12\n월 31일)의 기업업무추진비에 관한 자료이다. 기업업무추진비 세무조정금액 중 기타사외유출 소득처분\n으로 인한 소득금액 변동금액은 얼마인가(단, 수입금액 기준 접대비 한도는 수입금액 100억원 이하 :\n0.3 %, 100억원 초과 500억원 이하 : 0.2 %, 500억원 초과 : 0.03 % 이다)?\n가. 기업업무추진비 지출액 : 100,000,000원(기업업무추진비로 신용카드 등 법정증빙을 사용하지\n않고 영수증을 받은 1건 5,000,000원과 대표이사 사적사용경비 1건\n5,000,000원 포함)\n나. 매출액 : 35,000,000,000원(특수관계인간 거래 5,000,000,000원 포함)\n① 5,000,000원 증가\n② 10,000,000원 증가\n③ 12,000,000원 증가\n④ 17,000,000원 증가", "answer": 3}, {"year": "2025", "month": "7", "qnum": 60, "text": "[60]다음 중 법인세 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 기납부세액은 중간예납세액, 원천징수된 세액 및 수시부과세액을 의미하며, 이는 사업연도 중에 납\n부한 세액이므로 총부담할 세액에서 이를 차감하여 납부세액을 구한다.\n② 원천징수한 세액은 징수일이 속하는 달의 다음달 10일까지 납세지 관할세무서장에게 납부하여야 한\n다.\n③ 사업연도의 기간이 6개월을 초과하는 법인은 해당 사업연도 개시일부터 6개월간을 중간예납기간으\n로 하여 중간예납기간이 지난 날부터 3개월 이내에 그 기간에 대한 법인세를 신고·납부해야 한다.\n④ 법인세 납세의무가 있는 내국법인은 각 사업연도 소득금액이 없거나 결손금이 있는 경우에도 과세표\n준과 세액을 신고해야 한다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 46, "text": "[46]다음 자료를 바탕으로 중소기업인 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 각 사업연\n도 소득금액을 계산하면 얼마인가(단, 전기까지의 세무조정은 적절히 하였다고 가정한다)?\n1. 제25기의 손익계산서\n손익계산서\n㈜삼일 2025년 1월 1일 ~ 2025년 12월 31일 (단위 : 원)\n매 출 액 1,700,000,000\n매 출 원 가 1,100,000,000\n(중략) …\n급 여 190,000,000\n세 금 과 공 과 14,000,000\n이 자 비 용 30,000,000\n(중략) …\n법 인 세 비 용 차 감 전 순 이 익 220,000,000\n2. 세무조정 관련 추가정보\n가. 매출액과 매출원가에는 제25기 거래인 매출액 20,000,000원과 매출원가\n16,000,000원이 누락되어있다.\n나. 급여에는 세법상 임원상여금 한도초과액 30,000,000원이 포함되어 있다.\n다. 세금과공과에는 세법상 손금불산입금액 4,000,000원이 포함되어 있다.\n라. 이자비용에는 세법상 손금불산입금액 10,000,000원이 포함되어 있다.\n마. 법인세비용은 20,000,000원이고, 제20기에 발생한 세무상 이월결손금은\n5,000,000원이다.\n① 253,000,000원\n② 268,000,000원\n③ 273,000,000원\n④ 278,000,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 49, "text": "[49]㈜삼일(제조업 영위)은 2025년 1월 20일에 대표이사가 사용하는 업무용승용차를 75,000,000원에 취득\n하였다. ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일)의 업무용승용차 관련 비용\n(판매비와 관리비로 처리함)은 다음과 같다.\n감가상각비 8,000,000원\n기타 비용 10,000,000원\n㈜삼일은 업무전용자동차보험에 가입하였고, 운행기록부는 작성하지 않았다. ㈜삼일이 업무용승용차 관\n련비용과 관련하여 상여로 소득처분해야 하는 세무조정금액은 얼마인가?\n① 없음\n② 3,000,000원\n③ 10,000,000원\n④ 15,000,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 50, "text": "[50]제조업을 영위하는 ㈜삼일은 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일) 7월 1일에 1년\n만기 정기적금(이자는 만기 수령조건)에 가입하였다. 당해 적금의 만기시 이자수령액은 12,000,000원이\n고, 회사는 제25기 기말 결산시 손익계산서에 기간경과분 이자수익(월할계산함)을 계상하였다. 이러한\n회계처리에 대한 회사의 제26기 사업연도의 세무조정으로 옳은 것은(단, 정기적금 이자는 원천징수 대\n상에 해당한다)?\n① (익금산입) 이자수익 6,000,000원 (유보)\n② (익금불산입) 이자수익 6,000,000원 (△유보)\n③ (익금산입) 이자수익 12,000,000원 (유보)\n④ (익금불산입) 이자수익 12,000,000원 (△유보)", "answer": 1}, {"year": "2025", "month": "9", "qnum": 52, "text": "[52]다음 자료에 의한 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 사업연도의 세무조정 사항\n이 각 사업연도 소득금액에 미치는 영향으로 옳은 것은?\n구분 건물 비품 차량운반구\n회사계상 상각비 4,000,000원 5,000,000원 1,000,000원\n세법상 상각범위액 6,000,000원 3,000,000원 1,400,000원\n내 용 연 수 40년 5년 5년\n전기이월상각부인액 1,300,000원 600,000원 -\n① 영향 없음\n② 400,000원 감소\n③ 700,000원 증가\n④ 2,000,000원 증가", "answer": 3}, {"year": "2025", "month": "9", "qnum": 55, "text": "[55]다음의 지급이자 중 기타사외유출로 소득처분되는 금액은 모두 얼마인가?\n(1) 채권자불분명 사채이자(원천징수세액 제외 금액) 10,000,000원\n(2) 비실명 채권·증권의 이자 중 원천징수세액 5,000,000원\n(3) 공장건물의 취득과 관련한 특정차입금의 지급이자 12,000,000원\n(4) 토지의 취득과 관련한 일반차입금의 지급이자 5,000,000원\n(5) 업무무관자산 관련 지급이자 28,000,000원\n① 15,000,000원\n② 28,000,000원\n③ 33,000,000원\n④ 43,000,000원", "answer": 3}, {"year": "2025", "month": "9", "qnum": 63, "text": "[63]다음 중 소득세법상 사업소득금액과 법인세법상 각 사업연도 소득금액의 차이점에 관한 설명으로 옳지\n않은 것은?\n① 법인의 주주는 법인의 자금을 임의로 인출하여 사용할 수 없으며, 개인사업자 역시 출자금을 임의로\n인출할 수 없다.\n② 대표이사가 법인의 상품을 무상으로 사용하는 경우 법인세법상 부당행위계산 부인규정에 따라 시가\n를 익금에 산입하며, 개인사업자가 상품을 자기소비하는 경우에는 사업소득의 총수입금액에 산입한\n다.\n③ 대표자에 대한 급여는 법인세법상 손금으로 인정되나, 소득세법상 필요경비에 산입되지 아니한다.\n④ 사업자금을 일시 예치하여 받는 수입이자는 각 사업연도 소득금액의 계산에 있어서 익금으로 보나,\n사업소득금액의 계산에 있어서는 총수입금액으로 보지 아니한다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 46, "text": "[46]법인세법상 세무조정사항 중 다음의 서식에서 차기 이후 사후관리가 필요한 것은?\n[별지 제50호 서식(을)] (뒤 쪽)\n2025. 1. 1.\n사업\n~ 자본금과 적립금조정명세서(을) 법인명 ㈜삼일\n연도\n2025.12.31.\n세무조정유보소득 계산\n① ② 당 기 중 증감 ⑤ 기말잔액\n비고\n과목 또는 사항 기초잔액 ③ 감 소 ④ 증 가 (익기초현재)\n① 기업업무추진비 한도초과액\n② 임원퇴직급여 한도초과액\n③ 감가상각비 한도초과액\n④ 임원상여금 한도초과액", "answer": 3}, {"year": "2025", "month": "11", "qnum": 60, "text": "[60]다음 중 법인세의 신고와 납부에 관한 설명으로 옳지 않은 것은?\n① 법인세 납세의무가 있는 내국법인은 각 사업연도 종료일이 속하는 달의 말일부터 3개월 이내에 법\n인세 과세표준과 세액을 신고하는 것을 원칙으로 한다.\n② 법인세 과세표준 신고시 법인세 과세표준 및 세액신고서에 필수적 첨부서류인 개별법인의 재무상태\n표, 포괄손익계산서, 이익잉여금처분(결손금처리)계산서, 법인세 과세표준 및 세액조정계산서를 첨\n부하여야 한다.\n③ 납세의무가 있는 내국법인은 각 사업연도 소득금액이 없거나 결손금이 있는 경우에도 법인세 과세표\n준 신고를 하여야 한다.\n④ 각 사업연도의 기간이 6개월을 초과하는 법인은 사업연도 개시일부터 6개월간을 중간예납기간으로\n하여 중간예납기간이 지난 날로부터 3개월 이내에 그 기간에 대한 법인세를 납부해야 한다.", "answer": 4}, {"year": "2025", "month": "12", "qnum": 45, "text": "[45]다음 중 법인세법상 사업연도에 관한 설명으로 옳지 않은 것은?\n① 법령 또는 정관 등에 사업연도에 관한 규정이 없는 내국법인은 법인설립신고 또는 사업자등록과 함\n께 사업연도를 신고하여야 하며, 신고를 하지 않은 경우에는 매년 1월 1일부터 12월 31일까지를\n그 법인의 사업연도로 한다.\n② 신설된 내국법인의 최초 사업연도 개시일은 원칙적으로 사업자등록일이다.\n③ 사업연도는 법령이나 정관 등에서 정하는 1회계기간으로 하며 그 기간은 1년을 초과하지 못한다.\n④ 법인설립 이전에 발생한 손익은 최초 사업연도가 1년을 초과하지 아니하는 범위에서 신설법인의 최\n초사업연도의 손익에 산입할 수 있다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 46, "text": "[46]다음 중 소득의 귀속자에게 소득세가 부과되지 않는 소득처분은 무엇인가?\n① 기타소득\n② 상여\n③ 배당\n④ 기타", "answer": 4}, {"year": "2025", "month": "12", "qnum": 47, "text": "[47]영리내국법인 ㈜삼일은 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 중에 유가증권을 전량 현금\n1,000,000원에 처분하고 유가증권처분이익 300,000원을 손익계산서에 계상하였다. 이 유가증권은 제\n24기에 ㈜삼일의 임원 김삼일씨로부터 취득한 것이며, 실지 매입가액으로 장부에 계상하였다. ㈜삼일이\n유가증권 처분에 대한 세무조정으로‘익금불산입 200,000원(△유보)’하였다면, 제24기 취득 당시의\n유가증권의 시가는 얼마인가(단, 처분 직전까지 유가증권은 실지 매입가액으로 장부상 계상하였고, 유\n가증권의 평가손익은 인식하지 않았으며 제24기 및 제25기의 세무조정은 적절하다)?\n① 600,000원\n② 700,000원\n③ 800,000원\n④ 900,000원", "answer": 4}, {"year": "2025", "month": "12", "qnum": 50, "text": "[50]다음은 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일) 정기적금(국내은행 가입)\n미수이자 계정이다.\n정기적금 미수이자\n기초잔액 4,000,000원 당기감소 - 원\n당기증가 6,000,000원 기말잔액 10,000,000원\n합계 10,000,000원 합계 10,000,000원\n정기적금은 2024년초에 가입하였으며, 2026년초에 만기가 된다. 만기 시 정기적금 이자를 받을 때 은\n행에서 법인세와 법인지방소득세를 원천징수한다. ㈜삼일의 정기적금 미수이자에 대한 제25기 사업연\n도의 세무조정으로 옳은 것은?\n① (익금산입) 4,000,000원\n② (익금불산입) 6,000,000원\n③ (익금불산입) 4,000,000원\n④ (익금산입) 6,000,000원", "answer": 2}], "03_익금과 손금": [{"year": "2024", "month": "1", "qnum": 46, "text": "[46]다음 중 「자본금과 적립금조정명세서(을)」에 기재해야 하는 세무조정 사항에 해당하는 것은?\n① 일반기부금 한도초과액\n② 벌금의 손금불산입\n③ 임원퇴직급여 한도초과액\n④ 대손충당금 한도초과액", "answer": 4}, {"year": "2024", "month": "1", "qnum": 48, "text": "[48]다음은 ㈜삼일이 임원 또는 직원을 위하여 지출한 복리후생비 보조원장의 일부이다. 이 중 법인세법상\n손금으로 인정받지 못하는 금액을 계산하면 얼마인가?\n복 리 후 생 비\n2024년 1월 1일 ~ 2024년 12월 31일\n㈜삼일 (단위 : 원)\n월/일 적 요 금 액\n01/23 직장회식비 5,000,000\n01/25 사용자 부담 고용보험료 500,000\n02/03 대주주인 임원에 대한 사택유지비 4,000,000\n02/27 직장어린이집 운영비 500,000\n03/10 직장체육비 1,000,000\n① 2,000,000원\n② 4,000,000원\n③ 5,500,000원\n④ 6,000,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 51, "text": "[51]다음 중 법인세법상 자본적 지출 항목으로 옳지 않은 것은?\n① 엘리베이터 설치\n② 재해로 멸실되어 본래의 용도에 이용가치가 없는 건축물의 복구\n③ 기계의 소모된 부속품의 대체\n④ 빌딩의 피난시설 설치", "answer": 3}, {"year": "2024", "month": "1", "qnum": 52, "text": "[52]다음은 제조업을 영위하는 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 재무상태표의 일\n부이다. ㈜삼일은 제24기에 기계장치(신고내용연수 10년)와 관련된 감가상각비 10,000,000원을 계상\n하였다. 기계장치에 대한 전기의 세무조정은 적절하게 이루어졌으며, 전기 말의 상각부인액 잔액은\n4,000,000원이다. ㈜삼일이 감가상각방법을 정액법으로 신고한 경우 제24기의 세무조정으로 옳은 것은\n(정액법 10년에 대한 상각률：0.1)?\n재무상태표\n(단위：원)\n…… ……\n기 계 장 치 120,000,000\n감가상각누계액 (40,000,000)\n…… 80,000,000\n① 손금불산입 2,000,000원\n② 손금산입 2,000,000원\n③ 손금불산입 4,000,000원\n④ 손금산입 4,000,000원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 53, "text": "[53]다음 중 법인세법상 특례기부금에 해당하는 것의 개수는?\nㄱ. 천재지변으로 생기는 이재민을 위한 구호금품의 가액\nㄴ. 유아교육법에 따른 유치원에 대한 기부금\nㄷ. 국방헌금·국군장병 위문금품\nㄹ. 종교단체에 대한 기부금\n① 0개\n② 1개\n③ 2개\n④ 3개", "answer": 3}, {"year": "2024", "month": "1", "qnum": 54, "text": "[54]제조업을 영위하는 중소기업인 ㈜삼일(법인세법상 특정법인이 아님)의 제24기(2024년 1월 1일 ~\n2024년 12월 31일) 사업연도 매출액은 200억원(특수관계인과의 거래액 100억원 포함)이다. 법인세법\n상 ㈜삼일의 제24기 사업연도의 접대비(2024년부터는 기업업무추진비로 명칭이 변경됨) 한도액으로 옳\n은 것은(단, 제시된 자료 외에는 고려하지 않는다)?\n<참고> 수입금액 적용률\n수입금액 비율\n100억원 이하 0.3 %\n100억원 초과 500억원 이하 3천만원+(수입금액-100억원)×0.2 %\n① 50,000,000원\n② 51,000,000원\n③ 67,000,000원\n④ 68,000,000원", "answer": 4}, {"year": "2024", "month": "1", "qnum": 55, "text": "[55]다음 중 법인세법상 지급이자의 손금불산입에 관한 설명으로 옳지 않은 것은?\n① 채권자가 불분명한 사채의 이자는 손금불산입하며, 대표자 상여로 소득처분하되 그에 대한 원천징수\n세액에 상당하는 금액은 기납부세액으로 공제한다.\n② 건설자금이자의 계상대상에 투자자산과 제조 등에 장기간이 소요되는 재고자산은 포함하지 아니한\n다.\n③ 비실명 채권·증권의 이자상당액은 건설자금이자보다 우선하여 지급이자 손금불산입 규정을 적용한\n다.\n④ 업무무관자산등에 대한 지급이자를 계산할 때, 업무무관자산가액은 취득가액에 의하여 계산한다.", "answer": 1}, {"year": "2024", "month": "1", "qnum": 56, "text": "[56]다음 중 법인세법상 신고조정으로 대손금의 손금처리가 가능한 것은?\n① 채무자의 파산, 강제집행, 사업의 폐지, 사망, 실종, 행방불명으로 인하여 회수할 수 없는 채권\n② 법원의 면책결정에 따라 회수불능으로 확정된 채권\n③ 회수기일이 6개월 이상 지난 채권 중 채권가액이 30만원 이하의 채권\n④ 부도발생일부터 6개월 이상 지난 수표 또는 어음상의 채권(다만, 채무자의 재산에 대해 저당권을\n설정하고 있는 경우를 제외)", "answer": 2}, {"year": "2024", "month": "1", "qnum": 57, "text": "[57]다음 중 준비금에 관한 설명으로 옳지 않은 것은?\n① 준비금은 손금에 산입하는 사업연도에는 조세부담을 경감시키고, 환입하거나 상계하는 연도에는 조\n세부담을 증가시킨다.\n② 전입한 준비금은 일정기간이 경과한 후에 다시 익금산입하여야 한다.\n③ 비상위험준비금은 「채무자 회생 및 파산에 관한 법률」에 따른 회생계획인가의 결정을 받는 법인이\n설정대상이다.\n④ 고유목적사업준비금은 비영리내국법인이 설정대상이다.", "answer": 3}, {"year": "2024", "month": "1", "qnum": 59, "text": "[59]다음 자료를 기초로 중소기업인 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 사업연도의\n법인세 산출세액을 계산하면 얼마인가?\nㄱ. 손익계산서상의 당기순이익 : 300,000,000원\nㄴ. 제24기 사업연도의 세무조정금액\n- 익금산입·손금불산입 : 100,000,000원\n- 손금산입·익금불산입 : 50,000,000원\nㄷ. 제23기 사업연도(2023년 1월 1일 ~ 2023년12월 31일)에 발생한 결손금 중 미공제된 금액 :\n30,000,000원\nㄹ. 제24기 사업연도의 손익계산서상 당기순이익에는 공익신탁의 신탁재산에서 생긴 소득\n20,000,000원이 포함되어 있다.\nㅁ. 법인세의 세율은 과세표준 2억원 이하에 대해서는 9 %, 2억원 초과 200억원 이하분에 대해서는\n“1천 800만원+(2억원을 초과하는 금액의 19 %)”이다.\n① 30,000,000원\n② 33,000,000원\n③ 37,000,000원\n④ 40,000,000원", "answer": 3}, {"year": "2024", "month": "3", "qnum": 46, "text": "[46]다음 세무조정사항 중 소득처분의 귀속자에게 추가적인 과세가 필요한 경우에 해당되는 것은?\n① 업무용승용차 관련 비용 중 업무미사용금액\n② 특례기부금 한도초과액\n③ 대손충당금 한도초과액\n④ 업무무관자산 등 관련 차입금이자", "answer": 1}, {"year": "2024", "month": "3", "qnum": 47, "text": "[47]다음은 ㈜삼일의 제24기 손익계산서에 수익으로 계상되어 있는 항목이다. 자료에 의하여 익금불산입\n세무조정을 하여야 하는 금액을 계산하면 얼마인가(단, 과세표준 계산시 공제가능한 이월결손금은 없\n다)?\n가. 채무면제이익 1,000,000원\n나. 국세 과오납금의 환급금 이자 2,000,000원\n다. 손금산입된 금액의 환입액 3,000,000원\n라. 자산의 임대료 4,000,000원\n① 2,000,000원\n② 3,000,000원\n③ 4,000,000원\n④ 6,000,000원", "answer": 1}, {"year": "2024", "month": "3", "qnum": 48, "text": "[48]다음 중 손금불산입항목에 해당하지 않는 것은?\n① 잉여금처분에 의한 배당\n② 국세의 강제징수로 인한 강제징수비\n③ 임원상여금 한도초과액\n④ 본사 건물 재산세", "answer": 4}, {"year": "2024", "month": "3", "qnum": 49, "text": "[49]㈜삼일은 제24기(2024년 1월 1일 ~ 2024년 12월 31일)초에 대표이사 업무용 승용차를 50,000,000원\n에 취득하고 업무전용자동차보험에 가입하였다. 해당 업무용 승용차에 관련된 다음 내역을 바탕으로 세\n무조정을 수행하고 해당 세무조정의 결과 제24기 사업연도의 손금불산입금액을 계산하면 얼마인가?\n(1) 손익계산서 상 비용계상내역\n① 감가상각비 10,000,000원\n② 차량유지비(유류비, 수선비 등) 5,000,000원\n(2) 운행기록부는 작성하지 않았다.\n① 0원\n② 2,000,000원\n③ 3,000,000원\n④ 7,600,000원", "answer": 2}, {"year": "2024", "month": "3", "qnum": 50, "text": "[50]다음은 ㈜삼일건설의 제24기(2024년 1월 1일 ~ 2024년 12월 31일)의 공사내역이다. 제시된 공사에\n대하여 회사가 완성기준으로 회계처리한 경우 올바른 세무조정은?\n구 분 공사기간 도급금액 2024년 공사비 총공사예정비\nA 공사 2024. 9. 1. - 2026. 1. 10. 150억원 40억원 100억원\n① (익금산입) 공사수익 60 억원 (유보)\n(손금산입) 공사원가 40 억원 (△유보)\n② (익금산입) 공사수익 40 억원 (유보)\n(손금산입) 공사원가 60 억원 (△유보)\n③ (익금불산입) 공사수익 60 억원 (△유보)\n(손금불산입) 공사원가 40 억원 (유보)\n④ 세무조정 사항 없음", "answer": 1}, {"year": "2024", "month": "3", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각비에 관한 설명으로 옳지 않은 것은?\n① 전화기(휴대용 전화기 포함) 및 개인용 컴퓨터(그 주변기기 포함)는 그 사업에 사용한 날이 속하는\n사업연도에 손비로 계상하면 이를 손금에 산입한다.\n② 유형자산의 잔존가액은 0으로 하되, 정률법 계산시 상각률 산정에는 잔존가액을 5 %으로 하여 상각\n률을 산정한다.\n③ 자산 취득가액이 거래단위별로 100만원 이하인 경우로서 그 사업의 개시를 위하여 취득하는 자산은\n시부인계산 과정을 거치지 않고 전액 손금으로 인정한다.\n④ 광업권에 대하여 감가상각방법을 신고하지 않은 경우 생산량비례법을 적용한다.", "answer": 3}, {"year": "2024", "month": "3", "qnum": 53, "text": "[53]㈜삼일은 국가에 정당한 사유없이 시가 10억원 건물을 5억원에 양도하였다. 이 거래와 관련하여 ㈜삼\n일이 기부금으로 의제할 금액은 얼마인가?\n① 2억원\n② 3억원\n③ 4억원\n④ 5억원", "answer": 1}, {"year": "2024", "month": "3", "qnum": 55, "text": "[55]다음 중 손금불산입 대상인 지급이자와 이에 대한 소득처분을 연결한 것으로 옳은 것은(단, 지급이자에\n대한 원천징수는 고려하지 않는다)?\n구 분 소득처분\n① 비실명채권·증권의 이자상당액 기타사외유출\n② 건설자금이자 배당\n③ 업무무관자산 등 관련이자 대표자 상여\n④ 채권자불분명 사채이자 대표자 상여", "answer": 4}, {"year": "2024", "month": "3", "qnum": 57, "text": "[57]다음 중 준비금 및 충당금에 관한 설명으로 옳은 것은?\n① 해약환급금 준비금은 증권회사가 설정대상이다.\n② 비영리내국법인의 고유목적사업준비금은 조세특례제한법에 근거하고 있다.\n③ 준비금은 손금에 산입한 후 환입하거나 비용과 상계하기 때문에 손금에 산입하는 사업연도에는 조세\n부담을 경감시키고 환입하거나 상계하는 연도에 조세부담을 증가시키게 된다.\n④ 복구충당금은 법인세법에 손금으로 인정되는 충당금으로 열거되어 있다.", "answer": 3}, {"year": "2024", "month": "5", "qnum": 46, "text": "[46]다음의 세무조정사항 중에서 귀속자에 대한 추가적인 과세나 사후관리가 불필요한 소득처분에 해당하는\n것은?\n① 기업업무추진비 한도초과액\n② 감가상각비 한도초과액\n③ 퇴직급여충당금 한도초과액\n④ 임원퇴직급여 한도초과액", "answer": 1}, {"year": "2024", "month": "5", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되는 금액은 얼마인가?\nㄱ. 감자차익 5,000,000원\nㄴ. 자산수증이익(세무상 이월결손금의 보전에 충당하는 금액 없음) 2,000,000원\nㄷ. 국세ᆞㆍ지방세 과오납금의 환급금 이자 6,000,000원\nㄹ. 자기주식의 양도금액 4,000,000원\n① 4,000,000원\n② 6,000,000원\n③ 12,000,000원\n④ 13,000,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 48, "text": "[48]다음 중 법인세법상 손금으로 인정되는 금액은 얼마인가(단, 손금인정을 위한 기타 요건은 갖추었다고\n가정한다)?\nㆍ 업무와 관련하여 발생한 교통사고 벌과금 5,000,000원\nㆍ 주식할인발행차금 3,000,000원\nㆍ ⌜국민건강보험법 에 따라\n⌟\n사용자로서 부담하는 국민건강보험료 1,500,000원\nㆍ 직장회식비 3,700,000원\n① 1,500,000원\n② 5,200,000원\n③ 7,200,000원\n④ 10,200,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 49, "text": "[49]㈜삼일은 2024년에 업무용 토지에 대한 종합부동산세 840,000원(가산세 40,000원 포함)을 신고기한 경\n과 후 납부하고 아래와 같이 회계처리하였다. 이에 대한 세무조정으로 옳은 것은?\n(차) 세금과공과 840,000원 (대) 현금 840,000원\n① (손금불산입) 세금과공과 840,000원(기타사외유출)\n② (손금불산입) 세금과공과 800,000원(기타사외유출)\n③ (손금불산입) 세금과공과 40,000원(기타사외유출)\n④ (손금불산입) 세금과공과 40,000원(상여)", "answer": 3}, {"year": "2024", "month": "5", "qnum": 51, "text": "[51]다음은 ㈜삼일이 2024년 7월 1일에 취득한 기계장치에 관한 자료이다. 이 자료를 기초로 제24기\n(2024년 1월 1일 ~ 2024년 12월 31일) 사업연도의 기계장치 상각범위액을 계산하면 얼마인가?\nㄱ. 기계장치의 취득가액: 2억원\nㄴ. 2024.10.1에 발생한 기계장치에 대한 자본적 지출: 1억원\nㄷ. 감가상각방법: 정액법\nㄹ. 신고내용연수: 5년(정액법 상각률 0.2)\n① 25,000,000원\n② 30,000,000원\n③ 35,000,000원\n④ 40,000,000원", "answer": 2}, {"year": "2024", "month": "5", "qnum": 52, "text": "[52]다음 중 법인세법상 수익적 지출인 것은?\n① 내용연수 연장을 위한 개조를 위한 지출\n② 엘리베이터의 설치를 위한 지출\n③ 빌딩의 피난시설 설치를 위한 지출\n④ 기계의 소모된 부속품 및 벨트의 대체를 위한 지출", "answer": 4}, {"year": "2024", "month": "5", "qnum": 53, "text": "[53]다음 중 법인세법상 기부금에 관한 설명으로 옳지 않은 것은?\n① 특수관계인 외의 자에게 정당한 사유 없이 자산을 정상가액보다 낮은 가액으로 양도하는 경우 정상\n가액과 양도가액의 차액은 기부금에 포함한다.\n② 법인이 특수관계인이 아닌 자에게 현물로 기부한 일반기부금은 기부했을 때의 장부가액과 시가 중\n큰 금액으로 해당 자산가액을 산정한다.\n③ 일반기부금한도초과액은 해당 사업연도의 다음 사업연도 개시일부터 10년 이내에 끝나는 각 사업연\n도로 이월하여 그 이월된 사업연도의 소득금액을 계산할 때 손금산입한도액의 범위에서 손금에 산입\n한다.\n④ 내국법인이 각 사업연도에 지출하는 기부금을 이연계상한 경우에는 이를 그 지출한 사업연도의 기부\n금으로 하고, 그 후의 사업연도에 있어서는 이를 기부금으로 보지 아니한다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 55, "text": "[55]다음 중 법인세법상 지급이자의 손금불산입에 관한 설명으로 옳지 않은 것은?\n① 채권자가 불분명한 사채의 이자는 손금불산입하여 대표자 상여로 소득처분하되, 그에 대한 원천징수\n세액에 상당하는 금액은 기타사외유출로 소득처분한다.\n② 건설자금이자의 계상대상에 유형자산과 무형자산뿐만 아니라 투자자산과 제조 등에 장기간이 소요되\n는 재고자산도 포함한다.\n③ 비실명 채권·증권의 이자상당액은 건설자금이자보다 우선하여 지급이자 손금불산입 규정을 적용한\n다.\n④ 업무무관자산 등에 대한 지급이자를 계산할 때, 업무무관자산가액은 취득가액에 의하여 계산한다.", "answer": 2}, {"year": "2024", "month": "5", "qnum": 56, "text": "[56]다음 중 법인세법상 퇴직급여충당금에 관한 설명으로 옳지 않은 것은?\n① 퇴직급여충당금 설정액 중 한도초과액은 손금불산입하여 유보로 소득처분한다.\n② 퇴직급여충당금은 법인의 장부에 비용으로 계상한 경우에만 손금에 산입할 수 있는 결산조정사항이\n다.\n③ 퇴직금추계액은 일시퇴직기준 퇴직급여추계액과 보험수리적기준에 의한 퇴직급여추계액 중 큰 금액\n으로 한다.\n④ 퇴직급여충당금 한도액 계산시 기준이 되는 총급여액이란 근로제공으로 인한 봉급·상여·수당·인\n정상여의 합계액을 말한다.", "answer": 4}, {"year": "2024", "month": "5", "qnum": 57, "text": "[57]다음 중 법인세법상 손금으로 인정되는 준비금으로 옳지 않은 것은?\n① 책임준비금\n② 투자준비금\n③ 고유목적사업준비금\n④ 해약환급금준비금", "answer": 2}, {"year": "2024", "month": "5", "qnum": 58, "text": "[58]㈜삼일은 2024년 1월 1일에 회사의 전무이사로부터 시가 10억원인 토지를 14억원에 매입하며 다음과\n같이 회계처리하였다. 토지 매입과 관련하여 2024년에 필요한 세무조정으로 옳은 것은?\n(차변) 토지 14 억원 (대변) 현금 14 억원\n① (손금산입) 토지 1억원(△유보)\n(손금불산입) 고가매입액 1억원(상여)\n② (손금산입) 토지 3억원(△유보)\n(손금불산입) 고가매입액 3억원(상여)\n③ (손금산입) 토지 4억원(△유보)\n(손금불산입) 고가매입액 4억원(상여)\n④ (손금불산입) 고가매입액 4억원(상여)", "answer": 3}, {"year": "2024", "month": "6", "qnum": 47, "text": "[47]㈜삼일은 제24기(2024년 1월 1일 ∼ 2024년 12월 31일) 사업연도 중에 보유하던 토지 A의 40 % 를\n시가에 양도하였다. 토지 A에 대한 자료가 다음과 같은 경우 토지의 양도와 관련하여 제24기 사업연도\n에 필요한 세무조정으로 옳은 것은(단, 전기 이전의 세무조정은 적정하며, 주어진 자료 이외에는 고려\n하지 않음)?\n(1) 제23기 사업연도의 자본금과 적립금조정명세서(을)\n(단위 : 원)\n당기중 증감\n과목 또는 사항 기초잔액 기말잔액\n감소 증가\n토지 A 10,000,000 - - 10,000,000\n(2) 제24기 토지 A 양도시 결산상 회계처리\n(차) 현 금 31,000,000 (대) 토 지 40,000,000*\n유형자산처분손실 9,000,000\n* 양도 당시 결산상 토지 A의 장부가액 100,000,000원에 양도비율 40 % 를 곱한 금액임\n① 익금산입 및 손금불산입 4,000,000원\n② 손금산입 및 익금불산입 4,000,000원\n③ 익금산입 및 손금불산입 6,000,000원\n④ 손금산입 및 익금불산입 6,000,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 48, "text": "[48]㈜삼일이 제24기(2024년 1월 1일 ~ 2024년 12월 31일)에 다음 금액을 비용으로 회계처리한 경우 각\n사업연도 소득금액 계산시 손금불산입되는 금액은 얼마인가?\n1. 주식할인발행차금 1,000,000원\n2. 형법상 뇌물 5,000,000원\n3. 법인지방소득세 2,000,000원\n4. 폐수배출부담금 3,000,000원\n5. 직장어린이집운영비 4,000,000원\n① 6,500,000원\n② 8,000,000원\n③ 11,000,000원\n④ 15,000,000원", "answer": 3}, {"year": "2024", "month": "6", "qnum": 49, "text": "[49]㈜삼일은 제24기(2024년 1월 1일 ~ 2024년 12월 31일)초에 전무이사가 사용할 업무용 승용차를\n50,000,000원에 취득하고 업무전용자동차보험에 가입하였다. 해당 업무용 승용차에 관련된 다음 내역을\n바탕으로 세무조정을 수행하고 해당 세무조정의 결과 제24기 사업연도의 손금불산입금액을 계산하면\n얼마인가?\n(1) 손익계산서상 비용계상내역\n① 감가상각비 10,000,000원\n② 차량유지비(유류비, 수선비 등) 5,000,000원\n(2) 운행기록부상 업무사용비율은 100 % 이다.\n① 0원\n② 2,000,000원\n③ 3,000,000원\n④ 7,600,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 50, "text": "[50]다음 중 법인세법상 손익의 귀속시기에 관한 설명으로 옳지 않은 것은?\n① 익금과 손금은 권리·의무가 확정되는 사업연도에 인식하는 것을 원칙으로 한다.\n② 내국법인이 익금과 손금의 귀속사업연도에 관하여 일반적으로 공정ㆍ타당하다고 인정되는 기업회계\n기준을 적용하거나 관행을 계속 적용하여 온 경우에는 법인세법 및 조세특례제한법에서 달리 규정하\n고 있는 경우를 제외하고는 그 기업회계기준 또는 관행에 따른다.\n③ 자산을 위탁매매한 경우에는 수탁자가 그 위탁자산을 매매한 날을 손익의 귀속시기로 한다.\n④ 부동산을 양도한 경우에는 대금청산일에 관계없이 등기이전일을 손익의 귀속시기로 한다.", "answer": 4}, {"year": "2024", "month": "6", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각비에 관한 설명으로 옳지 않은 것은?\n① 시설의 개체 또는 기술의 낙후로 인하여 생산설비의 일부를 폐기한 경우 해당 자산의 장부가액에서\n1천원을 공제한 금액을 폐기일이 속하는 사업연도의 손금에 산입할 수 있다.\n② 사업연도 중에 취득하여 사업에 사용한 감가상각자산에 대한 상각범위액은 사업에 사용한 날부터 당\n해 사업연도 종료일까지의 월수에 따라 계산한다.\n③ 건축물의 감가상각방법을 신고하지 아니한 경우에는 정률법을 적용한다.\n④ 상각범위액을 계산함에 있어서 감가상각자산의 잔존가액은 원칙적으로“0”으로 하고, 정률법에 의\n하여 상각범위액을 계산하는 경우에만 취득가액의 5 % 에 상당하는 금액으로 하되, 그 금액은 당해\n감가상각자산에 대한 미상각잔액이 최초로 취득가액의 5 % 이하가 되는 사업연도의 상각범위액에 가\n산한다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 53, "text": "[53]용산역에 위치한 ㈜삼일은 투자 목적으로 회사 주변의 건물을 소유하고 있다. ㈜삼일의 김삼일 대표이\n사는 자신의 향우회로부터 6억원의 현금을 받는 조건으로 회사의 건물을 매각하라는 제안을 받았고, 동\n제안을 수락할 경우 어떤 효과가 있을지 고민하고 있다. 동 건물의 시가는 10억원이다. 건물을 위의 조\n건으로 매각할 경우 다음 중 옳은 세무조정은 어느 것인가(단, 대표이사 향우회는 ㈜삼일과 특수관계자\n가 아니다)?\n① <손금불산입> 비지정기부금 1억원\n② <손금불산입> 일반기부금 2억원\n③ <손금불산입> 일반기부금 3억원\n④ <손금불산입> 비지정기부금 4억원", "answer": 1}, {"year": "2024", "month": "6", "qnum": 54, "text": "[54]중소기업이며 제조업을 영위하는 ㈜삼일의 제24기 사업연도(2024년 1월 1일 ∼ 2024년 12월 31일)\n의 기업업무추진비와 관련된 자료가 다음과 같을 경우, 세무조정으로 인한 손금불산입액의 총합계는 얼\n마인가(문화관련업무추진비나 전통시장에서 지출한 업무추진비는 없다)?\nㄱ. 기업업무추진비지출액: 90,000,000원\n(기업업무추진비로 신용카드 등을 사용하지 않고 영수증을 받은 금액 2,000,000원(1건) 포함)\nㄴ. 손익계산서상 매출액: 190억원(매출액은 전액 제조업에서 발생한 금액으로서 특수관계인과 거\n래분은 없음)\nㄷ. 사업연도 중 중단된 사업부문(소매업)의 매출액 10억원(손익계산서상 매출액에는 포함되어 있\n지 않으며, 특수관계인 거래분 없음)\nㄹ. 기업업무추진비 손금한도액 계산시 수입금액기준한도액 계산에 필요한 적용률은 수입금액 100\n억원 이하분에 대하여는 0.3 %, 100억 초과 500억 이하 분에 대하여는 0.2 %이다.\n① 2,000,000원\n② 4,000,000원\n③ 6,000,000원\n④ 8,000,000원", "answer": 2}, {"year": "2024", "month": "6", "qnum": 55, "text": "[55]다음은 지급이자손금불산입 항목을 나열한 것이다. 지급이자손금불산입을 적용하는 순서를 나타낸 것으\n로 옳은 것은?\nㄱ. 건설자금이자\nㄴ. 업무무관자산 등 관련 이자\nㄷ. 비실명 채권·증권의 이자상당액\nㄹ. 채권자불분명 사채이자\n① ㄷ → ㄴ → ㄱ → ㄹ\n② ㄷ → ㄴ → ㄹ → ㄱ\n③ ㄹ → ㄷ → ㄱ → ㄴ\n④ ㄹ → ㄷ → ㄴ → ㄱ", "answer": 3}, {"year": "2024", "month": "6", "qnum": 57, "text": "[57]다음 중 준비금에 관한 설명으로 옳지 않은 것은?\n① 보험사업을 하는 내국법인은 법인세법에 따라 고유목적사업준비금을 손금에 산입할 수 있다.\n② 준비금은 법인세법과 조세특례제한법에 규정되어 있다.\n③ 보험사업을 하는 내국법인은 비상위험준비금을 손금에 산입할 수 있다.\n④ 손금에 산입한 책임준비금은 일정기간이 경과한 후에 다시 익금산입하여야 한다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 48, "text": "[48]다음 중 법인세법상 업무무관경비 손금불산입에 관한 설명으로 옳지 않은 것은?\n① 업무무관부동산의 취득·관리에 따른 비용은 손금불산입한다.\n② 소액주주인 임원이 사용하고 있는 사택의 유지비는 손금불산입한다.\n③ 업무무관자산을 취득하기 위하여 지출한 자금의 차입과 관련된 비용은 손금불산입한다.\n④ 형법상 뇌물에 해당하는 금전은 손금불산입한다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각과 관련된 설명으로 옳지 않은 것은?\n① 내용연수는 경제적 내용연수를 추정하여 사용한다.\n② 건물에 엘리베이터 또는 냉난방장치의 설치를 위하여 지출한 금액은 자본적 지출에 해당한다.\n③ 재해를 입은 자산에 대한 외장의 복구ㆍ도장 및 유리의 삽입을 위한 지출은 수익적 지출에 해당한\n다.\n④ 감가상각방법으로 정액법·정률법·생산량비례법을 허용한다.", "answer": 1}, {"year": "2024", "month": "7", "qnum": 53, "text": "[53]다음 자료를 이용하여 ㈜삼일의 일반기부금 한도초과액을 계산하면 얼마인가?\nㄱ. 특수관계 없는 종교단체(일반기부금 대상)로부터 시가 300,000,000원의 건물을 438,000,000원\n에 매입하였다.\nㄴ. 특수관계 없는 사회복지법인(일반기부금 대상)에게 장부가액 150,000,000원(시가 300,000,000\n원)의 토지를 180,000,000원에 양도하였다.\nㄷ. 위 매매거래는 모두 정당한 사유가 없으며, 당기 일반기부금 한도액은 45,000,000원이라고 가정\n한다.\n① 33,000,000원\n② 63,000,000원\n③ 213,000,000원\n④ 243,000,000원", "answer": 1}, {"year": "2024", "month": "7", "qnum": 54, "text": "[54]다음은 ㈜삼일의 제24기(2024년 1월1일 ~ 2024년 12월31일) 기업업무추진비 보조원장을 요약 정리\n한 것이다. 다음 중 ㈜삼일의 제24기 세무조정으로 옳은 것은(단, 법인세법상 기업업무추진비 한도액\n은 20,000,000원이다)?\n기업업무추진비 보조원장\n적 요 금 액 비 고\n거래처 기업업무추진비(1건) 450,000원 증빙 미수취분\n거래처 기업업무추진비(1건) 20,000원 영수증 수취분\n거래처 기업업무추진비(25건) 22,300,000원 신용카드매출전표 수취분\n합 계 22,770,000원\n① (손금불산입) 증빙없는 기업업무추진비 470,000원(상여)\n② (손금불산입) 기업업무추진비 한도초과액 2,750,000원(기타사외유출)\n③ (손금불산입) 증빙없는 기업업무추진비 450,000원(상여)\n(손금불산입) 기업업무추진비 한도초과액 2,320,000원(기타사외유출)\n④ (손금불산입) 증빙없는 기업업무추진비 470,000원(상여)\n(손금불산입) 기업업무추진비 한도초과액 2,300,000원(기타사외유출)", "answer": 3}, {"year": "2024", "month": "7", "qnum": 55, "text": "[55]법인세법상 다음에 해당하는 지급이자 손금불산입의 유형은 무엇인가?\n사업용 유형자산 및 무형자산의 매입·제작·건설에 소요되는 차입금에 대한 건설기간 중의 지급이\n자 또는 이와 유사한 성질의 지출금을 말한다. 이는 자산의 취득원가에 가산하도록 규정되어 있다.\n① 채권자불분명 사채이자\n② 건설자금이자\n③ 비실명채권·증권의 이자상당액\n④ 업무무관자산 등에 대한 지급이자", "answer": 2}, {"year": "2024", "month": "7", "qnum": 56, "text": "[56]다음 중 법인세법상 퇴직금 및 퇴직급여충당금과 관련된 설명으로 옳지 않은 것은?\n① 법인의 임원이 연임된 경우에는 현실적 퇴직으로 보지 아니한다.\n② 퇴직급여충당금의 손금산입은 결산조정사항이다.\n③ 퇴직급여충당금 전입액은 일정한 한도 내에서만 손금으로 인정된다.\n④ 법인세법상 한도를 초과하여 설정된 퇴직급여충당금은 손금불산입되고 기타사외유출로 소득처분된\n다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 57, "text": "[57]다음 중 법인세법이나 조세특례제한법상의 준비금에 대한 설명으로 옳지 않은 것은?\n① 준비금은 조세정책 목적에서 조세의 납부를 일정기간 유예하는 조세지원제도이다.\n② 준비금은 손금에 산입한 후 환입하거나 비용과 상계하기 때문에 손금에 산입하는 사업연도에는 조세\n부담을 경감시키는 효과가 있다.\n③ 보험사업을 하는 내국법인은 법인세법에 따라 비상위험준비금을 손금에 산입할 수 있다.\n④ 비영리내국법인은 법인세법에 따라 손실보전준비금을 손금에 산입할 수 있다.", "answer": 4}, {"year": "2024", "month": "7", "qnum": 59, "text": "[59]다음은 중소기업인 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 세무조정계산서의 일부이\n다. 담당 회계사의 검토를 받던 중 회사는 아래와 같은 항목이 세무조정 시 누락된 것을 확인하고 이를\n수정하기로 했다. 수정 후 올바른 과세표준은 얼마인가?\n(단위 : 원)\n(101)결산서상당기순손익 01 200,000,000\n①\n각 (102)익 금 산 입 02 20,000,000\n소득조정금액\n사\n(103)손 금 산 입 03 35,000,000\n업\n연\n(104)차가감 소득금액 (101＋102－103) 04 185,000,000\n도\n소\n(105)기부금한도초과액 05 0\n득\n계 (106)기부금한도초과 이월액손금산입 54 0\n산\n(107)각 사업연도 소득금액 (104＋105-106) 06 185,000,000\n(108)각 사업연도 소득금액 (108=107) 185,000,000\n②\n과 (109)이 월 결 손 금 07 0\n세\n표 (110)비 과 세 소 득 08 0\n준\n계 (111)소 득 공 제 09 0\n산\n(112)과 세 표 준 (108－109－110－111) 10 185,000,000\n<누락사항>\nㄱ. 이월결손금 2007년(제 7기) 50,000,000원\n2016년(제 16기) 30,000,000원\n2018년(제 18기) 15,000,000원\nㄴ. 일반기부금 한도초과액 15,000,000원\n① 105,000,000원\n② 125,000,000원\n③ 145,000,000원\n④ 155,000,000원", "answer": 4}, {"year": "2024", "month": "9", "qnum": 46, "text": "[46]다음 중 소득처분에 관한 설명으로 옳지 않은 것은?\n① 손금불산입사항으로 사외유출된 것이 분명하나, 귀속자가 불분명한 경우에는 대표자에 대한 상여로\n처분한다.\n② 기타사외유출의 경우 법인세를 과세하는 것 이외의 추가적 과세가 없다.\n③ 소득의 귀속자가 출자자인 법인의 경우 배당으로 처분한다.\n④ 소득처분 중 기타는 사후관리가 불필요하다.", "answer": 3}, {"year": "2024", "month": "9", "qnum": 47, "text": "[47]다음 자료를 바탕으로 ㈜삼일이 제24기에 수행하여야 하는 세무조정으로 옳은 것은?\n(1) ㈜삼일은 제23기에 업무용 건물의 재산세 300 만원을 현금으로 납부하였고 다음과 같이 회계처\n리하였다.\n(차) 세금과공과(재산세) 3,000,000원 (대) 현금 3,000,000원\n(2) 제24기에 재산세 과오납 사유가 발생하여 150 만원의 재산세 환급금과 20 만원의 과오납급의 환\n급가산금을 지급받았고 다음과 같이 회계처리하였다.\n(차) 현금 1,700,000원 (대) 잡이익 1,700,000원\n① (익금산입) 200,000원\n② (익금산입) 1,700,000원\n③ (익금불산입) 200,000원\n④ (익금불산입) 1,700,000원", "answer": 3}, {"year": "2024", "month": "9", "qnum": 48, "text": "[48]다음 자료에 의할 경우 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 김삼일 이사(주주에\n해당함)의 인건비 중 손금불산입되는 금액은 얼마인가?\nㄱ. 김삼일 이사는 ㈜삼일에 3년 9개월간 근무하다가 2024년 12월 31일에 퇴직하였다.\nㄴ. ㈜삼일은 김삼일 이사에게 퇴직급여 16,000,000원을 지급하였다. ㈜삼일은 퇴직급여충당금을\n설정하지 않으며, 임원퇴직급여 규정도 두고 있지 않다.\nㄷ. 퇴직 직전 1년간 김삼일 이사에게 지급한 급여액은 24,000,000원이며 상여금은 10,000,000\n원(정관규정의 지급한도를 초과한 2,000,000원 포함)이다.\nㄹ. 급여액 등 인건비는 모두 손익계산서상 비용으로 회계처리되었다.\n① 2,000,000원\n② 4,000,000원\n③ 5,000,000원\n④ 6,000,000원", "answer": 4}, {"year": "2024", "month": "9", "qnum": 51, "text": "[51]도매업을 영위하는 ㈜삼일은 전기까지 매장을 임차하여 사용하다가 당기(2024년 1월 1일 ~ 2024년 12\n월 31일) 중 건물을 최초로 취득하고 세무상 감가상각 내용연수를 신고하려고 한다. 건물의 취득일자가\n2024년 3월 14일인 경우 세무상 감가상각 내용연수 신고는 언제까지 해야 하는가?\n① 2024년 6월 30일\n② 2024년 9월 30일\n③ 2025년 1월 31일\n④ 2025년 3월 31일", "answer": 4}, {"year": "2024", "month": "9", "qnum": 53, "text": "[53]다음 중 법인세법상 기부금에 관한 설명으로 옳지 않은 것은?\n① 기부금은 사업과 직접 관련없이 무상으로 지출하는 재산적 증여가액을 말한다.\n② 천재·지변으로 인한 이재민의 구호금품 가액과 사회복지법인에 고유목적사업비로 지출하는 기부금\n은 특례기부금에 해당한다.\n③ 비지정기부금에 해당하면 한도계산없이 전액 손금불산입된다.\n④ 기부금은 현금주의에 의하여 손금에 계상되므로 법인이 실제로 지급하지 아니한 기부금을 미지급으\n로 하여 손비로 계상한 경우 동 기부금은 손금불산입된다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 54, "text": "[54]중소기업이며 제조업을 영위하는 ㈜삼일의 제24기 사업연도(2024년 1월 1일 ∼ 2024년 12월 31일)\n의 기업업무추진비와 관련된 자료가 다음과 같을 경우, 기업업무추진비한도초과로 인한 손금불산입액은\n얼마인가(단, 제시된자료 외에는 고려하지 않는다)?\nㄱ. 기업업무추진비지출액: 42,000,000원\n[기업업무추진비로 신용카드 등을 사용하지 않고 영수증을 받은 금액 2,000,000원(1건) 포함]\nㄴ. 매출액: 450,000,000원(매출액은 전액 제조업에서 발생한 금액으로서 특수관계인과 거래분은\n없다)\nㄷ. 기업업무추진비 손금한도액 계산시 수입금액기준한도액 계산에 필요한 적용률은 수입금액\n100억 원 이하분에 대하여 0.3 % 이다.\n① 2,000,000원\n② 2,650,000원\n③ 4,000,000원\n④ 4,650,000원", "answer": 2}, {"year": "2024", "month": "9", "qnum": 55, "text": "[55]다음 중 법인세법상 지급이자 손금불산입에 관한 설명으로 옳지 않은 것은?\n① 지급이자를 손금불산입하는 순서를 규정하고 있다.\n② 비상각자산에 대한 건설자금이자 손금불산입 금액은 처분시 손금으로 추인한다.\n③ 재고자산에 대한 건설자금이자는 손금불산입 하지 않는다.\n④ 채권자가 불분명한 사채의 이자에 대한 원천징수세액상당액은 손금불산입 하지 않는다.", "answer": 4}, {"year": "2024", "month": "9", "qnum": 57, "text": "[57]다음 법인세법상 대손금 중 결산조정사항이 아닌 것은?\n① 민사집행법의 규정에 의하여 채무자의 재산에 대한 경매가 취소된 압류채권\n② 채무자의 파산으로 인하여 회수할 수 없는 채권\n③ 부도 발생일로부터 6개월 이상 지난 수표 또는 어음상의 채권 및 중소기업의 외상매출금(부도발생\n일 이전의 것)\n④ 특수관계인이 아닌자와의 거래로 인하여 발생한 중소기업 외상매출금으로서 회수기일로부터 2년 이\n상 지난 외상매출금", "answer": 1}, {"year": "2024", "month": "9", "qnum": 58, "text": "[58]㈜삼일은 대표이사인 홍길동씨에게 업무와 관련 없이 자금을 대여하고 있으며, 동 대여금의 2024년 적\n수는 1,000,000,000원이다. 2024년 중 대표이사로부터 50,000원의 이자를 수령하였으며 ㈜삼일의 가중\n평균차입이자율이 7 % 인 경우 필요한 세무조정으로 옳은 것은(단, 인정이자 계산시 가중평균차입이자\n율 적용, 소수점 첫째 자리에서 반올림한다)?\n① (익금불산입) 가지급금 인정이자 141,257원(상여)\n② (익금산입) 가지급금 인정이자 141,257원(상여)\n③ (익금불산입) 가지급금 인정이자 191,257원(상여)\n④ (익금산입) 가지급금 인정이자 191,257원(상여)", "answer": 2}, {"year": "2024", "month": "9", "qnum": 59, "text": "[59]다음 중 법인세법상 이월결손금에 관한 설명으로 옳지 않은 것은?\n① 자산수증이익 및 채무면제이익으로 충당된 이월결손금은 익금불산입되므로 소멸된다.\n② 법원결정에 의한 회생계획을 이행중인 기업은 당해연도 소득의 80 % 를 이월결손금 연간 공제 한도\n로 한다.\n③ 과세표준계산시 공제받을 수 있는 이월결손금은 15년(2020. 1. 1 이전 발생분은 10년) 이내에 개시\n한 사업연도에서 발생한 결손금이다.\n④ 중소기업의 경우 당해연도 소득의 100 % 를 이월결손금 연간 공제 한도로 한다.", "answer": 2}, {"year": "2024", "month": "9", "qnum": 63, "text": "[63]다음 자료를 보고 개인사업자 김삼일씨(복식부기의무자 아님)의 2024년의 사업소득금액을 계산하면 얼\n마인가?\nㄱ. 손익계산서상 당기순이익 300,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n(아래 기술한 내용 이외에는 모두 세법상 적정하게 계상되어 있음)\n- 본인에 대한 급여 60,000,000원\n- 배당금수익 2,000,000원\n- 유형자산처분이익 10,000,000원\n- 세금과공과 중 벌금 5,000,000원\nㄷ. 이월결손금 70,000,000원(2020년 사업소득에서 발생함)\n① 295,000,000원\n② 292,000,000원\n③ 290,000,000원\n\n④ 283,000,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 47, "text": "[47]다음은 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 손익계산서에 수익으로 계상되어 있\n는 항목이다. 자료에 의하여 익금불산입으로 세무조정을 하여야 하는 금액을 계산하면 얼마인가(단, ㈜\n삼일의 이월결손금은 없다)?\n가. 자산수증이익 1,000,000원\n나. 지방세 과오납금의 환급금 이자 2,000,000원\n다. 손금불산입된 금액의 환입액 3,000,000원\n라. 자산의 임대료 4,000,000원\n① 3,000,000원\n② 4,000,000원\n③ 5,000,000원\n④ 6.000,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 48, "text": "[48]다음은 ㈜삼일이 임원 또는 직원을 위하여 지출한 복리후생비 보조원장의 일부이다. 이 중 법인세법상\n손금으로 인정받지 못하는 금액을 계산하면 얼마인가?\n복 리 후 생 비\n2024년 1월 1일 ~ 2024년 12월 31일\n㈜삼일 (단위 : 원)\n월/일 적 요 금 액\n01/23 직장문화비 3,000,000\n01/25 사용자 부담 노인장기요양보험료 1,000,000\n02/03 우리사주조합 운영비 4,000,000\n06/27 직장어린이집 운영비 5,000,000\n12/23 직장회식비 2,000,000\n① 0원\n② 4,000,000원\n③ 6,000,000원\n④ 8,000,000원", "answer": 1}, {"year": "2024", "month": "11", "qnum": 49, "text": "[49]㈜삼일이 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 손익계산서에 비용으로 회계처리한 금액의\n내역은 다음과 같다. ㈜삼일의 제24기 세무조정시 손금불산입으로 세무조정해야 할 금액의 합계액은\n얼마인가?\nㄱ. 관세법 위반으로 인한 벌금 1,000,000원\nㄴ. 사계약상 납품지연 지체상금 2,000,000원\nㄷ. 원천징수 등 납부지연가산세 3,000,000원\nㄹ. 업무용 건물에 대한 재산세 4,000,000원\nㅁ. 법인세 6,000,000원\n① 6,000,000원\n② 8,000,000원\n③ 9,000,000원\n④ 10,000,000원", "answer": 4}, {"year": "2024", "month": "11", "qnum": 51, "text": "[51]다음 중 법인세법상 수익적 지출에 해당하는 것은?\n① 건물 또는 벽의 도장을 위한 지출\n② 엘리베이터의 설치를 위한 지출\n③ 빌딩의 피난시설 설치를 위한 지출\n④ 재해로 멸실되어 본래의 용도에 이용할 가치가 없는 건축물의 복구를 위한 지출", "answer": 1}, {"year": "2024", "month": "11", "qnum": 52, "text": "[52]㈜삼일(사업연도 : 1월 1일 ~ 12월 31일)은 2023년 7월 1일에 기계장치를 100,000,000원에 취득하\n였다. 회사는 세법상 기계장치에 대한 감가상각방법을 정액법으로, 내용연수는 10년으로 신고하였으며\n잔존가치는 없다. 회사가 2024년 감가상각비로 8,000,000원을 계상한 경우, 다음 각 상황에 따른 세무\n조정으로 옳은 것은?\n상황1. 전기 상각부인액이 4,000,000원이 있는 경우\n상황2. 전기 시인부족액이 4,000,000원이 있는 경우\n상황1 상황2\n① 손금불산입 2,000,000원 손금산입 2,000,000원\n② 손금불산입 3,000,000원 세무조정 없음\n③ 손금산입 3,000,000원 손금산입 2,000,000원\n④ 손금산입 2,000,000원 세무조정 없음", "answer": 4}, {"year": "2024", "month": "11", "qnum": 53, "text": "[53]다음 중 법인세법상 기부금에 관한 설명으로 옳지 않은 것은?\n① 일반기부금한도초과액은 해당 사업연도의 다음 사업연도 개시일부터 5년 이내에 끝나는 각 사업연\n도로 이월하여 그 이월된 사업연도의 소득금액을 계산할 때 손금산입한도액의 범위에서 손금에 산입\n한다.\n② 법인이 특수관계인에게 현물로 기부한 일반기부금은 기부했을 때의 장부가액과 시가 중 큰 금액으로\n해당 자산가액을 산정한다.\n③ 특수관계인 외의 자에게 정당한 사유 없이 자산을 정상가액보다 낮은 가액으로 양도함으로써 실질적\n으로 증여한 것으로 인정되는 금액은 기부금으로 본다.\n④ 내국법인이 각 사업연도에 지출하는 기부금을 이연계상한 경우에는 이를 그 지출한 사업연도의 기부\n금으로 하고, 그 후의 사업연도에 있어서는 이를 기부금으로 보지 아니한다.", "answer": 1}, {"year": "2024", "month": "11", "qnum": 54, "text": "[54]제조업을 영위하는 ㈜삼일(중소기업 아님)의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 기업업무\n추진비 세무조정을 위한 자료이다. 손금불산입 세무조정 금액으로 옳은 것은?\nㄱ. 포괄손익계산서상 매출액은 15,000,000,000원이고, 이 금액에는 매출할인 3,000,000,000원이 차감\n되어 있다.\nㄴ. 포괄손익계산서상 기업업무추진비로 비용처리한 금액은 74,000,000원(문화기업업무추진비와 전통\n시장에서 사용한 기업업무추진비는 없음)이다. 기업업무추진비에는 영수증 수취분 500,000원\n(1건)이 포함되어 있다.\nㄷ. 수입금액에 관한 적용률\n100억원 이하 0.3 %\n100억원 초과 500억원 이하 3천만원＋(수입금액－100억원)×0.2 %\n500억원 초과 1억1천만원+(수입금액－500억원)×0.03 %\n① 500,000원\n② 21,500,000원\n③ 22,000,000원\n④ 22,500,000원", "answer": 3}, {"year": "2024", "month": "11", "qnum": 55, "text": "[55]다음은 지급이자 손금불산입 항목을 나열한 것이다. 지급이자 손금불산입을 적용하는 순서를 나타낸 것\n으로 옳은 것은?\nㄱ. 채권자불분명 사채이자\nㄴ. 비실명 채권·증권의 이자상당액\nㄷ. 업무무관자산 등 관련 이자\nㄹ. 건설자금이자\n① ㄱ → ㄴ → ㄹ → ㄷ\n② ㄱ → ㄴ → ㄷ → ㄹ\n③ ㄴ → ㄱ → ㄹ → ㄷ\n④ ㄴ → ㄱ → ㄷ → ㄹ", "answer": 1}, {"year": "2024", "month": "11", "qnum": 57, "text": "[57]다음 중 법인세법상 손금으로 인정되는 준비금으로 옳지 않은 것은?\n① 책임준비금\n② 연구인력개발준비금\n③ 해약환급금준비금\n④ 고유목적사업준비금", "answer": 2}, {"year": "2024", "month": "11", "qnum": 59, "text": "[59]다음 중 법인세법상 이월결손금에 관한 설명으로 옳지 않은 것은?\n① 각 사업연도 소득에서 세법상 공제가능한 이월결손금을 공제한 금액을 초과하는 비과세소득은 다음\n사업연도로 이월되지 않고 소멸한다.\n② 각 사업연도의 익금총액보다 손금총액이 큰 경우 동 차액을 결손금이라 하며, 동 결손금이 다음 사\n업연도로 이월되는 경우 이를 법인세법상 이월결손금이라 한다.\n③ 세무상 결손금은 과세표준 계산상 공제되거나 자산수증이익이나 채무면제이익에 의해 보전되면 소멸\n된다.\n④ 중소기업인 경우 이월결손금에 대한 공제는 각 사업연도 소득의 100분의 90을 한도로 한다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 46, "text": "[46]다음 중 「자본금과 적립금조정명세서(을)」에 기재해야 하는 세무조정 사항에 해당하는 것은?\n① 감가상각비한도초과액의 손금불산입\n② 자본잉여금으로 계상한 자기주식처분이익의 익금산입\n③ 임원퇴직급여한도초과액의 손금불산입\n④ 특례기부금한도초과액의 손금불산입", "answer": 1}, {"year": "2024", "month": "12", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되지 않는 금액은 얼마인가?\n(1) 종합부동산세의 과오납금 환급금이자 1,000,000원\n(2) 손금불산입된 법인세의 환급액 2,000,000원\n(3) 채무면제이익(이월결손금 없음) 3,000,000원\n(4) 손금에 산입된 재산세의 환급액 4,000,000원\n① 3,000,000원\n② 4,000,000원\n③ 5,000,000원\n④ 9,000,000원", "answer": 1}, {"year": "2024", "month": "12", "qnum": 48, "text": "[48]다음 자료에 의할 경우 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일)에 김삼일 이사(주주\n에 해당함)의 인건비 중 손금불산입되는 금액은 얼마인가?\nㄱ. 김삼일 이사는 ㈜삼일에 4년 9개월간 근무하다가 2024년 12월 31일에 퇴직하였다.\nㄴ. ㈜삼일은 김삼일 이사에게 퇴직급여 20,000,000원을 지급하였다. ㈜삼일은 퇴직급여충당금을\n설정하지 않으며, 임원퇴직급여 규정도 두고 있지 않다.\nㄷ. 퇴직 직전 1년간 김삼일 이사에게 지급한 급여액은 24,000,000원이며 상여금은 10,000,000\n원(정관규정의 지급한도를 초과한 4,000,000원 포함)이다.\nㄹ. 급여액 등 인건비는 모두 손익계산서상 비용으로 회계처리되었다.\n① 4,000,000원\n② 4,750,000원\n③ 5,750,000원\n④ 9,750,000원", "answer": 4}, {"year": "2024", "month": "12", "qnum": 49, "text": "[49]제조업을 영위하는 ㈜삼일의 제24기(2024년 1월 1일 ~ 2024년 12월 31일) 손익계산서에 계상한 비\n용이다. ㈜삼일의 제24기 세무조정시 손금불산입되는 금액으로 옳은 것은?\n(1) 직장체육비 1,000,000원\n(2) 벌금 2,000,000원\n(3) 임직원에 대한 사회통념상 타당한 범위에서 지급하는 경조금 3,000,000원\n(4) 소액주주가 아닌 출자자인 임원이 사용하는 사택유지비 4,000,000원\n(5) 형법상 뇌몰 5,000,000원\n① 7,000,000원\n② 8,000,000원\n③ 11,000,000원\n④ 12,000,000원", "answer": 3}, {"year": "2024", "month": "12", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각에 관한 설명으로 옳지 않은 것은?\n① 전화기(휴대용 전화기 포함) 및 개인용 컴퓨터(그 주변기기 포함)는 그 사업에 사용한 날이 속하는\n사업연도에 손비로 계상하면 이를 손금에 산입한다.\n② 자산 취득가액이 거래단위별로 100만원 이하인 경우로서 그 고유업무의 성질상 대량으로 보유하는\n자산은 시부인계산 과정을 거치지 않고 전액 손금으로 인정한다.\n③ 시간의 경과에 따라 그 가치가 감소되지 아니하는 자산은 감가상각자산에 포함하지 아니한다.\n④ 광업권에 대하여 감가상각방법을 신고하지 않은 경우 생산량비례법을 적용한다.", "answer": 2}, {"year": "2024", "month": "12", "qnum": 52, "text": "[52]다음은 ㈜삼일이 2024년 10월 1일에 취득한 기계장치에 관한 자료이다. 이 자료를 기초로 제24기\n(2024년 1월 1일 ~ 2024년 12월 31일) 사업연도의 기계장치 상각범위액을 계산하면 얼마인가?\nㄱ. 기계장치의 취득가액: 4억원\nㄴ. 2024.12.1에 발생한 기계장치에 대한 자본적 지출: 2억원\nㄷ. 감가상각방법: 정액법\nㄹ. 신고내용연수: 5년(정액법 상각률 0.2)\n① 25,000,000원\n② 30,000,000원\n③ 35,000,000원\n④ 40,000,000원", "answer": 2}, {"year": "2024", "month": "12", "qnum": 54, "text": "[54]다음 중 법인세법상 기업업무추진비에 관한 설명으로 옳지 않은 것은?\n① 광고·선전목적으로 달력 등을 불특정 다수인에게 기증한 것은 일반적으로 기업업무추진비로 보지\n않고 전액 손금으로 인정한다.\n② 기업업무추진비를 금전이 아닌 현물로 제공한 경우에는 ‘시가와 장부금액 중 큰 금액’을 기업업무\n추진비로 본다.\n③ 특정 거래처에게 광고선전물품으로 30,000원 상당의 달력과 30,000원 상당의 컵을 기증하였다면\n60,000원을 기업업무추진비로 본다.\n④ 기업업무추진비 관련 VAT매입세액 불공제액은 기업업무추진비로 본다.", "answer": 3}, {"year": "2024", "month": "12", "qnum": 55, "text": "[55]다음 중 법인세법상 지급이자 손금불산입 규정과 관련된 설명으로 옳지 않은 것은?\n① 일반차입금에 대한 건설자금이자는 자본화 할 수 없다.\n② 건설자금이자의 계상대상에 투자자산과 제조 등에 장기간이 소요되는 재고자산은 포함되지 아니한\n다.\n③ 비실명 채권·증권의 이자상당액은 건설자금이자보다 우선하여 지급이자 손금불산입 규정을 적용한\n다.\n④ 업무무관자산등에 대한 지급이자를 계산할 때, 업무무관자산가액은 취득가액에 의하여 계산한다.", "answer": 1}, {"year": "2024", "month": "12", "qnum": 57, "text": "[57]다음 중 법인세법상 손금으로 인정되는 준비금으로 옳지 않은 것은?\n① 해약환급금준비금\n② 고유목적사업준비금\n③ 배당평균준비금\n④ 책임준비금", "answer": 3}, {"year": "2024", "month": "12", "qnum": 58, "text": "[58]㈜삼일은 2024년 9월 1일에 회사의 전무이사로부터 시가 10억원인 토지를 13억원에 매입하며 다음과\n같이 회계처리하였다. 토지 매입과 관련하여 2024년에 필요한 세무조정으로 옳은 것은?\n(차변) 토지 13 억원 (대변) 현금 13 억원\n① (손금산입) 토지 1억원(△유보)\n(손금불산입) 고가매입액 1억원(상여)\n② (손금산입) 토지 3억원(△유보)\n(손금불산입) 고가매입액 3억원(상여)\n③ (손금산입) 토지 3억원(△유보)\n④ (손금불산입) 고가매입액 3억원(상여)", "answer": 2}, {"year": "2024", "month": "12", "qnum": 59, "text": "[59]다음의 자료를 이용하여 ㈜삼일의 제24기 사업연도(2024년 1월 1일 ~ 2024년 12월 31일) 과세표준\n금액을 계산하면 얼마인가?\nㄱ. 당기순이익 : 200,000,000원\nㄴ. 소득금액조정합계표상 금액\n- 익금산입·손금불산입 : 100,000,000원\n- 손금산입·익금불산입 : 70,000,000원\nㄷ. 이월결손금(제23기 사업연도 발생분) : 10,000,000원\nㄹ. 비과세소득 : 3,000,000원(영업외수익에 포함됨)\nㅁ. 소득공제 : 2,000,000원\n① 215,000,000원\n② 220,000,000원\n③ 225,000,000원\n④ 230,000,000원", "answer": 1}, {"year": "2025", "month": "1", "qnum": 46, "text": "[46]다음의 세무조정사항 중에서 귀속자에 대한 추가적인 과세나 사후관리가 불필요한 소득처분에 해당하는\n것은?\n① 업무무관자산 등 관련이자 손금불산입액\n② 퇴직급여충당금 한도초과 손금불산입액\n③ 감가상각비 한도초과 손금불산입액\n④ 임직원에 대한 가지급금 인정이자 익금산입액", "answer": 1}, {"year": "2025", "month": "1", "qnum": 48, "text": "[48]다음 중 법인세법상 손금에 관한 설명으로 옳은 것은?\n① 합명회사의 노무출자사원에게 지급하는 보수는 손금항목이다.\n② 임원에게 지급하는 상여금 중 정관 또는 주주총회, 사원총회나 이사회 결의에 의하여 결정된 지급기\n준을 초과하여 지급하는 금액도 손금항목이다.\n③ 사계약상 의무불이행으로 인한 지체상금은 손금항목이다.\n④ 주식을 액면가액에 미달하는 가액으로 발행하는 경우 그 액면가액에 미달하는 금액은 손금항목이다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각에 관한 설명으로 옳지 않은 것은?\n① 건물에 엘리베이터를 설치한 비용은 자본적 지출에 해당한다.\n② 재해로 손실되어 자산의 본래용도에 이용할 가치가 없는 건축물 등의 복구비용은 자본적 지출에 해\n당한다.\n③ 건축물의 상각방법은 정액법, 정률법 중 선택할 수 있다.\n④ 광업권의 상각방법은 무신고시 생산량비례법을 적용한다.", "answer": 3}, {"year": "2025", "month": "1", "qnum": 52, "text": "[52]㈜삼일(사업연도 : 1월 1일 ~ 12월 31일)은 2025년 7월 1일에 기계장치를 100,000,000원에 취득하\n고 취득 즉시 사업에 사용하였다. 당해 기계장치의 세법상 내용연수는 10년, 잔존가액은 없으며, 정액\n법으로 감가상각한다. 회사가 결산상 감가상각비로 2025년에 6,000,000원, 2026년에 8,000,000원을\n계상한 경우 올바른 세무조정은(단, ㈜삼일은 감가상각의제대상이 아닌 것으로 가정한다)?\n① 2025년 : (손금산입) 1,000,000원 (△유보)\n2026년 : (손금산입) 2,000,000원 (△유보)\n② 2025년 : (손금불산입) 1,000,000원 (유보)\n2026년 : 세무조정 없음\n③ 2025년 : (손금불산입) 1,000,000원 (유보)\n2026년 : (손금산입) 1,000,000원 (△유보)\n④ 2025년 : (손금산입) 4,000,000원 (△유보)\n2026년 : (손금산입) 2,000,000원 (△유보)", "answer": 3}, {"year": "2025", "month": "1", "qnum": 53, "text": "[53]㈜삼일은 특수관계인인 (재) 좋은일하기운동본부에게 현물(장부가액 100,000,000원, 시가 50,000,000원)\n을 기부하였다. 당해 기부금은 일반기부금에 해당하며, 회사의 기준소득금액은 1,000,000,000원이고,\n이월결손금은 800,000,000원이다. ㈜삼일은 이월결손금을 100 % 공제받는 중소기업이며, 사회적기업육\n성법에 따른 사회적기업에 해당하지 않는다. ㈜삼일은 상기 기부금 외 다른 기부금은 없는 것으로 가정\n할 경우 기부금 한도초과액은 얼마인가?\n① 한도초과액 없음\n② 20,000,000원\n③ 30,000,000원\n④ 80,000,000원", "answer": 4}, {"year": "2025", "month": "1", "qnum": 54, "text": "[54]다음은 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 기업업무추진비 보조원장을 요약한\n자료이다. 다음 중 ㈜삼일의 제25기 세무조정으로 옳은 것은(단, 법인세법상 기업업무추진비 한도액은\n20,000,000원이다)?\n적요 금액 비고\n거래처 기업업무추진비 1건 500,000원 증빙 미수취\n거래처 기업업무추진비 1건 30,000원 영수증 수취분\n거래처 기업업무추진비 1건 25,000,000원 세금계산서 수취분\n(합계) 25,530,000원\n① (손금불산입) 증빙불비 기업업무추진비 500,000원 (상여)\n② (손금불산입) 기업업무추진비 한도초과액 5,530,000원 (기타사외유출)\n③ (손금불산입) 증빙불비 기업업무추진비 500,000원 (상여)\n(손금불산입) 기업업무추진비 한도초과액 5,030,000원 (기타사외유출)\n④ (손금불산입) 증빙불비 기업업무추진비 500,000원 (상여)\n(손금불산입) 기업업무추진비 한도초과액 15,030,000원 (기타사외유출)", "answer": 3}, {"year": "2025", "month": "1", "qnum": 55, "text": "[55]다음 중 법인세법상 업무무관자산 등 지급이자 손금불산입에 관한 설명으로 옳지 않은 것은?\n① 법인의 업무에 직접 사용하지 않는 부동산은 업무무관자산에 해당한다.\n② 업무무관자산 등 지급이자 손금불산입 계산시 지급이자는 선순위로 손금불산입된 금액을 제외하지\n만, 선순위로 손금불산입된 지급이자 관련 차입금은 차입금 적수 계산시 제외하지 않는다.\n③ 지급이자는 타인에게서 자금을 차용하는데 대응하여 지급되는 금융비용으로서 미지급이자는 포함하\n되, 미경과이자는 제외한다.\n④ 지급이자 손금불산입하는 가지급금은 특수관계인에 대한 업무무관가지급금을 말한다.", "answer": 2}, {"year": "2025", "month": "1", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 대손충당금과 관\n련된 자료이다. 다음 중 제25기 사업연도의 대손충당금에 관한 세무조정으로 옳은 것은?\n(1) 대손충당금\n매출채권 7,000,000 기초잔액 10,000,000\n기말잔액 20,000,000 당기설정액 17,000,000\n합 계 27,000,000 합 계 27,000,000\n기초잔액에는 전기 대손충당금 한도초과액 8,000,000원이 포함되어 있고, 매출채권\n7,000,000원이 당기에 상법상 소멸시효가 완성되어 회수할 수 없게 되어 대손충당\n금과 상계하였다.\n(2) 대손충당금 설정대상 채권가액\n전기말 대손충당금 설정대상 채권가액 200,000,000원\n당기말 대손충당금 설정대상 채권가액 300,000,000원\n① (손금불산입) 대손충당금 한도초과액 17,000,000원 (유보)\n② (손금산입) 전기 대손충당금 부인액 8,000,000원 (△유보)\n③ (손금산입) 전기 대손충당금 부인액 8,000,000원 (△유보)\n(손금불산입) 대손충당금 한도초과액 17,000,000원 (유보)\n④ (손금산입) 전기 대손충당금 부인액 8,000,000원 (△유보)\n(손금불산입) 대손충당금 한도초과액 9,500,000원 (유보)", "answer": 4}, {"year": "2025", "month": "1", "qnum": 59, "text": "[59]다음의 자료를 이용하여 중소기업인 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31\n일)의 법인세 과세표준을 구하면 얼마인가?\n가. 당기순이익 : 500,000,000원\n나. 소득금액조정합계표상 금액\n- 익금산입 손금불산입 : 90,000,000원\n- 손금산입 익금불산입 : 10,000,000원\n다. 비과세소득 : 10,000,000원\n라. 공제되지 아니한 세무상 이월결손금\n- 제 4 기(2004년 1월 1일 ~ 2004년 12월 31일) : 3,000,000원\n- 제24기(2024년 1월 1일 ~ 2024년 12월 31일) : 10,000,000원\n① 557,000,000원\n② 560,000,000원\n③ 570,000,000원\n④ 580,000,000원", "answer": 2}, {"year": "2025", "month": "3", "qnum": 46, "text": "[46]다음 중 법인세의 계산구조에 따라 과세표준 계산시 고려되는 항목으로 옳지 않은 것은?\n① 소득공제\n② 비과세소득\n③ 이월결손금\n④ 기납부세액", "answer": 4}, {"year": "2025", "month": "3", "qnum": 49, "text": "[49]다음 중 법인세법상 인건비 중에서 손금불산입 항목이 아닌 것은?\n① 직원(지배주주 및 그와 특수관계가 있는 직원이 아님)에게 정관 또는 주주총회·사원총회나 이사회\n의 결의에 의하여 결정된 급여지급기준에 의한 금액을 초과하여 상여금을 지급한 경우 그 초과액\n② 임원 또는 직원에게 이익처분에 의하여 지급하는 상여금\n③ 임원에게 정관이나 정관에 위임된 퇴직금지급규정의 한도액을 초과하여 퇴직급여를 지급한 경우 그\n초과액\n④ 합명회사 또는 합자회사의 노무출자사원에게 지급하는 보수", "answer": 1}, {"year": "2025", "month": "3", "qnum": 50, "text": "[50]다음 중 법인세법상 손익귀속시기에 관한 설명으로 옳지 않은 것은?\n① 금융보험업 이외의 업종을 영위하는 법인이 이자수익을 발생주의에 따라 회계처리한 경우 법인세법\n에 따라 원천징수되지 아니하는 이자수익에 한하여 이를 인정한다.\n② 장기할부판매손익은 원칙적으로 작업진행률을 기준으로 하여 수익과 비용을 각 사업연도 익금과 손\n금에 산입한다.\n③ 제품판매의 경우 손익귀속시기는 원칙적으로 상품 등을 인도한 날이다.\n④ 중소기업인 법인이 수행하는 계약기간이 1년 미만인 건설용역의 경우 용역제공완료일이 속하는 사\n업연도의 익금과 손금에 산입할 수 있다.", "answer": 2}, {"year": "2025", "month": "3", "qnum": 55, "text": "[55]㈜삼일은 2025년 1월 1일 업무무관자산인 스포츠카를 30,000,000원에 구입하였다. ㈜삼일의 제25기\n(2025년 1월 1일 ~ 2025년 12월 31일) 사업연도의 지급이자는 10,000,000원이고 차입금 적수가\n24,900,000,000원인 경우 업무무관자산 등에 관한 지급이자 손금불산입금액은 얼마인가(단, 선순위 부\n인된 지급이자 손금불산입금액은 2,000,000원이고, 관련차입금적수는 3,000,000,000원이다)?\n① 10,958원\n② 13,698원\n③ 4,000,000원\n④ 8,000,000원", "answer": 3}, {"year": "2025", "month": "3", "qnum": 56, "text": "[56]다음 자료는 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 사업연도의 퇴직연금충당금에\n관한 것이다. 퇴직연금충당금과 관련하여 ㈜삼일이 수행해야 하는 세무조정으로 옳은 것은?\n가. 세무상 퇴직급여충당금 기말잔액 : 10,000,000원\n나. 당기말 현재 퇴직급여추계액 : 90,000,000원\n다. 확정급여형 퇴직연금운용자산의 변동내역\n퇴직연금운용자산\n전기이월액 4,000,000원 당기지급액 -\n당기증가액 14,000,000원 차기이월액 18,000,000원\n18,000,000원 18,000,000원\n라. ㈜삼일은 퇴직연금을 신고조정에 의하여 손금산입하고 있으며, 세무상 기초유보는\n△4,000,000원이다.\n마. 퇴직연금운용자산의 당기 납부액은 회계상 비용처리 하지 않고 자산으로 계상했다.\n① (손금불산입) 10,000,000원 (유보)\n② (손금산입) 10,000,000원 (△유보)\n③ (손금불산입) 14,000,000원 (유보)\n④ (손금산입) 14,000,000원 (△유보)", "answer": 4}, {"year": "2025", "month": "3", "qnum": 57, "text": "[57]법인세법상 손금으로 인정되지 않는 준비금 또는 충당금에 해당하는 것은?\n① 대손충당금\n② 퇴직급여충당금\n③ 책임준비금\n④ 재고자산평가충당금", "answer": 4}, {"year": "2025", "month": "3", "qnum": 59, "text": "[59]다음의 자료를 이용하여 중소기업인 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31\n일)의 법인세 산출세액을 계산하면 얼마인가?\n가. 손익계산서상 당기순이익 : 500,000,000원\n나. 소득금액조정합계표상 금액\n- 익금산입 ․ 손금불산입 : 90,000,000원\n- 손금산입 ․ 익금불산입 : 20,000,000원\n다. 제23기 사업연도 발생한 결손금 중 미공제된 금액 : 40,000,000원\n라. 법인세의 세율은 과세표준 2억원 이하는 9 %, 2억원 초과 200억원 이하분은 19 % 임.\n① 47,700,000원\n② 80,700,000원\n③ 95,900,000원\n④ 100,700,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되는 금액을 계산하면 얼마인가?\n(1) 부가가치세 매출세액 6,000,000원\n(2) 자산수증이익(이월결손금 보전에 사용되지 않음) 4,000,000원\n(3) 전기에 손금불산입된 법인세의 환급액 3,000,000원\n(4) 사무실 임대료 수익 2,000,000원\n(5) 주식발행초과금 1,000,000원\n(6) 특수관계인인 법인으로부터 유가증권 저가매입액 3,000,000원\n① 6,000,000원\n② 8,000,000원\n③ 10,000,000원\n④ 12,000,000원", "answer": 1}, {"year": "2025", "month": "5", "qnum": 48, "text": "[48]다음 중 법인세법상 손금으로 인정되는 평가손실로 옳지 않은 것은?\n① ㈜화성은 화재로 소실된 공장설비에 대하여 평가손실을 계상하였다.\n② ㈜수원는 세법상 재고자산평가방법을 저가법으로 신고하고, 동 재고자산에 대한 평가손실을 계상하\n였다.\n③ ㈜경기는 단기매매차익을 목적으로 취득한 단기매매증권에 대하여 결산일에 시가 하락에 따른 평가\n손실을 계상하였다.\n④ ㈜한국은 보유중인 주식을 발행한 법인이 파산하여 동 주식에 대한 평가손실을 계상하였다.", "answer": 3}, {"year": "2025", "month": "5", "qnum": 49, "text": "[49]㈜삼일이 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 손익계산서에 비용으로 회계처리한 금액의\n내역은 다음과 같다. ㈜삼일의 제25기 세무조정시 손금불산입으로 세무조정해야 할 금액의 합계액은\n얼마인가?\n(1) 속도위반 과태료 1,000,000원\n(2) 사계약상 납품지연 지체상금 2,000,000원\n(3) 원천징수 등 납부지연가산세 3,000,000원\n(4) 업무무관자산에 대한 재산세 4,000,000원\n(5) 법인지방소득세 6,000,000원\n① 10,000,000원\n② 12,000,000원\n③ 13,000,000원\n④ 14,000,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 50, "text": "[50]다음 중 법인세법상 손익의 귀속사업연도에 관한 설명으로 옳지 않은 것은?\n① 부동산의 양도는 대금청산일, 소유권이전등기일, 인도일 또는 사용수익일 중 빠른 날에 손익을 인식\n한다.\n② 중소기업의 경우 장기할부판매는 결산상 인도기준으로 인식한 경우에도 회수기일도래기준을 적용할\n수 있다.\n③ 자산의 위탁매매의 손익귀속사업연도는 수탁자가 자산을 매매한 날이 속하는 사업연도로 한다.\n④ 중소기업인 법인이 수행하는 계약기간 1년 이상인 건설은 그 제공을 완료한 날이 속하는 사업연도\n의 익금과 손금에 산입할 수 있다.", "answer": 4}, {"year": "2025", "month": "5", "qnum": 51, "text": "[51]다음 중 법인세법상 수익적 지출인 것은?\n① 엘리베이터의 설치를 위한 지출\n② 기계의 소모된 부속품의 대체\n③ 본래의 용도를 변경하기 위한 개조\n④ 재해로 멸실되어 본래의 용도에 이용할 가치가 없는 건축물의 복구를 위한 지출", "answer": 2}, {"year": "2025", "month": "5", "qnum": 53, "text": "[53]㈜삼일의 기부금과 관련된 정보가 다음과 같을 경우 제25기(2025년 1월 1일 ~ 2025년 12월 31일)의\n특례기부금에 해당하는 금액은 얼마인가?\nㄱ. 회사는 서울특별시에 200,000,000원을 2025년 12월 24일에 기부하기로 약정하고 2026년 1월\n14일에 실제 지급하였다.\nㄴ. 회사는 2025.4.19.에 국군부대에 장부가액 120,000,000원(기부일 현재 시가는 90,000,000원)의\n버스를 기부하였다.\nㄷ. 회사는 2025년 2월 3일에 대표이사의 향우회에 10,000,000원을 기부하였다.\n① 90,000,000원\n② 120,000,000원\n③ 130,000,000원\n④ 210,000,000원", "answer": 2}, {"year": "2025", "month": "5", "qnum": 54, "text": "[54]제조업을 영위하는 ㈜삼일(중소기업 아님)의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 기업업무\n추진비 세무조정을 위한 자료이다. 기업업무추진비에 대하여 손금불산입 세무조정 금액으로 옳은 것은?\n(1) 포괄손익계산서상 매출액은 20,000,000,000원이며, 특수관계인에 대한 매출액은 없다.\n(2) 포괄손익계산서상 기업업무추진비로 비용처리한 금액은 70,000,000원이고, 문화기업업무추진비,\n전통시장 기업업무추진비와 경조금 해당액은 없다.\n(3) 제25기 기업업무추진비 내역은 다음과 같다.\n구 분 건당 3만원 이하분 건당 3만원 초과분\n법정증명서류 수취분 15,000,000원 53,000,000원\n영수증 수취분 1,000,000원 1,000,000원\n(4) 수입금액에 관한 적용률\n100억원 이하 3/1,000\n100억원 초과 500억원 이하 3천만원＋(수입금액-100억원)×2/1,000\n① 1,000,000원\n② 5,000,000원\n③ 6,000,000원\n④ 8,000,000원", "answer": 4}, {"year": "2025", "month": "5", "qnum": 55, "text": "[55]제조업을 영위하는 중소기업 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 차입금 및 대여\n금에 관한 자료이다. 법인세법상 손금불산입으로 세무조정해야 하는 지급이자는 얼마인가?\n(1) 당기말 현재 차입금 및 지급이자의 내역\n구 분 연이자율 지급이자 차입금 차입금적수\n운영자금대출 5 % 5,000,000원 100,000,000원 36,500,000,000원\n(2) 당기말 현재 재무상태표상 대여금의 내역\n구 분 대여금 대여금적수 비 고\n임원 갑 50,000,000원 18,250,000,000원 업무무관가지급금\n거래처 10,000,000원 3,650,000,000원 특수관계인이 아님\n(3) 대여금은 모두 제24기 말에 대여하였으며, 제25기 중 대여금은 변동이 없다.\n① 1,500,000원\n② 2,000,000원\n③ 2,500,000원\n④ 3,000,000원", "answer": 3}, {"year": "2025", "month": "5", "qnum": 57, "text": "[57]다음 중 법인세법상 손금으로 인정되는 준비금으로 옳지 않은 것은?\n① 사업확장준비금\n② 고유목적사업준비금\n③ 해약환급금준비금\n④ 책임준비금", "answer": 1}, {"year": "2025", "month": "6", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되는 금액의 합계액은 얼마인가?\n(1) 주식발행초과액 200,000원\n(2) 법인세환급액 100,000원\n(3) 채무면제이익(이월결손금 없음) 100,000원\n(4) 재산세에 대한 환급가산금 300,000원\n(5) 자기주식의 양도금액 400,000원\n① 300,000원\n② 400,000원\n③ 500,000원\n④ 800,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 48, "text": "[48]제조업을 영위하는 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 손익계산서에 계상한 비\n용이다. ㈜삼일의 제25기 세무조정시 손금불산입되는 금액으로 옳은 것은?\n(1) 직장회식비 1,000,000원\n(2) 과태료 2,000,000원\n(3) 사회통념상 타당한 범위에서 지급하는 임직원 경조금 3,000,000원\n(4) 소액주주인 임원이 사용하는 사택유지비 4,000,000원\n(5) 형법상 뇌물 5,000,000원\n① 7,000,000원\n② 8,000,000원\n③ 11,000,000원\n④ 12,000,000원", "answer": 1}, {"year": "2025", "month": "6", "qnum": 49, "text": "[49]㈜경기는 제품의 결함을 알면서도 그 결함에 대하여 필요한 조치를 취하지 아니한 결과로 사용자가 부\n상을 입었다. 이에 따라 ㈜경기는 제조물책임법에 따라 30,000,000원의 손해배상금을 지급하고 비용으\n로 회계처리하였다. 피해자의 실제 발생한 손해액이 분명하지 않은 경우 ㈜경기가 손금불산입으로 세무\n조정할 금액은 얼마인가(단, 제조물책임법상 손해배상액의 상한이 되는 배수는 3배이다)?\n① 10,000,000원\n② 15,000,000원\n③ 20,000,000원\n④ 30,000,000원", "answer": 3}, {"year": "2025", "month": "6", "qnum": 51, "text": "[51]다음 중 법인세법상 자본적지출 항목으로 옳지 않은 것은?\n① 빌딩의 피난시설 설치\n② 재해를 입은 자산의 외장복구\n③ 재해로 멸실되어 본래의 용도에 이용가치가 없는 건축물의 복구\n④ 엘리베이터 설치", "answer": 2}, {"year": "2025", "month": "6", "qnum": 53, "text": "[53]다음 중 법인세법상 특례기부금에 해당하지 않는 것은?\n① 사회복지공동모금회에 지출하는 기부금\n② 사회복지법인의 고유목적사업비로 지출하는 기부금\n③ 사립학교 연구비로 지출하는 기부금\n④ 천재지변으로 인한 이재민을 위한 구호금품", "answer": 2}, {"year": "2025", "month": "6", "qnum": 54, "text": "[54]중소기업이며 제조업을 영위하는 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일)의\n기업업무추진비와 관련된 자료가 다음과 같을 경우, 세무조정으로 인한 손금불산입액의 총합계는 얼마\n인가?\n(1) 기업업무추진비지출액 : 90,000,000원\n[영수증을 받은 금액 2,000,000원(1건)을 제외한 나머지 지출금액은 법정증명서류를 수취함]\n(2) 손익계산서상 매출액 : 90억원(매출액은 전액 제조업에서 발생한 금액으로서 특수관계인 거래\n분은 없음)\n(3) 사업연도 중 중단된 사업부문(소매업)의 매출액 10억원(손익계산서상 매출액에는 포함되어 있\n지 않으며, 특수관계인 거래분 없음)\n(4) 기업업무추진비 손금한도액 계산시 수입금액기준한도액 계산에 필요한 적용률은 수입금액 100\n억원 이하분에 대하여 0.3 % 이다.\n① 22,000,000원\n② 24,000,000원\n③ 26,000,000원\n④ 28,000,000원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 55, "text": "[55]㈜삼일은 2025년 1월 1일 대표이사가 사용할 목적으로 업무무관자산인 요트를 100,000,000원에 구입\n하였다. ㈜삼일의 지급이자가 10,000,000원, 차입금적수가 73,000,000,000원인 경우 업무무관자산 등\n에 관한 지급이자 손금불산입금액으로 옳은 것은(단, 선순위 부인된 지급이자 손금불산입 금액은 없\n다)?\n① 2,500,000원\n② 5,000,000원\n③ 7,500,000원\n④ 10,000,000원", "answer": 2}, {"year": "2025", "month": "6", "qnum": 57, "text": "[57]다음 중 준비금 및 충당금에 관한 설명으로 옳지 않은 것은?\n① 해약환급금준비금은 보험회사가 설정대상이다.\n② 비영리내국법인의 고유목적사업준비금은 법인세법에 근거하고 있다.\n③ 준비금은 손금에 산입한 후 환입하거나 비용과 상계하기 때문에 손금에 산입하는 사업연도에는 조세\n부담을 경감시키고 환입하거나 상계하는 연도에 조세부담을 증가시키게 된다.\n④ 수선충당금은 법인세법에서는 손금으로 인정되는 충당금으로 열거되어 있다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 46, "text": "[46]다음 자료를 기초로 ㈜삼일의 제1기(2025년 7월 1일 ~ 2025년 12월 31일) 법인세 산출세액을 계산\n하면 얼마인가?\n㈜삼일\n손익계산서\n2025년 7월 1일 ~ 2025년 12월 31일\n(단위: 원)\n매출액 950,000,000원\n매출원가 600,000,000원\n급여 126,000,000원\n감가상각비 24,000,000원\n법인세비용차감전순이익 200,000,000원\n- 손익계산서의 수익과 비용은 다음을 제외하고 모두 세법상 적정하게 계상되어 있다.\n⋅ 급여 126,000,000원에는 대표이사에 대한 상여금 한도초과액 20,000,000원, 종업원에\n대한 상여금 한도초과액 10,000,000원이 포함되어 있다.\n⋅ 감가상각비 24,000,000원에 대한 세법상 감가상각범위액은 14,000,000원이다.\n⋅ 법인세율(과세표준 2억원 이하분 9 %, 2억원 초과 200억원 이하분 19 %)\n① 23,700,000원\n② 33,700,000원\n③ 35,600,000원\n④ 67,400,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 47, "text": "[47]다음 중 법인세법상 익금으로 인정되는 금액은 얼마인가?\nㄱ. 자본거래로 특수관계인으로부터 분여받은 이익 5,000,000원\nㄴ. 채무면제이익(세무상 이월결손금 없음) 4,000,000원\nㄷ. 국세ᆞ·지방세 과오납금의 환급금 이자 3,000,000원\nㄹ. 자기주식의 양도금액 2,000,000원\n① 4,000,000원\n② 6,000,000원\n③ 11,000,000원\n④ 14,000,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 49, "text": "[49]다음 중 법인세법상 업무무관자산의 세무상 처리방법에 관한 설명으로 옳지 않은 것은?\n① 업무무관자산 취득시 지출한 취득세와 등록비용은 취득부대비용으로 취득원가에 가산한다.\n② 업무무관자산에 대한 감가상각비, 유지비, 수선비 등은 손금불산입한다.\n③ 업무무관자산 처분시 자산의 장부가액은 손금으로 인정하지 않는다.\n④ 업무무관자산 등에 대한 지급이자는 손금불산입한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 50, "text": "[50]다음 중 법인세법상 손익귀속시기에 관한 설명으로 옳지 않은 것은?\n① 중소기업인 법인이 수행하는 계약기간이 1년 미만인 건설 용역의 경우 목적물의 인도일이 속하는\n사업연도의 익금과 손금에 산입할 수 있다.\n② 금융보험업 이외의 법인이 이자수익을 발생주의에 따라 회계처리한 경우 법인세법상 원천징수되지\n아니하는 이자소득에 한하여 이를 인정한다.\n③ 장기할부판매손익은 원칙적으로 작업진행률을 기준으로 하여 계산한 수익과 비용을 각 사업연도 익\n금과 손금에 산입한다.\n④ 재고자산 외의 자산의 양도손익은 대금청산일, 소유권이전등기일, 인도일 또는 사용수익일 중 가장\n빠른 날이 속하는 사업연도로 한다.", "answer": 3}, {"year": "2025", "month": "7", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각과 관련된 설명으로 옳지 않은 것은?\n① 내용연수는 구조 또는 자산별∙업종별로 기획재정부령으로 정하고 있다.\n② 건물에 피난시설 설치를 위하여 지출한 금액은 자본적 지출에 해당한다.\n③ 잔존가액은 유형∙무형자산의 구분 없이 0(영)으로 하고 있다. 다만 정률법의 상각률을 계산하는 경\n우에는 취득가액의 5 % 로 본다.\n④ 감가상각자산의 취득가액은 취득 당시의 자산가액과 자산이 고유기능을 발휘하는 시점까지 투입된\n비용을 포함하므로, 건설자금이자는 취득가액에 포함하지 않는다.", "answer": 4}, {"year": "2025", "month": "7", "qnum": 52, "text": "[52]㈜삼일(사업연도 : 1월 1일 ~ 12월 31일)은 2024년 7월 1일에 기계장치를 100,000,000원에 취득하\n였다. 회사는 세법상 기계장치에 대한 감가상각방법을 정액법으로, 내용연수는 10년으로 신고하였으며\n잔존가치는 없다. 회사가 2025년 감가상각비로 8,000,000원을 계상한 경우, 다음 각 상황에 따른 세무\n조정으로 옳은 것은?\n상황1. 전기 상각부인액이 4,000,000원이 있는 경우\n상황2. 전기 시인부족액이 4,000,000원이 있는 경우\n(단, 회사는 법인세 감면 대상 사업을 영위하고 있으나 세액감면을\n받지 않는 것으로 가정함)\n상황1 상황2\n① 손금산입 2,000,000원 손금산입 2,000,000원\n② 손금불산입 3,000,000원 손금불산입 3,000,000원\n③ 손금산입 3,000,000원 손금산입 2,000,000원\n④ 손금산입 2,000,000원 세무조정 없음", "answer": 4}, {"year": "2025", "month": "7", "qnum": 53, "text": "[53]다음 자료를 이용하여 ㈜삼일의 일반기부금 한도초과액을 계산하면 얼마인가?\nㄱ. 특수관계 없는 종교단체(일반기부금 대상)로부터 시가 300,000,000원의 건물을\n438,000,000원에 매입하였다.\nㄴ. 특수관계 없는 사회복지법인(일반기부금 대상)에게 장부가액 150,000,000원\n(시가 300,000,000원)의 토지를 180,000,000원에 양도하였다.\nㄷ. 위 매매거래는 모두 정당한 사유가 없으며, 당기 일반기부금 한도액은 45,000,000원\n이라고 가정한다.\n① 0원\n② 33,000,000원\n③ 69,000,000원\n④ 213,000,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 55, "text": "[55]제조업을 영위하는 ㈜삼일의 제25기 사업연도(2025.1.1. ~ 2025.12.31.)에 다음의 지급이자를 손익계\n산서상 영업외비용으로 회계처리한 경우 손금불산입할 금액은 얼마인가?\n(1) 손익계산서상 지급이자 내역\n이자율 지급이자 차입금적수 비고\n전액 본사건물 신축(2026년 4월 1일 준공 예정)을\n연 5 % 50,000원 365,000,000원\n위한 특정차입금\n연 4 % 40,000원 182,500,000원\n(2) ㈜삼일은 대표이사에게 업무와 직접 관련없이 25,000원을 대여하였으며 해당 지급금적수는\n9,125,000원이다.\n① 2,000원\n② 50,000원\n③ 52,000원\n④ 54,000원", "answer": 3}, {"year": "2025", "month": "7", "qnum": 57, "text": "[57]다음 중 준비금에 관한 설명으로 옳지 않은 것은?\n① 조세특례제한법상 준비금은 결산조정사항이므로 비용으로 회계처리한 경우에만 세법상 손금으로 인\n정된다.\n② 비영리법인을 설정대상으로 하는 고유목적사업준비금은 법인세법에서 규정하고 있다.\n③ 보험사업을 하는 내국법인은 비상위험준비금을 손금에 산입할 수 있다.\n④ 손금에 산입한 책임준비금은 일정기간이 경과한 후에 다시 익금산입하여야 한다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 47, "text": "[47]다음 중 법인세법상 의제배당에 관한 설명으로 옳지 않은 것은?\n① 법인이 주식발행초과금을 자본전입하여 주주인 법인이 취득하는 주식은 배당으로 의제한다.\n② 자본감소 등으로 인해 주주가 취득하는 금전과 그 밖의 재산가액의 합계액이 주주가 해당 주식을 취\n득하기 위하여 사용한 금액을 초과하는 경우 그 초과 금액을 의제배당 금액으로 한다.\n③ 법인의 해산으로 인한 의제배당의 귀속시기는 잔여재산가액 확정일이다.\n④ 법인의 합병 및 분할 등으로 인해 보유하던 주식 대신 받는 금전 등 재산가액의 합계액이 주식취득\n가격을 초과하는 경우도 의제배당에 해당한다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 48, "text": "[48]다음 중 법인세법상 손금에 관한 설명으로 옳지 않은 것은?\n① 합명회사의 노무출자사원에게 지급하는 보수는 손금불산입 항목이다.\n② 근로복지기본법에 따른 우리사주조합에 출연하는 자사주의 장부가액과 금품은 전액 손금으로 본다.\n③ 장식·환경미화 등을 위하여 사무실 복도 등 여러 사람이 볼 수 있는 공간에 상시 비치하는 미술품\n으로서 거래단위별 취득가액이 1,000만원 이하인 것은 회계처리와 상관없이 손금으로 본다.\n④ 광고선전목적으로 특정인에게 기증한 물품(개당 3만원 이하 물품 제외)은 1인당 연간 5만원 이내\n의 경우 광고선전비로 본다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각비에 관한 설명으로 옳지 않은 것은?\n① 시설의 개체 또는 기술의 낙후로 인하여 생산설비의 일부를 폐기한 경우 해당 자산의 장부가액을 폐\n기일이 속하는 사업연도의 손금에 산입할 수 있다.\n② 사업연도 중에 취득하여 사업에 사용한 감가상각자산에 대한 상각범위액은 사업에 사용한 날부터 당\n해 사업연도 종료일까지의 월수에 따라 계산한다.\n③ 어업에 사용되는 어구는 취득 즉시 비용으로 계상하더라도 전액 손금으로 인정한다.\n④ 상각범위액을 계산함에 있어서 감가상각자산의 잔존가액은“0”으로 한다. 다만, 정률법에 의하여\n상각범위액을 계산하는 경우에는 취득가액의 5 % 에 상당하는 금액으로 하되, 그 금액은 당해 감가\n상각자산에 대한 미상각잔액이 최초로 취득가액의 5 % 이하가 되는 사업연도의 상각범위액에 가산한\n다.", "answer": 1}, {"year": "2025", "month": "9", "qnum": 53, "text": "[53]다음 자료를 이용하여 제조업을 영위하는 중소기업(사회적 기업 아님)인 ㈜삼일의 제25기(사업연도\n2025년 1월 1일 ~ 2025년 12월 31일)의 일반기부금과 관련된 세무조정으로 옳은 것은?\nㄱ. 당기 손익계산서에 계상된 기부금의 종류별 합계액은 다음과 같다.\n특례기부금(이재민 구호금품) 6,000,000원\n일반기부금(사회복지법인 기부금) 33,000,000원\n비지정기부금(향우회에 지출한 기부금) 5,000,000원\nㄴ. 결산서에 계상된 당기순이익은 100,000,000원이며, 위 기부금 명세 이외의 세무조정 사항은\n다음과 같다.\n익금산입·손금불산입 8,000,000원\n손금산입·익금불산입 4,000,000원\nㄷ. 당기말 현재 남아있는 세무상 이월결손금은 2023년(제23기) 발생분 90,000,000원이 있다.\nㄹ. 전기 이전에 특례기부금과 일반기부금의 한도초과액은 없다.\n① (손금불산입) 일반기부금 한도초과액 27,700,000원 (기타사외유출)\n② (손금불산입) 일반기부금 한도초과액 27,800,000원 (기타사외유출)\n③ (손금불산입) 일반기부금 한도초과액 28,300,000원 (기타사외유출)\n④ (손금불산입) 일반기부금 한도초과액 30,100,000원 (기타사외유출)", "answer": 2}, {"year": "2025", "month": "9", "qnum": 54, "text": "[54]다음의 기업업무추진비 조정명세서(갑)은 ㈜삼일(중소기업이 아님)의 김철수 과장이 작성한 것인데 이\n영희 회계사로부터 매출액 100억원 중에 포함되어 있는 특수관계인에 대한 매출액 50억원을 전액 일반\n수입으로 하여 접대비 한도액을 계산하였다는 지적을 받았다. 정확한 조정계산서를 작성한다면 <#1>과\n<#2>에 기입될 금액은 얼마인가?\n① 12,000,000원(중소기업 36,000,000원) ×사업연도월수/12 12,000,000원\n100억원 이하의 금액×30/10,000 30,000,000원\n100억원 초과 500억원 이하의 금액×20/10,000 0원\n총수입금액기준\n500억원 초과금액×3/10,000 0원\n일반기업\n② 소 계 30,000,000원\n업무추진비\n100억원 이하의 금액×30/10,000 30,000,000원\n한도\n100억원 초과 500억원 이하의 금액×20/10,000 0원\n일반수입금액기준\n500억원 초과금액×3/10,000 0원\n③ 소 계 <#1> 30,000,000원\n④ 수입금액기준 (② － ③)×10/100 0\n⑤ 일반기업업무추진비 한도액(① ＋ ③ ＋ ④) <#2> 42,000,000원\n<#1> <#2>\n① 15,000,000원 16,500,000원\n② 15,000,000원 28,500,000원\n③ 30,000,000원 12,000,000원\n④ 30,000,000원 27,000,000원", "answer": 2}, {"year": "2025", "month": "9", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 대손충당금 변동\n내역과 이와 관련된 자료이다. 대손충당금과 관련하여 ㈜삼일이 수행하여야 하는 세무조정으로 가장 옳\n은 것은?\n대손충당금\n당기사용액 3,000,000원 기초 잔액 4,000,000원\n기말 잔액 2,000,000원 당기설정액 1,000,000원\n계 5,000,000원 계 5,000,000원\nㄱ. 전기말 대손충당금 한도초과액 : 600,000원\nㄴ. 세무상 기말 채권 잔액 : 120,000,000원(특수관계인에 대한 업무무관가지급금 20,000,000원 포함)\nㄷ. 당기 대손실적률 : 0.8 %\nㄹ. 대손충당금의 당기사용액은 대손발생금액으로 세법상 대손요건을 충족함\n① (손금불산입) 1,000,000원(유보), (손금산입) 600,000원(△유보)\n② (손금불산입) 1,200,000원(유보), (손금산입) 600,000원(△유보)\n③ (손금불산입) 1,000,000원(유보)\n④ (손금불산입) 1,200,000원(유보)", "answer": 1}, {"year": "2025", "month": "9", "qnum": 57, "text": "[57]다음 중 준비금에 관한 설명으로 옳지 않은 것은?\n① 보험업을 영위하는 법인은 비상위험준비금을 설정할 수 있으나 법인세법상 고유목적사업준비금은 설\n정할 수 없다.\n② 고유목적사업준비금을 손금에 산입한 법인은 해산하는 경우 그 고유목적사업준비금 잔액을 해산일이\n속하는 사업연도의 익금에 산입한다.\n③ 법인세법상 고유목적사업준비금은 세무상 손금으로 인정받기 위해서 비용으로 회계처리해야 하나 잉\n여금 처분을 하고 신고조정을 할 수도 있다.\n④ 조세특례제한법상 준비금은 잉여금처분을 하고 신고조정을 할 수도 있으나 처분가능한 이익이 부족\n한 경우에는 손금산입할 수 없다.", "answer": 4}, {"year": "2025", "month": "9", "qnum": 59, "text": "[59]다음은 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 1 △유보)\n② (익금산입) 공사수익 30억원 (유보)\n(손금산입) 공사원가 40억원 (△유보)\n③ (익금불산입) 공사수익 40억원 (△유보)\n(손금불산입) 공사원가 30억원 (유보)\n④ 세무조정 사항 없음", "answer": 1}, {"year": "2025", "month": "11", "qnum": 51, "text": "[51]다음 중 법인세법상 감가상각에 관한 설명으로 옳지 않은 것은?\n① 전화기(휴대용 전화기 포함) 및 개인용 컴퓨터(그 주변기기 포함)의 취득가액을 그 사업에 사용한\n날이 속하는 사업연도에 비용으로 계상하면 전액 손금으로 인정한다.\n② 기계장치에 대하여 감가상각방법을 신고하지 않은 경우 정률법을 적용한다.\n③ 시간의 경과에 따라 그 가치가 감소되지 아니하는 자산은 감가상각자산에 포함하지 아니한다.\n④ 상각범위액을 계산함에 있어서 감가상각자산의 잔존가액은“0”으로 한다. 다만, 정률법에 의하여\n상각범위액을 계산하는 경우에는 취득가액의 10 % 에 상당하는 금액으로 본다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 52, "text": "[52]다음은 ㈜삼일이 2025년 7월 1일에 취득한 기계장치에 관한 자료이다. 이 자료를 기초로 제25기 사업\n연도(2025년 1월 1일 ~ 2025년 12월 31일)의 상각범위액을 계산하면 얼마인가?\nㄱ. 기계장치의 취득가액 : 3억원\nㄴ. 2025년 10월 1일에 발생한 기계장치에 대한 자본적 지출 : 2억원\nㄷ. 감가상각방법 : 정액법\nㄹ. 신고내용연수 : 5년(정액법 상각률 0.2)\n① 30,000,000원\n② 40,000,000원\n③ 50,000,000원\n④ 60,000,000원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 53, "text": "[53]다음 중 법인세법상 기부금에 관한 설명으로 옳지 않은 것은?\n① 기부금은 사업과 직접 관련하여 무상으로 지출하는 재산적 증여가액을 말한다.\n② 천재지변으로 인한 이재민의 구호금품 가액과 국군장병 위문금품의 가액은 특례기부금에 해당한다.\n③ 비지정기부금에 해당하면 한도계산 없이 전액 손금불산입된다.\n④ 기부금은 현금주의에 의하여 귀속시기를 판단하므로 법인이 실제로 지급하지 아니한 기부금을 미지\n급으로 하여 손비로 계상한 경우 동 기부금은 손금불산입된다.", "answer": 1}, {"year": "2025", "month": "11", "qnum": 54, "text": "[54]다음은 ㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일)의 기업업무추진비 보조원장\n을 요약 정리한 것이다. 다음 중 ㈜삼일의 제25기 세무조정으로 옳은 것은(단, 법인세법상 기업업무추\n진비 한도액은 21,500,000원이다)?\n기업업무추진비 보조원장\n적 요 금 액 비 고\n거래처 기업업무추진비 (1건) 500,000원 증빙 미수취분\n거래처 기업업무추진비 (1건) 30,000원 영수증 수취분\n거래처 기업업무추진비(25건) 22,470,000원 신용카드매출전표 수취분\n합 계 23,000,000원\n① (손금불산입)증빙없는 기업업무추진비 530,000원 (상여)\n② (손금불산입)기업업무추진비 한도초과액 1,500,000원(기타사외유출)\n③ (손금불산입)증빙없는 기업업무추진비 500,000원 (상여)\n(손금불산입)기업업무추진비 한도초과액 1,000,000원(기타사외유출)\n④ (손금불산입)증빙없는 기업업무추진비 530,000원 (상여)\n(손금불산입)기업업무추진비 한도초과액 970,000원(기타사외유출)", "answer": 3}, {"year": "2025", "month": "11", "qnum": 55, "text": "[55]다음 중 법인세법상 지급이자 손금불산입 규정에 관한 설명으로 옳지 않은 것은?\n① 일반차입금에 대한 건설자금이자는 자본화를 선택할 수 있다.\n② 비실명 채권·증권의 이자상당액은 건설자금이자보다 우선하여 지급이자 손금불산입 규정을 적용한\n다.\n③ 건설자금이자의 계상대상에 투자자산과 제조 등에 장기간이 소요되는 재고자산은 포함되지 아니한\n다.\n④ 업무무관자산등에 대한 지급이자를 계산할 때, 업무무관자산가액은 시가에 의하여 계산한다.", "answer": 4}, {"year": "2025", "month": "11", "qnum": 56, "text": "[56]다음은 중소기업인 ㈜서울의 2025년 12월 31일 현재 매출채권 명세서의 일부분이다. 결산시 대손처리\n한 금액이 없는 경우 세무조정으로 손금산입할 수 있는 금액은 얼마인가(단, 모든 채권은 회수가능가액\n이 없다)?\n거래처명 채권금액 대손충당금 설 명\n㈜부산 3억원 0 2025년 4월 6일 회생계획인가결정\n㈜광주 2억원 0 부도발생일부터 6개월이 경과한 어음\n㈜대구 1억원 0 2025년 8월 12일 채무자 사망\n① 1억원\n② 2억원\n③ 3억원\n④ 4억원", "answer": 3}, {"year": "2025", "month": "11", "qnum": 57, "text": "[57]다음 중 법인세법상 손금으로 인정되는 준비금으로 옳지 않은 것은?\n① 책임준비금\n② 사업확장준비금\n③ 해약환급금준비금\n④ 고유목적사업준비금", "answer": 2}, {"year": "2025", "month": "11", "qnum": 58, "text": "[58]㈜삼일은 2025년 10월 1일에 회사의 대표이사로부터 시가 10억원인 토지를 15억원에 매입하고 다음과\n같이 회계처리하였다.\n(차) 토지 15억원 (대) 현금 15억원\n토지 매입과 관련하여 2025년에 필요한 세무조정으로 옳은 것은?\n① (손금산입) 토지 2억원 (△유보)\n(손금불산입) 고가매입액 2억원 (상여)\n② (손금산입) 토지 5억원 (△유보)\n(손금불산입) 고가매입액 5억원 (상여)\n③ (손금산입) 토지 2억원 (△유보)\n④ (손금불산입) 고가매입액 5억원 (상여)", "answer": 2}, {"year": "2025", "month": "11", "qnum": 59, "text": "[59]㈜삼일의 제25기 사업연도(2025년 1월 1일 ~ 2025년 12월 31일)의 결산서상 당기순이익은\n260,000,000원이며 세무조정 결과 익금산입 ․ 손금불산입 금액은 90,000,000원, 손금산입 ․ 익금불산입\n금액은 43,000,000원이다. 이월결손금 내역이 다음과 같을 때 ㈜삼일의 법인세 과세표준을 계산하면 얼\n마인가(단, ㈜삼일은 중소기업기본법상 중소기업이며, 기부금 ․ 비과세소득 ․ 소득공제 금액은 없다)?\n발생연도 세법상 이월결손금\n2010년 6,000,000원\n2017년 5,000,000원\n2021년 2,000,000원\n① 294,000,000원\n② 295,000,000원\n③ 298,000,000원\n④ 300,000,000원", "answer": 4}, {"year": "2025", "month": "12", "qnum": 48, "text": "[48]다음은 ㈜삼일이 임원 또는 직원을 위하여 지출한 복리후생비 보조원장의 일부이다. 이 중 법인세법상\n손금으로 인정받지 못하는 금액을 계산하면 얼마인가?\n복 리 후 생 비\n2025년 1월 1일 ~ 2025년 12월 31일\n㈜삼일 (단위 : 원)\n월/일 적 요 금 액\n01/23 직장체육비 3,000,000\n01/25 임원에 대한 사용자 부담 고용보험료 1,000,000\n02/03 우리사주조합 운영비 4,000,000\n06/27 직장어린이집 운영비 5,000,000\n12/23 직장회식비 2,000,000\n12/25 대주주의 동창회비 4,000,000\n① 0원\n② 4,000,000원\n③ 5,000,000원\n④ 8,000,000원", "answer": 2}, {"year": "2025", "month": "12", "qnum": 49, "text": "[49]㈜삼일이 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 손익계산서에 비용으로 회계처리한 금액의\n내역은 다음과 같다. ㈜삼일의 제25기 세무조정시 손금불산입으로 세무조정해야 할 금액의 합계액은\n얼마인가?\n(1) 업무와 관련하여 발생한 교통사고 벌과금 6,000,000원\n(2) 사계약상 납품지연 지체상금 2,000,000원\n(3) 관세법 위반으로 인한 벌금 1,000,000원\n(4) 업무용 건물에 대한 재산세 4,000,000원\n(5) 원천징수 등 납부지연가산세 3,000,000원\n① 6,000,000원\n② 7,000,000원\n③ 10,000,000원\n④ 12,000,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 51, "text": "[51]다음 중 법인세법상 수익적 지출에 해당하는 것은?\n① 엘리베이터 설치\n② 재해를 입은 자산의 외장의 복구\n③ 본래의 용도를 변경하기 위한 개조\n④ 빌딩의 피난시설 설치", "answer": 2}, {"year": "2025", "month": "12", "qnum": 52, "text": "[52]다음은 제조업을 영위하는 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 재무상태표의 일\n부이다. ㈜삼일은 제25기에 기계장치(신고내용연수 10년)와 관련된 감가상각비 19,000,000원을 계상\n하였다. 기계장치에 대한 전기의 세무조정은 적절하게 이루어졌으며, 전기 말의 상각부인액 잔액은\n4,100,000원이다. ㈜삼일이 감가상각방법을 정률법으로 신고한 경우 제25기의 세무조정으로 옳은 것은\n(정률법 10년 상각률：0.259)?\n재무상태표\n(단위：원)\n…… ……\n기 계 장 치 100,000,000\n감가상각누계액 (49,000,000)\n…… 60,000,000\n① (손금산입) 191,900원\n② (손금불산입) 191,900원\n③ (손금산입) 4,000,000원\n④ (손금불산입) 4,000,000원", "answer": 1}, {"year": "2025", "month": "12", "qnum": 53, "text": "[53]㈜용산은 특수관계없는 ㈜부산에 시가 10억원인 토지를 장부가액 5억원에 양도하고 다음과 같이 회계\n처리하였다.\n(차) 예금 500,000,000원 (대) 토지 500,000,000원\n㈜용산이 토지를 저가양도한 것에 정당한 사유가 없는 경우 세무조정으로 옳은 것은?\n① (손금불산입) 비지정기부금 300,000,000원 (기타사외유출)\n② (손금불산입) 비지정기부금 300,000,000원 (기타사외유출)\n(손금산입) 토지 300,000,000원 (△유보)\n③ (손금불산입) 비지정기부금 200,000,000원 (기타사외유출)\n④ (손금불산입) 비지정기부금 200,000,000원 (기타사외유출)\n(손금산입) 토지 200,000,000원 (△유보)", "answer": 3}, {"year": "2025", "month": "12", "qnum": 54, "text": "[54]다음 중 법인세법상 기업업무추진비에 관한 설명으로 옳지 않은 것은?\n① 기업업무추진비는 발생주의에 따라 접대행위가 이루어진 사업연도의 손금으로 본다.\n② 광고·선전목적으로 달력 등을 불특정 다수인에게 기증한 것은 일반적으로 기업업무추진비로 보지\n않고 전액 손금으로 인정한다.\n③ 1회의 접대에 3만원(경조금의 경우는 20만원)을 초과하여 지출한 기업업무추진비로서 법정증명서\n류 외의 증명서류를 수취한 금액을 손금불산입하는 경우에는 상여로 소득처분한다.\n④ 기업업무추진비 한도액을 초과하는 금액은 손금불산입하여 기타사외유출로 소득처분한다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 55, "text": "[55]㈜삼일은 2025년 1월 1일 대표이사 아들이 사용할 목적으로 스포츠카를 100,000,000원에 구입하였다.\n㈜삼일의 지급이자가 50,000,000원, 차입금적수가 182,500,000,000원인 경우 제25기 사업연도(2025년\n1월 1일 ~ 2025년 12월 31일)의 업무무관자산 등에 관한 지급이자 손금불산입금액으로 옳은 것은(단,\n선부인된 지급이자 손금불산입 금액은 없다)?\n① 8,000,000원\n② 9,000,000원\n③ 10,000,000원\n④ 12,000,000원", "answer": 3}, {"year": "2025", "month": "12", "qnum": 56, "text": "[56]다음 중 법인세법상 대손금 및 대손충당금에 관한 설명으로 옳지 않은 것은?\n① 특수관계인에 대한 업무무관 가지급금은 대손충당금 설정대상 채권에 포함하지 아니한다.\n② 일반법인의 경우 대손충당금 설정한도는 설정대상 채권금액에 1 % 와 대손실적률 중 작은 비율을 곱\n한 금액이다.\n③ 법인세법상 대손금으로 인정된 금액 중 회수된 금액은 회수된 날이 속하는 사업연도의 익금이다.\n④ 손금불산입된 대손충당금 한도초과액은 유보로 소득처분한다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 57, "text": "[57]다음 중 준비금에 관한 설명으로 옳지 않은 것은?\n① 준비금은 손금에 산입하는 사업연도에는 조세부담을 경감시키고, 환입하거나 상계하는 연도에는 조\n세부담을 증가시킨다.\n② 준비금은 법인세법과 조세특례제한법에서 규정하는 두 가지가 있다.\n③ 증권회사가 책임준비금을 손비로 계상한 경우에는 대통령령으로 정하는 바에 따라 계산한 금액의 범\n위에서 그 계상한 책임준비금을 해당 사업연도의 소득금액을 계산할 때 손금에 산입한다.\n④ 고유목적사업준비금은 비영리내국법인이 설정대상이다.", "answer": 3}, {"year": "2025", "month": "12", "qnum": 59, "text": "[59]다음 자료를 기초로 중소기업인 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 사업연도의\n법인세 산출세액을 계산하면 얼마인가?\nㄱ. 손익계산서상의 당기순이익 : 200,000,000원\nㄴ. 제25기 사업연도의 세무조정금액\n- 익금산입·손금불산입 : 80,000,000원\n- 손금산입·익금불산입 : 30,000,000원\nㄷ. 제11기 사업연도(2011년 1월 1일 ~ 2011년 12월 31일)에 발생한 결손금 중 미공제된 금액 :\n30,000,000원\nㄹ. 제25기 사업연도의 손익계산서상 당기순이익에는 공익신탁의 신탁재산에서 생긴 소득\n20,000,000원이 포함되어 있다.\nㅁ. 법인세의 세율은 과세표준 2억원 이하에 대해서는 9 %, 2억원 초과 200억원 이하분에 대해서는\n“1천 800만원 + (2억원을 초과하는 금액의 19 %)”이다.\n① 21,600,000원\n② 21,800,000원\n③ 22,600,000원\n④ 23,700,000원", "answer": 4}], "04_부당행위계산부인": [{"year": "2024", "month": "1", "qnum": 58, "text": "[58]다음 중 부당행위계산부인 대상인 가지급금에 해당하는 것은?\n① 중소기업에 근무하는 지배주주인 직원에 대한 주택구입 또는 전세자금의 대여액\n② 미지급한 배당소득에 대한 소득세를 법인이 대납한 금액\n③ 직원에 대한 경조사비 대여액\n④ 직원에 대한 학자금(자녀의 학자금 포함) 대여액", "answer": 1}, {"year": "2024", "month": "3", "qnum": 58, "text": "[58]다음 ㈜삼일의 거래 중 법인세법상 부당행위계산부인 규정의 적용대상인 것은?\n① 직원인 김삼일씨에게 사택을 무상으로 제공하였다(단, 김삼일씨는 지배주주의 특수관계인이 아니\n다).\n② 임원 김용산씨에게 시가 8억원의 기계장치를 9억원에 양도하였다.\n③ 대표이사 김서울씨에게 업무와 관련 없이 1억원을 무이자 조건으로 대여하였다.\n④ 대주주인 김마포씨로부터 토지를 1년간 무상으로 임차하였다.", "answer": 3}, {"year": "2024", "month": "6", "qnum": 56, "text": "[56]다음 중 법인세법상 대손충당금 설정대상 채권이 아닌 것은?\n① 특수관계인에 대한 업무무관가지급금\n② 금전소비대차계약에 의하여 타인에게 대여한 금액\n③ 상품의 판매가액의 미수액\n④ 용역제공에 의한 영업수익 미수금", "answer": 1}, {"year": "2025", "month": "1", "qnum": 58, "text": "[58]㈜삼일은 대표이사인 홍길동에게 2025년 1월 1일 자금을 무상으로 대여하였으며, 제25기 사업연도\n(2025년 1월 1일 ~ 2025년 12월 31일)의 동 대여금의 적수는 2,000,000,000원이다. ㈜삼일의 차입금\n은 모두 특수관계인이 아닌 자로부터 차입한 것이고, 가중평균차입이자율은 4 % 인 경우 제25기 사업\n연도의 인정이자에 대한 세무조정으로 옳은 것은(단, 가지급금 인정이자 계산시 가중평균차입이자율을\n사용하고, 소수점 이하는 절사한다)?\n① (익금산입) 가지급금 인정이자 219,178원(상여)\n② (익금불산입) 가지급금 인정이자 219,178원(기타)\n③ (익금산입) 가지급금 인정이자 232,876원(상여)\n④ (익금산입) 가지급금 인정이자 232,876원(기타)", "answer": 1}, {"year": "2025", "month": "5", "qnum": 56, "text": "[56]다음은 제조업을 영위하는 ㈜삼일의 제25기(2025년 1월 1일 ~ 2025년 12월 31일) 대손충당금에 대\n한 세무조정 자료이다. 대손충당금한도초과액으로 옳은 것은?\n대손충당금\n당기감소액 3,000,000원 기초 잔액 5,000,000원\n기말 잔액 3,000,000원 당기설정액 1,000,000원\n계 6,000,000원 계 6,000,000원\nㄱ. 당기 말 세무상 채권 잔액 : 120,000,000원\n(특수관계인에 대한 업무무관가지급금 20,000,000원 포함)\nㄴ. 당기 대손실적률 : 2 %\nㄷ. 대손충당금의 당기감소액은 당기에 소멸시효가 완성된 채권과 상계한\n금액으로 세법상 대손요건을 충족함\n① 0원\n② 1,000,000원\n③ 2,000,000원\n④ 3,000,000원", "answer": 2}, {"year": "2025", "month": "7", "qnum": 58, "text": "[58]다음 ㈜삼일의 거래 중 법인세법상 부당행위계산부인의 규정의 적용대상인 것은?\n① 직원인 김삼일 씨에게 사택을 무상으로 제공하였다(단, 김삼일씨는 지배주주의 특수관계인이 아니\n다).\n② 임원 김용산 씨에게 시가 8억원의 기계장치를 9억원에 양도하였다.\n③ 대표이사 김서울 씨에게 업무와 관련 없이 1억원을 무이자 조건으로 대여하였다.\n④ 대주주인 김마포 씨로부터 토지를 1년간 무상으로 임차하였다.", "answer": 3}, {"year": "2025", "month": "9", "qnum": 58, "text": "[58]다음 중 법인세법상 부당행위계산부인 규정에 관한 설명으로 옳지 않은 것은?\n① 중소기업에 근무하는 직원에게 주택임차자금을 대여하는 경우에는 부당행위계산부인 규정을 적용하\n지 않는다.\n② 특수관계인과의 거래에 해당할 경우 그 법인의 소득에 대한 조세부담이 감소하지 않은 경우라 하더\n라도 부당행위계산부인 규정이 적용된다.\n③ 부당행위계산부인 규정이 적용되기 위해서는 원칙적으로 특수관계인 사이에서 이루어진 거래이어야\n한다.\n④ 회사가 사택을 출자임원(지분율 0.9 %)에게 무상으로 제공하는 경우에는 부당행위계산부인 규정을\n적용하지 않는다.", "answer": 2}, {"year": "2025", "month": "12", "qnum": 58, "text": "[58]다음 중 법인세법상 부당행위계산부인 규정에 관한 설명으로 옳지 않은 것은?\n① 특수관계인과의 거래로 인하여 그 법인의 소득에 대한 조세부담이 부당하게 감소한 경우에는 부당행\n위계산부인 규정이 적용된다.\n② 중소기업 및 중견기업에 근무하는 직원에게 주택임차자금을 대여하는 경우에는 복리후생적 지출로\n보아 부당행위계산부인 규정을 적용하지 않는다.\n③ 직원에 대한 월정급여액의 범위에서의 일시적인 급료의 가불금은 업무무관 가지급금으로 보지 아니\n한다.\n④ 회사가 사택을 출자임원(지분율 0.9 %)에게 무상으로 제공하는 경우에는 부당행위계산부인 규정을\n적용하지 않는다.", "answer": 2}], "05_과세표준과 세액계산·신고납부": [{"year": "2024", "month": "1", "qnum": 60, "text": "[60]다음 중 법인세 과세표준 신고시 첨부하지 않으면 무신고로 보는 서류로 옳지 않은 것은(단, 상장법인\n을 가정한다)?\n① 개별내국법인의 이익잉여금처분계산서\n② 개별내국법인의 자본변동표\n③ 개별내국법인의 포괄손익계산서\n④ 개별내국법인의 재무상태표", "answer": 2}, {"year": "2024", "month": "5", "qnum": 60, "text": "[60]다음 중 법인세 신고·납부에 관한 설명으로 옳지 않은 것은?\n① 성실신고확인대상이 아닌 내국법인은 사업연도 종료일이 속하는 달의 말일부터 3개월 이내에 법인\n세 과세표준과 세액을 신고하여야 한다.\n② 중소기업의 납부할 법인세액이 2,400만원인 경우 1,400만원을 납부기한이 지난 날부터 2개월 이내\n에 분납할 수 있다.\n③ 법인세의 과세표준과 세액을 신고할 때 기업회계기준을 준용하여 작성한 개별 내국법인의 재무상태\n표·포괄손익계산서·이익잉여금처분계산서(또는 결손금처리계산서) 및 법인세 과세표준 및 세액조\n정계산서를 신고서에 첨부하지 아니하면 신고로 보지 아니한다.\n④ 중간예납의무자는 중간예납기간이 지난 날부터 2개월 이내에 중간예납세액을 납부하여야 한다.", "answer": 2}, {"year": "2024", "month": "7", "qnum": 60, "text": "[60]다음 중 법인세법상 법인세 신고와 납부에 관한 설명으로 옳은 것은?\n① 중간예납의무가 있는 모든 법인은 직전 사업연도의 실적을 기준으로 중간예납세액을 계산하여 납부\n하여야 한다.\n② 성실신고확인서를 제출하는 내국법인은 각 사업연도의 종료일이 속하는 달의 말일부터 5개월 이내\n에 법인세 과세표준과 세액을 신고하여야 한다.\n③ 법인세 과세표준 신고시 법인세 과세표준 및 세액신고서를 제출한 경우 재무상태표를 제출하지 않아\n도 무신고로 보지 않는다.\n④ 법인세 납부세액이 1천만원을 초과하는 경우 납부기한이 지난 날부터 1개월(중소기업은 2개월) 이\n내에 분납할 수 있다.", "answer": 4}, {"year": "2024", "month": "11", "qnum": 60, "text": "[60]다음 중 법인세 신고·납부에 관한 설명으로 옳지 않은 것은?\n① 성실신고확인대상인 내국법인은 사업연도 종료일이 속하는 달의 말일부터 4개월 이내에 법인세 과\n세표준과 세액을 신고하여야 한다.\n② 중소기업의 납부할 법인세액이 1,400만원인 경우 400만원을 납부기한이 지난 날부터 2개월 이내에\n분납할 수 있다.\n③ 법인세의 과세표준과 세액을 신고할 때 기업회계기준을 준용하여 작성한 개별 내국법인의 재무상태\n표·포괄손익계산서·이익잉여금처분계산서(또는 결손금처리계산서) 및 법인세 과세표준 및 세액조\n정계산서를 신고서에 첨부하지 아니하면 신고로 보지 아니한다.\n④ 중간예납의무자는 중간예납기간이 지난 날부터 3개월 이내에 중간예납세액을 납부하여야 한다.", "answer": 4}, {"year": "2024", "month": "12", "qnum": 60, "text": "[60]다음 중 법인세 신고납부제도에 관한 설명으로 옳지 않은 것은?\n① 법인세 신고시 자본변동표를 첨부하지 않으면 신고하지 않은 것으로 본다.\n② 내국법인에게 비영업대금의 이익을 지급하는 자는 25 % 를 적용하여 계산한 금액에 상당하는 법인세\n를 징수하여 관할 세무서에 납부하여야 한다.\n③ 중간예납세액은 중간예납기간이 경과한 날로부터 2개월 이내에 신고·납부하여야 한다.\n④ 법인세법에서는 법인세포탈의 우려가 있어 조세채권을 조기에 확보하여야 할 것으로 인정되는 경우\n에 사업연도 중이라도 법인세를 수시로 부과할 수 있다.", "answer": 1}, {"year": "2025", "month": "1", "qnum": 67, "text": "[67]다음의 세액공제 중 개인과 법인 모두에게 적용될 수 있는 것은?\n① 배당세액공제\n② 기장세액공제\n③ 월세세액공제\n④ 외국납부세액공제", "answer": 4}, {"year": "2025", "month": "3", "qnum": 60, "text": "[60]다음 중 법인세의 신고와 납부에 관한 설명으로 옳은 것은?\n① 법인세 납부세액이 1천만원을 초과하는 경우 납부기한이 지난 날부터 1개월(중소기업은 2개월)이\n내에 분납할 수 있다.\n② 법인세 과세표준 신고시 법인세 과세표준 및 세액신고서를 제출한 경우 재무제표를 제출하지 않아도\n무신고로 보지 않는다.\n③ 중간예납의무가 있는 모든 법인은 직전 사업연도의 실적을 기준으로 중간예납세액을 계산하여 납부\n하여야 한다.\n④ 법인세 납세의무가 있는 내국법인은 각 사업연도 종료일이 속하는 달의 말일부터 3개월 이내에 법\n인세 과세표준과 세액을 신고하여야 하나, 성실신고 확인서를 제출하는 경우에는 6개월 이내에 신\n고하여야 한다.", "answer": 1}, {"year": "2025", "month": "5", "qnum": 60, "text": "[60]다음 중 법인세 신고와 납부에 관한 설명으로 옳은 것은?\n① 중간예납의무가 있는 모든 법인은 직전 사업연도의 실적을 기준으로 중간예납세액을 계산하여 납부\n하여야 한다.\n② 성실신고확인서를 제출하는 내국법인은 각 사업연도의 종료일이 속하는 달의 말일부터 4개월 이내\n에 법인세 과세표준과 세액을 신고하여야 한다.\n③ 법인세 과세표준 신고시 법인세 과세표준 및 세액신고서를 제출한 경우 재무상태표를 제출하지 않아\n도 무신고로 보지 않는다.\n④ 법인세 납부세액이 1천만원을 초과하는 경우 납부기한이 지난 날부터 1개월(중소기업은 3개월) 이\n내에 분납할 수 있다.", "answer": 2}, {"year": "2025", "month": "9", "qnum": 60, "text": "[60]다음 중 법인세 신고·납부 등과 관련된 설명으로 옳지 않은 것은?\n① 법인세 신고시 자본변동표를 첨부하지 않으면 신고하지 않은 것으로 본다.\n② 내국법인에게 비영업대금의 이익을 지급하는 자는 25 % 를 적용하여 계산한 금액에 상당하는 법인세\n를 징수하여 관할 세무서에 납부하여야 한다.\n③ 중간예납세액은 중간예납기간이 지난 날부터 2개월 이내에 신고·납부하여야 한다.\n④ 법인세법에서는 법인세포탈의 우려가 있어 조세채권을 조기에 확보하여야 할 것으로 인정되는 경우\n에 사업연도 중이라도 법인세를 수시로 부과할 수 있다.", "answer": 1}, {"year": "2025", "month": "12", "qnum": 60, "text": "[60]다음 중 법인세 과세표준 신고시 첨부하지 않으면 무신고로 보는 서류로 옳지 않은 것은?\n① 개별내국법인의 이익잉여금처분계산서\n② 개별내국법인의 재무상태표\n③ 개별내국법인의 포괄손익계산서\n④ 개별내국법인의 현금흐름표", "answer": 4}, {"year": "2025", "month": "12", "qnum": 78, "text": "[78]제조업을 영위하는 김동해 씨는 2025년 10월 15일 폐업하였다. 폐업시 남아 있는 유형자산의 내역이\n다음과 같을 때 폐업시 잔존재화의 공급가액을 계산하면 얼마인가(단, 자산의 취득가액은 매입세액공제\n를 받은 취득가액이다)?\n구분 취득일(사용개시일) 취득가액 결산상 장부가액\n건물 2023년 7월 8일 10,000,000원 9,000,000원\n기계장치 2025년 4월 6일 4,000,000원 3,000,000원\n① 10,000,000원\n② 11,000,000원\n③ 12,000,000원\n④ 13,000,000원", "answer": 2}], "06_소득세법": [{"year": "2024", "month": "1", "qnum": 62, "text": "[62]다음 자료에 의하여 거주자 나국세씨의 2024년 종합과세되는 이자소득과 배당소득의 총수입금액을 계산\n하면 얼마인가?\n2024년의 금융소득 내역은 다음과 같다.\n(1) 직장공제회초과반환금 : 3,000,000 원\n(2) 비상장법인으로부터 받은 현금배당 : 15,000,000 원\n(3) 서울은행의 정기예금이자 : 10,000,000 원\n(4) 법원에 납부한 보증금의 이자 : 6,000,000 원\n① 15,000,000 원\n② 25,000,000 원\n③ 28,000,000 원\n④ 30,000,000 원", "answer": 2}, {"year": "2024", "month": "1", "qnum": 63, "text": "[63]다음 자료로 제조업을 영위하는 개인사업자(복식부기의무자) 박성실씨의 2024년의 사업소득금액을 계산\n하면 얼마인가?\nㄱ. 손익계산서상 당기순이익 200,000,000원\nㄴ. 손익계산서에는 다음과 같은 수익과 비용이 포함되어 있다.\n(아래 기술한 내용 이외에는 모두 세법상 적정하게 계상되어 있음)\n- 대표자 급여 50,000,000원\n- 기계장치처분이익 5,000,000원\n- 토지처분이익 8,000,000원\n- 소득세 2,000,000원\n① 236,000,000원\n② 240,000,000원\n③ 244,000,000원\n④ 250,000,000원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 64, "text": "[64]다음은 ㈜용산(중소기업)에 근무하는 영업사원인 거주자 갑의 2024년 귀속 근로소득 내역이다. 근로소\n득에 대한 비과세금액의 합계액으로 옳은 것은(근무기간은 2024년 1월 1일부터 2024년 12월 31일이\n다)?\n⑴ 급여：42,000,000원(월 3,500,000원)\n⑵ 식사대：2,400,000원(월 200,000원씩 수령, 식사는 제공받지 않음)\n⑶ 사택을 제공받아 얻은 이익：3,000,000원\n⑷ 갑이 자기차량을 업무수행에 이용하고 실제여비 대신 회사의 규정에 따라 지급받은 자가운전보조금：\n3,600,000원(12개월간 매월 300,000원씩 수령)\n⑸ 시간외 근무수당：2,000,000원\n① 4,800,000원\n② 5,400,000원\n③ 7,800,000원\n④ 9,800,000원", "answer": 3}, {"year": "2024", "month": "1", "qnum": 65, "text": "[65]다음 중 소득세법상 기타소득에 관한 설명으로 옳지 않은 것은?\n① 일시적인 문예창작소득은 기타소득으로 분류되며 증빙이 없더라도 총수입금액의 80 % 를 필요경비\n인정률로 적용받을 수 있다.\n② 서화ㆍ골동품을 박물관 또는 미술관에 양도함으로써 발생하는 소득은 비과세 기타소득이다.\n③ 복권당첨소득은 기타소득으로 분류되며 무조건 분리과세되므로 종합과세 되지 않는다.\n④ 법인세법에 따라 처분된 기타소득의 수입시기는 그 법인의 해당 사업연도의 결산확정일이다.", "answer": 1}, {"year": "2024", "month": "1", "qnum": 66, "text": "[66]근로소득자인 한가족씨(72세, 장애인인 여성)는 기본공제대상이 본인뿐이며, 보험료, 의료비, 교육비\n등의 지출액이 없어 항목별공제를 신청할 경우 공제받을 수 있는 금액은 없다. 한가족씨의 2024년 근로\n소득금액이 3천만원인 경우 최대로 받을 수 있는 인적공제액은 얼마인가?\n① 3,000,000원\n② 3,500,000원\n③ 4,000,000원\n④ 4,500,000원", "answer": 4}, {"year": "2024", "month": "1", "qnum": 67, "text": "[67]다음 중 의료비 세액공제 대상 의료비지출액에 해당하지 않는 것은?\n① 시력보정용 안경 또는 콘택트렌즈 구입을 위하여 지출한 비용(1인당 연 50만원 이내의 금액)\n② 뇌졸중환자 휠체어를 구입하기 위한 비용\n③ 건강증진을 위한 보약구입비용\n④ 보청기 구
